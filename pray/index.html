function themeNo(p){
  if(!p)return '';

// ── 색 계산 도구 ──
function _thRgb(h){h=String(h).replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function _thHex(c){return '#'+c.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
function _thMix(a,b,t){return [0,1,2].map(i=>a[i]+(b[i]-a[i])*t);}   // t=0 → a, t=1 → b
function _thLin(c){c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);}
function _thLum(c){return 0.2126*_thLin(c[0])+0.7152*_thLin(c[1])+0.0722*_thLin(c[2]);}
function _thContrast(a,b){const x=_thLum(a),y=_thLum(b);return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05);}
function _thRound(c){return [Math.round(c[0]),Math.round(c[1]),Math.round(c[2])];}
// 이 색이 놓일 수 있는 여러 면 중 **가장 안 읽히는** 쪽의 대비
function _thWorst(c,surfaces){
  let m=99;for(let i=0;i<surfaces.length;i++)m=Math.min(m,_thContrast(c,surfaces[i]));
  return m;
}
// 글자색을 배경 쪽으로 최대한 흐리게 밀되, 목표 대비는 지키는 지점을 찾는다.
// (고정 비율로 섞으면 배경이 밝은 테마에서 보조 글자가 AA 밑으로 떨어진다)
// ⚠️ 두 가지를 꼭 지켜야 한다 — 계산해 보고 알았다:
//   ① 배경(bg) 하나만 보고 맞추면 **패널 위(s1/s2)** 에서 기준이 깨진다.
//      보조 글자는 카드 안에도 올라가므로 놓일 수 있는 면을 전부 넣고 잰다.
//   ② 정수로 반올림한 **뒤의** 색으로 재야 한다. 경계값까지 이분 탐색해 놓고
//      나중에 반올림하면 4.50 이 4.49 로 떨어져 기준을 못 넘는다.
function _thFade(text,toward,surfaces,target,maxT){
  if(_thWorst(_thRound(text),surfaces)<target)return _thRound(text); // 원래 글자도 못 미치면 그대로
  let lo=0,hi=maxT;
  for(let i=0;i<16;i++){
    const mid=(lo+hi)/2;
    if(_thWorst(_thRound(_thMix(text,toward,mid)),surfaces)>=target)lo=mid; else hi=mid;
  }
  return _thRound(_thMix(text,toward,lo));
}
// 어떤 면 위에 글자를 얹을 때 흰색과 검정 중 더 잘 읽히는 쪽
function _thOn(bg){

}
function _thRgba(c,a){return 'rgba('+c.map(v=>Math.round(v)).join(',')+','+(Math.round(a*1000)/1000)+')';}
// ── 선택·활성 표시의 세기 (--ac-tint-k) ──
// 고른 버튼·켜진 버튼은 대개 강조색을 아주 옅게(알파 .12~.16) 깐 배경으로 나타낸다.
// 그런데 **같은 알파라도 강조색이 배경과 색조가 비슷하면**(크림색 위의 올리브 등)
// 눈에는 그냥 배경으로 보여 고른 것과 안 고른 것이 구분되지 않는다.
// 밝기 대비(_thContrast)로는 이 차이가 안 잡힌다 — 밝기는 거의 같고 '색'만 다르기
// 때문이다. 그래서 여기서는 사람 눈에 가까운 CIELAB 색차(ΔE)로 재고,
// 기본 테마가 내는 값(라이트 13 · 다크 15)에 못 미치면 **알파를 키운다.**
// 색을 진하게 미는 방법은 못 쓴다 — 밀다 보면 0/255 에 걸려 색조가 날아간다.
// 결과는 배수 하나(--ac-tint-k)로 내보내고 CSS 는 calc(.14*var(--ac-tint-k)) 로 쓴다.
// 테마를 안 고른 사용자는 이 값이 1 이라 예전 화면과 한 픽셀도 다르지 않다.
function _thLabF(t){return t>0.008856451679?Math.cbrt(t):(7.787037*t+16/116);}
function _thLab(c){
  const r=_thLin(c[0]),g=_thLin(c[1]),b=_thLin(c[2]);
  const X=_thLabF((0.4124*r+0.3576*g+0.1805*b)/0.95047);
  const Y=_thLabF(0.2126*r+0.7152*g+0.0722*b);
  const Z=_thLabF((0.0193*r+0.1192*g+0.9505*b)/1.08883);
  return [116*Y-16,500*(X-Y),200*(Y-Z)];
}
function _thDeltaE(a,b){
  const A=_thLab(a),B=_thLab(b);
  return Math.sqrt(Math.pow(A[0]-B[0],2)+Math.pow(A[1]-B[1],2)+Math.pow(A[2]-B[2],2));
}
// 틴트가 놓일 수 있는 여러 면 중 **가장 안 보이는** 쪽의 색차
function _thTintDE(c,alpha,surfaces){
  let m=99;
  for(let i=0;i<surfaces.length;i++)m=Math.min(m,_thDeltaE(_thMix(surfaces[i],c,Math.min(1,alpha)),surfaces[i]));
  return m;
}
// Lab → sRGB (채도를 올린 색을 다시 화면 색으로 되돌릴 때 쓴다)
function _thLabFi(t){return t>0.20689655?t*t*t:(t-16/116)/7.787037;}
function _thUnlin(c){return 255*(c<=0.0031308?12.92*c:1.055*Math.pow(c,1/2.4)-0.055);}

  const y=(L[0]+16)/116,x=y+L[1]/500,z=y-L[2]/200;
  const X=_thLabFi(x)*0.95047,Y=_thLabFi(y),Z=_thLabFi(z)*1.08883;
  return [_thUnlin( 3.2406*X-1.5372*Y-0.4986*Z),
          _thUnlin(-0.9689*X+1.8758*Y+0.0415*Z),
          _thUnlin( 0.0557*X-0.2040*Y+1.0570*Z)]

}
// ── 글자용 강조색 (--ac-tx) ──
// '켜진 항목은 강조색 글자' 로 나타내는 자리가 앱 곳곳에 있다(설정 탭·유저 모드·
// 위젯 보기·정렬 토글…). 그런데 강조색이 본문/보조 글자색과 색조가 비슷하면
// (28 윈터 블랭킷 다크: 강조 #dddbf1, 본문 #f1effa — 거의 같은 색)
// 켜진 것과 꺼진 것이 구분되지 않는다.
// 그래서 **채도를 올려**(같은 색조를 유지한 채) 글자색과 갈라 세우고,
// 그래도 모자라면 밝기를 배경 쪽이 아니라 **글자색 반대쪽**으로 조금 민다.
// ⚠️ 지금보다 안 읽히게 만들지는 않는다 — 후보의 최소 대비가 원래 강조색의
//    대비(또는 4.0) 밑으로 내려가면 버린다.
// 고르는 차례가 셋이다 (v26-0903-4, HB — 채도를 밀면 팔레트 통일성이 깨진다):
//   ① 강조색(--ac)이 이미 글자색들과 충분히 갈라져 있으면 **그대로 쓴다**
//   ② 아니면 그 테마의 **보조색(--sec)** 을 쓴다. 억지로 만든 색이 아니라
//      팔레트가 원래 가진 색이라 통일성이 안 깨진다. 읽기 어려우면 **밝기만**
//      배경 반대쪽으로 민다 — 색조·채도는 손대지 않는다.
//      ('14 올리브 가든 피스트' 라이트: 보조색이 브라운 #bc6c25 다. HB 가
//       "차라리 팔레트에 있는 브라운을 쓰라"고 짚어 준 자리다 → #ad6018)
//   ③ 보조색도 안 되면(회색이라 글자색과 겹치는 테마가 있다) 그때서야
//      예전처럼 강조색의 채도를 민다.
// 기준값 34 로 30벌을 돌리면 15벌은 ①(손 안 댐) · 7벌은 ②(팔레트 보조색) ·
// 6벌만 ③(채도 밀기)이다. 45 까지 올려 채도로만 해결하던 때는 20벌이 밀렸다.
function _thReadable(c,faces,floor){
  const con=x=>{let m=99;for(let i=0;i<faces.length;i++)m=Math.min(m,_thContrast(x,faces[i]));return m;};
  if(con(c)>=floor)return _thRound(c);
  const L=_thLab(c);
  let faceL=0;for(let i=0;i<faces.length;i++)faceL+=_thLab(faces[i])[0];
  const dir=(faceL/faces.length>L[0])?-1:1;   // 면이 밝으면 더 어둡게, 어두우면 더 밝게
  let best=_thRound(c);
  for(let d=1;d<=60;d++){
    const cand=_thLabRgb([Math.max(2,Math.min(98,L[0]+dir*d)),L[1],L[2]]);
    if(con(cand)>=floor)return cand;
    best=cand;
  }
  return best;
}
function _thAcText(ac,sec,texts,faces,target){
  const worst0=c=>{let m=99;for(let i=0;i<texts.length;i++)m=Math.min(m,_thDeltaE(c,texts[i]));return m;};
  const con0  =c=>{let m=99;for(let i=0;i<faces.length;i++)m=Math.min(m,_thContrast(c,faces[i]));return m;};
  if(worst0(ac)>=target)return _thRound(ac);           // ①
  const secFit=_thReadable(sec,faces,Math.min(4.0,con0(ac)));
  if(worst0(secFit)>=target&&worst0(secFit)>worst0(ac))return secFit;   // ②
  return _thAcPush(ac,texts,faces,target);             // ③
}
function _thAcPush(ac,texts,faces,target){
  const worst=c=>{let m=99;for(let i=0;i<texts.length;i++)m=Math.min(m,_thDeltaE(c,texts[i]));return m;};
  const con  =c=>{let m=99;for(let i=0;i<faces.length;i++)m=Math.min(m,_thContrast(c,faces[i]));return m;};
  if(worst(ac)>=target)return _thRound(ac);
  const floor=Math.min(4.0,con(ac));
  const L0=_thLab(ac);
  // 밝기를 미는 방향은 '글자색에서 멀어지는 쪽' — 글자색이 밝으면 어둡게, 그 반대면 밝게
  let txL=0;for(let i=0;i<texts.length;i++)txL+=_thLab(texts[i])[0];
  const away=(txL/texts.length>L0[0])?-1:1;
  let best=_thRound(ac),bw=worst(ac);
  for(let d=0;d<=34;d+=2){
    const dirs=(d===0)?[0]:[away,-away];
    for(let di=0;di<dirs.length;di++){
      for(let k=1;k<=3.2+1e-9;k+=0.1){
        const c=_thLabRgb([Math.max(2,Math.min(98,L0[0]+dirs[di]*d)),L0[1]*k,L0[2]*k]);
        if(con(c)<floor)continue;
        const w=worst(c);
        if(w>bw){bw=w;best=c;}
        if(w>=target)return c;
      }
    }
  }
  return best;
}
// 보조 패널(s2)이 기본 패널(s1)과 눈에 띄게 다른 최소 비율.
// 선택된 탭·줄의 표시가 이 색 하나로만 이뤄지므로(.tab.on · .keep-pick-row.on)
// 색차가 너무 작으면 무엇을 골랐는지 알 수 없다.
function _thPanelMix(sf,tx,base,target,maxR){
  let r=base;
  if(_thDeltaE(_thRound(_thMix(sf,tx,r)),sf)>=target)return r;
  while(r<maxR){r+=0.005;if(_thDeltaE(_thRound(_thMix(sf,tx,r)),sf)>=target)break;}
  return Math.min(r,maxR);
}
// 기준 색차를 넘길 때까지 알파에 곱할 배수를 찾는다 (1 ~ maxK)
function _thTintK(ac,alpha,surfaces,target,maxK){
  if(_thTintDE(ac,alpha,surfaces)>=target)return 1;
  if(_thTintDE(ac,alpha*maxK,surfaces)<target)return maxK;
  let lo=1,hi=maxK;
  for(let i=0;i<14;i++){
    const mid=(lo+hi)/2;
    if(_thTintDE(ac,alpha*mid,surfaces)>=target)hi=mid; else lo=mid;
  }
  return hi;
}
// 다섯 색 → 앱이 쓰는 토큰 전부
function _themeTokens(preset,mode){
  const p=(mode==='light')?preset.light:preset.dark;
  const isDark=(mode!=='light');
  const bg=_thRgb(p[0]),sf=_thRgb(p[1]),tx=_thRgb(p[2]),ac=_thRgb(p[3]),sec=_thRgb(p[4]);
  // 보조 패널 — 기본 패널에서 글자색 쪽으로 아주 조금.
  // 다만 선택된 탭·줄은 이 색 하나로만 표시되므로 최소 색차(6)는 지킨다.
  const s2=_thRound(_thMix(sf,tx,_thPanelMix(sf,tx,isDark?0.10:0.07,6.0,0.20)));
  // 글자가 놓일 수 있는 세 면. 이 중 가장 안 읽히는 쪽을 기준으로 맞춘다.
  const faces=[bg,sf,s2];
  // 보조·비활성 글자: 배경 쪽으로 흐리게 하되 AA(4.5) / 3:1 은 지킨다
  const tx2=_thFade(tx,bg,faces,4.5,0.62);
  const tx3=_thFade(tx,bg,faces,3.0,0.82);
  // 경계선 — 글자색을 배경에 거의 녹인 것. 강한 경계선은 3:1 을 지켜
  // 패널과 배경이 거의 같은 색인 테마에서도 카드 윤곽이 보이게 한다.
  const bd =_thRound(_thMix(tx,bg,isDark?0.80:0.84));
  const bd2=_thFade(tx,bg,[bg,sf],3.0,0.72);
  const onAc=_thOn(ac);
  // 선택·활성 틴트의 세기. 기준 알파(.14 라이트 / .16 다크)에서 재고,
  // 그 결과 배수를 CSS 의 모든 틴트 알파에 똑같이 곱한다.
  // 소수 둘째 자리에서 **올림** — 내림하면 방금 맞춘 기준을 한 끗 차이로 놓친다
  const tintK=Math.min(2.4,Math.ceil(_thTintK(ac,isDark?0.16:0.14,faces,isDark?15:13,2.4)*100)/100);
  // 글자로 쓰는 강조색. 글자색들과 ΔE 34 이상 벌어지게 고른다 (_thAcText 주석 참고).
  const acTx=_thAcText(ac,sec,[tx,tx2,tx3],faces,34);
  // 위험색·주의색은 팔레트가 아니라 **공통 의미색**이다(빨강은 빨강, 주황은 주황).
  // 다만 그 테마 배경에서 읽혀야 하므로 기준을 넘을 때까지 밝기만 민다.
  let danger=isDark?[255,138,133]:[196,43,33];
  for(let i=0;i<40&&_thWorst(_thRound(danger),faces)<4.5;i++){
    danger=_thMix(danger,isDark?[255,255,255]:[0,0,0],0.05);
  }
  danger=_thRound(danger);
  let warn=isDark?[240,176,72]:[176,104,16];
  for(let i=0;i<40&&_thWorst(_thRound(warn),faces)<4.5;i++){
    warn=_thMix(warn,isDark?[255,255,255]:[0,0,0],0.05);
  }
  warn=_thRound(warn);
  const hx=_thHex;
  return {
    '--bg':hx(bg),'--s1':hx(sf),'--s2':hx(s2),
    '--tx':hx(tx),'--tx2':hx(tx2),'--tx3':hx(tx3),
    '--bd':hx(bd),'--bd2':hx(bd2),
    '--ac':hx(ac),'--ac-rgb':ac.map(v=>Math.round(v)).join(','),
    '--ac-tx':hx(acTx),
    '--on-accent':hx(onAc),
    '--ac-soft':_thRgba(ac,Math.min(0.5,(isDark?0.20:0.14)*tintK)),
    '--ac-tint-k':String(tintK),
    '--sec':hx(sec),'--sec-rgb':sec.map(v=>Math.round(v)).join(','),
    '--chip-bg':_thRgba(sec,isDark?0.22:0.16),
    '--tab-on-bg':hx(_thMix(sf,ac,Math.min(0.5,(isDark?0.22:0.14)*tintK))),
    '--focus-ring':_thRgba(ac,0.55),
    '--shadow-color':isDark?'rgba(0,0,0,.55)':'rgba(0,0,0,.16)',
    '--header-bg':_thRgba(sf,0.94),
    '--drag-ghost-bg':_thRgba(s2,0.88),
    '--danger':hx(danger),'--del':hx(danger),'--ov':hx(danger),
    '--so':hx(warn),
    '--sun-red':hx(_thFade(danger,bg,faces,3.0,0.40)),
    '--today-cell-border':_thRgba(ac,0.85),
    '--today-cell-border-faded':_thRgba(ac,0.18),
    '--fade-start-border':hx(bd),
    '--bgd':hx(_thMix(danger,bg,isDark?0.55:0.30)),
    '--bgd-tx':hx(_thFade(danger,bg,faces,4.5,0.20)),
    '--theme-color':hx(bg)
  };
}

// 받은 DB 를 지금 모양으로 맞춘다 — 빠진 칸은 채우고 모르는 값은 버린다.
function normDB(x) {
  const d = emptyDB();
  if (!x || typeof x !== 'object') return d;
  ['cats', 'subs', 'T', 'G', 'snaps', 'todo'].forEach(k => { if (Array.isArray(x[k])) d[k] = x[k]; });
  if (x.log && typeof x.log === 'object') d.log = x.log;
  if (x.marks && typeof x.marks === 'object') MARKS.forEach(m => { if (!MARK_FIXED[m]) d.marks[m] = String(x.marks[m] || ''); });
  d.markLinks = {};
  if (x.markLinks && typeof x.markLinks === 'object') MARKS.forEach(m => {
    const k = x.markLinks[m];
    if (!MARK_FIXED[m] && k && ['cat', 'sub', 'group'].indexOf(k.t) >= 0 && typeof k.id === 'string' && k.id) d.markLinks[m] = { t: k.t, id: k.id };
  });
  if (x.set && typeof x.set === 'object') Object.assign(d.set, x.set);
  if (!Array.isArray(d.set.iv) || d.set.iv.length !== 6) d.set.iv = IV_DEFAULT.slice();
  ['sorts', 'ranks', 'folds'].forEach(k => { if (!d.set[k] || typeof d.set[k] !== 'object') d.set[k] = {}; });
  d.rev = Number(x.rev) || 0;

    const n = Object.assign(newGroup('', ''), g); n.kind = 'group';
    n.lines = (Array.isArray(g.lines) ? g.lines : []).map(normLine);
    n.also = Array.isArray(g.also) ? g.also.filter(x => typeof x === 'string' && x && x !== n.parent) : [];
    return n;
  });

  const topIds = new Set(d.G.filter(g => !g.parent).map(g => g.id));
  d.G.forEach(g => { g.also = g.parent ? [...new Set(g.also.filter(x => topIds.has(x)))] : []; });
  [...d.T, ...d.G].forEach(t => {

// ── 가져오기 ②: 기도 지도 (24-0303 모양) ──
// 서식(색)이 빠진 칸 배치만으로 '무엇이 묶음 제목인가' 를 다 알 수는 없다 → 읽은 대로

// 확인받은 덩어리로 묶음을 짓는다. db 에 바로 넣는다(사람은 이름이 같으면 같은 사람).

  let color = 0;
  sorted.filter(b => b.kind === 'group').forEach(b => {
    const g = newGroup(b.cells[0], GROUP_COLORS[color++ % GROUP_COLORS.length]);
    G.push(g); heads.push({ g: g, col: b.col, row: b.row, end: Infinity });

  });

  // 이름 줄 덩어리는 그 작은 묶음의 것이다.
  let openSub = null;

    const owner = ownerOf(b);

      b.cells.forEach(txt => { const l = parseLineText(db, txt); if (l) openSub.g.lines.push(l); });
      return;
    }
    openSub = null;
    if (b.kind === 'sub') {
      const f = b.cells[0];
      const dt = splitDaytime(f);
      const sg = newGroup(dt ? dt.head : f, owner.color);
      sg.parent = owner.id;
      if (dt) {
        sg.days = [dt.day]; sg.time = dt.time;
        const lead = parseLineText(db, dt.head);
        if (lead && lead.segs.length) { linePids(lead).forEach(p => { lead.r[p] = '인도'; }); sg.lines.push(lead); }

      b.cells.slice(1).forEach(txt => { const l = parseLineText(db, txt); if (l) sg.lines.push(l); });
      G.push(sg);
      if (b.cells.length === 1) openSub = { g: sg, col: b.col, row: b.row, owner: owner };
    } else {
      b.cells.forEach(txt => { const l = parseLineText(db, txt); if (l) owner.lines.push(l); });
    }
  });
  return G;
}

  --tab-on-bg:#e8e2d6; --danger:#c42b21; --shadow-color:rgba(0,0,0,.14); --header-bg:rgba(246,243,236,.88);
  --ans:#6a4fb3;
  --mk-red:#d6373a; --mk-orange:#d4731a; --mk-yellow:#a88406; --mk-green:#2f9a55;
  --mk-blue:#2d6ad1; --mk-purple:#7a4fd4; --mk-pink:#c4428f; --mk-gray:#8b9099;
}
/* 긴급도(산호) · 중요도(청록) 칸 — 0 이 가장 진하다 */
.u0{background:#f08a6e;color:#2a120b}.u1{background:#d97a62;color:#2a120b}.u2{background:#b5654f;color:#fff3ee}
.u3{background:#7d4a3d;color:#fbe3da}.u4{background:#4f3530;color:#e9cfc6}.u5{background:#2c2422;color:#b9a59f}
.i0{background:#74c7b4;color:#0b231d}.i1{background:#5fae9c;color:#0b231d}.i2{background:#3f8676;color:#f0fffb}
.i3{background:#2c5d53;color:#d9f3ec}.i4{background:#223f39;color:#c7e3dc}.i5{background:#1b2725;color:#9fb8b2}
.uX,.iX{background:var(--s2);color:var(--tx3)}
html[data-mode="light"] .u0{background:#d9573a;color:#fff}html[data-mode="light"] .u1{background:#e27a60;color:#fff}
html[data-mode="light"] .u2{background:#eda08b;color:#3b150b}html[data-mode="light"] .u3{background:#f5c4b6;color:#3b150b}
html[data-mode="light"] .u4{background:#f9ddd4;color:#5a2a1e}html[data-mode="light"] .u5{background:#fbeee9;color:#7a4a3e}
html[data-mode="light"] .i0{background:#1f8a72;color:#fff}html[data-mode="light"] .i1{background:#3fa58c;color:#fff}
html[data-mode="light"] .i2{background:#79c4b1;color:#0b2a22}html[data-mode="light"] .i3{background:#a9dacd;color:#0b2a22}
html[data-mode="light"] .i4{background:#cfeae3;color:#1f4a40}html[data-mode="light"] .i5{background:#e7f4f0;color:#3f6a60}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);overscroll-behavior:none}
body{font-family:var(--font);font-size:15px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;transition:background .3s,color .3s}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:center}
.opt,.set-r,.bar,.sec-h,.throw,.rb,.tag,.pn{text-align:left}
input,textarea,select{font:inherit;color:var(--tx)}
svg{display:block;flex-shrink:0}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#app{position:fixed;inset:0;max-width:1240px;margin:0 auto;overflow:hidden}
/* PC 에서는 지도만 넓게 쓰고(기도 계획을 세우는 큰 판), 나머지 화면은 읽기 좋은 폭으로 */
.view:not(#v-map){padding-left:max(0px,calc((100% - 760px) / 2));padding-right:max(0px,calc((100% - 760px) / 2))}
#tabbar{padding-left:max(8px,calc((100% - 760px) / 2));padding-right:max(8px,calc((100% - 760px) / 2))}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--sat) + 8px) 0 calc(var(--sab) + 96px);display:none}
.view.on{display:block;animation:vin .28s var(--ease)}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── 머리 ── */
.vh{padding:10px 20px 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.vh h1{margin:0;font-size:30px;font-weight:250;letter-spacing:-.015em;line-height:1.2}
.vh .sub{font-size:13px;color:var(--tx2);letter-spacing:.01em}
.vh-acts{display:flex;align-items:center;margin-right:-10px}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--tx2);border-radius:22px;transition:background .15s,color .15s}
.ib:active{background:var(--s2)}
.ib.on{color:var(--ac-tx)}
.vh h1.br{display:flex;align-items:baseline;gap:10px;white-space:nowrap;min-width:0}
.vh h1.br b{font-family:'Cormorant Garamond','Noto Serif KR',Georgia,'Times New Roman',serif;font-weight:500;font-size:30px;letter-spacing:.16em;line-height:1.15;color:var(--tx)}
.vh h1.br span{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:15px;font-weight:500;letter-spacing:.06em;color:var(--tx3)}
.vh{flex-wrap:wrap-reverse}
.vh-acts{margin-left:auto}
@media (max-width:600px){.vh h1.br b{font-size:26px;letter-spacing:.13em}.ib{width:40px}}
.mk-fold{display:none!important}
.mkico{width:26px;height:16px;display:block;opacity:.8;transition:opacity .15s}
.mk-fold.on .mkico{opacity:1}
@media (max-width:600px){
  .mk-fold{display:flex!important}
  .chips.mk-chips{display:none}
  .chips.mk-chips.open{display:flex}
}
.date-l{padding:0 20px;font-size:13px;color:var(--tx2);letter-spacing:.02em}
.prog{margin:12px 20px 0;height:2px;background:var(--s2);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ac);border-radius:2px;transition:width .5s var(--ease)}
.cta{margin:16px 20px 4px;height:50px;border-radius:25px;background:var(--ac);color:var(--on-accent);font-weight:600;font-size:15px;
  display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 40px);transition:transform .12s,filter .2s;
  box-shadow:0 6px 24px -10px rgba(var(--ac-rgb),.55)}
.cta:active{transform:scale(.98)}
.cta .ico{stroke-width:1.9}
.ghost{height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--bd2);color:var(--tx);font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ghost:active{background:var(--s2)}
.ghost.ac{border-color:var(--ac);color:var(--ac-tx)}
.ghost.full{width:100%}

/* ── 칸(섹션) ── */
.sec-h{width:100%;display:flex;align-items:center;gap:8px;padding:22px 18px 8px;color:var(--tx2)}
.sec-h .chev{transition:transform .25s var(--ease);width:14px;height:14px;stroke-width:2}
.sec-h.fold .chev{transform:rotate(-90deg)}
.sec-h b{font-size:13px;font-weight:600;color:var(--ac-tx);letter-spacing:.04em}
.sec-h b.red{color:var(--mk-red)}
.sec-h small{font-size:12px;color:var(--tx3)}
.sec-h em{margin-left:auto;font-style:normal;font-size:12px;color:var(--tx3)}
.label{padding:22px 20px 8px;font-size:12.5px;font-weight:600;color:var(--ac-tx);letter-spacing:.05em;display:flex;align-items:center;gap:8px}
.label small{font-weight:400;color:var(--tx3);letter-spacing:0}
.label .r{margin-left:auto}
.hint{padding:6px 20px 0;font-size:12.5px;color:var(--tx3);line-height:1.6}

/* ── 줄 (스와이프 · 끌기 공통) ── */
.rows{position:relative}
.row{position:relative;overflow:hidden;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.row-f{position:relative;z-index:1;display:flex;align-items:center;gap:6px;min-height:56px;padding:0 14px 0 8px;
  background:var(--bg);border-bottom:1px solid var(--bd);transition:transform .28s var(--ease),background .2s}
.row.swiping .row-f,.row.lifted .row-f{transition:none}
.sw-acts{position:absolute;inset:0 0 1px auto;display:flex;align-items:stretch;justify-content:flex-end}
.sw-act{min-width:84px;padding:0 14px;font-size:14px;font-weight:600;color:#fff;display:flex;align-items:center;justify-content:center}
.sw-act.del{background:var(--danger)}
.sw-act.later{background:#6f6b64}
.sw-act.ac{background:var(--ac);color:var(--on-accent)}
html[data-mode="light"] .sw-act.del{color:#fff}
.row.lifted{z-index:20;overflow:visible}
.row.lifted .row-f{background:var(--s1);border-radius:12px;border-bottom-color:transparent;
  box-shadow:0 18px 40px -12px var(--shadow-color),0 0 0 1px var(--bd2);transform:scale(1.025)}
.row.shift{transition:transform .2s var(--ease)}
.row.gone{transition:height .26s var(--ease),opacity .2s;opacity:0}
body.dragging,body.dragging *{cursor:grabbing!important}
.chk{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.chk i{width:24px;height:24px;border-radius:12px;border:1.5px solid var(--bd2);display:flex;align-items:center;justify-content:center;
  transition:background .22s var(--ease),border-color .22s,transform .22s var(--ease)}
.chk i svg{width:14px;height:14px;stroke:var(--on-accent);stroke-width:2.4;fill:none;opacity:0;transform:scale(.4);transition:opacity .18s,transform .25s var(--ease)}
.row.done .chk i,.row.checking .chk i{background:var(--ac);border-color:var(--ac)}
.row.done .chk i svg,.row.checking .chk i svg{opacity:1;transform:none}
.row.checking .chk i{transform:scale(1.12)}
.row.done .rb{opacity:.45}
.rb{flex:1;min-width:0;padding:9px 0;cursor:pointer}
.rt{display:flex;align-items:center;gap:7px;min-width:0}
.rt .nm{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt .nm.rest{color:var(--tx3)}
.mk{width:7px;height:7px;border-radius:4px;flex-shrink:0;background:var(--m)}
.late{font-size:11px;color:var(--mk-orange);flex-shrink:0}
.rm{font-size:12.5px;color:var(--tx2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows.tdy .rm,.rows.tdy .rmem{color:var(--tx3)}
.rows.nonote .rm,.rows.nonote .rmem{display:none}
button.pl{cursor:pointer}
.rmem{font-size:12.5px;color:var(--tx2);margin-top:3px;line-height:1.55;opacity:.9}
.pills{display:flex;gap:4px;flex-shrink:0}
.pl{min-width:22px;height:20px;border-radius:6px;font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 5px}
button.pl{min-width:34px;height:30px;border-radius:8px;font-size:14px}
.bar{width:100%;min-height:44px;padding:0 20px 0 60px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2);border-bottom:1px solid var(--bd)}
.bar:active{background:var(--s1)}
.bar .chev{width:12px;height:12px;stroke-width:2;transition:transform .25s var(--ease)}
.bar.open .chev{transform:rotate(90deg)}
.grip{width:28px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--tx3);flex-shrink:0;margin-right:-6px}

/* ── 빈 화면 · 카드 ── */
.empty{margin:28px 20px;padding:28px 22px;border-radius:18px;background:var(--s1);text-align:center}
.empty h3{margin:10px 0 6px;font-weight:400;font-size:18px}
.empty p{margin:0 0 18px;color:var(--tx2);font-size:13.5px;line-height:1.7}
.empty .btns{display:flex;flex-direction:column;gap:10px}
.doneall{margin:24px 20px 0;padding:18px;border-radius:16px;background:var(--ac-soft);color:var(--ac-tx);text-align:center;font-size:14px}
.legend{padding:22px 20px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--tx3)}

/* ── 아래 탭 ── */
#tabbar{position:absolute;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px 8px calc(var(--sab) + 6px);background:var(--header-bg);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--bd)}
.tb{height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--tx3);transition:color .2s}
.tb .ico{width:22px;height:22px}
.tb.on{color:var(--ac-tx)}
/* iOS 26 홈 화면 앱: 웹 화면 아래에 iOS 몫 띠(--gapb)가 붙는다 (HB 2026-10-12, 세 번 고친 끝에)
   ① 띠 색: html 바탕도 theme-color 도 띠를 못 바꿨다 → iOS 가 페이지 맨 아래의 색을 떠서 띠를 칠하는 것으로 본다.
      메뉴가 반투명(블러)이면 그 밑 페이지 바탕을 떠 간다 → 이때만 메뉴를 **불투명한 메뉴색**으로, body 바탕도 메뉴색으로
      (화면 안 바탕은 #app 이 칠한다).
   ② 여백: 위아래를 맞추려 위 여백을 띠만큼 늘렸던 것을 되돌려 **카톡처럼** 위는 얇게 — 띠가 홈 막대 자리로 아래 여백이 된다. */
.iosgap #tabbar{padding-top:6px;padding-bottom:0;background:var(--tabsolid,var(--header-bg));-webkit-backdrop-filter:none;backdrop-filter:none}
.iosgap body{background:var(--tabsolid,var(--bg))}
.iosgap #app{background:var(--bg)}
.iosgap #toast{bottom:72px}
.iosgap .lfoot{padding-bottom:6px;background:var(--tabsolid,var(--header-bg));-webkit-backdrop-filter:none;backdrop-filter:none}
.iosgap .sheet{padding-bottom:6px}
/* 오른쪽 아래 구석의 버전 — 누르면 새 버전을 찾아 받는다 */
#verBtn{position:absolute;right:4px;top:2px;padding:2px 5px;font-size:9px;line-height:1.2;color:var(--tx3);opacity:.7;letter-spacing:.01em;font-variant-numeric:tabular-nums}
#verBtn.busy{opacity:.35}

/* ── 칩 · 고르기 ── */
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 20px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--bd2);font-size:13px;color:var(--tx2);
  display:inline-flex;align-items:center;gap:6px;transition:background .18s,color .18s,border-color .18s}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--on-accent)}
.chip .n{opacity:.7;font-size:12px}
.chip .dot{width:8px;height:8px;border-radius:4px;background:var(--m)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--s1);border-radius:11px;padding:3px;margin:8px 20px 4px;gap:2px}
.seg button{height:34px;border-radius:8px;font-size:13px;color:var(--tx2);transition:background .2s,color .2s}
.seg button.on{background:var(--tab-on-bg);color:var(--tx)}
.sorts{display:flex;align-items:center;gap:2px;padding:2px 14px 4px;overflow-x:auto;scrollbar-width:none}
.sorts::-webkit-scrollbar{display:none}
.sorts span{font-size:12px;color:var(--tx3);padding:0 6px}
.sorts button{flex-shrink:0;height:36px;padding:0 9px;font-size:13px;color:var(--tx2)}
.sorts button.on{color:var(--ac-tx);font-weight:600}
.lh{display:flex;align-items:center;padding:6px 16px;font-size:11.5px;color:var(--tx3);border-bottom:1px solid var(--bd)}
.lh .f{flex:1}

/* ── 지도 ── */
.maptitle{padding:0 20px;font-size:11px;font-weight:700;letter-spacing:.09em;color:var(--tx3);text-transform:uppercase}
.masonry{column-count:2;column-gap:10px;padding:8px 14px 0}
@media (min-width:600px){.masonry{column-count:3}}
@media (min-width:980px){.masonry{column-count:4}}
.gcard{break-inside:avoid;margin:0 0 10px;background:var(--s1);border-radius:12px;overflow:hidden;display:block;width:100%}
.gh{width:100%;display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--gc);color:#fff;font-size:calc(13px * var(--mz,1));font-weight:600;letter-spacing:.02em}
.gh .cnt{margin-left:auto;font-weight:400;opacity:.8;font-size:calc(12px * var(--mz,1))}
.gb{padding:4px 8px 8px}
.sgh{width:100%;margin-top:7px;padding:3px 8px;border-radius:6px;font-size:calc(12px * var(--mz,1));font-weight:600;display:flex;gap:6px;align-items:center;
  background:color-mix(in srgb,var(--sc,var(--gc)) 45%,var(--s1));color:var(--tx)}
.sgh .dt{font-weight:500;color:var(--ac-tx);font-size:calc(11.5px * var(--mz,1))}
.ln{display:flex;flex-wrap:wrap;gap:1px 6px;padding:3px 2px;font-size:calc(13.5px * var(--mz,1));line-height:1.5}
.ln.note{font-size:calc(12px * var(--mz,1));color:var(--tx3)}
.ln.flow{gap:1px 9px}
.ln .sep{color:var(--tx3)}
.pn{color:var(--pc,var(--tx));padding:0;border-radius:4px;transition:background .15s}
.pn:active{background:var(--s2)}
.pn.rest{color:var(--tx3)}
.pn.lead{font-weight:650;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.pn.dim{opacity:.18}
.pn.hit{background:var(--ac-soft);box-shadow:0 0 0 2px var(--ac-soft)}
.pn .role{color:var(--tx3);font-size:calc(12px * var(--mz,1));margin-right:3px}
.ghw,.sghw{position:relative;display:flex;align-items:stretch}
.ghw{background:var(--gc)}
.ghw .gh{flex:1}
.sghw{margin-top:7px}.sghw .sgh{margin-top:0;flex:1}
.madd{flex-shrink:0;width:34px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:300;line-height:1;color:var(--tx3);border-radius:6px;transition:opacity .2s,background .15s}
.madd svg{width:13.5px;height:13.5px}
.madd.on-gh{color:rgba(255,255,255,.85)}
.madd:active{background:rgba(127,127,127,.2)}
.madd-group{min-height:52px;font-size:calc(13px * var(--mz,1));color:var(--tx3);border:1px dashed var(--bd2);background:transparent;transition:opacity .2s}
/* 카드 맨 아래 줄 입력 칸 — 줄이 하나 더 있을 자리처럼 */
.addw{padding:1px 2px 0}
.addin{width:100%;border:0;outline:none;background:transparent;color:var(--tx);font:inherit;font-size:calc(13.5px * var(--mz,1));line-height:1.5;padding:3px 0;caret-color:var(--ac)}
.addin::placeholder{color:var(--tx3);opacity:.7}
/* 구분 칩 — 입력 칸 바로 밑 한 줄, 넘치면 옆으로 민다 */
.achips{display:flex;gap:5px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.achips::-webkit-scrollbar{display:none}
.achips[hidden]{display:none}
.achip{flex-shrink:0;padding:3px 9px;border-radius:999px;font-size:12px;line-height:1.5;color:var(--tx2);background:color-mix(in srgb,var(--tx) 7%,transparent);white-space:nowrap}
.achip.on{background:var(--ac);color:var(--on-accent);font-weight:600}
.achip.kb{box-shadow:0 0 0 2px var(--tx)}
.achip.new{color:var(--ac-tx);background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 40%,transparent)}
@media (any-hover:hover) and (any-pointer:fine){
  body:not(.tch) .gcard .madd,body:not(.tch) .gcard .addin:placeholder-shown:not(:focus){opacity:0}
  body:not(.tch) .gcard:hover .madd,body:not(.tch) .gcard:hover .addin:placeholder-shown,.madd:focus-visible{opacity:1}
  body:not(.tch) .madd-group{opacity:.35}body:not(.tch) .madd-group:hover{opacity:1}
}
.gh.sel,.sgh.sel{box-shadow:inset 0 0 0 2px var(--tx)}
/* 그룹 머리를 고르면 테두리는 머리 줄 **전체**(오른쪽 서브 그룹 단추까지)에 · 카드의 둥근 위 모서리를 따라 (HB 2026-10-13) */
.gh.sel{border-radius:12px 12px 0 0}
.ghw:has(>.gh.sel)::after{content:'';position:absolute;inset:0;border-radius:12px 12px 0 0;box-shadow:inset 0 0 0 2px var(--tx);pointer-events:none;z-index:2}
.ghw>.gh.sel{box-shadow:none}
/* 테두리는 안쪽에 — 바깥에 두면 위아래 서브 그룹 띠가 덮어 가렸다 (HB 2026-10-11) */
.ln.sel{background:var(--ac-soft);border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--ac);position:relative;z-index:1}
/* 휴대폰에서는 고른 테두리를 안 보인다 (PC 키보드용) */
/* ⚠️ 머리(띠)의 바탕은 건드리지 않는다 — 예전엔 고른 작은 묶음의 띠가 통째로 비어 '색이 오락가락' 했다 (HB 2026-10-11) */
.tch #v-map .sel{box-shadow:none}
.tch #v-map .ln.sel{background:transparent}
.ln.ined{padding:2px}
/* 고치는 칸 — 구멍처럼 까맣게 뚫지 않고 그 띠의 색을 그대로 */
.mapin{width:100%;min-width:0;border:0;outline:none;background:transparent;color:inherit;border-radius:0;padding:0 0 1px;font:inherit;caret-color:currentColor;box-shadow:inset 0 -1px 0 color-mix(in srgb,currentColor 35%,transparent)}
.mapin::placeholder{color:currentColor;opacity:.45}
.gh .mapin,.sgh .mapin{font-weight:600}
.gh.ined{background:var(--gc)}
.ln.ined{padding:3px 2px}
.lk{display:inline-flex;align-items:center;color:var(--tx3);margin-left:2px}
.lk .ico{width:12px;height:12px}
.gh .lk,.sgh .lk{color:inherit;opacity:.7}
/* 끌기 */
#v-map .gcard{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#v-map .gcard input{-webkit-user-select:text;user-select:text}
.md-lift{transform:scale(1.03);box-shadow:0 8px 24px rgba(0,0,0,.28);border-radius:8px;transition:transform .18s var(--ease),box-shadow .18s;position:relative;z-index:2;background:var(--s2)}
.gcard.md-lift{background:var(--s1)}
/* 잡은 항목 — 카드 밖으로 꺼내 손가락을 따라 떠서 움직인다 (Sweeter 방식 · 원근은 살짝 키우고 기울이고 그림자로) */
.md-drag{pointer-events:none;border-radius:10px;background:var(--s2);box-shadow:0 18px 40px -10px rgba(0,0,0,.55),0 4px 12px rgba(0,0,0,.25);will-change:transform}
.ln.md-drag{padding:4px 8px}
.gcard.md-drag,.sgb.md-drag{background:var(--s1)}
.sgb.md-drag{padding:0 8px 6px}
.md-landing{box-shadow:0 2px 6px rgba(0,0,0,.15)}
/* ⌥ 끌기 = 연동 — Finder 처럼 '+' 표시 */
.md-copy::after{content:'+';position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:10px;background:var(--ac);color:var(--on-accent);font-size:15px;font-weight:600;line-height:20px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
/* 놓일 자리(구멍) — 불이 들어온 빈칸 */
.md-ph{border-radius:8px;background:color-mix(in srgb,var(--ac) 12%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ac) 45%,transparent)}
.md-ph-group{border-radius:12px;margin:0 0 10px}
.md-ph-sub{margin-top:7px}
/* 지도 세로 단 — JS 가 카드를 가장 짧은 단에 쌓는다 (끌 때 깜빡이지 않게) */
.masonry.mjs{column-count:auto;display:flex;gap:10px;align-items:flex-start}
.mcol{flex:1;min-width:0}
.kbhint{display:block;width:calc(100% - 28px);margin:2px 14px 4px;padding:7px 10px;border-radius:10px;background:var(--s1);color:var(--tx3);font-size:11.5px;line-height:1.8;text-align:left}
.kbhint b{color:var(--tx2);font-weight:600;margin:0 2px 0 6px}
.kbhint u{color:var(--ac-tx);text-decoration:none;margin-left:4px}
.kbtable .opt{min-height:44px;font-size:14px}
.lfoot{flex-shrink:0;display:flex;gap:10px;padding:10px 20px calc(var(--sab) + 12px);border-top:1px solid var(--bd);background:var(--header-bg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.lfoot .ghost{flex:1;height:48px;border-radius:24px}
.lfoot .cta{flex:2;margin:0;height:48px}
.search{margin:8px 20px 2px;display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:12px;background:var(--s1);color:var(--tx3)}
.search input{flex:1;border:0;background:transparent;outline:none;font-size:15px}

/* ── 겹 화면(전체화면) ── */
#layers{position:absolute;inset:0;pointer-events:none;z-index:40;transition:background .3s}
@media (min-width:800px){#layers.has{background:rgba(0,0,0,.45);pointer-events:auto;cursor:default}}
/* ⚠️ z-index 를 꼭 둔다 — 없으면 transform 이 풀린 뒤 아래 겹의 줄(.row-f, z-index:1)이 위 겹을 뚫고 보인다 */
.layer{position:absolute;top:0;bottom:0;left:max(0px,calc((100% - 760px) / 2));right:max(0px,calc((100% - 760px) / 2));z-index:1;isolation:isolate;background:var(--bg);pointer-events:auto;display:flex;flex-direction:column;
  transform:translateX(104%);transition:transform .34s var(--ease);box-shadow:-20px 0 40px -20px var(--shadow-color)}
.layer.in{transform:none}
.layer.out{transform:translateX(104%)}
.layer.edge{transition:none}
.lhead{flex-shrink:0;display:flex;align-items:center;height:52px;margin-top:var(--sat);padding:0 6px;position:relative}
.lh-title{position:absolute;left:56px;right:56px;text-align:center;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.lh-x{margin-left:auto}
.lh-x .ico{width:18px;height:18px;stroke-width:1.8}
.lbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--sab) + 40px)}
.hero{padding:6px 20px 4px}
.hero-name{width:100%;border:0;background:transparent;outline:none;font-family:var(--serif);font-size:32px;font-weight:400;letter-spacing:-.01em;padding:4px 0;border-bottom:1px solid transparent;transition:border-color .2s}
.hero-name:focus{border-bottom-color:var(--bd2)}
.hero-sub{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{height:30px;padding:0 12px;border-radius:15px;font-size:12.5px;display:inline-flex;align-items:center;gap:5px;background:var(--s1);color:var(--tx2);border:1px solid var(--bd)}
.tag.g{background:var(--gc);color:#fff;border-color:transparent}
.tag.add{border-style:dashed}
.marks{display:flex;gap:2px;padding:4px 14px 0}
.mkb{width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.mkb i{width:20px;height:20px;border-radius:10px;background:var(--m);transition:transform .2s var(--ease),box-shadow .2s}
.mkb.on i{transform:scale(1.08);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--m)}
.nums{display:flex;align-items:center;gap:6px;padding:6px 20px}
.nums .k{width:52px;font-size:13px;color:var(--tx2)}
.nb{width:38px;height:38px;border-radius:10px;border:1px solid var(--bd2);font-size:14px;color:var(--tx2);transition:transform .15s}
.nb:active{transform:scale(.94)}
.nb.on{border-color:transparent}
.days{display:flex;gap:5px;padding:6px 20px;align-items:center;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.dy-all{margin-left:auto;padding:6px 4px 6px 10px;font-size:12px;color:var(--tx3);letter-spacing:.02em}
.dy-all.on{color:var(--ac-tx);font-weight:600}
.tp-in{width:100%;border:0;outline:none;background:transparent;color:var(--tx);font:inherit;padding:0;box-shadow:inset 0 -1px 0 var(--ac)}
.dy{width:38px;height:38px;border-radius:19px;border:1px solid var(--bd2);font-size:13px;color:var(--tx2);transition:background .18s,color .18s}
.dy.on{background:var(--ac);border-color:var(--ac);color:var(--on-accent)}
.field{margin:6px 20px 0;width:calc(100% - 40px);min-height:46px;border:1px solid var(--bd);border-radius:12px;background:var(--s1);padding:11px 13px;font-size:15px;outline:none;resize:none;transition:border-color .2s;display:block}
.field:focus{border-color:var(--ac)}
textarea.field{min-height:72px;line-height:1.6}
.addline{display:flex;align-items:center;gap:8px;margin:8px 20px 0;padding:0 6px 0 14px;border-radius:12px;border:1px dashed var(--bd2);min-height:46px}
.addline input{flex:1;border:0;background:transparent;outline:none;font-size:15px;min-width:0}
.addline .ib{width:38px;height:38px}
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;padding:8px 20px 0}
.strip i{height:16px;border-radius:4px;background:var(--s2)}
.strip i.on{background:var(--ac)}
.tp .rb{padding:12px 0}
.tp .nm{white-space:normal}
.tp.ans .nm{color:var(--ans)}
.tp .ansd{font-size:12px;color:var(--ans);flex-shrink:0}
.tcircle{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.tcircle i{width:20px;height:20px;border-radius:10px;border:1.5px solid var(--bd2);display:flex;align-items:center;justify-content:center;transition:all .2s var(--ease)}
.tp.ans .tcircle i{background:var(--ans);border-color:var(--ans)}
.tcircle svg{width:12px;height:12px;stroke:var(--bg);stroke-width:2.6;fill:none;opacity:0}
.tp.ans .tcircle svg{opacity:1}
.chips2{display:flex;flex-wrap:wrap;gap:6px;padding:4px 20px}
.lnrow .rb{padding:10px 0}
.lnrow .ln{padding:0;font-size:15px}
.dot16{width:14px;height:14px;border-radius:7px;background:var(--gc);flex-shrink:0;margin:0 6px 0 8px}

/* 설정 목록 */
.set-g{margin:8px 16px 0;border-radius:14px;background:var(--s1);overflow:hidden}
.set-r[hidden]{display:none}
.set-r{width:100%;min-height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--bd);font-size:15px}
.set-r:last-child{border-bottom:0}
.set-r .v{margin-left:auto;color:var(--tx2);font-size:14px;display:flex;align-items:center;gap:6px}
.set-r .v .ico{width:16px;height:16px}
.set-r.danger{color:var(--danger)}
.step{display:flex;align-items:center;gap:4px;margin-left:auto}
.step button{width:34px;height:34px;border-radius:17px;border:1px solid var(--bd2);font-size:17px;color:var(--tx2);display:flex;align-items:center;justify-content:center}
.step b{min-width:34px;text-align:center;font-weight:500}
.sw{position:relative;width:46px;height:28px;border-radius:14px;background:var(--bd2);transition:background .2s;flex-shrink:0;margin-left:auto}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:transform .22s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--ac)}
.sw.on::after{transform:translateX(18px)}
.throw{width:100%;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--bd);min-height:56px}
.throw:last-child{border-bottom:0}
.thsw{display:flex;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px var(--bd)}
.thsw i{width:16px;height:28px}
.throw .nm{flex:1;font-size:14.5px}
.throw .no{font-size:12px;color:var(--tx3);width:24px}
.throw .ok{color:var(--ac-tx)}

/* 판(매트릭스) */
.mx{padding:10px 16px 0}
.mx-r{display:grid;grid-template-columns:30px repeat(6,1fr);gap:4px;margin-top:4px;align-items:center}
.mx-h{height:24px;border-radius:5px;font-size:12px;display:flex;align-items:center;justify-content:center}
.mx-c{height:48px;border-radius:9px;font-size:15px;font-weight:600;border:2px solid transparent;transition:transform .15s}
.mx-c:active{transform:scale(.95)}
.mx-c.sel{border-color:var(--tx)}
.mx-c.z{background:var(--s1);color:var(--tx3);font-weight:400}
.mx-c.a{background:rgba(var(--ac-rgb),.22);color:var(--tx)}
.mx-c.b{background:rgba(var(--ac-rgb),.45);color:var(--tx)}
.mx-c.c{background:var(--ac);color:var(--on-accent)}
.mx-cap{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx3);margin-top:8px}

/* 기록: 판 · 달력 */
.snap .rb{padding:12px 0}
.cal{padding:6px 16px 0}
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 10px}
.cal-h b{font-weight:500;font-size:17px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-w{text-align:center;font-size:11.5px;color:var(--tx3);padding-bottom:2px}
.cal-d{height:46px;border-radius:11px;font-size:13px;color:var(--tx2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1.5px solid transparent;background:var(--s1)}
.cal-d.x{background:transparent}
.cal-d.f{color:var(--tx3);opacity:.5}
.cal-d.t{border-color:var(--ac);color:var(--ac-tx)}
.cal-d.sel{border-color:var(--tx)}
.cal-d.l1{background:rgba(var(--ac-rgb),.22);color:var(--tx)}
.cal-d.l2{background:rgba(var(--ac-rgb),.45);color:var(--tx)}
.cal-d.l3{background:var(--ac);color:var(--on-accent)}
.cal-d small{font-size:10px;opacity:.75}

/* ── 아래에서 올라오는 창 ── */
.sh-wrap{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center}
.sh-bd{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .28s}
.sh-wrap.in .sh-bd{opacity:1}
.sheet{position:relative;width:100%;max-width:760px;max-height:86vh;display:flex;flex-direction:column;background:var(--s1);
  border-radius:20px 20px 0 0;padding-bottom:calc(var(--sab) + 12px);transform:translateY(102%);transition:transform .34s var(--ease);
  box-shadow:0 -10px 40px -10px var(--shadow-color)}
.sh-wrap.in .sheet{transform:none}
.sheet.drag{transition:none}
.sh-grab{height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0;touch-action:none;cursor:grab}
.sh-grab i{width:38px;height:4px;border-radius:2px;background:var(--bd2)}
.sh-t{padding:0 20px 8px;font-size:16px;font-weight:600;display:flex;align-items:center}
.sh-t{flex-wrap:wrap}
.sh-t small{flex-basis:100%;margin-top:4px;font-weight:400;color:var(--tx3);font-size:12.5px;line-height:1.5}
.sh-b{overflow-y:auto;padding:0 0 4px}
.opt{width:100%;min-height:52px;display:flex;align-items:center;gap:12px;padding:0 20px;font-size:15px;border-top:1px solid var(--bd)}
.opt .d{font-size:12.5px;color:var(--tx3);margin-top:1px}
.opt .ck{margin-left:auto;color:var(--ac-tx)}
.opt.danger{color:var(--danger)}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;padding:8px 20px 4px}
.pal button{aspect-ratio:1;border-radius:50%;background:var(--c);transition:transform .15s}
.pal button.on{box-shadow:0 0 0 3px var(--s1),0 0 0 5px var(--c)}
.numpick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:8px 20px}
.numpick button{height:52px;border-radius:12px;font-size:18px;font-weight:600}
.numpick button.sel{box-shadow:0 0 0 2px var(--s1),0 0 0 4px var(--tx)}
.sh-acts{display:flex;gap:10px;padding:12px 20px 0}
.sh-acts .cta{margin:0;width:auto;flex:1}

/* ── 한 장씩 기도하기 ── */
.focus{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;overflow:hidden}
.focus.on{display:flex;animation:fin .35s var(--ease)}
@keyframes fin{from{opacity:0}to{opacity:1}}
.f-top{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 8px) 6px 0 20px;position:relative;z-index:2}
.f-time{font-size:13px;color:var(--tx3);font-variant-numeric:tabular-nums;min-width:60px}
.f-pos{font-size:13px;color:var(--tx2)}
.f-pos b{color:var(--ac-tx);font-weight:500}
.f-stage{flex:1;position:relative;z-index:2}
.f-card{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 32px;transition:transform .5s var(--ease),opacity .45s}
.f-card.up{transform:translateY(-46px);opacity:0}
.f-card.below{transform:translateY(46px);opacity:0}
.f-cat{font-size:13px;color:var(--ac-tx);letter-spacing:.08em}
.f-name{margin:10px 0 0;font-family:var(--serif);font-size:40px;font-weight:400;line-height:1.25;letter-spacing:-.01em}
.f-why{margin-top:12px;font-size:12.5px;color:var(--tx3)}
.f-tps{list-style:none;margin:30px 0 0;padding:0;display:flex;flex-direction:column;gap:13px}
.f-tps li{display:flex;align-items:baseline;gap:12px;font-size:18px;font-weight:300;line-height:1.5}
.f-tps li::before{content:'';width:5px;height:5px;border-radius:3px;background:var(--ac);flex-shrink:0;transform:translateY(-3px)}
.f-mem{margin-top:22px;font-size:15px;color:var(--tx2);line-height:1.7}
.f-act{margin-top:26px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;font-size:14px;color:var(--tx2)}
.f-act .ghost{height:38px;font-size:13px}
.f-bot{position:relative;z-index:2;padding:0 24px calc(var(--sab) + 18px)}
.f-btns{display:flex;gap:12px}
.f-btns .ghost{flex:1;height:56px;border-radius:28px;font-size:15px}
.f-btns .cta{flex:2;margin:0;height:56px;border-radius:28px;font-size:16px}
.f-note{margin-top:12px;text-align:center;font-size:11.5px;color:var(--tx3)}
.f-end{text-align:center}
.f-end .f-name{font-size:30px}
.pt{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:2px;background:var(--ac);opacity:0;animation:rise linear infinite;z-index:1}
@keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.55}100%{transform:translateY(-82vh);opacity:0}}

/* ── 알림 ── */
#toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(var(--sab) + 82px);transform:translateY(20px);opacity:0;z-index:90;
  background:var(--tx);color:var(--bg);border-radius:14px;padding:0 6px 0 16px;min-height:46px;display:flex;align-items:center;gap:10px;
  font-size:14px;max-width:calc(100% - 32px);transition:transform .3s var(--ease),opacity .25s;pointer-events:none;box-shadow:0 10px 30px -8px var(--shadow-color)}
#toast.on{opacity:1;transform:none;pointer-events:auto}
#toast button{flex-shrink:0;white-space:nowrap;height:36px;padding:0 12px;border-radius:10px;font-weight:600;color:#7a5a22}
html[data-mode="light"] #toast button{color:#e7c98f}
#toast .msg{padding:12px 4px 12px 0}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 표시 색 — 소속 잇기 */
.mk-sug{display:flex;flex-direction:column;padding:2px 0 6px 52px;border-bottom:1px solid var(--bd)}
.mk-sug[hidden]{display:none}
.mk-sug button{display:flex;align-items:baseline;gap:8px;padding:7px 4px;text-align:left;font-size:14px;border-radius:8px}
.mk-sug button:hover{background:color-mix(in srgb,var(--tx) 6%,transparent)}
.mk-sug small{color:var(--tx3);font-size:12px}
.mk-link{display:flex;align-items:center;gap:6px;padding:0 6px 10px 52px;font-size:12.5px;color:var(--tx3);border-bottom:1px solid var(--bd)}
.mk-link .ico{width:13px;height:13px;color:var(--m)}
.mk-link b{color:var(--tx2);font-weight:600}
.mk-link span{flex:1}
.mk-link button{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--tx3)}
.mk-link button .ico{width:14px;height:14px;color:var(--tx3)}

/* 핀치로 열 바꾸기 — 손가락을 따라 판이 커지고 작아진다 */
.masonry.mjs.pinching{transition:none;will-change:transform}

/* 끌 때 오른쪽 위 구석에 나타나는 지우는 칸 */
.md-trash{position:fixed;top:calc(var(--sat) + 8px);right:8px;z-index:59;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:min(58vw,230px);height:112px;border-radius:22px;
  background:color-mix(in srgb,var(--danger) 16%,var(--s1));color:var(--danger);font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.28);
  opacity:0;transform:translateY(-12px) scale(.92);transition:opacity .22s,transform .22s var(--ease),background .15s,color .15s;pointer-events:none}
.md-trash svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.vh-t{display:flex;align-items:flex-end;gap:2px;min-width:0}

.there-b .mt-clk{font-size:11.5px;font-weight:300;color:var(--tx3);opacity:.55;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.there-ic{display:inline-block;width:1em;height:1em;line-height:0}
.there-ic svg{width:100%;height:100%;display:block}
.mt-bg{position:absolute;inset:0;background:var(--mt-bg,#0e0d12);opacity:0;transition:opacity .8s ease;pointer-events:none;overflow:hidden}
.mt-bg.on{opacity:1}
.mt-bg .mt-haze{position:absolute;inset:-10%;will-change:transform;
  background:radial-gradient(40% 30% at 30% 80%,var(--mt-g1),transparent 70%),radial-gradient(35% 28% at 70% 20%,var(--mt-g2),transparent 70%),radial-gradient(50% 40% at 50% 50%,var(--mt-g1),transparent 70%);
  animation:mtDrift 14s ease-in-out infinite alternate}
@keyframes mtDrift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-3%,2%) scale(1.06)}100%{transform:translate(2%,-2%) scale(1.02)}}
.mt-bg canvas,.mt-top{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* 카드는 살짝 비치게 — 빛이 카드 뒤로 지나가는 것이 어렴풋이 보이도록 */

<script>

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ICONS = {

  map: '<rect x="3.5" y="3.5" width="7" height="9" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="5" rx="1.5"/><rect x="3.5" y="15.5" width="7" height="5" rx="1.5"/><rect x="13.5" y="11.5" width="7" height="9" rx="1.5"/>',

  book: '<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/>',

  phone: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',
  lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  grip: '<circle cx="9" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="9" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="9" cy="18" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="18" r="1.2" fill="currentColor" stroke="none"/>',
  up: '<path d="M12 15V4M8 8l4-4 4 4"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>',
  down: '<path d="M12 4v11M8 11l4 4 4-4"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>',
  theme: '<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/>',

  folder: '<path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>',
  frame: '<rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="M3.5 15l5-4 4 3 3-2 5 4"/>',

};
function ico(n, cls) { return '<svg class="ico ' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[n] || '') + '</svg>'; }

// ── 상태 ──
let DB = loadDB();
// 기기 사이 맞추기 상태 (아래 '로그인 · 기기 사이 맞추기') — save() 가 부르므로 맨 앞에 둔다
const SY = { user: null, status: 'off', err: '', busy: false, again: false, t: 0, unsub: null, pending: null, at: 0, cache: null, watching: false };
let TODAY = ymd();
const UI = {
  tab: 'today', layers: [], listCat: 'all', listView: 'table', listGrouped: false, histTab: 'days',
  mapFilter: [], mapQuery: '', mapSearch: false, more: {}, showDone: {}, openG: {},
  calMonth: TODAY.slice(0, 7), calDay: '', mx: null, imp: null, sel: '', mapEdit: null
};
function loadDB() {
  try { const raw = localStorage.getItem(PRAY_KEY); if (raw) return normDB(JSON.parse(raw)); } catch (e) { /* 깨진 저장값은 새로 시작 */ }
  const d = seedDB();
  try { localStorage.setItem(PRAY_KEY, JSON.stringify(d)); } catch (e) {}
  return d;
}
let saveT = 0;
function save() { DB.rev++; EFFC = null; clearTimeout(saveT); saveT = setTimeout(saveNow, 250); syncSoon(); }
// 보이는 표시 색 — 직접 칠한 색, 없으면 소속에 이어 둔 색 (core markOf). 저장할 때마다 다시 센다
let EFFC = null;
function mk(t) { if (!EFFC) EFFC = effMarkMap(DB); return markOf(DB, t, EFFC); }
function saveNow() {
  clearTimeout(saveT);
  try { localStorage.setItem(PRAY_KEY, JSON.stringify(DB)); }
  catch (e) { toast('저장하지 못했습니다 — 기기 저장 공간을 확인해 주세요'); }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { if (F.on) flushFocusTime(); saveNow(); }
  else { const t = ymd(); if (t !== TODAY) { TODAY = t; refresh(); } }
});
window.addEventListener('pagehide', saveNow);

// ── 테마 — applyTheme 은 머리(head)의 첫 스크립트에 있다 (첫 그림부터 제 색으로) ──
if (window.matchMedia) matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (DB.set.mode === 'system') applyTheme(DB.set); });

// ── 작은 도구 ──
function markVar(m) { return m ? 'var(--mk-' + m + ')' : 'transparent'; }
function markName(m, marks) { const M = marks || DB.marks; return MARK_FIXED[m] || (M && M[m]) || MARK_COLOR_NAME[m]; }
// ⚠️ 비었을 때 이름을 'in' 으로 두면 겹 화면의 .in(올라온 상태)과 부딪힌다 → uX · iX
function uCls(u) { return u == null ? 'uX' : 'u' + u; }
function iCls(i) { return i == null ? 'iX' : 'i' + i; }
function pillBtn(t) { return '<button class="pl ' + uCls(t.u) + '" data-a="pick-num" data-f="u" data-id="' + t.id + '" aria-label="긴급도 ' + (t.u == null ? '없음' : t.u) + ' 바꾸기">' + (t.u == null ? '–' : t.u) + '</button><button class="pl ' + iCls(t.i) + '" data-a="pick-num" data-f="i" data-id="' + t.id + '" aria-label="중요도 ' + (t.i == null ? '없음' : t.i) + ' 바꾸기">' + (t.i == null ? '–' : t.i) + '</button>'; }
function pill(t) { return '<span class="pl ' + uCls(t.u) + '">' + (t.u == null ? '–' : t.u) + '</span><span class="pl ' + iCls(t.i) + '">' + (t.i == null ? '–' : t.i) + '</span>'; }
function dayName(d) { return d === 0 ? '주일' : WEEK[d] + '요일'; }
function shortDate(s) { if (!s) return ''; const d = parseYmd(s); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일'; }
function kindLabel(t) { return t.kind === 'group' ? '그룹' : (t.kind === 'person' ? '사람' : '기도 항목'); }
function targetMeta(t) {
  const out = [];
  if (t.kind === 'group') {
    out.push('그룹');
    const p = t.parent && findG(DB, t.parent); if (p) out.push(p.name);
    if (t.days.length) out.push(t.days.map(d => WEEK[d]).join('·') + (t.time ? ' ' + t.time : ''));
  } else {
    const c = catOf(DB, t); if (c) out.push(c.name);
    const s = t.kind === 'item' && subOf(DB, t); if (s) out.push(s.name);
    if (t.kind === 'person') { const gs = groupsOf(DB, t.id).slice(0, 2).map(g => g.name); if (gs.length) out.push(gs.join(' · ')); }
    if (t.memo) out.push(t.memo);
    else if (t.kind === 'item' && t.topics.length) out.push(t.topics.filter(x => !x.ans).map(x => x.t).join(', '));
  }
  return out.join(' · ');
}
function groupMembers(g, exclude) {
  const names = [];
  const pids = groupPids(g);
  const seen = new Set();
  pids.forEach(pid => { if (seen.has(pid) || (exclude && exclude.has(pid))) return; seen.add(pid); const p = findT(DB, pid); if (p) names.push(p.name); });
  const kids = childrenOf(DB, g.id).map(c => c.name);
  let s = '';
  if (names.length) s = names.length > 9 ? names.slice(0, 8).join(' · ') + ' 외 ' + (names.length - 8) + '명' : names.join(' · ');
  if (kids.length) s += (s ? '  ·  ' : '') + kids.join(' · ');
  return s;
}
function copyText(text) {
  // iOS 홈 화면 앱은 누른 그 순간에 **동기적으로** 복사해야 한다 (await 뒤에 하면 실패)
  let ok = false;
  try {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    ok = document.execCommand('copy'); ta.remove();
  } catch (e) {}
  if (!ok && navigator.clipboard) { navigator.clipboard.writeText(text).catch(() => {}); ok = true; }
  return ok;
}

// ── 알림 · 되돌리기 ──
let toastT = 0;
function toast(msg, action, fn) {
  const t = $('toast');
  t.innerHTML = '<span class="msg">' + esc(msg) + '</span>' + (action ? '<button data-a="toast-act">' + esc(action) + '</button>' : '');
  t._fn = fn || null;
  t.style.bottom = UI.layers.length ? 'calc(var(--sab) + 92px)' : '';   // 확인·취소 줄 위로
  t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('on'), action ? 5200 : 2600);
}
function withUndo(msg, mutate) {
  const before = JSON.stringify(DB);
  mutate();
  save(); refresh();
  toast(msg, '되돌리기', () => { DB = normDB(JSON.parse(before)); save(); refresh(); toast('되돌렸습니다'); });
}
function animateGone(row, cb) {
  if (!row) { cb(); return; }
  row.style.height = row.offsetHeight + 'px';
  void row.offsetHeight;
  row.classList.add('gone');
  row.style.height = '0px';
  setTimeout(cb, 250);
}

// ═══ 그리기 ═══
function refresh(opt) {
  renderView();
  refreshLayers(opt && opt.skipTop);
}
function showTab(tab) {
  if (MT.on && tab !== 'map') thereStop('page');
  UI.tab = tab;
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + tab));
  document.querySelectorAll('.tb').forEach(b => { const on = b.dataset.tab === tab; b.classList.toggle('on', on); b.setAttribute('aria-current', on ? 'page' : 'false'); });
  renderView();
}
function renderView() {
  EFFC = null;
  const fn = { today: renderToday, map: renderMap, list: renderList, hist: renderHist }[UI.tab];
  const el = $('v-' + UI.tab);
  if (fn && el) el.innerHTML = fn();
  if (UI.tab === 'map') mapLayout();
}
// 표시색 접기 단추 — 빨강 원 뒤로 주황 · 초록 · 파랑 초승달 (HB 그림, 2026-10-13). 폰에서만 보인다
const MKICO = '<svg class="mkico" viewBox="0 0 26 16" aria-hidden="true">' + [['#4aa1f7', 18.6], ['#82d454', 15.2], ['#f2b13e', 11.8], ['#d93a26', 7.6]].map((c, k) =>
  '<circle cx="' + c[1] + '" cy="8" r="' + (k === 3 ? 6.6 : 6.1) + '" fill="' + c[0] + '" stroke="var(--bg)" stroke-width="' + (k ? 1.4 : 0) + '"/>').join('') + '</svg>';
function brand(page) { return '<h1 class="br" aria-label="BLUE ROOM — ' + page + '"><b>BLUE ROOM</b><span>' + page + '</span></h1>'; }
function headActs(extra) {
  return '<div class="vh-acts">' + (extra || '') + '<button class="ib" data-a="settings" aria-label="설정">' + ico('gear') + '</button></div>';
}

// ── ① 오늘 ──
const TODAY_SECS = [['top', '1순위', '빨강 · 매일 · 맨 위'], ['daily', '매일', '긴급도 0 · 1'], ['day', '', '오늘 요일이 붙은 것'], ['turn', '차례가 온 것', '주기가 지난 것']];

function emptyStart() {

// ── ② 한 장씩 기도하기 ──
const F = { on: false, deck: [], i: 0, t0: 0, tick: 0, sent: {} };
function openFocus() {
  if (MT.on) thereStop('page');
  const r = buildToday(DB, TODAY);
  const mode = DB.set.sorts.today || 'imp', ranks = DB.set.ranks.today || {};
  const deck = [];
  TODAY_SECS.forEach(s => {
    const list = r.sec[s[0]];
    sortTargets(list.map(e => e.t), mode, ranks).forEach(t => { const e = list.find(x => x.t === t); if (!e.done) deck.push({ id: t.id, sec: s[0] }); });
  });
  if (!deck.length) { toast('오늘 남은 기도가 없습니다'); return; }
  F.on = true; F.deck = deck; F.i = 0; F.t0 = Date.now(); F.start = F.t0; F.sid = uid(); F.sent = {};
  const el = $('focus');
  el.innerHTML = '<div class="pts">' + particles() + '</div><div class="f-top"><span class="f-time" id="fTime">0:00</span><span class="f-pos" id="fPos"></span>' +
    '<button class="ib" data-a="focus-close" aria-label="닫기">' + ico('x') + '</button></div><div class="f-stage" id="fStage"></div>' +
    '<div class="f-bot"><div class="f-btns" id="fBtns"><button class="ghost" data-a="focus-skip">다음에</button><button class="cta" data-a="focus-amen">아멘</button></div>' +
    '<div class="f-note">이 화면에 머문 시간은 기도 시간으로 쌓입니다</div></div>';
  el.classList.add('on');
  focusCard(false);
  clearInterval(F.tick);
  F.tick = setInterval(() => { const s = Math.floor((Date.now() - F.t0) / 1000); const n = $('fTime'); if (n) n.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }, 1000);
}
function particles() {
  let s = '';
  for (let k = 0; k < 16; k++) {
    const left = (6 + Math.random() * 88).toFixed(1), dur = (10 + Math.random() * 12).toFixed(1), delay = (-Math.random() * 20).toFixed(1), sz = Math.random() < .3 ? 4 : (Math.random() < .5 ? 3 : 2);
    s += '<i class="pt" style="left:' + left + '%;width:' + sz + 'px;height:' + sz + 'px;animation-duration:' + dur + 's;animation-delay:' + delay + 's"></i>';
  }
  return s;
}
function focusCardHTML() {
  if (F.i >= F.deck.length) {
    const secs = Math.floor((Date.now() - F.t0) / 1000);
    return '<div class="f-card f-end"><div class="f-cat">오늘 기도</div><h2 class="f-name">다 마쳤습니다</h2><div class="f-why">' +
      F.deck.length + '개 · ' + Math.max(1, Math.round(secs / 60)) + '분</div><div style="margin-top:28px"><button class="ghost" data-a="focus-close">닫기</button></div></div>';
  }
  const it = F.deck[F.i], t = findAny(DB, it.id);
  if (!t) return '<div class="f-card"></div>';
  let cat = kindLabel(t);
  if (t.kind !== 'group') { const c = catOf(DB, t); if (c) cat = c.name; }
  else { const p = t.parent && findG(DB, t.parent); if (p) cat = '그룹 · ' + p.name; }
  const secName = { top: '1순위', daily: '매일', day: '오늘 요일', turn: '차례' }[it.sec];
  const why = secName + (t.u != null ? ' · 긴급도 ' + t.u : '') + (t.i != null ? ' · 중요도 ' + t.i : '');
  const tps = (t.topics || []).filter(x => !x.ans);
  const mem = t.kind === 'group' ? groupMembers(t) : '';
  const sent = F.sent[t.id];
  return '<div class="f-card"><div class="f-cat">' + esc(cat) + '</div><h2 class="f-name">' + esc(t.name) + '</h2><div class="f-why">' + esc(why) + '</div>' +
    (tps.length ? '<ul class="f-tps">' + tps.map(x => '<li>' + esc(x.t) + '</li>').join('') + '</ul>' : '') +
    (mem ? '<div class="f-mem">' + esc(mem) + '</div>' : '') +
    (t.memo ? '<div class="f-act"><span>' + ico('phone') + '</span><span>실천 — ' + esc(t.memo) + '</span><button class="ghost' + (sent ? ' ac' : '') + '" data-a="todo" data-id="' + t.id + '">' + (sent ? 'BLOCK7 할일로 보냄 ✓' : 'BLOCK7 할일로 보내기') + '</button></div>' : '') +
    '</div>';
}
function focusCard(anim) {
  const st = $('fStage'); if (!st) return;
  const pos = $('fPos'); if (pos) pos.innerHTML = F.i < F.deck.length ? '<b>' + (F.i + 1) + '</b> / ' + F.deck.length : '';
  const btns = $('fBtns'); if (btns) btns.style.visibility = F.i < F.deck.length ? '' : 'hidden';
  const old = st.firstElementChild;
  const wrap = document.createElement('div'); wrap.innerHTML = focusCardHTML();
  const card = wrap.firstElementChild;
  if (anim && old) {
    card.classList.add('below'); st.appendChild(card);
    old.classList.add('up');
    requestAnimationFrame(() => requestAnimationFrame(() => card.classList.remove('below')));
    setTimeout(() => old.remove(), 500);
  } else { st.innerHTML = ''; st.appendChild(card); }
}
function focusNext(amen) {
  if (F.i >= F.deck.length) return;
  if (amen) { const id = F.deck[F.i].id; const L = dayLog(DB, TODAY); if ((L.d || []).indexOf(id) < 0) toggleDone(DB, id, TODAY); save(); }
  F.i++;
  focusCard(true);
}
function flushFocusTime() { if (!F.on) return; addPraySession(DB, F.start || F.t0, (Date.now() - F.t0) / 1000, 'focus', F.sid); F.t0 = Date.now(); }
function closeFocus() {
  flushFocusTime(); save();
  F.on = false; clearInterval(F.tick);
  const el = $('focus'); el.classList.remove('on'); el.innerHTML = '';
  refresh();

// ── 지도 그리기 (지금 지도 · 지난 판 둘 다) ──
function mapSource(snap) {
  if (snap) return {
    G: snap.G, marks: snap.marks || {}, live: false,
    person: pid => snap.P[pid] || null,
    kids: gid => snap.G.filter(g => g.parent === gid || (g.also || []).indexOf(gid) >= 0),
    tops: () => snap.G.filter(g => !g.parent || !snap.G.some(x => x.id === g.parent))
  };
  return {
    G: DB.G, marks: DB.marks, live: true,
    person: pid => findT(DB, pid),
    kids: gid => kidsOf(DB, gid),
    tops: () => topGroups(DB)
  };
}
function mapCards(src, opt) {
  const q = (opt && opt.q || '').trim(), filt = opt && opt.filter && opt.filter.length ? opt.filter : null;
  // 색으로 걸러 보기 (여러 색 함께) — 맞는 이름이 하나라도 든 항목만, 그런 항목이 있는 그룹 · 서브 그룹만 보인다
  const hitL = l => !filt || (l.segs || []).some(seg => seg.some(pid => { const p = src.person(pid); return p && filt.indexOf(mk(p)) >= 0; }));
  const showG = g => !filt || (g.lines || []).some(hitL);
  const hc = g => { const s = new Set(groupPids(g)); src.kids(g.id).forEach(c => groupPids(c).forEach(p => s.add(p))); return [...s].filter(id => { const p = src.person(id); return !p || p.kind !== 'item'; }).length; };
  const tops = src.live ? mapTops() : src.tops();
  const edKey = src.live && UI.mapEdit ? UI.mapEdit.key : '';
  // 줄은 이름 사이 빈 자리를 눌러도 같은 일(고치기)을 하도록 data-a 를 단다 — 이름 단추가 더 가까우면 그쪽이 받는다
  const selAttr = k => src.live ? ' data-sel="' + k + '"' + (k[0] === 'l' ? ' data-a="open"' : '') + (UI.sel === k ? ' aria-selected="true"' : '') : '';
  const selCls = k => src.live && UI.sel === k ? ' sel' : '';
  // 새로 만드는 칸은 자판 Enter 자리에 '다음(>)' — 눌러서 같은 자리에 하나 더 이어 쓴다. 고치는 칸은 '완료(✓)' (HB 2026-10-12)
  const editor = (k, v, ph) => '<input class="mapin" data-mapin="' + k + '" value="' + esc(v) + '" placeholder="' + esc(ph) + '" autocomplete="off" spellcheck="false" enterkeyhint="' + (UI.mapEdit && UI.mapEdit.isNew ? 'next' : 'done') + '">';
  const linkN = {};
  src.G.forEach(g => (g.lines || []).forEach(l => { if (l.link) linkN[l.link] = (linkN[l.link] || 0) + 1; }));
  const lk = l => l.link && linkN[l.link] > 1 ? '<span class="lk" title="연동된 항목">' + ico('link') + '</span>' : '';
  const lineHTML = (l, gid) => {
    const k = gid ? 'l:' + gid + ':' + l.id : '';
    if (k && edKey === k) return '<div class="ln ined sel"' + selAttr(k) + '>' + editor(k, UI.mapEdit.isNew ? '' : lineToText(DB, l), '이름 — / 로 나누기 · Tab 다음 항목 · Enter 마침') + '</div>';
    if (l.text && !(l.segs || []).length) return '<div class="ln note' + selCls(k) + '"' + (k ? selAttr(k) : '') + '>' + esc(l.text) + lk(l) + '</div>';
    return '<div class="ln' + selCls(k) + '"' + (k ? selAttr(k) : '') + '>' + (l.segs || []).map(seg => seg.map(pid => {
      const p = src.person(pid); if (!p) return '';
      const role = l.r && l.r[pid];
      const cls = 'pn' + (mk(p) === 'gray' ? ' rest' : '') + (role === '인도' ? ' lead' : '') +
        (filt && filt.indexOf(mk(p)) < 0 ? ' dim' : '') + (q && p.name.indexOf(q) >= 0 ? ' hit' : '');
      const style = mk(p) && mk(p) !== 'gray' ? ' style="--pc:' + markVar(mk(p)) + '"' : '';
      const inner = (role && role !== '인도' ? '<span class="role">' + esc(role) + '</span>' : '') + esc(p.name);
      return src.live ? '<button class="' + cls + '"' + style + ' data-a="open" data-id="' + pid + '">' + inner + '</button>'
                      : '<span class="' + cls + '"' + style + '>' + inner + '</span>';
    }).join(' ')).join(' <span class="sep">/</span> ') + lk(l) + '</div>';
  };
  // 시트에서는 한 칸에 한 사람씩 세로로 적힌 줄이 많다(조명팀 · 키즈모아). 지도에서는
  // 한 사람만 든 줄이 이어지면 한 줄로 흘려 보여 카드가 길어지지 않게 한다.
  const solo = l => !(l.text && !(l.segs || []).length) && (l.segs || []).length === 1 && l.segs[0].length === 1;
  // ⚠️ 키보드로 고치는 PC(마우스)에서는 줄을 하나하나 둔다 — 한 줄로 흘리면 줄 단위로 고르고 옮길 수 없다

    ls.forEach(l => { if (solo(l)) run.push(l); else { flush(); out += lineHTML(l); } });
    flush();
    return out;
  };
  // 작은 묶음 만들기 — BLOCK7 의 '하위 할일' 그림 그대로
  const SUBICO = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.6 3.1v9.6a3.1 3.1 0 0 0 3.1 3.1h5"/><path d="M4.6 7.3h8.1"/><circle cx="15.3" cy="7.3" r="2.6"/><circle cx="15.3" cy="15.8" r="2.6"/></svg>';
  return '<div class="masonry' + (src.live ? ' mjs' : '') + '">' + tops.map(g => {
    const kids = src.kids(g.id).filter(showG);
    if (filt && !showG(g) && !kids.length) return '';
    const gk = 'g:' + g.id;
    const head = edKey === gk ? '<div class="gh ined sel"' + selAttr(gk) + '>' + editor(gk, UI.mapEdit.isNew ? '' : g.name, '그룹 이름') + '</div>'
      : (src.live ? '<div class="ghw"><button class="gh' + selCls(gk) + '"' + selAttr(gk) + ' data-a="open-group" data-id="' + g.id + '">' : '<div class="gh">') + esc(g.name) + '<span class="cnt">' + hc(g) + '</span>' +
        (src.live ? '</button><button class="madd on-gh" data-a="map-add" data-k="sub" data-id="' + g.id + '" aria-label="' + esc(g.name) + '에 서브 그룹 더하기">' + SUBICO + '</button></div>' : '</div>');
    const last = kids.length ? kids[kids.length - 1] : g;   // 맨 아래 입력 칸은 바로 위 덩어리에 줄을 더한다
    return '<div class="gcard" data-gid="' + g.id + '" style="--gc:' + esc(g.color) + '">' + head +
      '<div class="gb">' + linesHTML(g.lines || [], g.id) +
      kids.map(k => {
        const kk = 'g:' + k.id;
        const linked = (k.also || []).length ? '<span class="lk">' + ico('link') + '</span>' : '';
        const body = linesHTML(k.lines || [], k.id);
        const sc = ' style="--sc:' + esc(k.color || g.color) + '"';
        if (edKey === kk) return '<div class="sgb" data-gid="' + k.id + '" data-pl="' + g.id + '"><div class="sgh ined sel"' + sc + selAttr(kk) + '>' + editor(kk, UI.mapEdit.isNew ? '' : k.name, '서브 그룹 이름') + '</div>' + body + '</div>';
        return '<div class="sgb" data-gid="' + k.id + '" data-pl="' + g.id + '">' +
          (src.live ? '<div class="sghw"' + sc + '><button class="sgh' + selCls(kk) + '"' + selAttr(kk) + ' data-a="open-group" data-id="' + k.id + '">' : '<div class="sgh"' + sc + '>') + esc(k.name) + linked +
          (k.days && k.days.length ? '<span class="dt">' + k.days.map(d => WEEK[d]).join('·') + (k.time ? ' ' + esc(k.time) : '') + '</span>' : '') +
          (src.live ? '</button><button class="madd" data-a="map-add" data-k="line" data-id="' + k.id + '" aria-label="' + esc(k.name) + '에 항목 더하기">+</button></div>' : '</div>') + body + '</div>';
      }).join('') +
      (src.live && !filt ? '<div class="addw" data-gid="' + last.id + '"><input class="addin" data-addin="' + last.id + '" placeholder="이름 혹은 기도 제목" aria-label="' + esc(last.name) + '에 항목 더하기" autocomplete="off" spellcheck="false" enterkeyhint="next"><div class="achips" hidden></div></div>' : '') +
      '</div></div>';

// ═══ 겹 화면 ═══
function topLayerEl() { const els = [...$('layers').children].filter(e => !e.classList.contains('out')); return els[els.length - 1] || null; }
function pushLayer(L) {
  if (MT.on) thereStop('page');   // 설정 · 상세 · 어떤 창이든 열리면 There 는 끝
  // 상세(사람·항목·묶음)는 열 때의 모습을 기억해 둔다 → '취소' 로 되돌린다
  if (L.type === 'target' || L.type === 'group') L.snap = JSON.stringify(DB);
  UI.layers.push(L);
  $('layers').classList.add('has');
  const el = document.createElement('div');
  el.className = 'layer';
  $('layers').appendChild(el);
  fillLayer(el, L);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
}
function popLayer() {
  const el = topLayerEl(); if (!el) return;
  UI.layers.pop();
  if (!UI.layers.length) $('layers').classList.remove('has');
  el.classList.remove('in'); el.classList.add('out');
  setTimeout(() => el.remove(), 360);
  refresh({ skipTopEl: el });
}
function liveLayerEls() { return [...$('layers').children].filter(e => !e.classList.contains('out')); }
function fillLayer(el, L) {
  const fn = LAYERS[L.type];
  if (!fn) return;
  const r = fn(L);
  if (r === null) { return; }
  const body = el.querySelector('.lbody'), top = body ? body.scrollTop : 0;
  el.innerHTML = '<div class="lhead">' + (r.menu ? '<button class="ib" data-a="' + r.menu + '" aria-label="메뉴">' + ico('dots') + '</button>' : '<span style="width:44px"></span>') +
    '<div class="lh-title">' + esc(r.title) + '</div><button class="ib lh-x" data-a="pop" aria-label="닫기">' + ico('x') + '</button></div>' +
    '<div class="lbody">' + r.body + '</div>' +
    (L.snap ? '<div class="lfoot"><button class="ghost" data-a="layer-cancel">취소</button><button class="cta" data-a="layer-ok">확인</button></div>' : '');
  const nb = el.querySelector('.lbody'); if (nb) nb.scrollTop = top;
}
function refreshLayers(skipTop) {
  const els = liveLayerEls();
  els.forEach((el, k) => {
    if (skipTop && k === els.length - 1) return;
    const L = UI.layers[k];
    if (!L) return;
    if (LAYER_GONE(L)) { return; }
    fillLayer(el, L);
  });
}
function LAYER_GONE(L) {
  if (L.type === 'target') return !findT(DB, L.id);
  if (L.type === 'group') return !findG(DB, L.id);
  if (L.type === 'snap') return !DB.snaps.some(s => s.id === L.id);
  return false;
}
function openTarget(id) { const t = findAny(DB, id); if (!t) return; if (t.kind === 'group') pushLayer({ type: 'group', id: id }); else pushLayer({ type: 'target', id: id }); }

const LAYERS = {};
// ③ 사람 · 기도 항목
LAYERS.target = L => {

  if (k === 'target') { const t = findT(DB, id); if (t) go(t.name + ' 을(를) 지웠습니다', () => removeTarget(DB, id)); }
  else if (k === 'group') { const g = findG(DB, id); if (g) go(g.name + ' 그룹을 지웠습니다', () => removeGroup(DB, id)); }
  else if (k === 'topic') { const t = findAny(DB, el.dataset.tid); if (t) go('기도제목을 지웠습니다', () => { t.topics = t.topics.filter(x => x.id !== id); }); }
  else if (k === 'line') { const g = findG(DB, el.dataset.gid); if (g) go('항목을 지웠습니다', () => { g.lines = g.lines.filter(x => x.id !== id); }); }
  else if (k === 'snap') go('판을 지웠습니다', () => { DB.snaps = DB.snaps.filter(s => s.id !== id); });
  else if (k === 'cats') { const c = DB.cats.find(x => x.id === id); if (c) go(c.name + ' 구분을 지웠습니다', () => { DB.cats = DB.cats.filter(x => x.id !== id); DB.T.forEach(t => { if (t.cat === id) t.cat = ''; }); }); }
  else if (k === 'subcats') { const c = DB.subs.find(x => x.id === id); if (c) go(c.name + ' 분류를 지웠습니다', () => { DB.subs = DB.subs.filter(x => x.id !== id); DB.T.forEach(t => { if (t.sub === id) t.sub = ''; }); }); }

//    터치 화면 노트북처럼 '마우스 기기' 로 안 잡히는 PC 에서 우클릭 · 클릭이 휴대폰처럼 돌던 일 (HB 2026-10-11)

document.body.classList.toggle('tch', PT !== 'mouse');
document.addEventListener('pointerdown', e => { PT = e.pointerType || 'mouse'; document.body.classList.toggle('tch', PT !== 'mouse'); }, true);
function mapTops() {

  const hc = g => groupHeadcount(DB, g);
  if (mode === 'name') tops = tops.slice().sort((a, b) => a.name.localeCompare(b.name, 'ko'));
  if (mode === 'size') tops = tops.slice().sort((a, b) => hc(b) - hc(a));

}
function mapNav() {

    kidsOf(DB, g.id).forEach(k => { out.push('g:' + k.id); k.lines.forEach(l => out.push('l:' + k.id + ':' + l.id)); });
  });
  return [...new Set(out)];   // 연동한 작은 묶음은 두 자리에 보이지만 고르기 차례에는 한 번

// 고치던 것을 적는다. 돌려주는 값: 남아 있으면 true (빈 새 항목은 지워진다)

function setBase(uid, wid, cdb) {

  catch (e) { try { localStorage.removeItem(BASE_KEY); } catch (e2) {} }   // 못 남기면 차라리 없앤다 (낡은 기준점보다 안전)

function stashBefore(cdb) { try { localStorage.setItem(BEFORE_KEY, JSON.stringify({ at: new Date().toISOString(), db: cdb })); } catch (e) {} }

function setStatus(st, err) { SY.status = st; SY.err = err || ''; if (st === 'ok') SY.at = Date.now(); paintSync(); }
function syncText() {

// 설정을 통째로 다시 그리지 않고 글자만 — 지도 제목 칸에 쓰는 중이어도 커서가 안 날아가게

// 고치는 중이면 받은 것을 그리지 않는다 — 쓰던 글자 · 열린 상세의 '취소'(열 때 모습으로 되돌림) · 끌기가 깨진다
function uiBusy() {

  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable)) return true;
  return !!(SHEET || UI.mapEdit || F.on || document.body.classList.contains('dragging') || UI.layers.some(L => L && L.snap));
}
function syncSoon(ms) {
  if (!SY.user || SY.pending) return;
  clearTimeout(SY.t); SY.t = setTimeout(syncNow, ms == null ? 2000 : ms);
}
// 클라우드 읽기 — 머리의 wid 가 아는 것과 같으면 덩어리를 다시 받지 않는다
async function readCloud(uid) {
  const ref = FB.db.doc('pray/' + uid);
  for (let k = 0; k < 4; k++) {
    const m = await ref.get();
    if (!m.exists) return { wid: '', db: null };
    const meta = m.data();
    if (SY.cache && SY.cache.wid === meta.wid) return { wid: meta.wid, db: SY.cache.db };
    const parts = await Promise.all(Array.from({ length: meta.n || 0 }, (_, i) => ref.collection('c').doc(String(i)).get()));
    if (parts.every(p => p.exists && p.data().wid === meta.wid)) {   // 쓰는 도중에 읽은 덩어리는 버리고 다시
      const db = cloudOf(normDB(JSON.parse(parts.map(p => p.data().s).join(''))));
      SY.cache = { wid: meta.wid, db: db };
      return { wid: meta.wid, db: db };
    }
  }
  throw new Error('읽는 중에 계속 바뀌었습니다');
}
// 클라우드 쓰기 — 머리의 wid 가 내가 병합한 그 판일 때만 (트랜잭션). 아니면 null → 다시 받아 병합.
// ⚠️ 이게 없으면 두 기기가 동시에 쓸 때 나중 것이 앞의 것을 덮고, 앞 기기는 '내가 넣은 것을 상대가 지웠다' 로 읽는다.
async function writeCloud(who, cdb, expect) {
  const json = JSON.stringify(cdb), parts = splitChunks(json, SYNC_CHUNK), nw = uid(), ref = FB.db.doc('pray/' + who), c = counts(cdb);
  const ok = await FB.db.runTransaction(async tx => {
    const s = await tx.get(ref);
    const cur = s.exists ? (s.data().wid || '') : '';
    if (cur !== (expect || '')) return false;
    const oldN = s.exists ? (s.data().n || 0) : 0;
    tx.set(ref, { wid: nw, n: parts.length, len: json.length, people: c.p, groups: c.g, v: APP_VERSION, at: FB.fv.serverTimestamp() });
    parts.forEach((p, i) => tx.set(ref.collection('c').doc(String(i)), { wid: nw, s: p }));
    for (let i = parts.length; i < oldN; i++) tx.delete(ref.collection('c').doc(String(i)));
    return true;
  });
  return ok ? nw : null;
}
function applyCloud(cdb) {
  DB = fromCloud(cdb, DB); EFFC = null;
  const t = $('toast'); if (t && t._fn) { t._fn = null; t.classList.remove('on'); }   // 받기 전 모습으로 되돌리면 받은 것이 지워진다
  saveNow(); refresh();
}
async function syncNow() {
  clearTimeout(SY.t);
  if (!SY.user || SY.pending) return;
  if (SY.busy) { SY.again = true; return; }
  if (navigator.onLine === false) { setStatus('offline'); return; }
  SY.busy = true; setStatus('sync');
  const uid = SY.user.uid;
  try {
    for (let k = 0; k < 4; k++) {
      const got = await readCloud(uid);
      if (!SY.user || SY.user.uid !== uid) return;   // 그 사이에 로그아웃
      const base = loadBase(uid);
      const plan = syncPlan(base ? base.db : null, cloudOf(DB), got.db);
      const needsApply = plan.act === 'pull' || plan.act === 'merge' || plan.act === 'ask' || plan.act === 'bulk';
      if (needsApply && uiBusy()) { setStatus('ok'); syncSoon(1500); return; }   // 고치는 중 — 끝난 뒤에
      if (plan.act === 'ask' || plan.act === 'bulk') { SY.pending = { plan: plan, wid: got.wid, remote: got.db, local: cloudOf(DB) }; setStatus('ask'); askSync(); return; }
      if (plan.act === 'same') { setBase(uid, got.wid, got.db); break; }
      if (plan.act === 'pull') { applyCloud(plan.db); setBase(uid, got.wid, plan.db); break; }
      if (plan.act === 'merge') applyCloud(plan.db);
      const nw = await writeCloud(uid, plan.db, got.wid);
      if (nw) { setBase(uid, nw, plan.db); break; }
      // 그 사이에 다른 기기가 썼다 — 다시 받아 병합한다 (합친 것은 이미 이 기기에 있으니 잃지 않는다)
    }
    setStatus('ok');
  } catch (e) {
    setStatus(navigator.onLine === false ? 'offline' : 'err', fbErr(e));
    if (SY.user) syncSoon(60000);
  } finally {
    SY.busy = false;
    if (SY.again) { SY.again = false; syncSoon(300); }
  }
}
function askSync() {
  const P = SY.pending; if (!P) return;
  const plan = P.plan, L = counts(P.local), R = P.remote ? counts(P.remote) : { p: 0, g: 0 };
  const nums = c => '사람 ' + c.p + ' · 그룹 ' + c.g;
  let title, sub, opts;
  if (plan.act === 'ask') {
    title = '이 기기와 클라우드에 둘 다 자료가 있습니다'; sub = '처음 맞출 때 한 번만 묻습니다';
    opts = [{ v: 'cloud', label: '클라우드 자료 쓰기', desc: nums(R) + ' — 이 기기 자료(' + nums(L) + ')는 한 벌 남겨 둡니다' },
            { v: 'local', label: '이 기기 자료 올리기', desc: nums(L) + ' — 클라우드 자료는 이 기기에 한 벌 남겨 둡니다' }];
  } else if (plan.side === 'local') {
    title = '이 기기에서 사람 · 그룹이 한꺼번에 많이 사라졌습니다'; sub = '클라우드와 맞추면 ' + plan.fromR.lost + '개가 지워집니다';
    opts = [{ v: 'merged', label: '이 기기대로 클라우드에서도 지우기', desc: '지운 것이 맞으면' },
            { v: 'cloud', label: '클라우드 것으로 되살리기', desc: nums(R) }];
  } else {
    title = '클라우드에서 사람 · 그룹이 한꺼번에 많이 사라졌습니다'; sub = '맞추면 이 기기에서 ' + plan.fromL.lost + '개가 지워집니다';
    opts = [{ v: 'merged', label: '클라우드대로 이 기기에서도 지우기', desc: '다른 기기에서 지운 것이 맞으면' },
            { v: 'local', label: '이 기기 것 지키기', desc: nums(L) + ' — 클라우드에 다시 올립니다' }];
