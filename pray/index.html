// ── 색 계산 도구 ──
function _thRgb(h){h=String(h).replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function _thHex(c){return '#'+c.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
function _thMix(a,b,t){return [0,1,2].map(i=>a[i]+(b[i]-a[i])*t);}   // t=0 → a, t=1 → b
function _thLin(c){c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);}
function _thLum(c){return 0.2126*_thLin(c[0])+0.7152*_thLin(c[1])+0.0722*_thLin(c[2]);}
function _thContrast(a,b){const x=_thLum(a),y=_thLum(b);return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05);}
function _thRound(c){return [Math.round(c[0]),Math.round(c[1]),Math.round(c[2])];}

// 글자색을 배경 쪽으로 최대한 흐리게 밀되, 목표 대비는 지키는 지점을 찾는다.

// ⚠️ 두 가지를 꼭 지켜야 한다 — 계산해 보고 알았다:
//   ① 배경(bg) 하나만 보고 맞추면 **패널 위(s1/s2)** 에서 기준이 깨진다.
//      보조 글자는 카드 안에도 올라가므로 놓일 수 있는 면을 전부 넣고 잰다.
//   ② 정수로 반올림한 **뒤의** 색으로 재야 한다. 경계값까지 이분 탐색해 놓고
//      나중에 반올림하면 4.50 이 4.49 로 떨어져 기준을 못 넘는다.
function _thFade(text,toward,surfaces,target,maxT){
  if(_thWorst(_thRound(text),surfaces)<target)return _thRound(text); // 원래 글자도 못 미치면 그대로
  let lo=0,hi=maxT;
  for(let i=0;i<16;i++){
    const mid=(lo+hi)/2;
    if(_thWorst(_thRound(_thMix(text,toward,mid)),surfaces)>=target)lo=mid; else hi=mid;
  }
  return _thRound(_thMix(text,toward,lo));
}
// 어떤 면 위에 글자를 얹을 때 흰색과 검정 중 더 잘 읽히는 쪽

function _thRgba(c,a){return 'rgba('+c.map(v=>Math.round(v)).join(',')+','+(Math.round(a*1000)/1000)+')';}
// ── 선택·활성 표시의 세기 (--ac-tint-k) ──
// 고른 버튼·켜진 버튼은 대개 강조색을 아주 옅게(알파 .12~.16) 깐 배경으로 나타낸다.
// 그런데 **같은 알파라도 강조색이 배경과 색조가 비슷하면**(크림색 위의 올리브 등)
// 눈에는 그냥 배경으로 보여 고른 것과 안 고른 것이 구분되지 않는다.
// 밝기 대비(_thContrast)로는 이 차이가 안 잡힌다 — 밝기는 거의 같고 '색'만 다르기
// 때문이다. 그래서 여기서는 사람 눈에 가까운 CIELAB 색차(ΔE)로 재고,
// 기본 테마가 내는 값(라이트 13 · 다크 15)에 못 미치면 **알파를 키운다.**
// 색을 진하게 미는 방법은 못 쓴다 — 밀다 보면 0/255 에 걸려 색조가 날아간다.
// 결과는 배수 하나(--ac-tint-k)로 내보내고 CSS 는 calc(.14*var(--ac-tint-k)) 로 쓴다.
// 테마를 안 고른 사용자는 이 값이 1 이라 예전 화면과 한 픽셀도 다르지 않다.
function _thLabF(t){return t>0.008856451679?Math.cbrt(t):(7.787037*t+16/116);}
function _thLab(c){
  const r=_thLin(c[0]),g=_thLin(c[1]),b=_thLin(c[2]);
  const X=_thLabF((0.4124*r+0.3576*g+0.1805*b)/0.95047);
  const Y=_thLabF(0.2126*r+0.7152*g+0.0722*b);
  const Z=_thLabF((0.0193*r+0.1192*g+0.9505*b)/1.08883);
  return [116*Y-16,500*(X-Y),200*(Y-Z)];

function _thDeltaE(a,b){
  const A=_thLab(a),B=_thLab(b);
  return Math.sqrt(Math.pow(A[0]-B[0],2)+Math.pow(A[1]-B[1],2)+Math.pow(A[2]-B[2],2));

// 틴트가 놓일 수 있는 여러 면 중 **가장 안 보이는** 쪽의 색차
function _thTintDE(c,alpha,surfaces){
  let m=99;
  for(let i=0;i<surfaces.length;i++)m=Math.min(m,_thDeltaE(_thMix(surfaces[i],c,Math.min(1,alpha)),surfaces[i]));
  return m;

// Lab → sRGB (채도를 올린 색을 다시 화면 색으로 되돌릴 때 쓴다)

  const X=_thLabFi(x)*0.95047,Y=_thLabFi(y),Z=_thLabFi(z)*1.08883;
  return [_thUnlin( 3.2406*X-1.5372*Y-0.4986*Z),

// 켜진 것과 꺼진 것이 구분되지 않는다.
// 그래서 **채도를 올려**(같은 색조를 유지한 채) 글자색과 갈라 세우고,
// 그래도 모자라면 밝기를 배경 쪽이 아니라 **글자색 반대쪽**으로 조금 민다.
// ⚠️ 지금보다 안 읽히게 만들지는 않는다 — 후보의 최소 대비가 원래 강조색의
//    대비(또는 4.0) 밑으로 내려가면 버린다.
// 고르는 차례가 셋이다 (v26-0903-4, HB — 채도를 밀면 팔레트 통일성이 깨진다):
//   ① 강조색(--ac)이 이미 글자색들과 충분히 갈라져 있으면 **그대로 쓴다**
//   ② 아니면 그 테마의 **보조색(--sec)** 을 쓴다. 억지로 만든 색이 아니라
//      팔레트가 원래 가진 색이라 통일성이 안 깨진다. 읽기 어려우면 **밝기만**
//      배경 반대쪽으로 민다 — 색조·채도는 손대지 않는다.
//      ('14 올리브 가든 피스트' 라이트: 보조색이 브라운 #bc6c25 다. HB 가
//       "차라리 팔레트에 있는 브라운을 쓰라"고 짚어 준 자리다 → #ad6018)
//   ③ 보조색도 안 되면(회색이라 글자색과 겹치는 테마가 있다) 그때서야
//      예전처럼 강조색의 채도를 민다.
// 기준값 34 로 30벌을 돌리면 15벌은 ①(손 안 댐) · 7벌은 ②(팔레트 보조색) ·
// 6벌만 ③(채도 밀기)이다. 45 까지 올려 채도로만 해결하던 때는 20벌이 밀렸다.
function _thReadable(c,faces,floor){
  const con=x=>{let m=99;for(let i=0;i<faces.length;i++)m=Math.min(m,_thContrast(x,faces[i]));return m;};
  if(con(c)>=floor)return _thRound(c);
  const L=_thLab(c);
  let faceL=0;for(let i=0;i<faces.length;i++)faceL+=_thLab(faces[i])[0];
  const dir=(faceL/faces.length>L[0])?-1:1;   // 면이 밝으면 더 어둡게, 어두우면 더 밝게
  let best=_thRound(c);
  for(let d=1;d<=60;d++){
    const cand=_thLabRgb([Math.max(2,Math.min(98,L[0]+dir*d)),L[1],L[2]]);
    if(con(cand)>=floor)return cand;
    best=cand;
  }
  return best;
}
function _thAcText(ac,sec,texts,faces,target){
  const worst0=c=>{let m=99;for(let i=0;i<texts.length;i++)m=Math.min(m,_thDeltaE(c,texts[i]));return m;};
  const con0  =c=>{let m=99;for(let i=0;i<faces.length;i++)m=Math.min(m,_thContrast(c,faces[i]));return m;};
  if(worst0(ac)>=target)return _thRound(ac);           // ①
  const secFit=_thReadable(sec,faces,Math.min(4.0,con0(ac)));
  if(worst0(secFit)>=target&&worst0(secFit)>worst0(ac))return secFit;   // ②
  return _thAcPush(ac,texts,faces,target);             // ③
}
function _thAcPush(ac,texts,faces,target){
  const worst=c=>{let m=99;for(let i=0;i<texts.length;i++)m=Math.min(m,_thDeltaE(c,texts[i]));return m;};
  const con  =c=>{let m=99;for(let i=0;i<faces.length;i++)m=Math.min(m,_thContrast(c,faces[i]));return m;};
  if(worst(ac)>=target)return _thRound(ac);
  const floor=Math.min(4.0,con(ac));
  const L0=_thLab(ac);
  // 밝기를 미는 방향은 '글자색에서 멀어지는 쪽' — 글자색이 밝으면 어둡게, 그 반대면 밝게
  let txL=0;for(let i=0;i<texts.length;i++)txL+=_thLab(texts[i])[0];
  const away=(txL/texts.length>L0[0])?-1:1;
  let best=_thRound(ac),bw=worst(ac);
  for(let d=0;d<=34;d+=2){
    const dirs=(d===0)?[0]:[away,-away];
    for(let di=0;di<dirs.length;di++){
      for(let k=1;k<=3.2+1e-9;k+=0.1){
        const c=_thLabRgb([Math.max(2,Math.min(98,L0[0]+dirs[di]*d)),L0[1]*k,L0[2]*k]);
        if(con(c)<floor)continue;
        const w=worst(c);
        if(w>bw){bw=w;best=c;}
        if(w>=target)return c;
      }
    }
  }
  return best;
}
// 보조 패널(s2)이 기본 패널(s1)과 눈에 띄게 다른 최소 비율.
// 선택된 탭·줄의 표시가 이 색 하나로만 이뤄지므로(.tab.on · .keep-pick-row.on)
// 색차가 너무 작으면 무엇을 골랐는지 알 수 없다.
function _thPanelMix(sf,tx,base,target,maxR){
  let r=base;
  if(_thDeltaE(_thRound(_thMix(sf,tx,r)),sf)>=target)return r;
  while(r<maxR){r+=0.005;if(_thDeltaE(_thRound(_thMix(sf,tx,r)),sf)>=target)break;}
  return Math.min(r,maxR);
}
// 기준 색차를 넘길 때까지 알파에 곱할 배수를 찾는다 (1 ~ maxK)
function _thTintK(ac,alpha,surfaces,target,maxK){
  if(_thTintDE(ac,alpha,surfaces)>=target)return 1;
  if(_thTintDE(ac,alpha*maxK,surfaces)<target)return maxK;
  let lo=1,hi=maxK;
  for(let i=0;i<14;i++){
    const mid=(lo+hi)/2;
    if(_thTintDE(ac,alpha*mid,surfaces)>=target)hi=mid; else lo=mid;
  }
  return hi;
}
// 다섯 색 → 앱이 쓰는 토큰 전부
function _themeTokens(preset,mode){
  const p=(mode==='light')?preset.light:preset.dark;
  const isDark=(mode!=='light');
  const bg=_thRgb(p[0]),sf=_thRgb(p[1]),tx=_thRgb(p[2]),ac=_thRgb(p[3]),sec=_thRgb(p[4]);
  // 보조 패널 — 기본 패널에서 글자색 쪽으로 아주 조금.
  // 다만 선택된 탭·줄은 이 색 하나로만 표시되므로 최소 색차(6)는 지킨다.
  const s2=_thRound(_thMix(sf,tx,_thPanelMix(sf,tx,isDark?0.10:0.07,6.0,0.20)));
  // 글자가 놓일 수 있는 세 면. 이 중 가장 안 읽히는 쪽을 기준으로 맞춘다.
  const faces=[bg,sf,s2];
  // 보조·비활성 글자: 배경 쪽으로 흐리게 하되 AA(4.5) / 3:1 은 지킨다
  const tx2=_thFade(tx,bg,faces,4.5,0.62);
  const tx3=_thFade(tx,bg,faces,3.0,0.82);
  // 경계선 — 글자색을 배경에 거의 녹인 것. 강한 경계선은 3:1 을 지켜
  // 패널과 배경이 거의 같은 색인 테마에서도 카드 윤곽이 보이게 한다.
  const bd =_thRound(_thMix(tx,bg,isDark?0.80:0.84));
  const bd2=_thFade(tx,bg,[bg,sf],3.0,0.72);
  const onAc=_thOn(ac);
  // 선택·활성 틴트의 세기. 기준 알파(.14 라이트 / .16 다크)에서 재고,
  // 그 결과 배수를 CSS 의 모든 틴트 알파에 똑같이 곱한다.
  // 소수 둘째 자리에서 **올림** — 내림하면 방금 맞춘 기준을 한 끗 차이로 놓친다
  const tintK=Math.min(2.4,Math.ceil(_thTintK(ac,isDark?0.16:0.14,faces,isDark?15:13,2.4)*100)/100);
  // 글자로 쓰는 강조색. 글자색들과 ΔE 34 이상 벌어지게 고른다 (_thAcText 주석 참고).
  const acTx=_thAcText(ac,sec,[tx,tx2,tx3],faces,34);
  // 위험색·주의색은 팔레트가 아니라 **공통 의미색**이다(빨강은 빨강, 주황은 주황).
  // 다만 그 테마 배경에서 읽혀야 하므로 기준을 넘을 때까지 밝기만 민다.
  let danger=isDark?[255,138,133]:[196,43,33];
  for(let i=0;i<40&&_thWorst(_thRound(danger),faces)<4.5;i++){
    danger=_thMix(danger,isDark?[255,255,255]:[0,0,0],0.05);
  }
  danger=_thRound(danger);
  let warn=isDark?[240,176,72]:[176,104,16];
  for(let i=0;i<40&&_thWorst(_thRound(warn),faces)<4.5;i++){
    warn=_thMix(warn,isDark?[255,255,255]:[0,0,0],0.05);
  }
  warn=_thRound(warn);
  const hx=_thHex;
  return {
    '--bg':hx(bg),'--s1':hx(sf),'--s2':hx(s2),
    '--tx':hx(tx),'--tx2':hx(tx2),'--tx3':hx(tx3),
    '--bd':hx(bd),'--bd2':hx(bd2),
    '--ac':hx(ac),'--ac-rgb':ac.map(v=>Math.round(v)).join(','),
    '--ac-tx':hx(acTx),
    '--on-accent':hx(onAc),
    '--ac-soft':_thRgba(ac,Math.min(0.5,(isDark?0.20:0.14)*tintK)),
    '--ac-tint-k':String(tintK),
    '--sec':hx(sec),'--sec-rgb':sec.map(v=>Math.round(v)).join(','),
    '--chip-bg':_thRgba(sec,isDark?0.22:0.16),
    '--tab-on-bg':hx(_thMix(sf,ac,Math.min(0.5,(isDark?0.22:0.14)*tintK))),
    '--focus-ring':_thRgba(ac,0.55),
    '--shadow-color':isDark?'rgba(0,0,0,.55)':'rgba(0,0,0,.16)',
    '--header-bg':_thRgba(sf,0.94),
    '--drag-ghost-bg':_thRgba(s2,0.88),
    '--danger':hx(danger),'--del':hx(danger),'--ov':hx(danger),
    '--so':hx(warn),
    '--sun-red':hx(_thFade(danger,bg,faces,3.0,0.40)),
    '--today-cell-border':_thRgba(ac,0.85),
    '--today-cell-border-faded':_thRgba(ac,0.18),
    '--fade-start-border':hx(bd),
    '--bgd':hx(_thMix(danger,bg,isDark?0.55:0.30)),
    '--bgd-tx':hx(_thFade(danger,bg,faces,4.5,0.20)),
    '--theme-color':hx(bg)
  };
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function ymd(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseYmd(s) { const a = String(s).split('-').map(Number); return new Date(a[0], (a[1] || 1) - 1, a[2] || 1); }
function daysBetween(a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function clone(x) { return JSON.parse(JSON.stringify(x)); }

function numOrNull(v) {
  if (v === null || v === undefined || v === '') return null;
  const n = Number(String(v).trim());
  return Number.isInteger(n) && n >= 0 && n <= 5 ? n : null;
}

// 이름에 요일이 들어 있으면 그 요일에 나온다 ('토요 기도' → 토, '주일 1부 예배' → 일)
function daysFromName(name) {
  const s = String(name || '');
  if (/^주일|\s주일/.test(s)) return [0];
  const m = s.match(/^([월화수목금토일])요/);
  return m ? [WEEK.indexOf(m[1])] : [];
}
function seedDB() {
  const db = emptyDB();
  db.cats = SEED_CATS.map(c => ({ id: uid(), name: c[0], person: c[1] }));
  db.subs = SEED_SUBS.map(n => ({ id: uid(), name: n }));
  const catId = n => db.cats.find(c => c.name === n).id;
  SEED_ITEMS.forEach(r => {
    const t = newTarget('item', r[1]);
    t.cat = catId(r[0]); t.u = r[3]; t.i = r[4];
    if (r[0] === '부서' && r[5] >= 0) t.sub = db.subs[r[5]].id;
    if (r[2]) t.topics = r[2].split(',').map(x => x.trim()).filter(Boolean).map(newTopic);
    t.days = daysFromName(r[1]);
    db.T.push(t);
  });
  return db;
}
function newTarget(kind, name) {
  return { id: uid(), kind: kind, name: String(name || '').trim(), cat: '', sub: '', u: null, i: null,
           days: [], memo: '', mark: '', topics: [], note: '', last: '' };
}
function newGroup(name, color) {
  return { id: uid(), kind: 'group', name: String(name || '').trim(), color: color || GROUP_COLORS[0], parent: '',
           days: [], time: '', u: null, i: null, memo: '', mark: '', topics: [], note: '', last: '', lines: [] };
}
function newTopic(t) { return { id: uid(), t: String(t || '').trim(), at: ymd(), ans: '' }; }

// 받은 DB 를 지금 모양으로 맞춘다 — 빠진 칸은 채우고 모르는 값은 버린다.
function normDB(x) {
  const d = emptyDB();
  if (!x || typeof x !== 'object') return d;
  ['cats', 'subs', 'T', 'G', 'snaps', 'todo'].forEach(k => { if (Array.isArray(x[k])) d[k] = x[k]; });
  if (x.log && typeof x.log === 'object') d.log = x.log;
  if (x.marks && typeof x.marks === 'object') MARKS.forEach(m => { if (!MARK_FIXED[m]) d.marks[m] = String(x.marks[m] || ''); });
  if (x.set && typeof x.set === 'object') Object.assign(d.set, x.set);
  if (!Array.isArray(d.set.iv) || d.set.iv.length !== 6) d.set.iv = IV_DEFAULT.slice();
  ['sorts', 'ranks', 'folds'].forEach(k => { if (!d.set[k] || typeof d.set[k] !== 'object') d.set[k] = {}; });
  d.rev = Number(x.rev) || 0;
  d.T = d.T.filter(t => t && t.id).map(t => Object.assign(newTarget(t.kind === 'person' ? 'person' : 'item', ''), t));
  d.G = d.G.filter(g => g && g.id).map(g => {
    const n = Object.assign(newGroup('', ''), g); n.kind = 'group';
    n.lines = (Array.isArray(g.lines) ? g.lines : []).map(normLine);
    return n;
  });
  [...d.T, ...d.G].forEach(t => {
    t.u = numOrNull(t.u); t.i = numOrNull(t.i);
    if (!Array.isArray(t.days)) t.days = [];
    if (!Array.isArray(t.topics)) t.topics = [];
    if (MARKS.indexOf(t.mark) < 0) t.mark = '';
  });
  return d;
}
function normLine(l) {
  const n = { id: (l && l.id) || uid(), segs: [], r: {}, text: '' };
  if (l && Array.isArray(l.segs)) n.segs = l.segs.filter(Array.isArray).map(s => s.filter(Boolean));
  if (l && l.r && typeof l.r === 'object') n.r = l.r;
  if (l && l.text) n.text = String(l.text);
  return n;
}

// ── 찾기 ──
function findT(db, id) { return db.T.find(t => t.id === id) || null; }
function findG(db, id) { return db.G.find(g => g.id === id) || null; }

// ── 오늘 목록 ──
function intervalOf(db, t) {

}

// 한 번 나온 것은 다음 칸에 안 나온다. 오늘 '기도함' 한 것은 **그대로 그 칸에 남는다**

  all.forEach(t => { if (t.mark === 'red') put('top', t); });
  all.forEach(t => { if (!seen.has(t.id) && typeof t.u === 'number' && t.u <= 1) put('daily', t); });
  all.forEach(t => { if (!seen.has(t.id) && (t.days || []).indexOf(wd) >= 0) put('day', t); });
  all.forEach(t => {

// 한꺼번에 몰리지 않게(2026-10-10 시험: 첫날 87개). 이름이 아니라 id 로 날을 나눈다.

// ── 정렬 · 내 순서 ──
const SORT_IMP = (a, b) => ((a.i == null ? 9 : a.i) - (b.i == null ? 9 : b.i)) || ((a.u == null ? 9 : a.u) - (b.u == null ? 9 : b.u)) || a.name.localeCompare(b.name, 'ko');

// ── CSV / 붙여넣기 읽기 ──
// 구글 시트에서 칸을 골라 복사하면 탭으로 나뉜 글이 온다 — 쉼표·탭 둘 다 받는다.

// ── 가져오기 ①: 우선순위 표 (Sheet2 모양) ──
// 열: 구분 · 항목 · 내용 · 긴급도 · 중요도. 사람 구분(성도·방문자)의 '내용' 은 실천,
// 나머지의 '내용' 은 쉼표로 나눠 기도제목. 같은 구분·같은 이름이 있으면 고쳐 쓴다(지우지 않는다).
// 오른쪽에 부서 이름을 덩어리로 모아 둔 칸이 있으면 덩어리 차례대로 상위 분류를 붙인다.
function importSheet2(db, rows) {
  let h = 0;
  for (let r = 0; r < Math.min(rows.length, 6); r++) if ((rows[r] || []).indexOf('구분') >= 0) { h = r; break; }
  const head = rows[h];
  const col = n => head.indexOf(n);
  const cC = col('구분'), cN = col('항목'), cM = col('내용'), cU = col('긴급도'), cI = col('중요도');
  const res = { added: 0, updated: 0, subs: 0, cats: 0 };
  const catByName = n => {
    let c = db.cats.find(x => x.name === n);
    if (!c) { c = { id: uid(), name: n, person: /성도|방문자|교인|새신자/.test(n) }; db.cats.push(c); res.cats++; }
    return c;
  };

    const row = rows[r] || [];
    const cn = (row[cC] || '').trim(), nm = (row[cN] || '').trim();
    if (!cn || !nm) continue;
    const c = catByName(cn);
    const kind = c.person ? 'person' : 'item';
    const key = nameKey(nm);
    let t = db.T.find(x => nameKey(x.name) === key && (x.cat === c.id || (kind === 'person' && x.kind === 'person' && !x.cat)));
    const isNew = !t;
    if (isNew) { t = newTarget(kind, nm); db.T.push(t); }

    }

  // 상위 분류 덩어리 — 부서 이름과 맞는 칸이 모인 열을 찾는다
  const dept = db.cats.find(c => c.name === '부서');
  if (dept) {
    const deptNames = new Set(db.T.filter(t => t.cat === dept.id).map(t => nameKey(t.name)));
    let best = -1, bestHits = 0;
    const width = Math.max.apply(null, rows.map(r => r.length));
    for (let c = 0; c < width; c++) {

      let hits = 0; rows.forEach(r => { if (deptNames.has(nameKey(r[c] || ''))) hits++; });
      if (hits > bestHits) { bestHits = hits; best = c; }
    }
    if (best >= 0 && bestHits >= 3) {
      const blocks = []; let cur = null;
      rows.forEach(r => {
        const v = (r[best] || '').trim();
        const isLegend = !v || v === '긴급도' || v === '중요도' || /^\d+$/.test(v);
        if (isLegend) { if (cur) { blocks.push(cur); cur = null; } return; }
        (cur || (cur = [])).push(v);
      });
      if (cur) blocks.push(cur);
      const real = blocks.filter(b => b.some(v => deptNames.has(nameKey(v))));
      real.forEach((b, k) => {
        let s = db.subs[k];
        if (!s) { s = { id: uid(), name: '분류 ' + (k + 1) }; db.subs.push(s); }
        b.forEach(v => {
          let t = db.T.find(x => x.cat === dept.id && nameKey(x.name) === nameKey(v));
          if (!t) { t = newTarget('item', v); t.cat = dept.id; db.T.push(t); res.added++; }
          t.sub = s.id;
        });

}

    G.push(g); heads.push({ g: g, col: b.col, row: b.row, end: Infinity });
    // 제목 아래 나머지 칸이 있으면 그 묶음의 줄로
    b.cells.slice(1).forEach(txt => { const l = parseLineText(db, txt); if (l) g.lines.push(l); });
  });
  heads.forEach(h => {
    const next = heads.filter(o => o.col === h.col && o.row > h.row).sort((a, b) => a.row - b.row)[0];
    if (next) h.end = next.row - 1;
  });
  let misc = null;
  const ownerOf = b => {
    const cand = heads.filter(h => h.col <= b.col && h.row < b.row && b.row <= h.end);
    if (!cand.length) {
      if (!misc) { misc = newGroup('묶음 없음', GROUP_COLORS[11]); G.push(misc); }
      return misc;
    }
    cand.sort((a, b2) => (b2.col - a.col) || (b2.row - a.row));
    return cand[0].g;
  };
  // 제목만 있는 작은 묶음('교사' 아래 빈 줄, 그 아래 이름들) — 같은 열에서 바로 이어지는
  // 이름 줄 덩어리는 그 작은 묶음의 것이다.
  let openSub = null;
  sorted.filter(b => b.kind === 'sub' || b.kind === 'lines').forEach(b => {
    const owner = ownerOf(b);
    if (b.kind === 'lines' && openSub && openSub.col === b.col && openSub.owner === owner && b.row > openSub.row) {
      b.cells.forEach(txt => { const l = parseLineText(db, txt); if (l) openSub.g.lines.push(l); });
      return;
    }
    openSub = null;
    if (b.kind === 'sub') {
      const f = b.cells[0];
      const dt = splitDaytime(f);
      const sg = newGroup(dt ? dt.head : f, owner.color);
      sg.parent = owner.id;
      if (dt) {
        sg.days = [dt.day]; sg.time = dt.time;
        const lead = parseLineText(db, dt.head);
        if (lead && lead.segs.length) { linePids(lead).forEach(p => { lead.r[p] = '인도'; }); sg.lines.push(lead); }
      }
      b.cells.slice(1).forEach(txt => { const l = parseLineText(db, txt); if (l) sg.lines.push(l); });
      G.push(sg);
      if (b.cells.length === 1) openSub = { g: sg, col: b.col, row: b.row, owner: owner };
    } else {
      b.cells.forEach(txt => { const l = parseLineText(db, txt); if (l) owner.lines.push(l); });
    }
  });
  return G;
}

function makeSnap(db, G, at, name) {
  const groups = clone(G || db.G);
  const P = {};
  groups.forEach(g => groupPids(g).forEach(pid => { const p = findT(db, pid); if (p) P[pid] = { name: p.name, mark: p.mark || '' }; }));
  return { id: uid(), at: at || ymd(), name: name || '', marks: clone(db.marks), G: groups, P: P };
}

  const s = new Set();
  snap.G.forEach(g => groupPids(g).forEach(pid => { const p = snap.P[pid]; if (p) s.add(p.name); }));
  return s;
}
function currentNames(db) {
  const s = new Set();
  db.G.forEach(g => groupPids(g).forEach(pid => { const p = findT(db, pid); if (p) s.add(p.name); }));
  return s;
}
// a(옛 판) → b(새 판 또는 지금): 들어온 이름 · 빠진 이름
function diffNames(a, b) {
  const added = [], removed = [];
  b.forEach(n => { if (!a.has(n)) added.push(n); });
  a.forEach(n => { if (!b.has(n)) removed.push(n); });
  return { added: added.sort((x, y) => x.localeCompare(y, 'ko')), removed: removed.sort((x, y) => x.localeCompare(y, 'ko')) };
}

// ── 응답 모아 보기 ──
function answeredList(db) {
  const out = [];
  [...db.T, ...db.G].forEach(t => (t.topics || []).forEach(tp => { if (tp.ans) out.push({ t: t, tp: tp }); }));
  return out;
}

// ── 백업 ──
function exportBackup(db) { return JSON.stringify({ app: 'pray', v: 1, at: new Date().toISOString(), db: db }); }
function readBackup(text) {
  const o = JSON.parse(text);
  if (!o || o.app !== 'pray' || !o.db) throw new Error('기도노트 백업 파일이 아닙니다');
  return normDB(o.db);
}

.ln{display:flex;flex-wrap:wrap;gap:1px 6px;padding:3px 2px;font-size:13.5px;line-height:1.5}
.ln.note{font-size:12px;color:var(--tx3)}
.ln.flow{gap:1px 9px}
.ln .sep{color:var(--tx3)}
.pn{color:var(--pc,var(--tx));padding:0;border-radius:4px;transition:background .15s}
.pn:active{background:var(--s2)}
.pn.rest{color:var(--tx3)}
.pn.lead{font-weight:650;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.pn.dim{opacity:.18}
.pn.hit{background:var(--ac-soft);box-shadow:0 0 0 2px var(--ac-soft)}
.pn .role{color:var(--tx3);font-size:12px;margin-right:3px}
.ghw,.sghw{position:relative;display:flex;align-items:stretch}
.ghw{background:var(--gc)}
.ghw .gh{flex:1}
.sghw{margin-top:7px}.sghw .sgh{margin-top:0;flex:1}
.madd{flex-shrink:0;width:34px;font-size:18px;font-weight:300;line-height:1;color:var(--tx3);border-radius:6px;transition:opacity .2s,background .15s}
.madd.on-gh{color:rgba(255,255,255,.8)}
.madd:active{background:rgba(127,127,127,.2)}
.madd-sub{display:block;width:100%;margin-top:6px;padding:5px 8px;border-radius:6px;font-size:12px;color:var(--tx3);text-align:left;border:1px dashed var(--bd2);transition:opacity .2s}
.madd-group{min-height:52px;font-size:13px;color:var(--tx3);border:1px dashed var(--bd2);background:transparent;transition:opacity .2s}
/* PC: 마우스를 올린 카드에서만 + 가 보인다 · 휴대폰은 늘 보이되 흐리게 */
@media (hover:hover) and (pointer:fine){
  .gcard .madd,.gcard .madd-sub{opacity:0}
  .gcard:hover .madd,.gcard:hover .madd-sub,.madd:focus-visible,.madd-sub:focus-visible{opacity:1}
  .madd-group{opacity:.35}.madd-group:hover{opacity:1}
}
.gh.sel,.sgh.sel{box-shadow:inset 0 0 0 2px var(--tx)}
.ln.sel{background:var(--ac-soft);border-radius:6px;box-shadow:0 0 0 2px var(--ac)}
.ln.ined{padding:2px}
.mapin{width:100%;min-width:0;border:0;outline:none;background:var(--bg);color:var(--tx);border-radius:5px;padding:5px 7px;font:inherit;font-size:14px}
.gh .mapin,.sgh .mapin{font-weight:600}
.kbhint{display:block;width:calc(100% - 28px);margin:2px 14px 4px;padding:7px 10px;border-radius:10px;background:var(--s1);color:var(--tx3);font-size:11.5px;line-height:1.8;text-align:left}
.kbhint b{color:var(--tx2);font-weight:600;margin:0 2px 0 6px}
.kbhint u{color:var(--ac-tx);text-decoration:none;margin-left:4px}
.kbtable .opt{min-height:44px;font-size:14px}
.lfoot{flex-shrink:0;display:flex;gap:10px;padding:10px 20px calc(var(--sab) + 12px);border-top:1px solid var(--bd);background:var(--header-bg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.lfoot .ghost{flex:1;height:48px;border-radius:24px}
.lfoot .cta{flex:2;margin:0;height:48px}
.search{margin:8px 20px 2px;display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:12px;background:var(--s1);color:var(--tx3)}
.search input{flex:1;border:0;background:transparent;outline:none;font-size:15px}

/* ── 겹 화면(전체화면) ── */
#layers{position:absolute;inset:0;pointer-events:none;z-index:40;transition:background .3s}
@media (min-width:800px){#layers.has{background:rgba(0,0,0,.45)}}
/* ⚠️ z-index 를 꼭 둔다 — 없으면 transform 이 풀린 뒤 아래 겹의 줄(.row-f, z-index:1)이 위 겹을 뚫고 보인다 */
.layer{position:absolute;top:0;bottom:0;left:max(0px,calc((100% - 760px) / 2));right:max(0px,calc((100% - 760px) / 2));z-index:1;isolation:isolate;background:var(--bg);pointer-events:auto;display:flex;flex-direction:column;
  transform:translateX(104%);transition:transform .34s var(--ease);box-shadow:-20px 0 40px -20px var(--shadow-color)}
.layer.in{transform:none}
.layer.out{transform:translateX(104%)}
.layer.edge{transition:none}
.lhead{flex-shrink:0;display:flex;align-items:center;height:52px;margin-top:var(--sat);padding:0 6px;position:relative}
.lh-title{position:absolute;left:56px;right:56px;text-align:center;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.lh-x{margin-left:auto}
.lh-x .ico{width:18px;height:18px;stroke-width:1.8}
.lbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--sab) + 40px)}
.hero{padding:6px 20px 4px}
.hero-name{width:100%;border:0;background:transparent;outline:none;font-family:var(--serif);font-size:32px;font-weight:400;letter-spacing:-.01em;padding:4px 0;border-bottom:1px solid transparent;transition:border-color .2s}
.hero-name:focus{border-bottom-color:var(--bd2)}
.hero-sub{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{height:30px;padding:0 12px;border-radius:15px;font-size:12.5px;display:inline-flex;align-items:center;gap:5px;background:var(--s1);color:var(--tx2);border:1px solid var(--bd)}
.tag.g{background:var(--gc);color:#fff;border-color:transparent}
.tag.add{border-style:dashed}
.marks{display:flex;gap:2px;padding:4px 14px 0}
.mkb{width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.mkb i{width:20px;height:20px;border-radius:10px;background:var(--m);transition:transform .2s var(--ease),box-shadow .2s}
.mkb.on i{transform:scale(1.08);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--m)}
.nums{display:flex;align-items:center;gap:6px;padding:6px 20px}
.nums .k{width:52px;font-size:13px;color:var(--tx2)}
.nb{width:38px;height:38px;border-radius:10px;border:1px solid var(--bd2);font-size:14px;color:var(--tx2);transition:transform .15s}
.nb:active{transform:scale(.94)}
.nb.on{border-color:transparent}
.days{display:flex;gap:5px;padding:6px 20px}
.dy{width:38px;height:38px;border-radius:19px;border:1px solid var(--bd2);font-size:13px;color:var(--tx2);transition:background .18s,color .18s}
.dy.on{background:var(--ac);border-color:var(--ac);color:var(--on-accent)}
.field{margin:6px 20px 0;width:calc(100% - 40px);min-height:46px;border:1px solid var(--bd);border-radius:12px;background:var(--s1);padding:11px 13px;font-size:15px;outline:none;resize:none;transition:border-color .2s;display:block}
.field:focus{border-color:var(--ac)}
textarea.field{min-height:72px;line-height:1.6}
.addline{display:flex;align-items:center;gap:8px;margin:8px 20px 0;padding:0 6px 0 14px;border-radius:12px;border:1px dashed var(--bd2);min-height:46px}
.addline input{flex:1;border:0;background:transparent;outline:none;font-size:15px;min-width:0}
.addline .ib{width:38px;height:38px}
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;padding:8px 20px 0}
.strip i{height:16px;border-radius:4px;background:var(--s2)}
.strip i.on{background:var(--ac)}
.tp .rb{padding:12px 0}
.tp .nm{white-space:normal}
.tp.ans .nm{color:var(--ans)}
.tp .ansd{font-size:12px;color:var(--ans);flex-shrink:0}
.tcircle{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.tcircle i{width:20px;height:20px;border-radius:10px;border:1.5px solid var(--bd2);display:flex;align-items:center;justify-content:center;transition:all .2s var(--ease)}
.tp.ans .tcircle i{background:var(--ans);border-color:var(--ans)}
.tcircle svg{width:12px;height:12px;stroke:var(--bg);stroke-width:2.6;fill:none;opacity:0}
.tp.ans .tcircle svg{opacity:1}
.chips2{display:flex;flex-wrap:wrap;gap:6px;padding:4px 20px}
.lnrow .rb{padding:10px 0}
.lnrow .ln{padding:0;font-size:15px}
.dot16{width:14px;height:14px;border-radius:7px;background:var(--gc);flex-shrink:0;margin:0 6px 0 8px}

/* 설정 목록 */
.set-g{margin:8px 16px 0;border-radius:14px;background:var(--s1);overflow:hidden}
.set-r{width:100%;min-height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--bd);font-size:15px}
.set-r:last-child{border-bottom:0}
.set-r .v{margin-left:auto;color:var(--tx2);font-size:14px;display:flex;align-items:center;gap:6px}
.set-r .v .ico{width:16px;height:16px}
.set-r.danger{color:var(--danger)}
.step{display:flex;align-items:center;gap:4px;margin-left:auto}
.step button{width:34px;height:34px;border-radius:17px;border:1px solid var(--bd2);font-size:17px;color:var(--tx2);display:flex;align-items:center;justify-content:center}
.step b{min-width:34px;text-align:center;font-weight:500}
.sw{position:relative;width:46px;height:28px;border-radius:14px;background:var(--bd2);transition:background .2s;flex-shrink:0;margin-left:auto}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:transform .22s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--ac)}
.sw.on::after{transform:translateX(18px)}
.throw{width:100%;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--bd);min-height:56px}
.throw:last-child{border-bottom:0}
.thsw{display:flex;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px var(--bd)}
.thsw i{width:16px;height:28px}
.throw .nm{flex:1;font-size:14.5px}
.throw .no{font-size:12px;color:var(--tx3);width:24px}
.throw .ok{color:var(--ac-tx)}

/* 판(매트릭스) */
.mx{padding:10px 16px 0}
.mx-r{display:grid;grid-template-columns:30px repeat(6,1fr);gap:4px;margin-top:4px;align-items:center}
.mx-h{height:24px;border-radius:5px;font-size:12px;display:flex;align-items:center;justify-content:center}
.mx-c{height:48px;border-radius:9px;font-size:15px;font-weight:600;border:2px solid transparent;transition:transform .15s}
.mx-c:active{transform:scale(.95)}
.mx-c.sel{border-color:var(--tx)}
.mx-c.z{background:var(--s1);color:var(--tx3);font-weight:400}
.mx-c.a{background:rgba(var(--ac-rgb),.22);color:var(--tx)}
.mx-c.b{background:rgba(var(--ac-rgb),.45);color:var(--tx)}
.mx-c.c{background:var(--ac);color:var(--on-accent)}
.mx-cap{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx3);margin-top:8px}

/* 기록: 판 · 달력 */
.snap .rb{padding:12px 0}
.cal{padding:6px 16px 0}
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 10px}
.cal-h b{font-weight:500;font-size:17px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-w{text-align:center;font-size:11.5px;color:var(--tx3);padding-bottom:2px}
.cal-d{height:46px;border-radius:11px;font-size:13px;color:var(--tx2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1.5px solid transparent;background:var(--s1)}
.cal-d.x{background:transparent}
.cal-d.f{color:var(--tx3);opacity:.5}
.cal-d.t{border-color:var(--ac);color:var(--ac-tx)}
.cal-d.sel{border-color:var(--tx)}
.cal-d.l1{background:rgba(var(--ac-rgb),.22);color:var(--tx)}
.cal-d.l2{background:rgba(var(--ac-rgb),.45);color:var(--tx)}
.cal-d.l3{background:var(--ac);color:var(--on-accent)}
.cal-d small{font-size:10px;opacity:.75}

/* ── 아래에서 올라오는 창 ── */
.sh-wrap{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center}
.sh-bd{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .28s}
.sh-wrap.in .sh-bd{opacity:1}
.sheet{position:relative;width:100%;max-width:760px;max-height:86vh;display:flex;flex-direction:column;background:var(--s1);
  border-radius:20px 20px 0 0;padding-bottom:calc(var(--sab) + 12px);transform:translateY(102%);transition:transform .34s var(--ease);
  box-shadow:0 -10px 40px -10px var(--shadow-color)}
.sh-wrap.in .sheet{transform:none}
.sheet.drag{transition:none}
.sh-grab{height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0;touch-action:none;cursor:grab}
.sh-grab i{width:38px;height:4px;border-radius:2px;background:var(--bd2)}
.sh-t{padding:0 20px 8px;font-size:16px;font-weight:600;display:flex;align-items:center}
.sh-t small{margin-left:8px;font-weight:400;color:var(--tx3);font-size:12.5px}
.sh-b{overflow-y:auto;padding:0 0 4px}
.opt{width:100%;min-height:52px;display:flex;align-items:center;gap:12px;padding:0 20px;font-size:15px;border-top:1px solid var(--bd)}
.opt .d{font-size:12.5px;color:var(--tx3);margin-top:1px}
.opt .ck{margin-left:auto;color:var(--ac-tx)}
.opt.danger{color:var(--danger)}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;padding:8px 20px 4px}
.pal button{aspect-ratio:1;border-radius:50%;background:var(--c);transition:transform .15s}
.pal button.on{box-shadow:0 0 0 3px var(--s1),0 0 0 5px var(--c)}
.numpick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:8px 20px}
.numpick button{height:52px;border-radius:12px;font-size:18px;font-weight:600}
.numpick button.sel{box-shadow:0 0 0 2px var(--s1),0 0 0 4px var(--tx)}
.sh-acts{display:flex;gap:10px;padding:12px 20px 0}
.sh-acts .cta{margin:0;width:auto;flex:1}

/* ── 한 장씩 기도하기 ── */
.focus{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;overflow:hidden}
.focus.on{display:flex;animation:fin .35s var(--ease)}
@keyframes fin{from{opacity:0}to{opacity:1}}
.f-top{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 8px) 6px 0 20px;position:relative;z-index:2}
.f-time{font-size:13px;color:var(--tx3);font-variant-numeric:tabular-nums;min-width:60px}
.f-pos{font-size:13px;color:var(--tx2)}
.f-pos b{color:var(--ac-tx);font-weight:500}
.f-stage{flex:1;position:relative;z-index:2}
.f-card{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 32px;transition:transform .5s var(--ease),opacity .45s}
.f-card.up{transform:translateY(-46px);opacity:0}
.f-card.below{transform:translateY(46px);opacity:0}
.f-cat{font-size:13px;color:var(--ac-tx);letter-spacing:.08em}
.f-name{margin:10px 0 0;font-family:var(--serif);font-size:40px;font-weight:400;line-height:1.25;letter-spacing:-.01em}
.f-why{margin-top:12px;font-size:12.5px;color:var(--tx3)}
.f-tps{list-style:none;margin:30px 0 0;padding:0;display:flex;flex-direction:column;gap:13px}
.f-tps li{display:flex;align-items:baseline;gap:12px;font-size:18px;font-weight:300;line-height:1.5}
.f-tps li::before{content:'';width:5px;height:5px;border-radius:3px;background:var(--ac);flex-shrink:0;transform:translateY(-3px)}
.f-mem{margin-top:22px;font-size:15px;color:var(--tx2);line-height:1.7}
.f-act{margin-top:26px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;font-size:14px;color:var(--tx2)}
.f-act .ghost{height:38px;font-size:13px}
.f-bot{position:relative;z-index:2;padding:0 24px calc(var(--sab) + 18px)}
.f-btns{display:flex;gap:12px}
.f-btns .ghost{flex:1;height:56px;border-radius:28px;font-size:15px}
.f-btns .cta{flex:2;margin:0;height:56px;border-radius:28px;font-size:16px}
.f-note{margin-top:12px;text-align:center;font-size:11.5px;color:var(--tx3)}
.f-end{text-align:center}
.f-end .f-name{font-size:30px}
.pt{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:2px;background:var(--ac);opacity:0;animation:rise linear infinite;z-index:1}
@keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.55}100%{transform:translateY(-82vh);opacity:0}}

/* ── 알림 ── */
#toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(var(--sab) + 82px);transform:translateY(20px);opacity:0;z-index:90;
  background:var(--tx);color:var(--bg);border-radius:14px;padding:0 6px 0 16px;min-height:46px;display:flex;align-items:center;gap:10px;
  font-size:14px;max-width:calc(100% - 32px);transition:transform .3s var(--ease),opacity .25s;pointer-events:none;box-shadow:0 10px 30px -8px var(--shadow-color)}
#toast.on{opacity:1;transform:none;pointer-events:auto}
#toast button{flex-shrink:0;white-space:nowrap;height:36px;padding:0 12px;border-radius:10px;font-weight:600;color:#7a5a22}
html[data-mode="light"] #toast button{color:#e7c98f}
#toast .msg{padding:12px 4px 12px 0}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <section class="view" id="v-today" aria-label="오늘 기도"></section>
  <section class="view" id="v-map" aria-label="기도 지도"></section>
  <section class="view" id="v-list" aria-label="목록"></section>
  <section class="view" id="v-hist" aria-label="기록"></section>
  <nav id="tabbar" aria-label="아래 메뉴">
    <button class="tb on" data-a="tab" data-tab="today"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="4"/><line x1="12" y1="3" x2="12" y2="5.5"/><line x1="4.5" y1="13" x2="2.5" y2="13"/><line x1="21.5" y1="13" x2="19.5" y2="13"/><line x1="6.3" y1="7.3" x2="5" y2="6"/><line x1="17.7" y1="7.3" x2="19" y2="6"/><line x1="3" y1="20" x2="21" y2="20"/></svg>오늘</button>
    <button class="tb" data-a="tab" data-tab="map"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="9" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="5" rx="1.5"/><rect x="3.5" y="15.5" width="7" height="5" rx="1.5"/><rect x="13.5" y="11.5" width="7" height="9" rx="1.5"/></svg>지도</button>
    <button class="tb" data-a="tab" data-tab="list"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>목록</button>
    <button class="tb" data-a="tab" data-tab="hist"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>기록</button>
  </nav>
  <div id="layers"></div>
</div>
<div id="focus" class="focus" role="dialog" aria-label="한 장씩 기도하기"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
// ═══════════════════════════════════════════════════════════
//  기도노트 화면
// ═══════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ICONS = {
  x: '<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>',
  chev: '<polyline points="6 9 12 15 18 9"/>',
  chevR: '<polyline points="9 6 15 12 9 18"/>',
  check: '<polyline points="5 12.5 10 17 19 7.5"/>',

  } else {

  pids.forEach(pid => { if (seen.has(pid) || (exclude && exclude.has(pid))) return; seen.add(pid); const p = findT(DB, pid); if (p) names.push(p.name); });

function mapSource(snap) {

    G: snap.G, marks: snap.marks || {}, live: false,
    person: pid => snap.P[pid] || null,
    kids: gid => snap.G.filter(g => g.parent === gid),
    tops: () => snap.G.filter(g => !g.parent || !snap.G.some(x => x.id === g.parent))
  };
  return {
    G: DB.G, marks: DB.marks, live: true,
    person: pid => findT(DB, pid),
    kids: gid => childrenOf(DB, gid),
    tops: () => topGroups(DB)

}
function mapCards(src, opt) {
  const q = (opt && opt.q || '').trim(), filt = opt && opt.filter;
  const hc = g => { const s = new Set(groupPids(g)); src.kids(g.id).forEach(c => groupPids(c).forEach(p => s.add(p))); return s.size; };
  const tops = src.live ? mapTops() : src.tops();
  const edKey = src.live && UI.mapEdit ? UI.mapEdit.key : '';
  const selAttr = k => src.live ? ' data-sel="' + k + '"' + (UI.sel === k ? ' aria-selected="true"' : '') : '';
  const selCls = k => src.live && UI.sel === k ? ' sel' : '';
  const editor = (k, v, ph) => '<input class="mapin" data-mapin="' + k + '" value="' + esc(v) + '" placeholder="' + esc(ph) + '" autocomplete="off" spellcheck="false" enterkeyhint="done">';
  const lineHTML = (l, gid) => {
    const k = gid ? 'l:' + gid + ':' + l.id : '';
    if (k && edKey === k) return '<div class="ln ined sel"' + selAttr(k) + '>' + editor(k, UI.mapEdit.isNew ? '' : lineToText(DB, l), '이름 — / 로 나누기 · Tab 다음 줄 · Enter 마침') + '</div>';
    if (l.text && !(l.segs || []).length) return '<div class="ln note' + selCls(k) + '"' + (k ? selAttr(k) : '') + '>' + esc(l.text) + '</div>';
    return '<div class="ln' + selCls(k) + '"' + (k ? selAttr(k) : '') + '>' + (l.segs || []).map(seg => seg.map(pid => {
      const p = src.person(pid); if (!p) return '';
      const role = l.r && l.r[pid];
      const cls = 'pn' + (p.mark === 'gray' ? ' rest' : '') + (role === '인도' ? ' lead' : '') +
        (filt && p.mark !== filt ? ' dim' : '') + (q && p.name.indexOf(q) >= 0 ? ' hit' : '');
      const style = p.mark && p.mark !== 'gray' ? ' style="--pc:' + markVar(p.mark) + '"' : '';
      const inner = (role && role !== '인도' ? '<span class="role">' + esc(role) + '</span>' : '') + esc(p.name);
      return src.live ? '<button class="' + cls + '"' + style + ' data-a="open" data-id="' + pid + '">' + inner + '</button>'
                      : '<span class="' + cls + '"' + style + '>' + inner + '</span>';
    }).join(' ')).join(' <span class="sep">/</span> ') + '</div>';
  };
  // 시트에서는 한 칸에 한 사람씩 세로로 적힌 줄이 많다(조명팀 · 키즈모아). 지도에서는
  // 한 사람만 든 줄이 이어지면 한 줄로 흘려 보여 카드가 길어지지 않게 한다.
  const solo = l => !(l.text && !(l.segs || []).length) && (l.segs || []).length === 1 && l.segs[0].length === 1;
  // ⚠️ 키보드로 고치는 PC(마우스)에서는 줄을 하나하나 둔다 — 한 줄로 흘리면 줄 단위로 고르고 옮길 수 없다

    if (src.live) return ls.map(l => lineHTML(l, gid)).join('');

    ls.forEach(l => { if (solo(l)) run.push(l); else { flush(); out += lineHTML(l); } });
    flush();
    return out;
  };
  return '<div class="masonry">' + tops.map(g => {
    const kids = src.kids(g.id);
    const gk = 'g:' + g.id;
    const head = edKey === gk ? '<div class="gh sel"' + selAttr(gk) + '>' + editor(gk, UI.mapEdit.isNew ? '' : g.name, '묶음 이름') + '</div>'

        (src.live ? '</button><button class="madd on-gh" data-a="map-add" data-k="line" data-id="' + g.id + '" aria-label="' + esc(g.name) + '에 줄 더하기">+</button></div>' : '</div>');
    return '<div class="gcard" style="--gc:' + esc(g.color) + '">' + head +
      '<div class="gb">' + linesHTML(g.lines || [], g.id) +
      kids.map(k => {
        const kk = 'g:' + k.id;
        if (edKey === kk) return '<div class="sgh sel"' + selAttr(kk) + '>' + editor(kk, UI.mapEdit.isNew ? '' : k.name, '작은 묶음 이름') + '</div>' + linesHTML(k.lines || [], k.id);
        return (src.live ? '<div class="sghw"><button class="sgh' + selCls(kk) + '"' + selAttr(kk) + ' data-a="open-group" data-id="' + k.id + '">' : '<div class="sgh">') + esc(k.name) +
        (k.days && k.days.length ? '<span class="dt">' + k.days.map(d => WEEK[d]).join('·') + (k.time ? ' ' + esc(k.time) : '') + '</span>' : '') +
        (src.live ? '</button><button class="madd" data-a="map-add" data-k="line" data-id="' + k.id + '" aria-label="' + esc(k.name) + '에 줄 더하기">+</button></div>' : '</div>') + linesHTML(k.lines || [], k.id);
      }).join('') +
      (src.live ? '<button class="madd-sub" data-a="map-add" data-k="sub" data-id="' + g.id + '">+ 작은 묶음</button>' : '') +
      '</div></div>';
  }).join('') + (src.live ? '<button class="gcard madd-group" data-a="map-add" data-k="group">+ 묶음</button>' : '') + '</div>';
}

function renderCal() {

  let total = 0, secs = 0;
  let g = WEEK.map(w => '<span class="cal-w">' + w + '</span>').join('');
  for (let k = 0; k < first.getDay(); k++) g += '<span class="cal-d x"></span>';
  for (let d = 1; d <= days; d++) {
    const ds = y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');

function topLayerEl() { const els = [...$('layers').children].filter(e => !e.classList.contains('out')); return els[els.length - 1] || null; }
function pushLayer(L) {
  // 상세(사람·항목·묶음)는 열 때의 모습을 기억해 둔다 → '취소' 로 되돌린다
  if (L.type === 'target' || L.type === 'group') L.snap = JSON.stringify(DB);
  UI.layers.push(L);
  $('layers').classList.add('has');
  const el = document.createElement('div');
  el.className = 'layer';
  $('layers').appendChild(el);
  fillLayer(el, L);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
}
function popLayer() {
  const el = topLayerEl(); if (!el) return;
  UI.layers.pop();
  if (!UI.layers.length) $('layers').classList.remove('has');
  el.classList.remove('in'); el.classList.add('out');
  setTimeout(() => el.remove(), 360);
  refresh({ skipTopEl: el });
}
function liveLayerEls() { return [...$('layers').children].filter(e => !e.classList.contains('out')); }
function fillLayer(el, L) {
  const fn = LAYERS[L.type];
  if (!fn) return;
  const r = fn(L);
  if (r === null) { return; }
  const body = el.querySelector('.lbody'), top = body ? body.scrollTop : 0;
  el.innerHTML = '<div class="lhead">' + (r.menu ? '<button class="ib" data-a="' + r.menu + '" aria-label="메뉴">' + ico('dots') + '</button>' : '<span style="width:44px"></span>') +
    '<div class="lh-title">' + esc(r.title) + '</div><button class="ib lh-x" data-a="pop" aria-label="닫기">' + ico('x') + '</button></div>' +
    '<div class="lbody">' + r.body + '</div>' +
    (L.snap ? '<div class="lfoot"><button class="ghost" data-a="layer-cancel">취소</button><button class="cta" data-a="layer-ok">확인</button></div>' : '');
  const nb = el.querySelector('.lbody'); if (nb) nb.scrollTop = top;
}
function refreshLayers(skipTop) {
  const els = liveLayerEls();

}

  if (k === 'target') { const t = findT(DB, id); if (t) go(t.name + ' 을(를) 지웠습니다', () => removeTarget(DB, id)); }
  else if (k === 'group') { const g = findG(DB, id); if (g) go(g.name + ' 묶음을 지웠습니다', () => removeGroup(DB, id)); }
  else if (k === 'topic') { const t = findAny(DB, el.dataset.tid); if (t) go('기도제목을 지웠습니다', () => { t.topics = t.topics.filter(x => x.id !== id); }); }
  else if (k === 'line') { const g = findG(DB, el.dataset.gid); if (g) go('줄을 지웠습니다', () => { g.lines = g.lines.filter(x => x.id !== id); }); }
  else if (k === 'snap') go('판을 지웠습니다', () => { DB.snaps = DB.snaps.filter(s => s.id !== id); });
  else if (k === 'cats') { const c = DB.cats.find(x => x.id === id); if (c) go(c.name + ' 구분을 지웠습니다', () => { DB.cats = DB.cats.filter(x => x.id !== id); DB.T.forEach(t => { if (t.cat === id) t.cat = ''; }); }); }
  else if (k === 'subcats') { const c = DB.subs.find(x => x.id === id); if (c) go(c.name + ' 분류를 지웠습니다', () => { DB.subs = DB.subs.filter(x => x.id !== id); DB.T.forEach(t => { if (t.sub === id) t.sub = ''; }); }); }

['pointerup', 'pointercancel'].forEach(n => document.addEventListener(n, () => { clearTimeout(LP.t); LP.t = 0; }));
document.addEventListener('contextmenu', e => {
  const s = e.target.closest('#v-map [data-sel]'); if (!s) return;

// 고치는 칸 밖을 누르면 그대로 적고 마친다
document.addEventListener('focusout', e => {
  const el = e.target;
  if (!(el && el.dataset && el.dataset.mapin) || !UI.mapEdit) return;
  setTimeout(() => { if (UI.mapEdit && UI.mapEdit.key === el.dataset.mapin && document.activeElement !== el) { mapCommit(el.value); mapRender(); } }, 0);
});

// ═══ 손짓: 왼쪽 스와이프(지우기·내일로) · 길게 눌러 끌기(순서) · 가장자리 끌기(뒤로) · 창 끌어 닫기 ═══
const GS = { st: null, suppress: 0, openRow: null };
function closeOpenRow(except) {
  const r = GS.openRow;
  if (r && r !== except) { const f = r.querySelector('.row-f'); if (f) f.style.transform = ''; r.classList.remove('open'); GS.openRow = null; }
}
function actsWidth(row) { const a = row.querySelector('.sw-acts'); return a ? a.scrollWidth : 0; }
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (e.target.closest('input,textarea,select,.sw-act')) return;
  const grab = e.target.closest('.sh-grab');
  if (grab && SHEET) { GS.st = { mode: 'sheet', sheet: grab.parentElement, y0: e.clientY, pid: e.pointerId, dy: 0 }; grab.parentElement.classList.add('drag'); return; }
  const layer = e.target.closest('.layer');
  if (layer && e.clientX < 24 && layer === topLayerEl()) { GS.st = { mode: 'edge-p', layer: layer, x0: e.clientX, y0: e.clientY, pid: e.pointerId }; return; }
  const row = e.target.closest('.row');
  if (!row) { closeOpenRow(); return; }
  if (GS.openRow && GS.openRow !== row) closeOpenRow();
  const list = row.parentElement && row.parentElement.matches('[data-sort]') ? row.parentElement : null;
  const st = { mode: 'pend', row: row, list: list, x0: e.clientX, y0: e.clientY, y: e.clientY, pid: e.pointerId,
               sw: row.dataset.sw === '1', base: row.classList.contains('open') ? -actsWidth(row) : 0 };
  if (list) st.timer = setTimeout(() => startDrag(st), 420);
  GS.st = st;
}, { passive: true });
document.addEventListener('pointermove', e => {
  const st = GS.st; if (!st || e.pointerId !== st.pid) return;
  const dx = e.clientX - (st.x0 || 0), dy = e.clientY - st.y0;
  if (st.mode === 'sheet') { st.dy = Math.max(0, dy); st.sheet.style.transform = 'translateY(' + st.dy + 'px)'; return; }
  if (st.mode === 'edge-p') { if (dx > 10 && Math.abs(dx) > Math.abs(dy)) { st.mode = 'edge'; st.layer.classList.add('edge'); } else if (Math.abs(dy) > 10 || dx < -10) GS.st = null; return; }
  if (st.mode === 'edge') { e.preventDefault(); st.layer.style.transform = 'translateX(' + Math.max(0, dx) + 'px)'; return; }
  if (st.mode === 'pend') {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    clearTimeout(st.timer);
    if (st.sw && Math.abs(dx) > Math.abs(dy) * 1.15 && (dx < 0 || st.base < 0)) { st.mode = 'swipe'; st.row.classList.add('swiping'); st.w = actsWidth(st.row); st.x = st.base; }
    else { GS.st = null; return; }
  }

    e.preventDefault();
    let x = st.base + dx;
    if (x > 0) x = x * 0.25;
    st.x = x;
    st.row.querySelector('.row-f').style.transform = 'translateX(' + x + 'px)';
    return;
  }

function endGesture(e, cancel) {

    GS.suppress = Date.now(); return;

    st.layer.classList.remove('edge');
    const dx = e ? e.clientX - st.x0 : 0;
    st.layer.style.transform = '';
    if (!cancel && dx > st.layer.offsetWidth * 0.28) popLayer();

  }
  if (st.mode === 'swipe') {
    GS.suppress = Date.now();
    st.row.classList.remove('swiping');
    const f = st.row.querySelector('.row-f'), full = st.row.offsetWidth;
    if (!cancel && st.x < -full * 0.55) {
      f.style.transform = 'translateX(' + (-full) + 'px)';
      const btn = st.row.querySelector('.sw-act'); setTimeout(() => { if (btn) doAct(btn); }, 140);
    } else if (!cancel && st.x < -st.w * 0.45) { f.style.transform = 'translateX(' + (-st.w) + 'px)'; st.row.classList.add('open'); GS.openRow = st.row; }
    else { f.style.transform = ''; st.row.classList.remove('open'); if (GS.openRow === st.row) GS.openRow = null; }
    return;

document.addEventListener('pointerup', e => endGesture(e, false));
document.addEventListener('pointercancel', e => endGesture(e, true));
// iOS: 끌기·스와이프 중에는 화면이 같이 움직이지 않게 (passive:false 여야 막힌다)
document.addEventListener('touchmove', e => { const st = GS.st; if (st && (st.mode === 'drag' || st.mode === 'swipe' || st.mode === 'edge' || st.mode === 'sheet')) e.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', e => { if (e.target.closest('.row')) e.preventDefault(); });

function startDrag(st) {
  if (GS.st !== st || st.mode !== 'pend') return;
  const rows = [...st.list.children].filter(r => r.classList.contains('row'));
  if (rows.length < 2) return;
  st.mode = 'drag';
  closeOpenRow();
  st.rows = rows; st.from = rows.indexOf(st.row); st.to = st.from;
  st.rects = rows.map(r => r.getBoundingClientRect());
  st.h = st.rects[st.from].height;
  st.scroller = st.row.closest('.view,.lbody,.sh-b');
  st.sc0 = st.scroller ? st.scroller.scrollTop : 0;
  st.row.classList.add('lifted');
  rows.forEach(r => { if (r !== st.row) r.classList.add('shift'); });
  document.body.classList.add('dragging');
  if (navigator.vibrate) navigator.vibrate(12);
  const tick = () => {
    if (GS.st !== st || st.mode !== 'drag') return;
    const sc = st.scroller;
    if (sc) {
      const r = sc.getBoundingClientRect(); let v = 0;
      if (st.y < r.top + 70) v = -Math.ceil((r.top + 70 - st.y) / 6);
      else if (st.y > r.bottom - 150) v = Math.ceil((st.y - (r.bottom - 150)) / 6);
      if (v) sc.scrollTop += v;
    }
    const scd = sc ? sc.scrollTop - st.sc0 : 0;
    const dy = st.y - st.y0 + scd;
    st.row.style.transform = 'translateY(' + dy + 'px)';
    const center = st.rects[st.from].top + st.h / 2 + dy;
    let to = st.from;
    for (let k = 0; k < st.from; k++) { if (center < st.rects[k].top + st.rects[k].height / 2) { to = k; break; } }
    if (to === st.from) for (let k = st.rows.length - 1; k > st.from; k--) { if (center > st.rects[k].top + st.rects[k].height / 2) { to = k; break; } }
    if (to !== st.to) {
      st.to = to;
      st.rows.forEach((r, k) => {
        if (r === st.row) return;
        let off = 0;
        if (st.from < st.to && k > st.from && k <= st.to) off = -st.h;
        else if (st.from > st.to && k >= st.to && k < st.from) off = st.h;
        r.style.transform = off ? 'translateY(' + off + 'px)' : '';
      });
      if (navigator.vibrate) navigator.vibrate(5);

  };

}
function dropDrag(st, cancel) {
  cancelAnimationFrame(st.raf);
  let off = 0;
  if (!cancel && st.to !== st.from) {
    if (st.to > st.from) for (let k = st.from + 1; k <= st.to; k++) off += st.rects[k].height;
    else for (let k = st.to; k < st.from; k++) off -= st.rects[k].height;
  }
  st.row.style.transition = 'transform .2s var(--ease)';
  st.row.style.transform = cancel || st.to === st.from ? '' : 'translateY(' + off + 'px)';
  if (cancel || st.to === st.from) st.rows.forEach(r => { if (r !== st.row) r.style.transform = ''; });
  setTimeout(() => {
    document.body.classList.remove('dragging');
    st.rows.forEach(r => { r.classList.remove('shift', 'lifted'); r.style.transform = ''; r.style.transition = ''; });
    if (!cancel && st.to !== st.from) {
      const shown = st.rows.map(r => r.dataset.id);
      onSorted(st.list.dataset.sort, moveInArray(shown, st.from, st.to), shown);
    }
  }, 210);
}
function reorderSubset(arr, ids) {
  const pos = [], set = new Set(ids);
  arr.forEach((x, k) => { if (set.has(x.id)) pos.push(k); });
  const byId = {}; arr.forEach(x => { byId[x.id] = x; });
  const out = arr.slice();
  ids.forEach((id, k) => { if (pos[k] != null) out[pos[k]] = byId[id]; });
  return out;
}
function onSorted(key, ids, shown) {
  const [kind, arg] = key.split(':');
  if (kind === 'today') {
    DB.set.ranks.today = applyRanks(DB.set.ranks.today || {}, shown, ids);
    if (DB.set.sorts.today !== 'mine') { DB.set.sorts.today = 'mine'; toast('오늘 목록을 \'내 순서\' 로 바꿨습니다'); }
  } else if (kind === 'list') {
    DB.set.ranks.list = applyRanks(DB.set.ranks.list || {}, shown, ids);
    if (DB.set.sorts.list !== 'mine') { DB.set.sorts.list = 'mine'; toast('목록을 \'내 순서\' 로 바꿨습니다'); }
  } else if (kind === 'topics') { const t = findAny(DB, arg); if (t) t.topics = reorderSubset(t.topics, ids); }
  else if (kind === 'lines') { const g = findG(DB, arg); if (g) g.lines = reorderSubset(g.lines, ids); }
  else if (kind === 'subs' || kind === 'groups') { DB.G = reorderSubset(DB.G, ids); if (kind === 'groups') DB.set.sorts.map = 'mine'; }
  else if (kind === 'cats') DB.cats = reorderSubset(DB.cats, ids);
  else if (kind === 'subcats') DB.subs = reorderSubset(DB.subs, ids);
  else if (kind === 'snaps') { DB.snaps = reorderSubset(DB.snaps, ids); DB.set.sorts.snaps = 'mine'; }
  else if (kind === 'answers') { DB.set.ranks.answers = applyRanks(DB.set.ranks.answers || {}, shown, ids); DB.set.sorts.answers = 'mine'; }
  save(); refresh();
}

document.addEventListener('click', e => {
  if (Date.now() - GS.suppress < 400) { e.preventDefault(); e.stopPropagation(); return; }
  const el = e.target.closest('[data-a]');
  if (GS.openRow) {
    const inOpen = GS.openRow.contains(e.target);
    if (!(el && el.classList.contains('sw-act') && inOpen)) { closeOpenRow(); e.preventDefault(); e.stopPropagation(); return; }
  }
  if (!el) return;
  doAct(el, e);
}, true);
