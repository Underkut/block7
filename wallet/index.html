<!DOCTYPE html>
<!-- 용돈 친구들 v. 26-1008-10 — BLOCK7 과 별개인 독립 앱 (wallet/) -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffe3ee">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<title>용돈 친구들</title>
<style>
:root{
  --ink:#4a3b6b; --sub:#9a8cb5;
  --pink:#ff6fa5; --pink-d:#d9467f; --green:#3cc98a; --green-d:#209a63; --orange:#ffa63d; --orange-d:#d97d10;
  --blue:#5aa9ff; --blue-d:#2f7fd9; --yellow:#ffd84d; --yellow-d:#e0a900; --purple:#9b7bff; --purple-d:#6d4fd6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{font-family:'Jua','Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#ffe3ee 0%,#e6f1ff 55%,#e9fbf1 100%);overflow:hidden;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
.view{display:none;flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 120px}
.view.on{display:block;animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 큰 둥근 버튼 */
.gb{--c:var(--pink);--d:var(--pink-d);display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--c);color:#fff;border-radius:22px;padding:16px 14px;font-size:22px;letter-spacing:.02em;
  box-shadow:0 6px 0 var(--d);text-shadow:0 2px 0 rgba(0,0,0,.12);transition:transform .08s,box-shadow .08s}
.gb:active{transform:translateY(5px);box-shadow:0 1px 0 var(--d)}
.gb.green{--c:var(--green);--d:var(--green-d)} .gb.orange{--c:var(--orange);--d:var(--orange-d)}
.gb.blue{--c:var(--blue);--d:var(--blue-d)} .gb.purple{--c:var(--purple);--d:var(--purple-d)}
.gb.gray{--c:#c9c0dc;--d:#a79dc2}
.gb[disabled]{opacity:.45;pointer-events:none}
.gb.sm{font-size:17px;padding:11px 12px;border-radius:18px;box-shadow:0 4px 0 var(--d)}
.card{background:#fff;border-radius:26px;box-shadow:0 6px 0 rgba(120,90,170,.14)}

/* 홈 */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.logo{font-size:20px;color:var(--pink-d)}
.iconbtn{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 0 rgba(120,90,170,.18);color:var(--purple)}
.topbtns{display:flex;gap:10px}
.iconbtn.off{color:#b9aed6}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(120,90,170,.18)}
.hero{position:relative;padding:14px 16px 16px;text-align:center;margin-bottom:16px}
.bubble{position:relative;display:inline-block;background:#fff8d6;border:3px solid var(--yellow);border-radius:20px;padding:8px 14px;font-size:16px;line-height:1.4;margin-bottom:12px;max-width:92%}
.bubble:after{content:"";position:absolute;left:50%;bottom:-13px;margin-left:-10px;border:10px solid transparent;border-top-color:var(--yellow);border-bottom:0}
.pigwrap{width:190px;margin:6px auto 0;position:relative}
.pigwrap svg{width:100%;display:block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1.5deg)}}
.coindrop{position:absolute;left:50%;top:-8px;width:34px;margin-left:-6px;animation:drop 2.4s ease-in infinite}
@keyframes drop{0%{transform:translateY(-6px) scale(.9);opacity:0}15%{opacity:1}60%{transform:translateY(30px) scale(1)}70%,100%{transform:translateY(40px) scale(.2);opacity:0}}
.money{font-size:50px;color:var(--pink-d);line-height:1;margin-top:8px;text-shadow:0 3px 0 #ffd3e4}
.money small{font-size:22px;margin-left:2px}
.moneylbl{font-size:15px;color:var(--sub);margin-top:4px}
.pendchip{display:inline-block;margin-top:8px;background:#e8f7ee;color:var(--green-d);border-radius:14px;padding:4px 12px;font-size:15px}
.pendchip:empty{display:none}
.two{display:flex;gap:12px;margin-bottom:12px}
.cta{display:flex;align-items:center;gap:12px;padding:12px 16px;margin:14px 0 16px;width:100%;text-align:left;
  background:linear-gradient(135deg,#9b7bff,#6aa9ff);color:#fff;border-radius:26px;box-shadow:0 6px 0 var(--purple-d);animation:wob 2.6s ease-in-out infinite}
.cta:active{transform:translateY(5px);box-shadow:0 1px 0 var(--purple-d)}
@keyframes wob{0%,100%{transform:rotate(0)}4%{transform:rotate(-1.4deg)}8%{transform:rotate(1.4deg)}12%{transform:rotate(0)}}
.cta .t{font-size:21px;text-shadow:0 2px 0 rgba(0,0,0,.15)} .cta .s{font-size:14px;opacity:.95}
.cta .f{width:62px;flex:none}
.sec{font-size:16px;color:var(--sub);margin:4px 6px 8px}

/* 아바타·기록 */
.av{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;border:3px solid #fff;box-shadow:0 3px 0 rgba(120,90,170,.15)}
.av svg{width:84%;height:84%}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px 10px 10px;margin-bottom:10px}
.row .mid{flex:1;min-width:0}.row .t{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--sub)}.row .a{font-size:20px;white-space:nowrap}
.in{color:var(--green-d)}.out{color:var(--pink-d)}
.mon{display:flex;align-items:center;justify-content:center;gap:16px;margin:4px 0 8px;font-size:22px}
.mon button{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--purple);box-shadow:0 4px 0 rgba(120,90,170,.18)}
.msum{text-align:center;font-size:15px;color:var(--sub);margin-bottom:12px}
.day{font-size:14px;color:var(--sub);margin:12px 6px 6px}
.empty{text-align:center;color:var(--sub);padding:30px 10px;font-size:17px;line-height:1.6}
.empty svg{width:96px;display:block;margin:0 auto 8px}

/* 계획세우기 */
.allochead{padding:14px 16px;margin-bottom:12px}
.free{display:flex;align-items:center;gap:10px}
.free .f{width:54px;flex:none}
.free .l{font-size:15px;color:var(--sub)} .free .v{font-size:32px;color:var(--pink-d);line-height:1.1}
.free .v.zero{color:var(--green-d)} .free .v.bad{color:#d9462f}
.free .x{font-size:13px;color:var(--green-d);margin-top:2px}
.warnchip{background:#fff3d6;border-radius:14px;padding:6px 12px;font-size:14px;margin-top:10px;color:#9a6a00;line-height:1.4}
.stack{position:relative;display:flex;height:16px;border-radius:9px;overflow:hidden;background:#efe9fb;margin-top:12px}
.stack i{position:relative;z-index:1;display:block;height:100%;transition:width .3s}
.stack b{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(45deg,#d6f3e2 0 6px,#bfe9d1 6px 12px)}
.hint{padding:14px;margin-bottom:12px;text-align:center;font-size:17px;line-height:1.5}
.hint .two{margin:12px 0 0}
.expcard{padding:12px 14px;margin-bottom:12px}
.exh{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:18px}
.exh small{display:block;font-size:13px;color:var(--sub)}
.sw{width:54px;height:32px;border-radius:16px;background:#d9ceee;position:relative;flex:none;transition:background .18s}
.sw i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15);transition:left .18s}
.sw.on{background:var(--green)} .sw.on i{left:25px}
.er{background:#f7f3ff;border-radius:18px;padding:10px;margin-top:10px}
.er .r1{display:flex;align-items:center;gap:10px}
.er .mid{flex:1;min-width:0}.er .t{font-size:17px}.er .s{font-size:13px;color:var(--sub)}.er .s.late{color:#d9462f}
.er .a{font-size:19px;color:var(--green-d);white-space:nowrap}
.er .eb{display:flex;gap:8px;margin-top:8px}
.er .eb .gb{flex:1}
.steps{display:flex;gap:8px;align-items:center;margin:0 0 12px;font-size:15px;color:var(--sub)}
.steps button{flex:1;background:#fff;border-radius:16px;padding:8px 0;font-size:17px;color:var(--purple);box-shadow:0 4px 0 rgba(120,90,170,.16)}
.steps button.on{background:var(--purple);color:#fff;box-shadow:0 4px 0 var(--purple-d)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ac{position:relative;padding:12px 10px 12px;text-align:center;background:var(--bg,#fff);border-radius:26px;box-shadow:0 6px 0 rgba(120,90,170,.16)}
.ac .face{display:block;width:68px;margin:0 auto}.ac .face svg{width:100%;display:block}
.ac.bounce .face{animation:jump .4s}
@keyframes jump{30%{transform:translateY(-12px) scale(1.08)}60%{transform:translateY(0) scale(.96)}}
.ac .nm{display:inline-flex;align-items:center;gap:4px;font-size:18px;margin-top:2px;max-width:100%}
.ac .nm svg{width:13px;height:13px;color:#a79dc2;flex:none}
.ac .amt{display:block;font-size:26px;color:var(--ink);background:rgba(255,255,255,.75);border-radius:14px;margin:6px 4px 2px;padding:3px 0;width:calc(100% - 8px)}
.ac .amt.pop{animation:pop .3s}
@keyframes pop{40%{transform:scale(1.15)}}
.ac .amt.neg{color:var(--pink-d);font-size:20px;padding:7px 0}
.ac .sub{font-size:12px;color:#7d6fa0;min-height:16px}
.pm{display:flex;gap:8px;margin-top:6px;justify-content:center}
.pm button{width:56px;height:46px;border-radius:16px;font-size:30px;line-height:1;color:#fff;display:grid;place-items:center;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.pm .m{background:#b9aed6;box-shadow:0 4px 0 #9487b8}.pm .p{background:var(--green);box-shadow:0 4px 0 var(--green-d)}
.pm button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.ac.add{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;border:3px dashed #cdbdf0;box-shadow:none;color:var(--purple);min-height:200px;font-size:18px}
.ac.add .plus{font-size:50px;line-height:1}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.ac.ph{opacity:.3;outline:3px dashed var(--purple);outline-offset:-3px}
.ac.land{animation:land .45s}
@keyframes land{0%{transform:scale(1.12)}45%{transform:scale(.94)}100%{transform:scale(1)}}
.ac.land .face{animation:jump .4s}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;box-shadow:0 20px 34px rgba(74,59,107,.38);will-change:transform;opacity:.98}
.ghost .pm{visibility:hidden}
#trash{position:fixed;top:0;left:0;right:0;max-width:520px;margin:0 auto;height:calc(env(safe-area-inset-top) + 66px);padding-top:env(safe-area-inset-top);
  display:flex;align-items:center;justify-content:center;gap:10px;font-size:19px;color:#fff;background:linear-gradient(#ff9aa9,#ff6c85);
  border-radius:0 0 26px 26px;transform:translateY(-110%);transition:transform .22s cubic-bezier(.2,1.2,.4,1),background .15s;z-index:45;box-shadow:0 8px 18px rgba(255,90,120,.35);pointer-events:none}
#trash.on{transform:none} #trash.hot{background:linear-gradient(#ff5a78,#e0244b)}
#trash svg{width:30px;height:30px;transition:transform .15s}
#trash.hot svg{transform:scale(1.3) rotate(-8deg)} #trash.hot span:before{content:"놓으면 지워요!"} #trash:not(.hot) span:before{content:"여기로 끌면 지워요"}
.sp{position:fixed;z-index:60;pointer-events:none;font-size:20px;color:#ffc61a;animation:spark .65s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2) rotate(180deg);opacity:0}}
body.dragging,body.dragging *{cursor:grabbing!important}
body.dragging .toast{opacity:0!important}
.seg2{display:flex;gap:6px;background:#efe9fa;border-radius:20px;padding:4px;margin:0 0 10px}
.seg2 button{flex:1;padding:9px 0;border-radius:16px;font-size:17px;color:var(--sub)}
.seg2 button.on{background:#fff;color:var(--purple);box-shadow:0 2px 0 rgba(120,90,170,.18)}
.goal{padding:14px;margin-bottom:12px}
.goal .t1{display:flex;align-items:center;gap:10px}
.goal .ico,.donecard .ico2{width:62px;height:62px;border-radius:20px;flex:none;overflow:hidden;display:grid;place-items:center}
.goal .ico svg,.donecard .ico2 svg{width:100%;display:block}
.goal .ico img,.donecard .ico2 img,.gprev img{width:100%;height:100%;object-fit:cover;display:block}
.goal .gtx{flex:1;min-width:0;text-align:left}
.goal .nm{font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal .pr{font-size:15px;color:var(--sub)}
.goal .row2{display:flex;justify-content:space-between;margin:10px 2px 4px;font-size:15px;color:var(--sub)}
.goal .row2 b{color:var(--ink)}
.goal .hint{font-size:14px;color:var(--sub);margin:6px 2px 0;text-align:left;padding:0;background:none;box-shadow:none;border-radius:0}
.pmr2{display:flex;gap:6px}
.pmr2 button{width:46px;height:42px;border-radius:14px;font-size:26px;line-height:1;color:#fff;display:grid;place-items:center}
.pmr2 .m{background:#b9aed6;box-shadow:0 4px 0 #9487b8}.pmr2 .p{background:var(--green);box-shadow:0 4px 0 var(--green-d)}
.pmr2 button:active{transform:translateY(3px);box-shadow:none}
.gauge{height:14px;border-radius:8px;background:#efe9fa;overflow:hidden}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,#b79bff,#ff8ac0);border-radius:8px;transition:width .3s}
.gauge.g i{background:var(--green)}
.addgoal{display:block;width:100%;padding:14px;border:3px dashed #cfc3ea;border-radius:22px;color:var(--purple);font-size:18px;margin-bottom:6px}
.donecard{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:8px;padding:10px 14px}
.donecard .ico2{width:48px;height:48px;border-radius:16px}
.gprev{width:110px;height:110px;border-radius:30px;margin:6px auto 8px;overflow:hidden;display:grid;place-items:center}
.gprev svg{width:100%;display:block}
.gsrc{display:flex;gap:6px;margin:4px 0 6px}
.gsrc button{flex:1;padding:8px 2px;border-radius:14px;background:#fff;font-size:15px;color:var(--purple);box-shadow:0 3px 0 #d9ceee}
.gsrc button.on{background:var(--purple);color:#fff;box-shadow:0 3px 0 var(--purple-d)}
.gfile{display:block;text-align:center;position:relative;overflow:hidden}
.gfile input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.av img{width:100%;height:100%;object-fit:cover;display:block}
#lvCard{margin-bottom:12px}
.lvbtn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;background:#fff;border-radius:26px;box-shadow:0 6px 0 rgba(120,90,170,.14);text-align:left}
.lvb{background:linear-gradient(135deg,#9b7bff,#6aa9ff);color:#fff;border-radius:16px;padding:8px 10px;font-size:18px;box-shadow:0 3px 0 #6d4fd6;flex:none}
.lvbtn .xp{flex:1;min-width:0}.lvbtn .lvt{font-size:17px}.lvbtn small{font-size:12px;color:var(--sub)}
.lvbtn .gauge{height:10px;margin:4px 0 3px}
.stk{text-align:center;font-size:12px;color:var(--sub);flex:none}.stk b{display:block;font-size:22px;color:#ffa63d;font-weight:400}
.chkcard{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;padding:10px 14px;border-radius:22px;background:linear-gradient(135deg,#fff3d9,#ffe3ef);box-shadow:0 5px 0 rgba(255,166,61,.25);animation:wob 2.8s infinite}
.chkcard .f{width:42px;flex:none}.chkcard .f svg{width:100%;display:block}.chkcard .t{font-size:18px}.chkcard .s{font-size:13px;color:var(--sub)}.chkcard .go{font-size:26px;color:#ffa63d}
.cq{margin:8px 0 12px}.cq .qt{font-size:18px;margin-bottom:6px}
.qb{display:flex;flex-direction:column;gap:6px}
.qb button{padding:11px 10px;border-radius:16px;background:#fff;font-size:16px;color:var(--purple);box-shadow:0 3px 0 #d9ceee}
.qb button.on{background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-d)}.qb button.on.no{background:#b9aed6;box-shadow:0 3px 0 #9487b8}
.lvlist{display:grid;gap:4px;margin:8px 0 12px}
.lvlist div{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:14px;background:#f7f3ff;font-size:15px}
.lvlist div b{font-weight:400;color:var(--purple);width:46px}.lvlist div span{flex:1}.lvlist div small{color:var(--sub)}
.lvlist div.on{background:var(--purple);color:#fff}.lvlist div.on b,.lvlist div.on small{color:#fff}.lvlist div.lock{opacity:.55}
.smallnote{text-align:center;color:var(--sub);font-size:14px;margin:14px 0 4px}
.linkbtn{display:block;margin:10px auto 0;color:var(--sub);font-size:14px;text-decoration:underline;padding:8px}

.acseg{display:flex;gap:8px;margin:0 0 8px}
.acseg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 6px;border-radius:16px;background:#fff;font-size:15px;color:var(--sub);box-shadow:0 4px 0 #d9ceee}
.acseg button svg{width:24px;height:24px;flex:none}
.acseg button.on{background:var(--purple);color:#fff;box-shadow:0 4px 0 var(--purple-d)}
.aclabel{font-size:13px;color:var(--sub);text-align:center;margin:6px 0 4px}
.assets{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.ap{display:flex;align-items:center;gap:6px;background:#f7f3ff;border-radius:16px;padding:6px 12px;font-size:15px}
.ap svg{width:22px;height:22px}.ap b{font-weight:400;color:var(--ink)}.ap b.neg{color:#d9462f}
.acctabs{display:flex;gap:10px;margin-bottom:12px}
.at{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:22px;background:#fff;box-shadow:0 5px 0 rgba(120,90,170,.16);color:var(--sub);font-size:15px}
.at svg{width:30px;height:30px}.at b{font-weight:400;font-size:17px;color:var(--ink)}
.at.on{background:var(--purple);color:#fff;box-shadow:0 5px 0 var(--purple-d)}.at.on b{color:#fff}
.mvc{color:var(--blue-d)}
/* 대시보드 */
.dash{margin-bottom:12px;overflow:hidden}
.dh{display:flex;align-items:center;gap:8px;width:100%;padding:14px 16px;font-size:19px;text-align:left}
.dsum{flex:1;text-align:right;font-size:13px;color:var(--sub)}
.dh .chev{width:22px;height:22px;color:var(--purple);margin-left:auto;transition:transform .2s;flex:none}
.dh .chev.up{transform:rotate(180deg)}
.dbody{padding:0 16px 14px;animation:fadeUp .25s ease}
.dt{font-size:14px;color:var(--sub);margin:10px 2px 6px}
.pie{display:flex;align-items:center;gap:14px}
.donut{width:128px;flex:none;transform:rotate(0)}
.leg{flex:1;min-width:0;font-size:14px}
.leg div{display:flex;align-items:center;gap:6px;margin:3px 0}
.leg i,.leg2 i{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.leg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg b{font-weight:400;color:var(--sub)}
.bars{width:100%;display:block}
.leg2{display:flex;gap:14px;justify-content:center;font-size:13px;color:var(--sub);margin-top:2px}
.leg2 span{display:inline-flex;align-items:center;gap:5px}
.ins{display:flex;gap:10px;align-items:flex-start;background:#f7f3ff;border-radius:16px;padding:9px 12px;margin-bottom:8px;font-size:15px;line-height:1.45}
.ins .f{width:30px;flex:none}.ins .f svg{width:100%;display:block}
.ins b{font-weight:400;color:var(--pink-d)}
.memolink{margin:2px auto 8px}
.memoin{margin:2px 0 12px;font-size:17px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f7f3ff;border-radius:18px;padding:8px 14px;margin-bottom:10px;font-size:18px}
.setrow>span{flex:1;min-width:0}
.sl{width:50%;flex:none;display:flex;align-items:center;gap:6px}

<script>
'use strict';
const APP_VERSION = "v. 26-1008-10";
const KEY = 'allowance.v1';      // 저장 키는 v1 그대로 — 모자란 칸은 불러올 때 migrate() 가 채운다
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = n => Number(n).toLocaleString('ko-KR');
const won = n => nf(n) + '원';
const buzz = ms => { try{ navigator.vibrate && navigator.vibrate(ms||12); }catch(e){} };


/* ───────── 소리 (파일 없이 휴대폰이 직접 만든다 — 저작권·용량 걱정 없음) ───────── */
let AC = null, SFXG = null, BGMG = null, PRVG = null;
const LVL = [0, .12, .3, .5, .75, 1];                       // 효과음 0~5단계 → 소리 크기
const BLVL = [0, .024, .056, .096, .16, .256];  // 배경음악: 3단계가 예전 1단계 소리(.096)
function applyVols(){ if(SFXG) SFXG.gain.value = LVL[S.sfxVol]; if(BGMG) BGMG.gain.value = BLVL[S.bgmVol]; if(PRVG) PRVG.gain.value = BLVL[S.bgmVol || 3]; }
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)();
      SFXG = AC.createGain(); SFXG.connect(AC.destination); BGMG = AC.createGain(); BGMG.connect(AC.destination); PRVG = AC.createGain(); PRVG.connect(AC.destination); applyVols(); }catch(e){ AC = null; return null; } }
  return AC;
}
// 휴대폰은 '손가락을 뗀 순간(터치 끝/클릭)'에만 소리를 허락한다 → 그때 깨운다
function unlockAudio(){
  const c = ac(); if(!c) return false;
  try{ if(navigator.audioSession && S.bgmVol>0) navigator.audioSession.type = 'playback'; }catch(e){}
  if(c.state!=='running') c.resume().catch(()=>{});
  try{ const b = c.createBuffer(1,1,22050), src = c.createBufferSource(); src.buffer = b; src.connect(c.destination); src.start(0); }catch(e){}
  return c.state==='running';
}
// 아이폰의 무음 스위치를 넘기 위한 '소리 없는 재생'(배경음악을 켰을 때만)
let keepEl = null;
function keepAudio(on){
  try{
    if(on){
      if(!keepEl){ const n = 2205, buf = new ArrayBuffer(44+n*2), v = new DataView(buf), w = (o,t) => { for(let i=0;i<t.length;i++) v.setUint8(o+i, t.charCodeAt(i)); };
        w(0,'RIFF'); v.setUint32(4,36+n*2,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,22050,true); v.setUint32(28,44100,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,n*2,true);
        keepEl = new Audio(URL.createObjectURL(new Blob([buf], {type:'audio/wav'}))); keepEl.loop = true; }
      keepEl.play().catch(()=>{});
    }else if(keepEl) keepEl.pause();
  }catch(e){}
}
function tone(dest, f, when, dur, type, vol, toF){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, when); if(toF) o.frequency.exponentialRampToValueAtTime(toF, when+dur);
  g.gain.setValueAtTime(0.0001, when); g.gain.exponentialRampToValueAtTime(vol, when+Math.min(.015, dur/3)); g.gain.exponentialRampToValueAtTime(0.0001, when+dur);
  o.connect(g); g.connect(dest); o.start(when); o.stop(when+dur+.05);
}
function sfx(name, force){
  if(force!==true && (S.sfxVol<=0 || S.mute)) return;
  const c = ac(); if(!c) return;
  const go = () => { const t = c.currentTime + .02, T = (f,at,d,ty,v,to) => tone(SFXG, f, t+at, d, ty||'sine', (v||.25)*1.8, to);
  switch(name){
    case 'tap': T(660,0,.05,'sine',.12); break;
    case 'plus': T(523,0,.08,'triangle',.28); T(784,.07,.12,'triangle',.28); break;
    case 'minus': T(523,0,.08,'triangle',.25); T(392,.07,.12,'triangle',.25); break;
    case 'coin': T(988,0,.07,'square',.1); T(1319,.07,.28,'square',.1); break;
    case 'win': [523,659,784,1047].forEach((f,i) => T(f,i*.09,.16,'triangle',.28)); T(1319,.4,.4,'triangle',.25); break;
    case 'lift': T(440,0,.14,'sine',.3,880); break;
    case 'land': T(170,0,.16,'sine',.5,60); T(880,.02,.06,'triangle',.12); break;
    case 'trash': T(700,0,.32,'sawtooth',.1,110); break;
    case 'err': T(170,0,.12,'square',.1); T(125,.11,.16,'square',.1); break;
  }
  };
  if(c.state==='running') go(); else c.resume().then(go).catch(()=>{});
}
/* ───────── 배경음악: wallet/bgm/ 폴더의 곡 (HB 가 올린 mp3 등). 곡 이름 = 파일 이름에서 확장자만 뺀 것 ───────── */
const BGM_DIR = 'bgm/', BGM_API = 'https://api.github.com/repos/Underkut/block7/contents/wallet/bgm?ref=main', BGM_CACHE = 'allowance.bgmlist';
let bgmList = [], bgmAudio = null, bgmPlaying = false, bgmCur = null, bgmFail = 0, bgmLoading = null, bgmLoaded = false;
const titleOf = f => f.replace(/\.[^.]+$/, '').normalize('NFC');          // 맥에서 올린 한글(NFD)도 곱게
const isSel = f => S.bgmSel === null || S.bgmSel.includes(f);
const playlist = () => bgmList.filter(t => isSel(t.file));
const bgmOrder = l => { const o = S.bgmOrder || [], rank = f => { const i = o.indexOf(f); return i < 0 ? 1e9 : i; };       // 내가 정한 순서 먼저, 새로 올린 곡은 이름순으로 뒤에
  return l.slice().sort((a,b) => rank(a.file) - rank(b.file) || titleOf(a.file).localeCompare(titleOf(b.file), 'ko')); };
// 폴더 안 파일 목록은 GitHub 에 물어서 알아낸다(공개 저장소). 곡이 있는 목록만 3분간 기억하고(빈 목록은 기억하지 않는다 — 방금 올린 곡이 바로 보이게),
// 못 물어보면 마지막으로 받은 목록을 쓴다. ⚠️ fetch 에 cache 옵션을 주지 않는다: 'no-store' 는 Cache-Control 헤더를 붙여 아이폰(WebKit)에서
// GitHub 의 CORS 사전 확인에 막힌다. 새로고침은 주소 뒤 &t=시각 으로 한다.
let bgmErr = '';
function bgmLoadList(force){
  if(bgmLoading && !force) return bgmLoading;
  let cached = null; try{ cached = JSON.parse(localStorage.getItem(BGM_CACHE) || 'null'); }catch(e){}
  if(cached && cached.l && cached.l.length && !force && Date.now() - cached.t < 180000){ bgmList = bgmOrder(cached.l); bgmLoaded = true; bgmErr = ''; return Promise.resolve(bgmList); }
  bgmLoading = fetch(BGM_API + (force ? '&t=' + Date.now() : '')).then(r => r.status===404 ? [] : r.ok ? r.json() : Promise.reject(r.status))
    .then(j => { const l = (Array.isArray(j) ? j : []).filter(x => x && x.type==='file' && /\.(mp3|m4a|aac|wav)$/i.test(x.name)).map(x => x.name)
        .sort((a,b) => titleOf(a).localeCompare(titleOf(b), 'ko')).map(f => ({file:f, title:titleOf(f)}));
      bgmList = bgmOrder(l); bgmErr = '';
      try{ if(l.length) localStorage.setItem(BGM_CACHE, JSON.stringify({t:Date.now(), l})); else localStorage.removeItem(BGM_CACHE); }catch(e){} return l; })
    .catch(e => { bgmErr = (e===403 || e===429) ? '요청이 너무 많았어요. 잠시 뒤에 다시 눌러 주세요' : (typeof e==='number' ? 'GitHub 오류 '+e : '인터넷 연결을 확인해 주세요');
      if(cached && cached.l) bgmList = bgmOrder(cached.l); return bgmList; })
    .then(l => { bgmLoaded = true; bgmLoading = null; return l; });
  return bgmLoading;
}
function bgmEnsure(){
  if(bgmAudio) return;
  bgmAudio = new Audio(); bgmAudio.preload = 'auto';
  const c = ac(); if(c){ try{ c.createMediaElementSource(bgmAudio).connect(BGMG); }catch(e){} }   // 소리 크기를 단계로 조절하려고 한 번 거친다
  bgmAudio.addEventListener('ended', () => bgmNextTrack());
  bgmAudio.addEventListener('playing', () => { bgmFail = 0; });
  bgmAudio.addEventListener('error', () => { if(++bgmFail <= 3) setTimeout(bgmNextTrack, 400); else { bgmFail = 0; bgmStop(); } });   // 못 읽는 곡은 건너뛴다
}
function bgmPlayFile(f){
  bgmEnsure(); bgmCur = f; bgmAudio.src = BGM_DIR + encodeURIComponent(f);        // 한글·공백·대소문자는 주소로 바꿔서
  bgmAudio.loop = playlist().length === 1; bgmAudio.play().catch(()=>{}); renderTracks();
}
function bgmNextTrack(){ const pl = playlist(); if(!pl.length) return; const i = pl.findIndex(t => t.file===bgmCur); bgmPlayFile(pl[(i+1) % pl.length].file); }
function bgmStart(){
  if(S.bgmVol<=0 || S.mute || bgmPlaying) return;
  bgmPlaying = true;
  bgmLoadList().then(() => {
    if(!bgmPlaying) return;
    const pl = playlist(); if(!pl.length || !ac()){ bgmPlaying = false; renderTracks(); return; }
    unlockAudio(); applyVols(); keepAudio(true);
    if(bgmAudio && bgmCur && pl.some(t => t.file===bgmCur)) bgmAudio.play().catch(()=>{}); else bgmPlayFile(pl[0].file);
  });
}
function bgmStop(){ bgmPlaying = false; if(bgmAudio) bgmAudio.pause(); keepAudio(false); renderTracks(); }
function bgmApplySel(){        // 고른 곡이 바뀌면 지금 곡이 빠졌는지 보고 이어간다
  if(!bgmPlaying) return;
  const pl = playlist(); if(!pl.length){ bgmStop(); return; }
  if(!pl.some(t => t.file===bgmCur)) bgmPlayFile(pl[0].file); else if(bgmAudio) bgmAudio.loop = pl.length === 1;
}
document.addEventListener('visibilitychange', () => { if(document.hidden) bgmStop(); else bgmStart(); });

  {k:'snack', n:'간식', ch:'bear'}, {k:'stat', n:'문구', ch:'bunny'}, {k:'save', n:'저금', ch:'pig'}, {k:'gift', n:'선물', ch:'cat'},
  {k:'play', n:'놀이', ch:'dog'}, {k:'style', n:'꾸미기', ch:'penguin'}, {k:'give', n:'헌금', ch:'chick'}, {k:'etc', n:'기타', ch:'hamster'}
];
const DEFAULT_GIVERS = [
  {n:'엄마', ch:'cat'}, {n:'아빠', ch:'bear'}, {n:'할머니', ch:'bunny'}, {n:'할아버지', ch:'dog'}, {n:'친척', ch:'penguin'}, {n:'명절 용돈', ch:'chick'}, {n:'기타', ch:'hamster'}
];
// 기록에는 그때의 캐릭터(ch)를 같이 저장해 두므로, 사람을 지우거나 바꿔도 예전 기록의 얼굴은 그대로다
const giverCh = (n, ch) => (ch && CH[ch]) ? ch : ((S.givers.find(g => g.n===n)||{}).ch || 'hamster');
const catOf = k => S.tiles.find(c => c.k===k) || goalCat(k) || (S.gone && S.gone[k] && Object.assign({k}, S.gone[k])) || {k, n:'기타', ch:'hamster'};

const goalCat = k => { const g = (S.goals||[]).find(x => x.k===k); return g ? {k, n:g.n, ch:g.img.t==='char' ? g.img.v : 'star', img:g.img} : null; };

/* ───────── 저장 ───────── */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,5);
const pad2 = n => String(n).padStart(2,'0');
const dstr = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayStr = () => dstr(new Date());
const dayAdd = n => { const d = new Date(); d.setDate(d.getDate()+n); return dstr(d); };
let S = load();
function blank(){ return {v:2, tx:[], plans:[], alloc:{cash:{}, card:{}}, tiles:DEFAULT_TILES.map(t=>Object.assign({},t)), custom:[], gone:{}, goals:[], chk:{}, lvSeen:null, exp:[], useExp:true, givers:DEFAULT_GIVERS.map(g=>Object.assign({},g)), dashOpen:true, sfxVol:4, bgmVol:2, bgmSel:null, bgmOrder:null, volv:3, mute:true, lastAcct:'cash', lastBackup:0}; }
function migrate(o0){
  // 어떤 예전 모양이 와도 현재 모양으로: v1(계획 목록) · 개편1(custom 칸) → tiles
  const o = Object.assign(blank(), o0||{});
  o.tx = Array.isArray(o.tx) ? o.tx : [];
  // 계획은 자산별: {cash:{칸:금액}, card:{…}}. 예전(평평한 {칸:금액})은 현금 계획으로 옮긴다
  { const old = (o.alloc && typeof o.alloc==='object') ? o.alloc : {}, A = {cash:{}, card:{}};
    if(Object.keys(old).some(k => typeof old[k]==='number')) A.cash = old;
    else ['cash','card'].forEach(a => { if(old[a] && typeof old[a]==='object') A[a] = old[a]; });
    o.alloc = A; }
  if(!Array.isArray(o.tiles) || !(o0 && Array.isArray(o0.tiles))) o.tiles = DEFAULT_TILES.map(t=>Object.assign({},t));
  if(Array.isArray(o.custom)) o.custom.forEach(c => { if(c && c.k && c.n && !o.tiles.find(t=>t.k===c.k)) o.tiles.push({k:c.k, n:c.n, ch:c.ch}); });
  o.custom = [];
  if(Array.isArray(o.plans)) o.plans.forEach(p => { if(!p || !p.name) return; const k = 'c_' + p.id;
    if(!o.tiles.find(t=>t.k===k)) o.tiles.push({k, n:String(p.name), ch:'star'});
    if(!p.done) o.alloc.cash[k] = p.amt;
    o.tx.forEach(t => { if(t.plan===p.id && !t.cat) t.cat = k; }); });
  o.plans = [];
  const seen = new Set();
  o.tiles = o.tiles.filter(t => t && t.k && t.n && !seen.has(String(t.k)) && seen.add(String(t.k)))
    .map(t => ({k:String(t.k), n:String(t.n).slice(0,8), ch:CH[t.ch] ? t.ch : 'star'}));
  o.gone = (o.gone && typeof o.gone==='object') ? o.gone : {};
  o.chk = {}; const cf = v => (v==='y'||v==='z'||v==='n') ? v : null;
  if(o0 && o0.chk && typeof o0.chk==='object') Object.keys(o0.chk).filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d)).forEach(d => { const c = o0.chk[d] || {}; if(cf(c.s) || cf(c.g)) o.chk[d] = {s:cf(c.s), g:cf(c.g)}; });
  o.lvSeen = (o0 && Number.isInteger(o0.lvSeen) && o0.lvSeen>=1 && o0.lvSeen<=10) ? o0.lvSeen : null;
  const seenGoal = new Set(), okImg = i => i && ((i.t==='char' && CH[i.v]) || (i.t==='data' && typeof i.v==='string' && /^data:image\//.test(i.v) && i.v.length<400000) || (i.t==='url' && typeof i.v==='string' && /^https?:\/\/\S+$/i.test(i.v)));
  o.goals = (Array.isArray(o.goals) ? o.goals : []).filter(x => x && x.k && x.n && +x.price>0 && !seenGoal.has(String(x.k)) && !o.tiles.some(t => t.k===String(x.k)) && seenGoal.add(String(x.k)))
    .map(x => ({k:String(x.k), n:String(x.n).slice(0,14), price:Math.round(+x.price), img: okImg(x.img) ? {t:x.img.t, v:x.img.v} : {t:'char', v:'star'},
      due:/^\d{4}-\d{2}-\d{2}$/.test(x.due||'') ? x.due : null, done:!!x.done, doneAt:/^\d{4}-\d{2}-\d{2}$/.test(x.doneAt||'') ? x.doneAt : null}));
  o.exp = (Array.isArray(o.exp) ? o.exp : []).filter(e => e && Number.isFinite(+e.amt) && +e.amt>0)
    .map(e => ({id:String(e.id||uid()), amt:Math.round(+e.amt), who:String(e.who||'기타'), ch:CH[e.ch] ? e.ch : null, note:String(e.note||'').slice(0,60), acct:e.acct==='card' ? 'card' : 'cash', date:/^\d{4}-\d{2}-\d{2}$/.test(e.date||'') ? e.date : null, at:+e.at||0}));
  o.useExp = o.useExp !== false;
  o.dashOpen = o.dashOpen !== false; // 예전 켬/끔(sfx·bgm)은 단계로 옮긴다: 효과음 켬=4 · 끔=0, 배경음악 켬=3 · 끔=0
  const lv = (v, d) => (typeof v==='number' && v>=0 && v<=5) ? Math.round(v) : d;
  o.sfxVol = lv(o0 && o0.sfxVol, (o0 && o0.sfx===false) ? 0 : 4);
  // 배경음악 눈금은 v3 에서 바뀌었다(3단계 = 예전 1단계 소리). 예전 값은 같은 소리가 되도록 옮긴다: 0→0 · 1→3 · 2 이상→5(최대)
  let ob = lv(o0 && o0.bgmVol, (o0 && o0.bgm===true) ? 3 : 1);
  if(o0 && typeof o0.bgmVol==='number' && o0.bgmVol===0 && !(o0.volv>=2)) ob = 1;       // 한 번도 안 만진 옛 기본값(0)은 옛 기본(1)으로 본다. 직접 0 으로 둔 것(volv>=2)은 그대로 끔
  if(!(o0 && o0.volv>=3)) ob = ob===0 ? 0 : (ob===1 ? 3 : 5);
  o.bgmVol = ob; o.volv = 3; o.bgmOrder = Array.isArray(o.bgmOrder) ? o.bgmOrder.map(String) : null;
  o.bgmSel = Array.isArray(o.bgmSel) ? o.bgmSel.map(String) : null; o.mute = (o0 && typeof o0.mute==='boolean') ? o0.mute : false;      // 새 사용자(저장 없음)만 음소거로 시작. 쓰던 기기는 원래 값 그대로
  delete o.sfx; delete o.bgm;
  const seenG = new Set();
  if(!(o0 && Array.isArray(o0.givers))) o.givers = DEFAULT_GIVERS.map(g=>Object.assign({},g));
  o.givers = o.givers.filter(g => g && g.n && !seenG.has(String(g.n)) && seenG.add(String(g.n))).map(g => ({n:String(g.n).slice(0,8), ch:CH[g.ch] ? g.ch : 'hamster'}));
  o.tx.forEach(t => { if(t){ t.note = String(t.note||'').slice(0,60); if(t.ch && !CH[t.ch]) t.ch = null; t.acct = t.acct==='card' ? 'card' : 'cash';
    if(t.t==='mv'){ t.from = t.from==='card' ? 'card' : 'cash'; t.to = t.from==='card' ? 'cash' : 'card'; t.acct = t.from; } } });
  ['cash','card'].forEach(a => Object.keys(o.alloc[a]).forEach(k => { const v = Math.round(+o.alloc[a][k]); if(v>0) o.alloc[a][k] = v; else delete o.alloc[a][k]; }));
  o.lastAcct = o.lastAcct==='card' ? 'card' : 'cash';
  return o;
}
function load(){
  try{ const r = localStorage.getItem(KEY); if(r){ const o = JSON.parse(r); if(o && Array.isArray(o.tx)) return migrate(o); } }catch(e){}
  return blank();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('저장하지 못했어요'); } }

/* ───────── 계산 ───────── */
const ACCTS = [{k:'cash', n:'현금'}, {k:'card', n:'체크카드'}];
const acctName = a => a==='card' ? '체크카드' : '현금';
const byA = a => a==='card' ? '체크카드로' : '현금으로';
const acctOf = t => (t && t.acct==='card') ? 'card' : 'cash';
let curAcct = S.lastAcct;                                    // 계획세우기 화면이 보고 있는 자산
// 잔액은 자산별로 센다. 돈 옮기기(mv)는 합계를 안 바꾸고 두 자산만 바꾼다. 받을 예정 돈은 잔액에 섞지 않는다.
const balOf = a => S.tx.reduce((s,t) => t.t==='mv' ? s + (t.to===a ? t.amt : 0) - (t.from===a ? t.amt : 0) : (acctOf(t)===a ? s + (t.t==='in' ? t.amt : -t.amt) : s), 0);
const balance = () => balOf('cash') + balOf('card');
const pendOf = a => S.exp.reduce((s,e) => s + (acctOf(e)===a ? e.amt : 0), 0);
const pendAll = () => pendOf('cash') + pendOf('card');
const spent = (k, a=curAcct) => S.tx.reduce((s,t) => s + (t.t==='out' && t.cat===k && acctOf(t)===a ? t.amt : 0), 0);
const alloc = (k, a=curAcct) => (S.alloc[a] || {})[k] || 0;
const left = (k, a=curAcct) => alloc(k,a) - spent(k,a);
const reserved = (a=curAcct) => S.tiles.reduce((s,c) => s + Math.max(0, left(c.k,a)), 0) + S.goals.reduce((s,g) => s + (g.done ? 0 : alloc(g.k,a)), 0);
const avail = (a=curAcct) => balOf(a) - reserved(a) + (S.useExp ? pendOf(a) : 0);      // 계획 세울 수 있는 돈 (자산별)
const availAll = () => avail('cash') + avail('card');
const AC_ICO = {
  cash:'<svg viewBox="0 0 32 32"><rect x="3" y="8" width="26" height="16" rx="3" fill="#7be0a8" stroke="#3cc98a" stroke-width="2"/><circle cx="16" cy="16" r="4" fill="#fff" opacity=".9"/><circle cx="8" cy="16" r="1.5" fill="#3cc98a"/><circle cx="24" cy="16" r="1.5" fill="#3cc98a"/></svg>',
  card:'<svg viewBox="0 0 32 32"><rect x="3" y="7" width="26" height="18" rx="3.500" fill="#8cc4ff" stroke="#5aa9ff" stroke-width="2"/><rect x="3" y="12" width="26" height="4" fill="#3f86df"/><rect x="7" y="19" width="8" height="2.500" rx="1" fill="#fff" opacity=".9"/></svg>'};
const MV_ICO = '<svg viewBox="0 0 32 32" fill="none" stroke="#5aa9ff" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round" style="width:70%;height:70%"><path d="M6 12h18M19 7l5 5-5 5M26 21H8M13 16l-5 5 5 5"/></svg>';

/* ───────── 화면 ───────── */
let month = todayStr().slice(0,7), step = 1000;
function monthShift(m, d){ let [y,mm] = m.split('-').map(Number); mm += d; while(mm<1){mm+=12;y--} while(mm>12){mm-=12;y++} return y+'-'+pad2(mm); }
const wd = ['일','월','화','수','목','금','토'];

function txRow(t){
  if(t.t==='mv') return `<button class="row card" data-tx="${t.id}"><span class="av" style="background:#e6f1ff">${MV_ICO}</span><span class="mid"><div class="t">${acctName(t.from)} → ${acctName(t.to)}</div><div class="s">${t.from==='cash'?'카드에 넣었어요':'현금으로 뺐어요'} · ${Number(t.date.slice(5,7))}월 ${Number(t.date.slice(8,10))}일${t.note?' · '+esc(t.note):''}</div></span><span class="a mvc">${nf(t.amt)}</span></button>`;
  const isIn = t.t==='in', c = isIn ? null : catOf(t.cat);
  const ch = isIn ? giverCh(t.memo, t.ch) : c.ch;
  return `<button class="row card" data-tx="${t.id}">${isIn ? avatar(ch) : catAvatar(c)}<span class="mid"><div class="t">${esc(isIn ? (t.memo||'용돈') : c.n)}</div><div class="s">${byA(acctOf(t))} ${isIn?'받았어요':'썼어요'} · ${Number(t.date.slice(5,7))}월 ${Number(t.date.slice(8,10))}일${t.note?' · '+esc(t.note):''}</div></span><span class="a ${isIn?'in':'out'}">${isIn?'+':'−'}${nf(t.amt)}</span></button>`;
}
const sortedTx = list => list.slice().sort((a,b) => a.date<b.date?1:a.date>b.date?-1:(b.at||0)-(a.at||0));

function renderHome(){
  const bal = balance(), pend = pendAll(), av = availAll();
  $('bal').innerHTML = (bal<0?'<span style="color:#d9462f">':'<span>')+nf(bal)+'</span><small>원</small>';
  $('assets').innerHTML = ACCTS.map(a => `<button class="ap" data-a="${a.k}">${AC_ICO[a.k]}<span>${a.n}</span><b class="${balOf(a.k)<0?'neg':''}">${won(balOf(a.k))}</b></button>`).join('');
  $('pendChip').innerHTML = pend>0 ? '받을 예정 <b>+'+won(pend)+'</b>' : '';
  let msg;
  if(!S.tx.length && !S.exp.length) msg = '안녕! 나는 꿀꿀이야. 용돈을 받으면 초록 버튼을 눌러 줘!';
  else if(bal<=0 && pend>0) msg = '곧 '+won(pend)+' 받을 예정이야! 미리 계획을 세워 볼까?';
  else if(bal<=0) msg = '지갑이 텅 비었어… 다음 용돈이 기다려져!';
  else if(av<0) msg = '계획이 가진 돈보다 많아! 조금 줄여 볼까?';

  const rec = sortedTx(S.tx).slice(0,3);

  $('recent').innerHTML = rec.length ? rec.map(txRow).join('') : '<div class="empty">아직 아무것도 없어요.<br>위의 버튼을 눌러 보세요!</div>';
}

const PENCIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-5L16 4l4 4L9 19z"/></svg>';
function expLabel(e){
  if(!e.date) return {t:'날짜는 아직 몰라요', late:false};
  const d = new Date(e.date+'T00:00:00'), t = new Date(todayStr()+'T00:00:00'), diff = Math.round((d-t)/864e5), md = (d.getMonth()+1)+'월 '+d.getDate()+'일';
  if(diff<0) return {t:md+' · 예정일이 지났어요 — 받았나요?', late:true};
  return {t: diff===0 ? '오늘 ('+md+')' : diff===1 ? '내일 ('+md+')' : md+' ('+diff+'일 뒤)', late:false};
}
const expSorted = () => S.exp.slice().sort((a,b) => (a.date||'9999')<(b.date||'9999')?-1:(a.date||'9999')>(b.date||'9999')?1:(a.at||0)-(b.at||0));

function renderAlloc(){ renderAlloc0(); renderGoals(); }

  else if(av<0){ wc.style.display = ''; wc.textContent = '계획으로 정한 돈이 가진 돈보다 많아요. 아래 칸의 −를 눌러 줄여 주세요.'; }

  else hint.style.display = 'none';

    + ex.map(e => { const l = expLabel(e); return `<div class="er" data-id="${e.id}"><div class="r1" data-ea="edit">${avatar(giverCh(e.who,e.ch))}<span class="mid"><div class="t">${esc(e.who)}</div><div class="s ${l.late?'late':''}">${l.t}</div>${e.note?`<div class="s">${esc(e.note)}</div>`:''}</span><span class="a">+${nf(e.amt)}</span></div><div class="eb"><button class="gb green sm" data-ea="get">받았어요!</button><button class="gb blue sm" data-ea="edit">고치기</button><button class="gb gray sm" data-ea="del">취소</button></div></div>`; }).join('')
    + `<button class="gb blue sm" id="addExp" style="margin-top:10px">＋ 받을 예정인 돈 적기</button>`;

const PAL = ['#ff6fa5','#ffb347','#5aa9ff','#3cc98a','#9b7bff','#ffd84d','#ff8a5c','#6bd6ff'];
const shortWon = n => n>=10000 ? (Math.round(n/1000)/10)+'만' : n>=1000 ? (Math.round(n/100)/10)+'천' : String(n);
function mstats(m){
  let inc = 0, sp = 0; const cats = {}, days = {};
  S.tx.forEach(t => { if(t.date.slice(0,7)!==m) return;
    if(t.t==='in') inc += t.amt;
    else if(t.t==='out'){ sp += t.amt; const n = catOf(t.cat).n; cats[n] = (cats[n]||0) + t.amt; days[t.date] = (days[t.date]||0) + t.amt; } });

}
function pieHtml(st){

}
function barsHtml(){

  const W = 320, H = 130, base = 104, ch = 70, gw = W/6;

    if(d.inc) g += `<text x="${x+gw/2-9.5}" y="${base-hi-3}" text-anchor="middle" font-size="9" fill="#209a63" font-family="inherit">${shortWon(d.inc)}</text>`;

  return `<svg viewBox="0 0 ${W} ${H}" class="bars"><line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="#e8e0f5" stroke-width="1.5"/>${g}</svg>

function insights(st){

/* 창 윗부분(손잡이·제목)을 잡고 아래로 끌면 따라 내려가고, 충분히 끌거나 빨리 쓸면 닫힌다 (블럭7·스위터와 같은 손짓) */
(function(){
  const sh = $('sheet'); let d = null;
  sh.addEventListener('pointerdown', e => {
    if(!sh.classList.contains('on') || (e.pointerType==='mouse' && e.button!==0)) return;
    if(e.clientY - sh.getBoundingClientRect().top > 76 || e.target.closest('input,button,textarea,select')) return;      // 윗부분만(슬라이더·버튼 위는 제외)
    d = {id:e.pointerId, y0:e.clientY, y:e.clientY, t0:performance.now(), moved:false};
  });
  window.addEventListener('pointermove', e => {
    if(!d || e.pointerId!==d.id) return;
    const dy = e.clientY - d.y0;
    if(!d.moved){ if(Math.abs(dy) < 6) return; d.moved = true; sh.style.transition = 'none'; try{ sh.setPointerCapture(d.id); }catch(_){} }
    d.y = e.clientY; const off = Math.max(0, dy);
    sh.style.transform = 'translateY('+off+'px)'; $('dim').style.opacity = String(Math.max(.15, 1 - off/Math.max(sh.offsetHeight,300)));
  });
  const end = () => {
    if(!d) return; const m = d.moved, dy = d.y - d.y0, v = dy / Math.max(1, performance.now() - d.t0); d = null;
    if(!m) return;
    sh.style.transition = ''; sh.style.transform = ''; $('dim').style.opacity = '';
    if(dy > 110 || v > .6) closeSheet();
  };
  window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
  document.addEventListener('touchmove', e => { if(d && d.moved) e.preventDefault(); }, {passive:false});
})();

function padSheet({title, who, init, nextLabel, allowZero, extra, memo, onDone}){

  openSheet(`<h2>${title}</h2>${who?`<div class="who">${avatar(who.ch)}<span style="font-size:19px">${esc(who.n)}</span></div>`:''}

    ${extra||''}

    <button class="gb ${allowZero?'purple':'green'}" id="pn">${nextLabel||'다음'}</button>`);
  const show = () => { $('pv').textContent = nf(+val); $('pn').disabled = !allowZero && +val<=0; };

  $('tDel').onclick = () => { if(!confirm('이 기록을 지울까요?')) return; S.tx = S.tx.filter(x=>x.id!==id); save(); closeSheet(); render(); toast('지웠어요'); };
}

/* ───────── 현금 ↔ 체크카드 돈 옮기기 (인출 · 충전) ───────── */
function moveFlow(ex){
  let from = ex ? ex.from : (S.lastAcct==='card' ? 'card' : 'cash'), date = ex ? ex.date : todayStr();
  const hint = f => f==='cash' ? '현금을 체크카드에 넣었어요 (충전)' : '체크카드에서 현금으로 뺐어요 (인출)';
  const seg = `<div class="aclabel">어느 쪽으로 옮겼어요?</div><div class="acseg" id="acSeg"><button data-a="cash" class="${from==='cash'?'on':''}">${AC_ICO.cash}현금 → 카드</button><button data-a="card" class="${from==='card'?'on':''}">${AC_ICO.card}카드 → 현금</button></div><div class="aclabel" id="mvHint" style="margin-top:0">${hint(from)}</div>`;
  padSheet({title:'얼마를 옮겼어요?', init: ex?ex.amt:0, nextLabel:'옮겼어요!', memo: ex&&ex.note ? ex.note : '', extra: seg + dateRowHtml(date), onDone: (amt, note) => {
    const to = from==='cash' ? 'card' : 'cash', room = balOf(from) + (ex && ex.from===from ? ex.amt : 0);
    if(amt > room){ toast(acctName(from)+'에는 '+won(Math.max(room,0))+'밖에 없어요'); sfx('err'); buzz([20,40,20]); return; }
    const rec = {id: ex ? ex.id : uid(), t:'mv', from, to, amt, date, at: ex ? ex.at : Date.now(), note: note||'', acct: from, memo:'', ch:null, cat:null, plan:null};
    if(ex) S.tx[S.tx.findIndex(t=>t.id===ex.id)] = rec; else S.tx.push(rec);
    save(); month = date.slice(0,7); closeSheet(); buzz(25); render(); sfx('coin');
    toast(acctName(from)+' → '+acctName(to)+' '+won(amt)+' 옮겼어요');
    if(avail(from)<0) setTimeout(()=>toast(acctName(from)+'의 계획이 돈보다 커졌어요. 계획세우기에서 줄여 주세요'), 1800);
  }});
  $('fDate').onchange = e => { date = e.target.value || todayStr(); $('dtxt').textContent = dlabelOf(date); };
  bindAcct(v => { from = v; $('mvHint').textContent = hint(v); });
}

/* ───────── 받을 예정인 돈 (새로 적기 · 고치기) ───────── */
function expFlow(ex){
  let acct = ex && ex.acct ? acctOf(ex) : curAcct;
  padSheet({title:'얼마 받을 예정이에요?', init: ex?ex.amt:0, nextLabel:'다음으로 ▶', memo: ex&&ex.note ? ex.note : '', extra: acctSeg(acct, '어디로 들어올 돈이에요?'), onDone: (amt, note) => {
    openSheet(`<h2>누구한테 받을 예정이에요?</h2><div class="note">${byA(acct)} ${won(amt)}${note?' · '+esc(note):''} — 하나를 눌러 주세요</div>${pickGrid(giverItems(ex ? ex.who : null), newBtn('새 사람'))}<button class="linkbtn" id="pBack">◀ 금액 다시 쓰기</button>`);
    $('pBack').onclick = () => expFlow(Object.assign({}, ex||{}, {amt, note, acct}));
    $('pk').onclick = e => { const b = e.target.closest('button'); if(!b) return;
      if(b.dataset.k==='__new'){ personSheet(null, n => expWhen(amt, n, note, ex, acct)); return; }
      expWhen(amt, b.dataset.k, note, ex, acct); };
  }});
  bindAcct(v => { acct = v; });
}
function expWhen(amt, who, note, ex, acct){
  const md = s => { const d = new Date(s+'T00:00:00'); return (d.getMonth()+1)+'월 '+d.getDate()+'일'; };
  const mo = new Date(); mo.setMonth(mo.getMonth()+1);
  const opts = [['내일', dayAdd(1)], ['3일 뒤', dayAdd(3)], ['일주일 뒤', dayAdd(7)], ['2주 뒤', dayAdd(14)], ['한 달 뒤', dstr(mo)], ['날짜는 몰라요', null]];
  if(ex && ex.date) opts.unshift(['그대로', ex.date]);
  openSheet(`<h2>언제 받을 것 같아요?</h2><div class="who">${avatar(chOfGiver(who))}<span style="font-size:19px">${esc(who)} · ${won(amt)}</span></div><div class="note" style="margin:2px 0 0">${acctName(acct)}으로 들어와요${note?'<br>✎ '+esc(note):''}</div>
    <div class="dgrid">${opts.map((o,i)=>`<button class="gb ${o[1]?'blue':'gray'} sm" data-i="${i}">${o[0]}${o[1]?`<small style="font-size:12px;opacity:.9"> ${md(o[1])}</small>`:''}</button>`).join('')}</div>
    <label class="datebtn">${CAL_ICO}<span>달력에서 고르기</span><input type="date" id="eDate" min="${todayStr()}"></label>`);
  const done = date => {
    const rec = {id: ex&&ex.id ? ex.id : uid(), amt, who, ch: chOfGiver(who), note: note||'', acct, date, at: ex&&ex.at ? ex.at : Date.now()};
    const i = ex&&ex.id ? S.exp.findIndex(x=>x.id===ex.id) : -1;
    if(i>=0) S.exp[i] = rec; else S.exp.push(rec);
    S.useExp = true; S.lastAcct = acct; curAcct = acct; save(); closeSheet(); buzz(20); render(); goTab('vAlloc');
    toast(i>=0 ? '예정을 고쳤어요' : '예정을 적었어요! 계획에 미리 넣어 볼 수 있어요');
  };
  $('sheet').querySelector('.dgrid').onclick = e => { const b = e.target.closest('button'); if(b) done(opts[+b.dataset.i][1]); };

function expReceive(id){
  const e = S.exp.find(x=>x.id===id); if(!e) return;
  let acct = acctOf(e);
  padSheet({title:'진짜 얼마 받았어요?', who:{n:e.who, ch:giverCh(e.who, e.ch)}, init:e.amt, nextLabel:'받았어요!', memo: e.note||'', extra: acctSeg(acct, '어디로 들어왔어요?'), onDone: (v, note) => {
    S.tx.push({id:uid(), t:'in', amt:v, memo:e.who, ch:giverCh(e.who, e.ch), note: note||'', acct, date:todayStr(), cat:null, plan:null, at:Date.now()});
    S.exp = S.exp.filter(x=>x.id!==id); S.lastAcct = acct; curAcct = acct; save(); month = todayStr().slice(0,7); closeSheet(); buzz(25); render(); confetti(); toast('용돈 받았다!');
  }});
  bindAcct(v => { acct = v; });
}
function expCancel(id){
  const e = S.exp.find(x=>x.id===id); if(!e) return;
  if(!confirm('"'+e.who+' '+won(e.amt)+'" 예정을 지울까요?\n계획에 미리 넣은 돈이 있으면 모자랄 수 있어요.')) return;
  S.exp = S.exp.filter(x=>x.id!==id); save(); render();
  if(avail(acctOf(e))<0) toast('계획이 돈보다 커졌어요. 칸을 줄여 주세요'); else toast('지웠어요');
}
$('expBox').onclick = e => {
  if(e.target.closest('#addExp')){ expFlow(); return; }
  if(e.target.closest('#swExp')){ S.useExp = !S.useExp; save(); buzz(10); render(); toast(S.useExp ? '받을 돈도 계획에 넣어요' : '지금 가진 돈으로만 계획해요'); return; }
  const b = e.target.closest('[data-ea]'), row = e.target.closest('.er'); if(!b || !row) return;

  if(a==='get') expReceive(row.dataset.id);

  else expCancel(row.dataset.id);
};

/* ───────── 계획세우기: 칸 ───────── */
const tileOf = k => S.tiles.find(t=>t.k===k);
function setAlloc(k, v){ const A = S.alloc[curAcct] || (S.alloc[curAcct] = {}); if(v>0) A[k] = v; else delete A[k]; }
function bumpCard(k, cls){ const el = document.querySelector('.ac[data-k="'+k+'"]'); if(!el) return; const t = cls==='amt' ? el.querySelector('.amt') : el; t.classList.remove('pop','bounce'); void t.offsetWidth; t.classList.add(cls==='amt'?'pop':'bounce'); }
function shake(k){ sfx('err'); const el = document.querySelector('.ac[data-k="'+k+'"]'); if(!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); buzz([20,40,20]); }
function allocStep(k, dir){
  const av = avail();
  if(dir>0){
    if(av<=0){ shake(k); toast('계획 세울 돈이 없어요!'); return; }
    setAlloc(k, alloc(k) + Math.min(step, av));
  }else{
    const floor = Math.max(spent(k), 0), now = alloc(k);
    if(now<=floor){ shake(k); toast(spent(k)>0 ? '이미 쓴 만큼은 줄일 수 없어요' : '더 줄일 게 없어요'); return; }
    setAlloc(k, Math.max(floor, now - step));
  }
  buzz(14); sfx(dir>0?'plus':'minus'); save(); renderAlloc(); renderHome(); bumpCard(k,'amt');
  if(dir>0 && avail()<=0 && (balOf(curAcct)+(S.useExp?pendOf(curAcct):0))>0){ confetti(); toast('와! 계획을 전부 세웠어요!'); }
}
$('agrid').onclick = e => {
  if(e.target.closest('#addCat')){ tileSheet(); return; }
  const card = e.target.closest('.ac[data-k]'); const b = e.target.closest('button'); if(!card || !b) return;
  const k = card.dataset.k, act = b.dataset.act;
  if(act==='p') allocStep(k, 1);
  else if(act==='m') allocStep(k, -1);
  else if(act==='face'){ bumpCard(k,'face'); buzz(10); const c = tileOf(k); toast(c.n+' · 남은 돈 '+won(Math.max(left(k),0))); }
  else if(act==='name') tileSheet(tileOf(k));
  else if(act==='amt'){
    const c = tileOf(k), base = alloc(k);
    padSheet({title:c.n+'에 얼마 쓸까요?', who:{n:c.n, ch:c.ch}, init:base, nextLabel:'정했어요!', allowZero:true, onDone: v => {
      const room = base + Math.max(avail(),0); let nv = v;
      if(nv>room){ nv = room; toast('계획 세울 수 있는 돈은 '+won(room)+'까지예요'); }
      setAlloc(k, nv); save(); closeSheet(); render();
      if(avail()<=0 && nv>base && (balOf(curAcct)+(S.useExp?pendOf(curAcct):0))>0) confetti();
    }});
  }
};
$('agrid').addEventListener('click', e => { if(Date.now()<suppressClick){ e.stopPropagation(); e.preventDefault(); } }, true);
document.querySelector('.steps').onclick = e => { const b = e.target.closest('button'); if(!b) return; step = +b.dataset.s; buzz(8);
  document.querySelectorAll('.steps button').forEach(x => x.classList.toggle('on', x===b)); };
$('allocReset').onclick = () => { const tk = S.tiles.map(c => c.k).filter(k => alloc(k) > 0); if(!tk.length){ toast('세운 계획이 아직 없어요'); return; }
  if(!confirm(acctName(curAcct)+'으로 세운 계획을 모두 지우고 다시 할까요?\n(쓴 기록은 그대로예요)')) return; tk.forEach(k => delete S.alloc[curAcct][k]); save(); render(); toast('처음부터 다시 계획해 봐요!'); };
$('hint').onclick = e => { if(e.target.closest('#hIn')) txFlow('in'); else if(e.target.closest('#hExp')) expFlow(); };

/* 이름 + 캐릭터 고르는 공용 창 (칸 · 사람) */

/* 칸 이름·동물 고치기 / 새로 만들기 (onNew: 만든 칸으로 바로 이어갈 일이 있을 때) */
function tileSheet(t, onNew){
  charSheet({title: t?'칸 고치기':'새 칸 만들기', name: t?t.n:'', ch: t?t.ch:'star', okLabel: t?'고쳤어요!':'만들었어요!', delLabel:'이 칸 지우기',
    onSave: (n, ch) => {
      let nk;
      if(t){ const x = tileOf(t.k); x.n = n; x.ch = ch; } else { nk = 't_'+uid(); S.tiles.push({k:nk, n, ch}); }
      if(!t && onNew){ save(); onNew(nk); return; }
      save(); closeSheet(); render(); toast(t?'고쳤어요':'새 칸이 생겼어요!');
      if(!t) setTimeout(()=>{ const el = document.querySelector('.ac:nth-last-child(2)'); if(el){ el.scrollIntoView({block:'center',behavior:'smooth'}); bumpCard(S.tiles[S.tiles.length-1].k,'face'); } }, 300);
    },
    onDelete: t ? () => { closeSheet(); askDeleteTile(t.k); } : null });
}

/* 사람(누구한테 받는지) 새로 만들기 / 고치기 / 지우기 */
function personSheet(g, onNew){
  charSheet({title: g?'사람 고치기':'새 사람 만들기', name: g?g.n:'', ch: g?g.ch:'hamster', needName:true, okLabel: g?'고쳤어요!':'만들었어요!', delLabel:'이 사람 지우기',
    onSave: (n, ch) => {
      if(g){
        const old = g.n, x = S.givers.find(v=>v.n===old);   // g 와 x 는 같은 객체라, 바꾸기 전에 옛 이름을 따로 잡아 둔다
        if(S.givers.some(v=>v!==x && v.n===n)){ toast('같은 이름이 이미 있어요'); return; }
        x.n = n; x.ch = ch;
        S.tx.forEach(t => { if(t.t==='in' && t.memo===old){ t.memo = n; t.ch = ch; } });
        S.exp.forEach(e => { if(e.who===old){ e.who = n; e.ch = ch; } });
      }else{
        const x = S.givers.find(v=>v.n===n); if(x) x.ch = ch; else S.givers.push({n, ch});
      }
      save();
      if(!g && onNew){ onNew(n); return; }
      closeSheet(); render(); toast(g?'고쳤어요':'새 사람이 생겼어요!');
    },
    onDelete: g ? () => { if(!confirm('"'+g.n+'" 을(를) 목록에서 지울까요?\n예전 기록은 그대로 남아요.')) return;
      S.givers = S.givers.filter(v=>v.n!==g.n); save(); closeSheet(); render(); toast('지웠어요'); } : null });
}
function peopleSheet(){
  openSheet(`<h2>받은 사람 목록</h2><div class="note">누르면 이름·캐릭터를 고치거나 지울 수 있어요.</div>
    <div class="pick" id="pk">${S.givers.map(g=>`<button class="pk" data-k="${esc(g.n)}" style="--bg:${CH[g.ch].bg}"><div class="face">${face(g.ch)}</div>${esc(g.n)}</button>`).join('')}${newBtn('새 사람')}</div>`);
  $('pk').onclick = e => { const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.k==='__new') personSheet(null); else personSheet(S.givers.find(g=>g.n===b.dataset.k)); };
}
function askDeleteTile(k){
  const c = tileOf(k); if(!c) return false;
  const l = ACCTS.reduce((t,x) => t + Math.max(left(k,x.k),0), 0), sp = ACCTS.reduce((t,x) => t + spent(k,x.k), 0);
  const msg = '"'+c.n+'" 칸을 지울까요?\n'
    + (l>0 ? '• 남은 계획 돈 '+won(l)+(ACCTS.filter(x=>left(k,x.k)>0).length>1 ? '('+ACCTS.filter(x=>left(k,x.k)>0).map(x=>acctName(x.k)+' '+won(left(k,x.k))).join(' + ')+')' : '')+'은 "아직 계획 안 세운 돈"으로 돌아가요.\n' : '')
    + (sp>0 ? '• 이미 쓴 기록('+won(sp)+')은 그대로 남아요.' : '• 이 칸에 쓴 기록은 없어요.');
  if(!confirm(msg)) return false;
  if(S.tx.some(t => t.cat===k)) S.gone[k] = {n:c.n, ch:c.ch};
  ACCTS.forEach(x => { delete S.alloc[x.k][k]; }); S.tiles = S.tiles.filter(t => t.k!==k); save(); render();
  sfx('trash'); toast(l>0 ? '지웠어요. '+won(l)+'은 다시 계획할 수 있어요' : '지웠어요');
  return true;
}

/* ───────── 칸을 꾹 눌러 끌기 (안드로이드 홈 화면처럼: 위쪽 '지우기' 칸에 놓으면 삭제) ───────── */
const grid = $('agrid');
let DG = null, suppressClick = 0;
const HOLD_MS = 380;
const trashH = () => $('trash').offsetHeight;
grid.addEventListener('pointerdown', e => {
  if(DG || (e.pointerType==='mouse' && e.button!==0)) return;
  const card = e.target.closest('.ac[data-k]'); if(!card || e.target.closest('.pm')) return;
  DG = {card, id:e.pointerId, sx:e.clientX, sy:e.clientY, x:e.clientX, y:e.clientY, on:false, cool:0, reordered:false};
  DG.timer = setTimeout(dragStart, HOLD_MS);
});
window.addEventListener('pointermove', e => {
  if(!DG || e.pointerId!==DG.id) return;
  DG.x = e.clientX; DG.y = e.clientY;
  if(!DG.on){ if(Math.hypot(DG.x-DG.sx, DG.y-DG.sy) > 10){ clearTimeout(DG.timer); DG = null; } return; }
  hitTest();
});
window.addEventListener('pointerup', e => dragEnd(e, false));
window.addEventListener('pointercancel', e => dragEnd(e, true));
document.addEventListener('touchmove', e => { if(DG && DG.on) e.preventDefault(); }, {passive:false});
grid.addEventListener('contextmenu', e => e.preventDefault());

function dragStart(){
  if(!DG) return;
  const c = DG.card, r = c.getBoundingClientRect();
  DG.on = true; DG.ox = DG.sx - r.left; DG.oy = DG.sy - r.top; DG.lx = DG.x; DG.tilt = 0; DG.hot = false;
  try{ grid.setPointerCapture(DG.id); }catch(e){}
  const g = c.cloneNode(true); g.classList.add('ghost'); g.removeAttribute('data-k'); g.style.width = r.width+'px'; g.style.height = r.height+'px';
  document.body.appendChild(g); DG.ghost = g; c.classList.add('ph');
  document.body.classList.add('dragging'); $('trash').classList.add('on'); buzz(30); sfx('lift');
  g.style.transform = `translate(${DG.x-DG.ox}px,${DG.y-DG.oy}px) scale(1.06)`;
  DG.raf = requestAnimationFrame(dragLoop);
}
function setHot(h){ if(DG.hot===h) return; DG.hot = h; $('trash').classList.toggle('hot', h); if(h) buzz(15); }
function dragLoop(){
  if(!DG || !DG.on) return;
  const H = trashH(), y = DG.y, view = $('vAlloc');
  let sp = 0;
  if(y>H+4 && y<H+90) sp = -Math.ceil((H+90-y)/6); else if(y>innerHeight-180) sp = Math.ceil((y-(innerHeight-180))/6);
  if(sp){ view.scrollTop += sp; hitTest(); }
  const vx = DG.x - DG.lx; DG.lx = DG.x; DG.tilt += (Math.max(-14, Math.min(14, vx*1.2)) - DG.tilt) * .25;
  DG.ghost.style.transform = `translate(${DG.x-DG.ox}px,${DG.y-DG.oy}px) rotate(${DG.tilt}deg) scale(${DG.hot ? .68 : 1.06})`;
  DG.raf = requestAnimationFrame(dragLoop);
}
function hitTest(){
  if(DG.y < trashH()){ setHot(true); return; }
  setHot(false);
  if(Date.now() < DG.cool) return;
  const ph = DG.card, cards = [...grid.querySelectorAll('.ac[data-k]')];

// S.chk[날짜] = {s: 쓴 돈 답, g: 받은 돈 답} · 'y' 네 다 적었어요 / 'z' 오늘은 없었어요 / 'n' 아직 못 적었어요. y·z 가 '예스' = 별 1개. 별은 기록에서 매번 다시 센다(저장하지 않음).
const LV_TITLES = ['겨자씨','새싹 청지기','알뜰 탐험가','계획 꿈나무','슬기 청지기','부지런한 개미','나눔 대장','감사 마스터','믿음직 일꾼','용돈 박사'];
const LV_MAX = LV_TITLES.length, CHK_HOUR = 18;
const lvNeed = n => 10 + 4*(n-1);                       // 레벨 n → n+1 에 필요한 별
const yes = v => v==='y' || v==='z';
const starsOf = () => Object.keys(S.chk).reduce((n,d) => n + (yes(S.chk[d].s)?1:0) + (yes(S.chk[d].g)?1:0), 0);
function lvOf(stars){ let lv = 1, rem = stars; while(lv < LV_MAX && rem >= lvNeed(lv)){ rem -= lvNeed(lv); lv++; } return {lv, into:rem, need: lv<LV_MAX ? lvNeed(lv) : 0}; }
const dayShift = (d, n) => { const x = new Date(d+'T00:00:00'); x.setDate(x.getDate()+n); return dstr(x); };
const chkDone = d => { const c = S.chk[d]; return !!(c && c.s && c.g); };
const chkFull = d => { const c = S.chk[d]; return !!(c && yes(c.s) && yes(c.g)); };
function streakOf(){ let d = todayStr(); if(!chkFull(d)) d = dayShift(d,-1); let n = 0; while(chkFull(d)){ n++; d = dayShift(d,-1); } return n; }
// 지금 마무리할 수 있는 날: 저녁 6시 뒤의 오늘, 그리고 아직 답 안 한 어제
function chkDue(){ const out = [], t = todayStr(), y = dayShift(t,-1);
  if(S.tx.length){ if(!chkDone(y)) out.push(y); if(new Date().getHours() >= CHK_HOUR && !chkDone(t)) out.push(t); }
  return out; }

let prevAudio = null, prevFile = null;
function previewStop(){
  if(prevAudio) prevAudio.pause();
  const had = prevFile; prevFile = null;
  if(had){ if(bgmPlaying && bgmAudio) bgmAudio.play().catch(()=>{}); else keepAudio(false); renderTracks(); }
}
function previewToggle(f){
  if(prevFile === f){ previewStop(); return; }
  if(S.mute){ toast('위쪽 스피커 버튼으로 소리를 먼저 켜 주세요'); return; }
  if(!ac()){ toast('이 폰에서는 소리를 낼 수 없어요'); return; }
  unlockAudio(); applyVols(); keepAudio(true);
  if(!prevAudio){ prevAudio = new Audio(); prevAudio.preload = 'auto';
    try{ AC.createMediaElementSource(prevAudio).connect(PRVG); }catch(e){}
    prevAudio.addEventListener('ended', () => previewStop());
    prevAudio.addEventListener('error', () => { if(prevFile){ toast('이 곡은 재생할 수 없어요'); previewStop(); } }); }
  if(bgmAudio && !bgmAudio.paused) bgmAudio.pause();
  prevFile = f; prevAudio.src = BGM_DIR + encodeURIComponent(f); prevAudio.play().catch(() => previewStop());
  renderTracks();
}
const PLAY_ICO = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5.500v13l11-6.500z"/></svg>';
const STOP_ICO = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><rect x="6" y="5" width="4.500" height="14" rx="1.200"/><rect x="13.500" y="5" width="4.500" height="14" rx="1.200"/></svg>';
const GRIP_ICO = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round"><path d="M5 8h14M5 12h14M5 16h14"/></svg>';
function trkReorder(list){        // 맨 왼쪽 손잡이를 잡고 위아래로 끌어 순서 바꾸기
  let d = null;
  list.addEventListener('pointerdown', e => {
    const h = e.target.closest('.hd'); if(!h || (e.pointerType==='mouse' && e.button!==0)) return;
    const row = h.closest('.trk'); d = {id:e.pointerId, row, y0:e.clientY};
    row.classList.add('lift'); try{ h.setPointerCapture(e.pointerId); }catch(_){} buzz(15); e.preventDefault();
  });
  list.addEventListener('pointermove', e => {
    if(!d || e.pointerId!==d.id) return;
    const r = d.row, lr = list.getBoundingClientRect();
    if(e.clientY < lr.top + 28) list.scrollTop -= 8; else if(e.clientY > lr.bottom - 28) list.scrollTop += 8;     // 가장자리에서 자동 스크롤
    r.style.transform = 'translateY('+(e.clientY - d.y0)+'px) scale(1.02)';
    for(let n = 0; n < 4; n++){                                                                                  // 위·아래 줄의 가운데를 넘으면 자리 바꿈
      const c = r.getBoundingClientRect(), mid = c.top + c.height/2, nx = r.nextElementSibling, pv = r.previousElementSibling;
      if(nx && mid > nx.getBoundingClientRect().top + nx.offsetHeight/2){ const t0 = r.offsetTop; nx.after(r); d.y0 += r.offsetTop - t0; buzz(6); }
      else if(pv && mid < pv.getBoundingClientRect().top + pv.offsetHeight/2){ const t0 = r.offsetTop; pv.before(r); d.y0 += r.offsetTop - t0; buzz(6); }
      else break;
      r.style.transform = 'translateY('+(e.clientY - d.y0)+'px) scale(1.02)';
    }
  });
  const end = e => {
    if(!d || (e && e.pointerId!==d.id)) return; const r = d.row; d = null;
    r.style.transform = ''; r.classList.remove('lift');
    S.bgmOrder = [...list.querySelectorAll('.trk')].map(x => x.dataset.f); save();
    bgmList = bgmOrder(bgmList); bgmApplySel(); renderTracks();
  };
  list.addEventListener('pointerup', end); list.addEventListener('pointercancel', end);
}
function renderTracks(){

  if(!bgmList.length){

    <div class="trks">${bgmList.map(t => `<div class="trk ${isSel(t.file)?'on':''}" data-f="${esc(t.file)}"><span class="hd" aria-label="순서 바꾸기">${GRIP_ICO}</span><button class="sel"><i class="ck"></i><span class="tt">${esc(t.title)}</span>${bgmPlaying && bgmCur===t.file && prevFile===null ? '<b>♪</b>' : ''}</button><button class="pv ${prevFile===t.file?'on':''}" aria-label="미리듣기">${prevFile===t.file ? STOP_ICO : PLAY_ICO}</button></div>`).join('')}</div>
    <button class="linkbtn" id="trkReload" style="margin-top:0">곡 목록 새로 불러오기</button>`;
  $('trkAll').onclick = () => { S.bgmSel = null; save(); bgmApplySel(); renderTracks(); };
  $('trkReload').onclick = () => { bgmLoaded = false; renderTracks(); bgmLoadList(true).then(renderTracks); };
  const list = box.querySelector('.trks'); trkReorder(list);
  list.onclick = e => {
    const row = e.target.closest('.trk'); if(!row) return; const f = row.dataset.f;
    if(e.target.closest('.pv')){ buzz(8); previewToggle(f); return; }
    if(!e.target.closest('.sel')) return; buzz(8);
    const cur = bgmList.map(t => t.file).filter(x => isSel(x)), next = cur.includes(f) ? cur.filter(x => x!==f) : cur.concat(f);
    if(!next.length){ toast('곡을 하나는 골라 주세요'); return; }
    S.bgmSel = next.length === bgmList.length ? null : bgmList.map(t => t.file).filter(x => next.includes(x));
    save(); bgmApplySel(); renderTracks(); };
}

    let o; try{ o = JSON.parse($('rText').value.trim()); }catch(e){ toast('백업 내용이 이상해요'); return; }
    const d = o && o.app==='allowance' && o.data; if(!d || !Array.isArray(d.tx)){ toast('용돈 친구들 백업이 아니에요'); return; }
    const tx = d.tx.filter(t => t && (t.t==='in'||t.t==='out'||t.t==='mv') && Number.isFinite(+t.amt) && +t.amt>0 && /^\d{4}-\d{2}-\d{2}$/.test(t.date||''))
      .map(t => ({id:String(t.id||uid()), t:t.t, amt:Math.round(+t.amt), memo:String(t.memo||'').slice(0,40), note:String(t.note||'').slice(0,60), ch:t.ch&&CH[t.ch]?t.ch:null, date:t.date, acct:t.acct==='card'?'card':'cash', from:t.from==='card'?'card':'cash', to:t.to==='card'?'card':'cash', cat:t.cat?String(t.cat):null, plan:t.plan?String(t.plan):null, at:+t.at||0}));
    const n = migrate({tx, alloc:d.alloc, tiles:d.tiles, custom:d.custom, gone:d.gone, goals:d.goals, chk:d.chk, exp:d.exp, useExp:d.useExp, givers:d.givers,
      plans: Array.isArray(d.plans) ? d.plans.filter(p=>p&&p.name&&Number.isFinite(+p.amt)).map(p=>({id:String(p.id||uid()), name:String(p.name), amt:Math.round(+p.amt), done:!!p.done})) : []});
    if(!confirm('기록 '+n.tx.length+'개, 칸 '+n.tiles.length+'개를 불러와요.\n지금 기록은 모두 바뀌어요. 계속할까요?')) return;
    S = Object.assign(n, {lastBackup:S.lastBackup}); save(); closeSheet(); render(); toast('불러왔어요!');
  };
}

/* ───────── 소리 켜고 끄기 (홈 위쪽 스피커) ───────── */
const SPK_ON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.500v5h4l5 4v-13l-5 4z" fill="currentColor" fill-opacity=".15"/><path d="M16.500 9a4 4 0 010 6M19 6.500a8 8 0 010 11"/></svg>';
const SPK_OFF = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.500v5h4l5 4v-13l-5 4z" fill="currentColor" fill-opacity=".15"/><path d="M17 9.500l4.500 5M21.500 9.500l-4.500 5"/></svg>';
function renderMute(){ const b = $('muteBtn'); b.innerHTML = S.mute ? SPK_OFF : SPK_ON; b.classList.toggle('off', S.mute); b.setAttribute('aria-pressed', S.mute ? 'true' : 'false'); }
$('muteBtn').onclick = () => {
  S.mute = !S.mute; save(); renderMute();
  if(S.mute){ bgmStop(); toast('소리를 껐어요'); }
  else { unlockAudio(); bgmStart(); sfx('plus'); toast('소리를 켰어요'); }
};

/* ───────── 연결 ───────── */
$('allocPig').innerHTML = face('pig');
$('ctaFace').innerHTML = face('pig');
$('tiHome').innerHTML = TAB_ICONS.home; $('tiAlloc').innerHTML = TAB_ICONS.plan; $('tiLog').innerHTML = TAB_ICONS.log;
$('bIn').onclick = () => { buzz(10); txFlow('in'); };
$('bOut').onclick = () => { buzz(10); txFlow('out'); };
$('bMove').onclick = () => { buzz(10); moveFlow(); };
$('acctTabs').onclick = e => { const b = e.target.closest('button'); if(!b) return; curAcct = b.dataset.a; S.lastAcct = curAcct; save(); buzz(8); renderAlloc(); };
$('assets').onclick = e => { const b = e.target.closest('button'); if(!b) return; curAcct = b.dataset.a; S.lastAcct = curAcct; save(); renderAlloc(); goTab('vAlloc'); };
$('bExp').onclick = () => { buzz(10); expFlow(); };
$('bAlloc').onclick = () => { buzz(10); goTab('vAlloc'); };
$('gear').onclick = backupSheet;
renderMute();
$('recent').onclick = $('list').onclick = e => { const b = e.target.closest('[data-tx]'); if(b) txSheet(b.dataset.tx); };
$('dash').onclick = e => { if(!e.target.closest('#dashTog')) return; S.dashOpen = !S.dashOpen; save(); buzz(8); renderDash(); };
$('mPrev').onclick = () => { month = monthShift(month,-1); renderLog(); };
$('mNext').onclick = () => { if(month < todayStr().slice(0,7)){ month = monthShift(month,1); renderLog(); } };
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { buzz(8); goTab(b.dataset.v); });
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
