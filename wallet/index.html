<!DOCTYPE html>
<!-- 용돈 친구들 v. 26-1008-2 — BLOCK7 과 별개인 독립 앱 (wallet/) -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffe3ee">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<title>용돈 친구들</title>
<style>
:root{
  --ink:#4a3b6b; --sub:#9a8cb5;
  --pink:#ff6fa5; --pink-d:#d9467f; --green:#3cc98a; --green-d:#209a63; --orange:#ffa63d; --orange-d:#d97d10;
  --blue:#5aa9ff; --blue-d:#2f7fd9; --yellow:#ffd84d; --yellow-d:#e0a900; --purple:#9b7bff; --purple-d:#6d4fd6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{font-family:'Jua','Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#ffe3ee 0%,#e6f1ff 55%,#e9fbf1 100%);overflow:hidden;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
.view{display:none;flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 120px}
.view.on{display:block;animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 큰 둥근 버튼 */
.gb{--c:var(--pink);--d:var(--pink-d);display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--c);color:#fff;border-radius:22px;padding:16px 14px;font-size:22px;letter-spacing:.02em;
  box-shadow:0 6px 0 var(--d);text-shadow:0 2px 0 rgba(0,0,0,.12);transition:transform .08s,box-shadow .08s}
.gb:active{transform:translateY(5px);box-shadow:0 1px 0 var(--d)}
.gb.green{--c:var(--green);--d:var(--green-d)} .gb.orange{--c:var(--orange);--d:var(--orange-d)}
.gb.blue{--c:var(--blue);--d:var(--blue-d)} .gb.purple{--c:var(--purple);--d:var(--purple-d)}
.gb.gray{--c:#c9c0dc;--d:#a79dc2}
.gb[disabled]{opacity:.45;pointer-events:none}
.gb.sm{font-size:17px;padding:11px 12px;border-radius:18px;box-shadow:0 4px 0 var(--d)}
.card{background:#fff;border-radius:26px;box-shadow:0 6px 0 rgba(120,90,170,.14)}

/* 홈 */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.logo{font-size:20px;color:var(--pink-d)}
.iconbtn{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 0 rgba(120,90,170,.18);color:var(--purple)}
.topbtns{display:flex;gap:10px}
.iconbtn.off{color:#b9aed6}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(120,90,170,.18)}
.hero{position:relative;padding:14px 16px 16px;text-align:center;margin-bottom:16px}
.bubble{position:relative;display:inline-block;background:#fff8d6;border:3px solid var(--yellow);border-radius:20px;padding:8px 14px;font-size:16px;line-height:1.4;margin-bottom:12px;max-width:92%}
.bubble:after{content:"";position:absolute;left:50%;bottom:-13px;margin-left:-10px;border:10px solid transparent;border-top-color:var(--yellow);border-bottom:0}
.pigwrap{width:190px;margin:6px auto 0;position:relative}
.pigwrap svg{width:100%;display:block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1.5deg)}}
.coindrop{position:absolute;left:50%;top:-8px;width:34px;margin-left:-6px;animation:drop 2.4s ease-in infinite}
@keyframes drop{0%{transform:translateY(-6px) scale(.9);opacity:0}15%{opacity:1}60%{transform:translateY(30px) scale(1)}70%,100%{transform:translateY(40px) scale(.2);opacity:0}}
.money{font-size:50px;color:var(--pink-d);line-height:1;margin-top:8px;text-shadow:0 3px 0 #ffd3e4}
.money small{font-size:22px;margin-left:2px}
.moneylbl{font-size:15px;color:var(--sub);margin-top:4px}
.pendchip{display:inline-block;margin-top:8px;background:#e8f7ee;color:var(--green-d);border-radius:14px;padding:4px 12px;font-size:15px}
.pendchip:empty{display:none}
.two{display:flex;gap:12px;margin-bottom:12px}
.cta{display:flex;align-items:center;gap:12px;padding:12px 16px;margin:14px 0 16px;width:100%;text-align:left;
  background:linear-gradient(135deg,#9b7bff,#6aa9ff);color:#fff;border-radius:26px;box-shadow:0 6px 0 var(--purple-d);animation:wob 2.6s ease-in-out infinite}
.cta:active{transform:translateY(5px);box-shadow:0 1px 0 var(--purple-d)}
@keyframes wob{0%,100%{transform:rotate(0)}4%{transform:rotate(-1.4deg)}8%{transform:rotate(1.4deg)}12%{transform:rotate(0)}}
.cta .t{font-size:21px;text-shadow:0 2px 0 rgba(0,0,0,.15)} .cta .s{font-size:14px;opacity:.95}
.cta .f{width:62px;flex:none}
.sec{font-size:16px;color:var(--sub);margin:4px 6px 8px}

/* 아바타·기록 */
.av{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;border:3px solid #fff;box-shadow:0 3px 0 rgba(120,90,170,.15)}
.av svg{width:84%;height:84%}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px 10px 10px;margin-bottom:10px}
.row .mid{flex:1;min-width:0}.row .t{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--sub)}.row .a{font-size:20px;white-space:nowrap}
.in{color:var(--green-d)}.out{color:var(--pink-d)}
.mon{display:flex;align-items:center;justify-content:center;gap:16px;margin:4px 0 8px;font-size:22px}
.mon button{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--purple);box-shadow:0 4px 0 rgba(120,90,170,.18)}
.msum{text-align:center;font-size:15px;color:var(--sub);margin-bottom:12px}
.day{font-size:14px;color:var(--sub);margin:12px 6px 6px}
.empty{text-align:center;color:var(--sub);padding:30px 10px;font-size:17px;line-height:1.6}
.empty svg{width:96px;display:block;margin:0 auto 8px}

/* 계획세우기 */
.allochead{padding:14px 16px;margin-bottom:12px}
.free{display:flex;align-items:center;gap:10px}
.free .f{width:54px;flex:none}
.free .l{font-size:15px;color:var(--sub)} .free .v{font-size:32px;color:var(--pink-d);line-height:1.1}
.free .v.zero{color:var(--green-d)} .free .v.bad{color:#d9462f}
.free .x{font-size:13px;color:var(--green-d);margin-top:2px}
.warnchip{background:#fff3d6;border-radius:14px;padding:6px 12px;font-size:14px;margin-top:10px;color:#9a6a00;line-height:1.4}
.stack{position:relative;display:flex;height:16px;border-radius:9px;overflow:hidden;background:#efe9fb;margin-top:12px}
.stack i{position:relative;z-index:1;display:block;height:100%;transition:width .3s}
.stack b{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(45deg,#d6f3e2 0 6px,#bfe9d1 6px 12px)}
.hint{padding:14px;margin-bottom:12px;text-align:center;font-size:17px;line-height:1.5}
.hint .two{margin:12px 0 0}
.expcard{padding:12px 14px;margin-bottom:12px}
.exh{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:18px}
.exh small{display:block;font-size:13px;color:var(--sub)}
.sw{width:54px;height:32px;border-radius:16px;background:#d9ceee;position:relative;flex:none;transition:background .18s}
.sw i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15);transition:left .18s}
.sw.on{background:var(--green)} .sw.on i{left:25px}
.er{background:#f7f3ff;border-radius:18px;padding:10px;margin-top:10px}
.er .r1{display:flex;align-items:center;gap:10px}
.er .mid{flex:1;min-width:0}.er .t{font-size:17px}.er .s{font-size:13px;color:var(--sub)}.er .s.late{color:#d9462f}
.er .a{font-size:19px;color:var(--green-d);white-space:nowrap}
.er .eb{display:flex;gap:8px;margin-top:8px}
.er .eb .gb{flex:1}
.steps{display:flex;gap:8px;align-items:center;margin:0 0 12px;font-size:15px;color:var(--sub)}
.steps button{flex:1;background:#fff;border-radius:16px;padding:8px 0;font-size:17px;color:var(--purple);box-shadow:0 4px 0 rgba(120,90,170,.16)}
.steps button.on{background:var(--purple);color:#fff;box-shadow:0 4px 0 var(--purple-d)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ac{position:relative;padding:12px 10px 12px;text-align:center;background:var(--bg,#fff);border-radius:26px;box-shadow:0 6px 0 rgba(120,90,170,.16)}
.ac .face{display:block;width:68px;margin:0 auto}.ac .face svg{width:100%;display:block}
.ac.bounce .face{animation:jump .4s}
@keyframes jump{30%{transform:translateY(-12px) scale(1.08)}60%{transform:translateY(0) scale(.96)}}
.ac .nm{display:inline-flex;align-items:center;gap:4px;font-size:18px;margin-top:2px;max-width:100%}
.ac .nm svg{width:13px;height:13px;color:#a79dc2;flex:none}
.ac .amt{display:block;font-size:26px;color:var(--ink);background:rgba(255,255,255,.75);border-radius:14px;margin:6px 4px 2px;padding:3px 0;width:calc(100% - 8px)}
.ac .amt.pop{animation:pop .3s}
@keyframes pop{40%{transform:scale(1.15)}}
.ac .amt.neg{color:var(--pink-d);font-size:20px;padding:7px 0}
.ac .sub{font-size:12px;color:#7d6fa0;min-height:16px}
.pm{display:flex;gap:8px;margin-top:6px;justify-content:center}
.pm button{width:56px;height:46px;border-radius:16px;font-size:30px;line-height:1;color:#fff;display:grid;place-items:center;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.pm .m{background:#b9aed6;box-shadow:0 4px 0 #9487b8}.pm .p{background:var(--green);box-shadow:0 4px 0 var(--green-d)}
.pm button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.ac.add{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;border:3px dashed #cdbdf0;box-shadow:none;color:var(--purple);min-height:200px;font-size:18px}
.ac.add .plus{font-size:50px;line-height:1}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.ac.ph{opacity:.3;outline:3px dashed var(--purple);outline-offset:-3px}
.ac.land{animation:land .45s}
@keyframes land{0%{transform:scale(1.12)}45%{transform:scale(.94)}100%{transform:scale(1)}}
.ac.land .face{animation:jump .4s}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;box-shadow:0 20px 34px rgba(74,59,107,.38);will-change:transform;opacity:.98}
.ghost .pm{visibility:hidden}
#trash{position:fixed;top:0;left:0;right:0;max-width:520px;margin:0 auto;height:calc(env(safe-area-inset-top) + 66px);padding-top:env(safe-area-inset-top);
  display:flex;align-items:center;justify-content:center;gap:10px;font-size:19px;color:#fff;background:linear-gradient(#ff9aa9,#ff6c85);
  border-radius:0 0 26px 26px;transform:translateY(-110%);transition:transform .22s cubic-bezier(.2,1.2,.4,1),background .15s;z-index:45;box-shadow:0 8px 18px rgba(255,90,120,.35);pointer-events:none}
#trash.on{transform:none} #trash.hot{background:linear-gradient(#ff5a78,#e0244b)}
#trash svg{width:30px;height:30px;transition:transform .15s}
#trash.hot svg{transform:scale(1.3) rotate(-8deg)} #trash.hot span:before{content:"놓으면 지워요!"} #trash:not(.hot) span:before{content:"여기로 끌면 지워요"}
.sp{position:fixed;z-index:60;pointer-events:none;font-size:20px;color:#ffc61a;animation:spark .65s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2) rotate(180deg);opacity:0}}
body.dragging,body.dragging *{cursor:grabbing!important}
body.dragging .toast{opacity:0!important}
.smallnote{text-align:center;color:var(--sub);font-size:14px;margin:14px 0 4px}
.linkbtn{display:block;margin:10px auto 0;color:var(--sub);font-size:14px;text-decoration:underline;padding:8px}

/* 대시보드 */
.dash{margin-bottom:12px;overflow:hidden}
.dh{display:flex;align-items:center;gap:8px;width:100%;padding:14px 16px;font-size:19px;text-align:left}
.dsum{flex:1;text-align:right;font-size:13px;color:var(--sub)}
.dh .chev{width:22px;height:22px;color:var(--purple);margin-left:auto;transition:transform .2s;flex:none}
.dh .chev.up{transform:rotate(180deg)}
.dbody{padding:0 16px 14px;animation:fadeUp .25s ease}
.dt{font-size:14px;color:var(--sub);margin:10px 2px 6px}
.pie{display:flex;align-items:center;gap:14px}
.donut{width:128px;flex:none;transform:rotate(0)}
.leg{flex:1;min-width:0;font-size:14px}
.leg div{display:flex;align-items:center;gap:6px;margin:3px 0}
.leg i,.leg2 i{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.leg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg b{font-weight:400;color:var(--sub)}
.bars{width:100%;display:block}
.leg2{display:flex;gap:14px;justify-content:center;font-size:13px;color:var(--sub);margin-top:2px}
.leg2 span{display:inline-flex;align-items:center;gap:5px}
.ins{display:flex;gap:10px;align-items:flex-start;background:#f7f3ff;border-radius:16px;padding:9px 12px;margin-bottom:8px;font-size:15px;line-height:1.45}
.ins .f{width:30px;flex:none}.ins .f svg{width:100%;display:block}
.ins b{font-weight:400;color:var(--pink-d)}
.memolink{margin:2px auto 8px}
.memoin{margin:2px 0 12px;font-size:17px}
.setrow{display:flex;align-items:center;justify-content:space-between;background:#f7f3ff;border-radius:18px;padding:10px 14px;margin-bottom:10px;font-size:18px}
.setrow small{display:block;font-size:12px;color:var(--sub)}
/* 시트 */
.dim{position:fixed;inset:0;background:rgba(74,59,107,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:linear-gradient(#fffaf3,#fff);border-radius:30px 30px 0 0;
  padding:8px 18px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,1.2,.4,1);z-index:11;max-height:94vh;overflow-y:auto}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:#e2d8f3;margin:4px auto 10px}
.sheet h2{font-size:24px;text-align:center;margin:0 0 6px;font-weight:400}
.who{display:flex;align-items:center;justify-content:center;gap:10px}
.who .av{width:44px;height:44px}
.disp{text-align:center;font-size:48px;color:var(--pink-d);line-height:1.2;margin:4px 0 8px;min-height:58px}
.disp small{font-size:22px}
.chips{display:flex;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.chips button{background:#fff3c4;border-radius:18px;padding:7px 12px;font-size:16px;box-shadow:0 3px 0 #ecd270}
.chips button:active{transform:translateY(2px);box-shadow:0 1px 0 #ecd270}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.pad button{background:#fff;border-radius:18px;height:54px;font-size:28px;color:var(--ink);box-shadow:0 4px 0 #d9ceee}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #d9ceee}
.pad .del{background:#ffe3ee;color:var(--pink-d);box-shadow:0 4px 0 #f3b9d0}
.datebtn{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;margin:0 auto 12px;color:var(--sub);font-size:16px;width:max-content;padding:4px 10px}
.datebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 6px}
.pk{background:var(--bg,#fff);border-radius:22px;padding:10px 4px 8px;text-align:center;box-shadow:0 5px 0 rgba(120,90,170,.16);font-size:16px;position:relative}
.pk:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(120,90,170,.16)}
.pk .face{width:58px;margin:0 auto}.pk .face svg{width:100%;display:block}
.pk.on{outline:4px solid var(--purple)}
.pk5{grid-template-columns:repeat(5,1fr);gap:8px;max-height:36vh;overflow-y:auto;padding:4px 4px 8px;margin:4px 0 8px}
.pk5 .pk{padding:5px 2px 3px;font-size:11px;border-radius:16px}.pk5 .pk .face{width:100%}
.gtabs{display:flex;gap:6px;margin:12px 0 4px;overflow-x:auto;padding-bottom:6px}
.gtabs button{flex:none;padding:7px 14px;border-radius:16px;background:#fff;font-size:16px;color:var(--purple);box-shadow:0 3px 0 #d9ceee}
.gtabs button.on{background:var(--purple);color:#fff;box-shadow:0 3px 0 var(--purple-d)}
.inp{width:100%;border:3px solid #e2d8f3;border-radius:18px;padding:12px 14px;font:inherit;font-size:20px;color:var(--ink);background:#fff;outline:none;user-select:text;-webkit-user-select:text}
.inp:focus{border-color:var(--purple)}
.note{font-size:15px;color:var(--sub);line-height:1.6;text-align:center;margin:4px 6px 12px}
.stack-btns .gb{margin-bottom:12px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 14px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 16px);transform:translate(-50%,-30px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:22px;
  font-size:17px;opacity:0;transition:all .25s;pointer-events:none;z-index:70;max-width:90%;text-align:center}
.toast.on{opacity:.96;transform:translate(-50%,0)}

/* 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;display:flex;align-items:flex-end;background:#fff;border-radius:26px 26px 0 0;
  box-shadow:0 -4px 18px rgba(120,90,170,.14);padding:6px 10px calc(env(safe-area-inset-bottom) + 6px);z-index:5}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:14px;color:var(--sub);padding:4px 0;white-space:nowrap}
.tabs button .ti{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;transition:all .15s}
.tabs button .ti svg{width:30px;height:30px}
.tabs button.on{color:var(--pink-d)}
.tabs button.on .ti{background:#ffe3ee;transform:translateY(-6px) scale(1.18)}
.tabs button.mid .ti{background:var(--purple);width:50px;height:50px;transform:translateY(-14px);box-shadow:0 5px 0 var(--purple-d)}
.tabs button.mid .ti svg{width:34px;height:34px}
.tabs button.mid{margin-top:-10px}
.tabs button.mid.on{color:var(--purple-d)}
.tabs button.mid.on .ti{transform:translateY(-16px) scale(1.1)}

/* 꽃가루 */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:80}
.confetti i{position:absolute;top:-24px;width:14px;height:14px;border-radius:3px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.9}}
</style>
</head>
<body>
<div id="app">
  <!-- 홈 -->
  <section class="view on" id="vHome">
    <div class="top"><span class="logo">용돈 친구들</span>

<script>
'use strict';
const APP_VERSION = "v. 26-1008-2";
const KEY = 'allowance.v1';      // 저장 키는 v1 그대로 — 모자란 칸은 불러올 때 migrate() 가 채운다
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = n => Number(n).toLocaleString('ko-KR');
const won = n => nf(n) + '원';
const buzz = ms => { try{ navigator.vibrate && navigator.vibrate(ms||12); }catch(e){} };


/* ───────── 소리 (파일 없이 휴대폰이 직접 만든다 — 저작권·용량 걱정 없음) ───────── */
let AC = null, SFXG = null, BGMG = null, bgmTimer = null, bgmStep = 0, bgmNext = 0;
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)();
      SFXG = AC.createGain(); SFXG.gain.value = .7; SFXG.connect(AC.destination);
      BGMG = AC.createGain(); BGMG.gain.value = .2; BGMG.connect(AC.destination); }catch(e){ AC = null; return null; } }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function tone(dest, f, when, dur, type, vol, toF){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, when); if(toF) o.frequency.exponentialRampToValueAtTime(toF, when+dur);
  g.gain.setValueAtTime(0.0001, when); g.gain.exponentialRampToValueAtTime(vol, when+Math.min(.015, dur/3)); g.gain.exponentialRampToValueAtTime(0.0001, when+dur);
  o.connect(g); g.connect(dest); o.start(when); o.stop(when+dur+.05);
}
function sfx(name){
  if(!S.sfx || S.mute || !ac()) return;
  const t = AC.currentTime, T = (f,at,d,ty,v,to) => tone(SFXG, f, t+at, d, ty||'sine', v||.25, to);
  switch(name){
    case 'tap': T(660,0,.05,'sine',.12); break;
    case 'plus': T(523,0,.08,'triangle',.28); T(784,.07,.12,'triangle',.28); break;
    case 'minus': T(523,0,.08,'triangle',.25); T(392,.07,.12,'triangle',.25); break;
    case 'coin': T(988,0,.07,'square',.1); T(1319,.07,.28,'square',.1); break;
    case 'win': [523,659,784,1047].forEach((f,i) => T(f,i*.09,.16,'triangle',.28)); T(1319,.4,.4,'triangle',.25); break;
    case 'lift': T(440,0,.14,'sine',.3,880); break;
    case 'land': T(170,0,.16,'sine',.5,60); T(880,.02,.06,'triangle',.12); break;
    case 'trash': T(700,0,.32,'sawtooth',.1,110); break;
    case 'err': T(170,0,.12,'square',.1); T(125,.11,.16,'square',.1); break;
  }
}
const BGM_SC = [0,2,4,7,9];
const BGM_ML = [5,-1,7,-1,6,7,5,-1, 4,-1,6,-1,5,6,4,-1,  7,-1,9,-1,8,9,7,-1, 6,7,8,-1,9,-1,7,-1];
const BGM_BASS = [0,-3,5,7];
function bgmTick(){
  if(!AC || !S.bgm || S.mute) return;
  const stepDur = 60/104/2;
  while(bgmNext < AC.currentTime + .6){
    const i = bgmStep % 32, d = BGM_ML[i];
    if(d >= 0){ const semi = BGM_SC[d%5] + 12*Math.floor(d/5); tone(BGMG, 261.63*Math.pow(2, semi/12), bgmNext, .26, 'triangle', .5); }
    if(i%4===0){ const r = BGM_BASS[Math.floor(i/8)%4]; tone(BGMG, 130.81*Math.pow(2, r/12), bgmNext, .5, 'sine', .55); if(i%8===4) tone(BGMG, 130.81*Math.pow(2,(r+7)/12), bgmNext, .4, 'sine', .35); }
    bgmNext += stepDur; bgmStep++;
  }
}
function bgmStart(){ if(!S.bgm || S.mute || bgmTimer) return; if(!ac()) return; bgmNext = AC.currentTime + .1; bgmTimer = setInterval(bgmTick, 150); bgmTick(); }
function bgmStop(){ if(bgmTimer){ clearInterval(bgmTimer); bgmTimer = null; } }
document.addEventListener('visibilitychange', () => { if(document.hidden) bgmStop(); else bgmStart(); });
// 브라우저는 '손가락으로 눌러야' 소리를 허락한다 → 첫 터치에 배경음악을 시작하고, 버튼마다 톡 소리
document.addEventListener('pointerdown', e => {
  if(!bgmTimer) bgmStart();
  const b = e.target.closest && e.target.closest('button'); if(b && !b.closest('.pm') && !b.closest('.ac')) sfx('tap');
}, true);

/* ───────── 칸·이름표 ───────── */
const DEFAULT_TILES = [
  {k:'snack', n:'간식', ch:'bear'}, {k:'stat', n:'문구', ch:'bunny'}, {k:'save', n:'저금', ch:'pig'}, {k:'gift', n:'선물', ch:'cat'},
  {k:'play', n:'놀이', ch:'dog'}, {k:'style', n:'꾸미기', ch:'penguin'}, {k:'give', n:'헌금', ch:'chick'}, {k:'etc', n:'기타', ch:'hamster'}
];
const DEFAULT_GIVERS = [
  {n:'엄마', ch:'cat'}, {n:'아빠', ch:'bear'}, {n:'할머니', ch:'bunny'}, {n:'할아버지', ch:'dog'}, {n:'친척', ch:'penguin'}, {n:'명절 용돈', ch:'chick'}, {n:'기타', ch:'hamster'}
];
// 기록에는 그때의 캐릭터(ch)를 같이 저장해 두므로, 사람을 지우거나 바꿔도 예전 기록의 얼굴은 그대로다
const giverCh = (n, ch) => (ch && CH[ch]) ? ch : ((S.givers.find(g => g.n===n)||{}).ch || 'hamster');
const catOf = k => S.tiles.find(c => c.k===k) || (S.gone && S.gone[k] && Object.assign({k}, S.gone[k])) || {k, n:'기타', ch:'hamster'};

/* ───────── 저장 ───────── */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,5);
const pad2 = n => String(n).padStart(2,'0');
const dstr = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayStr = () => dstr(new Date());
const dayAdd = n => { const d = new Date(); d.setDate(d.getDate()+n); return dstr(d); };
let S = load();
function blank(){ return {v:2, tx:[], plans:[], alloc:{}, tiles:DEFAULT_TILES.map(t=>Object.assign({},t)), custom:[], gone:{}, exp:[], useExp:true, givers:DEFAULT_GIVERS.map(g=>Object.assign({},g)), dashOpen:true, sfx:true, bgm:false, mute:false, lastBackup:0}; }
function migrate(o0){
  // 어떤 예전 모양이 와도 현재 모양으로: v1(계획 목록) · 개편1(custom 칸) → tiles
  const o = Object.assign(blank(), o0||{});
  o.tx = Array.isArray(o.tx) ? o.tx : [];
  o.alloc = (o.alloc && typeof o.alloc==='object') ? o.alloc : {};
  if(!Array.isArray(o.tiles) || !(o0 && Array.isArray(o0.tiles))) o.tiles = DEFAULT_TILES.map(t=>Object.assign({},t));
  if(Array.isArray(o.custom)) o.custom.forEach(c => { if(c && c.k && c.n && !o.tiles.find(t=>t.k===c.k)) o.tiles.push({k:c.k, n:c.n, ch:c.ch}); });
  o.custom = [];
  if(Array.isArray(o.plans)) o.plans.forEach(p => { if(!p || !p.name) return; const k = 'c_' + p.id;
    if(!o.tiles.find(t=>t.k===k)) o.tiles.push({k, n:String(p.name), ch:'star'});
    if(!p.done) o.alloc[k] = p.amt;
    o.tx.forEach(t => { if(t.plan===p.id && !t.cat) t.cat = k; }); });
  o.plans = [];
  const seen = new Set();
  o.tiles = o.tiles.filter(t => t && t.k && t.n && !seen.has(String(t.k)) && seen.add(String(t.k)))
    .map(t => ({k:String(t.k), n:String(t.n).slice(0,8), ch:CH[t.ch] ? t.ch : 'star'}));
  o.gone = (o.gone && typeof o.gone==='object') ? o.gone : {};
  o.exp = (Array.isArray(o.exp) ? o.exp : []).filter(e => e && Number.isFinite(+e.amt) && +e.amt>0)
    .map(e => ({id:String(e.id||uid()), amt:Math.round(+e.amt), who:String(e.who||'기타'), ch:CH[e.ch] ? e.ch : null, note:String(e.note||'').slice(0,60), date:/^\d{4}-\d{2}-\d{2}$/.test(e.date||'') ? e.date : null, at:+e.at||0}));
  o.useExp = o.useExp !== false;
  o.dashOpen = o.dashOpen !== false; o.sfx = o.sfx !== false; o.bgm = o.bgm === true; o.mute = o.mute === true;
  const seenG = new Set();
  if(!(o0 && Array.isArray(o0.givers))) o.givers = DEFAULT_GIVERS.map(g=>Object.assign({},g));
  o.givers = o.givers.filter(g => g && g.n && !seenG.has(String(g.n)) && seenG.add(String(g.n))).map(g => ({n:String(g.n).slice(0,8), ch:CH[g.ch] ? g.ch : 'hamster'}));
  o.tx.forEach(t => { if(t){ t.note = String(t.note||'').slice(0,60); if(t.ch && !CH[t.ch]) t.ch = null; } });
  Object.keys(o.alloc).forEach(k => { const v = Math.round(+o.alloc[k]); if(v>0) o.alloc[k] = v; else delete o.alloc[k]; });
  return o;
}
function load(){
  try{ const r = localStorage.getItem(KEY); if(r){ const o = JSON.parse(r); if(o && Array.isArray(o.tx)) return migrate(o); } }catch(e){}
  return blank();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('저장하지 못했어요'); } }

/* ───────── 계산 ───────── */
const balance = () => S.tx.reduce((a,t) => a + (t.t==='in' ? t.amt : -t.amt), 0);   // 받을 예정 돈은 잔액에 섞지 않는다
const pending = () => S.exp.reduce((a,e) => a + e.amt, 0);
const spent = k => S.tx.reduce((a,t) => a + (t.t==='out' && t.cat===k ? t.amt : 0), 0);
const alloc = k => S.alloc[k] || 0;
const left = k => alloc(k) - spent(k);
const reserved = () => S.tiles.reduce((a,c) => a + Math.max(0, left(c.k)), 0);
const avail = () => balance() - reserved() + (S.useExp ? pending() : 0);           // 계획 세울 수 있는 돈

/* ───────── 화면 ───────── */
let month = todayStr().slice(0,7), step = 1000;
function monthShift(m, d){ let [y,mm] = m.split('-').map(Number); mm += d; while(mm<1){mm+=12;y--} while(mm>12){mm-=12;y++} return y+'-'+pad2(mm); }
const wd = ['일','월','화','수','목','금','토'];

function txRow(t){
  const isIn = t.t==='in', c = isIn ? null : catOf(t.cat);
  const ch = isIn ? giverCh(t.memo, t.ch) : c.ch;
  return `<button class="row card" data-tx="${t.id}">${avatar(ch)}<span class="mid"><div class="t">${esc(isIn ? (t.memo||'용돈') : c.n)}</div><div class="s">${isIn?'받았어요':'썼어요'} · ${Number(t.date.slice(5,7))}월 ${Number(t.date.slice(8,10))}일${t.note?' · '+esc(t.note):''}</div></span><span class="a ${isIn?'in':'out'}">${isIn?'+':'−'}${nf(t.amt)}</span></button>`;
}
const sortedTx = list => list.slice().sort((a,b) => a.date<b.date?1:a.date>b.date?-1:(b.at||0)-(a.at||0));

function renderHome(){
  const bal = balance(), pend = pending(), av = avail();
  $('bal').innerHTML = (bal<0?'<span style="color:#d9462f">':'<span>')+nf(bal)+'</span><small>원</small>';
  $('pendChip').innerHTML = pend>0 ? '받을 예정 <b>+'+won(pend)+'</b>' : '';
  let msg;
  if(!S.tx.length && !S.exp.length) msg = '안녕! 나는 꿀꿀이야. 용돈을 받으면 초록 버튼을 눌러 줘!';
  else if(bal<=0 && pend>0) msg = '곧 '+won(pend)+' 받을 예정이야! 미리 계획을 세워 볼까?';
  else if(bal<=0) msg = '지갑이 텅 비었어… 다음 용돈이 기다려져!';
  else if(av<0) msg = '계획이 가진 돈보다 많아! 조금 줄여 볼까?';
  else if(av>0) msg = '아직 계획 안 세운 돈이 '+won(av)+' 있어! 계획을 세워 볼까?';
  else msg = '계획 완벽해! 정말 똑똑하다!';
  $('bubble').textContent = msg;
  $('ctaSub').textContent = (bal<=0 && pend<=0) ? '용돈을 받으면 시작할 수 있어요' : (av>0 ? '얼마는 뭐 하는 데 쓸까? ('+won(av)+' 남음)' : (av<0 ? '계획이 돈보다 커요!' : '다 세웠어요! 고쳐 볼까?'));
  const rec = sortedTx(S.tx).slice(0,3);
  $('recent').innerHTML = rec.length ? rec.map(txRow).join('') : '<div class="empty">아직 아무것도 없어요.<br>위의 버튼을 눌러 보세요!</div>';
}

const PENCIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-5L16 4l4 4L9 19z"/></svg>';
function expLabel(e){
  if(!e.date) return {t:'날짜는 아직 몰라요', late:false};
  const d = new Date(e.date+'T00:00:00'), t = new Date(todayStr()+'T00:00:00'), diff = Math.round((d-t)/864e5), md = (d.getMonth()+1)+'월 '+d.getDate()+'일';
  if(diff<0) return {t:md+' · 예정일이 지났어요 — 받았나요?', late:true};
  return {t: diff===0 ? '오늘 ('+md+')' : diff===1 ? '내일 ('+md+')' : md+' ('+diff+'일 뒤)', late:false};
}
const expSorted = () => S.exp.slice().sort((a,b) => (a.date||'9999')<(b.date||'9999')?-1:(a.date||'9999')>(b.date||'9999')?1:(a.at||0)-(b.at||0));

function renderAlloc(){
  const bal = balance(), pend = S.useExp ? pending() : 0, av = avail(), rsv = reserved();
  const v = $('freeV');
  if(av<0){ v.className = 'v bad'; v.textContent = won(-av)+' 모자라요'; }
  else if(av===0 && (bal+pend)>0){ v.className = 'v zero'; v.textContent = '계획 다 세웠어요!'; }
  else { v.className = 'v'; v.textContent = won(av); }
  $('freeX').textContent = (S.useExp && pending()>0) ? '받을 예정 '+won(pending())+' 포함' : '';
  const wc = $('warnChip');
  if(rsv > bal && av>=0 && S.useExp && pending()>0){ wc.style.display = ''; wc.textContent = '아직 못 받은 돈 '+won(rsv-bal)+'을 미리 쓰기로 했어요. 받으면 "받았어요!"를 눌러요.'; }
  else if(av<0){ wc.style.display = ''; wc.textContent = '계획으로 정한 돈이 가진 돈보다 많아요. 아래 칸의 −를 눌러 줄여 주세요.'; }
  else wc.style.display = 'none';
  const scale = Math.max(bal+pend, rsv, 1);
  $('stack').innerHTML = (pend>0 ? `<b style="left:${Math.max(bal,0)/scale*100}%"></b>` : '') + S.tiles.filter(c => left(c.k)>0).map(c => `<i style="width:${left(c.k)/scale*100}%;background:${colOf(c.ch)}"></i>`).join('');

  const hint = $('hint');
  if(!S.tx.length && !S.exp.length){ hint.style.display = ''; hint.innerHTML = `<div>먼저 용돈을 받았다고 알려 주세요!<br>받을 예정인 돈도 미리 적어 둘 수 있어요.</div><div class="two"><button class="gb green sm" id="hIn">받았어요!</button><button class="gb blue sm" id="hExp">받을 예정</button></div>`; }
  else hint.style.display = 'none';

  const ex = expSorted();
  $('expBox').innerHTML = `<div class="exh"><span>받을 예정인 돈${ex.length?`<small>합계 ${won(pending())}</small>`:''}</span>${ex.length?`<span style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub)">계획에 넣기<button class="sw ${S.useExp?'on':''}" id="swExp" aria-label="계획에 넣기"><i></i></button></span>`:''}</div>`
    + ex.map(e => { const l = expLabel(e); return `<div class="er" data-id="${e.id}"><div class="r1" data-ea="edit">${avatar(giverCh(e.who,e.ch))}<span class="mid"><div class="t">${esc(e.who)}</div><div class="s ${l.late?'late':''}">${l.t}</div>${e.note?`<div class="s">${esc(e.note)}</div>`:''}</span><span class="a">+${nf(e.amt)}</span></div><div class="eb"><button class="gb green sm" data-ea="get">받았어요!</button><button class="gb blue sm" data-ea="edit">고치기</button><button class="gb gray sm" data-ea="del">취소</button></div></div>`; }).join('')
    + `<button class="gb blue sm" id="addExp" style="margin-top:10px">＋ 받을 예정인 돈 적기</button>`;

  $('agrid').innerHTML = S.tiles.map(c => {
    const l = left(c.k), sp = spent(c.k);
    return `<div class="ac" data-k="${c.k}" style="--bg:${CH[c.ch].bg}"><button class="face" data-act="face">${face(c.ch)}</button>
      <button class="nm" data-act="name"><span>${esc(c.n)}</span>${PENCIL}</button>

      <div class="sub">${sp>0 ? '쓴 돈 '+nf(sp)+'원' : (alloc(c.k)>0 ? '' : '눌러서 계획해요')}</div>
      <div class="pm"><button class="m" data-act="m" aria-label="줄이기">−</button><button class="p" data-act="p" aria-label="늘리기">+</button></div></div>`;
  }).join('') + `<button class="ac add" id="addCat"><span class="plus">+</span>새 칸<br>만들기</button>`;
}

const shortWon = n => n>=10000 ? (Math.round(n/1000)/10)+'만' : n>=1000 ? (Math.round(n/100)/10)+'천' : String(n);
function mstats(m){
  let inc = 0, sp = 0; const cats = {}, days = {};
  S.tx.forEach(t => { if(t.date.slice(0,7)!==m) return;
    if(t.t==='in') inc += t.amt;

}
function pieHtml(st){

function barsHtml(){

  const W = 320, H = 130, base = 104, ch = 70, gw = W/6;

  data.forEach((d,i) => { const x = i*gw, hi = d.inc/mx*ch, hs = d.sp/mx*ch, cur = i===5;
    g += `<rect x="${x+gw/2-17}" y="${base-hi}" width="15" height="${hi}" rx="4" fill="#3cc98a" opacity="${cur?1:.55}"/><rect x="${x+gw/2+2}" y="${base-hs}" width="15" height="${hs}" rx="4" fill="#ff6fa5" opacity="${cur?1:.55}"/>`;
    if(d.inc) g += `<text x="${x+gw/2-9.5}" y="${base-hi-3}" text-anchor="middle" font-size="9" fill="#209a63" font-family="inherit">${shortWon(d.inc)}</text>`;
    if(d.sp) g += `<text x="${x+gw/2+9.5}" y="${base-hs-3}" text-anchor="middle" font-size="9" fill="#d9467f" font-family="inherit">${shortWon(d.sp)}</text>`;

  return `<svg viewBox="0 0 ${W} ${H}" class="bars"><line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="#e8e0f5" stroke-width="1.5"/>${g}</svg>
    <div class="leg2"><span><i style="background:#3cc98a"></i>받은 돈</span><span><i style="background:#ff6fa5"></i>쓴 돈</span></div>`;

function insights(st){

  if(st.inc>0){ const left = st.inc - st.sp; out.push(left>=0 ? `받은 돈의 <b>${Math.round(st.sp/st.inc*100)}%</b>를 쓰고 ${won(left)}을 남겼어요.` : `받은 돈보다 ${won(-left)} 더 썼어요. 모아 둔 돈을 쓴 거예요.`); }

}

// memo 를 넘기면(빈 글자라도) '✎ 메모 남기기' 가 생긴다. 눌러야 입력칸이 열린다 — 키보드를 기본으로 띄우지 않으려고.
function padSheet({title, who, init, nextLabel, allowZero, extra, memo, onDone}){
  let val = String(init||0);
  const hasMemo = memo !== undefined;
  openSheet(`<h2>${title}</h2>${who?`<div class="who">${avatar(who.ch)}<span style="font-size:19px">${esc(who.n)}</span></div>`:''}
    <div class="disp"><span id="pv"></span><small>원</small></div>
    <div class="chips" id="pc">${[500,1000,5000,10000].map(c=>`<button data-c="${c}">+${nf(c)}</button>`).join('')}</div>
    <div class="pad" id="pp">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join('')}<button data-n="00">00</button><button data-n="0">0</button><button class="del" data-n="del" aria-label="지우기">⌫</button></div>
    ${extra||''}
    ${hasMemo ? `<button class="linkbtn memolink" id="memoBtn" style="${memo?'display:none':''}">✎ 메모 남기기 (안 써도 돼요)</button><input class="inp memoin" id="memoIn" maxlength="60" placeholder="예) 세뱃돈 / 친구 생일선물" value="${esc(memo)}" style="${memo?'':'display:none'}">` : ''}
    <button class="gb ${allowZero?'purple':'green'}" id="pn">${nextLabel||'다음'}</button>`);
  const show = () => { $('pv').textContent = nf(+val); $('pn').disabled = !allowZero && +val<=0; };
  const put = s => { val = (val+s).replace(/^0+(?=\d)/,''); if(val.length>7) val = val.slice(0,7); };
  $('pp').onclick = e => { const b = e.target.closest('button'); if(!b) return; buzz(8); const n = b.dataset.n;
    if(n==='del') val = val.length>1 ? val.slice(0,-1) : '0'; else put(n); show(); };
  $('pc').onclick = e => { const b = e.target.closest('button'); if(!b) return; buzz(8); val = String(Math.min(9999999, +val + +b.dataset.c)); show(); };
  if(hasMemo) $('memoBtn').onclick = () => { $('memoBtn').style.display = 'none'; $('memoIn').style.display = ''; $('memoIn').focus(); };
  $('pn').onclick = () => { if(!allowZero && +val<=0) return; onDone(+val, hasMemo ? $('memoIn').value.trim() : ''); };
  show();
}
const newBtn = label => `<button class="pk newpk" data-k="__new" style="--bg:#fff;border:3px dashed #cdbdf0;box-shadow:none"><div style="font-size:44px;line-height:58px;color:var(--purple)">+</div>${label}</button>`;

const giverItems = cur => S.givers.map(g => ({key:g.n, n:g.n, ch:g.ch, on:g.n===cur}));

/* ───────── 받았어요 / 썼어요 ───────── */
function txFlow(kind, ex){
  let date = ex ? ex.date : todayStr();
  const dateRow = `<label class="datebtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span id="dtxt"></span><input type="date" id="fDate" max="${todayStr()}" value="${date}"></label>`;
  const dlabel = () => { const d = new Date(date+'T00:00:00'); $('dtxt').textContent = date===todayStr() ? '오늘' : (d.getMonth()+1)+'월 '+d.getDate()+'일'; };
  padSheet({ title: kind==='in' ? '얼마 받았어요?' : '얼마 썼어요?', init: ex?ex.amt:0, nextLabel:'다음으로 ▶', extra: dateRow, memo: ex&&ex.note ? ex.note : '',
    onDone: (amt, note) => pickStep(kind, amt, date, ex, note) });

  $('fDate').onchange = e => { date = e.target.value || todayStr(); dlabel(); };
}
function pickStep(kind, amt, date, ex, note){
  let items = kind==='in' ? giverItems(ex ? ex.memo : null) : S.tiles.map(c => ({key:c.k, n:c.n, ch:c.ch, on: !!ex && ex.cat===c.k}));
  if(kind==='out' && !items.length) items = [{key:'etc', n:'기타', ch:'hamster'}];
  openSheet(`<h2>${kind==='in' ? '누구한테 받았어요?' : '어디에 썼어요?'}</h2><div class="note">${won(amt)}${note?' · '+esc(note):''} — 하나를 눌러 주세요</div>${pickGrid(items, newBtn(kind==='in'?'새 사람':'새 칸'))}<button class="linkbtn" id="pBack">◀ 금액 다시 쓰기</button>`);
  $('pBack').onclick = () => txFlow(kind, Object.assign({}, ex||{}, {amt, date, t:kind, note}));
  const commit = k => {
    const rec = {id: ex&&ex.id ? ex.id : uid(), t:kind, amt, date, at: ex&&ex.at ? ex.at : Date.now(), note: note||'',
      memo: kind==='in' ? k : '', ch: kind==='in' ? chOfGiver(k) : null, cat: kind==='out' ? k : null, plan:null};
    if(ex&&ex.id) S.tx[S.tx.findIndex(t=>t.id===ex.id)] = rec; else S.tx.push(rec);
    save(); month = date.slice(0,7); closeSheet(); buzz(25); render();
    if(kind==='in'){ confetti(); toast('용돈 받았다! 이제 계획을 세워 볼까요?'); goTab('vAlloc'); }
    else { sfx('coin'); toast(catOf(k).n+'에 '+won(amt)+' 썼어요'); const l = left(k); if(alloc(k)>0 && l<0) setTimeout(()=>toast(catOf(k).n+' 계획보다 '+won(-l)+' 더 썼어요'), 1700); }
  };
  $('pk').onclick = e => { const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.k==='__new'){ if(kind==='out') tileSheet(null, commit); else personSheet(null, commit); return; }   // 만들면서 바로 기록한다
    commit(b.dataset.k); };
}

/* ───────── 받을 예정인 돈 (새로 적기 · 고치기) ───────── */
function expFlow(ex){
  padSheet({title:'얼마 받을 예정이에요?', init: ex?ex.amt:0, nextLabel:'다음으로 ▶', memo: ex&&ex.note ? ex.note : '', onDone: (amt, note) => {

function expWhen(amt, who, note, ex){

  const mo = new Date(); mo.setMonth(mo.getMonth()+1);
  const opts = [['내일', dayAdd(1)], ['3일 뒤', dayAdd(3)], ['일주일 뒤', dayAdd(7)], ['2주 뒤', dayAdd(14)], ['한 달 뒤', dstr(mo)], ['날짜는 몰라요', null]];
  if(ex && ex.date) opts.unshift(['그대로', ex.date]);
  openSheet(`<h2>언제 받을 것 같아요?</h2><div class="who">${avatar(chOfGiver(who))}<span style="font-size:19px">${esc(who)} · ${won(amt)}</span></div>${note?`<div class="note" style="margin:2px 0 0">✎ ${esc(note)}</div>`:''}
    <div class="dgrid">${opts.map((o,i)=>`<button class="gb ${o[1]?'blue':'gray'} sm" data-i="${i}">${o[0]}${o[1]?`<small style="font-size:12px;opacity:.9"> ${md(o[1])}</small>`:''}</button>`).join('')}</div>
    <label class="datebtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>달력에서 고르기</span><input type="date" id="eDate" min="${todayStr()}"></label>`);
  const done = date => {
    const rec = {id: ex&&ex.id ? ex.id : uid(), amt, who, ch: chOfGiver(who), note: note||'', date, at: ex&&ex.at ? ex.at : Date.now()};
    const i = ex&&ex.id ? S.exp.findIndex(x=>x.id===ex.id) : -1;
    if(i>=0) S.exp[i] = rec; else S.exp.push(rec);
    S.useExp = true; save(); closeSheet(); buzz(20); render(); goTab('vAlloc');
    toast(i>=0 ? '예정을 고쳤어요' : '예정을 적었어요! 계획에 미리 넣어 볼 수 있어요');
  };

$('expBox').onclick = e => {

  if(e.target.closest('#swExp')){ S.useExp = !S.useExp; save(); buzz(10); render(); toast(S.useExp ? '받을 돈도 계획에 넣어요' : '지금 가진 돈으로만 계획해요'); return; }
  const b = e.target.closest('[data-ea]'), row = e.target.closest('.er'); if(!b || !row) return;

  if(a==='get') expReceive(row.dataset.id);

/* ───────── 계획세우기: 칸 ───────── */
const tileOf = k => S.tiles.find(t=>t.k===k);
function setAlloc(k, v){ if(v>0) S.alloc[k] = v; else delete S.alloc[k]; }
function bumpCard(k, cls){ const el = document.querySelector('.ac[data-k="'+k+'"]'); if(!el) return; const t = cls==='amt' ? el.querySelector('.amt') : el; t.classList.remove('pop','bounce'); void t.offsetWidth; t.classList.add(cls==='amt'?'pop':'bounce'); }
function shake(k){ sfx('err'); const el = document.querySelector('.ac[data-k="'+k+'"]'); if(!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); buzz([20,40,20]); }
function allocStep(k, dir){
  const av = avail();
  if(dir>0){
    if(av<=0){ shake(k); toast('계획 세울 돈이 없어요!'); return; }
    setAlloc(k, alloc(k) + Math.min(step, av));
  }else{
    const floor = Math.max(spent(k), 0), now = alloc(k);
    if(now<=floor){ shake(k); toast(spent(k)>0 ? '이미 쓴 만큼은 줄일 수 없어요' : '더 줄일 게 없어요'); return; }
    setAlloc(k, Math.max(floor, now - step));
  }
  buzz(14); sfx(dir>0?'plus':'minus'); save(); renderAlloc(); renderHome(); bumpCard(k,'amt');
  if(dir>0 && avail()<=0 && (balance()+(S.useExp?pending():0))>0){ confetti(); toast('와! 계획을 전부 세웠어요!'); }
}
$('agrid').onclick = e => {
  if(e.target.closest('#addCat')){ tileSheet(); return; }
  const card = e.target.closest('.ac[data-k]'); const b = e.target.closest('button'); if(!card || !b) return;
  const k = card.dataset.k, act = b.dataset.act;
  if(act==='p') allocStep(k, 1);
  else if(act==='m') allocStep(k, -1);
  else if(act==='face'){ bumpCard(k,'face'); buzz(10); const c = tileOf(k); toast(c.n+' · 남은 돈 '+won(Math.max(left(k),0))); }
  else if(act==='name') tileSheet(tileOf(k));
  else if(act==='amt'){
    const c = tileOf(k), base = alloc(k);
    padSheet({title:c.n+'에 얼마 쓸까요?', who:{n:c.n, ch:c.ch}, init:base, nextLabel:'정했어요!', allowZero:true, onDone: v => {
      const room = base + Math.max(avail(),0); let nv = v;
      if(nv>room){ nv = room; toast('계획 세울 수 있는 돈은 '+won(room)+'까지예요'); }
      setAlloc(k, nv); save(); closeSheet(); render();
      if(avail()<=0 && nv>base && (balance()+(S.useExp?pending():0))>0) confetti();
    }});
  }
};
$('agrid').addEventListener('click', e => { if(Date.now()<suppressClick){ e.stopPropagation(); e.preventDefault(); } }, true);
document.querySelector('.steps').onclick = e => { const b = e.target.closest('button'); if(!b) return; step = +b.dataset.s; buzz(8);
  document.querySelectorAll('.steps button').forEach(x => x.classList.toggle('on', x===b)); };
$('allocReset').onclick = () => { if(!Object.keys(S.alloc).length){ toast('세운 계획이 아직 없어요'); return; }
  if(!confirm('세운 계획을 모두 지우고 다시 할까요?\n(쓴 기록은 그대로예요)')) return; S.alloc = {}; save(); render(); toast('처음부터 다시 계획해 봐요!'); };
$('hint').onclick = e => { if(e.target.closest('#hIn')) txFlow('in'); else if(e.target.closest('#hExp')) expFlow(); };

/* 이름 + 캐릭터 고르는 공용 창 (칸 · 사람) */
function charSheet({title, name, ch, okLabel, delLabel, needName, onSave, onDelete}){
  let grp = CH[ch].g;
  openSheet(`<h2>${title}</h2>
    <input class="inp" id="tName" maxlength="8" placeholder="" value="${esc(name||'')}">
    <div class="gtabs" id="gTabs">${GROUPS.map(g=>`<button data-g="${g[0]}" class="${g[0]===grp?'on':''}">${g[1]}</button>`).join('')}</div>
    <div class="pick pk5" id="tPick"></div>
    <button class="gb purple" id="tSave">${okLabel}</button>
    ${onDelete?`<button class="linkbtn" id="tDel">${delLabel}</button>`:''}`);
  const ph = () => { $('tName').placeholder = needName ? '이름을 써 주세요' : CH[ch].n+' (이름을 써 보세요)'; };
  const drawPick = () => { $('tPick').innerHTML = Object.keys(CH).filter(k => CH[k].g===grp).map(k => `<button class="pk${k===ch?' on':''}" data-k="${k}" style="--bg:${CH[k].bg}"><div class="face">${face(k)}</div>${esc(CH[k].n)}</button>`).join(''); };
  ph(); drawPick();
  $('gTabs').onclick = e => { const b = e.target.closest('button'); if(!b) return; grp = b.dataset.g; buzz(6); $('gTabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b)); drawPick(); $('tPick').scrollTop = 0; };
  $('tPick').onclick = e => { const b = e.target.closest('button'); if(!b) return; ch = b.dataset.k; buzz(8); ph(); drawPick(); };
  $('tSave').onclick = () => {
    const typed = $('tName').value.trim();
    if(needName && !typed){ toast('이름을 써 주세요'); $('tName').focus(); return; }
    onSave((typed || CH[ch].n).slice(0,8), ch);

/* 칸 이름·동물 고치기 / 새로 만들기 (onNew: 만든 칸으로 바로 이어갈 일이 있을 때) */
function tileSheet(t, onNew){
  charSheet({title: t?'칸 고치기':'새 칸 만들기', name: t?t.n:'', ch: t?t.ch:'star', okLabel: t?'고쳤어요!':'만들었어요!', delLabel:'이 칸 지우기',
    onSave: (n, ch) => {
      let nk;
      if(t){ const x = tileOf(t.k); x.n = n; x.ch = ch; } else { nk = 't_'+uid(); S.tiles.push({k:nk, n, ch}); }
      if(!t && onNew){ save(); onNew(nk); return; }
      save(); closeSheet(); render(); toast(t?'고쳤어요':'새 칸이 생겼어요!');
      if(!t) setTimeout(()=>{ const el = document.querySelector('.ac:nth-last-child(2)'); if(el){ el.scrollIntoView({block:'center',behavior:'smooth'}); bumpCard(S.tiles[S.tiles.length-1].k,'face'); } }, 300);
    },
    onDelete: t ? () => { closeSheet(); askDeleteTile(t.k); } : null });
}

/* 사람(누구한테 받는지) 새로 만들기 / 고치기 / 지우기 */
function personSheet(g, onNew){
  charSheet({title: g?'사람 고치기':'새 사람 만들기', name: g?g.n:'', ch: g?g.ch:'hamster', needName:true, okLabel: g?'고쳤어요!':'만들었어요!', delLabel:'이 사람 지우기',
    onSave: (n, ch) => {
      if(g){
        const old = g.n, x = S.givers.find(v=>v.n===old);   // g 와 x 는 같은 객체라, 바꾸기 전에 옛 이름을 따로 잡아 둔다
        if(S.givers.some(v=>v!==x && v.n===n)){ toast('같은 이름이 이미 있어요'); return; }
        x.n = n; x.ch = ch;
        S.tx.forEach(t => { if(t.t==='in' && t.memo===old){ t.memo = n; t.ch = ch; } });
        S.exp.forEach(e => { if(e.who===old){ e.who = n; e.ch = ch; } });
      }else{
        const x = S.givers.find(v=>v.n===n); if(x) x.ch = ch; else S.givers.push({n, ch});
      }
      save();
      if(!g && onNew){ onNew(n); return; }
      closeSheet(); render(); toast(g?'고쳤어요':'새 사람이 생겼어요!');
    },
    onDelete: g ? () => { if(!confirm('"'+g.n+'" 을(를) 목록에서 지울까요?\n예전 기록은 그대로 남아요.')) return;
      S.givers = S.givers.filter(v=>v.n!==g.n); save(); closeSheet(); render(); toast('지웠어요'); } : null });
}
function peopleSheet(){
  openSheet(`<h2>받은 사람 목록</h2><div class="note">누르면 이름·캐릭터를 고치거나 지울 수 있어요.</div>
    <div class="pick" id="pk">${S.givers.map(g=>`<button class="pk" data-k="${esc(g.n)}" style="--bg:${CH[g.ch].bg}"><div class="face">${face(g.ch)}</div>${esc(g.n)}</button>`).join('')}${newBtn('새 사람')}</div>`);
  $('pk').onclick = e => { const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.k==='__new') personSheet(null); else personSheet(S.givers.find(g=>g.n===b.dataset.k)); };
}
function askDeleteTile(k){
  const c = tileOf(k); if(!c) return false;
  const l = Math.max(left(k),0), sp = spent(k);
  const msg = '"'+c.n+'" 칸을 지울까요?\n'
    + (l>0 ? '• 남은 계획 돈 '+won(l)+'은 "아직 계획 안 세운 돈"으로 돌아가요.\n' : '')
    + (sp>0 ? '• 이미 쓴 기록('+won(sp)+')은 그대로 남아요.' : '• 이 칸에 쓴 기록은 없어요.');
  if(!confirm(msg)) return false;
  if(S.tx.some(t => t.cat===k)) S.gone[k] = {n:c.n, ch:c.ch};
  delete S.alloc[k]; S.tiles = S.tiles.filter(t => t.k!==k); save(); render();
  sfx('trash'); toast(l>0 ? '지웠어요. '+won(l)+'은 다시 계획할 수 있어요' : '지웠어요');
  return true;
}

/* ───────── 칸을 꾹 눌러 끌기 (안드로이드 홈 화면처럼: 위쪽 '지우기' 칸에 놓으면 삭제) ───────── */
const grid = $('agrid');
let DG = null, suppressClick = 0;
const HOLD_MS = 380;
const trashH = () => $('trash').offsetHeight;
grid.addEventListener('pointerdown', e => {
  if(DG || (e.pointerType==='mouse' && e.button!==0)) return;
  const card = e.target.closest('.ac[data-k]'); if(!card || e.target.closest('.pm')) return;
  DG = {card, id:e.pointerId, sx:e.clientX, sy:e.clientY, x:e.clientX, y:e.clientY, on:false, cool:0, reordered:false};
  DG.timer = setTimeout(dragStart, HOLD_MS);
});
window.addEventListener('pointermove', e => {
  if(!DG || e.pointerId!==DG.id) return;
  DG.x = e.clientX; DG.y = e.clientY;
  if(!DG.on){ if(Math.hypot(DG.x-DG.sx, DG.y-DG.sy) > 10){ clearTimeout(DG.timer); DG = null; } return; }
  hitTest();
});
window.addEventListener('pointerup', e => dragEnd(e, false));
window.addEventListener('pointercancel', e => dragEnd(e, true));
document.addEventListener('touchmove', e => { if(DG && DG.on) e.preventDefault(); }, {passive:false});
grid.addEventListener('contextmenu', e => e.preventDefault());

function dragStart(){
  if(!DG) return;
  const c = DG.card, r = c.getBoundingClientRect();
  DG.on = true; DG.ox = DG.sx - r.left; DG.oy = DG.sy - r.top; DG.lx = DG.x; DG.tilt = 0; DG.hot = false;
  try{ grid.setPointerCapture(DG.id); }catch(e){}
  const g = c.cloneNode(true); g.classList.add('ghost'); g.removeAttribute('data-k'); g.style.width = r.width+'px'; g.style.height = r.height+'px';
  document.body.appendChild(g); DG.ghost = g; c.classList.add('ph');
  document.body.classList.add('dragging'); $('trash').classList.add('on'); buzz(30); sfx('lift');
  g.style.transform = `translate(${DG.x-DG.ox}px,${DG.y-DG.oy}px) scale(1.06)`;
  DG.raf = requestAnimationFrame(dragLoop);
}
function setHot(h){ if(DG.hot===h) return; DG.hot = h; $('trash').classList.toggle('hot', h); if(h) buzz(15); }
function dragLoop(){
  if(!DG || !DG.on) return;
  const H = trashH(), y = DG.y, view = $('vAlloc');
  let sp = 0;
  if(y>H+4 && y<H+90) sp = -Math.ceil((H+90-y)/6); else if(y>innerHeight-180) sp = Math.ceil((y-(innerHeight-180))/6);
  if(sp){ view.scrollTop += sp; hitTest(); }
  const vx = DG.x - DG.lx; DG.lx = DG.x; DG.tilt += (Math.max(-14, Math.min(14, vx*1.2)) - DG.tilt) * .25;
  DG.ghost.style.transform = `translate(${DG.x-DG.ox}px,${DG.y-DG.oy}px) rotate(${DG.tilt}deg) scale(${DG.hot ? .68 : 1.06})`;
  DG.raf = requestAnimationFrame(dragLoop);
}
function hitTest(){
  if(DG.y < trashH()){ setHot(true); return; }
  setHot(false);
  if(Date.now() < DG.cool) return;
  const ph = DG.card, cards = [...grid.querySelectorAll('.ac[data-k]')];
  const tgt = cards.find(c => { if(c===ph) return false; const r = c.getBoundingClientRect(); return DG.x>r.left+8 && DG.x<r.right-8 && DG.y>r.top+8 && DG.y<r.bottom-8; });
  if(!tgt) return;
  const before = new Map(cards.map(c => [c, c.getBoundingClientRect()]));
  if(cards.indexOf(tgt) > cards.indexOf(ph)) tgt.after(ph); else tgt.before(ph);
  DG.reordered = true; DG.cool = Date.now() + 170; buzz(8);
  cards.forEach(c => { const a = c.getBoundingClientRect(), b = before.get(c), dx = b.left-a.left, dy = b.top-a.top; if(!dx && !dy) return;
    c.style.transition = 'none'; c.style.transform = `translate(${dx}px,${dy}px)`;
    requestAnimationFrame(() => requestAnimationFrame(() => { c.style.transition = 'transform .26s cubic-bezier(.2,1.1,.35,1.15)'; c.style.transform = ''; setTimeout(()=>{ c.style.transition = ''; }, 300); })); });
}
function dragEnd(e, cancelled){
  if(!DG || (e && e.pointerId!==DG.id)) return;
  clearTimeout(DG.timer);
  if(!DG.on){ DG = null; return; }
  cancelAnimationFrame(DG.raf); suppressClick = Date.now() + 450;
  const d = DG; DG = null;
  document.body.classList.remove('dragging'); $('trash').classList.remove('on','hot');
  const k = d.card.dataset.k, moved = d.reordered || Math.hypot(d.x-d.sx, d.y-d.sy) > 14;
  const finish = () => { d.ghost.remove(); d.card.classList.remove('ph'); };
  if(cancelled){ finish(); renderAlloc(); return; }
  if(d.y < trashH()){ finish(); askDeleteTile(k); renderAlloc(); return; }
  if(!moved){ finish(); tileSheet(tileOf(k)); return; }
  const r = d.card.getBoundingClientRect();
  d.ghost.style.transition = 'transform .22s cubic-bezier(.2,1.3,.4,1)'; d.ghost.style.transform = `translate(${r.left}px,${r.top}px) rotate(0deg) scale(1)`;
  S.tiles = [...grid.querySelectorAll('.ac[data-k]')].map(c => tileOf(c.dataset.k)).filter(Boolean); save(); buzz(20);
  setTimeout(() => { finish(); d.card.classList.add('land'); sparkle(r); sfx('land'); setTimeout(()=>d.card.classList.remove('land'), 500); }, 230);
}

/* ───────── 백업 ───────── */
function backupText(){ return JSON.stringify({app:'allowance', v:3, at:Date.now(), data:{tx:S.tx, alloc:S.alloc, tiles:S.tiles, gone:S.gone, exp:S.exp, useExp:S.useExp, givers:S.givers}}); }
function markBackup(){ S.lastBackup = Date.now(); save(); }
function backupSheet(){
  const last = S.lastBackup ? '마지막 백업: '+new Date(S.lastBackup).toLocaleDateString('ko-KR') : '아직 백업한 적이 없어요';
  openSheet(`<h2>설정</h2>
    <div class="setrow"><span>효과음<small>누를 때 톡톡 소리가 나요</small></span><button class="sw ${S.sfx?'on':''}" id="swSfx" aria-label="효과음"><i></i></button></div>
    <div class="setrow"><span>배경 음악<small>조용한 곳에서는 꺼 두세요</small></span><button class="sw ${S.bgm?'on':''}" id="swBgm" aria-label="배경 음악"><i></i></button></div>
    <div class="stack-btns" style="margin-top:14px"><button class="gb blue" id="bkPeople">받은 사람 목록 고치기</button></div>
    <div class="note" style="margin-top:6px"><b>돈 기록 지키기</b><br>기록은 <b>이 휴대폰 안에만</b> 있어요. 가끔 아빠한테 백업을 부탁해요!<br>(${last})</div>
    <div class="stack-btns"><button class="gb blue" id="bkCopy">기록 복사하기</button><button class="gb purple" id="bkFile">파일로 저장하기</button><button class="gb gray" id="bkOpen">백업에서 불러오기</button></div>
    <div class="note" style="margin-top:8px">용돈 친구들 ${APP_VERSION}</div>`);
  $('swSfx').onclick = () => { S.sfx = !S.sfx; save(); $('swSfx').classList.toggle('on', S.sfx); if(S.sfx) sfx('plus'); };
  $('swBgm').onclick = () => { S.bgm = !S.bgm; save(); $('swBgm').classList.toggle('on', S.bgm); if(S.bgm) bgmStart(); else bgmStop(); };
  $('bkPeople').onclick = peopleSheet;
  $('bkCopy').onclick = () => {
    const txt = backupText(), ok = () => { markBackup(); toast('복사했어요! 카톡 "나에게"에 붙여 두세요'); };
    const fb = () => { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); let r = false; try{ r = document.execCommand('copy'); }catch(e){} ta.remove(); r ? ok() : toast('복사 못 했어요. 파일로 저장해 주세요'); };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, fb); else fb();
  };
  $('bkFile').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([backupText()], {type:'application/json'}));
    a.download = '용돈친구들-백업-'+todayStr()+'.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000); markBackup(); toast('파일로 저장했어요'); };
  $('bkOpen').onclick = restoreSheet;
}
function restoreSheet(){
  openSheet(`<h2>백업에서 불러오기</h2><div class="note">복사해 둔 글을 붙여 넣거나, 저장한 파일을 골라요.<br><b>지금 기록은 모두 바뀌어요!</b></div>
    <textarea class="inp" id="rText" placeholder="여기에 붙여 넣기" style="min-height:90px;font-size:14px"></textarea>
    <input type="file" id="rFile" accept=".json,application/json" style="margin:10px 0;width:100%;font-size:14px">
    <button class="gb purple" id="rGo">불러오기</button>`);
  $('rFile').onchange = e => { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = () => { $('rText').value = r.result; }; r.readAsText(f); };
  $('rGo').onclick = () => {
    let o; try{ o = JSON.parse($('rText').value.trim()); }catch(e){ toast('백업 내용이 이상해요'); return; }
    const d = o && o.app==='allowance' && o.data; if(!d || !Array.isArray(d.tx)){ toast('용돈 친구들 백업이 아니에요'); return; }
    const tx = d.tx.filter(t => t && (t.t==='in'||t.t==='out') && Number.isFinite(+t.amt) && +t.amt>0 && /^\d{4}-\d{2}-\d{2}$/.test(t.date||''))
      .map(t => ({id:String(t.id||uid()), t:t.t, amt:Math.round(+t.amt), memo:String(t.memo||'').slice(0,40), note:String(t.note||'').slice(0,60), ch:t.ch&&CH[t.ch]?t.ch:null, date:t.date, cat:t.cat?String(t.cat):null, plan:t.plan?String(t.plan):null, at:+t.at||0}));
    const n = migrate({tx, alloc:d.alloc, tiles:d.tiles, custom:d.custom, gone:d.gone, exp:d.exp, useExp:d.useExp, givers:d.givers,
      plans: Array.isArray(d.plans) ? d.plans.filter(p=>p&&p.name&&Number.isFinite(+p.amt)).map(p=>({id:String(p.id||uid()), name:String(p.name), amt:Math.round(+p.amt), done:!!p.done})) : []});
    if(!confirm('기록 '+n.tx.length+'개, 칸 '+n.tiles.length+'개를 불러와요.\n지금 기록은 모두 바뀌어요. 계속할까요?')) return;
    S = Object.assign(n, {lastBackup:S.lastBackup}); save(); closeSheet(); render(); toast('불러왔어요!');
  };
}

/* ───────── 소리 켜고 끄기 (홈 위쪽 스피커) ───────── */
const SPK_ON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.500v5h4l5 4v-13l-5 4z" fill="currentColor" fill-opacity=".15"/><path d="M16.500 9a4 4 0 010 6M19 6.500a8 8 0 010 11"/></svg>';
const SPK_OFF = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.500v5h4l5 4v-13l-5 4z" fill="currentColor" fill-opacity=".15"/><path d="M17 9.500l4.500 5M21.500 9.500l-4.500 5"/></svg>';
function renderMute(){ const b = $('muteBtn'); b.innerHTML = S.mute ? SPK_OFF : SPK_ON; b.classList.toggle('off', S.mute); b.setAttribute('aria-pressed', S.mute ? 'true' : 'false'); }
$('muteBtn').onclick = () => {
  S.mute = !S.mute; save(); renderMute();
  if(S.mute){ bgmStop(); toast('소리를 껐어요'); }
  else { bgmStart(); sfx('plus'); toast('소리를 켰어요'); }
};

/* ───────── 연결 ───────── */
$('pig').innerHTML = PIG_BANK + '<span class="coindrop">'+COIN+'</span>';
$('allocPig').innerHTML = face('pig');
$('ctaFace').innerHTML = face('pig');
$('tiHome').innerHTML = TAB_ICONS.home; $('tiAlloc').innerHTML = TAB_ICONS.plan; $('tiLog').innerHTML = TAB_ICONS.log;
$('bIn').onclick = () => { buzz(10); txFlow('in'); };
$('bOut').onclick = () => { buzz(10); txFlow('out'); };
$('bExp').onclick = () => { buzz(10); expFlow(); };
$('bAlloc').onclick = () => { buzz(10); goTab('vAlloc'); };
$('gear').onclick = backupSheet;
renderMute();
$('recent').onclick = $('list').onclick = e => { const b = e.target.closest('[data-tx]'); if(b) txSheet(b.dataset.tx); };
$('dash').onclick = e => { if(!e.target.closest('#dashTog')) return; S.dashOpen = !S.dashOpen; save(); buzz(8); renderDash(); };
$('mPrev').onclick = () => { month = monthShift(month,-1); renderLog(); };
$('mNext').onclick = () => { if(month < todayStr().slice(0,7)){ month = monthShift(month,1); renderLog(); } };
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { buzz(8); goTab(b.dataset.v); });
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
