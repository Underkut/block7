<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>말씀 관련 우클릭 메뉴 체크표</title>
<style>
:root{color-scheme:light;--ink:#20201e;--muted:#72716c;--line:#deddd7;--paper:#f7f6f1;--card:#fff;--accent:#365f52;--changed:#fff1ad}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif}.wrap{max-width:1600px;margin:auto;padding:28px 18px 72px}h1{margin:0 0 7px;font-size:27px}.lead{margin:0 0 16px;color:var(--muted)}.toolbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;background:rgba(247,246,241,.95);backdrop-filter:blur(8px)}button{border:1px solid var(--line);border-radius:999px;background:#fff;padding:8px 13px;color:var(--ink);cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.saved{color:var(--muted);font-size:12px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:0 4px 18px #00000008}table{border-collapse:separate;border-spacing:0;min-width:1480px;width:100%;font-size:13px}th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;padding:0}thead th{position:sticky;top:58px;z-index:3;background:#f0f3ef;font-weight:650;padding:9px 5px;line-height:1.3}thead tr:nth-child(2) th{top:96px;font-size:12px;padding:6px 3px}th.item,td.item{position:sticky;left:0;z-index:2;width:174px;min-width:174px;text-align:left;padding:9px 12px;background:#fff;font-weight:600}thead th.item{z-index:4;background:#f0f3ef}tbody tr:last-child td{border-bottom:0}tr>*:last-child{border-right:0}.check-cell{min-width:86px;height:42px;transition:background .15s}.check-cell.changed{background:var(--changed)}.check-cell label{display:flex;width:100%;height:100%;align-items:center;justify-content:center;cursor:pointer}.check-cell input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}.legend{display:flex;gap:16px;flex-wrap:wrap;margin:12px 2px;color:var(--muted);font-size:12px}.swatch{display:inline-block;width:13px;height:13px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line);background:var(--changed)}h2{font-size:18px;margin:28px 0 9px}textarea{width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:#fff}.hint{color:var(--muted);font-size:12px;margin:7px 0 0}@media(max-width:760px){.wrap{padding:18px 10px 50px}h1{font-size:22px}thead th{top:100px}thead tr:nth-child(2) th{top:138px}.toolbar{align-items:flex-start}.saved{width:100%}}@media print{.toolbar{display:none}.table-wrap{overflow:visible}table{min-width:0;font-size:8px}th.item,td.item{position:static;width:90px;min-width:90px}thead th{position:static}.check-cell{min-width:35px}}
</style>
</head>
<body><main class="wrap">
<h1>말씀 관련 우클릭 메뉴 체크표</h1>
<p class="lead">가로축은 메뉴를 여는 화면, 세로축은 메뉴 항목입니다. 각 화면의 말씀·명제 칸에서 보여야 할 항목을 체크하고, 빼려는 항목은 체크를 해제해 주세요.</p>
<div class="toolbar"><button class="primary" id="copy">변경안 복사</button><button id="print">인쇄 / PDF</button><button id="reset">처음 상태로 되돌리기</button><span class="saved" id="saved">자동 저장됨</span></div>
<div class="legend"><span>✓ 현재 운영 메뉴에 있는 항목은 미리 체크되어 있습니다.</span><span><i class="swatch"></i>노란색은 처음 상태에서 바꾼 칸입니다.</span></div>
<div class="table-wrap"><table id="matrix"><thead></thead><tbody></tbody></table></div>
<h2>순서·문구 등 추가 의견</h2>
<textarea id="note" placeholder="예: 전체화면에서는 ‘공유’를 ‘본문 공유’로 바꾸고, 좋아요 바로 아래에 놓아 주세요."></textarea>
<p class="hint">체크 결과와 추가 의견은 이 브라우저에 자동 저장됩니다. ‘변경안 복사’를 누르면 바꾼 항목만 추가·삭제로 정리됩니다.</p>
</main>
<script>
const items=['전체 화면','본문 복사','좋아요','암송 완료 체크','Deeper…','Even Deeper…','공유','저장 목록…','말씀 설정','삭제','이 목록에서 빼기','저장 풀기'];
const screens=[
 {id:'top',name:'말씀 상단영역',verse:['전체 화면','좋아요','암송 완료 체크','Deeper…','Even Deeper…','공유','말씀 설정'],prop:['전체 화면','좋아요','암송 완료 체크','Deeper…','Even Deeper…','공유','말씀 설정']},
 {id:'full',name:'전체화면',verse:['본문 복사','좋아요','암송 완료 체크','Deeper…','Even Deeper…','공유','말씀 설정'],prop:['좋아요','저장','공유']},
 {id:'tile',name:'타일뷰',verse:['전체 화면','좋아요','암송 완료 체크','Deeper…','Even Deeper…','공유','말씀 설정'],prop:['전체 화면','좋아요','암송 완료 체크','Deeper…','Even Deeper…','공유','말씀 설정']},
 {id:'activity',name:'활동 목록',verse:['전체 화면','좋아요','암송 완료 체크','Deeper…','Even Deeper…','공유','저장 목록…','말씀 설정','삭제'],prop:['전체 화면','좋아요','암송 완료 체크','Deeper…','Even Deeper…','공유','저장 목록…','말씀 설정','삭제']},
 {id:'keep',name:'저장 목록',verse:['전체 화면','좋아요','암송 완료 체크','Deeper…','Even Deeper…','공유','저장 목록…','말씀 설정','이 목록에서 빼기','저장 풀기'],prop:['전체 화면','좋아요','암송 완료 체크','Deeper…','Even Deeper…','공유','저장 목록…','말씀 설정','이 목록에서 빼기','저장 풀기']},
 {id:'card',name:'말씀카드 위젯',verse:['전체 화면','좋아요','암송 완료 체크','Deeper…','Even Deeper…','공유','저장 목록…','말씀 설정','삭제'],prop:['전체 화면','좋아요','암송 완료 체크','Deeper…','Even Deeper…','공유','저장 목록…','말씀 설정','삭제']},
 {id:'listwidget',name:'말씀목록 위젯',verse:['전체 화면','좋아요','암송 완료 체크','Deeper…','Even Deeper…','공유','저장 목록…','말씀 설정','삭제'],prop:['전체 화면','좋아요','암송 완료 체크','Deeper…','Even Deeper…','공유','저장 목록…','말씀 설정','삭제']}
];
// ‘저장’은 현재 전체화면 명제 메뉴에만 있으므로 세로 항목에 빠지지 않게 넣습니다.
items.splice(3,0,'저장');
const original={};screens.forEach(s=>['verse','prop'].forEach(t=>items.forEach(item=>original[`${s.id}:${t}:${item}`]=s[t].includes(item))));
const KEY='block7-verse-context-review-matrix-v1';
let saved={checks:{},note:''};try{saved=Object.assign(saved,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const head=document.querySelector('#matrix thead');head.innerHTML=`<tr><th class="item" rowspan="2">메뉴 항목</th>${screens.map(s=>`<th colspan="2">${s.name}</th>`).join('')}</tr><tr>${screens.map(()=>'<th>말씀</th><th>명제</th>').join('')}</tr>`;
const body=document.querySelector('#matrix tbody');body.innerHTML=items.map(item=>`<tr><td class="item">${item}</td>${screens.map(s=>['verse','prop'].map(t=>{const k=`${s.id}:${t}:${item}`,v=k in saved.checks?saved.checks[k]:original[k];return `<td class="check-cell" data-key="${k}"><label aria-label="${s.name} ${t==='verse'?'말씀':'명제'} ${item}"><input type="checkbox" ${v?'checked':''}></label></td>`}).join('')).join('')}</tr>`).join('');
const note=document.getElementById('note');note.value=saved.note||'';
function refresh(){document.querySelectorAll('.check-cell').forEach(c=>c.classList.toggle('changed',c.querySelector('input').checked!==original[c.dataset.key]))}
function save(){const checks={};document.querySelectorAll('.check-cell').forEach(c=>checks[c.dataset.key]=c.querySelector('input').checked);saved={checks,note:note.value};localStorage.setItem(KEY,JSON.stringify(saved));refresh();const e=document.getElementById('saved');e.textContent='방금 자동 저장됨';clearTimeout(save.timer);save.timer=setTimeout(()=>e.textContent='자동 저장됨',900)}
document.addEventListener('change',save);note.addEventListener('input',save);refresh();
document.getElementById('copy').onclick=async()=>{const lines=['# 말씀 관련 우클릭 메뉴 변경안'];let count=0;screens.forEach(s=>['verse','prop'].forEach(t=>{const add=[],remove=[];items.forEach(item=>{const k=`${s.id}:${t}:${item}`,now=document.querySelector(`[data-key="${CSS.escape(k)}"] input`).checked;if(now!==original[k]){(now?add:remove).push(item);count++}});if(add.length||remove.length){lines.push(`\n## ${s.name} · ${t==='verse'?'말씀':'명제'}`);if(add.length)lines.push(`추가: ${add.join(', ')}`);if(remove.length)lines.push(`삭제: ${remove.join(', ')}`)}}));if(!count)lines.push('\n(체크 변경 없음)');lines.push('\n## 순서·문구 등 추가 의견',note.value.trim()||'(의견 없음)');const text=lines.join('\n');try{await navigator.clipboard.writeText(text);alert('변경안을 복사했습니다. 대화창에 붙여 넣어 주세요.')}catch(e){prompt('아래 내용을 복사해 주세요.',text)}};
document.getElementById('print').onclick=()=>window.print();document.getElementById('reset').onclick=()=>{if(confirm('체크와 의견을 모두 처음 상태로 되돌릴까요?')){localStorage.removeItem(KEY);location.reload()}};
</script></body></html>
