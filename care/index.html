<script>
// ⚠️ 심방 노트의 집은 sweeter.my/care/ 하나다. 깃헙 페이지가 저장소를 통째로 내보내
//    block7.my/care/ 에도 같은 파일이 생기는데, 구글 연결이 돌아오는 자리(열쇠 서버 okRet)는
//    sweeter.my/care/ 뿐이다 → 그 주소로 열리면 sweeter.my 로 넘긴다 (기도노트와 같은 사정).
if (/^(www\.)?block7\.my$/.test(location.hostname)) {
  location.replace('https://sweeter.my/care/' + location.search + location.hash);
}
</script>

.ibtn{width:26px;height:26px;display:inline-grid;place-items:center;color:var(--tx3)}

.recent{display:flex;align-items:flex-start;gap:8px;margin-top:8px}

.recent .rlist{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x pan-y;--fl:0px;--fr:0px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 var(--fl),#000 calc(100% - var(--fr)),transparent);mask-image:linear-gradient(90deg,transparent,#000 var(--fl),#000 calc(100% - var(--fr)),transparent)}
.recent .rlist::-webkit-scrollbar{display:none}
.recent .rlist.fl{--fl:22px}.recent .rlist.fr{--fr:28px}
.recent.all .rlist{flex-wrap:wrap;white-space:normal;-webkit-mask-image:none;mask-image:none}
.recent .rn{flex:none;font-size:12px;line-height:1.2;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--tx2);background:transparent}

.cellbtn{flex:none;display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 6px 0 8px;border-radius:8px;background:var(--s2);color:var(--tx2);font-size:12px;font-weight:600}
.cellbtn .cv svg{width:12px;height:12px}
.cgrp{display:flex;width:100%;gap:8px;align-items:baseline;padding:16px 2px 4px;text-align:left}.cgrp b{font-weight:600}.cgrp .muted{font-size:12px}
.cmem{padding:6px 0 12px;border-bottom:1px solid var(--line)}
.cmem .opt.lead{border-color:var(--line2);font-weight:600}.cmem .opt.lead small{font-size:10px;font-weight:500;color:var(--tx3);margin-right:5px}
.calbtn{position:relative;overflow:hidden}.dsel-row{align-items:center}.dsel{margin-left:6px;font-size:15px;color:var(--ac);white-space:nowrap}.calbtn svg{width:15px;height:15px}
.calbtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;min-height:0;border:0;padding:0;-webkit-appearance:none;appearance:none}

.omenu{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(92vw,380px);background:var(--paper);border-radius:16px;box-shadow:var(--shadow);z-index:41;padding:8px;display:flex;flex-direction:column}
.omenu .t{padding:10px 12px 8px;font-size:13px;color:var(--tx2)}.omenu button{padding:13px 12px;text-align:left;border-radius:10px;font-size:15px}.omenu button:hover{background:var(--s1)}.omenu .danger{color:var(--warn)}
.attsum{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:11px 14px;margin:2px 0 12px;border-radius:14px;background:var(--s1);border:1px solid var(--line);text-align:left}
.attsum span{display:flex;flex-direction:column;gap:2px;min-width:0}

.planbadge.att{border-style:solid}
.planbadge{font-size:11px;color:var(--tx2);border:1px dashed var(--tx3);border-radius:999px;padding:1px 7px;white-space:nowrap}
.wl.plan .why{font-size:12.5px;color:var(--tx3);margin-top:3px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);margin-top:6px}
.cal .h{font-size:11px;color:var(--tx3);text-align:center;padding:5px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal .h:first-child{color:#c25a5a}
.cell{min-height:70px;padding:3px 2px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0;font-variant-numeric:tabular-nums}

.nmc{font-size:10.5px;line-height:1.35;padding:1px 3px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:clip;background:color-mix(in srgb,var(--deep) 14%,transparent);color:var(--tx)}
.nmc.at{background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 60%,transparent);color:var(--ac)}
.calsw{display:flex;gap:6px;margin:-4px 0 10px}.calsw .opt{padding:5px 12px;font-size:13px}
.wl.att .why{font-size:12.5px;color:var(--tx3);margin-top:3px}
.nmc.d3{background:var(--deep);color:var(--on-ac)}
.nmc.d1{background:var(--s2);color:var(--tx2)}

/* 한눈에 */
.kgrp{margin-top:16px}

.kgrp h4::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--k)}
.donefold{font-size:12.5px;color:var(--tx3);padding:10px 0}
.brow{display:block;width:100%;padding:11px 0;border-bottom:1px solid var(--line)}
.brow .t{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin-bottom:6px}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 14px}

.panel .pt b{font-size:14.5px;font-weight:600}

.lg{display:flex;gap:12px;font-size:12px;color:var(--tx2);margin-bottom:4px}

.scale span{margin:0 4px}

.pg .k{display:flex;align-items:center;gap:6px}

.pg .n{font-size:12px;color:var(--tx2);font-variant-numeric:tabular-nums;white-space:nowrap}
.pg .n b{color:var(--tx);font-weight:600}
.hb{display:grid;gap:9px}
.hr{display:grid;grid-template-columns:96px 1fr 22px;gap:10px;align-items:center;font-size:13px;cursor:default}

/* 입력 */
.fsec{font-size:12px;color:var(--ac);font-weight:600;letter-spacing:.04em;margin:22px 0 10px;display:flex;align-items:center;gap:8px}

.inp{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line2);background:var(--paper);color:var(--tx);font:inherit;font-size:15px}

.opts{display:flex;flex-wrap:wrap;gap:6px}

.hint{font-size:12px;color:var(--tx3);margin-top:6px;line-height:1.55}

.sugg button{font-size:13px;padding:6px 10px;border-radius:9px;background:var(--s2)}
.sugg small{color:var(--tx3)}

/* 설정 */
.set{border-top:1px solid var(--line)}
.srow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);width:100%}
.srow .t{font-size:14.5px}

<script id="care-core">
const APP_VERSION = 'v. 26-1114-2';

const PICKER_KEY = 'AIzaSyAOLbBCajy6vF33xN1PQWk1qnU7VoynuC8';
const C0_MAX_ROWS = 10;                  // C0 쓰기 시험은 이 줄 수 이하인 시트(사본)에만

// 응답 탭 오른쪽 끝에 앱이 더하는 열. 폼은 이 열을 건드리지 않는다
const APP_COLS = ['기록ID', '출처', '심방일', '수정', '확인', '보관'];
// 앱이 만드는 탭과 머리글 (시안 2차 '시트 모양')
const TABS = {
  '성도': ['성도ID', '이름', '부르는 이름', '구분', '메모', '기도노트', 'BLOCK7 연락처', '상태'],
  '액션': ['액션ID', '기록ID', '성도', '종류', '세부', '내용', '기한', '상태', '완료일', 'BLOCK7 할일'],

  '계획': ['계획ID', '성도', '날짜', '시간', '방식', '장소', '물어볼 것', '상태', '캘린더 일정ID', '기록ID'],
  '속성': ['속성', '값', '상위 값', '순서', '숨김', '별칭', '폼 질문 번호', '폼 선택지 번호'],
};

const Q = {
  ts: ['타임스탬프', 'Timestamp'], date: ['심방 날짜'], name: ['성도 이름'], depth: ['대화 깊이'],
  roles: ['구분'], method: ['전화 / 만남'], text: ['내용'], tags: ['태그'], acts: ['액션'], place: ['장소 · 메모', '장소'],

};
// 이름이 조금 달라도 알아보는 칸 — HB 가 폼에서 직접 더한 질문(2026-11-09 '장소' · '사주심/사드림')은 제목 꼴을 정해 둘 수 없다.
// 띄어쓰기를 뺀 제목으로 본다. 위 Q 의 정확한 이름이 먼저다.
const Q_LIKE = { place: k => /^장소/.test(k), pay: k => /사주심|사드림|^pay$/i.test(k) };   // HB 폼 실제 제목은 'PAY'

function verNum(v) { const m = String(v || '').match(/(\d{2})-(\d{4})-(\d+)/); return m ? (+(m[1] + m[2])) * 1000 + (+m[3]) : 0; }
function isNewer(latest, mine) { return verNum(latest) > verNum(mine); }
const DEV_EMAIL = 'denartist@gmail.com';   // BLOCK7 _isDevAccount 와 같은 판정
function isDevEmail(e) { return String(e || '').toLowerCase() === DEV_EMAIL; }
function qLike(key, title) { const t = norm(title); return (Q[key] || []).includes(t) || (!!Q_LIKE[key] && Q_LIKE[key](t.replace(/\s+/g, ''))); }
// 폼 질문 목록에서 그 칸의 질문 (없으면 null)
function formQOf(summary, key) { return (summary || []).find(q => (Q[key] || []).includes(q.title)) || (summary || []).find(q => qLike(key, q.title)) || null; }

function norm(h) { return String(h == null ? '' : h).replace(/\s+/g, ' ').trim(); }

// 머리글 한 줄 → { map: {ts:열, name:열, …, '@기록ID':열 …}, cols: {머리글: 열} }
function headerMap(row) {
  const cols = {}, map = {};
  (row || []).forEach((h, i) => { const n = norm(h); if (n && !(n in cols)) cols[n] = i; });
  for (const k in Q) for (const name of Q[k]) if (name in cols) { map[k] = cols[name]; break; }
  APP_COLS.concat(NX_COLS).forEach(c => { if (c in cols) map['@' + c] = cols[c]; });
  const used = new Set(Object.values(map));
  for (const k in Q_LIKE) if (map[k] == null) { const n = Object.keys(cols).find(h => !used.has(cols[h]) && !APP_COLS.includes(h) && !NX_COLS.includes(h) && qLike(k, h)); if (n != null) { map[k] = cols[n]; used.add(cols[n]); } }
  return { map, cols };
}
function isResponsesHeader(row) { const { map } = headerMap(row); return map.name != null && map.text != null; }
// 탭 목록 [{title, header}] 에서 응답 탭 찾기 — 'Form Responses 1' 이름에 기대지 않는다
function findResponsesTab(tabs) { return (tabs || []).find(t => isResponsesHeader(t.header)) || null; }

function colLetter(i) { let s = ''; i = Math.floor(i); do { s = String.fromCharCode(65 + (i % 26)) + s; i = Math.floor(i / 26) - 1; } while (i >= 0); return s; }

// 응답 탭에 더할 앱 열. 이미 있는 것은 건너뛰고, 마지막으로 차 있는 머리글 바로 뒤부터 붙인다

function parseTalk(text) {

    if (!raw.trim()) { last = null; return; }

    if (last) { last.t += (last.t ? '\n' : '') + raw.replace(/\s+$/, ''); return; }

// ── 초안 — 패킷 → 화면이 고칠 수 있는 꼴(기록마다 새 기록 입력 꼴 그대로) ──

// ── 속성 대조 — 구분 · 방식 · 태그 · 할 일 종류가 '속성' 탭(+ 폼)에 없는 값이면 고르게 한다 ──

// 고른 대로 초안을 고친다 — map: 기존 값으로 바꿈 · add: 그대로(저장 때 '속성' 탭에 더함) · drop: 버림(할 일 종류는 '기타' 로)

    });

// ── 성도 연결 — 원문 이름 → 명단(nameCands). 성까지 같으면 하나, 이름만이면 '○윤정' 꼴 후보들 ──

// ── 중복 — ① 원본ID + 연결된 성도 + 개인/모임 ② 원본ID 가 없으면 가져오기 해시 ──

// ── 저장할 것 ──
// ── 1113-E 4 할 일 한 줄씩 (HB 승인 11/14) ──
// 응답 칸 '액션' 은 예전처럼 종류만(폼 체크박스 그대로). 줄 글은 '액션' 탭에 한 줄 = 한 할 일로(종류 · 내용 · 상태) — 새 칸 없음.
// 예전에 종류마다 한 덩어리로 들어간 줄(내용 빈 칸)은 그대로 둔다(옮기지 않음).

    const t = k.slice(i + 1, j), x = k.slice(j + 1), s = statusMap[k]; if (!x || t === '기타' || s.st === '취소') return; out.push({ t, x, row: s.row, st: s.st }); });

// 고치기 화면의 줄들({종류: [글]}) ↔ 지금 탭 → 더할 줄 · '취소' 로 바꿀 줄

// 체크한 할 일 → 액션 탭 줄들 — 1113-E 부터 할 일 하나에 한 줄(예전: 종류 하나에 한 줄)

    // 1113-E 4-1 (HB) 한 줄 = 한 할 일 — 종류마다 한 덩어리로 합치지 않는다. 줄 글은 '내용'(체크 열쇠), 우선순위 · 넘친 글은 '세부'

function strip10(vs, today) {
  const ws = weekStartOf(today), out = [];

function weeksBack(n, today) { const ws = weekStartOf(today), a = []; for (let i = n - 1; i >= 0; i--) { const s = ymdAdd(ws, -7 * i); a.push({ s, e: ymdAdd(s, 6), now: i === 0 }); } return a; }

    for (const x of plan.patch) { try { await evPatch(x.evId, x.body); changed = true; } catch (e) { } }
    for (const id of plan.del) { try { await evDelete(id); changed = true; } catch (e) { } }
    const m = [];
