<!DOCTYPE html>
<!-- 심방 노트 v. 26-1109-9 — BLOCK7·Sweeter 와 별개인 독립 앱 (care/ → sweeter.my/care/) · C1 열람판 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#181c1a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="심방 노트">
<meta name="robots" content="noindex">
<!-- 홈 화면 앱 · 파비콘 — 아이콘은 HB 디자인(11/8, 원본 512px). 바꿀 때는 icon-192/512 · apple-touch-icon · favicon 네 장 -->
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>심방 노트</title>
<script>
// ⚠️ 심방 노트의 집은 sweeter.my/care/ 하나다. 깃헙 페이지가 저장소를 통째로 내보내
//    block7.my/care/ 에도 같은 파일이 생기는데, 구글 연결이 돌아오는 자리(열쇠 서버 okRet)는
//    sweeter.my/care/ 뿐이다 → 그 주소로 열리면 sweeter.my 로 넘긴다 (기도노트와 같은 사정).
if (/^(www\.)?block7\.my$/.test(location.hostname)) {
  location.replace('https://sweeter.my/care/' + location.search + location.hash);
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=Noto+Serif+KR:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* C1 열람판 — 시안 2차(https://claude.ai/artifact/W4YKKndyhtw9uEyXg1taJm)를 그대로 옮긴 모양.
   속성 문법: 깊이 = 막대 3칸 · 방식 = 아이콘+글자 · 태그 = #글자 · 구분 = 작은 글자 · 색은 할 일(액션)에만. */
/* Layout: 왼쪽 폰 시안(눌러 보기) + 오른쪽 그 화면의 설계 메모 / 두 번째 탭은 설계 제안서.
   속성 문법: 깊이 = 막대 3칸 · 방식 = 아이콘+글자 · 태그 = #글자 · 구분 = 작은 글자 · 색은 할 일(액션)에만. */
:root{
  --bg:#f2f3f1; --paper:#ffffff; --s1:#f7f8f6; --s2:#eceeeb; --line:#e3e6e2; --line2:#ccd1cb;
  --tx:#1b2120; --tx2:#5a6460; --tx3:#8b938f;
  --ac:#2b6a5c; --ac-soft:rgba(43,106,92,.10); --on-ac:#ffffff;
  --warn:#b0611f; --warn-soft:rgba(176,97,31,.11);
  --k1:#2a78d6; --k2:#1baf7a; --k3:#eb6834; --k4:#8b938f;
  --deep:#2b6a5c;
  --mk-red:#d6373a; --mk-orange:#d4731a; --mk-yellow:#a88406; --mk-green:#2f9a55; --mk-blue:#2d6ad1; --mk-purple:#7a4fd4; --mk-pink:#c4428f; --mk-gray:#8b9099;
  --shadow:0 1px 2px rgba(20,30,26,.05),0 10px 30px rgba(20,30,26,.08);
  --sans:'IBM Plex Sans KR','Pretendard',-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --serif:'Noto Serif KR','AppleMyungjo',serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --ease:cubic-bezier(.22,.8,.24,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101312; --paper:#181c1a; --s1:#1c211f; --s2:#232826; --line:#2a302d; --line2:#3b423e;
  --tx:#e7eae7; --tx2:#a6aeaa; --tx3:#77807b;
  --ac:#80c6b3; --ac-soft:rgba(128,198,179,.13); --on-ac:#0e1a16;
  --warn:#e6a467; --warn-soft:rgba(230,164,103,.14);
  --k1:#3987e5; --k2:#199e70; --k3:#d95926; --k4:#77807b;
  --deep:#80c6b3;
  --mk-red:#ff6b6b; --mk-orange:#f5a35c; --mk-yellow:#f2cf5b; --mk-green:#6fd18b; --mk-blue:#6fa8ff; --mk-purple:#b48cff; --mk-pink:#f07cc8; --mk-gray:#7c8089;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101312; --paper:#181c1a; --s1:#1c211f; --s2:#232826; --line:#2a302d; --line2:#3b423e;
  --tx:#e7eae7; --tx2:#a6aeaa; --tx3:#77807b;
  --ac:#80c6b3; --ac-soft:rgba(128,198,179,.13); --on-ac:#0e1a16;
  --warn:#e6a467; --warn-soft:rgba(230,164,103,.14);
  --k1:#3987e5; --k2:#199e70; --k3:#d95926; --k4:#77807b;
  --deep:#80c6b3;
  --mk-red:#ff6b6b; --mk-orange:#f5a35c; --mk-yellow:#f2cf5b; --mk-green:#6fd18b; --mk-blue:#6fa8ff; --mk-purple:#b48cff; --mk-pink:#f07cc8; --mk-gray:#7c8089;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
body.locked{overflow:hidden}
[hidden]{display:none!important}
a{color:var(--ac)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
/* 폰 안 — 공통 */
.ph-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));min-height:58px;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px)}
.ph-head.r2{grid-template-columns:88px 1fr 88px}
.verbadge{justify-self:start;padding:6px 8px;font-size:10px;line-height:1.2;color:var(--tx3);letter-spacing:.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.verbadge.new{color:var(--ac);font-weight:600}.verbadge.new::after{content:'';display:inline-block;width:5px;height:5px;margin-left:4px;border-radius:50%;background:var(--ac);vertical-align:middle}
.verbadge.busy,.vercheck.busy{opacity:.4}
.vercheck{display:block;margin-top:22px;padding:6px 0;font-size:13px;color:var(--tx2);text-align:left}.vercheck span{color:var(--ac)}.vercheck.new span::after{content:' · 새 버전 있음'}
.ph-head .acts{display:flex;justify-content:flex-end}
.ph-head.acts-only{grid-template-columns:1fr auto}
.ph-head a.ic{text-decoration:none}
.ph-head h3{margin:0;text-align:center;font-size:16px;font-weight:600}
.ph-head .ic{width:44px;height:44px;display:grid;place-items:center;color:var(--tx2)}
.ph-head .ic svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.7;fill:none}
#app{max-width:720px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative}
.ph-body{padding:0 max(18px,env(safe-area-inset-right,0px)) calc(120px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.ph-nav{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:720px;bottom:0;display:grid;grid-template-columns:repeat(6,1fr);padding:8px 4px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:3}
.ph-nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--tx3);padding:4px 0}
.ph-nav button svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.6;fill:none}
.ph-nav button[aria-current="true"]{color:var(--ac)}
.fab{position:fixed;right:max(18px,calc(50vw - 342px));bottom:calc(80px + env(safe-area-inset-bottom,0px));height:50px;padding:0 18px 0 14px;border-radius:25px;background:var(--ac);color:var(--on-ac);display:flex;align-items:center;gap:6px;box-shadow:var(--shadow);font-size:14px;font-weight:500;z-index:3}
.fab svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none}
.h-sec{font-size:13px;font-weight:600;color:var(--tx);margin:24px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.h-sec small{font-weight:400;color:var(--tx3);font-size:12px}
.h-sec button{color:var(--ac);font-weight:500;font-size:12.5px}
.muted{color:var(--tx3);font-size:12.5px}
.empty{font-size:13px;color:var(--tx3);padding:8px 0}
.seg{display:flex;gap:2px;background:var(--s2);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:6px 0;border-radius:8px;font-size:13px;color:var(--tx2);text-align:center}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--tx);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* 속성 문법 */
.dm{display:inline-flex;align-items:flex-end;gap:2px;height:11px;flex:none}
.dm i{width:3px;border-radius:1px;background:var(--line2)}
.dm i:nth-child(1){height:5px}.dm i:nth-child(2){height:8px}.dm i:nth-child(3){height:11px}
.dm.d1 i:nth-child(1),.dm.d2 i:nth-child(-n+2),.dm.d3 i{background:var(--deep)}
.depth{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--tx2)}
.meth{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--tx2);white-space:nowrap}
.meth svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.6;fill:none;flex:none}
.tg{font-size:12.5px;color:var(--tx3)}
.roles{font-size:12px;color:var(--tx3)}
.ak{--k:var(--k4);display:inline-flex;align-items:center;gap:5px;font-size:12.5px;line-height:1;padding:5px 9px 5px 7px;border-radius:999px;background:color-mix(in srgb,var(--k) 14%,transparent);color:var(--tx);font-weight:500;white-space:nowrap}
.ak::before{content:"";width:8px;height:8px;border-radius:50%;border:2px solid var(--k);flex:none}
.ak.done{background:transparent;color:var(--tx3);font-weight:400;text-decoration:line-through}
.ak.done::before{background:var(--tx3);border-color:var(--tx3)}
.k1{--k:var(--k1)}.k2{--k:var(--k2)}.k3{--k:var(--k3)}.k4{--k:var(--k4)}
.rv{font-size:11px;font-weight:500;color:var(--warn);background:var(--warn-soft);padding:2px 7px;border-radius:999px;white-space:nowrap}

/* 기록 */
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 14px}
.today button{border-radius:14px;padding:10px 12px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:1px}
.today b{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.today span{font-size:12px;color:var(--tx2)}
.today .w b{color:var(--warn)} .today .a b{color:var(--ac)}
.today button[aria-pressed="true"]{border-color:var(--ac);background:var(--ac-soft)}
.fline{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.fline::-webkit-scrollbar{display:none}
.fbtn{flex:none;display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;border:1px solid var(--line2);font-size:12.5px;color:var(--tx2)}
.fbtn svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.7;fill:none}
.fbtn.on{border-color:var(--ac);color:var(--ac)}
.fchip{flex:none;display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:var(--ac-soft);color:var(--ac);font-size:12.5px}
.fchip i{font-style:normal;opacity:.6}
.dhead{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 2px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.dhead b{font-size:13.5px;font-weight:600}
.dhead span{font-size:12px;color:var(--tx3)}
.card{display:block;width:100%;padding:14px 0 15px;border-bottom:1px solid var(--line)}
.c-top{display:flex;align-items:center;gap:8px;min-width:0}
.c-top .nm{font-family:var(--serif);font-weight:600;font-size:17px}
.c-top .sp{flex:1}
.c-txt{font-size:14px;color:var(--tx2);margin:5px 0 9px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-bot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.c-bot .tags{display:flex;gap:6px;flex-wrap:wrap}
.c-bot .acts{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
.foot-arc{font-size:12.5px;color:var(--tx3);text-align:center;padding:22px 0 0}
.foot-arc button{color:var(--ac)}

/* 상세 */
.dt-name{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.25}
.dt-when{font-size:14px;color:var(--tx2);margin-top:4px}
.attrs{display:grid;gap:0;margin:16px 0 4px;border-top:1px solid var(--line)}
.attrs div{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.attrs dt,.attrs .k{color:var(--tx3);font-size:12.5px}
.review{background:var(--warn-soft);border-radius:14px;padding:12px 14px;font-size:13px;margin:4px 0 14px}
.review b{color:var(--warn)}
.review .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{padding:8px 15px;border-radius:999px;font-size:13px;border:1px solid var(--line2);background:var(--paper)}
.btn.pri{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.body-txt{font-size:15px;line-height:1.8;white-space:pre-line}
.addn{border-left:2px solid var(--line2);padding:2px 0 2px 12px;margin-top:12px;font-size:14px;line-height:1.7}
.addn small{display:block;font-family:var(--mono);font-size:11px;color:var(--tx3)}
.todo{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line)}
.ck{--k:var(--ac);width:20px;height:20px;margin-top:1px;border-radius:50%;border:1.8px solid var(--k);display:grid;place-items:center}
.ck.on{background:var(--k)}
.ck.on::after{content:"";width:5px;height:9px;border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.todo .lab{font-size:14px}
.todo .lab b{font-weight:600}
.todo .lab small{display:block;color:var(--tx3);font-size:12px;margin-top:1px}
.todo.done .lab{color:var(--tx3);text-decoration:line-through}
.send{font-size:12.5px;color:var(--ac);white-space:nowrap;padding-top:2px}
.tl button{display:grid;grid-template-columns:46px 1fr;gap:10px;width:100%;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.tl .d{font-family:var(--mono);font-size:12px;color:var(--tx3);padding-top:1px}
.tl .t1{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.tl .t2{color:var(--tx2);font-size:13px}

/* 성도 */
.srch{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:11px;background:var(--s2);color:var(--tx3);font-size:14px;margin-bottom:10px}
.srch svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.7;fill:none}
.prow{display:grid;grid-template-columns:1fr auto;gap:6px 10px;width:100%;padding:13px 0;border-bottom:1px solid var(--line);align-items:center}
.prow .nm{font-family:var(--serif);font-weight:600;font-size:16px}
.prow .roles{margin-left:6px}
.prow .ago{font-size:13px;color:var(--tx2);text-align:right;font-variant-numeric:tabular-nums}
.prow .ago.old{color:var(--warn);font-weight:500}
.prow .r2{grid-column:1/-1;display:flex;align-items:center;gap:10px}
.strip{display:flex;gap:3px}
.strip i{width:12px;height:6px;border-radius:2px;background:var(--s2)}
.strip i.v1{background:color-mix(in srgb,var(--deep) 30%,transparent)}
.strip i.v2{background:color-mix(in srgb,var(--deep) 62%,transparent)}
.strip i.v3{background:var(--deep)}
.dots{display:flex;gap:3px;margin-left:auto}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--k)}
.links{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 2px}
.lk{font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line2);color:var(--tx2)}
.lk.on{border-color:var(--ac);color:var(--ac)}
.cloud{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.cloud span{color:var(--tx2)}
.sentence{font-size:14px;color:var(--tx2);line-height:1.7;margin:2px 0 12px}
.sentence b{color:var(--tx);font-weight:600}

/* 달력 */
.wk-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 6px}
.wk-head b{font-size:16px;font-weight:600}
.wk-head button{width:36px;height:36px;display:grid;place-items:center;color:var(--tx2)}
.wk-head button svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.8;fill:none}
.day{display:grid;grid-template-columns:42px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.day .dn{font-size:12px;color:var(--tx3);line-height:1.2;text-align:center}
.day .dn b{display:block;font-size:19px;color:var(--tx);font-weight:500;font-variant-numeric:tabular-nums;margin-top:2px}
.day.sun .dn b{color:#c25a5a}
.day.now .dn b{color:var(--on-ac);background:var(--ac);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;margin:2px auto 0;font-size:16px}
.wl{display:block;width:100%;padding:6px 0 7px}
.wl+.wl{border-top:1px dashed var(--line)}
.wl .r1{display:flex;align-items:center;gap:8px}
.wl .r1 .nm{font-weight:600;font-size:15px}
.wl .r1 .sp{flex:1}
.wl .r2{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.wl.plan .r1 .nm{font-weight:500}
/* 1108-C3 기도노트 표시색 = 이름 글자색 · 설정의 '색으로 보기' 단추(점 셋)는 기도노트와 같은 모양 */
.hue-ic{color:var(--hc)}
.nmc.d3 .hue-ic{color:color-mix(in srgb,var(--hc) 45%,var(--on-ac))}
.hue-b{display:inline-flex;align-items:center;gap:4px;padding:8px 6px;letter-spacing:0}
.hue-b i{width:6px;height:6px;border-radius:3px;opacity:.3;filter:saturate(.45);transition:opacity .3s,filter .3s}
.hue-b i:nth-child(1){background:#e5534b}.hue-b i:nth-child(2){background:#4fbf73}.hue-b i:nth-child(3){background:#4d8ff0}
.hue-b.on i{opacity:1;filter:none}
.srow .hue-ctl{display:inline-flex;align-items:center;gap:2px}
.ibtn{width:26px;height:26px;display:inline-grid;place-items:center;color:var(--tx3)}
.ibtn svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.6;fill:none}
.ibtn[aria-pressed="true"]{color:var(--ac)}
.hue-leg{grid-column:1/-1;display:grid;gap:8px;margin-top:6px;font-size:13.5px}
.hue-leg div{display:flex;justify-content:space-between;gap:8px}
.hue-leg small{color:var(--tx3);font-size:12px}
.pills .opt{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.opt.lift{transform:scale(1.08);box-shadow:var(--shadow);background:var(--paper);border-color:var(--ac);position:relative;z-index:2;transition:transform .12s var(--ease)}
body.dragging{cursor:grabbing}
.pills .inp.optadd{width:auto;flex:0 1 150px;min-width:90px;padding:6px 12px;border-radius:999px;margin:0}
.recent{display:flex;align-items:flex-start;gap:8px;margin-top:8px}
.recent .rlist{flex:1;min-width:0;display:flex;gap:6px;overflow:hidden;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.recent.all .rlist{flex-wrap:wrap;white-space:normal;-webkit-mask-image:none;mask-image:none}
.recent .rn{flex:none;font-size:12px;line-height:1.2;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--tx2);background:transparent}
.recent .rmore{flex:none;width:26px;height:26px;display:grid;place-items:center;color:var(--tx3)}
.recent .rmore svg,.cellbtn svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.7;fill:none}
.cellbtn{flex:none;display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 6px 0 8px;border-radius:8px;background:var(--s2);color:var(--tx2);font-size:12px;font-weight:600}
.cellbtn .cv svg{width:12px;height:12px}
.cgrp{display:flex;width:100%;gap:8px;align-items:baseline;padding:16px 2px 4px;text-align:left}.cgrp b{font-weight:600}.cgrp .muted{font-size:12px}
.cmem{padding:6px 0 12px;border-bottom:1px solid var(--line)}
.cmem .opt.lead{border-color:var(--line2);font-weight:600}.cmem .opt.lead small{font-size:10px;font-weight:500;color:var(--tx3);margin-right:5px}
.calbtn{position:relative;overflow:hidden}.dsel-row{align-items:center}.dsel{margin-left:6px;font-size:15px;color:var(--ac);white-space:nowrap}.calbtn svg{width:15px;height:15px}
.calbtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;min-height:0;border:0;padding:0;-webkit-appearance:none;appearance:none}
.omenu-bg{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:40}
.omenu{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(92vw,380px);background:var(--paper);border-radius:16px;box-shadow:var(--shadow);z-index:41;padding:8px;display:flex;flex-direction:column}
.omenu .t{padding:10px 12px 8px;font-size:13px;color:var(--tx2)}.omenu button{padding:13px 12px;text-align:left;border-radius:10px;font-size:15px}.omenu button:hover{background:var(--s1)}.omenu .danger{color:var(--warn)}
.attsum{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:11px 14px;margin:2px 0 12px;border-radius:14px;background:var(--s1);border:1px solid var(--line);text-align:left}
.attsum span{display:flex;flex-direction:column;gap:2px;min-width:0}
.attsum b{font-weight:500;font-size:14.5px}
.attsum em{font-style:normal;color:var(--warn);font-weight:500}
.attsum small{font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attsum svg{width:18px;height:18px;stroke:var(--tx3);stroke-width:1.8;fill:none;flex:none}
.planbadge.att{border-style:solid}
.planbadge{font-size:11px;color:var(--tx2);border:1px dashed var(--tx3);border-radius:999px;padding:1px 7px;white-space:nowrap}
.wl.plan .why{font-size:12.5px;color:var(--tx3);margin-top:3px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);margin-top:6px}
.cal .h{font-size:11px;color:var(--tx3);text-align:center;padding:5px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal .h:first-child{color:#c25a5a}
.cell{min-height:70px;padding:3px 2px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0;font-variant-numeric:tabular-nums}
.cell .n{font-size:11.5px;color:var(--tx2);padding-left:2px;line-height:1.5}
.cell.out .n,.cell.out .nmc{opacity:.35}
.cell.sel{background:var(--ac-soft)}
.cell.now .n{color:var(--ac);font-weight:600}
.nmc{font-size:10.5px;line-height:1.35;padding:1px 3px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:clip;background:color-mix(in srgb,var(--deep) 14%,transparent);color:var(--tx)}
.nmc.at{background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 60%,transparent);color:var(--ac)}
.calsw{display:flex;gap:6px;margin:-4px 0 10px}.calsw .opt{padding:5px 12px;font-size:13px}
.wl.att .why{font-size:12.5px;color:var(--tx3);margin-top:3px}
.nmc.d3{background:var(--deep);color:var(--on-ac)}
.nmc.d1{background:var(--s2);color:var(--tx2)}
.nmc.pl{background:transparent;border:1px dashed var(--tx3);color:var(--tx2)}
.more{font-size:10px;color:var(--tx3);padding-left:3px}

/* 한눈에 */
.kgrp{margin-top:16px}
.kgrp h4{display:flex;align-items:center;gap:8px;margin:0 0 2px;font-size:14px;font-weight:600}
.kgrp h4 em{font-style:normal;font-weight:400;color:var(--tx3);font-size:12.5px}
.kgrp h4::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--k)}
.donefold{font-size:12.5px;color:var(--tx3);padding:10px 0}
.brow{display:block;width:100%;padding:11px 0;border-bottom:1px solid var(--line)}
.brow .t{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin-bottom:6px}
.brow .t em{font-style:normal;font-size:12.5px;color:var(--tx3);font-variant-numeric:tabular-nums}
.brow .bar{height:6px;border-radius:3px;background:var(--s2);overflow:hidden}
.brow .bar i{display:block;height:100%;background:var(--deep);opacity:.8;border-radius:3px}
.brow .in{margin-top:8px}
.lrow{display:grid;grid-template-columns:44px 1fr;gap:8px;font-size:13px;padding:5px 0;width:100%}
.lrow .d{font-family:var(--mono);font-size:11.5px;color:var(--tx3)}

/* 대시보드 */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 14px}
.tile{display:flex;flex-direction:column;gap:2px;padding:11px 11px 10px;border-radius:14px;background:var(--s1);border:1px solid var(--line);min-width:0;text-align:left}
.tile .l{font-size:11.5px;color:var(--tx2)}
.tile b{font-size:26px;font-weight:500;line-height:1.15;font-variant-numeric:tabular-nums}
.tile b small{font-size:13px;color:var(--tx2);margin-left:1px;font-weight:400}
.tile .s{font-size:11px;color:var(--tx3);line-height:1.35}
.panel{padding:14px 0 16px;border-top:1px solid var(--line)}
.panel .pt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.panel .pt b{font-size:14.5px;font-weight:600}
.panel .pt span{font-size:11.5px;color:var(--tx3);text-align:right}
.lg{display:flex;gap:12px;font-size:12px;color:var(--tx2);margin-bottom:4px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.ch{width:100%;height:auto;display:block;overflow:visible}
.ch .ax{font-size:10.5px;fill:var(--tx3);font-family:var(--sans)}
.ch .ax.now{fill:var(--tx);font-weight:500}
.ch .vl{font-size:11px;fill:var(--tx2);font-family:var(--sans);font-variant-numeric:tabular-nums}
.ch .lb{font-size:11.5px;fill:var(--tx2);font-family:var(--sans)}
.ch [data-tip]{cursor:pointer}
.scale{display:flex;align-items:center;gap:3px;justify-content:flex-end;font-size:11px;color:var(--tx3);margin-top:6px}
.scale i{width:14px;height:10px;border-radius:2px}
.scale span{margin:0 4px}
.prog{display:grid;gap:10px}
.pg{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;width:100%;font-size:13px}
.pg .k{display:flex;align-items:center;gap:6px}
.pg .k i{width:9px;height:9px;border-radius:50%}
.pg .tr,.hr .tr{height:8px;border-radius:4px;background:var(--s2);position:relative;overflow:visible}
.pg .tr i{display:block;height:100%;border-radius:4px}
.pg .n{font-size:12px;color:var(--tx2);font-variant-numeric:tabular-nums;white-space:nowrap}
.pg .n b{color:var(--tx);font-weight:600}
.hb{display:grid;gap:9px}
.hr{display:grid;grid-template-columns:96px 1fr 22px;gap:10px;align-items:center;font-size:13px;cursor:default}
.hr .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr .k .meth{font-size:13px;color:var(--tx)}
.hr .tr i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--deep)}
.hr .tr b{position:absolute;top:-3px;width:2px;height:14px;margin-left:-1px;background:var(--tx);border-radius:1px;box-shadow:0 0 0 1.5px var(--paper)}
.hr .n{text-align:right;font-size:12.5px;color:var(--tx2);font-variant-numeric:tabular-nums}
.tip{position:fixed;z-index:60;max-width:220px;padding:7px 10px;border-radius:9px;background:var(--tx);color:var(--paper);font-size:12px;line-height:1.5;white-space:pre-line;pointer-events:none;box-shadow:var(--shadow)}

/* 입력 */
.fsec{font-size:12px;color:var(--ac);font-weight:600;letter-spacing:.04em;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.fsec::after{content:"";flex:1;height:1px;background:var(--line)}
.fld{margin-bottom:14px}
.fld .lb{display:block;font-size:13px;color:var(--tx2);margin-bottom:7px}
.fld .lb small{color:var(--tx3);margin-left:4px}
.inp{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line2);background:var(--paper);color:var(--tx);font:inherit;font-size:15px}
textarea.inp{min-height:118px;resize:vertical;line-height:1.65}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:999px;border:1px solid var(--line2);font-size:13.5px;color:var(--tx2)}
.opt svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.6;fill:none}
.opt[aria-pressed="true"]{border-color:var(--ac);background:var(--ac-soft);color:var(--ac);font-weight:500}
.opt.kk[aria-pressed="true"]{border-color:var(--k);background:color-mix(in srgb,var(--k) 14%,transparent);color:var(--tx)}
.opt.etc{border-style:dashed;color:var(--tx3)}
.hint{font-size:12px;color:var(--tx3);margin-top:6px;line-height:1.55}
.sugg{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.sugg button{font-size:13px;padding:6px 10px;border-radius:9px;background:var(--s2)}
.sugg small{color:var(--tx3)}
.actd{border-left:3px solid var(--k);padding:8px 0 8px 12px;margin-top:10px;background:color-mix(in srgb,var(--k) 6%,transparent);border-radius:0 10px 10px 0}
.actd .lb{color:var(--tx);font-weight:500}
.ph-foot{position:absolute;left:0;right:0;bottom:0;padding:10px 18px 18px;background:var(--paper);border-top:1px solid var(--line);z-index:3}
.ph-foot .btn{width:100%;padding:12px;font-size:14.5px;text-align:center}

/* 설정 */
.set{border-top:1px solid var(--line)}
.srow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);width:100%}
.srow .t{font-size:14.5px}
.srow .d{grid-column:1/-1;font-size:12.5px;color:var(--tx3);line-height:1.55}
.srow .v{font-size:13px;color:var(--tx2)}
.srow .ok{color:var(--ac)}
.tgl{width:40px;height:24px;border-radius:12px;background:var(--line2);position:relative;flex:none}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--paper);transition:left .2s var(--ease)}
.tgl.on{background:var(--ac)} .tgl.on::after{left:18px}
.title-ed{display:flex;align-items:center;gap:6px;margin:4px 0 2px;grid-column:1/-1;flex-wrap:wrap}
.title-ed input{width:76px;padding:7px 9px;border-radius:9px;border:1px solid var(--line2);background:var(--paper);color:var(--tx);font:inherit;font-size:14px}
.title-ed .nmv{padding:7px 10px;border-radius:9px;background:var(--s2);font-size:14px}
.preview{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2);margin-top:4px}
.preview .ev{padding:3px 9px;border-radius:6px;border:1px dashed var(--tx3);color:var(--tx);font-size:13px}
.etcs{grid-column:1/-1;display:grid;gap:6px;margin-top:6px}
.etcs div{display:flex;align-items:center;gap:8px;font-size:13px;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.etcs div span{flex:1}
.etcs div small{color:var(--tx3)}
.etcs button{font-size:12.5px;color:var(--ac)}
.attr{padding:12px 0;border-bottom:1px solid var(--line)}
.attr h4{margin:0;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
.attr h4 small{font-weight:400;font-size:12px;color:var(--tx3)}
.attr .vals{display:grid;margin-top:6px}
.attr .v{display:grid;grid-template-columns:16px 1fr auto;gap:10px;align-items:center;font-size:14px;padding:6px 0}
.attr .v.sub{padding-left:26px;font-size:13.5px;color:var(--tx2)}
.attr .v .hd{width:14px;height:9px;border-top:1.5px solid var(--line2);border-bottom:1.5px solid var(--line2)}
.attr .v small{font-size:11.5px;color:var(--tx3)}
.attr .addv{font-size:13px;color:var(--ac);padding:6px 0 0 26px}

/* 필터 시트 */
.veil{position:fixed;inset:0;background:rgba(10,14,12,.34);z-index:8}
.sheet{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:720px;bottom:0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))!important;max-height:84%;overflow:auto;background:var(--paper);border-radius:22px 22px 0 0;padding:8px 18px 18px;z-index:9;animation:up .3s var(--ease)}
@keyframes up{from{transform:translate(-50%,30px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 12px}
.grab{position:relative;cursor:grab}.grab::before{content:"";position:absolute;inset:-14px -70px}   /* 1108-C1 손잡이는 작아도 잡는 자리는 넉넉하게 */
.sheet.drag{animation:none}
.sh-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sh-top b{font-size:16px}
.sh-top button{color:var(--ac);font-size:13px}
.saved{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.saved button{flex:none;font-size:13px;padding:6px 12px;border-radius:999px;background:var(--s2)}
.saved .add{background:transparent;border:1px dashed var(--line2);color:var(--tx3)}
.acc{border-top:1px solid var(--line)}
.acc>button{display:grid;grid-template-columns:1fr auto 14px;gap:10px;align-items:center;width:100%;padding:13px 0;font-size:14.5px}
.acc>button em{font-style:normal;font-size:13px;color:var(--tx3);max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc>button em.on{color:var(--ac)}
.acc>button svg{width:12px;height:12px;stroke:var(--tx3);stroke-width:1.8;fill:none;transition:transform .2s var(--ease)}
.acc.open>button svg{transform:rotate(90deg)}
.acc .in{padding:0 0 14px}
.sh-foot{position:sticky;bottom:-18px;background:var(--paper);padding:12px 0 2px;margin-top:6px;border-top:1px solid var(--line)}
.sh-foot .btn{width:100%;padding:12px;text-align:center;font-size:14.5px}

/* BLOCK7 미리보기 */
.b7{font-size:13px}
.b7 .bh{display:flex;justify-content:space-between;align-items:center;margin:2px 0 10px}
.b7 .bh b{font-size:15px}
.b7 .wk{display:flex;gap:2px;background:var(--s2);border-radius:8px;padding:2px}
.b7 .wk button{padding:3px 9px;border-radius:6px;font-size:12px;color:var(--tx2)}
.b7 .wk button[aria-pressed="true"]{background:var(--paper);color:var(--tx)}
.b7 .tog{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.b7 .tog button{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--tx2)}
.b7 .tog button i{width:9px;height:9px;border-radius:3px;background:var(--cc)}
.b7 .tog button[aria-pressed="false"]{opacity:.42}
.b7 .row{display:grid;grid-template-columns:36px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.b7 .row .dn{color:var(--tx3);font-size:11px;line-height:1.2;text-align:center}
.b7 .row .dn b{display:block;font-size:16px;color:var(--tx);font-weight:500}
.b7 .task{display:flex;align-items:center;gap:7px;padding:3px 0}
.b7 .task i{width:12px;height:12px;border:1.4px solid var(--tx3);border-radius:3px}
.b7 .ev{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:7px;margin:2px 0;background:color-mix(in srgb,var(--cc) 15%,transparent);width:100%}
.b7 .ev i{width:7px;height:7px;border-radius:50%;background:var(--cc);flex:none}
.b7 .ev small{color:var(--tx3);margin-left:auto}
.b7 .ev.dash{background:transparent;border:1px dashed var(--cc)}
.peek{position:fixed;left:12px;right:12px;bottom:16px;background:var(--paper);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);padding:16px;z-index:9}
.peek .pt{display:flex;justify-content:space-between;align-items:baseline}
.peek .pt b{font-family:var(--serif);font-size:18px}
.peek p{margin:8px 0;font-size:13.5px;color:var(--tx2)}
.peek .row2{display:flex;gap:8px;margin-top:12px}


/* 실제 앱에만 있는 것 */
.layer{position:fixed;inset:0;overflow:auto;background:var(--bg);-webkit-overflow-scrolling:touch}
.layer>.ph-head,.layer>.ph-body{max-width:720px;margin:0 auto;background:var(--paper)}
.layer>.ph-body{display:flow-root}   /* 첫 제목의 위 여백이 밖으로 새어 머리줄 밑에 회색 띠가 생기지 않게 */
.layer>.ph-body{min-height:calc(100vh - 58px)}
.card.arch,.tl .arch{opacity:.6}
.srch{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:11px;background:var(--s2);margin:0 0 10px}
.srch input{flex:1;border:0;background:transparent;color:var(--tx);font:inherit;font-size:15px;outline:none;min-width:0}
.srch svg{width:16px;height:16px;stroke:var(--tx3);stroke-width:1.7;fill:none;display:block}
.today button{text-align:left}
.foot-arc{line-height:2}
.note{font-size:13px;color:var(--tx2);background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:18px}
.kdot{width:12px;height:12px;border-radius:50%;border:2.5px solid var(--k);margin-top:4px}
.kk{display:inline-flex;align-items:center;gap:6px}.kk i{width:9px;height:9px;border-radius:50%}
.legend{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;align-items:center}
.pop{display:flex;flex-direction:column;gap:6px;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 14px}
.pop a{display:inline-flex;align-items:center;gap:6px;font-size:14px}
.pop svg,.todo svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.7;fill:none}
a.tlx{display:grid;grid-template-columns:46px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:inherit;text-decoration:none}
a.wl{color:inherit;text-decoration:none}
.sk{max-width:720px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 40px}
.sk-head{text-align:center;font-weight:600;font-size:16px;padding:6px 0 18px;color:var(--tx)}
.sk-today{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.sk-today i,.sk-card i{display:block;border-radius:10px;background:linear-gradient(90deg,var(--s2) 0%,var(--s1) 40%,var(--s2) 80%);background-size:300% 100%;animation:skshine 1.4s ease-in-out infinite}
.sk-today i{height:62px;border-radius:14px}
.sk-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px;display:flex;flex-direction:column;gap:9px}
.sk-card i{height:12px}.sk-card i:first-child{height:15px}

<!-- ───────────────────────────── 규칙 (화면 없이 도는 덩어리) ─────────────────────────────
     tests/test_care.js 가 이 덩어리만 떼어 시험한다. 시트 · 폼을 읽고 쓰는 판단과 열람 셈은 전부 여기 둔다.
     ⚠️ 규칙을 고치면 시험부터 고친다. 계획 · 까닭은 docs/ROADMAP.md '1106-C'. -->
<script id="care-core">
const APP_VERSION = 'v. 26-1109-9';
const CARE_KEY = 'b7care_v1';            // 이 기기 저장(고른 파일 id · 시험 상태). 심방 내용은 담지 않는다
const PICKER_APP_ID = '517626689480';    // 구글 클라우드 프로젝트 번호(block7-8f24e) — 고르기 창이 '이 앱이 고른 파일' 로 묶는 기준
// 고르기 창 전용 공개 키 (HB 2026-11-06 만듦: 웹사이트 sweeter.my/* · Google Picker API 하나만).
// ⚠️ 파이어베이스 키(FB_CFG.apiKey)를 쓰지 말 것 — 그 키는 로그인 · 동기화가 함께 쓰고, 제한을 고치면
//    다른 앱이 멈출 수 있다고 구글이 경고했다. 공개되어도 되는 키다(페이지 안에 그대로 보인다).
const PICKER_KEY = 'AIzaSyAOLbBCajy6vF33xN1PQWk1qnU7VoynuC8';
const C0_MAX_ROWS = 10;                  // C0 쓰기 시험은 이 줄 수 이하인 시트(사본)에만

// 응답 탭 오른쪽 끝에 앱이 더하는 열. 폼은 이 열을 건드리지 않는다
const APP_COLS = ['기록ID', '출처', '심방일', '수정', '확인', '보관'];
// 앱이 만드는 탭과 머리글 (시안 2차 '시트 모양')
const TABS = {
  '성도': ['성도ID', '이름', '부르는 이름', '구분', '메모', '기도노트', 'BLOCK7 연락처', '상태'],
  '액션': ['액션ID', '기록ID', '성도', '종류', '세부', '내용', '기한', '상태', '완료일', 'BLOCK7 할일'],
  '덧붙임': ['기록ID', '시각', '쓴 사람', '내용'],
  '계획': ['계획ID', '성도', '날짜', '시간', '방식', '장소', '물어볼 것', '상태', '캘린더 일정ID', '기록ID'],
  '속성': ['속성', '값', '상위 값', '순서', '숨김', '별칭', '폼 질문 번호', '폼 선택지 번호'],
};
// 폼 질문 = 시트 머리글. **열은 순서가 아니라 이름으로 찾는다** (폼에 질문이 늘면 열이 밀린다)
const Q = {
  ts: ['타임스탬프', 'Timestamp'], date: ['심방 날짜'], name: ['성도 이름'], depth: ['대화 깊이'],
  roles: ['구분'], method: ['전화 / 만남'], text: ['내용'], tags: ['태그'], acts: ['액션'], place: ['장소 · 메모', '장소'],
  pay: ['사주심 / 사드림', '사주심/사드림', 'PAY'],
};
// 이름이 조금 달라도 알아보는 칸 — HB 가 폼에서 직접 더한 질문(2026-11-09 '장소' · '사주심/사드림')은 제목 꼴을 정해 둘 수 없다.
// 띄어쓰기를 뺀 제목으로 본다. 위 Q 의 정확한 이름이 먼저다.
const Q_LIKE = { place: k => /^장소/.test(k), pay: k => /사주심|사드림|^pay$/i.test(k) };   // HB 폼 실제 제목은 'PAY'
const PAY_DEFAULT = ['사주심', '사드림'];
// 버전 'v. 26-1109-9' → 견줄 수 있는 수. 꼴이 다르면 0 (그때는 '새 버전' 으로 보지 않는다)
function verNum(v) { const m = String(v || '').match(/(\d{2})-(\d{4})-(\d+)/); return m ? (+(m[1] + m[2])) * 1000 + (+m[3]) : 0; }
function isNewer(latest, mine) { return verNum(latest) > verNum(mine); }
const DEV_EMAIL = 'denartist@gmail.com';   // BLOCK7 _isDevAccount 와 같은 판정
function isDevEmail(e) { return String(e || '').toLowerCase() === DEV_EMAIL; }
function qLike(key, title) { const t = norm(title); return (Q[key] || []).includes(t) || (!!Q_LIKE[key] && Q_LIKE[key](t.replace(/\s+/g, ''))); }
// 폼 질문 목록에서 그 칸의 질문 (없으면 null)
function formQOf(summary, key) { return (summary || []).find(q => (Q[key] || []).includes(q.title)) || (summary || []).find(q => qLike(key, q.title)) || null; }

function norm(h) { return String(h == null ? '' : h).replace(/\s+/g, ' ').trim(); }

// 머리글 한 줄 → { map: {ts:열, name:열, …, '@기록ID':열 …}, cols: {머리글: 열} }
function headerMap(row) {
  const cols = {}, map = {};
  (row || []).forEach((h, i) => { const n = norm(h); if (n && !(n in cols)) cols[n] = i; });
  for (const k in Q) for (const name of Q[k]) if (name in cols) { map[k] = cols[name]; break; }
  APP_COLS.forEach(c => { if (c in cols) map['@' + c] = cols[c]; });
  const used = new Set(Object.values(map));
  for (const k in Q_LIKE) if (map[k] == null) { const n = Object.keys(cols).find(h => !used.has(cols[h]) && !APP_COLS.includes(h) && qLike(k, h)); if (n != null) { map[k] = cols[n]; used.add(cols[n]); } }
  return { map, cols };
}
function isResponsesHeader(row) { const { map } = headerMap(row); return map.name != null && map.text != null; }
// 탭 목록 [{title, header}] 에서 응답 탭 찾기 — 'Form Responses 1' 이름에 기대지 않는다
function findResponsesTab(tabs) { return (tabs || []).find(t => isResponsesHeader(t.header)) || null; }

function colLetter(i) { let s = ''; i = Math.floor(i); do { s = String.fromCharCode(65 + (i % 26)) + s; i = Math.floor(i / 26) - 1; } while (i >= 0); return s; }

// 응답 탭에 더할 앱 열. 이미 있는 것은 건너뛰고, 마지막으로 차 있는 머리글 바로 뒤부터 붙인다
function planColumns(header, columnCount) {
  const h = header || [];
  let last = -1; h.forEach((x, i) => { if (norm(x)) last = i; });
  const have = new Set(h.map(norm));
  const add = APP_COLS.filter(c => !have.has(c));
  const start = last + 1, need = start + add.length;
  return { add, start, grow: Math.max(0, need - (columnCount || 0)) };
}
function planTabs(titles) { const have = new Set((titles || []).map(norm)); return Object.keys(TABS).filter(t => !have.has(t)); }

// ── 날짜 ──
// 시트 날짜 숫자(1899-12-30 기준 날 수) → 'YYYY-MM-DD'
function serialYmd(n) { const d = new Date(Math.round((n - 25569) * 86400000)); return d.toISOString().slice(0, 10); }
function ymd3(y, m, d) { return y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0'); }
// 타임스탬프 → 'YYYY-MM-DD'. 숫자(시트 날짜) · '11/6/2026 10:40:51'(미국식) · '2026. 11. 6 오전…' · ISO
function tsYmd(v) {
  if (typeof v === 'number' && isFinite(v)) return serialYmd(v);
  const s = norm(v); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return ymd3(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})/))) return ymd3(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) return ymd3(+m[3], +m[1], +m[2]);
  return '';
}
// 심방 날짜 칸 → 'YYYY-MM-DD'. 폼의 날짜 질문은 '연도 없이' 라 "10/31" 로 온다 → 연도는 타임스탬프에서.
// 적은 날보다 심방 날이 일주일 넘게 '뒤' 면 지난해로 본다 (1월 2일에 12월 30일 심방을 적은 경우)
function visitYmd(dateCell, tsCell) {
  if (typeof dateCell === 'number' && isFinite(dateCell)) return serialYmd(dateCell);
  const s = norm(dateCell); let m;
  const full = tsYmd(s); if (full) return full;
  if (!(m = s.match(/^(\d{1,2})\s*[\/.월]\s*(\d{1,2})/))) return '';
  const ts = tsYmd(tsCell); if (!ts) return '';
  const y = +ts.slice(0, 4), cand = ymd3(y, +m[1], +m[2]);
  const late = (Date.parse(cand) - Date.parse(ts)) / 86400000;
  return late > 7 ? ymd3(y - 1, +m[1], +m[2]) : cand;
}

// ── 여럿 고르기 칸 ──
// 폼은 고른 것을 ', ' 로 잇는다. 그런데 선택지 자체에 쉼표가 든 것이 있다('카톡, 문자').
// 그래서 아는 선택지를 먼저(긴 것부터) 맞추고, 남은 조각은 '기타' 글로 둔다.
function splitMulti(cell, known) {
  const s = norm(cell); if (!s) return { vals: [], etc: [] };
  const toks = s.split(/\s*,\s*/), K = new Set((known || []).map(norm)), vals = [], etc = [];
  for (let i = 0; i < toks.length;) {
    let hit = 0;
    for (let j = toks.length; j > i; j--) { if (K.has(toks.slice(i, j).join(', '))) { hit = j - i; break; } }
    if (hit) { vals.push(toks.slice(i, i + hit).join(', ')); i += hit; } else { if (toks[i]) etc.push(toks[i]); i++; }
  }
  return { vals, etc };
}
function splitOne(cell, known) { const s = norm(cell); if (!s) return { val: '', etc: '' }; return (known || []).map(norm).includes(s) ? { val: s, etc: '' } : { val: '', etc: s }; }

// 응답 탭 한 줄 → 기록 하나 (읽기만. 시트 글은 고치지 않는다)
function rowToVisit(row, map, opts) {
  const o = opts || {}, at = k => (map[k] == null ? '' : row[map[k]]);
  const roles = splitMulti(at('roles'), o.roles), tags = splitMulti(at('tags'), o.tags), acts = splitMulti(at('acts'), o.acts);
  const meth = splitOne(at('method'), o.methods);
  const ymd = norm(at('@심방일')) || visitYmd(at('date'), at('ts'));
  return {
    id: norm(at('@기록ID')), src: norm(at('@출처')) || '폼', ymd, name: norm(at('name')), text: String(at('text') || ''),
    depth: norm(at('depth')), roles: roles.vals, rolesEtc: roles.etc, method: meth.val, methodEtc: meth.etc,
    place: norm(at('place')), pay: norm(at('pay')), tags: tags.vals, tagsEtc: tags.etc, acts: acts.vals, actsEtc: acts.etc,
    archived: !!norm(at('@보관')),
  };
}

// ── 폼 ──
// Forms API forms.get 결과 → 질문 목록 [{qid, title, kind, multi, options, other, includeYear}]
function formSummary(form) {
  return ((form && form.items) || []).map((it, idx) => ({ it, idx })).filter(o => o.it.questionItem && o.it.questionItem.question).map(({ it, idx }) => {
    const q = it.questionItem.question, r = { qid: q.questionId || '', itemId: it.itemId || '', idx, title: norm(it.title), kind: 'other', multi: false, options: [], other: false };
    if (q.choiceQuestion) {
      r.kind = 'choice'; r.multi = q.choiceQuestion.type === 'CHECKBOX'; r.ctype = q.choiceQuestion.type;
      (q.choiceQuestion.options || []).forEach(op => { if (op.isOther) r.other = true; else if (op.value != null) r.options.push(norm(op.value)); });
    } else if (q.textQuestion) r.kind = q.textQuestion.paragraph ? 'long' : 'short';
    else if (q.dateQuestion) { r.kind = 'date'; r.includeYear = !!q.dateQuestion.includeYear; }
    return r;
  });
}
// 폼 질문과 시트 머리글이 같은지 — 폼이 쓰는 열 이름 = 질문 제목
function formVsSheet(summary, header) {
  const have = new Set((header || []).map(norm)), titles = new Set((summary || []).map(q => q.title));
  const skip = new Set(APP_COLS.concat(Q.ts));
  return {
    notInSheet: (summary || []).map(q => q.title).filter(t => !have.has(t)),
    notInForm: (header || []).map(norm).filter(h => h && !skip.has(h) && !titles.has(h)),
  };
}
function optionsOf(summary, title) { const q = (summary || []).find(x => x.title === title); return q ? q.options : []; }

// ── C0 쓰기 시험 ──

      try { evs.push(await gapi(evUrl(cid, p.evId))); } catch (e) { if (e.status === 404 || e.status === 410) gone.push({ id: p.evId, status: 'cancelled' }); }

    for (const x of plan.patch) { try { await evPatch(x.evId, x.body); changed = true; } catch (e) { } }
    for (const id of plan.del) { try { await evDelete(id); changed = true; } catch (e) { } }

  const vv = window.visualViewport, top = (vv ? vv.offsetTop : 0) + 64, bot = (vv ? vv.offsetTop + vv.height : innerHeight) - 16, r = el.getBoundingClientRect();
  let d = 0;
  if (r.height > bot - top) d = r.top - top; else if (r.bottom > bot) d = r.bottom - bot; else if (r.top < top) d = r.top - top;
  if (Math.abs(d) > 2) L.scrollBy({ top: d, behavior: RM.matches ? 'auto' : 'smooth' });
}
let typingT = 0;
document.addEventListener('focusin', e => {
  if (!isField(e.target) || !e.target.closest('.layer')) return;
  clearTimeout(typingT); document.body.classList.add('typing');
  setTimeout(() => keepInView(e.target), 350);   // 자판이 다 올라온 뒤에
});
document.addEventListener('focusout', () => {
  clearTimeout(typingT);
  typingT = setTimeout(() => { if (!isField(document.activeElement)) document.body.classList.remove('typing'); }, 150);   // 칸에서 칸으로 옮길 땐 깜빡이지 않게
});
if (window.visualViewport) visualViewport.addEventListener('resize', () => { if (isField(document.activeElement)) keepInView(document.activeElement); });
// 1108-B4 겹 화면 닫기 손짓 — ① 왼쪽 가장자리(24px)에서 오른쪽으로 밀기 ② 맨 위에서 머리줄을 아래로 끌기.
//   손가락을 따라 움직이고, 폭(높이)의 ¼ 넘게 또는 빠르게 튕기면 닫히고, 못 미치면 제자리로. 쓰던 글이 있으면 먼저 묻는다.
const SW = { el: null, mode: '', x0: 0, y0: 0, t0: 0, d: 0 };
function swEnd(el, close, mode) {
  const back = () => { el.style.transition = 'transform .26s cubic-bezier(.22,.8,.24,1)'; el.style.transform = ''; setTimeout(() => { el.style.transition = ''; }, 280); };
  if (!close) return back();
  const top = topLayer();
  if (top && ['edit', 'planedit', 'attedit', 'attpaste'].includes(top.type) && top.dirty && !confirm('적던 내용을 버릴까요?')) return back();
  el.style.transition = 'transform .2s ease-in'; el.style.transform = mode === 'x' ? 'translateX(100%)' : 'translateY(100%)';
  setTimeout(() => { el.style.transition = ''; S.layers.pop(); S.menu = null; render(); }, 210);
}
document.addEventListener('touchstart', e => {
  const el = e.target.closest && e.target.closest('#layers > .layer'); if (!el || el !== $('layers').lastElementChild || e.touches.length !== 1) return;
  if (e.target.closest('input,textarea,.pills,.omenu')) return;
  const t = e.touches[0], head = e.target.closest('.ph-head');
  const mode = t.clientX <= 24 ? 'x' : head && el.scrollTop <= 0 ? 'y' : '';
  if (!mode) return;
  Object.assign(SW, { el, mode, x0: t.clientX, y0: t.clientY, t0: Date.now(), d: 0, on: false });
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!SW.el) return;
  const t = e.touches[0], dx = t.clientX - SW.x0, dy = t.clientY - SW.y0;
  if (!SW.on) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    if (SW.mode === 'x' ? Math.abs(dy) > Math.abs(dx) || dx < 0 : Math.abs(dx) > Math.abs(dy) || dy < 0) { SW.el = null; return; }   // 다른 방향이면 손 뗀다(굴리기 등)
    SW.on = true;
  }
  e.preventDefault();
  SW.d = Math.max(0, SW.mode === 'x' ? dx : dy);
  SW.el.style.transform = SW.mode === 'x' ? 'translateX(' + SW.d + 'px)' : 'translateY(' + SW.d + 'px)';
}, { passive: false });
document.addEventListener('touchend', () => {
  if (!SW.el) return;
  const { el, mode, d, t0, on } = SW; SW.el = null; if (!on) return;
  const size = mode === 'x' ? el.clientWidth : el.clientHeight, fast = d > 40 && Date.now() - t0 < 260;
  swEnd(el, RM.matches ? d > size / 4 : (d > size / 4 || fast), mode);
});
document.addEventListener('touchcancel', () => { if (SW.el && SW.on) swEnd(SW.el, false); SW.el = null; });
// 1108-C1 보기 조건(필터) 시트 끌어내려 닫기 — 손잡이 · 머리줄은 언제든, 안쪽은 맨 위까지 올려 둔 때만.
//   손가락을 따라 내려가고(위로는 고무줄처럼 뻑뻑하게), 높이의 ¼ 넘게 또는 빠르게 튕기면 닫히고, 못 미치면 제자리로.
const SD = { el: null, y0: 0, x0: 0, t0: 0, d: 0, on: false };
function sheetClose(el) {
  const veil = document.querySelector('#app .veil');
  if (!el || RM.matches) { S.sheet = false; render(); return; }
  el.classList.add('drag');
  el.style.transition = 'transform .22s ease-in'; el.style.transform = 'translate(-50%,100%)';
  if (veil) { veil.style.transition = 'opacity .22s ease-in'; veil.style.opacity = '0'; }
  setTimeout(() => { S.sheet = false; render(); }, 230);
}
document.addEventListener('touchstart', e => {
  const el = e.target.closest && e.target.closest('#app .sheet'); if (!el || e.touches.length !== 1) return;
  const top = e.target.closest('.grab,.sh-top'); if (!top && el.scrollTop > 0) return;
  const t = e.touches[0]; Object.assign(SD, { el, y0: t.clientY, x0: t.clientX, t0: Date.now(), d: 0, on: false, top: !!top });
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!SD.el) return;
  const t = e.touches[0], dy = t.clientY - SD.y0, dx = t.clientX - SD.x0;
  if (!SD.on) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    if (Math.abs(dx) > Math.abs(dy) || (dy < 0 && !SD.top) || SD.el.scrollTop > 0) { SD.el = null; return; }   // 위로 · 옆으로는 안쪽 굴리기
    SD.on = true; SD.el.classList.add('drag'); SD.el.style.transition = '';
  }
  e.preventDefault();
  SD.d = dy > 0 ? dy : -Math.sqrt(-dy) * 2;   // 위로는 고무줄
  SD.el.style.transform = 'translate(-50%,' + SD.d + 'px)';
  const veil = document.querySelector('#app .veil'); if (veil) veil.style.opacity = String(Math.max(0, 1 - Math.max(0, SD.d) / SD.el.clientHeight));
}, { passive: false });
function sdEnd(cancel) {
  const { el, d, t0, on } = SD; SD.el = null; if (!el || !on) return;
  const fast = d > 40 && Date.now() - t0 < 260;
  if (!cancel && (d > el.clientHeight / 4 || (fast && !RM.matches))) return sheetClose(el);
  el.style.transition = 'transform .26s cubic-bezier(.22,.8,.24,1)'; el.style.transform = '';
  const veil = document.querySelector('#app .veil'); if (veil) { veil.style.transition = 'opacity .26s'; veil.style.opacity = ''; }
  setTimeout(() => { el.style.transition = ''; }, 280);
}
document.addEventListener('touchend', () => sdEnd(false));
document.addEventListener('touchcancel', () => sdEnd(true));
// PC: ESC 는 × 와 같은 일 — 가장 위 것부터
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (S.sheet) { S.sheet = false; render(); } else if (S.menu) { S.menu = null; render(); } else if (S.layers.length) closeLayer();
});
render();
fbInit().catch(e => { AUTH_READY = true; render(); toast('로그인 준비에 실패했습니다\n' + e.message); });
</script>
