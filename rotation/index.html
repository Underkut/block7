/* 색은 '예배 · 캠퍼스' 를 뜻한다 (HB 11/14): 부산 = 초록 · 분당 주일 = 주황 · 금요 = 보라 · 수요 = 파랑 · 화요(옛) = 회청.

:root{
  --bg:#f7f6f2; --paper:#ffffff; --s1:#f2f1ec; --s2:#e9e8e2; --line:#e3e2dc; --line2:#cfcec6;

  --sp:#b0543a; --sp-soft:rgba(176,84,58,.11);   /* 분당 특별예배 (1116-2 E) — 벽돌빛 */
  --lead:#b2479c; --lead-soft:rgba(178,71,156,.10); --hl:rgba(236,178,40,.26); --hl2:rgba(236,178,40,.11);   /* 예배인도 — 금요 보라와 다른 자줏빛 바이올렛 (HB 11/14) */
  --ok:#2e7d5b; --ok-soft:rgba(46,125,91,.11); --warn:#a87a06; --warn-soft:rgba(168,122,6,.13);
  --ll:#a8800f; --ll-soft:rgba(190,146,20,.15);   /* 라이프라인 — 노랑 ~ 황토 (HB 11/16) */
  --bad:#b83a3a; --bad-soft:rgba(184,58,58,.11); --on:#fff;
  --bz-fri:#6a4bb0; --bz-ll:#9a7712; --bz-sp:#2c7a52; --bz-sun:#59606b; --bz-band:rgba(44,122,82,.13); --bz-day:#c0503c; --bz-bad:#b33b3b;   /* 부산 목록 한 줄(1117-Z 7, 시안 B) — 이 목록에서만 */
  --adv-band:rgba(47,111,181,.13); --adv-tx:#2a5f9c; --ads-band:rgba(46,125,91,.15); --ads-tx:#2a6d4f; --adt-band:rgba(236,178,40,.24); --adt-tx:#8a6406; --adt-line:rgba(200,150,30,.45);   /* 광고 판 카드 머리 — 영상 = 옅은 파랑 · 구두 = 옅은 노랑 (HB 11/16) */

}

*{box-sizing:border-box}
/* ⚠️ 페이지는 옆으로 움직이지 않는다 (아이폰에서 탭을 밀다 왼쪽이 잘린 채 남던 일, 11/14) */
html{overflow-x:hidden}   /* ⚠️ touch-action 을 여기 걸면 표 안 가로 스크롤까지 막힌다(11/14) — 옆 밀림은 overflow · 스크롤 되돌리기로 막는다 */
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.6 var(--sans);word-break:keep-all;overflow-wrap:anywhere;overflow-x:clip;
  padding:0 max(16px,env(safe-area-inset-right)) 80px max(16px,env(safe-area-inset-left));-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--wed)}
.wrap{max-width:680px;margin:0 auto}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 8px) 0 0}
.topline{display:flex;align-items:center;gap:8px;min-height:36px}
.topline h1{font-size:19px;font-weight:500;margin:0;flex:1;letter-spacing:-.2px;display:flex;align-items:center;gap:8px;min-width:0}
.topline h1 img{width:24px;height:24px;border-radius:6px}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;color:var(--tx2);border-radius:10px;flex:none}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;margin:8px 0 0;border-bottom:1px solid var(--line);position:relative}
.tab{flex:1 1 0;min-width:0;padding:9px 4px 10px;font-size:14px;color:var(--tx3)}
.tab.on{color:var(--tx);font-weight:500}
.tabbar{position:absolute;bottom:-1px;left:0;height:2px;background:var(--tx);border-radius:2px;transition:transform .3s cubic-bezier(.22,.8,.24,1),width .3s cubic-bezier(.22,.8,.24,1)}
.stage{overflow:hidden}
#panel{will-change:transform,opacity;padding-top:4px;padding-bottom:14px}   /* 맨 아래 표의 아래 꺾쇠가 .stage 에 잘리지 않게 (1119-2 A) */
.note{color:var(--tx2);font-size:13px;margin:10px 2px}
.muted{color:var(--tx3)} .small{font-size:13px} .tiny{font-size:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card .h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.card .h b{font-weight:500;font-size:15px}
.spacer{flex:1}
.kv{margin:0;display:grid;grid-template-columns:78px 1fr;gap:2px 10px;font-size:14px}
.kv dt{color:var(--tx3)} .kv dd{margin:0;min-width:0}
.tapline{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:baseline;width:100%;text-align:left;padding:5px 0;font-size:14px;border-radius:8px}
.tapline > span:first-child{color:var(--tx3)}
.tapline .chev{color:var(--line2);font-size:13px}
.tapline.bad > span:nth-child(2){color:var(--bad)}
.tapline.warn > span:nth-child(2){color:var(--warn)}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--s2);color:var(--tx2);white-space:nowrap;vertical-align:1px}
.pill.pg{background:var(--s2);color:var(--tx2)} .pill.bs{background:var(--bs-soft);color:var(--bs)} .pill.fri{background:var(--fri-soft);color:var(--fri)} .pill.lay{background:var(--wed-soft);color:var(--wed)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}
.dot.pg,.dot.sun{background:var(--sun)} .dot.bs{background:var(--bs)} .dot.fri{background:var(--fri)} .dot.wed{background:var(--wed)} .dot.tue{background:var(--tue)}
.nav{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 0 8px}
.nav b{font-weight:500;min-width:150px;text-align:center}
.nav button{width:36px;height:36px;border-radius:10px;color:var(--tx2);font-size:18px}
.nav .now{font-size:12px;color:var(--tx3);width:auto;padding:0 6px}
.nav{position:relative}
.nav .txtbtn{position:absolute;right:0;top:50%;transform:translateY(-50%);width:auto;height:auto;font-size:13px;white-space:nowrap;color:var(--tx2)}
/* 이번 주 — 모양 고르기(카드 A · 한 장 표 C) · R10 */
.nav .wseg{position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;gap:1px;padding:2px;border-radius:9px;background:var(--s2)}
.nav .wseg button{width:27px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--tx3)}
.nav .wseg button[aria-pressed="true"]{background:var(--paper);color:var(--tx)}
.wseg svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.4}
/* 다가오는 한 주 (1119-W, HB 11/19 — 시안 E): 보기 단추 + [이번 주 | 다가오는 한 주] 스위치 · 7일 띠 · 며칠 뒤 알약 · 지난 날 접힘 */
.nav.wnav{justify-content:space-between;flex-wrap:wrap;gap:6px} .nav.wnav .wseg{position:static;transform:none}
.wsw{display:flex;gap:2px;padding:3px;border-radius:11px;background:var(--s2)}
.nav .wsw button{width:auto;height:32px;padding:0 11px;border-radius:9px;font-size:13px;color:var(--tx2);white-space:nowrap}
.nav .wsw b{min-width:0}
.wsw [aria-pressed="true"]{background:var(--paper);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.wsw .wcal{display:flex;align-items:center;border-radius:9px;padding:0 2px}
.nav .wsw .wcal button{width:24px;padding:0;font-size:16px}
.nav .wsw .wcal .wl{width:auto;padding:0 2px;font-size:13px;font-weight:600;color:var(--tx)}
.nav .wsw .wup{display:flex;align-items:baseline;gap:4px;line-height:32px} .wup small{font-size:11px} .nav .wsw .wup b{font-size:15px;font-weight:600} .nav .wsw .wup[aria-pressed="true"] b{font-weight:700}
.wdays{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:6px 6px 8px;margin:2px 0 0}
.wdg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;border-radius:10px}
.wd span{font-size:12px;color:var(--tx3)} .wd b{font-size:17px;font-weight:500;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.wd.su span,.wd.su b{color:var(--sun)} .wd.now span{color:var(--tx);font-weight:600} .wd.now b{background:var(--tx);color:var(--paper)}
.wd.gone{opacity:.45} .wd.wk0{box-shadow:inset 1px 0 0 var(--line2);border-radius:0 10px 10px 0}
@media (hover:hover){.wd:hover{background:var(--s1)}}
.wd em{display:flex;gap:3px;height:6px} .wd em i{width:5px;height:5px;border-radius:50%}

<script id="rotation-core">
// 교역자 로테이션 — 화면 없이 도는 판단. tests/test_rotation.js 가 이것만 떼어 시험한다.

//
// 자료 모양(book) — 1114-R '정해 둔 것':
//   people : 교역자 · 성도 인도자 { id, name, kind?:'lay', roles:['preach','offer','lead','busan'], no:['sun1|preach', …], at, by, del? }
//            kind 'lay' = 교역자가 아니라 성도로서 예배인도를 하는 분(HB 11/14). 없으면 교역자.

//   visits : 부산 방문       { id:'v|날짜', date, who:[사람 id], days:'금토일', lead?:{ fri|sun|ll: { m, p? } }, stay:[], travel:[], mates?:[{ n, p? }], meet?:{ k, … }, note, at, by, del? }
//            동행 mates · 모임 meet 은 1116-2 B 부터 — 그 전의 글 세 칸(staff 동행 · group 주일모임 · edu 교육)은 읽을 때 옮긴다(normVisit).
//            날짜는 보통 주일이지만 성탄(목) · 송구영신(수)처럼 다른 날도 된다(시트 2025-12 실제). 한 주에 방문이 여럿일 수 있다.
//   marks  : 그 주 교회 일정 { id:'m|주일', sun, tags:['성찬주'], note, at, by, del? }
//   opts   : 고르는 목록 { id:'o|종류|…', type:'stay'(숙소)|'mode'(교통편)|'cat'(특이사항 갈래), name, kind?, cost?(숙소 1박 평소 금액), ord, at, by, del? }
//            목록이 한 번도 손대지 않은 종류는 저장하지 않고 기본값을 보여 준다(optList). 처음 고칠 때 기본값을 정해진 id 로 적는다(ensureOpts).
//   visits[].issues : 특이사항 [{ cat:'예배팀', text }] — 메모(note)와 따로 (HB 11/14). visits[].hot : 메모 '중요'(빨강, 목록에도) · note : 메모 '일반'(판 안에서만, 1117-Z 5b). 나중에 교회 보고서의 부산 보고서를 여기에 잇는다(R7).
// 모든 줄은 at(고친 때) · by(누가 — 처음엔 HB, R6 부터 교역자 각자)를 갖는다. 지우면 내용을 비우고 del:true 만 남긴다(표지).
// 부산 교역자는 visits 한 곳에만 적는다. 예배 구성의 '부산 교역자' 줄은 visits 에서 읽어 보여 준다.
const APP_VERSION = 'v. 26-1125-1';
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
// 보여 줄 때 일요일 **하루만** 쓸 땐 '주일' (HB 11/16) — '토일' · '금토일' 처럼 묶을 땐 '일' 그대로(1116-2 A). 자료(days 글자 · 교통 시각)는 '일'
const DOWS = DOW.map(c => (c === '일' ? '주일' : c));
function dayS(s) { s = String(s || ''); return s === '일' ? '주일' : s; }
function timeS(t) { return String(t || '').replace(/^일/, '주일'); }
// 예배 — off: 그 주 주일에서 며칠 뒤인가. ⚠️ 모든 주간은 **주일에 시작**한다(HB 11/14): 주일 → 화 → 수 → 금 → 토
const SVC = {
  sun1: { label: '1부', short: '1부', off: 0 }, sun2: { label: '2부', short: '2부', off: 0 }, sun3: { label: '3부', short: '3부', off: 0 },
  ll: { label: '라이프라인', short: 'LL', off: 0 }, fri: { label: '금요예배', short: '금요', off: 5 }, wed: { label: '수요예배', short: '수요', off: 3 },
  tue: { label: '화요예배', short: '화요', off: 2, past: true },   // 2026-05 까지 (그 뒤 수요예배로) — 옛 기록을 담으려고만 둔다
};
const SUN4 = ['sun1', 'sun2', 'sun3', 'll'];
const ROLE = { preach: '설교', offer: '헌금인도', lead: '예배인도', notice: '광고' };   // notice = WN 광고(매월 마지막 금요일, HB 11/14)
// 시트 '예배 구성' 에 실제 있는 칸만 (예배 × 역할)
const GRID = [
  ['sun1', 'preach'], ['sun2', 'preach'], ['sun3', 'preach'], ['ll', 'preach'],
  ['sun1', 'offer'], ['sun2', 'offer'], ['sun3', 'offer'], ['ll', 'offer'],
  ['sun2', 'lead'], ['ll', 'lead'],
  ['fri', 'preach'], ['fri', 'offer'], ['fri', 'notice'],
  ['wed', 'preach'], ['wed', 'offer'],
  ['tue', 'preach'], ['tue', 'offer'],
];
const PROLES = { preach: '설교', offer: '헌금', lead: '예배인도', busan: '부산' };
// 일마다 있는 예배 (시트 '예배 구성' 칸 그대로)
const ROLE_SVCS = { preach: ['sun1', 'sun2', 'sun3', 'll', 'fri', 'wed'], offer: ['sun1', 'sun2', 'sun3', 'll', 'fri', 'wed'], lead: ['sun2', 'll'] };
const DAYS = ['토일', '토일월', '금토일', '금토일월', '목금토일', '수목', '목'];
const MARK_TAGS = ['성찬주', '극동방송', '종려주일', '부활주일', '성탄', '송구영신'];
/* 숙소 상태 (1116-2 C, HB 11/16) — 호텔과 성도님 댁이 다르다. 값은 둘이 같은 말: '' 미정 · pre 예약 전 / 대화 전 · ask 대화 중(댁만) · done 예약 완료 / 대화 완료 · cancel 취소.
   옛 값('' · ask · done · cancel)은 그대로 읽힌다 — 다만 호텔의 ask(예전 글자 '대화 중')는 '예약 전'(pre)으로 옮겨 읽는다(normStay). */
const STAY_ST = {
  hotel: [['', '미정'], ['pre', '예약 전'], ['done', '예약 완료'], ['cancel', '취소']],
  home: [['', '미정'], ['pre', '대화 전'], ['ask', '대화 중'], ['done', '대화 완료'], ['cancel', '취소']],
};
function stayStOf(kind, status) { const l = STAY_ST[kind === 'home' ? 'home' : 'hotel']; if (l.some(x => x[0] === status)) return status; return status === 'ask' ? 'pre' : ''; }
function stayStName(s) { const k = s && s.kind === 'home' ? 'home' : 'hotel', st = stayStOf(k, s && s.status); return STAY_ST[k].find(x => x[0] === st)[1]; }
// 숙소 쓰는 사람 (1116-2 C) — 동행 스텝이 있을 때만 묻는다. 값은 예전 그대로('' · 남 · 여)

function stayForAsk(v, i, d) { return !!(((v && v.mates) || []).length || (d && d.for) || ((v && v.stay) || []).some((s, k) => k !== i && s.status !== 'cancel')); }
// 성도님 댁은 취소 기한 · 예약 화면이 없다 — 화면에서 감추고, 알림 · 표에서도 호텔 것만 본다
function stayHotel(s) { return !!s && s.kind !== 'home'; }

// 칸 이름 — 주일은 '1부 헌금인도', 주중은 짧게 '수요 헌금'(줄바꿈 안 되게, HB 11/14), 마지막 금요일 광고는 'WN 광고'
function slotLabel(svc, role) {
  if (isSpec(svc)) return '특별 ' + (role === 'lead' ? '예배인도' : role === 'offer' ? '헌금' : ROLE[role]);   // 이름은 slotLabelB(책을 아는 곳)
  if (role === 'notice') return 'WN 광고';
  if (role === 'offer' && SVC[svc].off !== 0) return SVC[svc].short + ' 헌금';
  return SVC[svc].short + ' ' + (role === 'lead' ? '예배인도' : ROLE[role]);
}
// 부산 금요예배 이름 — 시트의 금1 · 금2 · 금3 (HB 11/14: 풀네임으로)
const FRI_NAMES = ['', 'AWAKE', 'REVIVED', 'ENCOUNTER'];
function friName(sun) { return FRI_NAMES[busanFri(sun)] || ''; }
// 그 달의 마지막 금요일인가 (WN 광고 칸이 있는 날)
function isLastFri(ymd) { return dowOf(ymd) === 5 && addDays(ymd, 7).slice(0, 7) !== ymd.slice(0, 7); }

/* ---- 분당 특별예배 (1116-2 E, HB 11/17) ----
   성탄 전야(목 저녁) · 성탄(금 오전) · 송구영신처럼 정해진 예배(주일 · 수 · 금) 밖의 분당 예배. 예배 하나 = specs 한 줄:
   { id: 'x|날짜|k'(k = 그 날 몇 번째, 1~9), date, t?: 때(새벽 · 오전 · 오후 · 저녁 · 'HH:MM'), n: 예배 이름, roles: 자리(설교 · 헌금 · 예배인도 중), rest?: 그 날 정해진 수요 · 금요예배는 쉼 }.
   자리 사람은 보통 자리(slots)와 같은 모양 — id '날짜|xk|역할'(svc = 'x1' ~ 'x9'). 그래서 고르기 판 · 겹침(부산에 있는 날) · 내 일정 · 사람 × 주 · 월 달력이 그대로 따라온다.
   예배를 지우면 그 자리들도 지운다(dropSpec). 고치는 것은 HB 만(교역자 칸에 없음). */
const SPEC_ROLES = ['preach', 'offer', 'lead'], SPEC_NAMES = ['성탄 전야 예배', '성탄 예배', '송구영신 예배'];
function isSpec(svc) { return /^x[1-9]$/.test(String(svc || '')); }
// SVC 를 찾을 때 특별예배도 깨지지 않게 — 정해진 예배가 아니면 '특별'
function svcI(svc) { return SVC[svc] || { label: '특별예배', short: '특별', off: -1, spec: true }; }
function specId(date, k) { return 'x|' + date + '|' + k; }
function normSpec(o) {
  if (!o || typeof o !== 'object') return null;
  const [x, date, k] = String(o.id || '').split('|'); if (x !== 'x' || !isYmd(date) || !/^[1-9]$/.test(k || '')) return null;
  const b = base(o); b.date = date; b.k = +k; if (b.del) return b;
  b.n = str(o.n, 40); if (!b.n) return null;
  const t = str(o.t, 10); if (t) b.t = t;
  b.roles = Array.isArray(o.roles) ? SPEC_ROLES.filter(r => o.roles.includes(r)) : ['preach', 'offer'];
  if (o.rest && [3, 5].includes(dowOf(date))) b.rest = true;   // 그 날 정해진 수요 · 금요예배는 쉼
  return b;

function specOf(book, date, svc) { return isSpec(svc) ? live(book.specs || []).find(x => x.date === date && x.k === +svc.slice(1)) || null : null; }
// 기간 안의 특별예배 — 날짜 · 때 순
function specsIn(book, from, to) { return live(book.specs || []).filter(x => x.date >= from && x.date <= to).sort((a, b) => (a.date !== b.date ? (a.date < b.date ? -1 : 1) : evTKey(a.t) < evTKey(b.t) ? -1 : evTKey(a.t) > evTKey(b.t) ? 1 : a.k - b.k)); }
// 그 날 정해진 예배가 쉬는가 — 쉬게 한 특별예배
function restOn(book, date) { return live(book.specs || []).find(x => x.date === date && x.rest) || null; }
// 자리 이름 — 특별예배면 그 예배 이름: '성탄 예배 설교'
function slotLabelB(book, date, svc, role) { const sp = specOf(book, date, svc); return sp ? sp.n + ' ' + (role === 'lead' ? '예배인도' : ROLE[role]) : slotLabel(svc, role); }
function nextSpecK(book, date) { for (let k = 1; k <= 9; k++) if (!(book.specs || []).some(x => x.id === specId(date, k))) return k; return 0; }
// 특별예배 지우기 — 예배 줄과 그 자리들(지운 표지)
function dropSpec(book, id, by, now) {
  const sp = (book.specs || []).find(x => x.id === id && !x.del); if (!sp) return false;
  for (const r of SPEC_ROLES) drop(book, 'slots', slotId(sp.date, 'x' + sp.k, r), by, now);
  return drop(book, 'specs', id, by, now);

/* ---- 날짜 (서울 날짜 문자열 'YYYY-MM-DD' 만 다룬다) ---- */
const isYmd = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(Date.parse(s + 'T00:00:00Z'));
function ymdUTC(d) { return d.toISOString().slice(0, 10); }

function dowOf(ymd) { return new Date(ymd + 'T00:00:00Z').getUTCDay(); }

// 보기마다 내보낼 글 배열 (R12 B). view = 'all'(이번달 전체 = 시트 모양) · VIEWS 의 여섯. o = { today, pid(내 일정), grid(내 일정 8주 표), calf(월 달력 갈래), ext(예배별 '한 주 더') }

// AI 답(글) → 예약 목록. ```json 울타리 · 앞뒤 말이 붙어 와도 [ … ] 또는 { … } 만 떼어 읽는다

// 맞는 방문: 체크인 날이 머무는 날 안(또는 첫날 하루 전)인 방문. 여럿이면 첫날이 가장 가까운 것

/* 손가락을 따라가는 탭 넘기기 — 4분의 1 넘게(빠른 튕김은 40px) 밀면 다음 탭, 못 미치면 제자리, 끝에서는 고무줄.

      ${line(plan, '설교', 'sun1', 'preach', SUN4)}${line(plan, '헌금인도', 'sun1', 'offer', SUN4)}${line(plan, '2부 인도', 'sun2', 'lead')}${line(plan, '<span class="llc">LL</span> 인도', 'll', 'lead')}
      ${here.map(v => `<button class="bsrow" data-visit="${esc(v.id)}"><b>부산</b>${ttlP(v)}<span>${esc(whoText(S.book, v.who, '', pm)) || '<span class="muted">교역자 미정</span>'}</span><span class="muted small">${stayPeriod(v)}</span><span class="spacer"></span><span class="muted small">${esc(stayText(v))}</span>${bsP(v)}${badP(v)}${stayState(v) === 'done' ? '' : stP(v)}</button>${gsSumLine(v)}`).join('')}${here.length ? '' : newRowFor(ws)}</div>` });
    if (svcShown(S.book, 'tue', [ws])) { const td = svcDate(ws, 'tue'); out.push({ ds: [td], t: '0', nm: '화요 ' + md(td), h: (d) => `<div class="card${pc(d)}" data-wday="${td}"><div class="h"><span class="dot tue"></span><b>화요예배</b><span class="muted small">${mdd(td)}</span>${ddP(td, true)}</div>${line(plan, '설교', 'tue', 'preach')}${line(plan, '헌금인도', 'tue', 'offer')}</div>` }); }
    out.push({ ds: [plan.wed], t: '0', nm: '수요 ' + md(plan.wed), h: (d) => `<div class="card${restC(plan.wed)}${pc(d)}" data-wday="${plan.wed}"><div class="h"><span class="dot wed"></span><b>수요예배</b><span class="muted small">${mdd(plan.wed)}</span>${ddP(plan.wed, true)}</div>${restN(plan.wed)}${line(plan, '설교', 'wed', 'preach')}${line(plan, '헌금인도', 'wed', 'offer')}</div>` });
    out.push({ ds: [plan.fri], t: '0', nm: '금요 ' + md(plan.fri), h: (d) => `<div class="card${restC(plan.fri)}${pc(d)}" data-wday="${plan.fri}"><div class="h"><span class="dot fri"></span><b>금요예배</b><span class="muted small">${mdd(plan.fri)}</span><span class="spacer"></span>${plan.busanFri ? `<span class="muted tiny">부산</span> ${friLabel(addDays(ws, 7))}` : ''}${ddP(plan.fri)}</div>${restN(plan.fri)}${line(plan, '설교', 'fri', 'preach')}${line(plan, '헌금', 'fri', 'offer')}${isLastFri(plan.fri) ? line(plan, 'WN 광고', 'fri', 'notice') : ''}</div>` });
    specsIn(S.book, ws, sat).forEach(sp => out.push({ ds: [sp.date], t: '0' + evTKey(sp.t), nm: sp.n, h: () => specCard(sp) }));   // 분당 특별예배 (1116-2 E)
    rest.forEach(v => out.push({ ds: stayDates(v).filter(x => x >= ws && x <= sat).sort(), t: '1', nm: '부산 ' + md(v.date), h: (d) => visitCard(v, d) }));
    return out;
  };
  const sortIt = (xs) => { xs.sort((a, b) => (a.k < b.k ? -1 : a.k > b.k ? 1 : 0)); if (order === 'new') xs.reverse(); return xs; };
  let body;
  if (lay === 'a') {
    // A — 지금 부산(이 주일의 방문)은 주일 카드 안 한 줄, 내려갈 방문은 준비 카드. 시간순 또는 최신순.
    const all = W.suns.flatMap(weekCards), shown = [], past = [];
    for (const it of all) {
      const inW = it.ds.filter(x => x >= W.from && x <= W.to);
      if (inW.length) shown.push(Object.assign(it, { d: inW[0], k: inW[0] + it.t }));
      else if (up && it.ds.length && it.ds.every(x => x < today) && it.ds[0] >= thisSun) past.push(Object.assign(it, { d: it.ds[0], k: it.ds[0] + it.t }));
    }
    sortIt(shown); sortIt(past);
    const sep = (t) => `<div class="wsep">${t}</div>`;
    let h = '';
    if (up) {
      if (past.length) h += `<button class="wpastrow" data-act="wpast" aria-expanded="${!!S.wpast}"><span>지난 날 ${S.wpast ? '' : '접힘'}</span>${past.map(x => `<span class="sep">·</span><span>${esc(x.nm)}</span>`).join('')}<span class="spacer"></span><span>${S.wpast ? '접기 ▴' : '펴기 ▾'}</span></button>${S.wpast ? past.map(x => x.h(x.d)).join('') : ''}`;
      h += sep(`<b>오늘 ${mdd(today)}</b>`);
    }
    let wk = '';
    for (const it of shown) {
      const s = sunOf(it.d);
      if (up && wk && s !== wk) h += sep(s > wk ? `다음 주로 이어서 · ${md(s)}~${W.to.slice(5, 7) === s.slice(5, 7) ? +W.to.slice(8) : md(W.to)}` : `이번 주 · ${md(today)}~${+addDays(thisSun, 6).slice(8)}`) + (s === lastSun && s !== sun ? markLine(s) : '');
      wk = s; h += it.h(it.d);
    }
    body = h;
  } else {
    // C — 분당은 예배 × 자리 표 한 장, 부산은 열흘 띠 위에 방문을 막대로. 다가오는 한 주면 표 칸도 오늘부터 7일(두 주에 걸침).
    const cell = (plan, svc, role, lab, all) => { const sl = plan.slots[svc + '|' + role];
      const ss = all ? SUN4.map(x => plan.slots[x + '|' + role]).filter(Boolean) : sl ? [sl] : [];
      const lvl = ss.map(x => lv[x.id]).reduce((a, b) => (a === 'bad' || b === 'bad' ? 'bad' : a || b), '') || '';
      const t = all ? (groupRole(S.book, plan, role, SUN4, pm)[0] || {}).text || '' : sl ? whoText(S.book, sl.who, sl.txt, pm) : '';
      return `<button class="wc ${lvl}" data-pick="${svcDate(plan.sun, svc)}|${svc}|${role}"${all ? ' data-all="1"' : ''}>${t ? esc(t) : '<span class="muted">—</span>'}${lab ? `<small>${esc(lab)}</small>` : ''}</button>`; };
    const sunCell = (plan, role) => (groupRole(S.book, plan, role, SUN4, pm).length > 1 ? SUN4.map(x => cell(plan, x, role, SVC[x].short)).join('') : cell(plan, 'sun1', role, '', true));
    // 1117-G (HB): 축을 바꿈 — 줄 = 설교 · 헌금 · 인도, 칸 = 예배(날짜 머리는 부산 띠처럼 요일 위 · 날짜 아래).
    const tr = (cls, name, date, a, b, c) => ({ th: `<th class="g-${cls}"><b>${name}</b><small>${md(date)}</small></th>`, c: [a, b, c || ''] });
    const spCell = (sp, role) => { if (!sp.roles.includes(role)) return ''; const id = slotId(sp.date, 'x' + sp.k, role), sl = S.book.slots.find(x => x.id === id && !x.del), t = sl ? whoText(S.book, sl.who, sl.txt, pm) : '';
      return `<button class="wc ${lv[id] || ''}" data-pick="${esc(id)}">${t ? esc(t) : '<span class="muted">—</span>'}</button>`; };
    const rows = [];
    for (const ws of W.suns) {
      const plan = weekPlan(S.book, ws), td = svcDate(ws, 'tue');
      rows.push({ d: ws, h: tr('sun', '주일', ws, sunCell(plan, 'preach'), sunCell(plan, 'offer'), cell(plan, 'sun2', 'lead', '2부') + cell(plan, 'll', 'lead', 'LL').replace('<small>LL', '<small class="llc">LL')) });
      if (svcShown(S.book, 'tue', [ws])) rows.push({ d: td, h: tr('tue', '화', td, cell(plan, 'tue', 'preach'), cell(plan, 'tue', 'offer')) });
      rows.push({ d: plan.wed, h: tr('wed', '수', plan.wed, cell(plan, 'wed', 'preach'), cell(plan, 'wed', 'offer')) });
      rows.push({ d: plan.fri, h: tr('fri', '금', plan.fri, cell(plan, 'fri', 'preach'), cell(plan, 'fri', 'offer'), isLastFri(plan.fri) ? cell(plan, 'fri', 'notice', 'WN 광고') : '') });
      specsIn(S.book, ws, addDays(ws, 6)).forEach(sp => rows.push({ d: sp.date + evTKey(sp.t), h: { th: `<th class="g-sp">${own ? `<button data-spec="${esc(sp.id)}" style="text-align:inherit">` : ''}<b>${esc(sp.n)}</b><small>${md(sp.date)}${sp.t ? ' ' + esc(sp.t) : ''}</small>${own ? '</button>' : ''}</th>`, c: [spCell(sp, 'preach'), spCell(sp, 'offer'), spCell(sp, 'lead')] } }));
    }
    const rs = rows.filter(r => r.d.slice(0, 10) >= W.from && r.d.slice(0, 10) <= W.to).sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : 0));
    if (order === 'new') rs.reverse();
    const stays = live(S.book.visits).filter(v => stayDates(v).some(d => d >= W.from && d <= W.to)).sort((a, b) => (a.date < b.date ? -1 : 1));
    const d0 = up ? addDays(today, -1) : addDays(sun, -2), span = Array.from({ length: 10 }, (_, k) => addDays(d0, k)), d9 = span[9];
    const bars = stays.map(v => { const ds = stayDates(v).filter(x => x >= d0 && x <= d9).sort(); return ds.length ? { v, a: span.indexOf(ds[0]) + 1, b: span.indexOf(ds[ds.length - 1]) + 2, end: stayDates(v).slice().sort().pop() < today } : null; }).filter(Boolean).sort((x, y) => x.a - y.a);
    const sc = (d) => { const c = [dowOf(d) === 0 ? 'su' : dowOf(d) === 5 ? 'fr' : '', d === today ? 'now' : ''].filter(Boolean).join(' '); return c ? ` class="${c}"` : ''; };
    const vrow = (v) => { const sub = [stayPeriod(v), stayWhole(v) ? '' : dayS(sortDays(v.date, v.days || defaultDays(v.date))), travelT(v), (v.mates || []).length ? mateText(S.book, v) + ' 동행' : '', meetText(v.meet)].filter(Boolean), red = [issuesT(v), v.hot || ''].filter(Boolean).join(' · ');   // 특이사항 · 중요 메모만 빨갛게(일반 메모는 판 안에서, 1117-Z 5b)
      return `<button class="wv" data-visit="${esc(v.id)}"><span>${esc(whoText(S.book, v.who, '', pm)) || '<span class="muted">교역자 미정</span>'}${ttlP(v)}</span><span>${esc(stayText(v)) || '<span class="muted">숙소 —</span>'} ${bsP(v)} ${badP(v)} ${stP(v)}<small>${esc(sub.join(' · '))}${red ? `${sub.length ? ' · ' : ''}<span class="vred">${esc(red)}</span>` : ''}</small>${leadChips(v)}${gsSumSpan(v) ? `<small>${gsSumSpan(v)}</small>` : ''}</span></button>`; };
    body = `<div class="card"><div class="wh sun"><b>분당</b></div>
      <div class="wtab-x"><table class="wtab"><thead><tr><th></th>${rs.map(r => r.h.th).join('')}</tr></thead><tbody>${['설교', '헌금', '인도'].map((lab, i) => rs.some(r => r.h.c[i]) ? `<tr><td class="wr">${lab}</td>${rs.map(r => `<td>${r.h.c[i] || '<span class="muted">–</span>'}</td>`).join('')}</tr>` : '').join('')}</tbody></table></div></div>
    <div class="card"><div class="wh bs"><b>부산</b></div>
      <div class="wstrip">${span.map(d => `<span${sc(d)}>${DOWS[dowOf(d)]}</span>`).join('')}</div>
      <div class="wstrip num">${span.map(d => `<span${sc(d)}>${+d.slice(8)}</span>`).join('')}</div>
      <div class="wstrip bars">${bars.map(x => `<button class="wbar${x.end ? ' dim' : ''}" data-visit="${esc(x.v.id)}" style="grid-column:${x.a}/${x.b}">${esc(whoText(S.book, x.v.who, '', pm)) || '미정'}${x.v.title ? ' · ' + esc(x.v.title) : ''}</button>`).join('')}</div>
      ${stays.map(vrow).join('')}${stays.some(v => v.date === sunIn) ? '' : newRowFor(sunIn)}</div>`;
  }
  // 7일 띠(카드 보기) — 날마다 예배 점 · 내 차례 노랑 · 부산 막대, 날을 누르면 그 날 카드로
  let strip = '';
  if (lay === 'a') {
    const days = Array.from({ length: 7 }, (_, k) => addDays(W.from, k)), me = selfPid();
    const mine = new Set(me ? live(S.book.slots).filter(x => x.date >= W.from && x.date <= W.to && x.who.includes(me)).map(x => x.date) : []);
    const spD = new Set(specsIn(S.book, W.from, W.to).map(x => x.date));
    const dots = (d) => { const w = dowOf(d), c = [w === 0 ? 'sun' : w === 3 ? 'wed' : w === 5 ? 'fri' : '', spD.has(d) ? 'sp' : '', mine.has(d) ? 'me' : ''].filter(Boolean); return c.map(x => `<i class="${x}">${x === 'me' ? '★' : ''}</i>`).join(''); };
    const vs = live(S.book.visits).map(v => ({ v, ds: stayDates(v).filter(x => x >= W.from && x <= W.to).sort() })).filter(x => x.ds.length).sort((a, b) => (a.ds[0] < b.ds[0] ? -1 : 1));
    strip = `<div class="wdays"><div class="wdg">${days.map((d, k) => `<button class="wd${d === today ? ' now' : ''}${d < today ? ' gone' : ''}${dowOf(d) === 0 ? ' su' : ''}${up && k && dowOf(d) === 0 ? ' wk0' : ''}" data-act="wday" data-v="${d}" aria-label="${mdd(d)}"><span>${d === today ? '오늘' : DOWS[dowOf(d)]}</span><b>${+d.slice(8)}</b><em>${dots(d)}</em></button>`).join('')}</div>
      ${vs.length ? `<div class="wdg wdb">${vs.map(x => `<button class="wbar${x.ds[x.ds.length - 1] < today ? ' dim' : ''}" data-visit="${esc(x.v.id)}" style="grid-column:${days.indexOf(x.ds[0]) + 1}/${days.indexOf(x.ds[x.ds.length - 1]) + 2}">부산 · ${esc(whoText(S.book, x.v.who, '', pm)) || '미정'}${x.v.title ? ' · ' + esc(x.v.title) : ''}</button>`).join('')}</div>` : ''}</div>`;
  }
  const segI = { a: '<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3.2" width="14" height="3.6" rx="1.2"/><rect x="3" y="8.2" width="14" height="3.6" rx="1.2"/><rect x="3" y="13.2" width="14" height="3.6" rx="1.2"/></svg>', c: '<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3.5" y="3" width="13" height="7.4" rx="1.6"/><rect x="3.5" y="12.2" width="13" height="4.8" rx="1.6"/></svg>' };
  const upB = `<button class="wup" data-act="wmode" data-v="up" aria-pressed="${up}"><small>다가오는</small><b>한 주</b></button>`;
  const calB = up ? `<button data-act="wmode" data-v="cal" aria-pressed="false">${weekLabel(thisSun)} 이번 주</button>`
    : `<span class="wcal" aria-pressed="true"><button data-week="-1" aria-label="지난 주">‹</button><button class="wl" data-week="0" aria-label="이번 주로">${weekLabel(sun)}${sun === thisSun ? ' 이번 주' : ''}</button><button data-week="1" aria-label="다음 주">›</button></span>`;
  return `${topBanner(gsBandHtml(up ? visitSun(today) : visitSun(addDays(sun, 1))))}
  <div class="nav wnav"><span class="wseg" role="group" aria-label="화면 모양"><button data-act="wlay" data-v="a" aria-pressed="${lay === 'a'}" aria-label="카드로 보기">${segI.a}</button><button data-act="wlay" data-v="c" aria-pressed="${lay === 'c'}" aria-label="한 장 표로 보기">${segI.c}</button></span>
    <span class="wsw" role="group" aria-label="보는 날">${calB}${upB}</span></div>
  ${strip}
  <div class="whint"><span>${lay === 'a' ? '<b class="mestar">★</b> 내 일정' : ''}</span><button class="txtbtn" data-act="wsort" aria-label="순서 바꾸기">${order === 'new' ? '최신순' : '시간순'}</button></div>
  ${markLine(sun)}
  <div id="wbody">${body}${spAdd}</div>`;
}

/* ---------- 달력표 보기 틀 (R4b · R5b) ----------
   자료는 하나, 보기만 바뀐다. 고른 틀은 이 기기에 기억(PREF.mview). R6 부터 교역자 각자는 '내 일정' 이 기본(HB 결정).
   이름(HB 11/14): 시트형 → 예배별, 가로형 → 주간형, 부산 순번표 → 부산 요약. */
const VIEWS = {
  mine: { name: '내 일정', desc: '한 사람이 맡은 것만 날짜순' },
  sheet: { name: '예배별', desc: '예배 구성 시트 그대로 — 주마다 설교 · 헌금, 오른쪽에 인도 · 부산' },
  grid: { name: '주차별', desc: '주를 가로로 — 같은 자리에 누가 돌았나' },
  cal: { name: '달력', desc: '보통 달력 모양 — 설교 · 헌금 · 예배인도 · 부산 골라 보기' },
  busan: { name: '부산 요약', get desc() { return '부산 로테이션 시트처럼 — 금요예배 · 숙소 · ' + (isStaff() ? '' : '금액 · 취소 기한 · ') + '동행 · 모임 (칸을 누르면 바로 고침)'; } },
  matrix: { name: '사람 × 주', desc: '누가 몇 번 맡았는지 한눈에 — 고르게 나누기' },
  bteam: { name: '부산 예배팀', desc: '구글 시트를 폰에 맞게 — 줄 = 역할 · 열 = 주 (1121-G G3b)' },
  bserve: { name: '부산 예배위원', desc: '구글 시트를 폰에 맞게 — 줄 = 주일 · 열 = 안내 · 헌금 · 봉독 · 광고 (1121-G G3b)' },
};
const GS_VIEWS = ['bteam', 'bserve'];   // 시트에서 읽은 표 — 내보내기에는 없음(책이 아니라 시트 사본)
// 사람 × 주 는 HB 만(교역자에게는 목록 · 내보내기 · 첫 화면에서 빠지고, 기억해 둔 값이면 처음 값으로)
const viewOk = (k) => !!VIEWS[k] && !(k === 'matrix' && isStaff());
const viewKeys = () => Object.keys(VIEWS).filter(viewOk);
const GCLS = { sun: 'sun', fri: 'fri', wed: 'wed', tue: 'tue', bs: 'bs', lead: 'lead', sp: 'sp' };
const GNAME = { sun: '주일', fri: '금요', wed: '수요', tue: '화요', bs: '부산', lead: '예배인도', sp: '특별' };
function monthRange(ym) { const suns = monthSundays(ym); return { from: ym + '-01', to: addDays(addMonths(ym, 1) + '-01', -1), suns }; }
const wideScreen = () => (document.documentElement.clientWidth || innerWidth) >= 700;
// 보기 고르기 — 폰은 아래에서 올라오는 판, PC · 태블릿은 단추 바로 아래 펼침 목록 (HB 11/14)
function viewsList(cur) { return viewKeys().map(k => [k, VIEWS[k]]).map(([k, v]) => `<button class="prow2" data-mview="${k}" aria-pressed="${k === cur}"><span class="ck"></span><span><b style="font-weight:500">${v.name}</b></span><span></span></button>`).join(''); }
function paneViews() { return `<div class="phead"><span></span><b>보기</b>${xBtn}</div><div class="pbody" style="gap:0">${viewsList(viewOk(PREF.mview) ? PREF.mview : 'sheet')}</div>`; }
function openViewsDrop(btn) {
  closeViewsDrop(); const r = btn.getBoundingClientRect();
  const el = document.createElement('div'); el.className = 'vdrop'; el.id = 'vdrop';
  el.style.left = Math.max(8, r.left) + 'px'; el.style.top = (r.bottom + 6) + 'px';
  el.innerHTML = viewsList(viewOk(PREF.mview) ? PREF.mview : 'sheet'); document.body.appendChild(el);
  if (!quiet() && el.animate) el.animate([{ opacity: 0, transform: 'translateY(-6px)' }, { opacity: 1, transform: 'none' }], { duration: 160, easing: 'cubic-bezier(.22,.8,.24,1)' });
}
function closeViewsDrop() { const el = $('#vdrop'); if (el) el.remove(); }

// 한 달 더 · 한 달 접기 — 맨 위 달 묶음의 높이가 스르륵 (quiet() 이면 바로)
const PSEG = { plus: '<svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg>',
  minus: '<svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3.5 8h9"/></svg>',
  reset: '<svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.2 5.2A5 5 0 1 1 3 8.6"/><path d="M4.4 2.4v2.9h2.9"/></svg>' };
// 모두 접기 — 펼친 달 묶음이 한꺼번에 스르륵 접히고 처음 화면으로
function pastReset() { const els = [...document.querySelectorAll('#panel .pastm')]; const done = () => { S.pastN = 0; render(); };
  if (quiet() || !els.length || !els[0].animate) return done(); let a;
  for (const el of els) a = el.animate([{ height: el.offsetHeight + 'px', opacity: 1 }, { height: '0px', opacity: 0 }], { duration: 300, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' });
  a.onfinish = done; }
function pastStep(d) {
  if (d < 0) { const el = $('#panel .pastm'); if (quiet() || !el || !el.animate) { S.pastN = Math.max(0, (S.pastN || 0) - 1); return render(); }
    const a = el.animate([{ height: el.offsetHeight + 'px', opacity: 1 }, { height: '0px', opacity: 0 }], { duration: 260, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' });
    a.onfinish = () => { S.pastN = Math.max(0, (S.pastN || 0) - 1); render(); }; return; }
  S.pastN = (S.pastN || 0) + 1; render(); const nl = $('#panel .pastm');
  if (!quiet() && nl && nl.animate) nl.animate([{ height: '0px', opacity: 0 }, { height: nl.offsetHeight + 'px', opacity: 1 }], { duration: 300, easing: 'cubic-bezier(.22,.8,.24,1)' });
}
function nextFreeSunday() { let s = visitSun(todayYmd()); for (let i = 0; i < 60 && live(S.book.visits).some(v => v.date === s); i++) s = addDays(s, 7); return s; }

    return `<span class="pill${r === 'busan' ? ' bs' : ' pg'}">${PROLES[r]}${part}</span>`; }).join('') : '<span class="muted tiny">맡는 일 없음</span>';

/* ---- 주보 담당 (1117-Z 2c) — 사람 탭 맨 위 한 줄: 이번 달부터 여섯 달. 달을 누르면 그 달 담당 고르기(paneBul) ---- */

  const hint = !ord.length ? "교역자를 눌러 '주보 담당 순번에 넣기' 를 켜 주세요." : !live(S.book.buls || []).length ? '달을 눌러 담당을 고르면 그 뒤 달은 ㄱㄴㄷ 순으로 돕니다.' : `순번 ${ord.map(p => esc(p.name)).join(' → ')} · 달을 누르면 그 달만 바꿉니다.`;

  return `<div class="phead"><span></span><b>${esc(slotLabelB(S.book, date, svc, role))}<span class="sub">${mdd(date)} · 보기만</span></b>${xBtn}</div>

}

function myAvail(k, fn) { const p = live(S.book.people).find(x => x.id === myPid()); if (!p) return toast(staffNoMsg());
  staffWrite(k, '', fn((p[k] || []).slice())); renderPane(); toast(k === 'can' ? '가능 일정을 적었습니다' : '부재를 적었습니다'); }
function personApply(pid, fn) { const p = S.book.people.find(x => x.id === pid); if (!p) return; const np = JSON.parse(JSON.stringify(p)); fn(np); put(S.book, 'people', np, byNow(), Date.now()); saveBook(); render(); }
function addPerson(lay) {
  const sel = lay === 'other' ? '#pe-new-oth' : lay ? '#pe-new-lay' : '#pe-new';
  const el = $(sel); const name = (el && el.value || '').trim(); if (!name) return;
  if (live(S.book.people).some(p => p.name === name)) { toast('같은 이름이 이미 있습니다\n' + name); return; }
  const now = Date.now(); const id = newPersonId(now, Math.random());
  put(S.book, 'people', lay === 'other' ? { id, name, kind: 'other', roles: ['preach'] } : lay ? { id, name, kind: 'lay', roles: ['lead'] } : { id, name, roles: Object.keys(PROLES) }, byNow(), now); saveBook();
  const n2 = lay === 'other' ? countTextFor(S.book, id) : 0;
  S.open = lay === 'other' && n2 ? id : null; render(); const n = $(sel); if (n && !S.open) n.focus();
  if (n2) toast(`'${name}' 로 글로 적힌 자리가 ${n2}칸 있습니다\n아래 단추로 이 분으로 바꿀 수 있습니다`);
}

/* ---------- 아래에서 올라오는 판 ----------
   S.pane = { kind:'pick', id, all } | { kind:'visit', id } | { kind:'mark', sun }
   닫기는 우상단 × 하나(그리고 바깥 누르기 · ESC · 손짓 둘 — paneGest). 고치는 것은 누르는 즉시 저장된다 — '저장' 단추가 없다. */
function openPane(p) { phClose();

/* 전달용 텍스트 카드 (1117-Z 4, HB 사진 11/18 I · J · K) — 카톡 글을 말풍선에 미리 보이고 오른쪽 위 아이콘 셋:

function adsFit(root) {
  root.querySelectorAll('.adtx.clamp').forEach(p => { const bt = p.nextElementSibling; if (!bt || !bt.classList.contains('admore') || !p.getClientRects().length) return; bt.hidden = p.scrollHeight <= p.clientHeight + 2; });
  const P = S.pane, bub = root.querySelector('#ads-bub'); if (!P || P.tailFrom === undefined) return; const from = P.tailFrom; delete P.tailFrom;
  if (!bub || quiet() || !bub.animate) return;

  const tail = bub.querySelector('.adtail'), to = +getComputedStyle(bub).getPropertyValue('--i'); if (!tail || from === to) return;

    if (S.pane || editing()) return;   // 적는 중에는 다시 열지 않는다
    toast('새 버전 ' + m[1] + '\n받아서 다시 엽니다');
    setTimeout(() => location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]) + (DEMO ? '&demo=1' : '')), 900);
  } catch (_) { if (manual) toast('새 버전을 확인하지 못했습니다\n인터넷 연결을 확인해 주세요'); }
  finally { if (vb) vb.classList.remove('busy'); }
}
setTimeout(() => checkUpdate(false), 4000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - (checkUpdate.at || 0) > 600000) { checkUpdate.at = Date.now(); checkUpdate(false); } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && FB.role === 'owner') gsAuto(); });   // 구글 자료(1121-G G2) — 한 시간 넘은 표를 조용히 다시

/* ---------- 미리보기 자료 (지어낸 이름 · 숙소) ---------- */
function demoBook() {
  const b = normBook(null), now = 1, by = 'demo';
  const names = ['한도윤', '서민재', '윤하람', '정은솔', '백시우', '문지호', '오세린', '강다온'];
  const P = names.map((n, i) => { const id = 'pdemo' + i; put(b, 'people', { id, name: n, roles: ['preach', 'offer', 'lead', 'busan'], bul: i < 4 }, by, now); return id; });
  put(b, 'buls', { id: bulId(todayYmd().slice(0, 7)), ym: todayYmd().slice(0, 7), p: P[1] }, by, now);   // 주보 담당 — 이번 달 서민재부터 ㄱㄴㄷ (1117-Z 2c)
  put(b, 'people', { id: 'pdemoL', name: '도하율', kind: 'lay', roles: ['lead'] }, by, now);   // 성도 인도자
  put(b, 'people', { id: 'pdemoP', name: '담임목사님', kind: 'other', roles: ['preach'] }, by, now);   // 담임 · 초청
  const sun0 = sunOf(todayYmd()); const start = addDays(sun0, -14);
  const order = [3, 6, 2, 1, 0, 4, 7, 2, 5, 1];   // 첫 사람(미리보기의 '나')이 2주 뒤 부산 — 내 일정의 부산 준비 카드가 보이게 (R8b)
  for (let i = 0; i < 10; i++) {
    const sun = addDays(start, 7 * i), w = P[order[i]], bf = busanFri(sun);
    for (const svc of SUN4) {
      put(b, 'slots', { id: slotId(sun, svc, 'preach'), who: ['pdemoP'] }, by, now);
      put(b, 'slots', { id: slotId(sun, svc, 'offer'), who: [(i + (svc === 'sun2' || svc === 'll' ? 1 : 0)) % 2 ? P[0] : P[5]] }, by, now);
    }
    put(b, 'slots', { id: slotId(sun, 'sun2', 'lead'), who: [P[[1, 4, 1, 4, 5][i % 5]]] }, by, now);
    put(b, 'slots', { id: slotId(sun, 'll', 'lead'), who: [i % 3 === 0 ? 'pdemoL' : P[[4, 3, 3, 5, 1][i % 5]]] }, by, now);
    put(b, 'slots', { id: slotId(svcDate(sun, 'fri'), 'fri', 'preach'), who: i % 3 === 1 ? [] : [P[(i + 2) % 8]], txt: i % 3 === 1 ? '초청 강사' : '' }, by, now);
    put(b, 'slots', { id: slotId(svcDate(sun, 'fri'), 'fri', 'offer'), who: [P[1]] }, by, now);
    put(b, 'slots', { id: slotId(svcDate(sun, 'wed'), 'wed', 'preach'), who: [P[i % 2 ? 0 : 3]] }, by, now);
    put(b, 'slots', { id: slotId(svcDate(sun, 'wed'), 'wed', 'offer'), who: [P[5]] }, by, now);
    put(b, 'visits', { id: visitId(sun), who: [w], days: bf ? '금토일' : '토일', lead: { fri: bf ? { m: i % 2 === 0 ? 'staff' : 'relay' } : null, sun: i % 3 === 1 ? { m: 'lay', p: 'pdemoL' } : i % 3 === 2 ? { m: 'relay' } : { m: 'staff' }, ll: i % 2 === 1 ? { m: 'staff' } : i % 3 === 0 ? { m: 'relay' } : { m: 'lay', p: 'pdemoL' } },   // 지어낸 성도 인도자가 분당 LL 인도를 맡는 주(i % 3 === 0)와 겹치지 않게
      stay: i < 6 ? [{ kind: 'hotel', name: i % 2 ? '호텔 가' : '호텔 나', status: 'done', nights: bf ? 2 : 1, cost: 100000, cancelBy: addDays(sun, -4) }] : i === 6 ? [{ kind: 'home', name: '성도 가정 1', status: 'ask', for: '여' }, { kind: 'hotel', name: '호텔 B', status: 'done', for: '남' }] : [],
      travel: i === 2 ? [{ dir: 'down', mode: 'KTX', time: '토 14:38' }, { dir: 'up', mode: 'KTX', time: '주일 19:10' }] : [],
      mates: i === 2 ? [{ n: '류하은' }, { n: '임서진' }] : i === 6 ? [{ n: '남궁별(기타)' }] : i === 4 ? [{ n: '도하율', p: 'pdemoL' }] : [],
      meet: i === 3 ? { k: 'new', who: '서다온', n: 2 } : i === 5 ? { k: 'bapt', n: 3 } : { k: 'dept', g: ['청년셀', '기타', '장년셀', '장년셀'][i % 4], memo: ['', '희남셀', '여장년', '남장년'][i % 4] }, note: '',
      issues: i === 2 ? [{ cat: '예배팀', text: '건반 반주자 부재 — 분당에서 한 명 동행' }] : [] }, by, now);
    if (nthOf(sun) === 1) put(b, 'marks', { id: markId(sun), tags: ['성찬주'] }, by, now);
  }
  put(b, 'marks', { id: markId(addDays(sun0, 7)), tags: ['극동방송'], note: '동행 스텝 필요' }, by, now);
  // 일부러 하나 겹치게: 이번 주 부산 가는 사람이 분당 2부 헌금에도 (겹침 검사가 빨갛게 잡는다)
  put(b, 'slots', { id: slotId(sun0, 'sun2', 'offer'), who: [P[order[2]]] }, by, now);
  return b;
}

if (DEMO) S.book = demoBook();

renderShell();
fbStart.catch(() => {});

rpBack();   // 알림을 누르고 들어왔을 때 (1123-B B4)
