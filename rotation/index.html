<!DOCTYPE html>
<!-- 교역자 로테이션 v. 26-1118-9 — 부산 방문 순번 · 분당 예배 자리 독립 앱 (rotation/ → sweeter.my/rotation/) · R8b 내 일정(다음 차례 · 부산 준비 · 8주 표) · Aa 내 이름 모양 · 첫 화면 정하기 · R9a 예약 화면 사진에서 숙소 채우기 · R9b 메일에서 숙소 예약 찾기 · R12 A 부산 인도 세 갈래(교역자 · 성도 · 중계) · R12 C Monday 주일 광고(HB 카톡 양식 · C4a 카드형 판 · 묶음째 Monday 글 · 상영 말풍선 · C4b 부산 상영 계정 저장 · 경고 · B 인도 싣기 · 내보내기 새 판) · 1116-2 C 숙소 알약(끌어 순서 · 꾹 눌러 고침) · 호텔 / 성도님 댁 상태 · 숙소 쓰는 사람 · 1117-Z 2 알림 판(HB 만 · 두 달 미정 · 갈래 알약 · 넓으면 옆 기둥 · 접기) · 1117-Z 3 메뉴 세 탭(보기 · 계정 · 개발) · 부산 탭 지난 일정 한 달씩 · 해 가로띠 · 1117-Z 4 부산 광고 판 전달용 텍스트(고친 글 공통) · 아래 오른쪽 줄 -->
<html lang="ko">
<head>
<meta charset="utf-8">

<script>
// ⚠️ 집은 sweeter.my/rotation/ 하나다. 깃헙 페이지가 block7.my/rotation/ 에도 같은 파일을 내보내므로 넘긴다.
if (/^(www\.)?block7\.my$/.test(location.hostname)) {
  location.replace('https://sweeter.my/rotation/' + location.search + location.hash);
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* 색은 '예배 · 캠퍼스' 를 뜻한다 (HB 11/14): 부산 = 초록 · 분당 주일 = 주황 · 금요 = 보라 · 수요 = 파랑 · 화요(옛) = 회청.
   겹침 = 빨강(꽉 찬 바탕), 확인 거리 = 노랑(점선 테두리 — 주황 주일과 헷갈리지 않게 바탕을 칠하지 않는다). */
:root{
  --bg:#f7f6f2; --paper:#ffffff; --s1:#f2f1ec; --s2:#e9e8e2; --line:#e3e2dc; --line2:#cfcec6;
  --tx:#1d2128; --tx2:#59606b; --tx3:#8a9099;
  --bs:#2e8a57; --bs-soft:rgba(46,138,87,.11); --sun:#d27420; --sun-soft:rgba(210,116,32,.11);
  --fri:#7b4fc4; --fri-soft:rgba(123,79,196,.10); --wed:#2f6fb5; --wed-soft:rgba(47,111,181,.10); --tue:#647387; --tue-soft:rgba(100,115,135,.10);
  --pg:var(--sun); --pg-soft:var(--sun-soft);
  --sp:#b0543a; --sp-soft:rgba(176,84,58,.11);   /* 분당 특별예배 (1116-2 E) — 벽돌빛 */
  --lead:#b2479c; --lead-soft:rgba(178,71,156,.10); --hl:rgba(236,178,40,.26); --hl2:rgba(236,178,40,.11);   /* 예배인도 — 금요 보라와 다른 자줏빛 바이올렛 (HB 11/14) */
  --ok:#2e7d5b; --ok-soft:rgba(46,125,91,.11); --warn:#a87a06; --warn-soft:rgba(168,122,6,.13);
  --ll:#a8800f; --ll-soft:rgba(190,146,20,.15);   /* 라이프라인 — 노랑 ~ 황토 (HB 11/16) */
  --bad:#b83a3a; --bad-soft:rgba(184,58,58,.11); --on:#fff;
  --adv-band:rgba(47,111,181,.13); --adv-tx:#2a5f9c; --ads-band:rgba(236,178,40,.24); --ads-tx:#8a6406;   /* 광고 판 카드 머리 — 영상 = 옅은 파랑 · 구두 = 옅은 노랑 (HB 11/16) */
  --sans:'IBM Plex Sans KR','Pretendard',-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121417; --paper:#1a1d21; --s1:#1e2125; --s2:#262a2f; --line:#2c3036; --line2:#3d424a;
  --tx:#e6e8eb; --tx2:#a6adb6; --tx3:#7a818a;
  --bs:#6cc596; --bs-soft:rgba(108,197,150,.14); --sun:#f0a35c; --sun-soft:rgba(240,163,92,.14);
  --fri:#b393ec; --fri-soft:rgba(179,147,236,.14); --wed:#7fb0e8; --wed-soft:rgba(127,176,232,.14); --tue:#9aa8bb; --tue-soft:rgba(154,168,187,.13); --lead:#e58fd0; --lead-soft:rgba(229,143,208,.14); --sp:#eb9a82; --sp-soft:rgba(235,154,130,.14); --hl:rgba(240,196,90,.22); --hl2:rgba(240,196,90,.09);
  --ok:#7fc9a5; --ok-soft:rgba(127,201,165,.13); --warn:#e2b74a; --warn-soft:rgba(226,183,74,.14); --ll:#e7c25c; --ll-soft:rgba(231,194,92,.15);
  --bad:#ea8080; --bad-soft:rgba(234,128,128,.13); --on:#121417; color-scheme:dark;
  --adv-band:rgba(127,176,232,.16); --adv-tx:#9cc3ef; --ads-band:rgba(240,196,90,.15); --ads-tx:#e8c46a}}
:root[data-theme="dark"]{
  --bg:#121417; --paper:#1a1d21; --s1:#1e2125; --s2:#262a2f; --line:#2c3036; --line2:#3d424a;
  --tx:#e6e8eb; --tx2:#a6adb6; --tx3:#7a818a;
  --bs:#6cc596; --bs-soft:rgba(108,197,150,.14); --sun:#f0a35c; --sun-soft:rgba(240,163,92,.14);
  --fri:#b393ec; --fri-soft:rgba(179,147,236,.14); --wed:#7fb0e8; --wed-soft:rgba(127,176,232,.14); --tue:#9aa8bb; --tue-soft:rgba(154,168,187,.13); --lead:#e58fd0; --lead-soft:rgba(229,143,208,.14); --sp:#eb9a82; --sp-soft:rgba(235,154,130,.14); --hl:rgba(240,196,90,.22); --hl2:rgba(240,196,90,.09);
  --ok:#7fc9a5; --ok-soft:rgba(127,201,165,.13); --warn:#e2b74a; --warn-soft:rgba(226,183,74,.14); --ll:#e7c25c; --ll-soft:rgba(231,194,92,.15);
  --bad:#ea8080; --bad-soft:rgba(234,128,128,.13); --on:#121417; color-scheme:dark;
  --adv-band:rgba(127,176,232,.16); --adv-tx:#9cc3ef; --ads-band:rgba(240,196,90,.15); --ads-tx:#e8c46a}
*{box-sizing:border-box}
/* ⚠️ 페이지는 옆으로 움직이지 않는다 (아이폰에서 탭을 밀다 왼쪽이 잘린 채 남던 일, 11/14) */
html{overflow-x:hidden}   /* ⚠️ touch-action 을 여기 걸면 표 안 가로 스크롤까지 막힌다(11/14) — 옆 밀림은 overflow · 스크롤 되돌리기로 막는다 */
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.6 var(--sans);word-break:keep-all;overflow-wrap:anywhere;overflow-x:clip;
  padding:0 max(16px,env(safe-area-inset-right)) 80px max(16px,env(safe-area-inset-left));-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--wed)}
.wrap{max-width:680px;margin:0 auto}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 8px) 0 0}
.topline{display:flex;align-items:center;gap:8px;min-height:36px}
.topline h1{font-size:19px;font-weight:500;margin:0;flex:1;letter-spacing:-.2px;display:flex;align-items:center;gap:8px;min-width:0}
.topline h1 img{width:24px;height:24px;border-radius:6px}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;color:var(--tx2);border-radius:10px;flex:none}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;margin:8px 0 0;border-bottom:1px solid var(--line);position:relative}
.tab{flex:1 1 0;min-width:0;padding:9px 4px 10px;font-size:14px;color:var(--tx3)}
.tab.on{color:var(--tx);font-weight:500}
.tabbar{position:absolute;bottom:-1px;left:0;height:2px;background:var(--tx);border-radius:2px;transition:transform .3s cubic-bezier(.22,.8,.24,1),width .3s cubic-bezier(.22,.8,.24,1)}
.stage{overflow:hidden}
#panel{will-change:transform,opacity;padding-top:4px}
.note{color:var(--tx2);font-size:13px;margin:10px 2px}
.muted{color:var(--tx3)} .small{font-size:13px} .tiny{font-size:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card .h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.card .h b{font-weight:500;font-size:15px}
.spacer{flex:1}
.kv{margin:0;display:grid;grid-template-columns:78px 1fr;gap:2px 10px;font-size:14px}
.kv dt{color:var(--tx3)} .kv dd{margin:0;min-width:0}
.tapline{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:baseline;width:100%;text-align:left;padding:5px 0;font-size:14px;border-radius:8px}
.tapline > span:first-child{color:var(--tx3)}
.tapline .chev{color:var(--line2);font-size:13px}
.tapline.bad > span:nth-child(2){color:var(--bad)}
.tapline.warn > span:nth-child(2){color:var(--warn)}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--s2);color:var(--tx2);white-space:nowrap;vertical-align:1px}
.pill.pg{background:var(--s2);color:var(--tx2)} .pill.bs{background:var(--bs-soft);color:var(--bs)} .pill.fri{background:var(--fri-soft);color:var(--fri)} .pill.lay{background:var(--wed-soft);color:var(--wed)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}
.dot.pg,.dot.sun{background:var(--sun)} .dot.bs{background:var(--bs)} .dot.fri{background:var(--fri)} .dot.wed{background:var(--wed)} .dot.tue{background:var(--tue)}
.nav{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 0 8px}
.nav b{font-weight:500;min-width:150px;text-align:center}
.nav button{width:36px;height:36px;border-radius:10px;color:var(--tx2);font-size:18px}
.nav .now{font-size:12px;color:var(--tx3);width:auto;padding:0 6px}
.nav{position:relative}
.nav .txtbtn{position:absolute;right:0;top:50%;transform:translateY(-50%);width:auto;height:auto;font-size:13px;white-space:nowrap;color:var(--tx2)}
/* 이번 주 — 모양 고르기(카드 A · 한 장 표 C) · R10 */
.nav .wseg{position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;gap:1px;padding:2px;border-radius:9px;background:var(--s2)}
.nav .wseg button{width:27px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--tx3)}
.nav .wseg button[aria-pressed="true"]{background:var(--paper);color:var(--tx)}
.wseg svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.4}
.wseg button[aria-pressed="true"] svg{fill:currentColor}
@media (max-width:430px){.nav b{min-width:128px}}
.bsrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 8px;width:100%;text-align:left;margin-top:7px;padding:8px 10px;border-radius:10px;background:var(--bs-soft);font-size:14px}
.bsrow > b{color:var(--bs);font-weight:600}
/* 한 장 표 제목 — 옅은 머리 칸 (R11 '라') */
.card .wh{margin:-12px -14px 10px;padding:8px 14px;border-radius:13px 13px 0 0;display:flex;align-items:center;gap:8px}
.card .wh b{font-weight:600;font-size:15px;letter-spacing:.01em}
.card .wh.sun{background:var(--sun-soft)} .card .wh.sun b{color:var(--sun)}
.card .wh.bs{background:var(--bs-soft)} .card .wh.bs b{color:var(--bs)}
.wstrip .fr{color:var(--fri);font-weight:500} .wstrip .now.fr{color:var(--fri)}
/* 맡은 것 알약 (R11 안 3) */
.lchips{display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:1px}
.wv .lchips{display:flex;margin-top:5px}
.mx8 .f .lchips{display:flex;flex-direction:column;gap:2px;margin-top:3px;max-width:100%} .mx8 .f .lchip{font-size:10px;line-height:1.35;padding:1px 4px;white-space:normal;word-break:keep-all}
.lchip{font-size:12px;line-height:1.6;border-radius:6px;padding:0 7px;white-space:nowrap}
.lchip.fri{background:var(--fri-soft);color:var(--fri)} .lchip.sun{background:var(--sun-soft);color:var(--sun)}
.lchip.ll{background:var(--ll-soft);color:var(--ll)} .lchip.lay{background:var(--s2);color:var(--tx2)}
.lchip.relay{background:none;color:var(--tx3);box-shadow:inset 0 0 0 1px var(--line2)}   /* 중계 — 인도자 없음 (R12 A) */
.lchip.ev{background:var(--bs-soft);color:var(--bs)} .lchip.none{background:none;color:var(--tx3);box-shadow:inset 0 0 0 1px var(--line2);border-radius:6px}   /* 더한 예배(1116-2 D): 교역자 인도 = 부산 초록 · 인도 미정 = 옅은 테두리 */
.pill.ttl{background:var(--bs);color:var(--paper);font-weight:500}
.dot.sp{background:var(--sp)} .gchip.sp,.cx.sp,.tag2.sp{background:var(--sp-soft);color:var(--sp)} .g-sp{--gc:var(--sp)} table.wtab th.g-sp b{color:var(--sp)} table.mx8 .f.sp{background:var(--sp-soft);color:var(--sp)}
.spech{display:flex;width:100%;text-align:left} .card.rest .tapline{opacity:.45} .restnote{font-size:13px;color:var(--tx3);padding:2px 0 4px}   /* 부산 일정 이름 (성탄 · 송구영신 · 특별예배) */
.evbox{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px;background:var(--paper)}
.evbox .evtop{display:flex;align-items:center;justify-content:space-between}
.evlist{display:grid;gap:3px} .evlist .evd{color:var(--tx3);font-size:12px;font-variant-numeric:tabular-nums;margin-right:4px}
.ldrow{display:grid;grid-template-columns:104px 1fr;align-items:center;gap:6px 8px;margin-top:10px}
.ldn{font-size:13px;font-weight:500;line-height:1.3} .ldn .tiny{display:block;font-weight:400} .ldn.fri{color:var(--fri)} .ldn.sun{color:var(--sun)} .ldn.ll{color:var(--ll)}
.ldsub{grid-column:2} .tg.busy{color:var(--bad)}
.llc,table.wtab small.llc{color:var(--ll)}
.tg.sunb[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--on)}
.tg.llb[aria-pressed="true"]{background:var(--ll);border-color:var(--ll);color:var(--on)}
.card .h.hw{flex-wrap:wrap;row-gap:2px} .card .h.hw > *{white-space:nowrap}
.bsrow .chev{color:var(--bs)}
/* 1117-G: 분당 표 — 줄 = 자리, 칸 = 예배 (부산 띠와 같은 결: 날짜 머리 가운데, 요일 위 · 날짜 아래) */
.wtab-x{overflow-x:auto}
table.wtab{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
table.wtab thead th{font-weight:400;text-align:center;padding:0 4px 6px;vertical-align:bottom}
table.wtab thead th:first-child{width:40px}
table.wtab thead th b{display:block;font-weight:600;font-size:13px} table.wtab thead th small{font-size:12px;font-variant-numeric:tabular-nums}
table.wtab td{border-top:1px solid var(--line);padding:8px 4px;vertical-align:top;text-align:center}
table.wtab td.wr{text-align:left;font-size:12px;color:var(--tx3);padding-top:10px}
table.wtab td .wc{text-align:center} table.wtab td .wc+.wc{margin-top:6px}
table.wtab small{display:block;font-size:11.5px;color:var(--tx3);font-weight:400}
table.wtab th.g-sun b{color:var(--sun)} table.wtab th.g-wed b{color:var(--wed)} table.wtab th.g-fri b{color:var(--fri)} table.wtab th.g-tue b{color:var(--tue)}
.wc{display:block;width:100%;text-align:left;padding:1px 0 3px;border-radius:6px;overflow-wrap:anywhere}
.wc.bad{color:var(--bad)} .wc.warn{color:var(--warn)}
.wstrip{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;text-align:center;font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums}
.wstrip .su{color:var(--sun)} .wstrip .now{color:var(--tx);font-weight:700}
.wstrip.bars{margin:4px 0 8px;row-gap:3px}
.wbar{height:24px;border-radius:7px;background:var(--bs);color:var(--on);font-size:12px;font-weight:500;padding:0 8px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbar.dim{background:var(--bs-soft);color:var(--bs)}
.wv{display:grid;grid-template-columns:78px 1fr;gap:10px;width:100%;text-align:left;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.wv > span{min-width:0} .wv small{display:block;font-size:12px;color:var(--tx3);margin-top:1px}
.banner{background:var(--s1);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--tx2);margin:10px 0}
.banner button{color:var(--wed);font-weight:500}
.banner.bsbar{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--warn-soft);color:var(--warn)}
.banner.bsbar b{display:block;font-weight:600;color:var(--warn)} .banner.bsbar small{display:block;font-size:12px;opacity:.85;margin-top:1px} .banner.bsbar .chev{margin-left:auto;color:var(--warn)}
.alerts{display:grid;gap:6px;margin:8px 0 10px}
/* 알림 판 (1117-Z 2) — 좁을 때 B(갈래 알약 + 목록) · 넓을 때(1000px 넘게) 오른쪽 옆 기둥. HB 만 */
.apanel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:6px 10px;margin:10px 0 4px;display:flex;flex-direction:column;gap:6px;box-sizing:border-box}
.apanel.fold{gap:0}
.ahead{display:flex;align-items:center;gap:8px;min-height:36px;width:100%;text-align:left;padding:0 2px}
.ahead > b{font-size:14px;font-weight:600}
.ahead .tiny{font-size:12px}
.ahead .afl{margin-left:auto;font-size:12px;color:var(--tx2);white-space:nowrap}
.acnt{font-size:12px;border-radius:6px;padding:1px 7px;background:var(--s1);color:var(--tx2);white-space:nowrap}
.acnt.red{background:var(--bad);color:var(--on);font-weight:600}
.achips{display:flex;gap:6px;flex-wrap:wrap}
.achip{display:flex;align-items:center;gap:6px;min-height:34px;padding:3px 10px;border-radius:17px;font-size:13px;background:var(--s1);color:var(--tx2)}
.achip i{font-style:normal;min-width:18px;text-align:center;border-radius:9px;font-size:11px;font-weight:600;padding:0 5px;background:var(--ac);color:var(--on)}

<!-- 가져오기 파일 칸은 메뉴 밖에 **한 번만** 둔다: 메뉴 안에 두면 파일 창이 열리는 사이 메뉴가 다시 그려져
     칸이 바뀌고, 고른 파일이 사라진 칸으로 가 아무 일도 안 일어났다 (11/14 HB 맥미니). -->
<input type="file" id="imp-file" accept=".json,application/json" hidden>
<input type="file" id="img-file" accept="image/*" hidden>

<script id="rotation-core">
// 교역자 로테이션 — 화면 없이 도는 판단. tests/test_rotation.js 가 이것만 떼어 시험한다.
// ⚠️ 여기 이름 · 숙소는 넣지 말 것(공개 저장소). 실제 자료는 HB 파이어베이스 rota/{uid} 에만 산다.
//
// 자료 모양(book) — 1114-R '정해 둔 것':
//   people : 교역자 · 성도 인도자 { id, name, kind?:'lay', roles:['preach','offer','lead','busan'], no:['sun1|preach', …], at, by, del? }
//            kind 'lay' = 교역자가 아니라 성도로서 예배인도를 하는 분(HB 11/14). 없으면 교역자.
//            away:[{from,to,note}] = 안 되는 날(부재, R5) · pin:['성찬주'] = 그 표시가 있는 주에는 분당에 있어야 함(고정 조건, R5)
//            no = 그 일을 맡아도 안 들어가는 예배(HB 11/14). 없으면 모든 예배 — 예전 자료도 그대로 '모두'.
//   slots  : 분당 예배 자리 (옛 이름 판교)   { id:'날짜|예배|역할', date, svc, role, who:[사람 id], txt:'담임목사님' 같은 글, lock, at, by, del? }
//   visits : 부산 방문       { id:'v|날짜', date, who:[사람 id], days:'금토일', lead?:{ fri|sun|ll: { m, p? } }, stay:[], travel:[], mates?:[{ n, p? }], meet?:{ k, … }, note, at, by, del? }
//            동행 mates · 모임 meet 은 1116-2 B 부터 — 그 전의 글 세 칸(staff 동행 · group 주일모임 · edu 교육)은 읽을 때 옮긴다(normVisit).
//            날짜는 보통 주일이지만 성탄(목) · 송구영신(수)처럼 다른 날도 된다(시트 2025-12 실제). 한 주에 방문이 여럿일 수 있다.
//   marks  : 그 주 교회 일정 { id:'m|주일', sun, tags:['성찬주'], note, at, by, del? }
//   opts   : 고르는 목록 { id:'o|종류|…', type:'stay'(숙소)|'mode'(교통편)|'cat'(특이사항 갈래), name, kind?, cost?(숙소 1박 평소 금액), ord, at, by, del? }
//            목록이 한 번도 손대지 않은 종류는 저장하지 않고 기본값을 보여 준다(optList). 처음 고칠 때 기본값을 정해진 id 로 적는다(ensureOpts).
//   visits[].issues : 특이사항 [{ cat:'예배팀', text }] — 메모(note)와 따로 (HB 11/14). 나중에 교회 보고서의 부산 보고서를 여기에 잇는다(R7).
// 모든 줄은 at(고친 때) · by(누가 — 처음엔 HB, R6 부터 교역자 각자)를 갖는다. 지우면 내용을 비우고 del:true 만 남긴다(표지).
// 부산 교역자는 visits 한 곳에만 적는다. 예배 구성의 '부산 교역자' 줄은 visits 에서 읽어 보여 준다.
const APP_VERSION = 'v. 26-1118-9';
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
// 보여 줄 때 일요일 **하루만** 쓸 땐 '주일' (HB 11/16) — '토일' · '금토일' 처럼 묶을 땐 '일' 그대로(1116-2 A). 자료(days 글자 · 교통 시각)는 '일'
const DOWS = DOW.map(c => (c === '일' ? '주일' : c));
function dayS(s) { s = String(s || ''); return s === '일' ? '주일' : s; }
function timeS(t) { return String(t || '').replace(/^일/, '주일'); }
// 예배 — off: 그 주 주일에서 며칠 뒤인가. ⚠️ 모든 주간은 **주일에 시작**한다(HB 11/14): 주일 → 화 → 수 → 금 → 토
const SVC = {
  sun1: { label: '1부', short: '1부', off: 0 }, sun2: { label: '2부', short: '2부', off: 0 }, sun3: { label: '3부', short: '3부', off: 0 },
  ll: { label: '라이프라인', short: 'LL', off: 0 }, fri: { label: '금요예배', short: '금요', off: 5 }, wed: { label: '수요예배', short: '수요', off: 3 },
  tue: { label: '화요예배', short: '화요', off: 2, past: true },   // 2026-05 까지 (그 뒤 수요예배로) — 옛 기록을 담으려고만 둔다
};
const SUN4 = ['sun1', 'sun2', 'sun3', 'll'];
const ROLE = { preach: '설교', offer: '헌금인도', lead: '예배인도', notice: '광고' };   // notice = WN 광고(매월 마지막 금요일, HB 11/14)
// 시트 '예배 구성' 에 실제 있는 칸만 (예배 × 역할)
const GRID = [
  ['sun1', 'preach'], ['sun2', 'preach'], ['sun3', 'preach'], ['ll', 'preach'],
  ['sun1', 'offer'], ['sun2', 'offer'], ['sun3', 'offer'], ['ll', 'offer'],
  ['sun2', 'lead'], ['ll', 'lead'],
  ['fri', 'preach'], ['fri', 'offer'], ['fri', 'notice'],
  ['wed', 'preach'], ['wed', 'offer'],
  ['tue', 'preach'], ['tue', 'offer'],
];
const PROLES = { preach: '설교', offer: '헌금', lead: '예배인도', busan: '부산' };
// 일마다 있는 예배 (시트 '예배 구성' 칸 그대로)
const ROLE_SVCS = { preach: ['sun1', 'sun2', 'sun3', 'll', 'fri', 'wed'], offer: ['sun1', 'sun2', 'sun3', 'll', 'fri', 'wed'], lead: ['sun2', 'll'] };
const DAYS = ['토일', '토일월', '금토일', '금토일월', '목금토일', '수목', '목'];
const MARK_TAGS = ['성찬주', '극동방송', '종려주일', '부활주일', '성탄', '송구영신'];
/* 숙소 상태 (1116-2 C, HB 11/16) — 호텔과 성도님 댁이 다르다. 값은 둘이 같은 말: '' 미정 · pre 예약 전 / 대화 전 · ask 대화 중(댁만) · done 예약 완료 / 대화 완료 · cancel 취소.
   옛 값('' · ask · done · cancel)은 그대로 읽힌다 — 다만 호텔의 ask(예전 글자 '대화 중')는 '예약 전'(pre)으로 옮겨 읽는다(normStay). */
const STAY_ST = {
  hotel: [['', '미정'], ['pre', '예약 전'], ['done', '예약 완료'], ['cancel', '취소']],
  home: [['', '미정'], ['pre', '대화 전'], ['ask', '대화 중'], ['done', '대화 완료'], ['cancel', '취소']],
};
function stayStOf(kind, status) { const l = STAY_ST[kind === 'home' ? 'home' : 'hotel']; if (l.some(x => x[0] === status)) return status; return status === 'ask' ? 'pre' : ''; }
function stayStName(s) { const k = s && s.kind === 'home' ? 'home' : 'hotel', st = stayStOf(k, s && s.status); return STAY_ST[k].find(x => x[0] === st)[1]; }
// 숙소 쓰는 사람 (1116-2 C) — 동행 스텝이 있을 때만 묻는다. 값은 예전 그대로('' · 남 · 여)
const STAY_FOR = [['', '함께'], ['남', '남 숙소'], ['여', '여 숙소']];
function stayForAsk(v, i, d) { return !!(((v && v.mates) || []).length || (d && d.for) || ((v && v.stay) || []).some((s, k) => k !== i && s.status !== 'cancel')); }
// 성도님 댁은 취소 기한 · 예약 화면이 없다 — 화면에서 감추고, 알림 · 표에서도 호텔 것만 본다
function stayHotel(s) { return !!s && s.kind !== 'home'; }

// 칸 이름 — 주일은 '1부 헌금인도', 주중은 짧게 '수요 헌금'(줄바꿈 안 되게, HB 11/14), 마지막 금요일 광고는 'WN 광고'
function slotLabel(svc, role) {
  if (isSpec(svc)) return '특별 ' + (role === 'lead' ? '예배인도' : role === 'offer' ? '헌금' : ROLE[role]);   // 이름은 slotLabelB(책을 아는 곳)
  if (role === 'notice') return 'WN 광고';
  if (role === 'offer' && SVC[svc].off !== 0) return SVC[svc].short + ' 헌금';
  return SVC[svc].short + ' ' + (role === 'lead' ? '예배인도' : ROLE[role]);
}
// 부산 금요예배 이름 — 시트의 금1 · 금2 · 금3 (HB 11/14: 풀네임으로)
const FRI_NAMES = ['', 'AWAKE', 'REVIVED', 'ENCOUNTER'];
function friName(sun) { return FRI_NAMES[busanFri(sun)] || ''; }
// 그 달의 마지막 금요일인가 (WN 광고 칸이 있는 날)
function isLastFri(ymd) { return dowOf(ymd) === 5 && addDays(ymd, 7).slice(0, 7) !== ymd.slice(0, 7); }

/* ---- 분당 특별예배 (1116-2 E, HB 11/17) ----
   성탄 전야(목 저녁) · 성탄(금 오전) · 송구영신처럼 정해진 예배(주일 · 수 · 금) 밖의 분당 예배. 예배 하나 = specs 한 줄:
   { id: 'x|날짜|k'(k = 그 날 몇 번째, 1~9), date, t?: 때(새벽 · 오전 · 오후 · 저녁 · 'HH:MM'), n: 예배 이름, roles: 자리(설교 · 헌금 · 예배인도 중), rest?: 그 날 정해진 수요 · 금요예배는 쉼 }.
   자리 사람은 보통 자리(slots)와 같은 모양 — id '날짜|xk|역할'(svc = 'x1' ~ 'x9'). 그래서 고르기 판 · 겹침(부산에 있는 날) · 내 일정 · 사람 × 주 · 월 달력이 그대로 따라온다.
   예배를 지우면 그 자리들도 지운다(dropSpec). 고치는 것은 HB 만(교역자 칸에 없음). */
const SPEC_ROLES = ['preach', 'offer', 'lead'], SPEC_NAMES = ['성탄 전야 예배', '성탄 예배', '송구영신 예배'];
function isSpec(svc) { return /^x[1-9]$/.test(String(svc || '')); }
// SVC 를 찾을 때 특별예배도 깨지지 않게 — 정해진 예배가 아니면 '특별'
function svcI(svc) { return SVC[svc] || { label: '특별예배', short: '특별', off: -1, spec: true }; }
function specId(date, k) { return 'x|' + date + '|' + k; }
function normSpec(o) {
  if (!o || typeof o !== 'object') return null;
  const [x, date, k] = String(o.id || '').split('|'); if (x !== 'x' || !isYmd(date) || !/^[1-9]$/.test(k || '')) return null;
  const b = base(o); b.date = date; b.k = +k; if (b.del) return b;
  b.n = str(o.n, 40); if (!b.n) return null;
  const t = str(o.t, 10); if (t) b.t = t;
  b.roles = Array.isArray(o.roles) ? SPEC_ROLES.filter(r => o.roles.includes(r)) : ['preach', 'offer'];
  if (o.rest && [3, 5].includes(dowOf(date))) b.rest = true;   // 그 날 정해진 수요 · 금요예배는 쉼
  return b;
}

// 보기마다 내보낼 글 배열 (R12 B). view = 'all'(이번달 전체 = 시트 모양) · VIEWS 의 여섯. o = { today, pid(내 일정), grid(내 일정 8주 표), calf(월 달력 갈래), ext(예배별 '한 주 더') }

// 월 달력 필터(R5b): 그 날 그 갈래(설교 · 헌금 · 예배인도 · 부산)의 줄들 — 주일 네 예배는 예배마다 한 줄

    .sort((a, b) => GRID.findIndex(g => g[0] === a.svc && g[1] === a.role) - GRID.findIndex(g => g[0] === b.svc && g[1] === b.role))
    .filter(s => !isSpec(s.svc) || specOf(book, s.date, s.svc)).map(s => ({ label: s.role === 'notice' ? 'WN' : svcI(s.svc).short, text: whoText(book, s.who, s.txt, pm), id: s.id, grp: s.role === 'lead' ? 'lead' : svcGroup(s.svc) }));

// 금요 · 수요 표의 날들(R5b): 그 달 안의 그 요일만 + 앞으로 before 주, 뒤로 after 주

// 표에서 칠할 칸(HB 11/14): 오늘 = 'tdy', 오늘 뒤 엿새 안 = 'soon', 그 밖 = ''

/* ---- 보기 틀(R4b)이 쓰는 읽기 ---- */
const TAGCH = { preach: '설', offer: '헌', lead: '인', notice: '광' };
const svcGroup = (svc) => (SUN4.includes(svc) ? 'sun' : isSpec(svc) ? 'sp' : svc);   // 특별예배는 한 무리 'sp' (1116-2 E)   // 주일 네 예배는 한 무리 (색 · 묶음)
// ④ 사람 × 주: 그 주(주일~토)에 그 사람이 맡은 일 — 주일 네 예배의 같은 일은 하나로

  }
  for (const v of live(book.visits)) if (v.date >= sun && v.date <= sat && v.who.includes(pid)) out.push({ g: v.id, t: '부', svc: 'bs', id: v.id, date: v.date });
  const ro = { 설: 0, 헌: 1, 광: 2, 인: 3, 부: 4 };   // 같은 날이면 설교 → 헌금 → 인도 → 부산 (시트 순서)

// ③ 내 일정: 그 사람이 맡은 것 날짜순 — 같은 날 같은 일의 주일 예배들은 한 줄('1부 · 3부 헌금')

// ⑤ 월 달력: 그 날의 자리(예배마다 설교 먼저)와 그 날 부산에 머무는 방문

/* ---- 예약 읽기 (R9 — HB 11/15 '3+1') ----

function bookingPrompt(src) {

    '칸: {"hotel": 숙소 이름(한국어 이름이 보이면 한국어), "checkIn": "YYYY-MM-DD", "checkOut": "YYYY-MM-DD", "total": 결제 총액 숫자(통화 기호 · 쉼표 빼고), "currency": "KRW" 같은 세 글자,',
    ' "ref": 예약번호, "cancelBy": 무료 취소 마감 "YYYY-MM-DD"(없으면 ""), "cancelAt": 그 시각 "HH:MM"(없으면 ""), "nofree": 환불 불가면 true, "cancelled": 예약이 취소된 메일 · 화면이면 true}',

    currency: /^[A-Z]{3}$/.test(String(o.currency || '').trim().toUpperCase()) ? String(o.currency).trim().toUpperCase() : '',
    total: num(typeof o.total === 'string' ? Number(o.total.replace(/[^\d.]/g, '')) : o.total), cancelBy: ymd(o.cancelBy), cancelAt: '', nofree: o.nofree === true, cancelled: o.cancelled === true };
  if (b.cancelBy && /^\d{1,2}:\d\d$/.test(String(o.cancelAt || '').trim())) b.cancelAt = String(o.cancelAt).trim().padStart(5, '0');

// AI 답(글) → 예약 목록. ```json 울타리 · 앞뒤 말이 붙어 와도 [ … ] 또는 { … } 만 떼어 읽는다
function parseBookings(text) {

function bookingNights(bk) { return bk.checkIn && bk.checkOut ? Math.max(1, dayGap(bk.checkIn, bk.checkOut)) : 0; }
// 맞는 방문: 체크인 날이 머무는 날 안(또는 첫날 하루 전)인 방문. 여럿이면 첫날이 가장 가까운 것

const hotelKey = (t) => String(t || '').toLowerCase().normalize('NFC').replace(/[\s·()\-_,.]|호텔|hotel/g, '');
// 초안에 채우기 — 목록에 같은 숙소가 있으면 그 이름으로, 없으면 '새 호텔'. 원화가 아니면 금액은 그대로 둔다(HB 가 적는다)

function adsLinkLabel(url) {

function adsRich(text) {   // ⚠️ 뒤돌아보기 정규식((?<=…))은 옛 아이폰에서 깨진다 — 앞 글자를 함께 잡아 글로 돌린다

  let i = 0, m;

    if (m[1]) {
      const t = /[.,!?;:)\]'"]+$/.exec(m[1]), v = t ? m[1].slice(0, -t[0].length) : m[1];

// 묶음을 날짜(묶음 머리 날짜)별로 — 위가 가장 오래된 날, 같은 날도 이른 것부터 (HB 11/16: 아래로 갈수록 최신)
function adsByDay(notes) {

    const d = days.find(x => x.at === n.at); if (d) d.notes.push(n); else days.push({ at: n.at, notes: [n] });
  });
  return days;
}

  const T4 = [['preach', '설교'], ['offer', '헌금'], ['lead', '예배인도'], ['busan', '부산']];

// 손잡이 끌기 — 칸 높이를 갈래(설교 · 헌금 …)마다 따로 기억
(function calHandle() {
  let y0 = 0, h0 = 0, on = false;
  const start = (y) => { const c = $('#cal .cday:not(.out)') || $('#cal .cday'); if (!c) return; on = true; y0 = y; h0 = c.getBoundingClientRect().height; };
  const move = (y) => { if (!on) return; const nh = Math.max(44, Math.min(420, Math.round(h0 + (y - y0) / 3))); const cal = $('#cal'); if (cal) cal.style.setProperty('--calh', nh + 'px'); };
  const end = () => { if (!on) return; on = false; const cal = $('#cal'); const v = cal && parseInt(cal.style.getPropertyValue('--calh')); if (v) { PREF.calH = Object.assign({}, PREF.calH, { [CALF[PREF.calf] ? PREF.calf : 'preach']: v }); savePref(); } };

// ⑥ 부산 요약 (달 합계 없음 — HB 11/14). 금요예배 이름 열은 요일과 숙소 사이, 보라.

      ${pv ? `<td>${cb_(v, 'cost', cost ? won(cost) : '')}</td><td class="tiny">${cb_(v, 'cancel', cb ? (cbHot ? `<span class="badc">${mdd(cb)}</span>` : mdd(cb)) : nof ? '환불 불가' : '')}</td>` : ''}

}

/* ---------- 화면: 달력표 ----------
   예배별(시트형) = 예배 구성 시트와 같은 배열(다들 익숙한 것이 기본). 주간형 = 주를 가로로. 둘 다 '설교 접기'(빈 칸은 셈하지 않고, 설교자가 모두 같은 주만).
   금요 · 수요 표는 그 달 안의 날만 + 위 · 아래 '한 주 더' (HB 11/14). 칸을 누르면 고르기 판. */
function viewMonth() {
  const suns = monthSundays(S.ym), pm = peopleMap(S.book), today = todayYmd(), thisSun = sunOf(today);
  const plans = suns.map(s => weekPlan(S.book, s));
  const cf = suns.length ? conflictsW(S.book, addDays(suns[0], -7), addDays(suns[suns.length - 1], 13), today) : [], lv = levelMap(cf);
  const mview = VIEWS[PREF.mview] ? PREF.mview : 'sheet', fold = PREF.fold !== false;
  const short = (t) => t.length > 9 ? t.slice(0, 8) + '…' : t;
  const cellAt = (date, svc, role, extra) => { const id = slotId(date, svc, role); if (role === 'notice' && !isLastFri(date)) return `<td class="na"></td>`;
    const s = S.book.slots.find(x => x.id === id && !x.del); const t = s ? whoText(S.book, s.who, s.txt, pm) : '';
    return `<td class="${[lv[id] || '', extra || '', nearCls(date, today)].join(' ').trim()}"><button data-pick="${id}" title="${esc(t)}">${t ? esc(short(t)) : '<span class="muted">·</span>'}</button></td>`; };
  const cell = (p, svc, role, extra) => cellAt(svcDate(p.sun, svc), svc, role, extra);
  const busanCell = (p, rs) => { const vs = p.visits; const t = vs.map(v => whoText(S.book, v.who, '', pm)).filter(Boolean).join(' / ');
    const l = vs.map(v => lv[v.id]).reduce((a, b) => (a === 'bad' || b === 'bad' ? 'bad' : a || b), '');
    const target = vs.find(v => v.date === p.sun) || vs[0];
    return `<td${rs > 1 ? ` rowspan="${rs}"` : ''} class="${[t ? 'bs' : '', l === 'bad' ? 'bad' : '', nearCls(target ? target.date : p.sun, today)].join(' ').trim()}"><button ${target ? `data-visit="${esc(target.id)}"` : `data-newvisit="${p.sun}"`}>${t ? esc(short(t)) : '<span class="muted">+</span>'}</button></td>`; };
  const foldText = (p) => { const g = groupRole(S.book, p, 'preach', SUN4, pm); return g.length === 1 ? g[0].text : ''; };
  const bar = `<div class="mbar"><button class="vbtn" data-act="views">${VIEWS[mview].name} <span class="muted">▾</span></button>
    ${mview === 'mine' ? `<button class="iconbtn${PREF.mgrid ? ' on' : ''}" data-act="mgrid" aria-pressed="${!!PREF.mgrid}" aria-label="8주 한 장 표로 보기" title="8주 한 장 표"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16M15 4v16"/></svg></button>` : ''}
    <span class="spacer"></span>${mview === 'sheet' || mview === 'grid' ? `<button class="txtbtn" data-act="fold">${fold ? '주일설교 펴기' : '주일설교 접기'}</button>` : ''}<button class="txtbtn" data-act="export">내보내기</button>${isStaff() ? '' : '<button class="btn" style="padding:5px 11px;font-size:13px" data-act="auto">자동 배열 제안</button>'}</div>`;
  let body = '';
  if (mview === 'mine') body = bodyMine();
  else if (mview === 'matrix') body = bodyMatrix(lv);
  else if (mview === 'cal') body = bodyCal(lv);
  else if (mview === 'busan') body = bodyBusan(lv);
  else if (mview === 'sheet') {
    const rows = plans.map(p => {
      const hide = fold && preachFold(S.book, p, pm);
      const kinds = hide ? ['offer'] : ['preach', 'offer'], rs = kinds.length;
      return kinds.map((role, i) => `<tr class="${i === rs - 1 ? 'wkend' : ''}">
        ${i === 0 ? `<td class="wk ${nearCls(p.sun, today)}" rowspan="${rs}"><b>${md(p.sun)}</b>${p.mark && p.mark.tags.length ? `<span class="tiny">${esc(p.mark.tags[0])}</span>` : ''}</td>` : ''}
        <td class="kd ${nearCls(p.sun, today)}">${role === 'preach' ? '설교' : '헌금'}</td>
        ${SUN4.map(svc => cell(p, svc, role)).join('')}
        ${i === 0 ? cell(p, 'sun2', 'lead', 'leadc').replace('<td', `<td rowspan="${rs}"`) + cell(p, 'll', 'lead', 'leadc').replace('<td', `<td rowspan="${rs}"`) + busanCell(p, rs) : ''}
      </tr>`).join('');
    }).join('');
    // 금요 · 수요(· 화요): 날짜가 첫 열, 그 달 안의 날만 + 위 · 아래 '한 주 더'
    const ext = S.ext || (S.ext = {});
    // 금요 · 수요(· 화요): 날짜가 첫 열(가운데), 그 달 안의 날만. 첫 줄 위 · 끝 줄 아래 경계선에 걸친 꺾쇠로 한 주씩 펴고 접는다 (HB 11/14)
    const chv = (up) => `<svg viewBox="0 0 24 24"><path d="${up ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6'}"/></svg>`;
    const side = (svc, cls, title) => { if (!svcShown(S.book, svc, suns)) return '';
      const e = ext[svc] || { b: 0, a: 0 }, dates = weekdayRows(S.ym, svc, e.b, e.a), fri = svc === 'fri';
      const edge = (pos) => { const dir = pos === 'top' ? 'b' : 'a', n = e[dir], out = pos === 'top';
        return `<span class="edge ${pos}"><button data-ext="${svc}" data-dir="${dir}" aria-label="한 주 ${out ? '앞' : '뒤'} 펴기">${chv(out)}</button>${n ? `<button data-ext="${svc}" data-dir="${dir}" data-c="1" aria-label="한 주 ${out ? '앞' : '뒤'} 접기">${chv(!out)}</button>` : ''}</span>`; };
      const bcell = (d) => { const vs = busanOn(S.book, d), t = vs.map(v => whoText(S.book, v.who, '', pm)).filter(Boolean).join(' / ');
        return `<td class="${[t ? 'bs' : '', vs.some(v => lv[v.id] === 'bad') ? 'bad' : '', nearCls(d, today)].join(' ').trim()}"><button ${vs.length ? `data-visit="${esc(vs[0].id)}"` : `data-newvisit="${addDays(d, 2)}"`}>${t ? esc(short(t)) : '<span class="muted">·</span>'}</button></td>`; };
      return `<div><h4><span class="dot ${cls}"></span>${title}</h4><div class="tblwrap ext"><table class="tsheet">
      <tr><th class="h-${cls}">날짜</th><th class="h-${cls}">설교</th><th class="h-${cls}">헌금</th>${fri ? `<th class="h-${cls}">WN 광고</th><th class="h-bs">부산</th>` : ''}</tr>
      ${dates.map((d, i) => `<tr class="${d.slice(0, 7) !== S.ym ? 'outm' : ''}"><td class="wk ${nearCls(d, today)}${i === 0 ? ' edged' : ''}">${i === 0 ? edge('top') : ''}<b>${md(d)}</b>${i === dates.length - 1 ? edge('bot') : ''}</td>${cellAt(d, svc, 'preach')}${cellAt(d, svc, 'offer')}${fri ? cellAt(d, svc, 'notice') + bcell(d) : ''}</tr>`).join('')}
    </table></div></div>`; };
    body = `<div class="sheets"><div><h4><span class="dot sun"></span>분당 주일</h4><div class="tblwrap"><table class="tsheet">
      <tr><th class="h-sun">주일</th><th class="h-sun">구분</th><th class="h-sun">1부</th><th class="h-sun">2부</th><th class="h-sun">3부</th><th class="h-sun">LL</th><th class="h-lead">2부 인도</th><th class="h-lead">LL 인도</th><th class="h-bs">부산</th></tr>
      ${rows}</table></div></div>
      ${side('fri', 'fri', '금요예배')}${side('wed', 'wed', '수요예배')}${side('tue', 'tue', '화요예배')}</div>`;
  } else {
    // 주간형: 제목 열은 예배 색(예배별 표의 머리와 같은 색), 칸은 날짜마다 '오늘 · 엿새 안' 을 칠한다. 주일설교를 접으면 네 줄이 통째로 사라진다.
    let prev = '';
    const hc = (svc, role) => (role === 'lead' ? 'h-lead' : SVC[svc].off === 0 ? 'h-sun' : 'h-' + svc);
    const grid = GRID.filter(([svc, role]) => svcShown(S.book, svc, suns) && !(fold && role === 'preach' && SUN4.includes(svc))).map(([svc, role]) => {
      const grp = SVC[svc].off === 0 ? role : svc; const sep = prev && grp !== prev ? ' class="sep"' : ''; prev = grp;
      return `<tr${sep}><td class="rl ${hc(svc, role)}">${esc(slotLabel(svc, role))}</td>${plans.map(p => cell(p, svc, role, role === 'lead' ? 'leadc' : '')).join('')}</tr>`;
    }).join('');
    const foldRow = '';
    const busan = `<tr class="sep"><td class="rl h-bs">부산</td>${plans.map(p => busanCell(p, 1)).join('')}</tr>`;
    const head = `<tr><th></th>${plans.map(p => `<th class="${p.sun === thisSun ? 'soon' : ''}">${weekLabel(p.sun)}${weekFriName(p.sun) ? `<br>${friLabel(addDays(p.sun, 7))}` : ''}${p.mark && p.mark.tags.length ? `<br><span class="tiny">${esc(p.mark.tags[0])}</span>` : ''}${fold && !preachFold(S.book, p, pm) ? `<br><span class="tiny dx">설교 예배마다</span>` : ''}</th>`).join('')}</tr>`;
    body = `<div class="tblwrap"><table class="grid">${head}${foldRow}${grid}${busan}</table></div>`;
  }
  if (mview === 'sheet' || mview === 'grid') body += specTable(lv, today);   // 분당 특별예배 (1116-2 E) — 그 달에 있을 때만
  return `${topBanner()}
  <div class="nav"><button data-month="-1" aria-label="지난 달">‹</button><b>${S.ym.slice(0, 4)}년 ${+S.ym.slice(5, 7)}월</b><button data-month="1" aria-label="다음 달">›</button>
    ${S.ym !== todayYmd().slice(0, 7) ? '<button class="now" data-month="0">오늘</button>' : ''}</div>
  ${bar}${body}
  ${mview === 'sheet' || mview === 'grid' ? `<p class="note tiny">칸을 누르면 사람을 고릅니다. 보라 글씨(AWAKE · REVIVED · ENCOUNTER)는 그 주 부산 금요예배입니다.</p>` : ''}`;
}

/* ---------- 화면: 부산 ---------- */
// 달력표(예배별 · 주간형) 아래 '분당 특별예배' 표 — 날짜 · 때 · 예배 · 설교 · 헌금 · 예배인도. 없는 자리는 회색. HB 는 + 더하기
function specTable(lv, today) {
  const { from, to } = monthRange(S.ym), sps = specsIn(S.book, from, to), pm = peopleMap(S.book), own = !isStaff();
  if (!sps.length) return own ? `<p style="margin:6px 0 0"><button class="txtbtn" data-act="specnew" data-d="${sunOf(from)}">+ 분당 특별예배 더하기 (성탄 · 송구영신 …)</button></p>` : '';
  const cellS = (sp, r) => { if (!sp.roles.includes(r)) return '<td class="na"></td>'; const id = slotId(sp.date, 'x' + sp.k, r), sl = S.book.slots.find(x => x.id === id && !x.del), t = sl ? whoText(S.book, sl.who, sl.txt, pm) : '';
    return `<td class="${[lv[id] || '', nearCls(sp.date, today)].join(' ').trim()}"><button data-pick="${esc(id)}" title="${esc(t)}">${t ? esc(t) : '<span class="muted">·</span>'}</button></td>`; };
  return `<div class="sheets"><div><h4><span class="dot sp"></span>분당 특별예배</h4>${sps.length ? `<div class="tblwrap"><table class="tsheet">
    <tr><th>날짜</th><th>예배</th><th>설교</th><th>헌금인도</th><th>예배인도</th></tr>
    ${sps.map(sp => `<tr><td>${own ? `<button data-spec="${esc(sp.id)}">` : ''}${md(sp.date)} <span class="dx">${DOWS[dowOf(sp.date)]}</span>${sp.t ? ' ' + esc(sp.t) : ''}${own ? '</button>' : ''}</td><td style="text-align:left">${esc(sp.n)}</td>${SPEC_ROLES.map(r => cellS(sp, r)).join('')}</tr>`).join('')}</table></div>` : ''}
    ${own ? `<button class="txtbtn" data-act="specnew" data-d="${sunOf(from)}" style="margin-top:4px">+ 분당 특별예배 더하기</button>` : ''}</div></div>`;
}
function viewBusan() {
  const pm = peopleMap(S.book), today = todayYmd(), thisMon = sunOf(today);   // 이번 주의 시작(주일)
  const vs = live(S.book.visits).slice().sort((a, b) => (a.date < b.date ? -1 : 1));
  const up = vs.filter(v => v.date >= thisMon), past = vs.filter(v => v.date < thisMon).reverse();
  const lv = levelMap(conflictsW(S.book, thisMon, addDays(today, 400), today)), bw = bsWarn();
  const line = (v, cls) => { const bf = busanFri(visitSun(v.date)); const st = stayState(v);
    return `<button class="vrow${cls}" data-visit="${esc(v.id)}"><span class="dcol"><b>${md(v.date)}</b> <span class="${dowOf(v.date) === 0 ? 'muted' : 'dx'}">${dowOf(v.date) === 0 ? '주일' : DOW[dowOf(v.date)]}</span></span><span>${v.title ? `<span class="pill ttl">${esc(v.title)}</span> ` : ''}${esc(whoText(S.book, v.who, '', pm)) || '<span class="muted">비어 있음</span>'}${bf && leadIs(v, 'fri', 'staff') ? ` ${friLabel(visitSun(v.date))}` : ''}${lv[v.id] === 'bad' ? ' <span class="pill bad">겹침</span>' : ''}${bsPill(v, bw) ? ' ' + BS_PILL : ''}</span>
      <span>${st === 'done' ? '<span class="pill ok">숙소 완료</span>' : st === 'open' ? '<span class="pill">숙소 미정</span>' : '<span class="pill">숙소 없음</span>'}</span>
      <span class="sub">${daysHtml(sortDays(v.date, v.days || defaultDays(v.date)))}${v.stay.filter(x => x.status !== 'cancel').map(x => ' · ' + esc(stayLineOf(v, x)) + (staySub(x) ? ' (' + staySubH(x) + ')' : '')).join('')}${v.travel.length ? ' · ' + esc(v.travel.map(t => (t.dir === 'down' ? '↓' : '↑') + [t.mode, timeS(t.time)].filter(Boolean).join(' ')).join(' ')) : ''}${(v.mates || []).length ? ' · ' + esc(mateText(S.book, v)) : ''}${v.meet ? ' · ' + esc(meetText(v.meet)) : ''}${(v.issues || []).length ? ' · 특이사항 ' + v.issues.length : ''}</span></button>`; };
  // 지난 부산 일정은 한 달씩 위로 더한다(1117-Z 3b, HB 11/18) — 지난 일정이 있는 달만 센다 · 해가 바뀌는 곳에 가로띠
  const pm2 = pastMonths(past), n = Math.min(S.pastN || 0, pm2.length), shown = pm2.slice(pm2.length - n);
  let py = ''; const yb = (v) => { const y = v.date.slice(0, 4), b = py && py !== y ? `<div class="yband">${y}년</div>` : ''; py = y; return b; };
  const pastHtml = shown.map(([ym, list]) => `<div class="pastm" data-ym="${ym}">${list.map(v => yb(v) + line(v, ' past')).join('')}</div>`).join('');
  const upHtml = up.map(v => yb(v) + line(v, '')).join('');
  const pb = past.length ? (n ? `<span>${n < pm2.length ? '<button class="txtbtn" data-act="pastmore">한 달 더 보기</button> · ' : ''}<button class="txtbtn" data-act="pastless">한 달 접기</button></span>` : '<button class="txtbtn" data-act="pastmore">지난 부산 일정 보기</button>') : '<span></span>';
  return `${topBanner()}
  ${past.length || aiCan() ? `<div class="vtop">${pb}${aiCan() ? `<button class="txtbtn" data-act="mailscan">메일에서 숙소 예약 찾기</button>` : ''}</div>` : ''}
  ${pastHtml}
  ${up.length ? upHtml : '<p class="empty">정해 둔 부산 일정이 없습니다.</p>'}
  ${isStaff() ? '' : `<div class="addrow"><input class="inp" id="nv-date" type="date" value="${nextFreeSunday()}" aria-label="부산 일정 날짜"><button class="btn" data-act="newvisit">부산 일정 더하기</button></div>`}
  <p class="note tiny" style="margin-top:0">보통은 주일입니다. 성탄 · 송구영신 같은 특별예배는 그 날을 고르고, 열린 판의 '예배' 에서 예배를 더합니다.</p>`;
}
// 지난 부산 일정 — 달마다 묶음(오래된 달이 앞) · 지난 일정이 있는 달만
function pastMonths(past) { const m = new Map(); for (const v of past.slice().sort((a, b) => (a.date < b.date ? -1 : 1))) { const k = v.date.slice(0, 7); if (!m.has(k)) m.set(k, []); m.get(k).push(v); } return [...m.entries()]; }
// 한 달 더 · 한 달 접기 — 맨 위 달 묶음의 높이가 스르륵 (quiet() 이면 바로)
function pastStep(d) {
  if (d < 0) { const el = $('#panel .pastm'); if (quiet() || !el || !el.animate) { S.pastN = Math.max(0, (S.pastN || 0) - 1); return render(); }
    const a = el.animate([{ height: el.offsetHeight + 'px', opacity: 1 }, { height: '0px', opacity: 0 }], { duration: 260, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' });
    a.onfinish = () => { S.pastN = Math.max(0, (S.pastN || 0) - 1); render(); }; return; }
  S.pastN = (S.pastN || 0) + 1; render(); const nl = $('#panel .pastm');
  if (!quiet() && nl && nl.animate) nl.animate([{ height: '0px', opacity: 0 }, { height: nl.offsetHeight + 'px', opacity: 1 }], { duration: 300, easing: 'cubic-bezier(.22,.8,.24,1)' });
}
function nextFreeSunday() { let s = visitSun(todayYmd()); for (let i = 0; i < 60 && live(S.book.visits).some(v => v.date === s); i++) s = addDays(s, 7); return s; }

/* ---------- 화면: 사람 — 교역자 · 성도 인도자(교역자가 아니라 성도로서 예배인도) 두 무리 ---------- */

  const chips = (p) => p.roles.length ? p.roles.map(r => { const sv = ROLE_SVCS[r] || []; const inn = sv.filter(x => canDo(p, x, r));
    const out = sv.filter(x => !inn.includes(x)), part = !out.length ? '' : !inn.length ? ' 없음' : out.length <= inn.length ? ' ' + out.map(x => SVC[x].short).join('·') + ' 빼고' : ' ' + inn.map(x => SVC[x].short).join('·');
    return `<span class="pill${r === 'busan' ? ' bs' : ' pg'}">${PROLES[r]}${part}</span>`; }).join('') : '<span class="muted tiny">맡는 일 없음</span>';
  const editor = (p) => `<div class="ped">
      <div class="field"><label for="pe-name">이름</label><input class="inp" id="pe-name" data-pid="${esc(p.id)}" value="${esc(p.name)}" maxlength="30" autocomplete="off"></div>
      <div class="field"><span class="flabel">구분</span><div class="seg3">${[['', '교역자'], ['lay', '성도 인도자'], ['other', '담임 · 초청']].map(([k, l]) => `<button data-kind="${k}" data-pid="${esc(p.id)}" aria-pressed="${(p.kind || '') === k}">${l}</button>`).join('')}</div></div>
      <div class="field"><label for="pe-email">계정 이메일 <span class="muted">— 이 분이 로그인하면 '내 일정' 이 먼저 열립니다(R6 에서 각자 들어올 때도 씀)</span></label><input class="inp" id="pe-email" type="email" data-pid="${esc(p.id)}" value="${esc(p.email || '')}" placeholder="name@gmail.com" autocomplete="off"></div>
      <div class="field"><span class="flabel">다른 이름 — 시트에 다르게 적힌 이름(띄어쓰기 · 호칭이 다른 것)</span>
        <div class="toggles">${(p.alias || []).map((a, i) => `<button class="tg sm" data-rmalias="${i}" data-pid="${esc(p.id)}" aria-pressed="true" title="눌러 빼기">${esc(a)} ✕</button>`).join('')}</div>
        <div class="minirow"><input class="inp" id="pe-alias" placeholder="다른 이름 더하기" maxlength="30" autocomplete="off"><button class="btn ghost" data-act="addalias" data-pid="${esc(p.id)}">더하기</button></div>

/* ---------- 예약 화면 사진 ----------
   사진은 rota/{uid}/img/{id} 문서에 (줄인 JPEG, 1장 ≈ 100~300KB). 책(b3)에는 id 만 — 책이 1MB 를 넘지 않게.
   보안 규칙 한 줄이 더 필요하다(docs/rotation/firestore-rules.md). 미리보기에서는 이 기기 메모리에만. */

function loadImg(id) {
  if (IMG.cache[id] || IMG.loading[id] || DEMO || !FB.user || !FB.db) return;
  IMG.loading[id] = 1;
  imgDoc(id).get().then(d => { if (d.exists && d.data().d) { IMG.cache[id] = d.data().d; document.querySelectorAll(`img[data-img="${id}"]`).forEach(el => { el.src = IMG.cache[id]; }); } })

function shrink(file) {

      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);

    im.src = url;

// 탭 바꾸기 — 나가고(150ms) → 그리고 → 들어온다(300ms), 판 높이도 스르륵. 손가락으로 밀던 중이면 그 자리(sw)에서 이어 나간다.

// 메뉴 판을 손가락으로 넘기기 — 앱 탭 넘기기와 같은 규칙(4분의 1 · 빠른 튕김 40px · 끝은 고무줄). 글자 칸에서는 넘기지 않는다.

  if (t.id === 'pe-email') return personApply(t.dataset.pid, p => { p.email = t.value.trim().toLowerCase(); if (!p.email) delete p.email; });
  if (t.id === 'mk-note') return markApply(m => { m.note = t.value.trim(); });
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'pe-new') { e.preventDefault(); addPerson(false); }
  if (e.key === 'Enter' && e.target.id === 'df-mate') { e.preventDefault(); const b = document.querySelector('#pane [data-act="dmadd"]'); if (b) b.click(); }
  if (e.key === 'Enter' && e.target.id === 'pe-new-lay') { e.preventDefault(); addPerson(true); }
  if (e.key === 'Enter' && e.target.id === 'pe-new-oth') { e.preventDefault(); addPerson('other'); }
  if (e.key === 'Enter' && e.target.id === 'pe-alias') { e.preventDefault(); const b = document.querySelector('[data-act="addalias"]'); if (b) b.click(); }
  if (e.key === 'Enter' && e.target.id === 'mk-new') { e.preventDefault(); const tg = e.target.value.trim(); if (tg) markApply(m => { if (!m.tags.includes(tg)) m.tags.push(tg); }); }
  if (e.key === 'Enter' && /^(pe-name|pk-txt|mk-note)$/.test(e.target.id)) { e.preventDefault(); e.target.blur(); }
  if (e.key === 'Enter' && (e.target.id === 'fb-pw' || e.target.id === 'fb-em')) fbLogin();
  if (e.key === 'Escape') { if ($('#lightbox')) return $('#lightbox').remove(); if ($('#menu')) return closeMenu(); if (S.pane) return closePane(); if (S.alset) { S.alset = null; return render(); } if (S.open) { S.open = null; render(); } }
});
// 글자 칸을 벗어나면 미뤄 둔 다시 그리기를 한다 (그 사이 계정에서 온 것을 보이게)
// 글자 칸을 벗어날 때만 다시 그린다(치는 동안 미뤄 둔 계정 갱신). 단추는 아니다 — 다시 그리며 누른 단추가 사라질 때도 focusout 이 와서 한 번 더 그렸다(1117-Z 2 고침)
document.addEventListener('focusout', (e) => { if (!e.target || !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; setTimeout(() => { if (!editing()) { render(); } }, 0); });
addEventListener('resize', () => markTab());

/* ---------- 새 버전 (사역 한눈에와 같은 방법) ---------- */
async function checkUpdate(manual) {
  const vb = document.querySelector('.verbadge'); if (manual && vb) vb.classList.add('busy');
  try {
    const r = await fetch(location.pathname + '?nc=' + Date.now(), { cache: 'no-store' });
    const m = (await r.text()).match(/const APP_VERSION = '([^']+)'/); if (!m) throw new Error('x');
    if (m[1] === APP_VERSION) { if (manual) toast('지금이 최신입니다\n' + APP_VERSION); return; }
    if (S.pane || editing()) return;   // 적는 중에는 다시 열지 않는다
    toast('새 버전 ' + m[1] + '\n받아서 다시 엽니다');
    setTimeout(() => location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]) + (DEMO ? '&demo=1' : '')), 900);
  } catch (_) { if (manual) toast('새 버전을 확인하지 못했습니다\n인터넷 연결을 확인해 주세요'); }
  finally { if (vb) vb.classList.remove('busy'); }
}
setTimeout(() => checkUpdate(false), 4000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - (checkUpdate.at || 0) > 600000) { checkUpdate.at = Date.now(); checkUpdate(false); } });

/* ---------- 미리보기 자료 (지어낸 이름 · 숙소) ---------- */
function demoBook() {
  const b = normBook(null), now = 1, by = 'demo';
  const names = ['한도윤', '서민재', '윤하람', '정은솔', '백시우', '문지호', '오세린', '강다온'];
  const P = names.map((n, i) => { const id = 'pdemo' + i; put(b, 'people', { id, name: n, roles: ['preach', 'offer', 'lead', 'busan'], bul: i < 4 }, by, now); return id; });
  put(b, 'buls', { id: bulId(todayYmd().slice(0, 7)), ym: todayYmd().slice(0, 7), p: P[1] }, by, now);   // 주보 담당 — 이번 달 서민재부터 ㄱㄴㄷ (1117-Z 2c)
  put(b, 'people', { id: 'pdemoL', name: '도하율', kind: 'lay', roles: ['lead'] }, by, now);   // 성도 인도자
  put(b, 'people', { id: 'pdemoP', name: '담임목사님', kind: 'other', roles: ['preach'] }, by, now);   // 담임 · 초청
  const sun0 = sunOf(todayYmd()); const start = addDays(sun0, -14);
  const order = [3, 6, 2, 1, 0, 4, 7, 2, 5, 1];   // 첫 사람(미리보기의 '나')이 2주 뒤 부산 — 내 일정의 부산 준비 카드가 보이게 (R8b)
  for (let i = 0; i < 10; i++) {
    const sun = addDays(start, 7 * i), w = P[order[i]], bf = busanFri(sun);
    for (const svc of SUN4) {
      put(b, 'slots', { id: slotId(sun, svc, 'preach'), who: ['pdemoP'] }, by, now);
      put(b, 'slots', { id: slotId(sun, svc, 'offer'), who: [(i + (svc === 'sun2' || svc === 'll' ? 1 : 0)) % 2 ? P[0] : P[5]] }, by, now);
    }
    put(b, 'slots', { id: slotId(sun, 'sun2', 'lead'), who: [P[[1, 4, 1, 4, 5][i % 5]]] }, by, now);
    put(b, 'slots', { id: slotId(sun, 'll', 'lead'), who: [i % 3 === 0 ? 'pdemoL' : P[[4, 3, 3, 5, 1][i % 5]]] }, by, now);
    put(b, 'slots', { id: slotId(svcDate(sun, 'fri'), 'fri', 'preach'), who: i % 3 === 1 ? [] : [P[(i + 2) % 8]], txt: i % 3 === 1 ? '초청 강사' : '' }, by, now);
    put(b, 'slots', { id: slotId(svcDate(sun, 'fri'), 'fri', 'offer'), who: [P[1]] }, by, now);
    put(b, 'slots', { id: slotId(svcDate(sun, 'wed'), 'wed', 'preach'), who: [P[i % 2 ? 0 : 3]] }, by, now);
    put(b, 'slots', { id: slotId(svcDate(sun, 'wed'), 'wed', 'offer'), who: [P[5]] }, by, now);
    put(b, 'visits', { id: visitId(sun), who: [w], days: bf ? '금토일' : '토일', lead: { fri: bf ? { m: i % 2 === 0 ? 'staff' : 'relay' } : null, sun: i % 3 === 1 ? { m: 'lay', p: 'pdemoL' } : i % 3 === 2 ? { m: 'relay' } : { m: 'staff' }, ll: i % 2 === 1 ? { m: 'staff' } : i % 3 === 0 ? { m: 'relay' } : { m: 'lay', p: 'pdemoL' } },   // 지어낸 성도 인도자가 분당 LL 인도를 맡는 주(i % 3 === 0)와 겹치지 않게
      stay: i < 6 ? [{ kind: 'hotel', name: i % 2 ? '호텔 가' : '호텔 나', status: 'done', nights: bf ? 2 : 1, cost: 100000, cancelBy: addDays(sun, -4) }] : i === 6 ? [{ kind: 'home', name: '성도 가정 1', status: 'ask', for: '여' }, { kind: 'hotel', name: '호텔 B', status: 'done', for: '남' }] : [],
      travel: i === 2 ? [{ dir: 'down', mode: 'KTX', time: '토 14:38' }, { dir: 'up', mode: 'KTX', time: '주일 19:10' }] : [],
      mates: i === 2 ? [{ n: '류하은' }, { n: '임서진' }] : i === 6 ? [{ n: '남궁별(기타)' }] : i === 4 ? [{ n: '도하율', p: 'pdemoL' }] : [],
      meet: i === 3 ? { k: 'new', who: '서다온', n: 2 } : i === 5 ? { k: 'bapt', n: 3 } : { k: 'dept', g: ['청년셀', '기타', '장년셀', '장년셀'][i % 4], memo: ['', '희남셀', '여장년', '남장년'][i % 4] }, note: '',
      issues: i === 2 ? [{ cat: '예배팀', text: '건반 반주자 부재 — 분당에서 한 명 동행' }] : [] }, by, now);
    if (nthOf(sun) === 1) put(b, 'marks', { id: markId(sun), tags: ['성찬주'] }, by, now);
  }
  put(b, 'marks', { id: markId(addDays(sun0, 7)), tags: ['극동방송'], note: '동행 스텝 필요' }, by, now);
  // 일부러 하나 겹치게: 이번 주 부산 가는 사람이 분당 2부 헌금에도 (겹침 검사가 빨갛게 잡는다)
  put(b, 'slots', { id: slotId(sun0, 'sun2', 'offer'), who: [P[order[2]]] }, by, now);
  return b;
}

/* ---------- 시작 ---------- */
if (DEMO) S.book = demoBook();
applyNameStyle(); applyHome();   // 이 기기에 둔 내 화면 취향으로 먼저 (R8b) — 계정 것은 로그인 뒤에 맞춘다
renderShell();
fbInit().then(rerender).catch(() => {});
mailBack();
