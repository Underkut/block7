  if (d.visit) return openPane({ kind: 'visit', id: d.visit });
  if (d.newvisit !== undefined) { if (d.newvisit) return newVisit(d.newvisit); goTab('busan'); return; }
  if (d.mark) return openPane({ kind: 'mark', sun: d.mark });
  if (d.autooff) { for (const k of d.autooff.split(',')) S.pane.off[k] = !S.pane.off[k]; autoMake(); return renderPane(); }
  if (d.autoalt) { S.pane.force[d.autoalt] = d.v; autoMake(); return renderPane(); }
  if (d.copyfrom) { const src = S.book.visits.find(x => x.id === d.copyfrom); if (!src) return; S.pane.copy = false;
    visitApply(v => { const c = copyVisit(src, v); v.stay = c.stay; v.travel = c.travel; v.staff = c.staff; v.group = c.group; }, true); return toast(mdd(src.date) + ' 방문에서 가져왔습니다\n숙소는 \'미정\' 으로 — 예약하면 바꿔 주세요'); }
  if (d.rmalias !== undefined) return personApply(d.pid, p => { p.alias = (p.alias || []).filter((_, i) => i !== +d.rmalias); });
  if (d.rmaway !== undefined) return personApply(d.pid, p => { p.away = (p.away || []).filter((_, i) => i !== +d.rmaway); });
  if (d.pin) return personApply(d.pid, p => { p.pin = (p.pin || []).includes(d.pin) ? p.pin.filter(x => x !== d.pin) : (p.pin || []).concat(d.pin); });
  if (d.picksvc) { const [date, , role] = S.pane.id.split('|'); S.pane.all = false; S.pane.id = slotId(date, d.picksvc, role); return renderPane(); }
  if (d.mview) { PREF.mview = d.mview; savePref(); closeViewsDrop(); if (S.pane && S.pane.kind === 'views') closePane(); else render(); return; }
  if (d.theme !== undefined && t.closest('#menu')) { PREF.theme = d.theme; savePref(); applyTheme(); return renderMenu(); }
  if (d.calf) { PREF.calf = d.calf; savePref(); return render(); }
  if (d.ext) { S.ext = S.ext || {}; const e = S.ext[d.ext] || { b: 0, a: 0 }; e[d.dir] = Math.min(6, e[d.dir] + 1); S.ext[d.ext] = e; return render(); }
  if (d.me) { PREF.me = d.me; savePref(); return render(); }
  if (d.calday) { S.calDay = S.calDay === d.calday ? null : d.calday; return render(); }
  if (d.gowk) { S.sun = d.gowk; return goTab('week'); }
  // 방문 판: 요일 하나씩 · 숙소 고르기 칸 · 교통 고르기 칸 · 사진
  if (d.day) return visitApply(v => { const cur = sortDays(v.date, v.days || defaultDays(v.date)); v.days = sortDays(v.date, cur.includes(d.day) ? cur.replace(d.day, '') : cur + d.day); if (!v.days.includes('금')) v.fri = false; }, true);
  if (d.sf) { const [k, f] = d.sf.split('.');
    if (k[0] === 't') return visitApply(v => { const t = v.travel[+k.slice(1)]; if (t) t[f] = d.v; }, true);
    return visitApply(v => { const st = v.stay[+k]; if (!st) return; st[f] = f === 'cost' ? +d.v : (f === 'name' && st.name === d.v ? '' : d.v); if (f === 'name') S.pane.other = null; }, true); }
  if (d.sstep) { const [k, f] = d.sstep.split('.'); return visitApply(v => { const st = v.stay[+k]; if (!st) return; const max = f === 'nights' ? 14 : 3000000; st[f] = Math.max(0, Math.min(max, (st[f] || 0) + +d.d)); }, true); }
  if (d.cancel !== undefined) return visitApply(v => { const st = v.stay[+d.cancel]; if (!st) return; delete st.cancelBy; delete st.cancelAt; delete st.nofree;
    if (d.v === 'nofree') st.nofree = true; else if (d.v) st.cancelBy = addDays(stayDates(v)[0], +d.v); }, true);
  if (d.tf) { const [k, f] = d.tf.split('.'); return visitApply(v => { const t = v.travel[+k]; if (!t) return;
    if (f === 'mode') t.mode = t.mode === d.v ? '' : d.v;
    else { const m = /^([일월화수목금토])?\s*(\d\d:\d\d)?$/.exec(t.time || '') || []; t.time = (d.v === m[1] ? '' : d.v) + (m[2] ? ' ' + m[2] : ''); t.time = t.time.trim(); } }, true); }
  if (d.img) { if (!IMG.cache[d.img]) { loadImg(d.img); return toast('사진을 불러오는 중입니다'); } return openLightbox(d.img, +d.si); }
  if (d.delimg) { const id = d.delimg, i = +d.i; const lb = $('#lightbox'); if (lb) lb.remove();
    visitApply(v => { const st = v.stay[i]; if (st) st.imgs = (st.imgs || []).filter(x => x !== id); }, true);
    if (!DEMO && FB.user && FB.db) imgDoc(id).delete().catch(() => {}); return toast('사진을 뺐습니다'); }
  if (d.kind !== undefined && d.pid) { const p = S.book.people.find(x => x.id === d.pid); if (!p) return;
    const np = Object.assign({}, p); if (d.kind) np.kind = d.kind; else delete np.kind;
    put(S.book, 'people', np, byNow(), Date.now()); saveBook(); return render(); }
  // 고르기 판
  if (d.who) return pickApply(c => { c.who = c.who.includes(d.who) ? c.who.filter(x => x !== d.who) : c.who.concat(d.who); return c; });
  if (d.txt) return pickApply(c => { c.txt = c.txt === d.txt ? '' : d.txt; return c; });
  // 방문 판
  if (d.vwho) return visitApply(v => { v.who = v.who.includes(d.vwho) ? v.who.filter(x => x !== d.vwho) : v.who.concat(d.vwho); }, true);
  if (d.days) return visitApply(v => { v.days = d.days; if (!v.days.includes('금')) v.fri = false; }, true);
  if (d.rmstay !== undefined) return visitApply(v => { v.stay.splice(+d.rmstay, 1); }, true);
  if (d.rmtr !== undefined) return visitApply(v => { v.travel.splice(+d.rmtr, 1); }, true);
  // 교회 일정 판
  if (d.tag) return markApply(m => { m.tags = m.tags.includes(d.tag) ? m.tags.filter(x => x !== d.tag) : m.tags.concat(d.tag); });
  // 사람 탭
  if (d.open !== undefined) { S.open = S.open === d.open ? null : (d.open || null); return render(); }
  if (d.nosvc) { const p = S.book.people.find(x => x.id === d.pid); if (!p) return;
    const no = (p.no || []).includes(d.nosvc) ? p.no.filter(k => k !== d.nosvc) : (p.no || []).concat(d.nosvc);
    put(S.book, 'people', Object.assign({}, p, { no }), byNow(), Date.now()); saveBook(); return render(); }
  if (d.role) { const p = S.book.people.find(x => x.id === d.pid); if (!p) return;
    const roles = p.roles.includes(d.role) ? p.roles.filter(r => r !== d.role) : p.roles.concat(d.role);
    put(S.book, 'people', Object.assign({}, p, { roles }), byNow(), Date.now()); saveBook(); return render(); }
  if (d.delp) { const p = S.book.people.find(x => x.id === d.delp); if (!p) return;
    if (d.sure !== '1') { d.sure = '1'; t.textContent = '한 번 더 누르면 지웁니다'; return; }
    drop(S.book, 'people', p.id, byNow(), Date.now()); saveBook(); S.open = null; render(); return toast(p.name + ' 님을 지웠습니다\n이미 정한 자리에는 \'(지운 사람)\' 으로 남습니다'); }
  const a = d.act;
  if (a === 'menu') return openMenu();
  if (a === 'close') return closeMenu();
  if (a === 'closepane') return closePane();
  if (a === 'login') return fbLogin();
  if (a === 'logout') return fbLogout();
  if (a === 'upd') return checkUpdate(true);
  if (a === 'addp') return addPerson(false);
  if (a === 'addlay') return addPerson(true);
  if (a === 'addoth') return addPerson('other');
  if (a === 'addalias') { const v = (($('#pe-alias') || {}).value || '').trim(); if (!v) return; return personApply(d.pid, p => { p.alias = (p.alias || []).concat(v); }); }
  if (a === 't2p') { const n = textToPerson(S.book, d.pid, byNow(), Date.now()); saveBook(); render(); return toast(`${n}칸을 사람으로 바꿨습니다\n이제 사람 고르기에서 이 분을 고르면 됩니다`); }
  if (a === 'auto') { S.pane = { kind: 'auto', ym: S.ym, force: {}, off: {} }; autoMake(); return openPane(S.pane); }
  if (a === 'autogo') { const n = applyProposal(S.book, S.pane.prop, byNow(), Date.now()); saveBook(); closePane(); return toast(n ? `제안 ${n}개를 넣었습니다\n칸을 눌러 언제든 고칠 수 있습니다` : '넣을 것이 없습니다\n그 사이 칸이 채워졌습니다'); }
  if (a === 'views') { if (wideScreen()) return $('#vdrop') ? closeViewsDrop() : openViewsDrop(t); return openPane({ kind: 'views' }); }
  if (a === 'mgrid') { PREF.mgrid = !PREF.mgrid; savePref(); return render(); }
  if (a === 'copyopen') { S.pane.copy = !S.pane.copy; return renderPane(); }
  if (a === 'addaway') { const f = ($('#aw-from') || {}).value, to = ($('#aw-to') || {}).value || f, note = (($('#aw-note') || {}).value || '').trim();
    if (!f) return toast('부재 시작 날짜를 골라 주세요');
    return personApply(d.pid, p => { p.away = (p.away || []).concat({ from: f, to: to < f ? f : to, note }); }); }
  if (a === 'export') return openPane({ kind: 'exp' });
  if (a === 'expcopy') { const tx = sheetTSV(S.book, S.ym);
    try { navigator.clipboard.writeText(tx).then(() => toast('복사했습니다\n구글 시트에 붙여 넣으세요'), () => { const el = $('#exp-text'); if (el) { el.focus(); el.select(); } toast('자동 복사가 막혔습니다\n선택된 글을 길게 눌러 복사해 주세요'); }); }
    catch (_) { const el = $('#exp-text'); if (el) { el.focus(); el.select(); } }
    return; }
  if (a === 'expcsv') { const tx = sheetTSV(S.book, S.ym).split('\n').map(r => r.split('\t').map(c => /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c).join(',')).join('\r\n');
    const url = URL.createObjectURL(new Blob(['\ufeff' + tx], { type: 'text/csv;charset=utf-8' })); const aEl = document.createElement('a'); aEl.href = url; aEl.download = `예배구성-${S.ym}.csv`; document.body.appendChild(aEl); aEl.click(); aEl.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); return; }
  if (a === 'wsort') { PREF.wsort = PREF.wsort === 'new' ? 'time' : 'new'; savePref(); return render(); }
  if (a === 'fold') { PREF.fold = PREF.fold === false; savePref(); return render(); }
  if (a === 'stayother') { S.pane.other = S.pane.other === +d.i ? null : +d.i; renderPane(); const el = document.querySelector(`[data-vf="stay.${d.i}.name"]`); if (el) el.focus(); return; }
  if (a === 'addimg') { if (!DEMO && !FB.user) return toast('로그인하면 사진을 올릴 수 있습니다'); S.pane.imgFor = +d.i; $('#img-file').click(); return; }
  if (a === 'closelb') { const lb = $('#lightbox'); if (lb) lb.remove(); return; }
  if (a === 'newvisit') return newVisit(($('#nv-date') || {}).value);
  // '네 예배 같게' 를 누르는 순간 지금 칸의 사람을 네 예배에 넣는다 (예전엔 켜기만 하고 저장은 안 돼 1부만 남았다)
  if (a === 'pickall') { if (S.pane.all) return; S.pane.all = true; const cur = S.book.slots.find(x => x.id === S.pane.id && !x.del);
    if (cur && (cur.who.length || cur.txt)) { pickApply(c => c); return toast('1 · 2 · 3부 · LL 모두\n' + whoText(S.book, cur.who, cur.txt) + ' 로 맞췄습니다'); } return renderPane(); }
  if (a === 'importpick') { const f = $('#imp-file'); if (f) f.click(); return; }
  // ⚠️ 미리 본 결과(res.book)를 쓰지 않고 **지금의 자료**로 다시 셈한다 — 그 사이 다른 기기에서 온 것을 잃지 않게
  if (a === 'importgo') { const res = importBook(S.book, S.pane && S.pane.imp, byNow()); if (!res) return closePane();
    S.book = res.book; saveBook(); closePane();
    const c = res.counts; return toast(`시트 기록을 가져왔습니다\n방문 ${c.visits + c.visitsUpd} · 자리 ${c.slots + c.slotsUpd} · 일정 ${c.marks + c.marksUpd} (새로 · 고침)`); }
  if (a === 'pickclear') return pickApply(() => ({ who: [], txt: '' }));
  if (a === 'vfri') return visitApply(v => { v.fri = !v.fri; if (v.fri && !v.days.includes('금')) v.days = '금토일'; }, true);
  if (a === 'addstay') return visitApply(v => { v.stay.push({ kind: 'hotel', status: '' }); }, true);
  if (a === 'addtr') return visitApply(v => { v.travel.push({ dir: v.travel.some(x => x.dir === 'down') ? 'up' : 'down' }); }, true);
  if (a === 'delvisit') { const v = curVisit(); if (!v) return;
    if (d.sure !== '1') { d.sure = '1'; t.textContent = '한 번 더 누르면 지웁니다'; return; }
    drop(S.book, 'visits', v.id, byNow(), Date.now()); saveBook(); closePane(); return toast(mdd(v.date) + ' 부산 방문을 지웠습니다'); }
  if (a === 'addtag') { const el = $('#mk-new'); const tg = (el && el.value || '').trim(); if (!tg) return; return markApply(m => { if (!m.tags.includes(tg)) m.tags.push(tg); }); }
});
// 주일 네 예배가 지금 같은 사람인가 / 다 비었나 — 같으면 '모두 같게' 를 켠 채 연다
function fourOf(id) { const [date, , role] = id.split('|'); return SUN4.map(s => S.book.slots.find(x => x.id === slotId(date, s, role) && !x.del)).map(s => s ? JSON.stringify([s.who, s.txt]) : ''); }
function sameFour(id) { const f = fourOf(id); return f.every(x => x === f[0]); }
function isEmptyFour(id) { return fourOf(id).every(x => !x); }

// 글자 칸: 칸을 벗어날 때(change) 저장. 방문 판은 칠 때마다(input) 잠깐 모아 저장한다.
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'pe-name') { const p = S.book.people.find(x => x.id === t.dataset.pid); const name = t.value.trim();
    if (!p || !name || name === p.name) { t.value = p ? p.name : ''; return; }
    put(S.book, 'people', Object.assign({}, p, { name }), byNow(), Date.now()); saveBook(); return; }
  if (t.id === 'pk-txt') return pickApply(c => { c.txt = t.value.trim(); return c; });
  if (t.id === 'pe-email') return personApply(t.dataset.pid, p => { p.email = t.value.trim().toLowerCase(); if (!p.email) delete p.email; });
  if (t.id === 'mk-note') return markApply(m => { m.note = t.value.trim(); });
  if (t.dataset.tt !== undefined) return visitApply(v => { const tr = v.travel[+t.dataset.tt]; if (!tr) return; const m = /^([일월화수목금토])/.exec(tr.time || ''); tr.time = ((m ? m[1] + ' ' : '') + t.value).trim(); }, true);
  if (t.dataset.vf) { clearTimeout(vfTimer); vfSave(t, /kind|status|for|dir|cancel/.test(t.dataset.vf)); }
});
let vfTimer = 0, vfPending = null;
document.addEventListener('input', (e) => { const t = e.target; if (t.dataset && t.dataset.vf && t.tagName !== 'SELECT' && !/date|time/.test(t.type)) { clearTimeout(vfTimer); vfPending = t; vfTimer = setTimeout(() => { vfPending = null; vfSave(t, false); }, 500); } });
function vfSave(t, redraw) {
  const path = t.dataset.vf.split('.'), val = t.type === 'number' ? (+t.value || 0) : t.value;
  visitApply(v => { if (path.length === 1) v[path[0]] = val; else { const o = v[path[0]][+path[1]]; if (!o) return; o[path[2]] = val; if (path[2] === 'cancelBy' && val) delete o.nofree; } }, redraw);
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'pe-new') { e.preventDefault(); addPerson(false); }
  if (e.key === 'Enter' && e.target.id === 'pe-new-lay') { e.preventDefault(); addPerson(true); }
  if (e.key === 'Enter' && e.target.id === 'pe-new-oth') { e.preventDefault(); addPerson('other'); }
  if (e.key === 'Enter' && e.target.id === 'pe-alias') { e.preventDefault(); const b = document.querySelector('[data-act="addalias"]'); if (b) b.click(); }
  if (e.key === 'Enter' && e.target.id === 'mk-new') { e.preventDefault(); const tg = e.target.value.trim(); if (tg) markApply(m => { if (!m.tags.includes(tg)) m.tags.push(tg); }); }
  if (e.key === 'Enter' && /^(pe-name|pk-txt|mk-note)$/.test(e.target.id)) { e.preventDefault(); e.target.blur(); }
  if (e.key === 'Enter' && (e.target.id === 'fb-pw' || e.target.id === 'fb-em')) fbLogin();
  if (e.key === 'Escape') { if ($('#lightbox')) return $('#lightbox').remove(); if ($('#menu')) return closeMenu(); if (S.pane) return closePane(); if (S.open) { S.open = null; render(); } }
});
// 글자 칸을 벗어나면 미뤄 둔 다시 그리기를 한다 (그 사이 계정에서 온 것을 보이게)
document.addEventListener('focusout', () => setTimeout(() => { if (!editing()) { render(); } }, 0));
addEventListener('resize', () => markTab());

/* ---------- 새 버전 (사역 한눈에와 같은 방법) ---------- */
async function checkUpdate(manual) {
  const vb = document.querySelector('.verbadge'); if (manual && vb) vb.classList.add('busy');
  try {
    const r = await fetch(location.pathname + '?nc=' + Date.now(), { cache: 'no-store' });
    const m = (await r.text()).match(/const APP_VERSION = '([^']+)'/); if (!m) throw new Error('x');
    if (m[1] === APP_VERSION) { if (manual) toast('지금이 최신입니다\n' + APP_VERSION); return; }
    if (S.pane || editing()) return;   // 적는 중에는 다시 열지 않는다
    toast('새 버전 ' + m[1] + '\n받아서 다시 엽니다');
    setTimeout(() => location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]) + (DEMO ? '&demo=1' : '')), 900);
  } catch (_) { if (manual) toast('새 버전을 확인하지 못했습니다\n인터넷 연결을 확인해 주세요'); }
  finally { if (vb) vb.classList.remove('busy'); }
}
setTimeout(() => checkUpdate(false), 4000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - (checkUpdate.at || 0) > 600000) { checkUpdate.at = Date.now(); checkUpdate(false); } });

/* ---------- 미리보기 자료 (지어낸 이름 · 숙소) ---------- */
function demoBook() {
  const b = normBook(null), now = 1, by = 'demo';
  const names = ['한도윤', '서민재', '윤하람', '정은솔', '백시우', '문지호', '오세린', '강다온'];
  const P = names.map((n, i) => { const id = 'pdemo' + i; put(b, 'people', { id, name: n, roles: ['preach', 'offer', 'lead', 'busan'] }, by, now); return id; });
  put(b, 'people', { id: 'pdemoL', name: '도하율', kind: 'lay', roles: ['lead'] }, by, now);   // 성도 인도자
  put(b, 'people', { id: 'pdemoP', name: '담임목사님', kind: 'other', roles: ['preach'] }, by, now);   // 담임 · 초청
  const sun0 = sunOf(todayYmd()); const start = addDays(sun0, -14);
  const order = [3, 6, 2, 1, 7, 4, 0, 2, 5, 1];
  for (let i = 0; i < 10; i++) {
    const sun = addDays(start, 7 * i), w = P[order[i]], bf = busanFri(sun);
    for (const svc of SUN4) {
      put(b, 'slots', { id: slotId(sun, svc, 'preach'), who: ['pdemoP'] }, by, now);
      put(b, 'slots', { id: slotId(sun, svc, 'offer'), who: [(i + (svc === 'sun2' || svc === 'll' ? 1 : 0)) % 2 ? P[0] : P[5]] }, by, now);
    }
    put(b, 'slots', { id: slotId(sun, 'sun2', 'lead'), who: [P[[1, 4, 1, 4, 5][i % 5]]] }, by, now);
    put(b, 'slots', { id: slotId(sun, 'll', 'lead'), who: [i % 3 === 0 ? 'pdemoL' : P[[4, 3, 3, 5, 1][i % 5]]] }, by, now);
    put(b, 'slots', { id: slotId(svcDate(sun, 'fri'), 'fri', 'preach'), who: i % 3 === 1 ? [] : [P[(i + 2) % 8]], txt: i % 3 === 1 ? '초청 강사' : '' }, by, now);
    put(b, 'slots', { id: slotId(svcDate(sun, 'fri'), 'fri', 'offer'), who: [P[1]] }, by, now);
    put(b, 'slots', { id: slotId(svcDate(sun, 'wed'), 'wed', 'preach'), who: [P[i % 2 ? 0 : 3]] }, by, now);
    put(b, 'slots', { id: slotId(svcDate(sun, 'wed'), 'wed', 'offer'), who: [P[5]] }, by, now);
    put(b, 'visits', { id: visitId(sun), who: [w], days: bf ? '금토일' : '토일', fri: !!bf,
      stay: i < 6 ? [{ kind: 'hotel', name: i % 2 ? '호텔 가' : '호텔 나', status: 'done', nights: bf ? 2 : 1, cost: 100000, cancelBy: addDays(sun, -4) }] : i === 6 ? [{ kind: 'home', name: '성도 가정 1', status: 'ask', for: '여' }, { kind: 'hotel', name: '호텔 B', status: 'done', for: '남' }] : [],
      travel: i === 2 ? [{ dir: 'down', mode: 'KTX', time: '토 14:38' }, { dir: 'up', mode: 'KTX', time: '주일 19:10' }] : [],
      staff: i === 2 ? '류하은 · 임서진' : i === 6 ? '남궁별(기타)' : '', group: ['청년셀', '희남셀', '여장년', '남장년'][i % 4], edu: i === 3 ? '새가족 2주차 · 토 13:30' : '', note: '' }, by, now);
    if (nthOf(sun) === 1) put(b, 'marks', { id: markId(sun), tags: ['성찬주'] }, by, now);
  }
  put(b, 'marks', { id: markId(addDays(sun0, 7)), tags: ['극동방송'], note: '동행 스텝 필요' }, by, now);
  // 일부러 하나 겹치게: 이번 주 부산 가는 사람이 분당 2부 헌금에도 (겹침 검사가 빨갛게 잡는다)
  put(b, 'slots', { id: slotId(sun0, 'sun2', 'offer'), who: [P[order[2]]] }, by, now);
  return b;
}

/* ---------- 시작 ---------- */
if (DEMO) S.book = demoBook();
renderShell();
fbInit().then(rerender).catch(() => {});
</script>
