<script id="report-core">
// 사역 한눈에 — 화면 없이 도는 판단. tests/test_report.js 가 이것만 떼어 시험한다.
// 교회 보고서의 한 주는 **일요일부터 토요일까지**, 금요일 오후 5시에 그 주 보고가 회의 자료로 전달된다 (공개 사용 안내).
const APP_VERSION = 'v. 26-1107-2';
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const FREQ = { weekly: '매주', biweekly: '격주', nth: '몇째 주' };
const PREF_KEY = 'report_pref_v1', BOOK_KEY = 'report_book_v1';   // 이 기기: 화면 취향 · 시간표 사본(로그인 전에도 쓰게)

function ymdUTC(d) { return d.toISOString().slice(0, 10); }
function addDays(ymd, n) { const d = new Date(ymd + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return ymdUTC(d); }
function dowOf(ymd) { return new Date(ymd + 'T00:00:00Z').getUTCDay(); }
function weekStartSun(ymd) { return addDays(ymd, -dowOf(ymd)); }
function daysInMonth(ymd) { const y = +ymd.slice(0, 4), m = +ymd.slice(5, 7); return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
// 그 달의 몇째 그 요일인가 (1~5) · 그 달의 마지막 그 요일인가
function nthOf(ymd) { return Math.ceil(+ymd.slice(8, 10) / 7); }
function isLastOf(ymd) { return +ymd.slice(8, 10) + 7 > daysInMonth(ymd); }

// 한 시간칸이 그 날에 있는가
//   weekly: 그 요일 매주 · biweekly: 기준 날짜(anchor)부터 2주마다 · nth: 그 달의 몇째 주(1~5, 'last' = 마지막)
function occursOn(slot, ymd) {
  if (!slot || dowOf(ymd) !== +slot.dow) return false;
  const f = slot.freq || 'weekly';
  if (f === 'weekly') return true;
  if (f === 'nth') { const ns = slot.nth || []; return ns.includes(nthOf(ymd)) || (ns.includes('last') && isLastOf(ymd)); }
  if (f === 'biweekly') {
    if (!slot.anchor) return true;
    const diff = Math.round((new Date(ymd + 'T00:00:00Z') - new Date(slot.anchor + 'T00:00:00Z')) / 864e5);
    return diff % 14 === 0;
  }
  return false;
}
// 시간표 모양 다듬기 — 모르는 값은 버리고 기본값을 채운다
function newId(p) { return (p || 'x') + Math.random().toString(36).slice(2, 9); }
function normSlot(s) {
  const o = s || {};
  const freq = FREQ[o.freq] ? o.freq : 'weekly';
  return { id: o.id || newId('s'), dow: Math.min(6, Math.max(0, +o.dow || 0)), end: /^\d{1,2}:\d{2}$/.test(o.end || '') ? o.end : '',
    freq, nth: freq === 'nth' ? (o.nth || []).filter(x => x === 'last' || (x >= 1 && x <= 5)) : [], anchor: freq === 'biweekly' && /^\d{4}-\d{2}-\d{2}$/.test(o.anchor || '') ? o.anchor : '',
    label: String(o.label || '').slice(0, 40) };
}
function normBook(b) {
  const o = b || {};
  return { v: 1, at: +o.at || 0, catalog: [...new Set((o.catalog || []).map(x => String(x || '').trim().slice(0, 20)).filter(Boolean))].slice(0, 80), depts: (o.depts || []).map(d => ({ id: d.id || newId('d'), name: String(d.name || '').slice(0, 40), role: d.role === 'view' ? 'view' : 'write',
    slots: (d.slots || []).map(normSlot) })).filter(d => d.name || d.slots.length) };
}
// 기기 사본과 계정 것 중 나중에 고친 쪽 (at 이 큰 쪽)
function pickBook(local, cloud) {
  const l = normBook(local), c = cloud ? normBook(cloud) : null;
  if (!c) return { book: l, push: l.depts.length ? l : null };
  if (l.at > c.at) return { book: l, push: l };
  return { book: c, push: null };
}
// 한 주(일~토)의 보고 일정 — 날짜순 · 같은 날은 끝나는 시각순
function weekPlan(book, weekStart) {
  const out = [];
  for (let i = 0; i < 7; i++) {
    const day = addDays(weekStart, i);
    for (const d of (book && book.depts) || []) for (const s of d.slots) if (occursOn(s, day)) out.push({ day, dept: d, slot: s });
  }
  return out.sort((a, b) => a.day.localeCompare(b.day) || (a.slot.end || '99').localeCompare(b.slot.end || '99'));
}
// 부서 고르기 — 자주 있는 이름(일반적인 것만, 교회마다 다르면 붙여 넣기로 채운다)
const PRESET = ['예배팀', '음향팀', '조명팀', '영상팀', '방송팀', 'PD', '성찬위원', '송번역팀', '안내위원', '새가족 환영팀', '주차팀', '꽃꽂이',
  '영아부', '유치부', '유년부', '초등부', '중등부', '고등부', '청년부', '주일학교 교사'];
// 교회 보고서 화면에서 복사한 글 → 부서 이름들. 줄마다 하나, 머리글 · 숫자 · 표시 글은 버린다.
//   예: "▾ 예배/기술팀 5/5" → "예배/기술팀" · "● 조명팀" → "조명팀" · "내 파트 · 이번 주" / "보고 있음 임시저장 아직 없음" → 버림
const PASTE_SKIP = /^(내\s*파트|이번\s*주|보고\s*있음|임시저장|아직\s*없음|홈|내\s*보고서|공지|확인|예배위원|예배\s*PD|주일예배|목회|주간\s*요약|회의\s*자료|비공개|관리|기기\s*설정|라이트|다크|설정|사용\s*안내|로그아웃|메뉴|보고\s*작성|주중\s*기도회|이번\s*주\s*공지)/;
function parseDeptList(text) {
  const out = [];
  for (let line of String(text || '').normalize('NFC').split(/\r?\n|,|·/)) {
    line = line.replace(/[▾▸▴▶▼•●○◦·\-–—*#]/g, ' ').replace(/\b\d+\s*\/\s*\d+\b/g, ' ').replace(/\s+/g, ' ').trim();
    if (!line || line.length > 20 || /^\d+$/.test(line) || PASTE_SKIP.test(line) || /\d{1,2}\/\d{1,2}/.test(line)) continue;
    if (!out.includes(line)) out.push(line);
  }
  return out;
}
function slotText(s) {
  const f = s.freq === 'nth' ? (s.nth.length ? s.nth.map(x => x === 'last' ? '마지막' : x + '째').join(' · ') + ' 주' : '몇째 주(고르기 전)') : FREQ[s.freq];
  return f + ' ' + DOW[s.dow] + '요일' + (s.end ? ' · ' + s.end + ' 끝' : '');
}
</script>

<script>
'use strict';
const DEMO = /[?&]demo=1\b/.test(location.search);
const EMBED = (() => { try { return window.self !== window.top; } catch (_) { return true; } })();   // 셀 한눈에 안 겹 화면으로 열렸나
const TOUCH = (() => { try { return matchMedia('(pointer: coarse)').matches; } catch (_) { return false; } })();
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const quiet = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (_) { return false; } };
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) { } }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; toast.at = Date.now(); clearTimeout(toast.t);
  toast.t = setTimeout(() => { t.hidden = true; }, Math.max(3000, Math.min(9000, String(msg).replace(/\s/g, '').length * 200))); }
document.addEventListener('click', () => { const t = $('#toast'); if (!t.hidden && Date.now() - (toast.at || 0) > 300) t.hidden = true; }, true);
function todayYmd() { return new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' }); }
function md(ymd) { return (+ymd.slice(5, 7)) + '/' + (+ymd.slice(8, 10)); }
// 아이폰 홈 화면 앱: 손가락을 뗄 때 직접 커서를 넣어 키보드를 띄운다 (셀 한눈에와 같은 까닭)
document.addEventListener('touchend', (e) => { const t = e.target; if (t && t.matches && t.matches('input:not([type=checkbox]):not([disabled]),select,textarea') && document.activeElement !== t) t.focus(); }, { passive: true });

/* ---------- 상태 ---------- */
const PREF = Object.assign({ tab: 'week' }, lsGet(PREF_KEY, {}));
const savePref = () => lsSet(PREF_KEY, PREF);
const S = { book: normBook(lsGet(BOOK_KEY, null)), week: weekStartSun(todayYmd()) };
const TABS = [{ id: 'week', label: '이번 주' }, { id: 'depts', label: '내 부서' }];

/* ---------- 계정 (BLOCK7 과 같은 이메일 · 비밀번호, 셀 한눈에와 같은 로그인 칸 'cell') ----------
   ⚠️ 앱 이름을 셀 한눈에와 같은 'cell' 로 둔다 — 같은 sweeter.my 라 한 번 로그인하면 두 앱이 같이 로그인된다.

const FB_CFG = { apiKey: 'AIzaSyDeMIzExHqyeqHQrqpPbcOJqYO9a7qmrkE', authDomain: 'block7-8f24e.firebaseapp.com', projectId: 'block7-8f24e',

function loadJs(src) { return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = () => rej(new Error('불러오기 실패')); setTimeout(() => rej(new Error('시간 초과')), 20000); document.head.appendChild(el); }); }
async function fbInit() {
  if (DEMO) { FB.ready = true; FB.user = { email: '미리보기 (저장 안 됨)', uid: 'demo' }; return; }
  if (FB.app) return; if (FB.loading) return FB.loading;
  FB.loading = (async () => {
    for (const s of FB_JS) await loadJs(s);
    FB.app = firebase.apps.find(a => a.name === 'cell') || firebase.initializeApp(FB_CFG, 'cell');
    FB.auth = FB.app.auth(); FB.db = FB.app.firestore();
    setTimeout(() => { if (!FB.ready) { FB.ready = true; rerender(); } }, 10000);
    FB.auth.onAuthStateChanged(u => {
      FB.user = u; FB.ready = true;
      if (FB.unsub) { FB.unsub(); FB.unsub = null; }
      if (u) FB.unsub = FB.db.collection('cellbook').doc(u.uid).onSnapshot(d => {
        const r = pickBook(S.book, d.exists ? d.data().report : null);
        S.book = r.book; lsSet(BOOK_KEY, S.book); if (r.push) cloudSave();
        if (!editing()) rerender();
      }, e => { FB.err = e && e.code === 'permission-denied' ? '서버 권한이 아직 없습니다.' : '시간표를 불러오지 못했습니다.'; rerender(); });
      rerender();
    });
  })();
  try { await FB.loading; } catch (e) { FB.err = '로그인 도구를 불러오지 못했습니다.\n인터넷 연결을 확인해 주세요.'; FB.loading = null; rerender(); }
}
async function fbLogin() {
  const em = ($('#fb-em') || {}).value, pw = ($('#fb-pw') || {}).value;
  if (!em || !pw) { FB.err = '이메일과 비밀번호를 넣어 주세요.'; return rerender(); }
  FB.busy = true; FB.err = ''; rerender();
  try { await fbInit(); await FB.auth.signInWithEmailAndPassword(em.trim(), pw); toast('로그인했습니다\n시간표를 맞춥니다'); }
  catch (e) { FB.err = /wrong-password|invalid-credential|user-not-found|invalid-login/i.test(e.code || e.message) ? '이메일이나 비밀번호가 맞지 않습니다.' : '로그인하지 못했습니다. ' + (e.message || ''); }

}

/* ---------- 셀 ↔ 사역 겹 화면 ----------
   홈 화면 앱에서 다른 주소를 열면 아이폰은 브라우저 창으로 띄운다. 그래서 상대 앱을 **이 앱 안 전체 화면 겹**으로 띄운다.
   겹 안에서 로고를 누르면 겹이 걷힌다(postMessage). 같은 sweeter.my · 같은 앱 저장 공간이라 로그인도 하나. */
function openLayer(url) {
  if (EMBED) { try { parent.postMessage({ type: 'b7-layer-close' }, location.origin); } catch (_) { } return; }
  if ($('#layer')) return;
  const el = document.createElement('div'); el.className = 'layer'; el.id = 'layer';
  el.innerHTML = `<iframe src="${url}" title="셀 한눈에"></iframe>`;
  document.body.appendChild(el); history.pushState({ layer: 1 }, '');
  if (!quiet()) el.animate([{ transform: 'translateX(100%)' }, { transform: 'none' }], { duration: 320, easing: 'cubic-bezier(.22,.8,.24,1)' });
}
function closeLayer(fromPop) {
  const el = $('#layer'); if (!el) return;
  if (!fromPop) { closeLayer.skip = true; history.back(); }
  const done = () => el.remove();
  if (quiet()) return done();
  el.animate([{ transform: 'none' }, { transform: 'translateX(100%)' }], { duration: 260, easing: 'cubic-bezier(.4,0,.6,1)' }).onfinish = done;
}
addEventListener('popstate', () => { if (closeLayer.skip) { closeLayer.skip = false; return; } if ($('#layer')) closeLayer(true); });
addEventListener('message', (e) => { if (e.origin === location.origin && e.data && e.data.type === 'b7-layer-close') closeLayer(false); });

function markTab() {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === PREF.tab));
  const on = $('.tab.on'), bar = $('#tabbar'); if (on && bar) { bar.style.width = on.offsetWidth + 'px'; bar.style.transform = `translateX(${on.offsetLeft}px)`; }
}
function rerender() { const p = $('#panel'); if (!p) return; p.innerHTML = PREF.tab === 'depts' ? viewDepts() : viewWeek(); }
let busyAnim = false;
function transit(dir, change) {
  const p = $('#panel'); if (!p || quiet() || busyAnim) return change();
  busyAnim = true; const w = p.offsetWidth || 360;
  p.style.transition = 'transform .15s ease-in, opacity .15s ease-in'; p.style.transform = `translateX(${-dir * w * 0.35}px)`; p.style.opacity = '0';
  setTimeout(() => { change(); p.style.transition = 'none'; p.style.transform = `translateX(${dir * w * 0.35}px)`; void p.offsetWidth;
    p.style.transition = 'transform .3s cubic-bezier(.22,.8,.24,1), opacity .3s cubic-bezier(.22,.8,.24,1)'; p.style.transform = ''; p.style.opacity = '1';
    setTimeout(() => { p.style.transition = ''; busyAnim = false; }, 320); }, 150);
}
// 이번 주 탭에서는 좌우로 밀면 주가 바뀐다 (손가락을 따라감)
function bindSwipe() {
  const st = $('#stage'); let x0 = 0, y0 = 0, dx = 0, on = false, lock = null, t0 = 0;
  st.addEventListener('touchstart', e => { if (busyAnim || PREF.tab !== 'week' || e.touches.length > 1) return; const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; dx = 0; on = true; lock = null; t0 = Date.now(); }, { passive: true });
  st.addEventListener('touchmove', e => { if (!on) return; const t = e.touches[0]; const a = t.clientX - x0, b = t.clientY - y0;
    if (lock == null) { if (Math.abs(a) < 8 && Math.abs(b) < 8) return; lock = Math.abs(a) > Math.abs(b) * 1.2 ? 'x' : 'y'; }
    if (lock !== 'x') return; dx = a; const p = $('#panel'); p.style.transition = 'none'; p.style.transform = `translateX(${dx}px)`; p.style.opacity = String(1 - Math.min(.6, Math.abs(dx) / (p.offsetWidth || 360))); }, { passive: true });
  st.addEventListener('touchend', () => { if (!on) return; on = false; if (lock !== 'x') return; const p = $('#panel'); const w = p.offsetWidth || 360;
    if (Math.abs(dx) > w / 4 || (Date.now() - t0 < 250 && Math.abs(dx) > 40)) { const dir = dx < 0 ? 1 : -1; transit(dir, () => { S.week = addDays(S.week, 7 * dir); rerender(); }); }
    else { p.style.transition = 'transform .3s cubic-bezier(.22,.8,.24,1), opacity .3s'; p.style.transform = ''; p.style.opacity = '1'; setTimeout(() => { p.style.transition = ''; }, 320); } });
}

// ① 이번 주 — 내 시간표로 본 이 주의 보고 (일~토)
function viewWeek() {
  const today = todayYmd(), ws = S.week, we = addDays(ws, 6);
  const plan = weekPlan(S.book, ws);
  const thisWeek = ws === weekStartSun(today);
  let h = `<div class="weeknav"><button data-act="wk" data-d="-1">‹</button><b>${md(ws)} – ${md(we)}${thisWeek ? ' · 이번 주' : ''}</b><button data-act="wk" data-d="1">›</button></div>
    <p class="sub" style="text-align:center;margin-top:0">금요일 오후 5시에 그 주 보고가 회의 자료로 전달됩니다</p>`;
  if (!S.book.depts.length) return h + `<div class="card"><h3>먼저 '내 부서' 에 시간표를 적어 주세요</h3><p class="small muted" style="margin:0">부서마다 요일 · 끝나는 시각 · 매주/격주/몇째 주를 적어 두면, 이 화면에 요일별로 써야 할 보고와 봐 줄 보고가 나옵니다.</p><p style="margin:10px 0 0"><button class="btn pri" data-tab="depts">내 부서 적기</button></p></div>`;
  if (!plan.length) return h + '<p class="empty">이 주에는 시간표에 맞는 보고가 없습니다.</p>';
  for (let i = 0; i < 7; i++) {
    const day = addDays(ws, i), items = plan.filter(x => x.day === day);
    if (!items.length) continue;
    h += `<div class="day${day === today ? ' today' : ''}"><div class="dayh"><b>${md(day)} (${DOW[i]})</b></div>` + items.map(x => `<div class="item">
        <span class="tm">${esc(x.slot.end || '—')}</span><div style="flex:1;min-width:0"><div class="nm">${esc(x.dept.name || '(이름 없음)')}</div>${x.slot.label ? `<div class="tiny muted">${esc(x.slot.label)}</div>` : ''}</div>
        <span class="pill ${x.dept.role === 'write' ? 'ac' : 'mine'}">${x.dept.role === 'write' ? '내가 씀' : '봐 주기'}</span></div>`).join('') + '</div>';
  }
  return h + '<p class="tiny muted" style="text-align:center;margin-top:14px">좌우로 밀면 주가 바뀝니다 · 제출 여부는 교회 보고서 자료를 잇는 단계(W3)에서 붙습니다</p>';
}

// 부서 고르기 판 — 눌러서 넣는다. 교회 보고서에서 복사한 목록 · 자주 있는 이름 · 직접 쓰기

function addDept(name, role) {
  name = String(name || '').trim().slice(0, 40); if (!name) return;
  if (S.book.depts.some(d => d.name === name)) { toast(name + '\n이미 있습니다'); return; }
  S.book.depts.push({ id: newId('d'), name, role: role === 'view' ? 'view' : 'write', slots: [normSlot({ dow: 0 })] });
  saveBook(); rerender();
  toast(name + '\n' + (role === 'view' ? '봐 주는 부서' : '내가 쓰는 부서') + '로 넣었습니다\n모임 요일 · 시각을 맞춰 주세요');

function findDept(el) { const c = el.closest('[data-dept]'); return c ? S.book.depts.find(d => d.id === c.dataset.dept) : null; }

/* ---------- 누르기 · 고치기 ---------- */
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act],[data-tab]'); const menu = $('#menu');
  if (menu && !e.target.closest('#menu') && !(b && b.dataset.act === 'menu')) menu.remove();
  if (!b) return; const d = b.dataset;
  if (d.tab) { if (d.tab === PREF.tab) return; const a = TABS.findIndex(t => t.id === PREF.tab), z = TABS.findIndex(t => t.id === d.tab);
    return transit(z > a ? 1 : -1, () => { PREF.tab = d.tab; savePref(); markTab(); rerender(); scrollTo(0, 0); }); }
  const dept = findDept(b), slot = findSlot(b, dept);
  switch (d.act) {
    case 'switch': return openLayer('/cell/' + (DEMO ? '?demo=1' : ''));
    case 'wk': { const dir = +d.d; return transit(dir, () => { S.week = addDays(S.week, 7 * dir); rerender(); }); }
    case 'fb-login': return fbLogin();
    case 'fb-logout': return fbLogout();
    case 'pick-open': S.pick = d.role; rerender(); return;
    case 'pick-close': S.pick = null; rerender(); return;
    case 'pick': return addDept(d.name, S.pick);
    case 'pick-typed': { const i = $('#pk-new'); if (i && i.value.trim()) addDept(i.value, S.pick); return; }
    case 'pick-paste': { const t = $('#pk-paste'); const names = parseDeptList(t ? t.value : '');
      if (!names.length) { toast('부서 이름을\n찾지 못했습니다'); return; }
      S.book.catalog = [...new Set((S.book.catalog || []).concat(names))].slice(0, 80); saveBook(); rerender();
      toast('부서 ' + names.length + '개를\n목록으로 만들었습니다'); return; }
    case 'pick-clear': S.book.catalog = []; saveBook(); rerender(); return;
    case 'role': if (dept) { dept.role = d.v; saveBook(); rerender(); toast(dept.role === 'write' ? (dept.name || '이 부서') + '\n내가 쓰는 부서로 옮겼습니다' : (dept.name || '이 부서') + '\n봐 주는 부서로 옮겼습니다'); } return;
    case 'add-slot': if (dept) { dept.slots.push(normSlot({ dow: dept.slots.length ? dept.slots[dept.slots.length - 1].dow : 0 })); saveBook(); rerender(); } return;
    case 'del-slot': if (dept && slot) { dept.slots = dept.slots.filter(s => s !== slot); saveBook(); rerender(); } return;
    case 'del-dept': if (dept && confirm((dept.name || '이 부서') + ' 를 지울까요?')) { S.book.depts = S.book.depts.filter(x => x !== dept); saveBook(); rerender(); toast((dept.name || '부서') + '를\n지웠습니다'); } return;
    case 'nth': if (slot) { const n = d.n === 'last' ? 'last' : +d.n; slot.nth = slot.nth.includes(n) ? slot.nth.filter(x => x !== n) : slot.nth.concat(n); saveBook(); rerender(); } return;
    case 'upd': return checkUpdate(true);
    case 'menu': {
      if (menu) return menu.remove();
      const m = document.createElement('div'); m.className = 'menu'; m.id = 'menu';
      m.innerHTML = `<div class="info">${esc(FB.user ? FB.user.email : '로그인 전')}</div><button data-act="switch">셀 한눈에로</button>${DEMO ? '<button data-act="demo-off">미리보기 끝내기</button>' : '<button data-act="demo-on">지어낸 자료로 미리보기</button>'}`;
      b.parentElement.appendChild(m); return;
    }
    case 'demo-on': location.href = location.pathname + '?demo=1'; return;
    case 'demo-off': location.href = location.pathname; return;
  }
});
document.addEventListener('change', (e) => {
  const t = e.target; const f = t.dataset && t.dataset.f; if (!f) return;
  const dept = findDept(t); if (!dept) return; const slot = findSlot(t, dept);
  if (f === 'name') { dept.name = t.value.trim().slice(0, 40); saveBook(); return; }
  if (!slot) return;
  if (f === 'dow') slot.dow = +t.value;
  if (f === 'end') slot.end = t.value;
  if (f === 'freq') { slot.freq = t.value; if (slot.freq !== 'nth') slot.nth = []; if (slot.freq === 'biweekly' && !slot.anchor) slot.anchor = nextDow(slot.dow); }
  if (f === 'anchor') slot.anchor = t.value;
  if (f === 'label') slot.label = t.value.trim().slice(0, 40);
  Object.assign(slot, normSlot(slot)); saveBook();
  if (['dow', 'freq', 'anchor'].includes(f) || f === 'end') { const box = t.closest('[data-slot]'); if (box) box.outerHTML = slotRow(dept, slot); }
  else { const tx = t.closest('[data-slot]').querySelector('.tiny.muted:last-child'); if (tx) tx.textContent = slotText(slot); }
});
function nextDow(dow) { const t = todayYmd(); return addDays(t, (dow - dowOf(t) + 7) % 7); }
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'pk-new') { e.preventDefault(); if (e.target.value.trim()) addDept(e.target.value, S.pick); } if (e.key === 'Enter' && (e.target.id === 'fb-pw' || e.target.id === 'fb-em')) fbLogin(); if (e.key === 'Escape') { if ($('#layer')) return closeLayer(false); const m = $('#menu'); if (m) m.remove(); } });
addEventListener('resize', () => markTab());

/* ---------- 새 버전 (셀 한눈에와 같은 방법) ---------- */
async function checkUpdate(manual) {
  try {
    const r = await fetch(location.pathname + '?nc=' + Date.now(), { cache: 'no-store' });
    const m = (await r.text()).match(/const APP_VERSION = '([^']+)'/); if (!m) throw new Error('x');
    if (m[1] === APP_VERSION) { if (manual) toast('지금이 최신입니다\n' + APP_VERSION); return; }
    toast('새 버전 ' + m[1] + '\n받아서 다시 엽니다');
    setTimeout(() => location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]) + (DEMO ? '&demo=1' : '')), 900);
  } catch (_) { if (manual) toast('새 버전을 확인하지 못했습니다\n인터넷 연결을 확인해 주세요'); }
}
if (!EMBED) { setTimeout(() => checkUpdate(false), 4000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - (checkUpdate.at || 0) > 600000) { checkUpdate.at = Date.now(); checkUpdate(false); } }); }

/* ---------- 시작 ---------- */
if (DEMO) S.book = normBook({ at: 1, catalog: ['예배팀', '조명팀', '성찬위원', 'PD', '송번역팀', '부산 캠퍼스'], depts: [
  { name: '조명팀', role: 'write', slots: [{ dow: 0, end: '13:30', freq: 'weekly', label: '주일 2부' }] },
  { name: '성찬위원', role: 'write', slots: [{ dow: 0, end: '12:00', freq: 'nth', nth: [1], label: '첫째 주일 성찬' }] },
  { name: '새가족 환영팀', role: 'write', slots: [{ dow: 6, end: '15:00', freq: 'biweekly', anchor: addDays(weekStartSun(todayYmd()), 6) }] },
  { name: '송번역팀', role: 'view', slots: [{ dow: 3, end: '21:00', freq: 'weekly', label: '수요 기도회' }, { dow: 0, end: '13:30', freq: 'weekly', label: '주일 2부' }] },
  { name: '2부 예배팀', role: 'view', slots: [{ dow: 6, end: '19:00', freq: 'weekly', label: '리허설' }] }] });
renderShell();
fbInit().then(rerender).catch(() => {});
</script>
