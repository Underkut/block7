<!DOCTYPE html>
<!-- 공부 친구들 v. 26-1024-2 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#FFF8EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="공부 친구들">
<title>공부 친구들</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8EE;--ink:#2A2540;--sub:#6B6580;--muted:#8C8599;--line:#EFE4D2;--soft:#F2EFEA;--dash:#CFC3AE;--today:#FFC845;--sh:0 3px 0 var(--line);--card:#fff;--red:#FF6F59;--mint:#1FA88A;--sun:#FFC83D;--sky:#4C8DFF;--pur:#A66BFF;--mint-d:#137A63}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum',system-ui,sans-serif;font-size:15px;overscroll-behavior:none}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
.j{font-family:Jua,sans-serif;font-weight:normal}
.hide{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
/* 위 */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 8px;max-width:520px;margin:0 auto}
.ib{border:none;background:none;padding:6px;display:flex;position:relative}
.ib svg{width:24px;height:24px}
.ib.dot::after{content:'';position:absolute;top:4px;right:3px;width:9px;height:9px;border-radius:50%;background:var(--red)}
.h2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 2px 10px}
.h2 b{font-family:Jua;font-weight:normal;font-size:21px}
.h2 small{color:var(--sub);font-size:14px}
.sec{margin-top:26px}.sec>.h2:first-child{margin-top:0}
/* 퀘스트 */
.q{background:var(--card);border-radius:20px;padding:11px 12px;display:flex;align-items:center;gap:11px;border:2px solid var(--line);margin-bottom:9px}
.q.now{border:3px solid var(--ink)}
.q.done{background:#FBFAFF}
.sj{width:46px;height:46px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:Jua;font-size:16px}
.q .mid{flex:1;min-width:0}
.q .t{font-family:Jua;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q .s{font-size:13px;color:var(--sub)}
.go{border:2px solid var(--ink);background:var(--red);color:#fff;font-family:Jua;font-size:16px;border-radius:14px;padding:9px 13px;flex:none}
.go.mint{background:var(--mint)}
.chip{font-family:Jua;font-size:12px;border-radius:999px;padding:4px 9px;background:#F1EFF8;color:var(--sub);flex:none;text-align:center}
.chip.ok{background:#DDF5EE;color:var(--mint-d)}
.chip.sent{background:#FFF3D0;color:#6B4E0C}
.chip.redo{background:#FFE1D9;color:#8F2C17}
.stamp{width:44px;height:44px;border-radius:50%;border:2.5px dashed var(--red);color:var(--red);display:flex;align-items:center;justify-content:center;text-align:center;font-family:Jua;font-size:11px;line-height:1.1;transform:rotate(-8deg);flex:none;background:#fff}
.add{display:flex;gap:8px;margin-top:4px}
.add button{flex:1;border:2px dashed var(--dash);background:transparent;border-radius:999px;height:48px;padding:0 10px;font-family:Jua;font-size:15px;color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:22px 10px;line-height:1.6}
/* 아래 메뉴 */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 -1px 0 var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
.nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:Jua;font-size:13px;color:var(--sub);padding:4px}
.nav button.on{color:var(--red)}
.nav svg{width:25px;height:25px}
/* 칩 · 버튼 */
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{border:none;border-radius:999px;padding:6px 14px;background:transparent;font-family:Jua;font-size:15px}
.seg button.on{background:var(--ink);color:#fff}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:none;background:var(--soft);border-radius:999px;padding:10px 15px;font-family:Jua;font-size:15px}
.pill.on{background:var(--ink);color:#fff}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days button{height:48px;border-radius:14px;border:none;background:#fff;font-family:Jua;font-size:17px;color:var(--muted);box-shadow:0 2px 0 var(--line)}
.days button.on{background:var(--today);color:var(--ink)}
.big{width:100%;height:58px;border-radius:999px;border:none;background:var(--red);color:#fff;font-family:Jua;font-size:20px;box-shadow:0 4px 0 #D9523E;margin-top:6px}
.big.ghost{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.big.mint{background:#3CC7A8;box-shadow:0 4px 0 #23A086}
.big:disabled{opacity:.5}
.box{background:#fff;border-radius:20px;padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.lab{font-family:Jua;font-size:16px;margin:0 0 10px}
.hint{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.55}
.inp{width:100%;border:2px solid var(--line);border-radius:14px;padding:11px 14px;font-size:16px;background:#fff;outline:none}
.inp:focus{border-color:var(--ink)}
.num{width:76px;text-align:center}
.step{display:flex;align-items:center;justify-content:space-between;gap:8px}
.step button{width:40px;height:40px;border-radius:50%;border:none;background:var(--soft);font-family:Jua;font-size:20px;flex:none}
.step b{font-family:Jua;font-weight:normal;font-size:21px;text-align:center;flex:1}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.linkbtn{border:none;background:none;color:var(--sub);text-decoration:underline;font-size:14px;padding:10px;display:block;margin:4px auto 0}
.tip{background:#DDF5EE;color:#0F5E4C;border-radius:16px;padding:11px 13px;font-size:14px;line-height:1.5}
/* 전체 화면 창 */
.full{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(24px + env(safe-area-inset-bottom));display:none}
.full.on{display:block}
.fhead{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 8px 6px}
.fhead h1{margin:0;font-family:Jua;font-weight:normal;font-size:20px;text-align:center;flex:1}
.fx{width:44px;height:44px;border:none;background:none;display:flex;align-items:center;justify-content:center;flex:none}
.fx svg{width:18px;height:18px;stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linecap:round}
.gap44{width:44px;flex:none}
/* 알림 화면 */
#alarm{background:var(--ink);color:#fff;z-index:60}
#alarm .clock{font-family:Jua;font-size:64px;text-align:center;line-height:1;margin-top:calc(24px + env(safe-area-inset-top))}
#alarm .date{text-align:center;opacity:.85;margin-top:4px}
#alarm .pic{display:flex;justify-content:center;margin-top:6px;height:190px}
#alarm .card{margin:0 18px;background:#fff;color:var(--ink);border-radius:24px;padding:15px 17px;border:3px solid var(--sun)}
#alarm .card small{font-family:Jua;color:#2559B8;font-size:15px}
#alarm .card div{font-family:Jua;font-size:20px;line-height:1.4;margin-top:4px}
#alarm .snz{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 18px;margin-top:18px}
#alarm .snz button{height:50px;border-radius:14px;border:2px solid #9C95E0;background:transparent;color:#fff;font-family:Jua;font-size:17px}
#alarm .acts{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;padding:16px 18px}
#alarm .acts button{height:64px;border-radius:20px;border:3px solid #fff;background:transparent;color:#fff;font-family:Jua;font-size:20px}
#alarm .acts .st{background:var(--red);font-size:24px}
#alarm .late{display:block;margin:4px auto 0;border:none;background:none;color:#C9C3E8;text-decoration:underline;font-size:13px}
/* 타이머 */
#timer.pz{background:#FFF3D6}
.tring{position:relative;width:270px;height:270px;margin:12px auto 0}
.tring svg{width:270px;height:270px}
.tring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tring .clk{font-family:Jua;font-size:62px;line-height:1.05;font-variant-numeric:tabular-nums}
.tring small{color:var(--sub);font-size:14px}
/* 끝 화면 */
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.res button{height:46px;border-radius:14px;border:none;background:var(--soft);font-family:Jua;font-size:15px}
.res button.on{background:var(--ink);color:#fff}
.moods button.on{background:var(--sun);color:var(--ink)}
/* 계획 */
.wk{display:flex;gap:8px;align-items:stretch;border-radius:16px;padding:8px;margin-bottom:6px;background:#fff;box-shadow:0 2px 0 var(--line)}
.wk.today{box-shadow:inset 0 0 0 2.5px var(--today),0 2px 0 var(--line)}
.wk .d{width:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.wk .d b{font-family:Jua;font-weight:normal;font-size:16px}
.wk .d small{font-size:12px;color:var(--sub)}
.wk .cs{flex:1;display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:30px}
.wk .c{font-size:13px;border-radius:10px;padding:5px 8px}
.wk .c.dn{text-decoration:line-through;opacity:.7}
.wk .rest{color:var(--muted);font-size:13px}
.pnav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px}
.pnav b{font-family:Jua;font-weight:normal;font-size:18px}
.nv{width:44px;height:44px;border:none;border-radius:50%;background:#fff;box-shadow:0 2px 0 var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px;color:var(--sub)}
.lg span{display:flex;align-items:center;gap:5px}
.lg i{width:14px;height:14px;border-radius:4px;background:var(--soft);position:relative}
.lg i.dn{background:var(--mint)}.lg i.pt{background:#BDE9DC}
.lg i.pl::after,.lg i.ok::after{content:'';position:absolute;left:4px;top:4px;width:6px;height:6px;border-radius:50%;background:var(--muted)}
.lg i.ok{background:var(--mint)}.lg i.ok::after{background:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .hd{font-family:Jua;color:var(--sub);font-size:13px;padding:2px 0}
.cal button{height:44px;border-radius:12px;border:none;background:var(--soft);font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.cal button i{width:6px;height:6px;border-radius:50%;background:transparent}
.cal button.pl i{background:var(--muted)}
.cal button.dn{background:var(--mint);color:#fff;font-family:Jua}
.cal button.pt{background:#BDE9DC}
.cal button.ok i{background:#fff}
.cal button.td{box-shadow:inset 0 0 0 2.5px var(--today)}
.cal span.blank{height:44px}
.bk{background:#fff;border-radius:20px;box-shadow:var(--sh);padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.bk .bar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:8px}
.bk .bar i{display:block;height:100%;background:var(--sky)}
.bk.off{opacity:.55}
.chs .chr{display:grid;grid-template-columns:1fr 64px 64px 34px;gap:6px;margin-bottom:6px;align-items:center}
.chs .chr input{padding:8px;font-size:15px}
.chs .chr button{border:none;background:none;font-size:18px;color:var(--sub)}
/* 보상함 */
.grant{background:var(--sun);box-shadow:0 3px 0 #E0A400;border-radius:22px;padding:13px 15px;margin-bottom:10px;position:relative;overflow:hidden}
.grant small{font-size:13px}
.grant b{display:block;font-family:Jua;font-weight:normal;font-size:23px}
.grant.used{background:#F1EFF8;opacity:.75}
.prm .bars{display:flex;gap:4px;margin-top:8px}
.prm .bars i{flex:1;height:12px;border-radius:6px;background:var(--soft)}
.prm .bars i.on{background:#FF8FA3}
/* 알림 띠 */
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:max-content;white-space:pre-line;background:var(--ink);color:#fff;border-radius:16px;padding:11px 16px;font-size:15px;max-width:88vw;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center;line-height:1.4}
#toast.on{opacity:1}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
/* ── S-8 단순하게 (HB 2026-10-21, 시안 ACuDYseEggkMx4Bm2tgqmD) ── */
.nav{grid-template-columns:repeat(2,1fr)}
.top{padding-top:calc(22px + env(safe-area-inset-top));padding-bottom:4px;align-items:flex-end}
.hi small{display:block;font-size:14px;color:var(--sub)}
.hi b{font-family:Jua;font-weight:normal;font-size:28px;line-height:1.2}
.hi .bk{border:none;background:none;font-family:Jua;font-size:17px;color:var(--sub);padding:6px 0;display:flex;align-items:center;gap:2px}
.starchip{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:7px 14px;box-shadow:0 2px 0 var(--line);font-family:Jua;font-size:19px}
.say2{display:flex;align-items:center;gap:12px;background:#fff;border-radius:24px;padding:10px 16px 10px 10px;box-shadow:0 3px 0 var(--line);margin-top:10px}
.say2 .me{width:62px;flex:none}
.say2 p{margin:0;font-size:16px;line-height:1.5}
.say2 p b{font-family:Jua;font-weight:normal;color:var(--red)}
.q{border:none;border-radius:22px;padding:14px;gap:13px;box-shadow:0 3px 0 var(--line);margin-bottom:11px}
.q.now{box-shadow:0 0 0 3px var(--ink)}
.q.done{background:#F4EEE4;box-shadow:none}
.q.done .t{color:#8C8599;text-decoration:line-through}
.q .sj{width:52px;height:52px;border-radius:16px;font-size:17px}
.q .t{font-size:18px;white-space:normal}
.q .s{font-size:14px;margin-top:2px}
.go{border:none;border-radius:999px;min-width:76px;height:48px;padding:0 16px;font-size:18px;box-shadow:0 3px 0 #D9523E}
.go.mint{background:#3CC7A8;box-shadow:0 3px 0 #23A086}
.addone{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px auto 0;height:50px;padding:0 26px;border-radius:999px;border:2px dashed var(--dash);background:transparent;color:var(--sub);font-family:Jua;font-size:18px}
.addone svg{width:20px;height:20px}
/* 숙제는 언제 — 처음 한 번 묻는 칸 · 설정의 두 갈래 (샤론 1024 ②) */
.pick{background:#FFF4D6;border-radius:22px;padding:16px;margin-top:14px}
.pick>b{display:block;font-family:Jua;font-weight:normal;font-size:19px}
.pick>p{margin:4px 0 12px;font-size:14px;color:var(--sub);line-height:1.5}
.pick2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick2 button{border:none;background:#fff;border-radius:16px;padding:12px 6px;box-shadow:0 3px 0 #F0DDA8;display:flex;flex-direction:column;align-items:center;gap:3px}
.pick2 button b{font-family:Jua;font-weight:normal;font-size:18px}
.pick2 small{font-size:13px;color:var(--sub)}
.pick.nudge{animation:nudge .45s}
@keyframes nudge{20%{transform:translateX(-6px)}45%{transform:translateX(5px)}70%{transform:translateX(-3px)}}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--soft);border-radius:14px;padding:4px}
.seg2 button{height:42px;border:none;border-radius:11px;background:transparent;font-family:Jua;font-size:16px;color:var(--sub)}
.seg2 button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(42,37,64,.12)}
.addrow{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:48px;border-radius:14px;border:2px dashed var(--dash);background:transparent;color:var(--sub);font-family:Jua;font-size:16px}
.addrow svg{width:18px;height:18px}
input.sw{appearance:none;-webkit-appearance:none;flex:none;width:48px;height:28px;border-radius:999px;background:#E3DCD0;position:relative;margin:0;transition:background .2s;cursor:pointer}
input.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s cubic-bezier(.22,.8,.24,1)}
input.sw:checked{background:#3CC7A8}
input.sw:checked::after{transform:translateX(20px)}
#stKind .pill{background:#fff;box-shadow:0 2px 0 var(--line)}
#stKind .pill.on{background:#FFF0C2;color:var(--ink);box-shadow:inset 0 0 0 2.5px var(--today)}
.hwwk{display:flex;align-items:center;gap:4px}.hwwk .days7{flex:1;min-width:0}.hwwk>button{flex:none;width:30px;height:48px;border:none;background:transparent;color:var(--sub);font-size:24px}
.days7 button small{display:block;font-size:11px;font-family:inherit;opacity:.8}.days7 button:disabled{opacity:.35}
.hwnote{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:rgba(40,30,20,.35);padding:16px}
.hwnote>div{background:#fff;border-radius:22px;padding:22px 20px 16px;max-width:340px;width:100%;text-align:center;font-size:16px;line-height:1.6;white-space:pre-line}
.hwnote button{margin-top:14px;height:46px;width:100%;border:none;border-radius:999px;background:var(--ink);color:#fff;font-family:Jua;font-size:17px}
.dk{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:7px;background:#FFE9B8;color:#9A6A00;margin-right:2px}
/* 넣기 */
.sjp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.quick button{height:38px;padding:0 14px;border-radius:999px;border:none;background:#F2EFEA;color:var(--sub);font-size:14px}

.morebtn{width:100%;display:flex;align-items:center;justify-content:space-between;height:52px;border-radius:16px;border:none;background:#fff;padding:0 16px;font-size:15px;color:var(--sub);box-shadow:0 2px 0 var(--line);margin-top:16px}
.bigq{width:100%;height:60px;border-radius:999px;border:none;background:var(--red);color:#fff;font-family:Jua;font-size:22px;box-shadow:0 4px 0 #D9523E;margin-top:18px}
/* 공부 중 */
#timer{background:#E3F1FF}
#timer.pz{background:#FFF3D6}
#timer.dn{background:#FFF4D6}
.tz{display:flex;flex-direction:column;align-items:center;gap:12px;min-height:100vh;padding:calc(10px + env(safe-area-inset-top)) 0 calc(28px + env(safe-area-inset-bottom))}
.tz-top{align-self:stretch;display:flex;justify-content:flex-end}

<body>
<div class="top" id="top"></div>
<main class="wrap" id="main"></main>
<nav class="nav" aria-label="아래 메뉴"><button data-tab="today" class="on">오늘</button><button data-tab="reward">내 별</button></nav>
<div class="full" id="sheet"></div>
<div class="full" id="timer"></div>
<div class="full" id="alarm"></div>
<div class="full" id="parent"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script id="study-core">
/* 공부 친구들 — 화면 없이 도는 덩어리. tests/test_study.js 가 이 덩어리만 떼어 시험한다.
 * 날짜는 모두 이 기기의 하루('YYYY-MM-DD'). 쪽은 언제나 '쪽' 으로 저장하고, '장' 은 보여 주는 단위일 뿐이다(1장 = ppj 쪽). */
const STUDY_KEY = 'study.v1';
const SUBJ = [
  {k:'kor', n:'국어', bg:'#FFE1D9', fg:'#8F2C17'},
  {k:'math', n:'수학', bg:'#DCE8FF', fg:'#1D4A9C'},
  {k:'eng', n:'영어', bg:'#EEE3FF', fg:'#55279F'},
  {k:'sci', n:'과학', bg:'#D8F3EA', fg:'#0F5E4C'},
  {k:'soc', n:'사회', bg:'#FFF0CC', fg:'#6B4E0C'},
  {k:'etc', n:'기타', bg:'#ECEAF5', fg:'#3E3870'}
];
const subjOf = k => SUBJ.find(s => s.k === k) || SUBJ[SUBJ.length - 1];
/* 내가 만든 과목 (샤론 2026-10-24) — st.subjects = [{k:'u…', n}]. '기타' 는 고르는 줄에서 빠지고, 옛 기록 · 모르는 과목의 자리로만 남는다(늘 맨 끝) */
const SUBJ_BASE = SUBJ.slice();
const SUBJ_PAL = [['#FFE4F1', '#8E1F5A'], ['#E2F4D9', '#2F6417'], ['#DDF3FA', '#11576B'], ['#FCE7D2', '#7A3D07'], ['#E8E6FF', '#3B33A0'], ['#F4E9DC', '#5E4426']];
function setSubjects(list) {
  SUBJ.length = 0; SUBJ.push(...SUBJ_BASE.slice(0, -1));
  (list || []).forEach((x, i) => { const c = SUBJ_PAL[i % SUBJ_PAL.length]; SUBJ.push({k: x.k, n: x.n, bg: c[0], fg: c[1]}); });
  SUBJ.push(SUBJ_BASE[SUBJ_BASE.length - 1]);
}
const pickSubj = () => SUBJ.filter(x => x.k !== 'etc');
function addSubject(st, name) {
  const n = String(name || '').trim().slice(0, 8); if (!n) return null;
  const has = SUBJ.find(x => x.n === n && x.k !== 'etc'); if (has) return has.k;
  const k = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  st.subjects = (st.subjects || []).concat({k, n}); setSubjects(st.subjects); return k;
}
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const COIN_DONE = 10;              // 퀘스트 하나 끝내고 적으면 (하루 한 퀘스트에 한 번)
const SNOOZE_MIN = [1, 5, 10, 15];
const ALARM_LATE_MIN = 90;         // 정한 시각에서 이만큼 지나면 더는 알림 화면을 띄우지 않는다

const pad2 = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const dowOf = s => parseYmd(s).getDay();
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
const hmToMin = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ''); return m && +m[1] < 24 && +m[2] < 60 ? (+m[1]) * 60 + (+m[2]) : null; };
const atOf = (date, t) => { const m = hmToMin(t); if (m === null) return null; const d = parseYmd(date); d.setMinutes(m); return d.getTime(); };
const sid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clampInt = (v, lo, hi, def) => { v = Math.round(Number(v)); return Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : def; };

function blankState() {
  return {v: 1, books: [], tasks: [], sessions: [], run: null, snooze: {}, dismiss: {}, coins: 0, spent: 0,
    applied: [], promisesSeen: [], subjects: [], hw: [], hwMode: '', hwSeen: '', kind: 'rabbit', nick: '', made: Date.now(), sfx: true, lastBackup: 0};
}
function normBook(b) {
  if (!b || typeof b !== 'object' || !b.id || !b.name) return null;
  const open = b.open === true;   // 간단 등록: 전체 쪽 · 현재 쪽 없이 '하루 분량'만
  const first = open ? 1 : clampInt(b.first, 1, 2000, 1), last = open ? 3000 : clampInt(b.last, first, 3000, Math.max(first, 100));
  return {
    id: String(b.id), open, simple: open && b.simple === true, subj: subjOf(b.subj).k, name: String(b.name).slice(0, 30),   // simple: '넣기' 로 만든 것 — 이름이 곧 할 것(분량을 따로 안 보임, S-8)
    unit: b.unit === 'j' ? 'j' : 'p', ppj: clampInt(b.ppj, 1, 8, 2),
    first, last, cur: clampInt(b.cur, first, last + 1, first),
    perDay: clampInt(b.perDay, 1, 200, 2),
    days: [...new Set((Array.isArray(b.days) ? b.days : []).map(Number).filter(d => d >= 0 && d <= 6))].sort(),
    time: hmToMin(b.time) === null ? '' : b.time, dur: clampInt(b.dur, 0, 240, 30),
    chapters: open ? [] : (Array.isArray(b.chapters) ? b.chapters : []).filter(c => c && c.t).map(c => ({t: String(c.t).slice(0, 30), from: clampInt(c.from, 1, 3000, 1), to: clampInt(c.to, 1, 3000, 1)})),
    active: b.active !== false, made: b.made || ''
  };
}
function normState(o) {
  const s = blankState();
  if (!o || typeof o !== 'object') { setSubjects([]); return s; }
  const ks = new Set();
  s.subjects = (Array.isArray(o.subjects) ? o.subjects : []).filter(x => x && /^u[a-z0-9]{1,20}$/.test(x.k) && x.n && !ks.has(x.k) && ks.add(x.k))
    .slice(0, 30).map(x => ({k: x.k, n: String(x.n).slice(0, 8)}));
  setSubjects(s.subjects);   // 책 · 숙제의 과목을 고치기 전에 — 내가 만든 과목이 '기타' 로 바뀌지 않게
  const isD = v => /^\d{4}-\d{2}-\d{2}$/.test(v || '');
  s.hw = (Array.isArray(o.hw) ? o.hw : []).filter(h => h && h.id && h.title && isD(h.doDate))
    .map(h => ({id: String(h.id), title: String(h.title).slice(0, 40), subj: subjOf(h.subj).k, due: isD(h.due) ? h.due : '', doDate: h.doDate, done: isD(h.done) ? h.done : ''}));
  s.hwMode = o.hwMode === 'eve' || o.hwMode === 'day' ? o.hwMode : '';   // '' = 아직 안 고름 → 오늘 화면에 고르는 칸 (옛 'now' 는 저절로 들어간 값이라 다시 묻는다)
  s.hwSeen = isD(o.hwSeen) ? o.hwSeen : '';
  s.books = (Array.isArray(o.books) ? o.books : []).map(normBook).filter(Boolean);
  s.tasks = (Array.isArray(o.tasks) ? o.tasks : []).filter(t => t && t.id && t.title && /^\d{4}-\d{2}-\d{2}$/.test(t.date))
    .map(t => ({id: String(t.id), title: String(t.title).slice(0, 40), date: t.date, time: hmToMin(t.time) === null ? '' : t.time, dur: clampInt(t.dur, 0, 240, 0), subj: subjOf(t.subj).k}));
  s.sessions = (Array.isArray(o.sessions) ? o.sessions : []).filter(x => x && x.id && x.key && x.date);
  s.run = o.run && o.run.key ? o.run : null;
  ['snooze', 'dismiss'].forEach(k => { s[k] = o[k] && typeof o[k] === 'object' ? o[k] : {}; });
  s.coins = clampInt(o.coins, 0, 1e7, 0); s.spent = clampInt(o.spent, 0, 1e7, 0);
  s.applied = Array.isArray(o.applied) ? o.applied.slice(-2000) : [];
  s.promisesSeen = Array.isArray(o.promisesSeen) ? o.promisesSeen : [];
  ['kind', 'nick', 'made', 'lastBackup'].forEach(k => { if (o[k] !== undefined) s[k] = o[k]; });
  s.sfx = o.sfx !== false;
  if (o.bak && /^\d{6}$/.test(o.bak.d) && Number.isInteger(o.bak.n) && o.bak.n > 0) s.bak = {d: o.bak.d, n: o.bak.n};   // 백업 번호표 (D-4)
  return s;
}

/* 백업 파일 이름 (D-4, HB 2026-10-21 — 다섯 앱 같은 양식)
   St-{아이디 앞 3글자}-{기기}-{YY}-{MMDD}-{그날 번호}.json   예) St-jim-phn-26-1021-1.json
   번호표 st.bak = {d:'YYMMDD', n} 는 기록과 함께 클라우드 사본에 실려, 같은 아이 계정으로 들어온 다른 기기에서도 이어진다.
   오프라인(가족 연결 안 됨 · 인터넷 끊김)이면 번호 대신 off+HHMM — 번호표는 그대로.
   ⚠️ 이름은 누른 순간 동기로 정한다(아이폰 공유 시트는 await 뒤면 거절된다).
   기기: 아이패드 · 안드로이드 태블릿 = pad, 아이폰 · 안드로이드 폰 = phn, 그 밖 = pc */
function bakDevice(ua, touch, sw, sh) {
  const u = ua || '', t = (touch || 0) > 1;
  if (/iPad/.test(u) || (/Macintosh/.test(u) && t)) return 'pad';
  if (/iPhone|iPod/.test(u)) return 'phn';
  if (/Android/.test(u)) return /Mobile/.test(u) ? 'phn' : 'pad';
  if (t && !/Windows|Macintosh|X11|CrOS/.test(u)) { const m = Math.min(sw || 0, sh || 0); if (m) return m < 600 ? 'phn' : 'pad'; }
  return 'pc';
}
function bakName(st, o) {
  const d = o.now, p2 = n => String(n).padStart(2, '0');
  const yy = String(d.getFullYear()).slice(-2), md = p2(d.getMonth() + 1) + p2(d.getDate());
  const tag = (String(o.email || '').split('@')[0].replace(/[^a-zA-Z0-9]/g, '').slice(0, 3) || 'usr').toLowerCase();
  const head = 'St-' + tag + '-' + o.dev + '-' + yy + '-' + md;
  if (!o.online) return head + '-off' + p2(d.getHours()) + p2(d.getMinutes()) + '.json';
  const key = yy + md, n = (st.bak && st.bak.d === key ? st.bak.n : 0) + 1;
  st.bak = {d: key, n};
  return head + '-' + n + '.json';
}

/* 쪽 · 장 표시 */
const pagesOf = (from, to) => Math.max(0, to - from + 1);
function amountText(book, from, to) {
  const n = pagesOf(from, to);
  if (book.unit === 'j') { const j = n / book.ppj; return (Number.isInteger(j) ? j : j.toFixed(1)) + '장'; }
  return n + '쪽';
}
function rangeText(book, from, to) {
  if (book.open) return amountText(book, from, to);
  const r = from === to ? from + '쪽' : from + '~' + to + '쪽';
  return book.unit === 'j' ? amountText(book, from, to) + ' (' + r + ')' : r;
}
const perDayText = b => b.unit === 'j' ? (b.perDay / b.ppj) + '장' : b.perDay + '쪽';
function chapterOf(book, page) { return book.chapters.find(c => page >= c.from && page <= c.to) || null; }

/* 계획 → 날짜별 분량. 오늘 아직 안 한 몫은 오늘 자리에 남고, 그 뒤 요일마다 perDay 씩 앞으로 간다 */
const keyOfBook = b => 'b:' + b.id, keyOfTask = t => 't:' + t.id;
const sessionsOn = (st, key, date) => st.sessions.filter(x => x.key === key && x.date === date);
function projectBook(st, book, today, nDays) {
  const out = {};
  if (!book.active || !book.days.length) return out;
  let cur = book.cur;
  for (let i = 0; i < nDays; i++) {
    const d = addDays(today, i);
    if (!book.days.includes(dowOf(d))) continue;
    if (i === 0) {
      const done = sessionsOn(st, keyOfBook(book), d);
      if (done.length) { const s = done[done.length - 1]; out[d] = {from: s.from, to: s.to, done: true, sess: s}; continue; }
    }
    if (cur > book.last) break;
    const to = Math.min(book.last, cur + book.perDay - 1);
    out[d] = {from: cur, to, done: false};
    cur = to + 1;
  }
  return out;
}
function finishDate(st, book, today) {
  if (book.open) return null;
  if (book.cur > book.last) return null;
  if (!book.days.length || !book.active) return null;
  const left = book.last - book.cur + 1, per = book.perDay, need = Math.ceil(left / per);
  let n = 0;
  for (let i = 0; i < 3650; i++) {
    const d = addDays(today, i);
    if (!book.days.includes(dowOf(d))) continue;
    if (i === 0 && sessionsOn(st, keyOfBook(book), d).length) continue;   // 오늘 몫은 이미 했다
    if (++n >= need) return d;
  }
  return null;
}
/* 그날의 퀘스트 목록 (문제집 + 한 번짜리 숙제). 오늘 이전은 기록만, 오늘·앞날은 계획 */
function questsFor(st, date, today) {
  const q = [];
  st.books.forEach(b => {
    const key = keyOfBook(b), done = sessionsOn(st, key, date);
    let p = null;
    if (date < today) { if (done.length) { const s = done[done.length - 1]; p = {from: s.from, to: s.to, done: true, sess: s}; } }
    else p = projectBook(st, b, today, daysBetween(today, date) + 1)[date] || null;
    if (!p) return;
    const ch = chapterOf(b, p.from);
    q.push({key, kind: 'book', book: b, subj: b.subj, date, from: p.from, to: p.to, done: p.done, sess: p.sess || null,
      title: b.name, sub: b.simple ? '' : (ch ? ch.t + ' · ' : '') + rangeText(b, p.from, p.to), time: b.time, dur: b.dur});
  });
  st.tasks.filter(t => t.date === date).forEach(t => {
    const key = keyOfTask(t), done = sessionsOn(st, key, date);
    q.push({key, kind: 'task', task: t, subj: t.subj, date, done: done.length > 0, sess: done[done.length - 1] || null,
      title: t.title, sub: '한 번짜리 숙제', time: t.time, dur: t.dur});
  });
  return q.sort((a, b) => (a.done - b.done) || ((hmToMin(a.time) ?? 9999) - (hmToMin(b.time) ?? 9999)));
}

/* 퀘스트 하나 자세히 — 끝낸 기록 보기 · 지우기 / 숙제 고치기 */

    showAlarm(qq, q.get('act') === 'snooze');
  } else if (go === 'review' && isParentView()) { PAR.tab = 'todo'; showParent(); }
  else if (go === 'reward') { TAB = 'reward'; render(); }
}
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.go) handleGo(e.data.go); });
if (location.search.includes('go=')) { const u = location.href; history.replaceState(null, '', location.pathname); setTimeout(() => handleGo(u), 700); }
// 공부를 끝내거나 계획이 바뀌면 예약을 다시 맞춘다 (cloudPush 뒤에 불린다). 하루가 바뀌어도 한 번.
setInterval(() => { if (isKid() && FAM.push) syncReminders(); }, 6 * 3600e3);

/* ───────── 보상 (S-5) — 별 · 약속 · 허락권 ─────────
 * 허락권 = 용돈 친구들 우체통(families/{f}/msgs)의 type:'grant' 쪽지. 부모님만 만든다.
 *   kind:'allow' 내 돈으로 사도 된다는 허락(text, amt=한도) · kind:'money' 용돈 +amt원 (용돈 친구들이 '받을 예정 돈' 으로 한 번만 넣는다)
 *   용돈 친구들에서 썼어요 → doneAt. 공부 친구들은 읽기만 한다. */
const GRANT_PRESET = [['', '없음'], ['allow|간식 하나 허락|3000', '간식 하나 허락'], ['money|용돈|1000', '용돈 +1,000원'], ['allow|게임 30분 허락|0', '게임 30분'], ['custom', '직접 쓰기…']];
const grantLine = g => (g.kind === 'money' ? '용돈 +' + nf(g.amt) + '원' : esc(g.text) + (g.amt ? ' (' + nf(g.amt) + '원까지)' : ''));
function rewardExtra() {
  if (!isKid()) return `<div class="box" style="margin-top:12px;font-size:14px;line-height:1.6">설정 → <b>아이 계정으로 로그인</b> 하면 부모님이 보내 준 <b>허락권</b>과 <b>약속</b>이 여기에 모여요.</div>`;
  const open = GRANTS.filter(g => !g.doneAt), used = GRANTS.filter(g => g.doneAt).slice(0, 5);
  const prom = PROMS.filter(p => p.status !== 'given');
  return `<div class="h2"><b>허락권</b><small>용돈 친구들에서 써요</small></div>
    ${open.length ? open.map(g => `<div class="grant"><small>${esc(g.fromName || '부모님')}가 보낸 허락권 · ${md(ymd(new Date(g.at || Date.now())))}</small><b>${grantLine(g)}</b>${g.until ? `<small>${md(g.until)}까지</small>` : ''}</div>`).join('') : '<div class="empty">아직 없어요. 부모님이 확인할 때 보내 줄 수 있어요</div>'}
    ${used.length ? used.map(g => `<div class="grant used"><small>썼어요</small><b style="font-size:17px">${grantLine(g)}</b></div>`).join('') : ''}
    <div class="h2"><b>모으는 중인 약속</b></div>
    ${prom.length ? prom.map(p => { const pr = promiseProgress(S, p); return `<div class="box prm"><div class="row" style="justify-content:space-between"><b class="j" style="font-size:16px">${esc(p.title)}</b><small style="flex:none;color:var(--sub)">${esc(p.byName || '부모님')}와 약속</small></div>
      <div class="hint" style="margin-top:2px">확인 받은 퀘스트 ${p.need}개${p.reward ? ' → ' + esc(p.reward) : ''}</div><div class="bars">${[...Array(Math.min(p.need, 20))].map((_, i) => `<i class="${i < Math.round(pr.n / p.need * Math.min(p.need, 20)) ? 'on' : ''}"></i>`).join('')}</div>
      <div class="row" style="justify-content:space-between;margin-top:6px"><small style="color:var(--sub)">${pr.n} / ${p.need}</small>${pr.done ? `<button class="go mint" data-a="promTell" data-p="${p.id}" style="flex:none">다 모았어요! 알리기</button>` : '<span></span>'}</div></div>`; }).join('') : '<div class="empty">부모님과 약속을 정하면 여기에 보여요</div>'}`;
}
function onRewardAction(a) {
  if (a.dataset.a === 'promTell') { const p = PROMS.find(x => x.id === a.dataset.p); ping('/promise', {kidId: FAM.kidId, pid: a.dataset.p}); toast('부모님께 알렸어요!'); confetti(); sfx('win'); if (p) a.disabled = true; }
}
/* 부모님: 확인 카드의 허락권 고르기 */
function grantChips() {
  return `<div class="pnote" style="margin-top:10px">허락권 얹기 (용돈 친구들로 가요)</div><div class="pchips" data-g="grant">${GRANT_PRESET.map((g, i) => `<button data-v="${g[0]}" class="${i ? '' : 'on'}">${g[1]}</button>`).join('')}</div>`;
}
function askGrant(v) {
  if (v === 'custom') {
    const text = prompt('무엇을 허락할까요? (예: 머리핀 사도 돼요)'); if (!text) return null;
    const amt = parseInt(prompt('얼마까지? (숫자만, 없으면 0)', '0') || '0', 10) || 0;
    return {kind: 'allow', text: text.trim().slice(0, 30), amt};
  }
  const [kind, text, amt] = v.split('|'); return {kind, text, amt: +amt || 0};
}
async function grantSend(kidId, g, ref) {
  const t = todayStr(), until = addDays(t, (7 - dowOf(t)) % 7);   // 이번 주 일요일까지
  await FB.db.collection('families/' + FAM.fid + '/msgs').add({kidId, from: 'parent', fromName: FAM.pname || '부모님', type: 'grant', kind: g.kind, text: g.text, amt: g.amt || 0,
    until, src: 'study', ref: ref || '', status: 'ok', okName: FAM.pname || '부모님', readKid: false, readPar: true, sticker: '', at: FB.fv.serverTimestamp()})
    .then(r => wping(r.id));
}
/* 용돈 친구들 알림 서버에도 알린다 → 아이 폰의 용돈 친구들로 '허락권이 왔어요' 푸시 */
async function wping(id) {
  try { const u = FB.auth.currentUser; if (!u) return;
    await fetch(window.STUDY_EMU ? 'http://127.0.0.1:5001/block7-8f24e/asia-northeast3/walletPing/msg' : 'https://asia-northeast3-block7-8f24e.cloudfunctions.net/walletPing/msg',
      {method: 'POST', headers: {'Content-Type': 'application/json', Authorization: 'Bearer ' + await u.getIdToken()}, body: JSON.stringify({fid: FAM.fid, id})}); } catch (e) {}
}
async function grantFromCard(card, sid) {
  const b = card.querySelector('[data-g="grant"] .on'); if (!b || !b.dataset.v) return;
  const g = askGrant(b.dataset.v); if (!g) return;
  await grantSend(PAR.sel, g, sid);
}
function parentReward(body, st) {
  const L = levelOf(starsOf(st)), proms = PAR.proms.filter(p => p.kidId === PAR.sel), grants = PAR.grants.filter(g => g.kidId === PAR.sel).sort((a, b) => b.at - a.at);
  body.innerHTML = `<div class="pc"><h3>지금</h3><div class="kv"><span>레벨</span><span>Lv.${L.lv} ${esc(L.title)} (다음까지 별 ${L.need - L.rem}개)</span><span>별</span><span>${starsOf(st)}개</span><span>코인</span><span>${nf(coinsLeft(st))}개 (꾸미기에 써요)</span></div></div>
    <div class="pc"><h3>약속 모으기</h3>${proms.length ? `<table><tbody>${proms.map(p => { const pr = promiseProgress(st, p); return `<tr><td>${esc(p.title)}${p.reward ? '<br><span class="pnote">' + esc(p.reward) + '</span>' : ''}</td><td>${pr.n} / ${p.need}</td><td style="text-align:right">${p.status === 'given' ? '<span class="pnote">줬어요</span>' : pr.done ? `<button class="pbtn dk" data-give="${p.id}">허락권 주기</button>` : `<button class="pbtn" data-pdel="${p.id}">지우기</button>`}</td></tr>`; }).join('')}</tbody></table>` : '<p class="pnote">아직 없어요</p>'}
      <div style="display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:10px"><input class="pinp" id="prT" maxlength="24" placeholder="약속 — 예) 머리핀 사도 돼요"><input class="pinp" id="prN" inputmode="numeric" placeholder="퀘스트 수" value="10"></div>
      <div class="pchips" data-g="pg" style="margin-top:8px">${GRANT_PRESET.slice(1).map((g, i) => `<button data-v="${g[0]}" class="${i ? '' : 'on'}">${g[1]}</button>`).join('')}</div>
      <button class="pbtn dk" id="prAdd" style="width:100%;margin-top:10px">약속 만들기</button><p class="pnote" style="margin-top:6px">만든 뒤에 부모님이 확인한 퀘스트만 세요. 다 모이면 여기서 허락권을 줘요.</p></div>
    <div class="pc"><h3>허락권</h3>${grants.length ? `<table><tbody>${grants.slice(0, 15).map(g => `<tr><td>${md(ymd(new Date(g.at || Date.now())))}</td><td>${grantLine(g)}</td><td>${g.doneAt ? '썼어요' : '안 씀'}</td></tr>`).join('')}</tbody></table>` : '<p class="pnote">아직 없어요</p>'}
      <div class="pchips" data-g="ng" style="margin-top:10px">${GRANT_PRESET.slice(1).map((g, i) => `<button data-v="${g[0]}" class="${i ? '' : 'on'}">${g[1]}</button>`).join('')}</div><button class="pbtn" id="grNow" style="width:100%;margin-top:8px">허락권 바로 보내기</button>
      <p class="pnote" style="margin-top:6px">허락권은 아이 폰의 <b>용돈 친구들</b> 우체통으로 가요. '용돈 +N원' 은 받을 예정 돈으로 들어가요.</p></div>`;
  body.querySelectorAll('.pchips').forEach(g => g.onclick = e => { const b = e.target.closest('button'); if (!b) return; g.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); });
  const pickG = g => { const b = body.querySelector('[data-g="' + g + '"] .on'); return b ? askGrant(b.dataset.v) : null; };
  $('prAdd').onclick = async () => { const title = $('prT').value.trim(), need = Math.max(1, Math.min(100, parseInt($('prN').value, 10) || 10)); if (!title) { toast('약속을 써 주세요'); return; }
    const g = pickG('pg'); if (!g) return;
    try { await FB.db.collection('families/' + FAM.fid + '/spromises').add({kidId: PAR.sel, title, need, reward: g.kind === 'money' ? '용돈 +' + nf(g.amt) + '원' : g.text, grant: g, byName: FAM.pname || '부모님', status: 'open', at: FB.fv.serverTimestamp()}); toast('약속을 만들었어요'); }
    catch (e) { toast(fbErr(e)); } };
  body.querySelectorAll('[data-give]').forEach(b => b.onclick = async () => { const p = PAR.proms.find(x => x.id === b.dataset.give); if (!p) return; b.disabled = true;
    try { await grantSend(PAR.sel, p.grant || {kind: 'allow', text: p.title, amt: 0}, 'p:' + p.id); await FB.db.doc('families/' + FAM.fid + '/spromises/' + p.id).update({status: 'given'}); toast('허락권을 보냈어요!'); }
    catch (e) { toast(fbErr(e)); b.disabled = false; } });
  body.querySelectorAll('[data-pdel]').forEach(b => b.onclick = async () => { if (!confirm('이 약속을 지울까요?')) return; try { await FB.db.doc('families/' + FAM.fid + '/spromises/' + b.dataset.pdel).delete(); } catch (e) { toast(fbErr(e)); } });
  $('grNow').onclick = async () => { const g = pickG('ng'); if (!g) return; if (!confirm(kidName(PAR.sel) + '에게 "' + (g.kind === 'money' ? '용돈 +' + nf(g.amt) + '원' : g.text) + '" 허락권을 보낼까요?')) return;
    try { await grantSend(PAR.sel, g, ''); toast('보냈어요!'); } catch (e) { toast(fbErr(e)); } };
}
/* ───────── 시작 ───────── */
document.querySelector('[data-tab="today"]').insertAdjacentHTML('afterbegin', ICO.home);
document.querySelector('[data-tab="reward"]').insertAdjacentHTML('afterbegin', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.6l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"/></svg>');
cleanOld(S, todayStr()); save();
render(); setTimeout(hwNotice, 600);
if (S.run) setTimeout(() => S.run.stopAt ? doneSheet() : openTimer(), 300);
setInterval(checkAlarm, 15000); setTimeout(checkAlarm, 1500);
let lastDay = todayStr();
document.addEventListener('visibilitychange', () => { if (document.hidden) return; if (todayStr() !== lastDay) { lastDay = todayStr(); render(); } hwNotice(); checkAlarm(); if (S.run && !FULLS.includes('timer')) S.run.stopAt ? doneSheet() : openTimer(); });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
document.addEventListener('pointerup', () => { if (AC && AC.state === 'suspended') AC.resume(); }, {passive: true});
</script>
