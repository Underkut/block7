<script id="clock-core">
// ── 시계의 핵심 규칙 — 화면 없이 도는 덩어리. tests/test_clock.js 가 이것만 떼어 시험한다.
const APP_VERSION = 'v. 26-1121-1';
const KEY = 'b7clock_v1';           // 같은 주소의 다른 앱(timer · study · wallet …)과 겹치지 않게 앱 이름을 붙인다
const DEFAULT_PHRASE = 'REDEEM THE KAIROS';
const MAX_PHRASES = 20, MAX_LEN = 40;
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const p2 = n => (n < 10 ? '0' : '') + n;

// 시각 → 카드 세 장의 글자. 12시간이면 0시 = 12 · 13시 = 01 이고 AM / PM 이 붙는다
function timeParts(d, h12) {
  let h = d.getHours(), ap = '';
  if (h12) { ap = h < 12 ? 'AM' : 'PM'; h = h % 12; if (h === 0) h = 12; }
  return { h: p2(h), m: p2(d.getMinutes()), s: p2(d.getSeconds()), ap };
}
// 2026. 11. 21. 토
function dateLine(d) { return d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + '. ' + WD[d.getDay()]; }

function defaults() { return { sec: true, h12: false, wake: true, phrases: [{ id: 'p0', t: DEFAULT_PHRASE }], sel: 'p0' }; }
function cleanText(t) { return String(t == null ? '' : t).replace(/\s+/g, ' ').trim().slice(0, MAX_LEN).trim(); }

// 저장된 것을 읽는다 — 망가졌거나 낡았어도 죽지 않고, 모르는 칸은 기본값으로
function normSettings(raw) {
  const d = defaults();
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return d;
  const st = {
    sec: typeof raw.sec === 'boolean' ? raw.sec : d.sec,
    h12: typeof raw.h12 === 'boolean' ? raw.h12 : d.h12,
    wake: typeof raw.wake === 'boolean' ? raw.wake : d.wake,
    phrases: d.phrases, sel: d.sel
  };
  if (Array.isArray(raw.phrases)) {
    const seen = new Set(), list = [];
    for (const p of raw.phrases) {
      if (!p || typeof p !== 'object') continue;
      const id = typeof p.id === 'string' && p.id ? p.id : '', t = cleanText(p.t);
      if (!id || !t || seen.has(id)) continue;
      seen.add(id); list.push({ id, t });
      if (list.length >= MAX_PHRASES) break;
    }
    st.phrases = list;
    st.sel = raw.sel === null ? null : (list.some(p => p.id === raw.sel) ? raw.sel : (list[0] ? list[0].id : null));
  }
  return st;
}
function phraseText(st) { const p = st.phrases.find(x => x.id === st.sel); return p ? p.t : ''; }

// 문구 더하기 — 같은 글(대소문자 무시)이 있으면 새로 만들지 않고 그것을 고른다. 넘치면 그대로
function addPhrase(st, text, id) {
  const t = cleanText(text);
  if (!t) return st;
  const same = st.phrases.find(p => p.t.toLowerCase() === t.toLowerCase());
  if (same) return Object.assign({}, st, { sel: same.id });
  if (st.phrases.length >= MAX_PHRASES) return st;
  return Object.assign({}, st, { phrases: st.phrases.concat([{ id, t }]), sel: id });
}
// 문구 지우기 — 고른 것을 지우면 맨 앞 것이, 하나도 없으면 문구 없음
function removePhrase(st, id) {
  const phrases = st.phrases.filter(p => p.id !== id);
  const sel = st.sel === id ? (phrases[0] ? phrases[0].id : null) : st.sel;
  return Object.assign({}, st, { phrases, sel });
}
// 주소 끝의 ?s=1&h=12 — 이번에 연 화면만 바꾸고 저장하지 않는다 (바로가기용)
function applyQuery(st, search) {
  const q = new URLSearchParams(search || ''), o = Object.assign({}, st);
  if (q.get('s') === '1') o.sec = true; else if (q.get('s') === '0') o.sec = false;
  if (q.get('h') === '12') o.h12 = true; else if (q.get('h') === '24') o.h12 = false;
  return o;
}

<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const quiet = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const newId = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);

// ── 저장 ──
let saved = defaults();
try { saved = normSettings(JSON.parse(localStorage.getItem(KEY) || 'null')); } catch (e) {}
let ST = applyQuery(saved, location.search);
function save() {
  // 주소로 덮어쓴 값(초 · 12시간)은 저장하지 않는다 — 설정에서 직접 고른 것만 남는다
  try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {}
}

// ── 플립 카드 ──
function makeCard(k) {
  const el = document.createElement('div');
  el.className = 'card'; el.dataset.k = k;
  el.innerHTML = '<div class="half top"><span></span></div><div class="half bot"><span></span></div>' +
    '<div class="flap ft"><span></span></div><div class="flap fb"><span></span></div><div class="seam"></div>' +
    (k === 'h' ? '<div class="ap" hidden></div>' : '');
  const q = s => el.querySelector(s + ' span');
  const c = { el, v: null, timer: 0,
    top: q('.top'), bot: q('.bot'), ft: q('.ft'), fb: q('.fb'), ap: el.querySelector('.ap') };
  return c;
}
function finish(c) {          // 돌던 것을 마무리하고 아래 반쪽을 새 값으로
  clearTimeout(c.timer); c.timer = 0;
  c.el.classList.remove('go');
  if (c.v != null) { c.top.textContent = c.v; c.bot.textContent = c.v; }
}
function setCard(c, v, anim) {
  if (c.v === v) return;
  const old = c.v;
  if (c.timer) finish(c);
  c.v = v;
  if (old == null || !anim || quiet()) { c.top.textContent = v; c.bot.textContent = v; return; }
  c.top.textContent = v; c.bot.textContent = old;       // 가만한 위는 새 값, 아래는 옛 값
  c.ft.textContent = old; c.fb.textContent = v;          // 위 장은 옛 값이 떨어지고, 아래 장은 새 값이 올라온다
  void c.el.offsetWidth;
  c.el.classList.add('go');
  c.timer = setTimeout(() => finish(c), 640);
}

const C = { h: makeCard('h'), m: makeCard('m'), s: makeCard('s') };
$('cards').append(C.h.el, C.m.el, C.s.el);

// ── 그리기 ──
function layout() {
  C.s.el.hidden = !ST.sec;
  document.documentElement.style.setProperty('--n', ST.sec ? 3 : 2);
  C.h.ap.hidden = !ST.h12;
  const ph = phraseText(ST);
  $('phrase').textContent = ph; $('phrase').hidden = !ph;
}
function render(anim) {
  const d = new Date(), p = timeParts(d, ST.h12);
  setCard(C.h, p.h, anim); setCard(C.m, p.m, anim); setCard(C.s, p.s, anim && ST.sec);
  if (ST.h12) C.h.ap.textContent = p.ap;
  const dl = dateLine(d); if ($('date').textContent !== dl) $('date').textContent = dl;
  return d;
}
let tickT = 0;
function tick() {
  clearTimeout(tickT);
  const d = render(true);
  tickT = setTimeout(tick, 1000 - d.getMilliseconds() + 12);   // 초가 바뀌는 순간에 맞춘다
}
// 모양이 바뀔 때(초 · 12시간 · 문구) — 나가고(≈150ms) → 바꾸고 → 들어온다(≈300ms)
function swapStage(fn) {
  const s = $('stage');
  if (quiet()) { fn(); render(false); return; }
  s.classList.add('swap');
  setTimeout(() => { fn(); render(false); s.classList.remove('swap'); }, 160);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(false); tick(); wakeLock(); } });

// ── 화면 켜 두기 ──
let wl = null;
async function wakeLock() {
  try {
    if (!ST.wake || !navigator.wakeLock || document.hidden) return;
    if (wl && !wl.released) return;
    wl = await navigator.wakeLock.request('screen');
  } catch (e) {}
}
function wakeOff() { try { if (wl) wl.release(); } catch (e) {} wl = null; }

// ── 설정 단추 — 4초 가만히 두면 사라진다 ──
let idleT = 0;
function wake() { $('gear').classList.remove('idle'); clearTimeout(idleT); if (!sheetOn) idleT = setTimeout(() => $('gear').classList.add('idle'), 4000); }
['pointerdown', 'pointermove', 'keydown'].forEach(ev => addEventListener(ev, wake, { passive: true }));

// ── 설정 판 ──
let sheetOn = false;
const sheet = $('sheet'), scrim = $('scrim');
function paintSeg(id, val) { document.querySelectorAll('#' + id + ' button').forEach(b => b.classList.toggle('on', b.dataset.v === String(val))); }
function paintSheet() {
  paintSeg('segSec', ST.sec ? 1 : 0);
  paintSeg('segH', ST.h12 ? 12 : 24);
  paintSeg('segWake', saved.wake ? 1 : 0);
  const rows = saved.phrases.map(p => '<div class="row' + (saved.sel === p.id ? ' on' : '') + '" data-id="' + p.id + '">' +
    '<button class="pick" type="button"><span class="dot"></span><span class="t"></span></button>' +
    '<button class="del" type="button" aria-label="지우기"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>');
  rows.push('<div class="row' + (saved.sel === null ? ' on' : '') + '" data-id=""><button class="pick" type="button"><span class="dot"></span><span class="t" style="text-transform:none;letter-spacing:.02em">문구 없음</span></button></div>');
  $('plist').innerHTML = rows.join('');
  $('plist').querySelectorAll('.row').forEach((r, i) => { const t = r.querySelector('.t'); if (i < saved.phrases.length) t.textContent = saved.phrases[i].t; });
}
function openSheet() {
  sheetOn = true; paintSheet(); $('ver').textContent = APP_VERSION;
  sheet.style.transform = ''; scrim.style.opacity = '';
  sheet.classList.add('on'); scrim.classList.add('on'); sheet.setAttribute('aria-hidden', 'false'); wake();
}
function closeSheet() {
  sheetOn = false;
  sheet.style.transform = ''; scrim.style.opacity = '';
  sheet.classList.remove('on', 'drag'); scrim.classList.remove('on', 'drag'); sheet.setAttribute('aria-hidden', 'true');
  if (document.activeElement && sheet.contains(document.activeElement)) document.activeElement.blur();
  wake();
}
$('gear').addEventListener('click', openSheet);
$('shX').addEventListener('click', closeSheet);
scrim.addEventListener('click', closeSheet);
addEventListener('keydown', e => { if (e.key === 'Escape' && sheetOn) closeSheet(); });

// 모양을 바꾸는 값은 저장 뒤 화면에 반영 (주소로 덮은 값은 이번 한 번만 — 설정에서 고르면 그 값이 이긴다)
function commit(patch) {
  saved = Object.assign({}, saved, patch);
  ST = Object.assign({}, ST, patch);
  save(); paintSheet();
  swapStage(layout);
  if ('wake' in patch) { patch.wake ? wakeLock() : wakeOff(); }
}
$('segSec').addEventListener('click', e => { const b = e.target.closest('button'); if (b) commit({ sec: b.dataset.v === '1' }); });
$('segH').addEventListener('click', e => { const b = e.target.closest('button'); if (b) commit({ h12: b.dataset.v === '12' }); });
$('segWake').addEventListener('click', e => { const b = e.target.closest('button'); if (b) commit({ wake: b.dataset.v === '1' }); });
$('plist').addEventListener('click', e => {
  const row = e.target.closest('.row'); if (!row) return;
  const id = row.dataset.id;
  if (e.target.closest('.del')) { commit(removePhrase(saved, id)); return; }
  commit({ sel: id === '' ? null : id });
});
const addIn = $('addIn');
addIn.addEventListener('input', () => { $('addBtn').disabled = !cleanText(addIn.value); });
$('addForm').addEventListener('submit', e => {
  e.preventDefault();
  const next = addPhrase(saved, addIn.value, newId());
  if (next === saved) return;
  addIn.value = ''; $('addBtn').disabled = true;
  commit(next);
});

// ── 손짓으로 닫기 — 제목줄 끌어내리기 · 왼쪽 가장자리에서 오른쪽으로 밀기 (× 와 같은 길) ──
let g = null;
function gStart(mode, e) { g = { mode, x0: e.clientX, y0: e.clientY, t0: performance.now(), d: 0, id: e.pointerId }; }
function gMove(e) {
  if (!g || e.pointerId !== g.id) return;
  const raw = g.mode === 'y' ? e.clientY - g.y0 : e.clientX - g.x0;
  if (!g.on && Math.abs(raw) < 4) return;
  if (!g.on) { g.on = true; sheet.classList.add('drag'); scrim.classList.add('drag'); }
  g.d = raw > 0 ? raw : raw / 4;                      // 반대쪽은 고무줄처럼 뻑뻑하게
  const size = g.mode === 'y' ? sheet.offsetHeight : sheet.offsetWidth;
  sheet.style.transform = g.mode === 'y' ? 'translateY(' + g.d + 'px)' : 'translateX(' + g.d + 'px)';
  scrim.style.opacity = String(Math.max(0, 1 - Math.max(0, g.d) / size));
  e.preventDefault();
}
function gEnd(e) {
  if (!g || e.pointerId !== g.id) return;
  const was = g; g = null;
  if (!was.on) return;
  sheet.classList.remove('drag'); scrim.classList.remove('drag');
  const size = was.mode === 'y' ? sheet.offsetHeight : sheet.offsetWidth, dt = Math.max(1, performance.now() - was.t0);
  if (was.d > size / 4 || (was.d > 40 && was.d / dt > .5)) {
    sheet.style.transform = was.mode === 'y' ? 'translateY(105%)' : 'translateX(105%)'; scrim.style.opacity = '0';
    setTimeout(closeSheet, 300);
  } else { sheet.style.transform = ''; scrim.style.opacity = ''; }
  const eat = ev => { ev.stopPropagation(); ev.preventDefault(); };   // 손짓 끝에 딸려 오는 누름은 버린다
  addEventListener('click', eat, { capture: true, once: true }); setTimeout(() => removeEventListener('click', eat, true), 350);
}
$('shHead').addEventListener('pointerdown', e => { if (e.target.closest('.modal-x')) return; gStart('y', e); $('shHead').setPointerCapture(e.pointerId); });
$('shHead').addEventListener('pointermove', gMove);
$('shHead').addEventListener('pointerup', gEnd);
$('shHead').addEventListener('pointercancel', gEnd);
document.addEventListener('pointerdown', e => { if (sheetOn && e.pointerType !== 'mouse' && e.clientX < 24 && !g) gStart('x', e); }, true);
document.addEventListener('pointermove', e => { if (g && g.mode === 'x') gMove(e); }, { passive: false });
document.addEventListener('pointerup', e => { if (g && g.mode === 'x') gEnd(e); });
document.addEventListener('pointercancel', e => { if (g && g.mode === 'x') gEnd(e); });

// ── 서비스워커 ──
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

layout(); render(false); tick(); wake(); wakeLock();
document.addEventListener('pointerdown', wakeLock, { once: true, passive: true });
})();
</script>
</body>
</html>
