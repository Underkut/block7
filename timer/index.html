<head>

<script>
// 켜지는 순간 깜빡임 막기 — 첫 그림부터 제 색으로. 테마 색은 applyTheme 이 b7timer_paint 에 라이트 · 다크 두 벌로 적어 둔다.
// 'boot' 동안은 모든 전환을 끈다 (켜자마자 단추들이 사라지는 애니메이션이 보였다)
(function(){const de=document.documentElement;de.classList.add('boot');
  try{const k=JSON.parse(localStorage.getItem('b7timer_paint')||'null');if(!k)return;
    const dark=k.mode==='dark'||(k.mode!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches),v=dark?k.D:k.L;if(!v)return;
    for(const n in v)de.style.setProperty(n,v[n]);de.style.colorScheme=dark?'dark':'light';if(dark)de.classList.add('isdark');}catch(e){}})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@200;300;400;500&family=IBM+Plex+Mono:wght@300;400&display=fallback">
<style>
/* 한 화면 앱: 위 제목줄 · 가운데 좌우로 넘기는 세 판(타이머·이어달리기·기록) · 아래 탭. 원이 주인공, 나머지는 물러선다 */
:root{
  --bg:#f5f6fa; --s1:#ffffff; --s2:#eef0f6; --tx:#1b1e2b; --tx2:#5d6278; --tx3:#8d92a6; --bd:#dde1ea; --ac:#5a70f8;
  --red:#EA4335;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --f-ui:'IBM Plex Sans KR','Apple SD Gothic Neo',-apple-system,'Noto Sans KR',sans-serif;
  --ease-in:cubic-bezier(.22,.8,.24,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0c0f; --s1:#14161b; --s2:#1e2028; --tx:#eef0fa; --tx2:#9aa4c8; --tx3:#7a84a8; --bd:#2a2e3a; --ac:#5a70f8; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0c0f; --s1:#14161b; --s2:#1e2028; --tx:#eef0fa; --tx2:#9aa4c8; --tx3:#7a84a8; --bd:#2a2e3a; --ac:#5a70f8; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-size:14px;overscroll-behavior:none}
[hidden]{display:none!important}
.page{scrollbar-width:none}.page::-webkit-scrollbar{display:none}
body{background:var(--bg);color:var(--tx);font-family:var(--f-ui);font-weight:300;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:8px}
input{font:inherit;color:var(--tx)}
svg{display:block}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative;padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;align-items:center;justify-content:space-between;height:52px;flex:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top h1{font-size:15px;font-weight:400;letter-spacing:.02em;margin:0;flex:1;text-align:center}
.ic{width:36px;height:36px;display:grid;place-items:center;color:var(--tx2)}
.pager{flex:1;min-height:0;overflow:hidden;position:relative}
.track{display:flex;height:100%;will-change:transform}
.page{flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 16px}
.tabs{display:flex;flex:none;padding-bottom:env(safe-area-inset-bottom,0px);border-top:1px solid var(--bd)}
.tabs button{flex:1;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--tx3)}
.tabs button.on{color:var(--tx)}

/* 타이머 판 */
.tpage{display:flex;flex-direction:column;align-items:center;gap:10px;height:100%;min-height:520px}
.rstrip{width:100%;display:flex;flex-direction:column;gap:6px;padding-top:2px}
.rstrip .lab{font-size:12px;color:var(--tx2);display:flex;justify-content:space-between}
.rbar{display:flex;gap:3px;height:6px}
.rbar i{display:block;border-radius:3px;position:relative;overflow:hidden;background:var(--s2)}
.rbar i b{position:absolute;inset:0;width:0}
.dialwrap{width:100%;flex:1 1 0;min-height:180px;max-height:min(92vw,470px);display:grid;place-items:center;position:relative}
.dialwrap canvas{touch-action:none;cursor:grab}
.readout{display:flex;flex-direction:column;align-items:center;gap:2px}
.lapchip{font-size:11px;font-weight:400;padding:2px 9px;border-radius:999px;color:#fff;letter-spacing:.03em}
.digits{font-size:clamp(46px,14vw,64px);font-weight:200;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.05}
.sub{font-size:13px;color:var(--tx2);min-height:18px;text-align:center}
.adj{display:flex;gap:6px;width:100%;max-width:360px;justify-content:center}
.adj button{flex:1;height:40px;border-radius:12px;background:var(--s2);font-size:15px;font-variant-numeric:tabular-nums;font-weight:400;transition:opacity .2s, transform .12s}
.adj button:active{transform:scale(.95)}
.adj button[disabled]{opacity:.28;cursor:default}
.adj button.hot{color:#fff}
.mainrow{display:flex;align-items:center;justify-content:center;gap:36px}
.play{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;color:#fff;transition:transform .12s, opacity .2s}
.play:active{transform:scale(.94)}
.play[disabled]{opacity:.3}
.play.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px transparent;transform:scale(1.05)}}
.presets{display:flex;gap:8px;overflow-x:auto;width:100%;padding:4px 0 2px;scrollbar-width:none;flex:none}
.presets::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:19px;background:var(--s2);font-size:13px;white-space:nowrap;position:relative;-webkit-touch-callout:none;transition:transform .24s cubic-bezier(.22,.8,.24,1),box-shadow .2s,opacity .2s}
.chip.pdrag{transition:box-shadow .2s;z-index:5;box-shadow:0 8px 20px rgba(0,0,0,.22);background:var(--s1)}
.chip.phole{visibility:hidden}
/* 들어 올린 칩 — 화면 어디로든 따라다니는 떠 있는 복사본 */
.pghost{position:fixed;margin:0;z-index:58;pointer-events:none;background:var(--s1)!important;color:var(--tx)!important;box-shadow:0 10px 26px rgba(0,0,0,.26);transition:none;will-change:transform}
/* 놓는 자리: 가운데 연필(고치기) · 맨 위 붉은 반원(지우기) */
#pdz{position:fixed;inset:0;z-index:55;pointer-events:none}
#pdz .dimz{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .25s ease}
#pdz.on .dimz{opacity:1}
/* 다크는 바탕이 이미 검어 어둡게 해도 티가 안 난다 → 밝게 덮는다 (HB 조율 2026-10-23) */
html.isdark #pdz .dimz{background:rgba(255,255,255,.35)}
#pdz .ed{position:absolute;left:50%;top:40%;width:248px;max-width:calc(100% - 32px);height:124px;transform-origin:50% 50%;translate:-50% 0;margin:-62px 0 0 0;border-radius:34px;background:color-mix(in srgb,var(--s1) 47%,transparent);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);color:var(--tx2);display:grid;place-items:center;box-shadow:0 12px 32px rgba(0,0,0,.4);opacity:0;transform:scale(.82);transition:opacity .22s ease,transform .32s cubic-bezier(.22,.8,.24,1),background .18s,color .18s}
#pdz.on .ed{opacity:1;transform:scale(1)}
#pdz .ed.hot{transform:scale(1.1);background:color-mix(in srgb,var(--tx) 47%,transparent);color:var(--bg)}
#pdz .del{position:absolute;left:50%;top:0;width:176px;height:calc(88px + env(safe-area-inset-top,0px));margin-left:-88px;border-radius:0 0 88px 88px;background:rgba(229,72,77,.4);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);color:#fff;display:flex;justify-content:center;align-items:flex-end;padding-bottom:26px;opacity:1;transform:translateY(-102%);transform-origin:50% 0;transition:transform .34s cubic-bezier(.22,.8,.24,1),opacity .18s}
#pdz.on .del{transform:none}
#pdz.on .del.hot{transform:scale(1.14);background:rgba(229,72,77,.7)}
/* 확인 카드 — 기기 기본 창 대신 */
.cfm{position:fixed;inset:0;z-index:72;display:grid;place-items:center;background:rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .2s ease;padding:0 24px}
.cfm.on{opacity:1;pointer-events:auto}
.cfm .card{width:min(100%,300px);background:var(--s1);border-radius:22px;padding:22px 16px 14px;text-align:center;box-shadow:0 18px 44px rgba(0,0,0,.22);transform:scale(.94);transition:transform .28s cubic-bezier(.22,.8,.24,1)}
.cfm.on .card{transform:scale(1)}
.cfm .msg{font-size:15px;line-height:1.6;white-space:pre-line;color:var(--tx)}
.cfm .msg small{display:block;font-size:12.5px;color:var(--tx3);margin-top:4px}
.cfm .btns{display:flex;gap:8px;margin-top:18px}
.cfm .btns button{flex:1;height:44px;border-radius:13px;font-size:14px;font-weight:400}
.cfm .no{background:var(--s2);color:var(--tx2)}
.cfm .yes{background:#e5484d;color:#fff}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip small{color:var(--tx3);font-size:12px}
.chip.add{color:var(--tx2)}
.chip.on{box-shadow:inset 0 0 0 1.5px var(--tx2)}
.hint{font-size:11px;color:var(--tx3);text-align:center}

/* 이어달리기 판 */
.sec-h{font-size:12px;color:var(--tx3);letter-spacing:.06em;margin:14px 2px 8px}
.rcard{background:var(--s1);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.rcard .row1{display:flex;align-items:center;gap:10px}
.rcard .nm{font-size:16px;font-weight:400;flex:1;min-width:0}
.rcard .meta{font-size:12px;color:var(--tx2)}
.rcard .seq{display:flex;gap:3px;height:22px}
.rcard .seq i{border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-style:normal;overflow:hidden;white-space:nowrap}
.rplay{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--tx);flex:none}
.rplay svg{color:var(--bg)}
.ghostbtn{width:100%;height:46px;border-radius:14px;border:1px dashed var(--bd);color:var(--tx2);font-size:14px}
.note{font-size:12px;color:var(--tx3);line-height:1.6;margin:12px 2px}

/* 기록 판 */
.big{display:flex;gap:10px}
.big > div{flex:1;background:var(--s1);border-radius:16px;padding:14px}
.big .k{font-size:12px;color:var(--tx2)}
.big .v{font-size:28px;font-weight:200;font-variant-numeric:tabular-nums;margin-top:4px}
.week{background:var(--s1);border-radius:16px;padding:14px 12px 10px;margin-top:10px}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bars .col b{width:100%;max-width:26px;border-radius:6px 6px 3px 3px;background:var(--s2);display:flex;flex-direction:column-reverse;overflow:hidden}
.bars .col b i{display:block}
.bars .col span{font-size:11px;color:var(--tx3)}
.bars .col em{font-style:normal;font-size:10px;color:var(--tx2);font-variant-numeric:tabular-nums}
.bars .col.today span{color:var(--tx)}
.plist{background:var(--s1);border-radius:16px;padding:6px 14px;margin-top:10px}
.prow{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.prow:last-child{border-bottom:0}
.prow .dot{width:10px;height:10px;border-radius:50%}
.prow .bar{grid-column:2/4;height:4px;border-radius:2px;background:var(--s2);margin-top:-4px}
.prow .bar i{display:block;height:100%;border-radius:2px}
.prow .m{font-size:13px;color:var(--tx2);font-variant-numeric:tabular-nums}
.exbadge{font-size:10px;padding:2px 7px;border-radius:999px;background:var(--s2);color:var(--tx2);margin-left:6px;vertical-align:2px}

/* 시트(팝업) — 닫기는 우상단 × 하나 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:520px;max-height:88%;transform:translate(-50%,105%);transition:transform .32s var(--ease-in);background:var(--s1);border-radius:22px 22px 0 0;z-index:41;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}

.sheet .head{display:flex;align-items:center;height:54px;flex:none;padding:0 8px}

.sheet .foot{display:flex;gap:10px;padding:10px 18px 14px;flex:none}
.btn{flex:1;height:48px;border-radius:14px;background:var(--tx);color:var(--bg);font-size:15px;font-weight:400}
.btn.light{background:var(--s2);color:var(--danger,#d6453c);flex:0 0 96px}
.field{margin-bottom:18px}
.field > label,.field .lbl{display:block;font-size:12px;color:var(--tx2);margin-bottom:8px}
.txt{width:100%;height:46px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);padding:0 14px;font-size:15px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:46px;height:44px;border-radius:12px;background:var(--s2);font-size:14px;font-weight:400;font-variant-numeric:tabular-nums}
.stepper .val{flex:1;text-align:center;font-size:26px;font-weight:200;font-variant-numeric:tabular-nums}
.swatches{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}
.sw{aspect-ratio:1;max-width:100%;border-radius:50%;position:relative}
.sw.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;box-shadow:0 0 0 2px var(--tx)}
.sw.custom{background:conic-gradient(#ff7b72,#ffd640,#78d68c,#6eb4ff,#be96ff,#ff8caa,#ff7b72)}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.swname{font-size:11px;color:var(--tx3);margin-top:8px;min-height:15px}
.items{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.item{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:8px 6px 8px 12px}
.item .dot{width:10px;height:10px;border-radius:50%;flex:none}
.item .t{flex:1;font-size:14px;min-width:0}
.item .t small{color:var(--tx3);margin-left:6px}
.item button{width:32px;height:32px;display:grid;place-items:center;color:var(--tx3)}
.addrow{display:flex;flex-wrap:wrap;gap:6px}
.addrow .chip{height:34px;font-size:12px}

/* 설정 — 맨 위 모양 고르기, 그 아래 묶음 카드. 줄 앞 그림은 선만 */
.looks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:2px}
.look{background:var(--bg);border-radius:18px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:5px;transition:box-shadow .2s,transform .12s}
.look:active{transform:scale(.97)}
.look canvas{width:64px;height:64px;margin-bottom:4px}
.look b{font-weight:400;font-size:13.5px}
.look small{font-size:10.5px;color:var(--tx3);line-height:1.35;text-align:center}
.look.on{box-shadow:inset 0 0 0 1.5px var(--tx)}
.sgh{font-size:12px;color:var(--tx3);letter-spacing:.06em;margin:24px 6px 8px}
.sgrp{background:var(--bg);border-radius:18px;padding:0 14px}
.srow{display:flex;align-items:center;gap:12px;padding:14px 0}
.sgrp>*+.srow{border-top:1px solid var(--bd)}
.srow .si{flex:none;color:var(--tx3);align-self:flex-start;margin-top:-1px}
.srow .tx{flex:1;min-width:0}
.srow .l{font-size:14.5px;font-weight:400;line-height:1.3}
.srow .d{font-size:12px;color:var(--tx3);margin-top:3px;line-height:1.5}
.srow .d em{font-style:normal;color:var(--tx2)}
.srow.stack{flex-wrap:wrap;row-gap:10px}
.srow.stack .seg{flex:0 0 calc(100% - 32px);margin-left:32px}
.srow.stack .seg button{flex:1}
.srow.fh{cursor:pointer}
.srow .sv{font-size:13px;color:var(--tx2);display:flex;align-items:center;gap:6px;white-space:nowrap;max-width:44%;overflow:hidden;text-overflow:ellipsis}
.srow .chev{flex:none;color:var(--tx3);margin-left:-4px;transition:transform .3s var(--ease-in)}
.srow.fh.open .chev{transform:rotate(90deg)}
.tdot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--ease-in)}
.fold.open{grid-template-rows:1fr}
.fold>div{overflow:hidden;min-height:0}
.fold .fi{padding:2px 0 16px}
.sgl{font-size:11px;color:var(--tx3);letter-spacing:.04em;margin:12px 0 7px}
.sgl:first-child{margin-top:2px}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:999px;background:var(--s2);color:var(--tx3);margin-left:4px;vertical-align:2px;font-weight:400}
.mine{margin-top:14px;font-size:12.5px;color:var(--tx2);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 10px}
.mine span{display:flex;gap:12px}
.mine small{flex-basis:100%;font-size:11.5px;color:var(--tx3)}
.howto{margin:0;padding:0 0 0 16px;font-size:12.5px;color:var(--tx2);line-height:1.7}
.howto li+li{margin-top:6px}
.howto b{color:var(--tx);font-weight:500}
.sfoot{text-align:center;font-size:11.5px;color:var(--tx3);line-height:1.8;margin:26px 0 6px}
.tog{width:46px;height:28px;border-radius:14px;background:var(--s2);position:relative;flex:none;transition:background .2s}
.sgrp .tog{background:color-mix(in srgb,var(--tx) 12%,transparent)}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s var(--ease-in)}
.tog.on,.sgrp .tog.on{background:var(--ac)}
.tog.on::after{transform:translateX(18px)}
.tog[disabled]{opacity:.35}
.seg{display:flex;background:color-mix(in srgb,var(--tx) 7%,transparent);border-radius:11px;padding:3px;gap:2px;flex:none}
.seg button{padding:0 11px;height:32px;border-radius:8px;font-size:12.5px;color:var(--tx2);transition:background .2s,color .2s}
.seg button.on{background:var(--s1);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.thgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th{border-radius:12px;height:58px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:7px 8px;text-align:left;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tx) 8%,transparent)}
.th .n{font-size:10px;line-height:1.2;font-weight:400}
.th .a{position:absolute;top:8px;right:8px;width:14px;height:14px;border-radius:50%}
.th.on::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 2px var(--tx)}

/* 끝날 때 화면 깜빡임 · 토스트 · 탁상 모드 */
.flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:60}

.toast.on{opacity:.96;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.desk{position:fixed;inset:0;z-index:50;display:flex;visibility:hidden;transition:visibility 0s .56s;flex-direction:column;align-items:center;justify-content:center;gap:2vh;touch-action:manipulation;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.desk.on{visibility:visible;transition:none}

.desk .info{opacity:0;transition:opacity .25s ease}

.desk .dd{width:min(92vw,62vh);height:min(92vw,62vh);display:grid;place-items:center}
.desk .info{display:flex;flex-direction:column;align-items:center;gap:6px}

.rstrip{order:1}.dialwrap{order:2}.readout{order:3}.tech{order:4}.adj{order:5}.mainrow{order:6}.presets{order:7}.hint{order:8}

/* ── 태블릿 세로 — 520px 띠에 갇히지 않게: 원 · 숫자 · 단추를 화면에 맞춰 키운다 ── */

  /* 점 둘은 왼쪽 위 — 원 칸의 모서리는 원이 둥글어 비어 있다 (오른쪽 위는 이어달리기 줄과 겹쳤다) */

<script id="timer-core">
// ═══ 타이머 핵심 규칙 — 화면 없이 돈다. tests/test_timer.js 가 이 덩어리만 떼어 시험한다 ═══
const APP_VERSION='v. 26-1027-4';
// 색: 구글 레드 + 성경 앱 절 메뉴 7색(화면 순서 그대로) + 커스텀(#rrggbb)
const COLORS=[
  {k:'g',hex:'#EA4335',name:'구글 레드'},
  {k:'c1',hex:'#ff7b72',name:'빨강'},{k:'c2',hex:'#ffa95e',name:'주황'},{k:'c3',hex:'#ffd640',name:'노랑'},
  {k:'c4',hex:'#78d68c',name:'초록'},{k:'c5',hex:'#6eb4ff',name:'파랑'},{k:'c6',hex:'#be96ff',name:'보라'},{k:'c7',hex:'#ff8caa',name:'분홍'}
];
const colorHex=k=>{const c=COLORS.find(x=>x.k===k);return c?c.hex:(/^#[0-9a-f]{6}$/i.test(k||'')?k:'#EA4335');};
const MAXMIN=180, LAP=60;   // 한 바퀴 60분 · 세 바퀴까지
// ⚠️ 같은 주소(block7.my)의 다른 앱들과 저장 칸을 나눠 쓰므로 이름이 겹치면 안 된다
const KEY='b7timer_v1';

// 남은 시간 → 25:00 / 1:24:13 (초는 올림 — 0:00 은 정말 끝났을 때만)
function fmt(ms){
  const s=Math.ceil(Math.max(0,ms)/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`;
}
// 보이는 바퀴 아래에 남은 바퀴 수 — 60분 딱이면 0, 61분이면 1
function lapText(ms){const m=ms/60000;const extra=Math.ceil(m/LAP-1e-9)-1;return extra>0?`＋${extra}바퀴`:'';}

// 손가락 자리(가운데 기준 dx,dy) → 0~60 분. dir 'cw' = 시계 방향으로 늘어남(기본)
function rawMinute(dx,dy,dir){
  let a=Math.atan2(dx,-dy);if(a<0)a+=Math.PI*2;
  let m=a/(Math.PI*2)*60;if(dir==='ccw')m=(60-m)%60;
  return m;
}
// 끌기 한 걸음 — 각도를 그대로 시간으로 바꾸면 12시에서 0 으로 튄다.
// 그래서 **차이만** 쌓는다: 12시를 넘으면 다음 바퀴로, 0 밑 · 180 위로는 안 간다
function dragStep(val,prevRaw,raw){
  let d=raw-prevRaw;if(d>30)d-=60;if(d<-30)d+=60;
  return Math.max(0,Math.min(MAXMIN,val+d));
}
// 프리셋 끌어 옮기기 — 끄는 칸의 가운데(cx)가 이웃 칸의 가운데를 넘으면 그 자리로.
// mids: 끌기 시작할 때 잰 칸마다의 가운데 x · i0: 끄는 칸
function dragSlot(mids,i0,cx){
  let to=i0;
  mids.forEach((m,i)=>{if(i>i0&&cx>m)to=Math.max(to,i);if(i<i0&&cx<m)to=Math.min(to,i);});
  return to;
}
// i0 자리의 것을 to 자리로 (나머지는 한 칸씩 밀린다)
function moveItem(arr,i0,to){const a=arr.slice(),x=a.splice(i0,1)[0];a.splice(to,0,x);return a;}
// 잠금 화면 알림 — 지금 상태에서 서버에 맡길 것. null = 서버에서 지우기 (도는 중이 아니거나 스위치가 꺼짐)
// next: 이어달리기의 다음 것 이름 — 서버는 지금 것의 끝만 알아서, 다음은 앱을 열어야 이어진다
function pushPlan(r,cfg,next){
  if(!cfg||!cfg.lock||!cfg.lockTok||!cfg.dev||!r||r.state!=='run'||!(r.endAt>0))return null;
  const min=Math.round((r.total||0)/60000);
  return {at:r.endAt,title:`${r.label?r.label+' ':''}${min}분, 끝났어요`,body:next?`다음은 ${next} — 앱을 열면 이어져요`:'KAIROS'};
}
// 이어달리기 → 실제로 도는 차례 (되풀이 반영)
function routineSeq(rt){const seq=[];for(let k=0;k<(rt.rep||1);k++)seq.push(...rt.items);return seq;}

function seed(){
  return {
    presets:[
      {id:'p1',min:3,name:'',color:'g'},
      {id:'p2',min:5,name:'쉬기',color:'c4'},
      {id:'p3',min:15,name:'말씀',color:'c5'},
      {id:'p4',min:25,name:'집중',color:'g'},
      {id:'p5',min:30,name:'기도',color:'c6'},
      {id:'p6',min:90,name:'',color:'c2'}
    ],
    routines:[
      {id:'r1',name:'공부 리듬',items:['p4','p2'],rep:4},
      {id:'r2',name:'아침',items:['p5','p3'],rep:1}
    ],
    cfg:{},
    run:null,
    log:[]
  };
}
const CFG_DEFAULT={wake:true,autoNext:true,sound:'chime',voice:false,grow:true,flash:true,vib:true,lock:false,dir:'cw',deskAuto:true,theme:'0',mode:'system',lv:'simple',snap:'10'};
const RUN_STATES=['idle','run','pause','done','wait'];
const num=(v,lo,hi,d)=>{v=Number(v);return isFinite(v)?Math.max(lo,Math.min(hi,v)):d;};
// 저장된 것을 읽을 때 — 망가졌거나 낡은 모양이어도 죽지 않고, 모르는 칸은 기본값으로
function normState(raw){
  const S=(raw&&typeof raw==='object'&&Array.isArray(raw.presets))?raw:seed();
  S.presets=S.presets.filter(p=>p&&typeof p.id==='string').map(p=>({id:p.id,min:Math.round(num(p.min,1,MAXMIN,5)),name:String(p.name||'').slice(0,20),color:typeof p.color==='string'?p.color:'g'}));
  const ids=new Set(S.presets.map(p=>p.id));
  S.routines=(Array.isArray(S.routines)?S.routines:[]).filter(r=>r&&typeof r.id==='string').map(r=>({id:r.id,name:String(r.name||'이어달리기').slice(0,20),items:(Array.isArray(r.items)?r.items:[]).filter(i=>ids.has(i)),rep:Math.round(num(r.rep,1,9,1))}));
  S.cfg=Object.assign({},CFG_DEFAULT,(S.cfg&&typeof S.cfg==='object')?S.cfg:{});
  S.log=(Array.isArray(S.log)?S.log:[]).filter(l=>l&&isFinite(l.t)&&isFinite(l.m)&&!l.ex);
  let r=S.run;
  if(!r||typeof r!=='object'||!RUN_STATES.includes(r.state))r={state:'idle',left:25*60000,total:25*60000,endAt:0,color:'g',label:'집중',pid:'p4',rt:null};
  r.left=num(r.left,0,MAXMIN*60000,0);r.total=num(r.total,0,MAXMIN*60000,r.left);r.endAt=num(r.endAt,0,9e15,0);
  if(r.state==='run'&&!r.endAt)r.state='pause';
  if(r.rt&&!(Array.isArray(r.rt.seq)&&r.rt.seq.length&&r.rt.seq.every(i=>ids.has(i))&&num(r.rt.idx,0,r.rt.seq.length-1,-1)===r.rt.idx))r.rt=null;
  S.run=r;
  return S;
}
</script>

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);

// ── 상태 (이 기기 안에만 저장) ──
let S;
try{S=normState(JSON.parse(localStorage.getItem(KEY)||'null'));}catch(e){S=normState(null);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const R=()=>S.run, C=()=>S.cfg;
const P=id=>S.presets.find(p=>p.id===id);
const pLabel=p=>p.name?p.name:p.min+'분';

// ── 테마 (BLOCK7·Sweeter 의 THEME_PRESETS 그대로 + 기본) ──
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const hex=c=>'#'+c.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>hex(rgb(a).map((v,i)=>v+(rgb(b)[i]-v)*t));
function resolvedDark(){
  const m=C().mode; if(m==='dark')return true; if(m==='light')return false;
  const host=document.documentElement.getAttribute('data-theme');
  if(host==='dark')return true; if(host==='light')return false;
  return matchMedia('(prefers-color-scheme: dark)').matches;
}
function applyTheme(){
  const th=THEMES.find(t=>t.id===C().theme)||THEMES[0];
  const dark=resolvedDark(), st=document.documentElement.style;
  const vars=(p,dk)=>{const [bg,sf,tx,ac]=p;return {'--bg':bg,'--s1':sf,'--s2':mix(sf,tx,dk?.10:.07),'--tx':tx,'--tx2':mix(tx,bg,.38),'--tx3':mix(tx,bg,.56),'--bd':mix(tx,bg,dk?.84:.86),'--ac':ac};};
  const L=vars(th.light,false),D=vars(th.dark,true),v=dark?D:L;
  for(const k in v)st.setProperty(k,v[k]);
  try{localStorage.setItem('b7timer_paint',JSON.stringify({mode:C().mode,L,D}));}catch(e){}
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.setAttribute('content',v['--bg']));
  st.colorScheme=dark?'dark':'light';document.documentElement.classList.toggle('isdark',dark);
  drawAll();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

// ── 시간 계산 ──
function remainMs(){const r=R();return r.state==='run'?Math.max(0,r.endAt-Date.now()):r.left;}
function clock(t){const d=new Date(t);let h=d.getHours();const ap=h<12?'오전':'오후';h=h%12||12;return `${ap} ${h}:${String(d.getMinutes()).padStart(2,'0')}`;}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888';

// ── 원 그리기 — 심플 · 미드 · 파워 (60분 한 바퀴 · 세 바퀴까지) ──
function drawDial(cv,size,minutes,color,showKnob,ex){
  ex=ex||{};
  const dpr=Math.min(3,window.devicePixelRatio||1),look=ex.look||C().lv;
  if(cv.width!==Math.round(size*dpr)){cv.width=Math.round(size*dpr);cv.height=Math.round(size*dpr);cv.style.width=size+'px';cv.style.height=size+'px';}
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,size,size);
  const cx=size/2,cy=size/2;
  const s1=css('--s1'),s2=css('--s2'),tx=css('--tx'),tx2=css('--tx2'),tx3=css('--tx3'),bg=css('--bg'),bd=css('--bd');
  const dir=C().dir==='cw'?1:-1;
  const pt=(min,r)=>{const a=dir*min/60*Math.PI*2;return [cx+r*Math.sin(a),cy-r*Math.cos(a)];};
  let m=Math.max(0,minutes), laps=Math.floor(m/LAP), rem=m-laps*LAP;
  if(rem<1e-6&&laps>0){laps--;rem=LAP;}
  const pie=(r,c,min)=>{g.fillStyle=c;g.beginPath();g.moveTo(cx,cy);const a0=-Math.PI/2;g.arc(cx,cy,r,a0,a0+dir*min/60*Math.PI*2,dir<0);g.closePath();g.fill();};
  const disc=(r,c)=>{g.fillStyle=c;g.beginPath();g.arc(cx,cy,r,0,Math.PI*2);g.fill();};
  if(look==='simple'){
    // 원판과 부채꼴뿐 — 눈금 · 숫자 · 손잡이 · 가운데 점 없음
    const r=size*.47;
    disc(r,s2);
    if(laps>0)disc(r,mix(color,s2,.6));
    if(rem>0)pie(r,color,rem);
    return;
  }
  const dark=document.documentElement.classList.contains('isdark');
  const line=(a,b,w,c)=>{g.strokeStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();};
  const shade=(blur,y,a)=>{g.shadowColor=`rgba(0,0,0,${dark?a*2.6:a})`;g.shadowBlur=blur*dpr;g.shadowOffsetY=y*dpr;};
  const noShade=()=>{g.shadowColor='transparent';g.shadowBlur=0;g.shadowOffsetY=0;};
  const font=(w,px,mono)=>`${w} ${Math.round(px)}px ${mono?css('--f-mono'):getComputedStyle(document.body).fontFamily}`;
  // 바늘 선 — 부채꼴의 움직이는 쪽 가장자리를 조금 짙게 (원이 '판' 이 아니라 '물건' 으로 보이게)
  const hand=(r,w)=>{if(rem<=0||rem>=LAP)return;line([cx,cy],pt(rem,r),w,mix(color,'#000000',.18));};
  if(look==='mid'){
    // 미드 — 문자판 한 덩이: 둥근 판(그림자) 위에 숫자 · 눈금 · 부채꼴이 다 들어 있다
    const rB=size*.475,rTk=size*.392,rW=size*.352,rNum=size*.432;
    shade(size*.05,size*.012,.07);disc(rB,s1);noShade();
    disc(rTk,mix(s1,tx,dark?.035:.025));
    g.lineCap='round';
    for(let i=0;i<60;i++){const big=i%5===0;line(pt(i,rTk-size*.006),pt(i,rTk-(big?size*.03:size*.016)),big?1.5:1,big?tx2:mix(tx3,s1,.35));}
    g.fillStyle=tx3;g.font=font(300,size*.043);g.textAlign='center';g.textBaseline='middle';
    for(let i=0;i<60;i+=5){const [x,y]=pt(i,rNum);g.fillStyle=i%15===0?tx2:tx3;g.fillText(String(i),x,y+size*.002);}
    if(laps>0)disc(rW,mix(color,s1,.66));
    if(rem>0)pie(rW,color,rem);
    hand(rW,1.5);
    if(showKnob&&m>0){const [kx,ky]=pt(rem,rW);shade(size*.02,size*.005,.18);g.fillStyle=s1;g.beginPath();g.arc(kx,ky,size*.034,0,Math.PI*2);g.fill();noShade();
      g.fillStyle=color;g.beginPath();g.arc(kx,ky,size*.016,0,Math.PI*2);g.fill();}
    shade(size*.02,size*.006,.14);disc(size*.052,s1);noShade();disc(size*.02,color);
    return;
  }
  // 파워 — 계기판: 바깥 진행 고리 · 30초 눈금 · 처음 정한 자리 표시 · 초침
  const rO=size*.478,rB=size*.452,rNum=size*.372,rW=size*.33,tot=ex.total||0;
  const f=tot>0?Math.max(0,Math.min(1,1-minutes/tot)):0,a0=-Math.PI/2;
  g.lineCap='butt';
  g.lineWidth=size*.012;g.strokeStyle=mix(bd,bg,.2);g.beginPath();g.arc(cx,cy,rO,0,Math.PI*2);g.stroke();
  if(f>0){g.strokeStyle=color;g.beginPath();g.arc(cx,cy,rO,a0,a0+dir*f*Math.PI*2,dir<0);g.stroke();}
  for(let q=1;q<4;q++)line(pt(q*15,rO-size*.009),pt(q*15,rO+size*.009),1,bg);   // 진행 고리 4분의 1 마디
  disc(rB,s1);
  g.strokeStyle=bd;g.lineWidth=1;g.beginPath();g.arc(cx,cy,rB-.5,0,Math.PI*2);g.stroke();
  // 십자선 · 안쪽 고리 (아주 옅게)
  const hair=mix(bd,s1,.35);
  line([cx-rW,cy],[cx+rW,cy],1,hair);line([cx,cy-rW],[cx,cy+rW],1,hair);
  g.strokeStyle=hair;g.beginPath();g.arc(cx,cy,rW*.5,0,Math.PI*2);g.stroke();
  for(let i=0;i<120;i++){const mm=i/2,big=mm%5===0,half=i%2===1;
    line(pt(mm,rB-size*.012),pt(mm,rB-size*(big?.052:half?.02:.032)),big?1.6:1,big?tx:half?mix(tx3,s1,.4):tx3);}
  g.font=font(400,size*.036,true);g.textAlign='center';g.textBaseline='middle';
  for(let i=0;i<60;i+=5){const [x,y]=pt(i,rNum);g.fillStyle=i===0?tx:tx2;g.fillText(String(i).padStart(2,'0'),x,y+size*.002);}
  if(laps>0)disc(rW,mix(color,s1,.7));
  if(rem>0)pie(rW,color,rem);
  hand(rW,1.5);
  // 처음 정한 자리 — 테 위 작은 세모 (얼마나 왔는지 한눈에)
  if(tot>0&&f>.002){
    let tm=tot%LAP;if(tm<1e-6&&tot>0)tm=LAP;
    const ang=dir*tm/60*Math.PI*2,[tx_,ty_]=pt(tm,rB-size*.004),s=size*.022;
    g.save();g.translate(tx_,ty_);g.rotate(ang);g.fillStyle=color;g.beginPath();g.moveTo(0,s*.9);g.lineTo(-s*.62,-s*.3);g.lineTo(s*.62,-s*.3);g.closePath();g.fill();g.restore();
  }
  if(ex.run){
    const sec=(Date.now()/1000)%60,tip=pt(sec,rB-size*.06),tail=pt(sec+30,size*.07);
    g.lineCap='round';line(tail,tip,1.2,tx);g.fillStyle=color;g.beginPath();g.arc(tip[0],tip[1],size*.011,0,Math.PI*2);g.fill();
  }
  disc(size*.026,tx);disc(size*.01,s1);
}
let dialSize=300;
function sizeDial(){
  const w=$('dialwrap');const s=Math.floor(Math.min(w.clientWidth,w.clientHeight));
  if(s>60)dialSize=s;
}

// ── 화면 갱신 ──
function drawAll(){
  const r=R(), ms=remainMs(), col=colorHex(r.color);
  sizeDial();
  drawDial($('dial'),dialSize,(dragging&&C().lv==='simple')?dragVis:ms/60000,col,r.state!=='run'||dragging,{total:r.total/60000,run:r.state==='run'});
  if(C().lv==='power'){const t=Math.floor(ms%1000/100);$('digits').innerHTML=(r.state==='run'?fmt(Math.floor(ms/1000)*1000):fmt(ms))+`<small>.${r.state==='run'?t:0}</small>`;}
  else $('digits').textContent=fmt(ms);
  if(C().lv==='power')drawTech(r,ms);
  const lt=lapText(ms);$('lapchip').hidden=!lt;$('lapchip').textContent=lt;$('lapchip').style.background=col;
  let sub='';
  if(r.state==='run')sub=`${r.label?r.label+' · ':''}${clock(r.endAt)}에 끝나요`;
  else if(r.state==='pause')sub=`${r.label?r.label+' · ':''}멈춤`;
  else if(r.state==='done')sub='끝났어요 · +1 · +5 로 더 할 수 있어요';
  else if(r.state==='wait')sub=`다음: ${r.label||fmt(r.total)} · 시작을 누르세요`;
  else sub=ms>0?`${r.label?r.label+' · ':''}지금 시작하면 ${clock(Date.now()+ms)}에 끝나요`:'원을 끌어 시간을 정하세요';
  if(C().lv==='simple'){   // 심플은 짧게 — 그때 필요한 한 마디만
    sub=r.state==='run'?`${clock(r.endAt)}에 끝나요`:r.state==='pause'?'멈춤':r.state==='done'?'끝났어요':r.state==='wait'?`다음: ${r.label||fmt(r.total)}`:(ms>0?(r.label||''):'원을 끌어 시간을 정하세요');
  }
  if(C().lv==='power'){   // 파워는 앞에 상태 꼬리표
    const tag={run:'RUN',pause:'HOLD',done:'DONE',wait:'NEXT',idle:'READY'}[r.state];
    $('sub').innerHTML=`<i class="stag${r.state==='run'?' run':''}">${tag}</i>${esc(sub)}`;
  }else $('sub').textContent=sub;
  // 심플: 같은 자리에 그때 필요한 것 하나만 (A안, HB 2026-10-23)
  //   시작 전 → ▶ + 프리셋 줄 · 도는 중 → ❚❚ + ±줄 · 잠깐 멈춤 → ↺ ▶ + ±줄 · 끝 → ↺ ↻ + '더' 단추
  {
    const st=r.state,showAdj=st==='run'||st==='pause'||st==='done';
    $('adj').classList.toggle('off',!showAdj);$('presets').classList.toggle('off',showAdj);
    $('resetBtn').classList.toggle('off',!(st==='pause'||st==='done'||st==='wait'));
    document.body.dataset.st=st;
  }
  // 단추
  const pb=$('playBtn');pb.style.background=col;document.body.style.setProperty('--c',col);
  const running=r.state==='run';
  pb.innerHTML=running?'<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.2"/></svg>'
    :r.state==='done'?'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>'
    :'<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
  pb.setAttribute('aria-label',running?'멈춤':r.state==='done'?'같은 시간 다시':'시작');
  pb.disabled=(r.state==='idle'&&ms<=0);
  pb.classList.toggle('pulse',r.state==='wait');
  document.querySelectorAll('#adj button').forEach(b=>{
    const d=+b.dataset.d;
    b.disabled=r.state==='done'&&d<0;
    b.classList.toggle('hot',r.state==='done'&&d>0);
    b.style.background=(r.state==='done'&&d>0)?col:'';
    b.textContent=(r.state==='done'&&d>0)?`+${d}분 더`:(d>0?'+'+d:'−'+(-d));
  });
  drawStrip();
  if($('desk').classList.contains('on'))drawDesk();
}
// 파워 판독표 — 시작 · 끝 · 정한 시간 / 흐른 시간 · 바퀴 · 차례, 그 아래 진행 막대(4분의 1 마디)
function drawTech(r,ms){
  const run=r.state==='run',tot=r.total||0,el=Math.max(0,tot-ms),pc=tot?el/tot*100:0;
  const hm24=t=>{const d=new Date(t);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
  const st=run?hm24(r.endAt-tot):'--:--',en=run?hm24(r.endAt):(ms>0?hm24(Date.now()+ms):'--:--');
  const lap=ms>0?Math.ceil(ms/60000/LAP-1e-9):0;
  const cells=[['START',st],['END',en],['SET',fmt(tot)],['ELAPSED',fmt(el)],['LAP',lap+'/3'],['SEQ',r.rt?`${r.rt.idx+1}/${r.rt.seq.length}`:'—']];
  $('tech').innerHTML=`<div class="tg">${cells.map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join('')}</div>`
    +`<div class="tp"><span>PROGRESS</span><div class="tr"><i style="width:${pc.toFixed(2)}%;background:var(--c)"></i><u style="left:25%"></u><u style="left:50%"></u><u style="left:75%"></u></div><b>${pc.toFixed(1)}%</b></div>`;
}
function drawStrip(){
  const r=R(),st=$('rstrip');
  if(!r.rt){st.hidden=true;return;}
  const rt=S.routines.find(x=>x.id===r.rt.id);st.hidden=false;
  $('rlab').textContent=`${rt?rt.name:'이어달리기'} · ${r.label||''}`;
  $('rpos').textContent=`${r.rt.idx+1} / ${r.rt.seq.length}`;
  const bar=$('rbar');
  if(bar.childElementCount!==r.rt.seq.length){
    bar.innerHTML=r.rt.seq.map(pid=>{const p=P(pid);return `<i style="flex:${p?p.min:1}"><b style="background:${colorHex(p?p.color:'g')}"></b></i>`;}).join('');
  }
  [...bar.children].forEach((el,i)=>{
    const b=el.firstChild;let f=0;
    if(i<r.rt.idx)f=1;else if(i===r.rt.idx)f=r.total?1-remainMs()/r.total:0;
    b.style.width=(Math.max(0,Math.min(1,f))*100)+'%';
  });
}
function drawPresets(){
  const r=R();
  // 미드는 점 대신 그 길이만큼의 작은 파이(한 시간 = 꽉 찬 원), 파워는 세로 막대 — 모양마다 CSS 가 하나만 보인다
  const flip=C().dir==='ccw'?' style="transform:scaleX(-1)"':'';
  $('presets').innerHTML=S.presets.map(p=>{const c=colorHex(p.color);return `<button class="chip pc${r.pid===p.id&&!r.rt?' on':''}" data-pid="${p.id}" style="--pc:${c}"><span class="dot" style="background:${c}"></span><span class="pie"${flip}><i style="--p:${Math.min(100,p.min/LAP*100).toFixed(1)}%"></i></span>${esc(pLabel(p))}${p.name?`<small>${p.min}분</small>`:''}</button>`;}).join('')
    +`<button class="chip pc add" id="addPreset" aria-label="지금 시간으로 만들기">＋${C().lv==='simple'?'':' 지금 시간으로 만들기'}</button>`;
}

// ── 타이머 동작 ──
function setRun(o){Object.assign(S.run,o);save();drawAll();drawPresets();syncWake();syncPush();}
let deskT=0;
function deskSoon(){clearTimeout(deskT);if(!C().deskAuto)return;deskT=setTimeout(()=>{if(R().state==='run'&&!$('desk').classList.contains('on'))enterDesk();},1000);}
function start(){
  const r=R(); if(r.state==='run')return;
  const left=r.state==='done'?r.total:r.left; if(left<=0)return;
  unlockAudio();
  setRun({state:'run',endAt:Date.now()+left,left,total:r.state==='idle'||r.state==='done'?Math.max(r.total,left):r.total});
  loop();deskSoon();
}
function pause(){const r=R();if(r.state!=='run')return;setRun({state:'pause',left:remainMs()});}
function reset(){
  const r=R();
  if(r.state==='run'||r.state==='pause'){const used=r.total-remainMs();if(used>=60000)addLog(used/60000,r.label,r.color);}
  stopRing();
  setRun({state:'idle',left:r.total,endAt:0,rt:null});
}
function adjust(dm){
  const r=R(),d=dm*60000;
  unlockAudio();
  if(r.state==='done'){if(dm>0){stopRing();setRun({state:'run',left:d,total:d,endAt:Date.now()+d});loop();deskSoon();toast(`${dm}분 더 갑니다\n한 번 더 누르면 또 늘어나요`);}return;}
  if(r.state==='run'){
    const left=Math.min(MAXMIN*60000,remainMs()+d);
    if(left<=0){finish();return;}
    setRun({endAt:Date.now()+left,total:Math.max(left,r.total+d)});
  }else{
    const left=Math.max(0,Math.min(MAXMIN*60000,r.left+d));
    setRun({left,total:r.state==='idle'?left:Math.max(left,r.total)});
  }
}
function loadPreset(p,{run,keepRt,noDesk}={}){
  const ms=p.min*60000;
  stopRing();
  setRun({state:run?'run':'idle',left:ms,total:ms,endAt:run?Date.now()+ms:0,color:p.color,label:p.name||'',pid:p.id,rt:keepRt?R().rt:null});
  if(run){unlockAudio();loop();if(!noDesk)deskSoon();}
}
function startRoutine(id){
  const rt=S.routines.find(x=>x.id===id);if(!rt||!rt.items.length)return;
  const seq=routineSeq(rt);
  S.run.rt={id,seq,idx:0};
  const p=P(seq[0]);loadPreset(p,{run:true,keepRt:true});
  goTab(0);
  toast(`${rt.name} 시작\n${seq.length}개를 차례로 이어 갑니다`);
}
function finish(){
  const r=R();
  addLog(r.total/60000,r.label,r.color);
  const nm=(lab,min)=>lab?`${lab} ${min}분`:`${min}분`, doneSay=nm(r.label,Math.round(r.total/60000))+', 끝났어요.';
  if(r.rt&&r.rt.idx+1<r.rt.seq.length){
    r.rt.idx++;
    const p=P(r.rt.seq[r.rt.idx]);
    if(C().autoNext){
      loadPreset(p,{run:true,keepRt:true,noDesk:true});alertEnd(doneSay+` 다음은 ${nm(p.name,p.min)}, 시작했어요.`);
      toast(`다음: ${pLabel(p)}${p.name?' '+p.min+'분':''}\n바로 시작했어요`);
    }else{
      const ms=p.min*60000;
      setRun({state:'wait',left:ms,total:ms,endAt:0,color:p.color,label:p.name||'',pid:p.id});
      alertEnd(doneSay+` 다음은 ${nm(p.name,p.min)}입니다. 시작을 눌러 주세요.`);
    }
    return;
  }
  const wasRt=!!r.rt;
  setRun({state:'done',left:0,endAt:0,rt:null});
  alertEnd(doneSay+(wasRt?' 이어달리기를 다 마쳤어요.':''));
  if(wasRt)toast('이어달리기를 다 마쳤어요');
}
let raf=0,lastSec=-1;
function loop(){
  cancelAnimationFrame(raf);
  const step=()=>{
    const r=R();if(r.state!=='run')return;
    if(Date.now()>=r.endAt){finish();return;}
    if(!dragging)drawAll();
    raf=requestAnimationFrame(step);
  };
  raf=requestAnimationFrame(step);
}
function addLog(m,label,color){if(m<0.5)return;S.log.push({t:Date.now(),m:Math.round(m),label:label||Math.round(m)+'분',color});save();if(tab===2)renderStats();}

// ── 원 끌기 — 손가락을 따라간다. 12시를 넘기면 다음 바퀴로 (세 바퀴까지) ──
let dragging=false,dragVal=0,prevRaw=0,lastWhole=-1,wasRun=false;
function rawMin(e){
  const cv=$('dial'),b=cv.getBoundingClientRect(),dx=e.clientX-(b.left+b.width/2),dy=e.clientY-(b.top+b.height/2);
  return {m:rawMinute(dx,dy,C().dir),dist:Math.hypot(dx,dy)/(b.width/2)};
}
function beginDrag(e,m){
  const r=R();
  if(r.state==='done'||r.state==='wait'){r.rt=r.state==='wait'?r.rt:null;}
  dragging=true;wasRun=r.state==='run';
  const cur=remainMs()/60000;
  const base=Math.floor(Math.max(0,cur-1e-6)/LAP)*LAP;
  dragVal=Math.min(MAXMIN,base+m);prevRaw=m;lastWhole=-1;dragVis=-1;
  applyDrag();
}
// 도는 중·멈춘 중에는 파이를 톡 = 멈춤/재개 (좌하단 단추와 같다). 끌면 예전처럼 시간을 바꾼다
let tapP=null;
$('dial').addEventListener('pointerdown',e=>{
  const {m,dist}=rawMin(e);if(dist>1.02)return;
  const r=R();
  e.preventDefault();$('dial').setPointerCapture(e.pointerId);
  if(r.state==='run'||r.state==='pause'){tapP={x:e.clientX,y:e.clientY,t:Date.now()};return;}
  beginDrag(e,m);
});
$('dial').addEventListener('pointermove',e=>{
  if(tapP){if(Math.hypot(e.clientX-tapP.x,e.clientY-tapP.y)<10)return;tapP=null;beginDrag(e,rawMin(e).m);return;}
  if(!dragging)return;
  const {m}=rawMin(e);dragVal=dragStep(dragVal,prevRaw,m);prevRaw=m;
  applyDrag();
});
const endDrag=e=>{

let tab=0;const TITLES=['KAIROS','이어달리기','기록'];
function goTab(i,anim=true){
  tab=Math.max(0,Math.min(2,i));
  const tr=$('track');tr.style.transition=anim&&!matchMedia('(prefers-reduced-motion: reduce)').matches?'transform .3s cubic-bezier(.22,.8,.24,1)':'none';
  tr.style.transform=`translateX(${-tab*100}%)`;
  document.querySelectorAll('#tabs button,#dots button').forEach(b=>b.classList.toggle('on',+b.dataset.t===tab));
  document.body.classList.toggle('tab0',tab===0);
  $('title').textContent=TITLES[tab];
  if(tab===1)renderRoutines();if(tab===2)renderStats();
  if(tab===0)requestAnimationFrame(drawAll);
}
document.querySelectorAll('#tabs button,#dots button').forEach(b=>b.onclick=()=>goTab(+b.dataset.t));
(function swipe(){
  const pg=$('pager'),tr=$('track');let sx=0,sy=0,st=0,mode=0,w=1;
  pg.addEventListener('touchstart',e=>{if(e.target.closest('[data-noswipe]')){mode=-1;return;}const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now();mode=0;w=pg.clientWidth;},{passive:true});
  pg.addEventListener('touchmove',e=>{
    if(mode<0)return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(mode===0){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.2)mode=1;else if(Math.abs(dy)>8){mode=-1;return;}else return;}
    let x=dx;if((tab===0&&dx>0)||(tab===2&&dx<0))x=dx*.3;
    tr.style.transition='none';tr.style.transform=`translateX(calc(${-tab*100}% + ${x}px))`;
    tr.children[tab].style.opacity=String(1-Math.min(.35,Math.abs(x)/w*.6));
  },{passive:true});
  pg.addEventListener('touchend',e=>{
    if(mode!==1){mode=0;return;}mode=0;
    const dx=e.changedTouches[0].clientX-sx,fast=Date.now()-st<250&&Math.abs(dx)>40;
    tr.children[tab].style.opacity='';
    if((Math.abs(dx)>w/4||fast)&&!((tab===0&&dx>0)||(tab===2&&dx<0)))goTab(tab+(dx<0?1:-1));else goTab(tab);
  });
})();

// ── 프리셋: 누르면 바로 시작 · 길게 누르면 떠오른다 ──
// 0.45초 누르고 있으면 칩이 떠올라 손가락을 따라다닌다(진동). 동시에 놓는 자리 둘이 나타난다:
//   · 화면 가운데 둥근 사각(연필) → 놓으면 고치기
//   · 화면 맨 위 붉은 반원 → 놓으면 확인 카드를 거쳐 지우기
//   · 프리셋 줄 안에서 옆으로 → 순서 바꾸기 (이웃이 비켜 준다)
//   · 그 밖에 놓거나 그냥 떼면 → 제자리로 돌아간다
// 누르자마자 움직이면 그냥 프리셋 줄 넘기기. PC 는 오른쪽 누르기 = 고치기.
const PD={st:null,t:0,swallow:0};
const PD_HOLD=450,PD_LIFT=1.08;
(function presetPress(){
  const box=$('presets'),zones=$('pdz'),zEd=$('pdzEd'),zDel=$('pdzDel');
  const clearShift=st=>st.items.forEach((x,i)=>{if(i!==st.i0)x.style.transform='';});
  function lift(st){
    const c=st.c;
    st.on=true;st.items=[...box.querySelectorAll('[data-pid]')];
    st.rects=st.items.map(x=>x.getBoundingClientRect());st.mids=st.rects.map(r=>r.left+r.width/2);
    st.i0=st.items.indexOf(c);st.to=st.i0;st.sl0=box.scrollLeft;st.over='';
    st.shift=st.rects[st.i0].width+(parseFloat(getComputedStyle(box).columnGap)||8);
    st.row=box.getBoundingClientRect();
    const r=st.rects[st.i0],g=c.cloneNode(true);
    g.classList.add('pghost');g.removeAttribute('data-pid');
    Object.assign(g.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
    document.body.appendChild(g);st.g=g;
    c.classList.add('phole');box.classList.add('dragging');
    g.style.transform=`scale(${PD_LIFT})`;
    // 연필 자리 — 원래 자리(화면 40%)까지의 거리의 65% 만큼만 프리셋 줄 위로
    const rowMid=st.row.top+st.row.height/2;zEd.style.top=Math.round(rowMid-(rowMid-innerHeight*.4)*.6)+'px';
    zones.classList.add('on');
    try{box.setPointerCapture(st.id);}catch(er){}
    if(navigator.vibrate)try{navigator.vibrate(8);}catch(er){}
    st.raf=requestAnimationFrame(edgeTick);
  }
  box.addEventListener('pointerdown',e=>{
    const c=e.target.closest('[data-pid]');if(!c||(e.pointerType==='mouse'&&e.button!==0))return;
    const st={c,id:e.pointerId,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,on:false,moved:false};
    PD.st=st;clearTimeout(PD.t);
    PD.t=setTimeout(()=>{if(PD.st===st)lift(st);},PD_HOLD);
  });
  // 놓는 자리 위인가 (손가락 기준, 조금 넉넉하게)
  function overZone(st){
    const e=zEd.getBoundingClientRect(),d=zDel.getBoundingClientRect(),x=st.x,y=st.y;
    if(x>e.left-18&&x<e.right+18&&y>e.top-18&&y<e.bottom+18)return 'ed';
    if(y<d.bottom+22&&Math.abs(x-(d.left+d.width/2))<d.width/2+16)return 'del';
    return '';
  }
  function follow(){
    const st=PD.st;if(!st||!st.on)return;
    const gx=st.x-st.x0,gy=st.y-st.y0,over=overZone(st);
    if(over!==st.over){st.over=over;zEd.classList.toggle('hot',over==='ed');zDel.classList.toggle('hot',over==='del');
      if(over&&navigator.vibrate)try{navigator.vibrate(6);}catch(er){}}
    st.g.style.transform=`translate(${gx}px,${gy}px) scale(${over?.92:PD_LIFT})`;
    st.g.style.transition='transform .12s ease-out';
    // 줄 안에 있을 때만 순서를 바꾼다
    const inRow=!over&&st.y>st.row.top-28&&st.y<st.row.bottom+28;
    const to=inRow?dragSlot(st.mids,st.i0,st.mids[st.i0]+gx+(box.scrollLeft-st.sl0)):st.i0;
    if(to===st.to)return;st.to=to;
    st.items.forEach((x,i)=>{if(i===st.i0)return;
      const sh=st.i0<to&&i>st.i0&&i<=to?-1:st.i0>to&&i<st.i0&&i>=to?1:0;
      x.style.transform=sh?`translateX(${sh*st.shift}px)`:'';});
  }
  // 줄 끝에 닿으면 프리셋 줄이 스스로 넘어간다 (줄 높이에 있을 때만)
  function edgeTick(){
    const st=PD.st;if(!st||!st.on)return;
    let v=0;
    if(st.moved&&st.y>st.row.top-28&&st.y<st.row.bottom+28){if(st.x<st.row.left+40)v=-6;else if(st.x>st.row.right-40)v=6;}
    if(v){const before=box.scrollLeft;box.scrollLeft+=v;if(box.scrollLeft!==before)follow();}
    st.raf=requestAnimationFrame(edgeTick);
  }
  box.addEventListener('pointermove',e=>{
    const st=PD.st;if(!st||e.pointerId!==st.id)return;
    st.x=e.clientX;st.y=e.clientY;
    if(!st.on){if(Math.hypot(e.clientX-st.x0,e.clientY-st.y0)>8){clearTimeout(PD.t);PD.st=null;}return;}
    if(Math.hypot(e.clientX-st.x0,e.clientY-st.y0)>6)st.moved=true;
    follow();
  });
  // 떠오른 뒤에는 화면이 같이 끌려가지 않게 (아이폰)
  document.addEventListener('touchmove',e=>{if(PD.st&&PD.st.on)e.preventDefault();},{passive:false});
  const done=st=>{st.g.remove();st.c.classList.remove('phole');box.classList.remove('dragging');zones.classList.remove('on');zEd.classList.remove('hot');zDel.classList.remove('hot');};
  // 떠 있는 칩을 어떤 화면 자리로 보내고 나서 정리
  function flyTo(st,rect,scale,fade,after){
    if(quiet()){done(st);after&&after();return;}
    const r=st.rects[st.i0],tx=rect?(rect.left+rect.width/2)-(r.left+r.width/2):0,ty=rect?(rect.top+rect.height/2)-(r.top+r.height/2):0;
    st.g.style.transition='transform .28s cubic-bezier(.22,.8,.24,1),opacity .28s ease';
    st.g.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;if(fade)st.g.style.opacity='0';
    setTimeout(()=>{done(st);after&&after();},290);
  }
  function end(e){
    const st=PD.st;if(!st||(e&&e.pointerId!==st.id))return;
    clearTimeout(PD.t);PD.st=null;
    if(!st.on)return;
    cancelAnimationFrame(st.raf);PD.swallow=Date.now();   // 손을 뗄 때 따라오는 '눌림' 은 버린다
    const ok=e&&e.type==='pointerup',id=st.c.dataset.pid,over=ok?overZone(st):'';
    if(over==='ed'){clearShift(st);flyTo(st,zEd.getBoundingClientRect(),.4,true,()=>editPreset(id));return;}
    if(over==='del'){clearShift(st);flyTo(st,zDel.getBoundingClientRect(),.4,true,()=>askDelete(id));return;}
    if(!ok||st.to===st.i0){clearShift(st);flyTo(st,null,1,false);return;}
    // 놓은 자리로 — 이웃은 이미 새 자리에 있으니 그대로 그리고, 떠 있던 칩만 새 칸으로 내려앉는다
    const ids=moveItem(st.items.map(x=>x.dataset.pid),st.i0,st.to);
    S.presets=ids.map(P).filter(Boolean).concat(S.presets.filter(p=>!ids.includes(p.id)));
    save();drawPresets();
    const nc=box.querySelector(`[data-pid="${id}"]`);
    if(nc){nc.classList.add('phole');flyTo(st,nc.getBoundingClientRect(),1,false,()=>nc.classList.remove('phole'));}else done(st);
    if(tab===1)renderRoutines();
  }
  box.addEventListener('pointerup',end);box.addEventListener('pointercancel',end);
  box.addEventListener('scroll',()=>{const st=PD.st;if(st&&!st.on){clearTimeout(PD.t);PD.st=null;}},{passive:true});
  box.addEventListener('contextmenu',e=>{const c=e.target.closest('[data-pid]');if(!c)return;e.preventDefault();
    if(PD.st){clearTimeout(PD.t);if(PD.st.on){const st=PD.st;cancelAnimationFrame(st.raf);clearShift(st);done(st);}PD.st=null;}
    PD.swallow=Date.now();editPreset(c.dataset.pid);});
  box.addEventListener('click',e=>{
    if(Date.now()-PD.swallow<450){e.preventDefault();return;}
    if(e.target.closest('#addPreset')){const m=Math.round(R().total/60000)||5;editPreset(null,m);return;}
    const c=e.target.closest('[data-pid]');if(!c)return;
    const p=P(c.dataset.pid);loadPreset(p,{run:true});toast(`${pLabel(p)}${p.name?' '+p.min+'분':''}\n바로 시작했어요`);
  });
})();
function swatchHTML(sel){

// ── 기록 ──
function dayKey(t){const d=new Date(t);return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
function renderStats(){
  const now=Date.now(),day=86400000,today=dayKey(now);
  const days=[];for(let i=6;i>=0;i--){const t=now-i*day;days.push({k:dayKey(t),w:'일월화수목금토'[new Date(t).getDay()],segs:{},sum:0});}
  const inWeek={};let todaySum=0,weekSum=0;
  S.log.forEach(l=>{
    const k=dayKey(l.t),d=days.find(x=>x.k===k);if(!d)return;
    d.sum+=l.m;weekSum+=l.m;if(k===today)todaySum+=l.m;
    const col=colorHex(l.color);d.segs[col]=(d.segs[col]||0)+l.m;
    const key=l.label+'|'+l.color;inWeek[key]=inWeek[key]||{label:l.label,color:col,m:0};inWeek[key].m+=l.m;
  });
  const max=Math.max(30,...days.map(d=>d.sum));
  const hasEx=S.log.some(l=>l.ex);
  const rows=Object.values(inWeek).sort((a,b)=>b.m-a.m),rmax=rows.length?rows[0].m:1;
  $('stats').innerHTML=`
    <div class="sec-h">오늘과 이번 주${hasEx?'<span class="exbadge">예시 기록 포함</span>':''}</div>
    <div class="big"><div><div class="k">오늘</div><div class="v">${hm(todaySum)}</div></div><div><div class="k">최근 7일</div><div class="v">${hm(weekSum)}</div></div></div>
    <div class="week"><div class="bars">${days.map(d=>`<div class="col${d.k===today?' today':''}"><em>${d.sum?d.sum:''}</em><b style="height:${Math.max(4,d.sum/max*100)}%">${Object.entries(d.segs).map(([c,m])=>`<i style="height:${m/d.sum*100}%;background:${c}"></i>`).join('')}</b><span>${d.k===today?'오늘':d.w}</span></div>`).join('')}</div></div>
    <div class="sec-h">프리셋별 — 최근 7일</div>
    <div class="plist">${rows.map(r=>`<div class="prow"><span class="dot" style="background:${r.color}"></span><span>${esc(r.label)}</span><span class="m">${hm(r.m)}</span><span class="bar"><i style="width:${r.m/rmax*100}%;background:${r.color}"></i></span></div>`).join('')||'<p class="note">아직 기록이 없어요. 타이머가 끝나면 여기 쌓여요.</p>'}</div>
    ${hasEx?'<button class="ghostbtn" id="clrEx" style="margin-top:12px">예시 기록 지우기</button>':''}
    <p class="note">타이머가 끝까지 가면 그 시간이, 중간에 '처음으로'를 누르면 흐른 만큼(1분 넘을 때)이 쌓여요.</p>`;
  const b=$('clrEx');if(b)b.onclick=()=>{S.log=S.log.filter(l=>!l.ex);save();renderStats();toast('예시 기록을 지웠어요\n이제 실제 기록만 보여요');};
}

      if(k==='mode'){applyTheme();reopenSettings();}
      if(k==='dir'){drawAll();drawPresets();drawLooks();}
      if(k==='autoNext')renderRoutines();}
    if(th){C().theme=th.dataset.th;save();applyTheme();$('sheetBody').querySelectorAll('.th').forEach(b=>b.classList.toggle('on',b===th));$('sv-th').innerHTML=themeVal();drawLooks();}
  };
}
function reopenSettings(){const b=$('sheetBody'),y=b.scrollTop;if(!$('sheet').classList.contains('on'))return;openSettings();b.scrollTop=y;}
function applyLook(){document.body.classList.remove('lv-simple','lv-mid','lv-power');document.body.classList.add('lv-'+C().lv);drawAll();drawPresets();if($('desk').classList.contains('on'))drawDesk();}
$('gear').onclick=openSettings;

// ── 탁상 모드 — 거치대에 세워 두고 멀리서 보는 화면 ──
let ctlT=0;
function drawDesk(){
  const r=R(),ms=remainMs(),col=colorHex(r.color),dd=$('deskDD');
  const s=Math.floor(Math.min(dd.clientWidth,dd.clientHeight));
  if(s>40)drawDial($('deskDial'),s,ms/60000,col,false,{total:r.total/60000,run:r.state==='run'});
  $('dDigits').textContent=fmt(ms);
  const lt=lapText(ms);$('dLap').hidden=!lt;$('dLap').textContent=lt;$('dLap').style.background=col;
  $('dSub').textContent=r.state==='run'?`${r.label?r.label+' · ':''}${clock(r.endAt)}에 끝나요`:r.state==='pause'?'멈춤':r.state==='done'?'끝났어요':r.state==='wait'?`다음: ${r.label||fmt(r.total)}`:'';
  let nx='';if(r.rt&&r.rt.idx+1<r.rt.seq.length){const p=P(r.rt.seq[r.rt.idx+1]);if(p)nx=`그다음 ${pLabel(p)}${p.name?' '+p.min+'분':''} · ${r.rt.idx+1}/${r.rt.seq.length}`;}
  $('dNext').textContent=nx;
  const pp=$('dkPlay'),on=r.state==='run';
  if(pp.dataset.st!==String(on)){pp.dataset.st=String(on);pp.setAttribute('aria-label',on?'멈춤':'시작');
    pp.innerHTML=on?'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="3" height="14" rx="1"/><rect x="14.5" y="5" width="3" height="14" rx="1"/></svg>'
      :'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6a.8.8 0 0 0 1.2.7l10.6-6.8a.8.8 0 0 0 0-1.4L9.2 4.5A.8.8 0 0 0 8 5.2z"/></svg>';}
}
// 들어가고 나올 때 원은 겹치지 않고 제자리에서 미끄러져 간다 (배경만 옅게 들어온다)
const quiet=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
let flyT=0;
function fly(to){  // to: 'desk' | 'main'
  const dc=$('deskDial'),md=$('dial'),a=md.getBoundingClientRect(),b=dc.getBoundingClientRect();
  clearTimeout(flyT);
  if(quiet()||tab!==0||!a.width||!b.width){dc.style.transform='';dc.style.visibility='';md.style.visibility='';return;}
  const tf=`translate(${a.left+a.width/2-(b.left+b.width/2)}px,${a.top+a.height/2-(b.top+b.height/2)}px) scale(${a.width/b.width})`;
  md.style.visibility='hidden';dc.style.visibility='';
  if(to==='desk'){
    dc.style.transition='none';dc.style.transform=tf;dc.getBoundingClientRect();
    dc.style.transition='transform .6s cubic-bezier(.22,.8,.24,1)';dc.style.transform='';
    flyT=setTimeout(()=>{md.style.visibility='';},650);
  }else{
    dc.style.transition='transform .5s cubic-bezier(.22,.8,.24,1)';dc.style.transform=tf;
    flyT=setTimeout(()=>{dc.style.visibility='hidden';md.style.visibility='';dc.style.transition='none';dc.style.transform='';},540);
  }
}
function enterDesk(){
  clearTimeout(deskT);
  const d=$('desk');if(d.classList.contains('on'))return;
  d.classList.add('on');drawDesk();fly('desk');syncWake();showCtl();
  try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});}catch(e){}
}
function exitDesk(slid){
  clearTimeout(deskT);
  const d=$('desk');if(!d.classList.contains('on'))return;
  drawAll();
  if(slid){$('dial').style.visibility='';const dc=$('deskDial');dc.style.transition='none';dc.style.transform='';}   // 밀어서 나갔으면 원은 날지 않는다 — 화면째 이미 나갔다
  else fly('main');d.classList.remove('on','dimmed','ctlon');syncWake();
  try{document.fullscreenElement&&document.exitFullscreen();}catch(e){}
}
function showCtl(){$('desk').classList.add('ctlon');clearTimeout(ctlT);ctlT=setTimeout(()=>$('desk').classList.remove('ctlon'),4000);}
$('deskBtn').onclick=()=>enterDesk();
// 도는 중 여백 톡 = 다시 탁상. ⚠️ 단추를 누르면 그 안 그림이 곧바로 새로 그려져 눌린 것이 화면에서 떨어진다 —
// 떨어진 것은 '단추 안' 인지 알 수 없으니 여백으로 치지 않는다 (예전엔 ▶ 를 누르자마자 탁상으로 들어갔다)
$('pg0').addEventListener('click',e=>{if(!e.target.isConnected||e.target.closest('button,canvas,.presets,input'))return;if(R().state==='run')enterDesk();});
// 빈 곳 한 번 = 단추 보이기 · 두 번 = 나가기
let lastTap=0;
// 밀어서 나가기 — 왼쪽 가장자리에서 오른쪽으로, 또는 아무 데서나 위로. 화면 전체가 손가락을 따라간다.
// 폭(높이)의 4분의 1 넘게, 또는 빠르게 40px 넘게 밀고 놓으면 이어서 나가고, 못 미치면 제자리로 돌아온다.
let sw=null,swEat=0;
const EDGE=28;
const swFade=f=>Math.max(0,1-f/.35);   // 3분의 1쯤 밀면 이미 다 사라진다
function swSet(t,o,anim){const d=$('desk');d.style.transition=anim?'transform .3s cubic-bezier(.22,.8,.24,1),opacity .3s ease':'none';d.style.transform=t;d.style.opacity=o;}
$('desk').addEventListener('pointerdown',e=>{
  if(sw||e.button>0)return;
  swEat=0;sw={id:e.pointerId,x:e.clientX,y:e.clientY,t:Date.now(),edge:e.clientX<=EDGE,ax:null};
});
$('desk').addEventListener('pointermove',e=>{
  if(!sw||e.pointerId!==sw.id)return;
  const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(!sw.ax){
    if(Math.hypot(dx,dy)<10)return;
    if(sw.edge&&dx>0&&Math.abs(dx)>Math.abs(dy))sw.ax='x';
    else if(dy<0&&Math.abs(dy)>Math.abs(dx))sw.ax='y';
    else{sw=null;swEat=1;return;}   // 다른 쪽으로 민 것도 톡이 아니다
    try{$('desk').setPointerCapture(e.pointerId);}catch(_){}
  }
  const W=innerWidth,H=innerHeight;
  if(sw.ax==='x'){const v=dx>0?dx:dx*.25;swSet(`translateX(${v}px)`,swFade(Math.max(0,v)/W));}
  else{const v=dy<0?dy:dy*.25;swSet(`translateY(${v}px)`,swFade(Math.max(0,-v)/H));}
});
function swEnd(e){
  if(!sw||e.pointerId!==sw.id)return;
  const s0=sw;sw=null;if(!s0.ax)return;
  swEat=1;
  const W=innerWidth,H=innerHeight,dt=Date.now()-s0.t;
  const d=s0.ax==='x'?e.clientX-s0.x:s0.y-e.clientY,full=s0.ax==='x'?W:H;
  const go=e.type==='pointerup'&&(d>full/4||(dt<300&&d>40));
  if(!go){swSet('',1,true);return;}
  if(quiet()){swSet('',1,false);exitDesk(true);return;}
  swSet(s0.ax==='x'?`translateX(${W}px)`:`translateY(${-H}px)`,0,true);
  setTimeout(()=>{exitDesk(true);setTimeout(()=>swSet('',1,false),600);},300);   // .desk 는 .56초 뒤에 숨는다 — 그다음에 제자리로
}
$('desk').addEventListener('pointerup',swEnd);$('desk').addEventListener('pointercancel',swEnd);
$('desk').addEventListener('click',e=>{
  if(swEat){swEat=0;return;}   // 민 손가락이 남긴 톡은 버린다
  if(ringTap&&Date.now()-ringTap<1500){ringTap=0;exitDesk();return;}   // 끝나서 깜빡일 때 아무 데나 톡 = 나가기
  const b=e.target.closest('[data-dk]');
  if(!b&&e.target.closest('#deskDial')){const r=R();if(r.state==='run'||r.state==='pause'){if(r.state==='run')pause();else start();showCtl();drawDesk();return;}}   // 탁상 파이 톡 = 멈춤/재개
  if(!b){const now=Date.now();if(now-lastTap<330){lastTap=0;exitDesk();return;}lastTap=now;showCtl();return;}
  const k=b.dataset.dk;showCtl();
  if(k==='play'){const r=R();if(r.state==='run')pause();else{start();clearTimeout(deskT);}}
  else if(k==='dim')$('desk').classList.toggle('dimmed');
  else if(k==='out')exitDesk();
  else adjust(+k);
  drawDesk();
});
matchMedia('(orientation: landscape)').addEventListener('change',e=>{
  if($('desk').classList.contains('on'))drawDesk();
});

// ── 단추 묶기 · 시작 ──
$('playBtn').onclick=()=>{const r=R();if(r.state==='run')pause();else start();};
$('resetBtn').onclick=()=>{const r=R();const was=r.state;reset();if(was==='run'||was==='pause')toast('처음으로 돌렸어요\n흐른 시간은 기록에 남겼어요');};
document.querySelectorAll('#adj button').forEach(b=>b.onclick=()=>adjust(+b.dataset.d));
new ResizeObserver(()=>{drawAll();if($('desk').classList.contains('on'))drawDesk();}).observe($('dialwrap'));
new ResizeObserver(()=>{if($('desk').classList.contains('on'))drawDesk();}).observe($('deskDD'));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawAll);

(function boot(){
  const r=R();
  if(r.state==='run'){if(Date.now()>=r.endAt){r.state='done';r.left=0;}else loop();}
  applyLook();applyTheme();drawPresets();renderRoutines();goTab(0,false);syncWake();
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.documentElement.classList.remove('boot')));
  syncPush();setTimeout(lockRefresh,4000);
})();
if(C().myName)loadMine();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
