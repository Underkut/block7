<script id="cell-core">
// 셀 한눈에 — 화면 없이 도는 판단만 모은 덩어리. tests/test_cell.js 가 이것만 떼어 시험한다.
// ⚠️ 읽기만 한다. 셀 케어 DB 에 쓰는 함수는 이 앱 어디에서도 부르지 않는다 (test_cell ⑧ 이 지킨다).
const APP_VERSION = 'v. 26-1106-1';
const SEEN_KEY = 'cell_seen_v1';          // 이미 본 코멘트 id 만 (내용은 두지 않는다)
const PREF_KEY = 'cell_pref_v1';          // 화면 취향(고른 탭 · 기간 · 범위)
const WEEKS_LOADED = 12;                  // 제출 흐름 · 출석 추이에 쓰는 주 수

// 셀 케어의 표시 이름 그대로 (그쪽 L.care · L.att · L.prayer)
const CARE_LABEL = {
  update: '근황', prayer: '기도제목', faith: '신앙', health: '건강', family: '가정',
  work_school: '직장 / 학업', relationship: '관계', long_absence: '장기결석', care_needed: '돌봄 필요', other: '기타'
};
const CARE_ORDER = ['faith', 'long_absence', 'update', 'health', 'family', 'work_school', 'relationship', 'care_needed', 'prayer', 'other'];
const PRAYER_LABEL = { ongoing: '계속 기도', answered: '응답됨', closed: '종료' };
const MSG_LABEL = { none: '', prayer: '기도가 필요합니다', contact: '연락 또는 상담이 필요합니다', advice: '교역자의 조언이 필요합니다', share_up: '상위 공유가 필요합니다' };

function addDays(iso, n) { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
// 이번 주부터 거꾸로 n 주 (주 시작일 ISO)
function weeksBack(thisWeek, n) { const out = []; for (let i = 0; i < n; i++) out.push(addDays(thisWeek, -7 * i)); return out; }
function weekLabel(iso, withYear) {
  const y = +iso.slice(0, 4), m = +iso.slice(5, 7), d = +iso.slice(8, 10);
  return (withYear ? y + '년 ' : '') + m + '월 ' + Math.ceil(d / 7) + '주차';
}
function shortWeek(iso) { return (+iso.slice(5, 7)) + '/' + (+iso.slice(8, 10)); }

// '내 분파셀' — 셀 케어 교역자 홈(viewLeadershipHome)과 같은 판정.
// rows: get_week_status 한 주 · asg: leadership_assignments · meId · today(ISO)
function pickMine(rows, asg, meId, today) {
  const cur = new Set((asg || []).filter(a => a.start_date <= today && (!a.end_date || a.end_date >= today)).map(a => a.cell_id));
  const mine = (rows || []).filter(r => !r.i_am_leader && r.review_mode === 'leadership' &&
    (cur.has(r.cell_id) || r.responsible_leadership_id === meId || r.i_can_review));
  return mine.map(r => r.cell_id);
}

// 냈는가 — 제출 · 수정 요청(냈다가 되돌려 받음) · 고치는 중(한 번이라도 냈음)
function isSubmitted(r) {
  if (!r || !r.report_id) return false;
  return r.status === 'submitted' || r.status === 'revision_requested' || (r.status === 'draft' && (r.submission_no || 0) > 0);
}
function stateOf(r) {
  if (!r) return 'none';
  if (!r.report_id) return 'missing';
  if (r.status === 'submitted') return 'submitted';
  if (r.status === 'revision_requested') return 'revision';
  if (r.status === 'draft' && (r.submission_no || 0) > 0) return 'reediting';
  return 'draft';
}

// 연속 주 수. byWeek: Map(week → 그 셀의 줄), weeks: 이번 주부터 거꾸로.
// 이번 주를 냈으면 이번 주부터, 아직이면 지난주부터 센다(이번 주는 아직 기한 안일 수 있다).
// 그 주에 셀 줄 자체가 없으면(셀이 없던 때) 거기서 끊는다.
function streakOf(byWeek, weeks) {
  const thisDone = isSubmitted(byWeek.get(weeks[0]));
  const from = thisDone ? 0 : 1;
  if (from >= weeks.length || !byWeek.has(weeks[from])) return { thisDone, kind: null, run: 0, capped: false };
  const kind = isSubmitted(byWeek.get(weeks[from])) ? 'sub' : 'miss';
  let run = 0, i = from;
  for (; i < weeks.length; i++) {
    const r = byWeek.get(weeks[i]);
    if (!r) break;
    if ((isSubmitted(r) ? 'sub' : 'miss') !== kind) break;
    run++;
  }
  return { thisDone, kind, run, capped: i === weeks.length };
}
function streakText(s) {
  if (!s.kind) return '';
  const n = s.run + (s.capped ? '주 넘게' : '주');
  if (s.kind === 'sub') return (s.thisDone ? '' : '지난주까지 ') + n + ' 연속 제출';
  return (s.thisDone ? '' : '지난주까지 ') + n + '째 미제출';
}

function catsOf(n) { const c = (n && n.categories && n.categories.length) ? n.categories : (n && n.category ? [n.category] : []); return c.length ? c : ['other']; }
function catLabel(k) { return CARE_LABEL[k] || k; }

// 이슈별 모으기. notes: care_notes (+ _cell · _week · _member 붙임). 태그 여럿이면 여러 묶음에 다 들어간다.
function groupIssues(notes) {
  const g = new Map();
  for (const n of notes || []) for (const k of catsOf(n)) { if (!g.has(k)) g.set(k, []); g.get(k).push(n); }
  const order = (k) => { const i = CARE_ORDER.indexOf(k); return i < 0 ? 99 : i; };
  return [...g.entries()].sort((a, b) => order(a[0]) - order(b[0])).map(([k, list]) => ({
    key: k, label: catLabel(k),
    items: list.slice().sort((a, b) => String(b._week || '').localeCompare(String(a._week || '')) || String(a._cellName || '').localeCompare(String(b._cellName || ''), 'ko'))
  }));
}

// 기도제목 모으기 — 세 군데서 온다: 새 기도제목(prayer_requests) · 돌봄 기록의 기도(care_notes.prayer) · 이어지는 기도(get_open_prayers).
// 같은 사람의 같은 글은 한 번만 (가장 최근 주). 사람별로 묶어 셀 이름 → 사람 이름 순.
function normText(t) { return String(t || '').replace(/\s+/g, ' ').trim(); }
function collectPrayers(items) {
  const seen = new Map();
  for (const p of items || []) {
    const text = normText(p.text); if (!text) continue;
    const key = (p.cellId || '') + '|' + (p.who || '') + '|' + text;
    const old = seen.get(key);
    if (!old || String(p.week || '') > String(old.week || '')) seen.set(key, { ...p, text });
  }
  const people = new Map();
  for (const p of seen.values()) {
    const k = (p.cellId || '') + '|' + (p.who || '');
    if (!people.has(k)) people.set(k, { cellId: p.cellId, cellName: p.cellName || '', who: p.who || '(이름 없음)', items: [] });
    people.get(k).items.push(p);
  }
  const list = [...people.values()];
  for (const x of list) x.items.sort((a, b) => String(b.week || '').localeCompare(String(a.week || '')));
  return list.sort((a, b) => a.cellName.localeCompare(b.cellName, 'ko') || a.who.localeCompare(b.who, 'ko'));
}

// 코멘트: 처음 여는 기기는 지금 있는 것을 모두 '본 것' 으로 (처음부터 전부 '새' 로 뜨면 알림이 뜻을 잃는다)
function unseenComments(comments, seen) {
  if (seen == null) return [];
  const s = new Set(seen);
  return (comments || []).filter(c => c && c.id != null && !s.has(String(c.id)));
}
function mergeSeen(seen, comments, cap) {
  const all = [...(seen || []), ...(comments || []).map(c => String(c.id))];
  const uniq = [...new Set(all)];
  return uniq.slice(Math.max(0, uniq.length - (cap || 800)));
}

// 출석 추이 — get_week_status 의 숫자만 쓴다 (보고서마다 따로 부르지 않는다)
function attendanceSeries(byWeek, weeks) {
  return weeks.slice().reverse().map(w => {
    const r = byWeek.get(w);
    const ok = r && isSubmitted(r) && r.members_present != null;
    return { week: w, has: !!ok, present: ok ? (r.members_present || 0) : 0, absent: ok ? (r.members_absent || 0) : 0, visitors: ok ? (r.visitors_present || 0) : 0 };
  });
}
function attendanceSummary(series) {
  const pts = series.filter(x => x.has);
  if (!pts.length) return { avg: null, last: null, delta: null, rate: null };
  const avg = pts.reduce((s, x) => s + x.present, 0) / pts.length;
  const last = pts[pts.length - 1];
  const prev = pts.length > 1 ? pts[pts.length - 2] : null;
  const tot = last.present + last.absent;
  return { avg: Math.round(avg * 10) / 10, last: last.present, delta: prev ? last.present - prev.present : null, rate: tot ? Math.round(last.present * 100 / tot) : null };
}

// 한 번에 너무 많이 부르지 않게 — 동시에 n 개까지
async function pool(items, n, fn) {
  const out = new Array(items.length); let i = 0;
  const work = async () => { while (i < items.length) { const k = i++; try { out[k] = await fn(items[k], k); } catch (e) { out[k] = { __err: e }; } } };
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, work));
  return out;
}
</script>

let sb = null;
function realApi() {
  if (!window.supabase) throw new Error('셀 케어 연결 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');
  sb = sb || window.supabase.createClient(CC_URL, CC_KEY, { auth: { flowType: 'implicit', persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  const rpc = async (name, args) => { const { data, error } = await sb.rpc(name, args || {}); if (error) throw error; return data; };
  const q = async (p) => { const { data, error } = await p; if (error) throw error; return data || []; };
  const chunks = (ids, n) => { const o = []; for (let i = 0; i < ids.length; i += n) o.push(ids.slice(i, i + n)); return o; };
  const inMany = async (mk, ids) => (await Promise.all(chunks(ids, 60).map(c => q(mk(c))))).flat();
  return {
    ctx: () => rpc('get_my_context'),
    assignments: (me) => q(sb.from('leadership_assignments').select('cell_id, start_date, end_date').eq('leadership_user_id', me)),
    weekStatus: (w) => rpc('get_week_status', { p_week_start: w }),
    reports: (ids) => inMany(c => sb.from('weekly_reports').select('*').in('id', c), ids),
    notes: (ids) => inMany(c => sb.from('care_notes').select('*').in('report_id', c), ids),
    newPrayers: (ids) => inMany(c => sb.from('prayer_requests').select('id, member_id, content, report_id').in('report_id', c), ids),
    members: (cellIds) => inMany(c => sb.from('cell_members').select('id, name, cell_id').in('cell_id', c), cellIds),
    roster: (id) => rpc('get_report_roster', { p_report: id }),
    openPrayers: (id) => rpc('get_open_prayers', { p_report: id }),
    comments: (id) => rpc('senior_comment_list', { p_report: id }),
  };
}

function scopeIds() {
  const all = [...new Set([].concat(...[...S.byWeek.values()].map(rows => rows.map(r => r.cell_id))))];
  if (PREF.scope === 'mine' && S.mineIds.length) return S.mineIds;
  return all;
}
function cellRow(cellId, w) { return (S.byWeek.get(w) || []).find(r => r.cell_id === cellId); }
function cellName(cellId) { for (const w of S.weeks) { const r = cellRow(cellId, w); if (r) return r.cell_name; } return ''; }
function leaderOf(cellId) { for (const w of S.weeks) { const r = cellRow(cellId, w); if (r && r.leader_names) return r.leader_names; } return ''; }
function cellWeekMap(cellId) { const m = new Map(); for (const w of S.weeks) { const r = cellRow(cellId, w); if (r) m.set(w, r); } return m; }
function sortedCells() { return scopeIds().slice().sort((a, b) => cellName(a).localeCompare(cellName(b), 'ko')); }
function memName(cellId, id, roster) {
  const m = S.members.get(id); if (m) return m.name;
  const r = (roster || []).find(x => x.member_id === id); return r ? r.name : '';
}

async function loadBase() {

  if (!ctx) { S.ctx = null; return renderNoAccount(); }
  S.ctx = ctx;
  S.weeks = weeksBack(ctx.this_week, WEEKS_LOADED);

  S.asg = asg || [];
  S.byWeek = new Map(S.weeks.map((w, i) => [w, lists[i] || []]));
  S.mineIds = pickMine(S.byWeek.get(S.weeks[0]), S.asg, ctx.profile.id, ctx.today);

// 보고서 내용 — 고른 기간(주 수)만큼. 이미 받은 보고서는 다시 받지 않는다.
async function loadDetails(span) {
  if (S.loadingDet) await S.loadingDet;
  const weeks = S.weeks.slice(0, span);
  const ids = [];
  for (const w of weeks) for (const c of scopeIds()) { const r = cellRow(c, w); if (r && isSubmitted(r) && !S.det.has(r.report_id)) ids.push(r.report_id); }
  if (!ids.length) { S.loadedSpan = Math.max(S.loadedSpan, span); return; }
  const api = S.api;
  S.loadingDet = (async () => {
    const needCells = scopeIds().filter(c => ![...S.members.values()].some(m => m.cell_id === c));
    const [reps, notes, pr, mem] = await Promise.all([
      api.reports(ids).catch(() => []), api.notes(ids).catch(() => []), api.newPrayers(ids).catch(() => []),
      needCells.length ? api.members(needCells).catch(() => []) : Promise.resolve([])
    ]);
    for (const m of mem || []) S.members.set(m.id, m);
    const cm = await pool(ids, 6, id => api.comments(id));
    // 이어지는 기도는 셀마다 가장 최근 보고서 하나만 (그 시점의 '계속 기도' 목록이다)
    const latest = new Map();
    for (const id of ids) { const rep = (reps || []).find(r => r.id === id); if (!rep) continue; const o = latest.get(rep.cell_id); if (!o || rep.week_start > o.week_start) latest.set(rep.cell_id, rep); }
    const openIds = [...latest.values()].map(r => r.id);
    const op = await pool(openIds, 6, id => api.openPrayers(id));
    ids.forEach((id, i) => {
      const rep = (reps || []).find(r => r.id === id) || null;
      const c = cm[i] && !cm[i].__err ? (cm[i] || []) : [];
      const oi = openIds.indexOf(id);
      S.det.set(id, { rep, notes: (notes || []).filter(n => n.report_id === id), newPrayers: (pr || []).filter(p => p.report_id === id),
        comments: c.filter(x => !x.target || x.target === 'report'), open: oi >= 0 && op[oi] && !op[oi].__err ? (op[oi] || []) : [], roster: null });
    });
    S.loadedSpan = Math.max(S.loadedSpan, span);
  })();
  try { await S.loadingDet; } finally { S.loadingDet = null; }
}
async function ensureRoster(ids) {
  const need = ids.filter(id => S.det.has(id) && !S.det.get(id).roster);
  const res = await pool(need, 6, id => S.api.roster(id));
  need.forEach((id, i) => { S.det.get(id).roster = res[i] && !res[i].__err ? (res[i] || []) : []; });
}

// 기간 안의 보고서 목록 (최근 주 → 셀 이름)
function reportsIn(span) {
  const out = [];
  for (const w of S.weeks.slice(0, span)) for (const c of sortedCells()) {
    const r = cellRow(c, w); if (!r || !isSubmitted(r)) continue;
    const d = S.det.get(r.report_id); if (!d) continue;
    out.push({ row: r, week: w, cellId: c, det: d });
  }
  return out;
}
function allComments() {
  const out = [];
  for (const x of reportsIn(S.loadedSpan)) for (const c of x.det.comments) out.push({ ...c, _cell: x.cellId, _cellName: cellName(x.cellId), _week: x.week, _rid: x.row.report_id });
  return out.sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')));
}
function refreshBadge() {
  const list = allComments();
  let seen = lsGet(SEEN_KEY, null);
  if (seen == null) { seen = mergeSeen([], list); lsSet(SEEN_KEY, seen); }   // 처음 여는 기기: 지금 것은 '본 것'
  S.newIds = new Set(unseenComments(list, seen).map(c => String(c.id)));
  const n = S.newIds.size;
  const t = document.querySelector('.tab[data-tab="comment"]');
  if (t) t.innerHTML = '코멘트' + (n ? `<span class="dot">${n}</span>` : '');
  if (n && !refreshBadge.told) { refreshBadge.told = true; toast('담임 목사님 · 사모님\n새 코멘트 ' + n + '개'); toast.at = Date.now(); }
}

  if (PREF.tab === 'comment' && S.newIds.size) { markCommentsSeen(); setTimeout(() => { S.newIds = new Set(); const t = document.querySelector('.tab[data-tab="comment"]'); if (t) t.textContent = '코멘트'; }, 400); }
  if (PREF.tab === 'week' && PREF.weekMode === 'page') fillPage();
}

// 판 바꾸기 — 나가고(150ms) → 그리고 → 들어온다(300ms). 앞(오른쪽)은 왼쪽으로 나간다.
let busyAnim = false;
function transit(dir, change, fromX) {
  const p = $('#panel');
  if (!p || quiet() || busyAnim) { change(); return; }
  busyAnim = true;
  const w = p.offsetWidth || 360;
  p.style.transition = 'transform .15s ease-in, opacity .15s ease-in';
  p.style.transform = `translateX(${-dir * w * 0.35}px)`; p.style.opacity = '0';
  setTimeout(() => {
    change();
    p.style.transition = 'none'; p.style.transform = `translateX(${dir * w * 0.35}px)`; p.style.opacity = '0';
    void p.offsetWidth;
    p.style.transition = 'transform .3s cubic-bezier(.22,.8,.24,1), opacity .3s cubic-bezier(.22,.8,.24,1)';
    p.style.transform = 'translateX(0)'; p.style.opacity = '1';
    setTimeout(() => { p.style.transition = ''; p.style.transform = ''; busyAnim = false; }, 320);
  }, fromX != null ? 90 : 150);
}
function goTab(id) {
  if (id === PREF.tab) return;
  const a = TABS.findIndex(t => t.id === PREF.tab), b = TABS.findIndex(t => t.id === id);
  transit(b > a ? 1 : -1, () => { PREF.tab = id; savePref(); markTab(); rerender(); window.scrollTo(0, 0); });
}
function setSpan(n) {
  PREF.span = n; savePref();
  if (S.loadedSpan >= n) return rerender();
  rerender();
  loadDetails(n).then(() => { refreshBadge(); rerender(); }).catch(e => toast(errText(e)));
}

// 손가락을 따라가는 좌우 넘김 (탭)
function bindSwipe() {
  const st = $('#stage'); if (!st) return;
  let x0 = 0, y0 = 0, dx = 0, on = false, lock = null, t0 = 0;
  st.addEventListener('touchstart', e => { if (busyAnim || e.touches.length > 1) return; const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; dx = 0; on = true; lock = null; t0 = Date.now(); }, { passive: true });
  st.addEventListener('touchmove', e => {
    if (!on) return; const t = e.touches[0]; const ddx = t.clientX - x0, ddy = t.clientY - y0;
    if (lock == null) { if (Math.abs(ddx) < 8 && Math.abs(ddy) < 8) return; lock = Math.abs(ddx) > Math.abs(ddy) * 1.2 ? 'x' : 'y'; }
    if (lock !== 'x') return;
    const i = TABS.findIndex(t => t.id === PREF.tab);
    const edge = (ddx > 0 && i === 0) || (ddx < 0 && i === TABS.length - 1);
    dx = edge ? ddx * 0.25 : ddx;
    const p = $('#panel'); const w = p.offsetWidth || 360;
    p.style.transition = 'none'; p.style.transform = `translateX(${dx}px)`; p.style.opacity = String(1 - Math.min(0.6, Math.abs(dx) / w));
  }, { passive: true });
  st.addEventListener('touchend', () => {
    if (!on) return; on = false; if (lock !== 'x') return;
    const p = $('#panel'); const w = p.offsetWidth || 360; const i = TABS.findIndex(t => t.id === PREF.tab);
    const fast = Date.now() - t0 < 250 && Math.abs(dx) > 40;
    const next = dx < 0 ? i + 1 : i - 1;
    if ((Math.abs(dx) > w / 4 || fast) && next >= 0 && next < TABS.length) {
      const dir = dx < 0 ? 1 : -1;
      p.style.transition = 'transform .09s ease-in, opacity .09s ease-in'; p.style.transform = `translateX(${-dir * w * 0.5}px)`; p.style.opacity = '0';
      transit(dir, () => { PREF.tab = TABS[next].id; savePref(); markTab(); rerender(); window.scrollTo(0, 0); }, dx);
    } else {
      p.style.transition = 'transform .3s cubic-bezier(.22,.8,.24,1), opacity .3s'; p.style.transform = 'translateX(0)'; p.style.opacity = '1';
      setTimeout(() => { p.style.transition = ''; p.style.transform = ''; }, 320);
    }
  });
}

function spanSeg() {
  return `<div class="seg noprint">${[[1, '이번 주'], [4, '4주'], [8, '8주'], [12, '12주']].map(([n, l]) => `<button class="${PREF.span === n ? 'on' : ''}" data-span="${n}">${l}</button>`).join('')}</div>`;
}
function waiting() { return S.loadedSpan < PREF.span ? '<div class="loading">보고서 내용을 불러오는 중…</div>' : ''; }

/* ---------- ① 이번 주 ---------- */
function weekSquares(cellId) {
  const m = cellWeekMap(cellId);
  return '<div class="weeks" title="왼쪽이 옛날 · 오른쪽이 이번 주">' + S.weeks.slice().reverse().map((w, i, a) => {
    const r = m.get(w); const now = i === a.length - 1 ? ' now' : '';
    if (!r) return `<span class="wk${now}" style="opacity:.35"></span>`;
    const st = stateOf(r);
    const cls = isSubmitted(r) ? (st === 'submitted' ? 'sub' : 'half') : (now ? '' : 'miss');
    return `<span class="wk ${cls}${now}"></span>`;
  }).join('') + '</div>';
}
function statePill(r) {
  const st = stateOf(r);
  return { submitted: '<span class="pill ok">제출</span>', revision: '<span class="pill warn">수정 요청</span>', reediting: '<span class="pill warn">고치는 중</span>',
    draft: '<span class="pill ac">작성 중</span>', missing: '<span class="pill bad">미제출</span>', none: '<span class="pill">셀 없음</span>' }[st];
}
function viewWeek() {
  const w = S.weeks[S.weekIdx]; const ids = sortedCells();
  const rows = ids.map(c => ({ c, r: cellRow(c, w) })).filter(x => x.r);
  const sub = rows.filter(x => isSubmitted(x.r));
  const miss = rows.filter(x => !isSubmitted(x.r));
  const head = `<div class="weeknav"><button data-act="wk-prev" ${S.weekIdx >= S.weeks.length - 1 ? 'disabled' : ''}>‹</button><b>${weekLabel(w, false)}${S.weekIdx === 0 ? ' · 이번 주' : ''}</b><button data-act="wk-next" ${S.weekIdx === 0 ? 'disabled' : ''}>›</button></div>
    <div class="row" style="justify-content:center;margin:2px 0 12px"><div class="seg"><button class="${PREF.weekMode === 'status' ? 'on' : ''}" data-wmode="status">제출 현황</button><button class="${PREF.weekMode === 'page' ? 'on' : ''}" data-wmode="page">한 장으로 보기</button></div></div>`;
  if (PREF.weekMode === 'page') return head + '<div id="page"><div class="loading">보고서를 모으는 중…</div></div>';
  if (!rows.length) return head + `<p class="empty">${PREF.scope === 'mine' ? '이 주에 보이는 담당 셀이 없습니다.' : '이 주에 보이는 셀이 없습니다.'}</p>`;
  const order = (x) => isSubmitted(x.r) ? 2 : (x.r.report_id ? 1 : 0);
  rows.sort((a, b) => order(a) - order(b) || cellName(a.c).localeCompare(cellName(b.c), 'ko'));
  let h = head + `<div class="stats"><div class="stat"><div class="v">${rows.length}</div><div class="k">${PREF.scope === 'mine' && S.mineIds.length ? '담당 셀' : '셀'}</div></div>
    <div class="stat ok"><div class="v">${sub.length}</div><div class="k">제출</div></div>
    <div class="stat ${miss.length ? 'warn' : ''}"><div class="v">${miss.length}</div><div class="k">${S.weekIdx === 0 ? '아직' : '미제출'}</div></div></div>`;
  h += '<div class="card" style="padding:4px 14px">' + rows.map(({ c, r }) => {
    const s = streakOf(cellWeekMap(c), S.weeks.slice(S.weekIdx));
    const txt = streakText(s);
    const hot = s.kind === 'miss' && s.run >= 2;
    return `<button class="cellrow" data-act="open-rep" data-cell="${esc(c)}"><div style="flex:1;min-width:0"><div class="row"><span class="nm">${esc(r.cell_name)}</span>${statePill(r)}</div>
      <div class="meta">${esc(r.leader_names || '')}${r.submitted_at && isSubmitted(r) ? ' · ' + dateTime(r.submitted_at) : ''}</div>${weekSquares(c)}</div>
      <div style="text-align:right;font-size:12.5px;min-width:86px" class="${hot ? '' : 'muted'}">${hot ? '<span style="color:var(--bad)">' + esc(txt) + '</span>' : esc(txt)}</div></button>`;
  }).join('') + '</div>';
  h += '<p class="tiny muted" style="text-align:center">네모 12칸 = 지난 12주 (오른쪽 끝이 이번 주). 초록 제출 · 주황 수정 요청/고치는 중 · 빨강 미제출</p>';
  return h;
}
async function fillPage() {
  const w = S.weeks[S.weekIdx];
  const idx = S.weekIdx;
  if (S.loadedSpan < idx + 1) await loadDetails(idx + 1).catch(() => {});
  const list = sortedCells().map(c => cellRow(c, w)).filter(r => r && isSubmitted(r) && S.det.has(r.report_id));
  await ensureRoster(list.map(r => r.report_id));
  const box = $('#page'); if (!box || S.weekIdx !== idx || PREF.weekMode !== 'page' || PREF.tab !== 'week') return;
  const missing = sortedCells().map(c => cellRow(c, w)).filter(r => r && !isSubmitted(r));
  box.innerHTML = (list.length ? list.map(r => repCard(r)).join('') : '<p class="empty">이 주에 제출된 보고서가 없습니다.</p>')
    + (missing.length ? `<div class="card"><h3>아직 안 낸 셀</h3><div class="small">${missing.map(r => esc(r.cell_name) + (r.leader_names ? ' <span class="muted">(' + esc(r.leader_names) + ')</span>' : '')).join(' · ')}</div></div>` : '');
  if (fillPage.jump) { const el = document.getElementById('rep-' + fillPage.jump); fillPage.jump = null; if (el) el.scrollIntoView({ block: 'start', behavior: quiet() ? 'auto' : 'smooth' }); }

function repCard(r) {

    <div class="small muted">${rep.meeting_held === false ? '모임 못 함' + (rep.meeting_cancel_reason ? ' — ' + esc(rep.meeting_cancel_reason) : '') : [dayLabel(rep.meeting_date), rep.meeting_time ? esc(String(rep.meeting_time).slice(0, 5)) : '', esc(rep.meeting_place || '')].filter(Boolean).join(' · ')}${r.submitted_at ? ' · ' + dateTime(r.submitted_at) + ' 제출' : ''}</div>`;
  if (rep.meeting_held !== false) h += `<div class="sect"><div class="lbl">출석 ${pres.length}/${listed.length}${vis.length ? ' · 방문 ' + vis.length : ''}</div>
      <div class="names">${pres.map(x => esc(x.name)).join(', ') || '<span class="muted">—</span>'}</div>
      ${abs.length ? `<div class="names muted small">결석: ${abs.map(x => esc(x.name) + (x.absence_reason ? '(' + esc(x.absence_reason) + ')' : '')).join(', ')}</div>` : ''}

      <div class="txt">${esc(n.content || '')}</div>${n.prayer ? `<div class="pray">🙏 ${esc(n.prayer)}</div>` : ''}</div>`).join('')}</div>`;

  if (prays.length) h += `<div class="sect"><div class="lbl">기도제목</div>${prays.map(p => `<div class="note"><span class="who">${esc(p.who || '')}</span> ${p.tag ? `<span class="pill ac">${esc(p.tag)}</span>` : ''}<div class="txt">${esc(p.text || '')}</div>${p.note ? `<div class="pray">이번 주: ${esc(p.note)}</div>` : ''}</div>`).join('')}</div>`;
  if (rep.grace_notes && !rep.grace_none) h += `<div class="sect"><div class="lbl">은혜와 나눔</div><div class="txt" style="white-space:pre-wrap;font-size:14px">${esc(rep.grace_notes)}</div></div>`;

function cmtBox(c) {

}

/* ---------- ② 기도제목 ---------- */
function viewPrayer() {
  let h = `<div class="row" style="margin:12px 0">${spanSeg()}</div>`;
  const wait = waiting(); if (wait) return h + wait;
  const items = [];
  for (const x of reportsIn(PREF.span)) {
    const nm = (id) => memName(x.cellId, id, x.det.roster) || '';
    const cn = cellName(x.cellId);
    for (const p of x.det.newPrayers) items.push({ cellId: x.cellId, cellName: cn, who: nm(p.member_id), text: p.content, week: x.week, kind: '새 기도제목' });
    for (const n of x.det.notes) if (n.prayer) items.push({ cellId: x.cellId, cellName: cn, who: nm(n.member_id), text: n.prayer, week: x.week, kind: catsOf(n).map(catLabel).join(' · ') });
    for (const p of x.det.open) items.push({ cellId: x.cellId, cellName: cn, who: p.member_name, text: p.content, week: x.week, kind: PRAYER_LABEL[p.this_week_status] || '계속 기도', note: p.this_week_note });
  }
  const people = collectPrayers(items);
  const cells = [...new Set(people.map(p => p.cellId))];
  if (PREF.prayCell !== 'all' && !cells.includes(PREF.prayCell)) PREF.prayCell = 'all';
  h += `<div class="chips"><button class="chip ${PREF.prayCell === 'all' ? 'on' : ''}" data-pcell="all">전체<span class="n">${people.length}</span></button>${cells.map(c => `<button class="chip ${PREF.prayCell === c ? 'on' : ''}" data-pcell="${esc(c)}">${esc(cellName(c))}<span class="n">${people.filter(p => p.cellId === c).length}</span></button>`).join('')}</div>`;
  const show = people.filter(p => PREF.prayCell === 'all' || p.cellId === PREF.prayCell);
  if (!show.length) return h + '<p class="empty">이 기간에 적힌 기도제목이 없습니다.</p>';
  let last = '';
  for (const p of show) {
    if (p.cellName !== last) { if (last) h += '</div>'; last = p.cellName; h += `<h3 style="font-size:13px;font-weight:500;color:var(--tx3);margin:16px 2px 6px">${esc(p.cellName)}</h3><div class="card" style="padding:4px 15px">`; }
    h += `<div class="note"><span class="who">${esc(p.who)}</span>${p.items.map(it => `<div class="txt">• ${esc(it.text)} <span class="tiny muted">${esc(shortWeek(it.week))}${it.kind ? ' · ' + esc(it.kind) : ''}</span></div>${it.note ? `<div class="pray">이번 주: ${esc(it.note)}</div>` : ''}`).join('')}</div>`;
  }
  return h + (last ? '</div>' : '');
}

/* ---------- ③ 이슈 ---------- */
function viewIssue() {
  let h = `<div class="row" style="margin:12px 0">${spanSeg()}</div>`;
  const wait = waiting(); if (wait) return h + wait;
  const notes = [];
  for (const x of reportsIn(PREF.span)) for (const n of x.det.notes) notes.push({ ...n, _week: x.week, _cell: x.cellId, _cellName: cellName(x.cellId), _who: memName(x.cellId, n.member_id, x.det.roster) || '(이름 없음)' });
  const groups = groupIssues(notes);
  if (PREF.issue !== 'all' && PREF.issue !== 'attn' && !groups.some(g => g.key === PREF.issue)) PREF.issue = 'all';
  const attn = notes.filter(n => n.leadership_attention_required);
  h += `<div class="chips"><button class="chip ${PREF.issue === 'all' ? 'on' : ''}" data-issue="all">전체<span class="n">${notes.length}</span></button>${attn.length ? `<button class="chip ${PREF.issue === 'attn' ? 'on' : ''}" data-issue="attn">확인 필요<span class="n">${attn.length}</span></button>` : ''}${groups.map(g => `<button class="chip ${PREF.issue === g.key ? 'on' : ''}" data-issue="${esc(g.key)}">${esc(g.label)}<span class="n">${g.items.length}</span></button>`).join('')}</div>`;

    <div class="txt">${esc(n.content || '')}</div>${n.prayer ? `<div class="pray">🙏 ${esc(n.prayer)}</div>` : ''}</div>`;

/* ---------- ⑤ 출석 ---------- */

  for (const c of ids) {
    const ser = attendanceSeries(cellWeekMap(c), S.weeks);

    h += `<div class="card"><div class="row"><h3 style="margin:0">${esc(cellName(c))}</h3><span class="spacer"></span><span class="small muted">${sm.avg == null ? '기록 없음' : '평균 ' + sm.avg + '명 · 최근 ' + sm.last + '명' + (sm.delta ? (sm.delta > 0 ? ' ▲' + sm.delta : ' ▼' + (-sm.delta)) : '') + (sm.rate != null ? ' · ' + sm.rate + '%' : '')}</span></div>
      <div class="bars">${ser.map(x => x.has ? `<div class="bar"><span class="n">${x.present}</span>${x.visitors ? `<div class="b v" style="height:${x.visitors / max * 52}px"></div>` : ''}<div class="b" style="height:${Math.max(2, x.present / max * 52)}px"></div></div>` : '<div class="bar"><div class="b none"></div></div>').join('')}</div>
      <div class="barx">${ser.map((x, i) => `<span>${esc(i && x.week.slice(5, 7) === ser[i - 1].week.slice(5, 7) ? String(+x.week.slice(8, 10)) : shortWeek(x.week))}</span>`).join('')}</div></div>`;
  }
  return h;
}

/* =====================================================================
   로그인
   ===================================================================== */
const LOGIN = { email: lsGet('cell_email', ''), sent: false, busy: false, msg: '' };
function viewLogin() {
  $('#root').innerHTML = `<div class="login"><h1>셀 한눈에</h1>
    <p class="sub" style="margin:0 0 6px">셀 케어에서 쓰시는 이메일로 로그인합니다. 셀 케어 보고서를 <b>읽기만</b> 해서 다시 정리해 보여 드립니다.</p>
    ${!LOGIN.sent ? `<input type="email" id="lg-email" placeholder="이메일" value="${esc(LOGIN.email)}" autocomplete="email" inputmode="email">
      <button class="btn pri wide" data-act="send" ${LOGIN.busy ? 'disabled' : ''}>${LOGIN.busy ? '보내는 중…' : '로그인 코드 받기'}</button>`
    : `<p class="small" style="margin:12px 0 0"><b>${esc(LOGIN.email)}</b> 로 보낸 숫자 코드를 넣어 주세요.</p>
      <input type="text" id="lg-code" placeholder="숫자 코드" inputmode="numeric" autocomplete="one-time-code" maxlength="10">
      <button class="btn pri wide" data-act="verify" ${LOGIN.busy ? 'disabled' : ''}>${LOGIN.busy ? '확인 중…' : '로그인'}</button>
      <button class="btn wide" data-act="back">이메일 다시 쓰기</button>`}
    ${LOGIN.msg ? `<p class="err">${esc(LOGIN.msg)}</p>` : ''}
    <p class="tiny muted" style="margin-top:22px">셀 케어 앱과 같은 계정이라, 셀 케어에서 보시던 셀만 보입니다. 이 앱은 셀 케어에 아무것도 쓰지 않으며, 성도 정보를 따로 저장하지 않습니다.</p>
    <p style="text-align:center;margin-top:18px"><a href="?demo=1" style="color:var(--ac);font-size:13.5px">지어낸 자료로 미리보기 →</a></p>
    <p class="ver">${esc(APP_VERSION)}</p></div>`;
  const i = $('#lg-email') || $('#lg-code'); if (i) setTimeout(() => i.focus(), 50);
}
async function sendCode() {
  const email = ($('#lg-email')?.value || '').trim().toLowerCase();
  LOGIN.email = email; LOGIN.msg = '';
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { LOGIN.msg = '이메일 주소를 다시 확인해 주세요.'; return viewLogin(); }
  lsSet('cell_email', email);
  LOGIN.busy = true; viewLogin();
  try { realApi(); } catch (e) { LOGIN.busy = false; LOGIN.msg = e.message; return viewLogin(); }
  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false } });
  LOGIN.busy = false;
  if (error) {
    const m = error.message || '';
    LOGIN.msg = /rate|security purposes|seconds/i.test(m) ? '메일을 너무 자주 요청했습니다.\n잠시 후 다시 시도해 주세요.'
      : /signup|not allowed|not found|Signups|NOT_APPROVED|Database error/i.test(m) ? '셀 케어에 등록된 이메일이 아닙니다.\n셀 케어에서 쓰시는 이메일인지 확인해 주세요.'
      : '메일을 보내지 못했습니다. (' + m + ')';
    return viewLogin();
  }
  LOGIN.sent = true; viewLogin();
}
async function verifyCode() {
  const token = ($('#lg-code')?.value || '').replace(/\D/g, '');
  if (token.length < 6) { LOGIN.msg = '메일로 받은 숫자 코드를 그대로 넣어 주세요.'; return viewLogin(); }
  LOGIN.busy = true; LOGIN.msg = ''; viewLogin();
  const { error } = await sb.auth.verifyOtp({ email: LOGIN.email, token, type: 'email' });
  LOGIN.busy = false;
  if (error) { LOGIN.msg = '코드가 맞지 않거나 시간이 지났습니다.\n메일을 다시 받아 주세요.'; return viewLogin(); }
  LOGIN.sent = false; startReal();
}
function renderNoAccount() {
  $('#root').innerHTML = `<div class="login"><h1>셀 케어 명단에 없는 계정입니다</h1><p class="sub">로그인은 되었지만 셀 케어 명단에 이 이메일이 없거나 사용이 중지된 상태입니다.</p><button class="btn" data-act="logout">로그아웃</button></div>`;
}
function renderError(e) {
  $('#root').innerHTML = `<div class="login"><h1>불러오지 못했습니다</h1><p class="err">${esc(errText(e))}</p>
    <p class="tiny muted">셀 케어 앱의 구조가 바뀌었을 수도 있습니다. 계속되면 알려 주세요.</p>
    <button class="btn pri" data-act="reload">다시 시도</button> <button class="btn" data-act="logout">로그아웃</button></div>`;
}

/* =====================================================================
   누르기
   ===================================================================== */
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act],[data-tab],[data-span],[data-wmode],[data-issue],[data-pcell]');
  const menu = $('#menu');
  if (menu && !e.target.closest('#menu') && !(b && b.dataset.act === 'menu')) menu.remove();
  if (!b) return;
  const d = b.dataset;
  if (d.tab) return goTab(d.tab);
  if (d.span) return setSpan(+d.span);
  if (d.wmode) { PREF.weekMode = d.wmode; savePref(); return rerender(); }
  if (d.issue) { PREF.issue = d.issue; savePref(); return rerender(); }
  if (d.pcell) { PREF.prayCell = d.pcell; savePref(); return rerender(); }
  switch (d.act) {
    case 'send': return sendCode();
    case 'verify': return verifyCode();
    case 'back': LOGIN.sent = false; LOGIN.msg = ''; return viewLogin();
    case 'wk-prev': if (S.weekIdx < S.weeks.length - 1) transit(-1, () => { S.weekIdx++; rerender(); }); return;
    case 'wk-next': if (S.weekIdx > 0) transit(1, () => { S.weekIdx--; rerender(); }); return;
    case 'open-rep': fillPage.jump = d.cell; PREF.weekMode = 'page'; savePref(); return rerender();
    case 'see-rep': { const wi = S.weeks.indexOf(d.week); if (wi >= 0) S.weekIdx = wi; fillPage.jump = d.cell; PREF.weekMode = 'page'; PREF.tab = 'week'; savePref(); markTab(); rerender(); return; }
    case 'print': return window.print();
    case 'menu': {
      if (menu) return menu.remove();
      const who = S.ctx ? S.ctx.profile.name : '';
      const m = document.createElement('div'); m.className = 'menu'; m.id = 'menu';
      m.innerHTML = `<div class="info">${esc(who)}${S.mineIds.length ? ' · 담당 셀 ' + S.mineIds.length + '곳' : ''}</div>
        ${S.mineIds.length ? `<button data-act="scope">${PREF.scope === 'mine' ? '볼 수 있는 셀 전체 보기' : '내 담당 셀만 보기'}</button>` : ''}
        <button data-act="reload">새로 불러오기</button>
        <button data-act="logout">${DEMO ? '미리보기 끝내기' : '로그아웃'}</button>`;
      b.parentElement.appendChild(m); return;
    }
    case 'scope': PREF.scope = PREF.scope === 'mine' ? 'all' : 'mine'; savePref(); menu && menu.remove();
      toast(PREF.scope === 'mine' ? '내 담당 셀만\n보여 드립니다' : '볼 수 있는 셀을\n모두 보여 드립니다'); toast.at = Date.now();
      rerender(); loadDetails(Math.max(PREF.span, S.weekIdx + 1)).then(() => { refreshBadge(); rerender(); }); return;
    case 'reload': menu && menu.remove(); return start();
    case 'logout': menu && menu.remove();
      if (DEMO) { location.href = location.pathname; return; }
      try { await sb.auth.signOut(); } catch (_) { }
      S.ctx = null; return viewLogin();
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'lg-email') sendCode();
  if (e.key === 'Enter' && e.target.id === 'lg-code') verifyCode();
  if (e.key === 'Escape') { const m = $('#menu'); if (m) m.remove(); }
});
addEventListener('resize', () => markTab());

/* =====================================================================
   시작
   ===================================================================== */
async function startReal() {
  $('#root').innerHTML = '<div class="loading">셀 케어에서 불러오는 중…</div>';
  try { S.api = realApi(); await loadBase(); } catch (e) { renderError(e); }
}
async function start() {
  if (DEMO) { S.api = demoApi(); try { await loadBase(); } catch (e) { renderError(e); } return; }
  let api; try { api = realApi(); } catch (e) { return renderError(e); }
  const { data } = await sb.auth.getSession();
  if (data && data.session) return startReal();
  viewLogin();
}
start();
</script>
