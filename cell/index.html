const SEEN_KEY = 'cell_seen_v1';          // 이미 본 코멘트 id 만 (내용은 두지 않는다)
const PREF_KEY = 'cell_pref_v1';          // 화면 취향(고른 탭 · 기간 · 범위)
const WEEKS_LOADED = 12;
// 셀 케어는 2026년 10월에 시작한 새 시스템이다 (HB 11/6) — 그 전 주는 보여 주지 않는다. 주가 쌓이면 12주까지 늘어난다.
const CC_START = '2026-10-01';                  // 제출 흐름 · 출석 추이에 쓰는 주 수

// 셀 케어의 표시 이름 그대로 (그쪽 L.care · L.att · L.prayer)
const CARE_LABEL = {
  update: '근황', prayer: '기도제목', faith: '신앙', health: '건강', family: '가정',
  work_school: '직장 / 학업', relationship: '관계', long_absence: '장기결석', care_needed: '돌봄 필요', other: '기타'
};
const CARE_ORDER = ['faith', 'long_absence', 'update', 'health', 'family', 'work_school', 'relationship', 'care_needed', 'prayer', 'other'];
const PRAYER_LABEL = { ongoing: '계속 기도', answered: '응답됨', closed: '종료' };
const MSG_LABEL = { none: '', prayer: '기도가 필요합니다', contact: '연락 또는 상담이 필요합니다', advice: '교역자의 조언이 필요합니다', share_up: '상위 공유가 필요합니다' };

function addDays(iso, n) { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
// 이번 주부터 거꾸로 n 주 (주 시작일 ISO)
function weeksBack(thisWeek, n) { const out = []; for (let i = 0; i < n; i++) out.push(addDays(thisWeek, -7 * i)); return out; }
function weekLabel(iso, withYear) {
  const y = +iso.slice(0, 4), m = +iso.slice(5, 7), d = +iso.slice(8, 10);
  return (withYear ? y + '년 ' : '') + m + '월 ' + Math.ceil(d / 7) + '주차';
}
function shortWeek(iso) { return (+iso.slice(5, 7)) + '/' + (+iso.slice(8, 10)); }

// '내 분파셀' — 셀 케어 교역자 홈(viewLeadershipHome)과 같은 판정 + 내 직접 셀.
// rows: get_week_status 한 주 · asg: leadership_assignments · meId · today(ISO)
function pickMine(rows, asg, meId, today) {
  const cur = new Set((asg || []).filter(a => a.start_date <= today && (!a.end_date || a.end_date >= today)).map(a => a.cell_id));
  // + 내가 직접 인도하는 셀(i_am_leader) — 확인 방식(담임 직접 · 검토 없음)과 상관없이 넣는다 (HB 11/6)
  const mine = (rows || []).filter(r => r.i_am_leader || (r.review_mode === 'leadership' &&
    (cur.has(r.cell_id) || r.responsible_leadership_id === meId || r.i_can_review)));
  return mine.map(r => r.cell_id);
}

// 냈는가 — 제출 · 수정 요청(냈다가 되돌려 받음) · 고치는 중(한 번이라도 냈음)
function isSubmitted(r) {
  if (!r || !r.report_id) return false;
  return r.status === 'submitted' || r.status === 'revision_requested' || (r.status === 'draft' && (r.submission_no || 0) > 0);
}
function stateOf(r) {
  if (!r) return 'none';
  if (!r.report_id) return 'missing';
  if (r.status === 'submitted') return 'submitted';
  if (r.status === 'revision_requested') return 'revision';
  if (r.status === 'draft' && (r.submission_no || 0) > 0) return 'reediting';
  return 'draft';
}

// 셀이 처음 보고서를 내기 전 주는 '미제출' 이 아니라 '아직 시작 전' 이다 (HB 11/6: 이흥배 셀 — 5주 다 냈는데 제출이 주황).
// 12주 안에 낸 보고서가 하나라도 있으면, 가장 옛 제출보다 더 옛 주의 줄은 지운다. 한 번도 안 냈으면 그대로 둔다(진짜 미제출).
// ⚠️ 한동안 안 내다가 다시 내기 시작한 셀도 같은 모양이라 '시작 전' 으로 읽힌다 — 12주 안에서는 둘을 가를 자료가 없다.
function trimBeforeStart(byWeek, weeks) {
  let oldest = -1;
  weeks.forEach((w, i) => { if (isSubmitted(byWeek.get(w))) oldest = i; });
  if (oldest < 0) return byWeek;
  const out = new Map();
  weeks.forEach((w, i) => { if (i <= oldest && byWeek.has(w)) out.set(w, byWeek.get(w)); });
  return out;
}
// 모임을 못 해 출석을 안 받은 주(참석 0 · 결석 0)는 0명이 아니라 '쉼'
function attTaken(r) { return !!(r && isSubmitted(r) && r.members_present != null && ((r.members_present || 0) + (r.members_absent || 0) + (r.visitors_present || 0)) > 0); }
// 연속 주 수. byWeek: Map(week → 그 셀의 줄), weeks: 이번 주부터 거꾸로.
// 이번 주를 냈으면 이번 주부터, 아직이면 지난주부터 센다(이번 주는 아직 기한 안일 수 있다).
// 그 주에 셀 줄 자체가 없으면(셀이 없던 때) 거기서 끊는다.
function streakOf(byWeek, weeks) {
  const thisDone = isSubmitted(byWeek.get(weeks[0]));
  const from = thisDone ? 0 : 1;
  if (from >= weeks.length || !byWeek.has(weeks[from])) return { thisDone, kind: null, run: 0, capped: false };
  const kind = isSubmitted(byWeek.get(weeks[from])) ? 'sub' : 'miss';
  let run = 0, i = from;
  for (; i < weeks.length; i++) {
    const r = byWeek.get(weeks[i]);
    if (!r) break;
    if ((isSubmitted(r) ? 'sub' : 'miss') !== kind) break;
    run++;
  }
  return { thisDone, kind, run, capped: i === weeks.length };
}
function streakText(s) {
  if (!s.kind) return '';

  if (s.kind === 'sub') return pre + s.run + (s.capped ? '주 넘게' : '주') + ' 연속 제출';
  return pre + (s.capped ? s.run + '주 넘게 미제출' : s.run + '주째 미제출');
}

function catsOf(n) { const c = (n && n.categories && n.categories.length) ? n.categories : (n && n.category ? [n.category] : []); return c.length ? c : ['other']; }
function catLabel(k) { return CARE_LABEL[k] || k; }

// 이슈별 모으기. notes: care_notes (+ _cell · _week · _member 붙임). 태그 여럿이면 여러 묶음에 다 들어간다.
function groupIssues(notes) {
  const g = new Map();
  for (const n of notes || []) for (const k of catsOf(n)) { if (!g.has(k)) g.set(k, []); g.get(k).push(n); }
  const order = (k) => { const i = CARE_ORDER.indexOf(k); return i < 0 ? 99 : i; };
  return [...g.entries()].sort((a, b) => order(a[0]) - order(b[0])).map(([k, list]) => ({
    key: k, label: catLabel(k),
    items: list.slice().sort((a, b) => String(b._week || '').localeCompare(String(a._week || '')) || String(a._cellName || '').localeCompare(String(b._cellName || ''), 'ko'))
  }));
}

// 셀 × 이슈 표. notes 에 _cell · _cellName 붙임. 줄 합계는 '근황 몇 건'(태그 여럿이어도 한 건), 열은 태그별.
// '확인 필요'(교역자 확인 필요 표시)는 맨 앞 열로 따로 센다.
function issueMatrix(notes) {
  const count = {}, rowTotal = {}, colTotal = {}, names = {};
  let attn = false;
  for (const n of notes || []) {
    const c = n._cell; names[c] = n._cellName || '';
    rowTotal[c] = (rowTotal[c] || 0) + 1;
    const tags = catsOf(n).concat(n.leadership_attention_required ? ['attn'] : []);
    if (n.leadership_attention_required) attn = true;
    for (const t of tags) { count[c + '|' + t] = (count[c + '|' + t] || 0) + 1; colTotal[t] = (colTotal[t] || 0) + 1; }
  }
  const order = (k) => { const i = CARE_ORDER.indexOf(k); return i < 0 ? 99 : i; };
  const tags = (attn ? ['attn'] : []).concat(Object.keys(colTotal).filter(t => t !== 'attn').sort((a, b) => order(a) - order(b)));
  const cells = Object.keys(rowTotal).sort((a, b) => names[a].localeCompare(names[b], 'ko'));
  const max = Math.max(1, ...Object.values(count));
  return { cells, tags, count, rowTotal, colTotal, total: (notes || []).length, max };
}

// 이슈 표 고르기 (HB 11/6: 가로 · 세로 여럿 고르기 + 축 접기). 예전 모양({cell, tag})도 읽는다.
function issNorm(v) {
  v = v || {};
  const cells = Array.isArray(v.cells) ? v.cells.slice() : (v.cell && v.cell !== 'all' ? [v.cell] : []);
  const tags = Array.isArray(v.tags) ? v.tags.slice() : (v.tag && v.tag !== 'all' ? [v.tag] : []);
  return { cells, tags, foldCell: !!v.foldCell, foldTag: !!v.foldTag };
}
// key: 'c|all'(셀 하나 넣고 빼기) · 'all|t'(이슈 하나) · 'c|t'(칸: 둘 다 골랐으면 둘 다 빼고, 아니면 둘 다 넣기) · 'all|all'(지우기)
function issPick(v, key) {
  const s = issNorm(v); const [c, t] = String(key).split('|');
  const tog = (arr, x, on) => { const i = arr.indexOf(x); if (on === undefined) on = i < 0; if (on && i < 0) arr.push(x); if (!on && i >= 0) arr.splice(i, 1); };
  if (c === 'all' && t === 'all') { s.cells = []; s.tags = []; return s; }
  if (t === 'all') { tog(s.cells, c); return s; }
  if (c === 'all') { tog(s.tags, t); return s; }
  const both = s.cells.includes(c) && s.tags.includes(t);
  tog(s.cells, c, !both); tog(s.tags, t, !both); return s;
}
// 실제로 거르는 값 — 접힌 축은 쓰지 않는다 · 지금 표에 없는 셀 · 이슈는 버린다
function issState(mx, v) {
  const s = issNorm(v === undefined ? (typeof PREF !== 'undefined' ? PREF.iss : null) : v);
  return { foldCell: s.foldCell, foldTag: s.foldTag,
    cells: s.foldCell ? [] : s.cells.filter(c => mx.cells.includes(c)), tags: s.foldTag ? [] : s.tags.filter(t => mx.tags.includes(t)) };
}

// 기도제목 모으기 — 세 군데서 온다: 새 기도제목(prayer_requests) · 돌봄 기록의 기도(care_notes.prayer) · 이어지는 기도(get_open_prayers).
// 같은 사람의 같은 글은 한 번만 (가장 최근 주). 사람별로 묶어 셀 이름 → 사람 이름 순.
function normText(t) { return String(t || '').replace(/\s+/g, ' ').trim(); }
function collectPrayers(items) {
  const seen = new Map();
  for (const p of items || []) {
    const text = normText(p.text); if (!text) continue;
    const key = (p.cellId || '') + '|' + (p.who || '') + '|' + text;
    const old = seen.get(key);
    if (!old || String(p.week || '') > String(old.week || '')) seen.set(key, { ...p, text });
  }
  const people = new Map();
  for (const p of seen.values()) {
    const k = (p.cellId || '') + '|' + (p.who || '');
    if (!people.has(k)) people.set(k, { cellId: p.cellId, cellName: p.cellName || '', who: p.who || '(이름 없음)', items: [] });
    people.get(k).items.push(p);
  }
  const list = [...people.values()];
  for (const x of list) x.items.sort((a, b) => String(b.week || '').localeCompare(String(a.week || '')));
  return list.sort((a, b) => a.cellName.localeCompare(b.cellName, 'ko') || a.who.localeCompare(b.who, 'ko'));
}

// 코멘트: 처음 여는 기기는 지금 있는 것을 모두 '본 것' 으로 (처음부터 전부 '새' 로 뜨면 알림이 뜻을 잃는다)
function unseenComments(comments, seen) {
  if (seen == null) return [];
  const s = new Set(seen);
  return (comments || []).filter(c => c && c.id != null && !s.has(String(c.id)));
}
function mergeSeen(seen, comments, cap) {
  const all = [...(seen || []), ...(comments || []).map(c => String(c.id))];
  const uniq = [...new Set(all)];
  return uniq.slice(Math.max(0, uniq.length - (cap || 800)));
}

// 출석 추이 — get_week_status 의 숫자만 쓴다 (보고서마다 따로 부르지 않는다)
function attendanceSeries(byWeek, weeks) {
  return weeks.slice().reverse().map(w => {
    const r = byWeek.get(w);
    const ok = attTaken(r);
    return { week: w, has: ok, off: !!(r && isSubmitted(r) && !ok), present: ok ? (r.members_present || 0) : 0, absent: ok ? (r.members_absent || 0) : 0, visitors: ok ? (r.visitors_present || 0) : 0 };
  });
}
function attendanceSummary(series) {
  const pts = series.filter(x => x.has);
  if (!pts.length) return { avg: null, last: null, delta: null, rate: null };
  const avg = pts.reduce((s, x) => s + x.present, 0) / pts.length;
  const last = pts[pts.length - 1];
  const prev = pts.length > 1 ? pts[pts.length - 2] : null;
  const tot = last.present + last.absent;
  return { avg: Math.round(avg * 10) / 10, last: last.present, delta: prev ? last.present - prev.present : null, rate: tot ? Math.round(last.present * 100 / tot) : null };
}

/* ---------- 사람 단위 (L8~L11) ---------- */
// rows: [{ member_id, status, week, cellId, visitor? }] — attendance 표(방문 여부 모름) 또는 명단(type_in_week 앎)에서.
// members: cell_members 줄. 방문 여부를 모르면 '들어온 날(joined_at) 전 주에 왔으면 방문' 으로 읽는다.
function buildPeople(rows, members) {
  const P = new Map();
  const mem = new Map((members || []).map(m => [m.id, m]));
  for (const r of rows || []) {
    if (!r || !r.member_id || !r.week) continue;
    let p = P.get(r.member_id);
    if (!p) { const m = mem.get(r.member_id) || {}; p = { id: r.member_id, name: m.name || r.name || '', cellId: m.cell_id || r.cellId, type: m.member_type || null, joined: m.joined_at || null, wk: new Map(), visitorWeeks: new Set() }; P.set(r.member_id, p); }
    if (!p.name && r.name) p.name = r.name;
    if (r.status === 'present' || r.status === 'absent') p.wk.set(r.week, r.status);
    const vis = r.visitor != null ? r.visitor : !!(p.joined && r.week < String(p.joined).slice(0, 10));
    if (vis && r.status === 'present') p.visitorWeeks.add(r.week);
  }
  return P;
}
// 한 사람의 흐름. weeks: 이번 주부터 거꾸로. 그 사람 기록이 있는 주만 센다(셀이 보고서를 안 낸 주는 건너뜀).
function personStats(p, weeks) {
  const seq = weeks.filter(w => p.wk.has(w)).map(w => ({ w, s: p.wk.get(w) }));
  let absentRun = 0; for (const x of seq) { if (x.s !== 'absent') break; absentRun++; }
  const rate = (a) => a.length ? a.filter(x => x.s === 'present').length / a.length : null;
  const recent = seq.slice(0, 4), prev = seq.slice(4, 12);
  const last = seq.find(x => x.s === 'present');
  return { seq, absentRun, recentRate: rate(recent), prevRate: rate(prev), recentN: recent.length, prevN: prev.length,
    present: seq.filter(x => x.s === 'present').length, lastPresent: last ? last.w : null };
}
const HEAVY = { long_absence: 3, care_needed: 2, health: 2, family: 1, relationship: 1 };
// A 이번 주 연락할 분. notes: 최근 2주(셀마다 낸 보고서 기준) 근황(+ _cell · _week · member_id). asks: 셀리더 요청 [{cellId, kind, note, week}]
function careList(people, weeks, notes, asks) {
  const out = new Map();
  const add = (key, base, reason, score) => { if (!out.has(key)) out.set(key, Object.assign({ reasons: [], score: 0 }, base)); const o = out.get(key); if (!o.reasons.some(r => r.t === reason.t)) o.reasons.push(reason); o.score += score; };
  for (const p of people.values()) {
    if (p.type === 'visitor') continue;
    const st = personStats(p, weeks);
    if (st.absentRun >= 2) add(p.id, { kind: 'person', id: p.id, cellId: p.cellId, name: p.name, st }, { t: st.absentRun + '주 결석', lv: st.absentRun >= 3 ? 'bad' : 'warn' }, st.absentRun >= 3 ? 3 : 2);
  }
  for (const n of notes || []) {
    const p = people.get(n.member_id); const base = { kind: 'person', id: n.member_id, cellId: n._cell, name: (p && p.name) || n._who || '', st: p ? personStats(p, weeks) : null };
    if (n.leadership_attention_required) add(n.member_id, base, { t: '확인 필요', lv: 'warn' }, 3);
    for (const k of catsOf(n)) if (HEAVY[k]) add(n.member_id, base, { t: CARE_LABEL[k], lv: k === 'long_absence' ? 'bad' : 'warn' }, HEAVY[k]);
    const o = out.get(n.member_id); if (o && !o.note) o.note = n.content;
  }
  for (const a of asks || []) add('cell:' + a.cellId, { kind: 'cell', cellId: a.cellId, name: '', note: a.note }, { t: '셀리더 요청 · ' + (MSG_LABEL[a.kind] || a.kind).replace(/이 필요합니다|가 필요합니다/, ''), lv: 'ac' }, 2);
  return [...out.values()].sort((a, b) => b.score - a.score || String(a.name).localeCompare(String(b.name), 'ko'));
}
// C 출석이 줄어드는 분: 이전 8주(최소 4번 기록)엔 잘 왔는데 최근 4주(최소 3번 기록)에 눈에 띄게 줄었다
function dropping(people, weeks) {
  const out = [];
  for (const p of people.values()) {
    if (p.type === 'visitor') continue;
    const st = personStats(p, weeks);
    if (st.prevN >= 4 && st.recentN >= 3 && st.prevRate >= 0.6 && st.recentRate <= st.prevRate - 0.35) out.push({ p, st, drop: st.prevRate - st.recentRate });
  }
  return out.sort((a, b) => b.drop - a.drop);
}
// D 새 얼굴: 12주 안에 방문자로 온 분 → 셀원이 됐나 · 다시 왔나 · 끊겼나
function newFaces(people, weeks) {
  const out = [];
  // 그 셀이 보고서를 낸 주 (같은 셀 누구라도 기록이 있는 주) — 방문자는 안 온 주엔 명단에 없으니 셀 기준으로 '얼마나 지났나' 를 잰다
  const cellWeeks = new Map();
  for (const p of people.values()) { if (!cellWeeks.has(p.cellId)) cellWeeks.set(p.cellId, new Set()); for (const w of p.wk.keys()) cellWeeks.get(p.cellId).add(w); }
  for (const p of people.values()) {
    const vw = weeks.filter(w => p.visitorWeeks.has(w));
    if (!vw.length) continue;
    const st = personStats(p, weeks);
    const first = vw[vw.length - 1];
    const became = p.type === 'member';
    const cw = cellWeeks.get(p.cellId) || new Set();
    const sinceLast = st.lastPresent ? weeks.filter(w => cw.has(w) && w > st.lastPresent).length : 99;
    const state = became ? 'joined' : sinceLast >= 2 ? 'gone' : st.present >= 2 ? 'again' : 'once';
    out.push({ p, st, first, state });
  }
  const order = { gone: 0, once: 1, again: 2, joined: 3 };
  return out.sort((a, b) => order[a.state] - order[b.state] || b.first.localeCompare(a.first));
}
// E 셀 건강 신호등 (최근 8주). rows: 그 셀의 주별 줄(이번 주부터) · reps: 그 셀 보고서 내용들 { rep, notes }
function cellHealth(rows, reps) {
  const lv = (v, w, b) => v >= b ? 'bad' : v >= w ? 'warn' : 'ok';
  const sub = rows.filter(r => r && isSubmitted(r));
  const pres = rows.filter(attTaken).map(r => r.members_present);
  const a = pres.slice(0, 4), b = pres.slice(4, 8);
  const avg = (x) => x.length ? x.reduce((s, v) => s + v, 0) / x.length : null;
  const drop = a.length && b.length && avg(b) > 0 ? (avg(b) - avg(a)) / avg(b) : 0;
  const past = rows.slice(1).filter(Boolean);
  const missing = past.filter(r => !isSubmitted(r)).length;
  let missRun = 0; for (const r of past) { if (isSubmitted(r)) break; missRun++; }
  const heavy = reps.reduce((s, d) => s + d.notes.filter(n => n.leadership_attention_required || catsOf(n).some(k => HEAVY[k] >= 2)).length, 0);
  const asks = reps.filter(d => d.rep && d.rep.leader_message && d.rep.leader_message !== 'none').length;
  return {
    att: { lv: lv(drop, 0.2, 0.4), text: a.length ? '최근 4주 평균 ' + Math.round(avg(a) * 10) / 10 + '명' + (b.length ? ' (이전 ' + Math.round(avg(b) * 10) / 10 + ')' : '') : '기록 없음' },
    sub: { lv: missRun >= 2 || missing >= 3 ? 'bad' : missing >= 1 ? 'warn' : 'ok', text: rows.filter(Boolean).length + '주 중 ' + sub.length + '번 제출' },
    issue: { lv: sub.length ? lv(heavy / sub.length, 0.5, 1.5) : 'ok', text: '무거운 이슈 ' + heavy + '건' },
    req: { lv: lv(asks, 1, 3), text: '셀리더 요청 ' + asks + '번' },

function leaderSignals(rows, reps) {
  const sig = [];
  const past = rows.slice(1).filter(Boolean);
  let missRun = 0; for (const r of past) { if (isSubmitted(r)) break; missRun++; }
  if (missRun >= 2) sig.push({ lv: 'bad', t: missRun + '주 연속 미제출' });
  const late = reps.filter(d => d.rep && d.rep.submitted_at && d.rep.meeting_date && (new Date(d.rep.submitted_at) - new Date(d.rep.meeting_date + 'T23:59:59+09:00')) / 864e5 > 2);
  if (late.length >= 2) sig.push({ lv: 'warn', t: '모임 뒤 사흘 넘겨 제출 ' + late.length + '번' });
  const cancel = reps.filter(d => d.rep && d.rep.meeting_held === false);
  if (cancel.length) sig.push({ lv: cancel.length >= 2 ? 'warn' : 'ok', t: '모임 못 함 ' + cancel.length + '번', note: [...new Set(cancel.map(d => d.rep.meeting_cancel_reason).filter(Boolean))].join(' · ') });
  const adv = reps.filter(d => d.rep && ['advice', 'share_up'].includes(d.rep.leader_message));
  if (adv.length) sig.push({ lv: 'ac', t: '조언 요청 ' + adv.length + '번', note: adv.map(d => d.rep.leader_message_note).filter(Boolean)[0] || '' });
  return sig;
}

// 한 번에 너무 많이 부르지 않게 — 동시에 n 개까지
async function pool(items, n, fn) {
  const out = new Array(items.length); let i = 0;
  const work = async () => { while (i < items.length) { const k = i++; try { out[k] = await fn(items[k], k); } catch (e) { out[k] = { __err: e }; } } };
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, work));
  return out;
}

function cellName(cellId) { for (const w of S.weeks) { const r = cellRow(cellId, w); if (r) return r.cell_name; } return ''; }
function leaderOf(cellId) { for (const w of S.weeks) { const r = cellRow(cellId, w); if (r && r.leader_names) return r.leader_names; } return ''; }
function cellWeekMap(cellId) { const m = new Map(); for (const w of S.weeks) { const r = cellRow(cellId, w); if (r) m.set(w, r); } return trimBeforeStart(m, S.weeks); }
function sortedCells() { return scopeIds().slice().sort((a, b) => cellName(a).localeCompare(cellName(b), 'ko')); }

async function loadBase() {
  const api = S.api;
  const ctx = await api.ctx();
  if (!ctx) { S.ctx = null; return renderNoAccount(); }
  S.ctx = ctx;
  S.weeks = weeksBack(ctx.this_week, WEEKS_LOADED).filter((w, i) => DEMO || i === 0 || w >= CC_START);
  const [asg, ...lists] = await Promise.all([api.assignments(ctx.profile.id).catch(() => []), ...S.weeks.map(w => api.weekStatus(w).catch(() => []))]);
  S.asg = asg || [];
  S.byWeek = new Map(S.weeks.map((w, i) => [w, lists[i] || []]));
  S.mineIds = pickMine(S.byWeek.get(S.weeks[0]), S.asg, ctx.profile.id, ctx.today);
  S.det.clear(); S.rosters.clear(); S.people = null; S.loadedSpan = 0; S.weekIdx = 0;

// 보고서 내용 — 고른 기간(주 수)만큼. 이미 받은 보고서는 다시 받지 않는다.
async function loadDetails(span) {
  const ids = [];
  for (const w of S.weeks.slice(0, span)) for (const c of scopeIds()) { const r = cellRow(c, w); if (r && isSubmitted(r) && !S.det.has(r.report_id)) ids.push(r.report_id); }
  await fetchDetails(ids, false);
  S.loadedSpan = Math.max(S.loadedSpan, span);
}
// 보고서 몇 개의 내용을 받아 S.det 에 둔다. allOpen: 이어지는 기도를 보고서마다 받을지(셀 화면) / 셀마다 가장 최근 것만(모아보기)
async function fetchDetails(ids, allOpen) {
  while (S.loadingDet) await S.loadingDet;
  ids = ids.filter(id => id && !S.det.has(id));
  if (!ids.length) return;
  const api = S.api;
  S.loadingDet = (async () => {
    const [reps, notes, pr] = await Promise.all([
      api.reports(ids).catch(() => []), api.notes(ids).catch(() => []), api.newPrayers(ids).catch(() => []), ensureMembers(scopeIds())
    ]);
    const cm = await pool(ids, 6, id => api.comments(id));
    // 이어지는 기도: 모아보기는 셀마다 가장 최근 보고서 하나만 (그 시점의 '계속 기도' 목록이다)
    const latest = new Map();
    for (const id of ids) { const rep = (reps || []).find(r => r.id === id); if (!rep) continue; const o = latest.get(rep.cell_id); if (!o || rep.week_start > o.week_start) latest.set(rep.cell_id, rep); }
    const openIds = allOpen ? ids : [...latest.values()].map(r => r.id);
    const op = await pool(openIds, 6, id => api.openPrayers(id));
    ids.forEach((id, i) => {
      const rep = (reps || []).find(r => r.id === id) || null;
      const c = cm[i] && !cm[i].__err ? (cm[i] || []) : [];
      const oi = openIds.indexOf(id);
      S.det.set(id, { rep, notes: (notes || []).filter(n => n.report_id === id), newPrayers: (pr || []).filter(p => p.report_id === id),
        comments: c.filter(x => !x.target || x.target === 'report'), open: oi >= 0 && op[oi] && !op[oi].__err ? (op[oi] || []) : [] });
    });
  })();
  try { await S.loadingDet; } finally { S.loadingDet = null; }
}
async function ensureMembers(cells) {
  const need = cells.filter(c => !S.memCells.has(c));
  if (!need.length) return;
  need.forEach(c => S.memCells.add(c));
  const mem = await S.api.members(need).catch(() => { need.forEach(c => S.memCells.delete(c)); return []; });
  for (const m of mem || []) S.members.set(m.id, m);
}
// 셀원 출석 12주 (L8) — attendance 표 한 번 묻기, 안 되면 보고서마다 명단
async function loadPeople() {
  if (S.people) return S.people;
  if (S.loadingPeople) return S.loadingPeople;
  S.loadingPeople = (async () => {
    const cells = scopeIds();
    await ensureMembers(cells);
    let rows = null;
    try {
      const raw = await S.api.attendance(S.weeks, cells);
      rows = (raw || []).filter(x => x.weekly_reports && ['submitted', 'revision_requested'].includes(x.weekly_reports.status))
        .map(x => ({ member_id: x.member_id, status: x.status, week: x.weekly_reports.week_start, cellId: x.weekly_reports.cell_id }));
      S.attVia = 'table';
    } catch (e) { rows = null; }
    if (!rows || !rows.length) {
      const ids = [], wk = new Map();
      for (const w of S.weeks) for (const c of cells) { const r = cellRow(c, w); if (r && isSubmitted(r)) { ids.push(r.report_id); wk.set(r.report_id, [w, c]); } }
      await ensureRoster(ids);
      rows = ids.flatMap(id => (S.rosters.get(id) || []).map(x => ({ member_id: x.member_id, status: x.attendance, week: wk.get(id)[0], cellId: wk.get(id)[1], name: x.name, visitor: x.type_in_week === 'visitor' })));
      S.attVia = 'roster';
    }
    S.people = buildPeople(rows, [...S.members.values()]);
    return S.people;
  })();
  try { return await S.loadingPeople; } finally { S.loadingPeople = null; }
}
// 출석 명단(이름) — 보고서마다 따로 부르는 것이라 필요한 것만, 한 번만
async function ensureRoster(ids) {
  const need = ids.filter(id => id && !S.rosters.has(id));
  const res = await pool(need, 6, id => S.api.roster(id));
  need.forEach((id, i) => { S.rosters.set(id, res[i] && !res[i].__err ? (res[i] || []) : []); });
}

// 접고 펴기 — 같은 이름(data-flip)의 칸은 옛 자리에서 새 자리로 미끄러지고, 새로 생긴 칸은 스르륵 나타난다 (FLIP)
function flipRender(change) {
  const root = $('#panel'); if (!root || quiet()) return change();
  const old = new Map([...root.querySelectorAll('[data-flip]')].map(el => [el.dataset.flip, el.getBoundingClientRect()]));
  const hOld = root.offsetHeight;
  change();
  const els = [...root.querySelectorAll('[data-flip]')];
  for (const el of els) {
    const o = old.get(el.dataset.flip), n = el.getBoundingClientRect();
    if (o) { const dx = o.left - n.left, dy = o.top - n.top; if (!dx && !dy && o.width === n.width) continue;
      el.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: 'none' }], { duration: 320, easing: 'cubic-bezier(.22,.8,.24,1)' }); }
    else el.animate([{ opacity: 0, transform: 'scale(.92)' }, { opacity: 1, transform: 'none' }], { duration: 260, delay: 60, easing: 'cubic-bezier(.22,.8,.24,1)', fill: 'backwards' });
  }
  const hNew = root.offsetHeight;
  if (hOld !== hNew) root.animate([{ height: hOld + 'px', overflow: 'hidden' }, { height: hNew + 'px', overflow: 'hidden' }], { duration: 320, easing: 'cubic-bezier(.22,.8,.24,1)' });
}
// 판 바꾸기 — 나가고(150ms) → 그리고 → 들어온다(300ms). 앞(오른쪽)은 왼쪽으로 나간다.
let busyAnim = false;
function transit(dir, change, fromX, el) {
  const p = el || $('#panel');
  if (!p || quiet() || busyAnim) { change(); return; }
  busyAnim = true;
  const w = p.offsetWidth || 360;
  p.style.transition = 'transform .15s ease-in, opacity .15s ease-in';
  p.style.transform = `translateX(${-dir * w * 0.35}px)`; p.style.opacity = '0';
  setTimeout(() => {
    change();
    p.style.transition = 'none'; p.style.transform = `translateX(${dir * w * 0.35}px)`; p.style.opacity = '0';
    void p.offsetWidth;
    p.style.transition = 'transform .3s cubic-bezier(.22,.8,.24,1), opacity .3s cubic-bezier(.22,.8,.24,1)';
    p.style.transform = 'translateX(0)'; p.style.opacity = '1';
    setTimeout(() => { p.style.transition = ''; p.style.transform = ''; busyAnim = false; }, 320);
  }, fromX != null ? 90 : 150);
}
function goTab(id) {
  if (id === PREF.tab) return;
  const a = TABS.findIndex(t => t.id === PREF.tab), b = TABS.findIndex(t => t.id === id);
  transit(b > a ? 1 : -1, () => { PREF.tab = id; savePref(); markTab(); rerender(); window.scrollTo(0, 0); });
}

// 손가락을 따라가는 좌우 넘김 (탭)
function bindSwipe() {
  const st = $('#stage'); if (!st) return;
  let x0 = 0, y0 = 0, dx = 0, on = false, lock = null, t0 = 0;
  st.addEventListener('touchstart', e => {
    if (busyAnim || e.touches.length > 1) return;
    // ⚠️ 옆으로 밀리는 상자(이슈 표 등) 안에서 시작한 손짓은 탭 넘김에 쓰지 않는다 — 표를 밀면 탭까지 넘어가던 것 (HB 11/6)
    const box = e.target.closest && e.target.closest('.mxwrap'); if (box && box.scrollWidth > box.clientWidth + 2) { on = false; return; }
    const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; dx = 0; on = true; lock = null; t0 = Date.now(); }, { passive: true });
  st.addEventListener('touchmove', e => {
    if (!on) return; const t = e.touches[0]; const ddx = t.clientX - x0, ddy = t.clientY - y0;
    if (lock == null) { if (Math.abs(ddx) < 8 && Math.abs(ddy) < 8) return; lock = Math.abs(ddx) > Math.abs(ddy) * 1.2 ? 'x' : 'y'; }
    if (lock !== 'x') return;
    const i = TABS.findIndex(t => t.id === PREF.tab);
    const edge = (ddx > 0 && i === 0) || (ddx < 0 && i === TABS.length - 1);
    dx = edge ? ddx * 0.25 : ddx;
    const p = $('#panel'); const w = p.offsetWidth || 360;
    p.style.transition = 'none'; p.style.transform = `translateX(${dx}px)`; p.style.opacity = String(1 - Math.min(0.6, Math.abs(dx) / w));
  }, { passive: true });
  st.addEventListener('touchend', () => {
    if (!on) return; on = false; if (lock !== 'x') return;
    const p = $('#panel'); const w = p.offsetWidth || 360; const i = TABS.findIndex(t => t.id === PREF.tab);
    const fast = Date.now() - t0 < 250 && Math.abs(dx) > 40;
    const next = dx < 0 ? i + 1 : i - 1;
    if ((Math.abs(dx) > w / 4 || fast) && next >= 0 && next < TABS.length) {
      const dir = dx < 0 ? 1 : -1;
      p.style.transition = 'transform .09s ease-in, opacity .09s ease-in'; p.style.transform = `translateX(${-dir * w * 0.5}px)`; p.style.opacity = '0';
      transit(dir, () => { PREF.tab = TABS[next].id; savePref(); markTab(); rerender(); window.scrollTo(0, 0); }, dx);
    } else {
      p.style.transition = 'transform .3s cubic-bezier(.22,.8,.24,1), opacity .3s'; p.style.transform = 'translateX(0)'; p.style.opacity = '1';
      setTimeout(() => { p.style.transition = ''; p.style.transform = ''; }, 320);
    }
  });
}

function viewWeek() {

  const shown = f === 'sub' ? rows.filter(x => isSubmitted(x.r)) : f === 'miss' ? rows.filter(x => !isSubmitted(x.r)) : rows;
  // 세 칸이 곧 거르기 — 다시 누르면 전체로. 위 사람 단추가 칸 안의 셀리더 이름을 켜고 끈다 (HB 11/6: 줄이 아니라 칸 안에)
  const names = (list) => PREF.showLeader ? `<div class="nms">${list.map(x => esc(x.r.leader_names || cellName(x.c))).join('<br>') || '—'}</div>` : '';
  let h = head + g + `<div class="stats${PREF.showLeader ? ' withnames' : ''}">

  if (!shown.length) return h + `<p class="empty">${f === 'sub' ? '아직 낸 셀이 없습니다.' : '모두 냈습니다.'}</p>`;
  h += '<div class="card" style="padding:4px 14px">' + shown.map(({ c, r }) => {
    const s = streakOf(cellWeekMap(c), S.weeks.slice(S.weekIdx));
    const txt = streakText(s);

function bindEdgeBack(el, close) {

/* ---------- ② 기도제목 ---------- */
function viewPrayer() {
  let h = `<div class="row" style="margin:12px 0">${spanSeg()}</div>`;
  const wait = waiting(); if (wait) return h + wait;
  const items = [];
  for (const x of reportsIn(PREF.span)) {
    const nm = (id) => memName(x.cellId, id, S.rosters.get(x.row.report_id)) || '';
    const cn = cellName(x.cellId);
    for (const p of x.det.newPrayers) items.push({ mid: p.member_id, cellId: x.cellId, cellName: cn, who: nm(p.member_id), text: p.content, week: x.week, kind: '새 기도제목' });
    for (const n of x.det.notes) if (n.prayer) items.push({ mid: n.member_id, cellId: x.cellId, cellName: cn, who: nm(n.member_id), text: n.prayer, week: x.week, kind: catsOf(n).map(catLabel).join(' · ') });
    for (const p of x.det.open) items.push({ cellId: x.cellId, cellName: cn, who: p.member_name, text: p.content, week: x.week, kind: PRAYER_LABEL[p.this_week_status] || '계속 기도', note: p.this_week_note });
  }
  const people = collectPrayers(items);
  const cells = [...new Set(people.map(p => p.cellId))];
  if (PREF.prayCell !== 'all' && !cells.includes(PREF.prayCell)) PREF.prayCell = 'all';
  h += `<div class="chips"><button class="chip ${PREF.prayCell === 'all' ? 'on' : ''}" data-pcell="all">전체<span class="n">${people.length}</span></button>${cells.map(c => `<button class="chip ${PREF.prayCell === c ? 'on' : ''}" data-pcell="${esc(c)}">${esc(cellName(c))}<span class="n">${people.filter(p => p.cellId === c).length}</span></button>`).join('')}</div>`;
  const show = people.filter(p => PREF.prayCell === 'all' || p.cellId === PREF.prayCell);
  if (!show.length) return h + '<p class="empty">이 기간에 적힌 기도제목이 없습니다.</p>';
  let last = '';
  for (const p of show) {
    if (p.cellName !== last) { if (last) h += '</div>'; last = p.cellName; h += `<h3 style="font-size:13px;font-weight:500;color:var(--tx3);margin:16px 2px 6px">${esc(p.cellName)}</h3><div class="card" style="padding:4px 15px">`; }
    h += `<div class="note">${who(p.items.find(i => i.mid) && p.items.find(i => i.mid).mid, p.who, p.cellId)}<div class="clamp">${p.items.map(it => `<div class="txt clamp">• ${esc(it.text)} <span class="tiny muted">${esc(shortWeek(it.week))}${it.kind ? ' · ' + esc(it.kind) : ''}</span></div>${it.note ? `<div class="pray">이번 주: ${esc(it.note)}</div>` : ''}`).join('')}</div></div>`;
  }
  return h + (last ? '</div>' : '');
}

/* ---------- ③ 이슈 ---------- */
// 칩 두 줄 대신 표 하나: 줄 = 셀, 열 = 이슈. 칸 = 그 셀의 그 이슈 · 줄 머리 = 그 셀 전부 · 열 머리 = 그 이슈 전부 · 왼쪽 위 = 전체.
function viewIssue() {
  let h = `<div class="row" style="margin:12px 0">${spanSeg()}</div>`;
  const wait = waiting(); if (wait) return h + wait;
  const notes = [];
  for (const x of reportsIn(PREF.span)) for (const n of x.det.notes) notes.push({ ...n, _week: x.week, _cell: x.cellId, _cellName: cellName(x.cellId), _who: memName(x.cellId, n.member_id, S.rosters.get(x.row.report_id)) || '(이름 없음)' });
  if (!notes.length) return h + '<p class="empty">이 기간에 적힌 셀원 근황이 없습니다.</p>';
  const mx = issueMatrix(notes);
  const st = issState(mx);

  const cOn = (c) => st.cells.includes(c), tOn = (t) => st.tags.includes(t);

  // 셀 축을 접어도 이슈 머리줄(숫자 그대로)은 남는다. 이슈 축을 접으면 셀 머리들이 옆으로 흘러 다시 늘어선다 (빈 공간 없이).

  const corner = `<div class="corner-in"><span class="ctot">전체 ${mx.total}</span>
      <button class="tri tri-h ${st.foldTag ? 'fold' : ''}" data-act="fold-tag" title="${st.foldTag ? '이슈 펼치기' : '이슈 접기'}" aria-label="${st.foldTag ? '이슈 펼치기' : '이슈 접기'}"><svg viewBox="0 0 10 10"><path d="M7 1.5 2.5 5 7 8.5z"/></svg></button>
      <button class="tri tri-v ${st.foldCell ? 'fold' : ''}" data-act="fold-cell" title="${st.foldCell ? '셀 펼치기' : '셀 접기'}" aria-label="${st.foldCell ? '셀 펼치기' : '셀 접기'}"><svg viewBox="0 0 10 10"><path d="M1.5 7 5 2.5 8.5 7z"/></svg></button></div>`;
  const thTag = (t) => `<th class="${t === 'attn' ? 'attn' : ''}${tOn(t) ? ' on' : ''}" data-mx="all|${t}" data-flip="t:${t}">${esc(tagName(t))}<span>${mx.colTotal[t]}</span></th>`;
  const thCell = (c) => `<th class="${cOn(c) ? 'on' : ''}" data-mx="${esc(c)}|all" data-flip="c:${esc(c)}">${esc(sn(c))}<span>${mx.rowTotal[c]}</span></th>`;
  if (!st.foldTag) {

let _ckq = 0;
new MutationObserver(() => { if (_ckq) return; _ckq = requestAnimationFrame(() => { _ckq = 0; applyClamp(document); }); }).observe(document.documentElement, { childList: true, subtree: true });
addEventListener('resize', () => { for (const el of document.querySelectorAll('.clamp[data-ck]:not(.open)')) { el.removeAttribute('data-ck'); el.classList.remove('cut'); const b = el.nextElementSibling; if (b && b.dataset.act === 'more') b.remove(); } applyClamp(document); });

/* ---------- G 이번 주 한 장 (이번 주 탭 맨 위) ---------- */
function gCard() {
  if (S.weekIdx !== 0) return '';
  const w = S.weeks[0]; const rows = sortedCells().map(c => cellRow(c, w)).filter(Boolean);
  const subRows = rows.filter(isSubmitted);
  const pres = subRows.reduce((s, r) => s + (r.members_present || 0), 0), abs = subRows.reduce((s, r) => s + (r.members_absent || 0), 0);
  const A = careItems();
  const thanks = [];
  for (const c of scopeIds()) for (const d of cellReps(c, 2)) for (const x of d.open) if (x.this_week_status === 'answered') thanks.push({ c, x });
  const head = `<button class="gh" data-act="g-tg"><b>이번 주 한 장</b><span class="tiny muted">${subRows.length}/${rows.length} 제출 · 출석 ${pres + abs ? Math.round(pres * 100 / (pres + abs)) + '%' : '—'}${S.newIds.size ? ' · 새 코멘트 ' + S.newIds.size : ''}</span><span class="spacer"></span><span class="chev2 ${PREF.gOpen ? 'on' : ''}">›</span></button>`;
  if (!PREF.gOpen) return `<div class="card gcard">${head}</div>`;
  let body = '<div class="gbody">';
  body += `<div class="lbl">먼저 연락할 분</div>` + (A == null ? '<div class="tiny muted">출석 기록을 모으는 중…</div>' : A.length ? A.slice(0, S.gMore ? A.length : 3).map(x => `<div class="row grow" data-flip="g:${esc(x.id || x.cellId)}" ${x.kind === 'cell' ? `data-act="open-cell" data-cell="${esc(x.cellId)}"` : `data-act="person" data-mid="${esc(x.id)}"`} role="button"><span class="nm">${esc(x.kind === 'cell' ? cellName(x.cellId) : x.name)}</span><span class="tiny muted">${esc(x.kind === 'cell' ? '셀 전체' : cellName(x.cellId))}</span><span class="spacer"></span>${x.reasons.slice(0, 2).map(r => `<span class="pill ${LV[r.lv]}">${esc(r.t)}</span>`).join('')}</div>`).join('') + (A.length > 3 ? `<button class="morebtn" data-act="g-more">${S.gMore ? '접기' : (A.length - 3) + '명 더 보기'}<i class="${S.gMore ? 'up' : ''}"></i></button>` : '') : '<div class="tiny muted">이번 주 특별히 살필 분이 없습니다.</div>');
  if (thanks.length) body += `<div class="lbl">감사 — 응답된 기도</div>` + thanks.slice(0, 3).map(({ c, x }) => `<div class="small">${who(null, x.member_name, c)} ${esc(x.content)}${x.this_week_note ? ' <span class="muted">— ' + esc(x.this_week_note) + '</span>' : ''}</div>`).join('');
  return `<div class="card gcard">${head}${body}</div></div>`;
}

// 출석 막대 — 마우스를 올리거나(PC) 길게 누르면(터치) 출석 · 결석 이름. 이름은 그때 그 보고서 하나만 받는다.
function bindBarTips() {
  const panel = $('#stage'); if (!panel) return;
  let timer = null, sx = 0, sy = 0;
  panel.addEventListener('mouseover', e => { const b = e.target.closest('.bar[data-act="bar"]'); if (b && !matchMedia('(hover: none)').matches) showTip(b); });
  panel.addEventListener('mouseout', e => { const b = e.target.closest('.bar[data-act="bar"]'); if (b && !b.contains(e.relatedTarget)) hideTip(); });
  panel.addEventListener('touchstart', e => { const b = e.target.closest('.bar[data-act="bar"]'); if (!b) return; const t = e.touches[0]; sx = t.clientX; sy = t.clientY;
    clearTimeout(timer); timer = setTimeout(() => { S.tipAt = Date.now(); showTip(b); }, 450); }, { passive: true });
  panel.addEventListener('touchmove', e => { const t = e.touches[0]; if (Math.abs(t.clientX - sx) > 10 || Math.abs(t.clientY - sy) > 10) clearTimeout(timer); }, { passive: true });
  panel.addEventListener('touchend', () => clearTimeout(timer));
  panel.addEventListener('contextmenu', e => { if (e.target.closest('.bar[data-act="bar"]')) e.preventDefault(); });
  addEventListener('scroll', () => { if (!S.tipAt || Date.now() - S.tipAt > 600) hideTip(); }, { passive: true });
}
async function showTip(bar) {
  const tip = $('#tip'); const c = bar.dataset.cell, w = bar.dataset.week; const r = cellRow(c, w); if (!r || !r.report_id) return;
  S.tipFor = c + '|' + w;
  const place = () => { const rc = bar.getBoundingClientRect(); const tw = tip.offsetWidth, th = tip.offsetHeight;
    let x = rc.left + rc.width / 2 - tw / 2; x = Math.max(8, Math.min(innerWidth - tw - 8, x));
    let y = rc.top - th - 8; if (y < 8) y = rc.bottom + 8; tip.style.left = x + 'px'; tip.style.top = y + 'px'; };
  tip.innerHTML = `<b>${esc(cellName(c))} · ${esc(weekLabel(w))}</b><div class="muted">불러오는 중…</div>`; tip.hidden = false; place();
  await ensureRoster([r.report_id]).catch(() => {});
  if (S.tipFor !== c + '|' + w || tip.hidden) return;
  const ro = S.rosters.get(r.report_id) || [];
  const listed = ro.filter(x => x.attendance && x.type_in_week !== 'visitor');
  const pres = listed.filter(x => x.attendance === 'present'), abs = listed.filter(x => x.attendance === 'absent');
  const vis = ro.filter(x => x.type_in_week === 'visitor' && x.attendance === 'present');
  tip.innerHTML = `<b>${esc(cellName(c))} · ${esc(weekLabel(w))}</b>
    <div class="t-ok"><span class="k">출석 ${pres.length}</span> ${pres.map(x => esc(x.name)).join(', ') || '—'}</div>
    ${abs.length ? `<div class="t-bad"><span class="k">결석 ${abs.length}</span> ${abs.map(x => esc(x.name) + (x.absence_reason ? ' <span class="muted">(' + esc(x.absence_reason) + ')</span>' : '')).join(', ')}</div>` : ''}
    ${vis.length ? `<div class="t-ac"><span class="k">방문 ${vis.length}</span> ${vis.map(x => esc(x.name)).join(', ')}</div>` : ''}`;
  place();
}
function hideTip() { const t = $('#tip'); if (t) t.hidden = true; S.tipFor = null; }

/* =====================================================================
   로그인
   ===================================================================== */
const LOGIN = { email: lsGet('cell_email', ''), sent: false, busy: false, msg: '' };
function viewLogin() {
  $('#root').innerHTML = `<div class="login"><h1>셀 한눈에</h1>
    <p class="sub" style="margin:0 0 6px">셀 케어에서 쓰시는 이메일로 로그인합니다. 셀 케어 보고서를 <b>읽기만</b> 해서 다시 정리해 보여 드립니다.</p>
    ${!LOGIN.sent ? `<input type="email" id="lg-email" placeholder="이메일" value="${esc(LOGIN.email)}" autocomplete="email" inputmode="email">
      <button class="btn pri wide" data-act="send" ${LOGIN.busy ? 'disabled' : ''}>${LOGIN.busy ? '보내는 중…' : '로그인 코드 받기'}</button>`
    : `<p class="small" style="margin:12px 0 0"><b>${esc(LOGIN.email)}</b> 로 보낸 숫자 코드를 넣어 주세요.</p>
      <input type="text" id="lg-code" placeholder="숫자 코드" inputmode="numeric" autocomplete="one-time-code" maxlength="10">
      <button class="btn pri wide" data-act="verify" ${LOGIN.busy ? 'disabled' : ''}>${LOGIN.busy ? '확인 중…' : '로그인'}</button>
      <button class="btn wide" data-act="back">이메일 다시 쓰기</button>`}
    ${LOGIN.msg ? `<p class="err">${esc(LOGIN.msg)}</p>` : ''}
    <p class="tiny muted" style="margin-top:22px">셀 케어 앱과 같은 계정이라, 셀 케어에서 보시던 셀만 보입니다. 이 앱은 셀 케어에 아무것도 쓰지 않으며, 성도 정보를 따로 저장하지 않습니다.</p>
    <p style="text-align:center;margin-top:18px"><a href="?demo=1" style="color:var(--ac);font-size:13.5px">지어낸 자료로 미리보기 →</a></p>
    <p class="ver">${esc(APP_VERSION)}</p></div>`;
  const i = $('#lg-email') || $('#lg-code'); if (i) setTimeout(() => i.focus(), 50);
}
async function sendCode() {
  const email = ($('#lg-email')?.value || '').trim().toLowerCase();
  LOGIN.email = email; LOGIN.msg = '';
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { LOGIN.msg = '이메일 주소를 다시 확인해 주세요.'; return viewLogin(); }
  lsSet('cell_email', email);
  LOGIN.busy = true; viewLogin();
  try { realApi(); } catch (e) { LOGIN.busy = false; LOGIN.msg = e.message; return viewLogin(); }
  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false } });
  LOGIN.busy = false;
  if (error) {
    const m = error.message || '';
    LOGIN.msg = /rate|security purposes|seconds/i.test(m) ? '메일을 너무 자주 요청했습니다.\n잠시 후 다시 시도해 주세요.'
      : /signup|not allowed|not found|Signups|NOT_APPROVED|Database error/i.test(m) ? '셀 케어에 등록된 이메일이 아닙니다.\n셀 케어에서 쓰시는 이메일인지 확인해 주세요.'
      : '메일을 보내지 못했습니다. (' + m + ')';
    return viewLogin();
  }
  LOGIN.sent = true; viewLogin();
}
async function verifyCode() {
  const token = ($('#lg-code')?.value || '').replace(/\D/g, '');
  if (token.length < 6) { LOGIN.msg = '메일로 받은 숫자 코드를 그대로 넣어 주세요.'; return viewLogin(); }
  LOGIN.busy = true; LOGIN.msg = ''; viewLogin();
  const { error } = await sb.auth.verifyOtp({ email: LOGIN.email, token, type: 'email' });
  LOGIN.busy = false;
  if (error) { LOGIN.msg = '코드가 맞지 않거나 시간이 지났습니다.\n메일을 다시 받아 주세요.'; return viewLogin(); }
  LOGIN.sent = false; startReal();
}
function renderNoAccount() {
  $('#root').innerHTML = `<div class="login"><h1>셀 케어 명단에 없는 계정입니다</h1><p class="sub">로그인은 되었지만 셀 케어 명단에 이 이메일이 없거나 사용이 중지된 상태입니다.</p><button class="btn" data-act="logout">로그아웃</button></div>`;
}
function renderError(e) {
  $('#root').innerHTML = `<div class="login"><h1>불러오지 못했습니다</h1><p class="err">${esc(errText(e))}</p>
    <p class="tiny muted">셀 케어 앱의 구조가 바뀌었을 수도 있습니다. 계속되면 알려 주세요.</p>
    <button class="btn pri" data-act="reload">다시 시도</button> <button class="btn" data-act="logout">로그아웃</button></div>`;
}

/* =====================================================================
   누르기
   ===================================================================== */
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act],[data-tab],[data-span],[data-wmode],[data-issue],[data-pcell],[data-wk],[data-wf],[data-mx]');
  const menu = $('#menu');
  if (menu && !e.target.closest('#menu') && !(b && b.dataset.act === 'menu')) menu.remove();
  if (!(b && b.dataset.act === 'bar') && !(S.tipAt && Date.now() - S.tipAt < 900)) hideTip();
  if (!b) return;
  const d = b.dataset;
  if (d.wk) { if (S.view && S.view.cell === d.cell) return cvGo(S.weeks.indexOf(d.wk)); return openCell(d.cell, d.wk); }
  if (d.wf) { PREF.wfilter = PREF.wfilter === d.wf && d.wf !== 'all' ? 'all' : d.wf; savePref(); return rerender(); }
  if (d.mx) { PREF.iss = issPick(PREF.iss, d.mx); savePref(); return rerender(); }
  if (d.tab) return goTab(d.tab);
  if (d.span) return setSpan(+d.span);
  if (d.wmode) { PREF.weekMode = d.wmode; savePref(); return rerender(); }
  if (d.issue) { PREF.issue = d.issue; savePref(); return rerender(); }
  if (d.pcell) { PREF.prayCell = d.pcell; savePref(); return rerender(); }
  switch (d.act) {
    case 'send': return sendCode();
    case 'verify': return verifyCode();
    case 'back': LOGIN.sent = false; LOGIN.msg = ''; return viewLogin();
    case 'wk-prev': if (S.weekIdx < S.weeks.length - 1) transit(-1, () => { S.weekIdx++; rerender(); }); return;
    case 'wk-next': if (S.weekIdx > 0) transit(1, () => { S.weekIdx--; rerender(); }); return;
    case 'open-cell': return openCell(d.cell, d.week || S.weeks[S.weekIdx]);
    case 'see-rep': if (S.pview) { closePerson(true); if (!S.view) return openCell(d.cell, d.week, true); } if (S.view && S.view.cell === d.cell) return cvGo(S.weeks.indexOf(d.week)); if (S.view) { S.view.cell = d.cell; S.view.idx = Math.max(0, S.weeks.indexOf(d.week)); return drawCell(); } return openCell(d.cell, d.week);
    case 'bar': if (S.tipAt && Date.now() - S.tipAt < 900) return; hideTip(); return openCell(d.cell, d.week);
    case 'fold-cell': return flipRender(() => { PREF.iss = Object.assign(issNorm(PREF.iss), { foldCell: !issNorm(PREF.iss).foldCell }); savePref(); rerender(); });
    case 'fold-tag': return flipRender(() => { PREF.iss = Object.assign(issNorm(PREF.iss), { foldTag: !issNorm(PREF.iss).foldTag }); savePref(); rerender(); });
    case 'cv-close': return closeCell(false);
    case 'person': hideTip(); return openPerson(d.mid);
    case 'pv-close': return closePerson(false);
    case 'g-tg': return flipRender(() => { PREF.gOpen = !PREF.gOpen; savePref(); rerender(); });
    case 'g-more': return flipRender(() => { S.gMore = !S.gMore; rerender(); });
    case 'more': return toggleClamp(b);
    case 'cv-prev': return S.view && cvGo(S.view.idx + 1);
    case 'cv-next': return S.view && cvGo(S.view.idx - 1);
    case 'leader-tg': PREF.showLeader = !PREF.showLeader; savePref(); rerender();
      toast(PREF.showLeader ? '셀리더 이름을\n보여 드립니다' : '셀리더 이름을\n감췄습니다'); toast.at = Date.now(); return;
    case 'print': return window.print();
    case 'menu': {
      if (menu) return menu.remove();
      const who = S.ctx ? S.ctx.profile.name : '';
      const m = document.createElement('div'); m.className = 'menu'; m.id = 'menu';
      m.innerHTML = `<div class="info">${esc(who)}${S.mineIds.length ? ' · 담당 셀 ' + S.mineIds.length + '곳' : ''}</div>
        ${S.mineIds.length ? `<button data-act="scope">${PREF.scope === 'mine' ? '볼 수 있는 셀 전체 보기' : '내 담당 셀만 보기'}</button>` : ''}
        <button data-act="reload">새로 불러오기</button>
        <button data-act="logout">${DEMO ? '미리보기 끝내기' : '로그아웃'}</button>`;
      b.parentElement.appendChild(m); return;
    }
    case 'scope': PREF.scope = PREF.scope === 'mine' ? 'all' : 'mine'; savePref(); menu && menu.remove();
      toast(PREF.scope === 'mine' ? '내 담당 셀만\n보여 드립니다' : '볼 수 있는 셀을\n모두 보여 드립니다'); toast.at = Date.now();
      S.people = null; rerender(); loadDetails(Math.max(PREF.span, S.weekIdx + 1, 4)).then(() => { refreshBadge(); rerender(); }).then(() => loadPeople()).then(() => rerender()).catch(() => {}); return;
    case 'reload': menu && menu.remove(); return start();
    case 'logout': menu && menu.remove();
      if (DEMO) { location.href = location.pathname; return; }
      try { await sb.auth.signOut(); } catch (_) { }
      S.ctx = null; return viewLogin();
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'lg-email') sendCode();
  if (e.key === 'Enter' && e.target.id === 'lg-code') verifyCode();
  if (e.key === 'Escape') { const m = $('#menu'); if (m) return m.remove(); if (S.pview) return closePerson(false); if (S.view) closeCell(false); }
  if (S.view && !S.pview && e.key === 'ArrowLeft') cvGo(S.view.idx + 1);
  if (S.view && !S.pview && e.key === 'ArrowRight') cvGo(S.view.idx - 1);
});
addEventListener('resize', () => markTab());

/* =====================================================================
   시작
   ===================================================================== */
async function startReal() {
  $('#root').innerHTML = '<div class="loading">셀 케어에서 불러오는 중…</div>';
  try { S.api = realApi(); await loadBase(); } catch (e) { renderError(e); }
}
async function start() {
  if (DEMO) { S.api = demoApi(); try { await loadBase(); } catch (e) { renderError(e); } return; }
  let api; try { api = realApi(); } catch (e) { return renderError(e); }
  const { data } = await sb.auth.getSession();
  if (data && data.session) return startReal();
  viewLogin();
}
start();
</script>
