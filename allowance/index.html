<!DOCTYPE html>
<!-- 용돈 친구들 v. 26-1007-1 — BLOCK7 과 별개인 독립 앱 (allowance/) -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffe3ee">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<title>용돈 친구들</title>
<style>
:root{
  --ink:#4a3b6b; --sub:#9a8cb5; --white:#fff;
  --pink:#ff6fa5; --pink-d:#d9467f; --green:#3cc98a; --green-d:#209a63; --orange:#ffa63d; --orange-d:#d97d10;
  --blue:#5aa9ff; --blue-d:#2f7fd9; --yellow:#ffd84d; --yellow-d:#e0a900; --purple:#9b7bff; --purple-d:#6d4fd6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{font-family:'Jua','Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#ffe3ee 0%,#e6f1ff 55%,#e9fbf1 100%);overflow:hidden;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
.view{display:none;flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 110px}
.view.on{display:block;animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 큰 둥근 버튼 (게임 느낌) */
.gb{--c:var(--pink);--d:var(--pink-d);display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--c);color:#fff;border-radius:22px;padding:16px 14px;font-size:22px;letter-spacing:.02em;
  box-shadow:0 6px 0 var(--d);text-shadow:0 2px 0 rgba(0,0,0,.12);transition:transform .08s,box-shadow .08s}
.gb:active{transform:translateY(5px);box-shadow:0 1px 0 var(--d)}
.gb.green{--c:var(--green);--d:var(--green-d)} .gb.orange{--c:var(--orange);--d:var(--orange-d)}
.gb.blue{--c:var(--blue);--d:var(--blue-d)} .gb.purple{--c:var(--purple);--d:var(--purple-d)}
.gb.gray{--c:#c9c0dc;--d:#a79dc2}
.gb[disabled]{opacity:.45;pointer-events:none}
.gb.sm{font-size:17px;padding:11px 12px;border-radius:18px;box-shadow:0 4px 0 var(--d)}
.card{background:#fff;border-radius:26px;box-shadow:0 6px 0 rgba(120,90,170,.14)}

/* 홈 */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.logo{font-size:20px;color:var(--pink-d)}
.iconbtn{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 0 rgba(120,90,170,.18);color:var(--purple)}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(120,90,170,.18)}
.hero{position:relative;padding:14px 16px 18px;text-align:center;margin-bottom:16px}
.bubble{position:relative;display:inline-block;background:#fff8d6;border:3px solid var(--yellow);border-radius:20px;padding:8px 14px;font-size:16px;line-height:1.4;margin-bottom:10px;max-width:92%}
.bubble:after{content:"";position:absolute;left:50%;bottom:-13px;margin-left:-10px;border:10px solid transparent;border-top-color:var(--yellow);border-bottom:0}
.pigwrap{width:190px;margin:6px auto 0;position:relative}
.pigwrap svg{width:100%;display:block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1.5deg)}}
.coindrop{position:absolute;left:50%;top:-8px;width:34px;margin-left:-6px;animation:drop 2.4s ease-in infinite}
@keyframes drop{0%{transform:translateY(-6px) scale(.9);opacity:0}15%{opacity:1}60%{transform:translateY(30px) scale(1)}70%,100%{transform:translateY(40px) scale(.2);opacity:0}}
.money{font-size:50px;color:var(--pink-d);line-height:1;margin-top:8px;text-shadow:0 3px 0 #ffd3e4}
.money small{font-size:22px;margin-left:2px}
.moneylbl{font-size:15px;color:var(--sub);margin-top:4px}
.two{display:flex;gap:12px;margin-bottom:14px}
.cta{display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:16px;width:100%;text-align:left;
  background:linear-gradient(135deg,#9b7bff,#6aa9ff);color:#fff;border-radius:26px;box-shadow:0 6px 0 var(--purple-d);animation:wob 2.6s ease-in-out infinite}
.cta:active{transform:translateY(5px);box-shadow:0 1px 0 var(--purple-d)}
@keyframes wob{0%,100%{transform:rotate(0)}4%{transform:rotate(-1.4deg)}8%{transform:rotate(1.4deg)}12%{transform:rotate(0)}}
.cta .t{font-size:21px;text-shadow:0 2px 0 rgba(0,0,0,.15)} .cta .s{font-size:14px;opacity:.95}
.cta .f{width:62px;flex:none}
.sec{font-size:16px;color:var(--sub);margin:4px 6px 8px}

/* 아바타·기록 */
.av{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;border:3px solid #fff;box-shadow:0 3px 0 rgba(120,90,170,.15)}
.av svg{width:84%;height:84%}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px 10px 10px;margin-bottom:10px}
.row .mid{flex:1;min-width:0}.row .t{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--sub)}.row .a{font-size:20px;white-space:nowrap}
.in{color:var(--green-d)}.out{color:var(--pink-d)}
.mon{display:flex;align-items:center;justify-content:center;gap:16px;margin:4px 0 8px;font-size:22px}
.mon button{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--purple);box-shadow:0 4px 0 rgba(120,90,170,.18)}
.msum{text-align:center;font-size:15px;color:var(--sub);margin-bottom:12px}
.day{font-size:14px;color:var(--sub);margin:12px 6px 6px}
.empty{text-align:center;color:var(--sub);padding:30px 10px;font-size:17px;line-height:1.6}
.empty svg{width:96px;display:block;margin:0 auto 8px}

/* 나누기 */
.allochead{padding:14px 16px;margin-bottom:12px}
.free{display:flex;align-items:center;gap:10px}
.free .f{width:54px;flex:none}
.free .l{font-size:15px;color:var(--sub)} .free .v{font-size:34px;color:var(--pink-d);line-height:1.1}
.free .v.zero{color:var(--green-d)}
.stack{display:flex;height:16px;border-radius:9px;overflow:hidden;background:#efe9fb;margin-top:12px}
.stack i{display:block;height:100%;transition:width .3s}
.steps{display:flex;gap:8px;align-items:center;margin:0 0 12px;font-size:15px;color:var(--sub)}
.steps button{flex:1;background:#fff;border-radius:16px;padding:8px 0;font-size:17px;color:var(--purple);box-shadow:0 4px 0 rgba(120,90,170,.16)}
.steps button.on{background:var(--purple);color:#fff;box-shadow:0 4px 0 var(--purple-d)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ac{position:relative;padding:12px 10px 12px;text-align:center;background:var(--bg,#fff);border-radius:26px;box-shadow:0 6px 0 rgba(120,90,170,.16)}
.ac .face{width:68px;margin:0 auto}.ac .face svg{width:100%;display:block}
.ac.bounce .face{animation:jump .4s}
@keyframes jump{30%{transform:translateY(-12px) scale(1.08)}60%{transform:translateY(0) scale(.96)}}
.ac .nm{font-size:18px;margin-top:2px}
.ac .amt{font-size:26px;color:var(--ink);background:rgba(255,255,255,.75);border-radius:14px;margin:6px 4px 2px;padding:3px 0;width:calc(100% - 8px)}
.ac .amt.pop{animation:pop .3s}
@keyframes pop{40%{transform:scale(1.15)}}
.ac .amt.neg{color:var(--pink-d)}
.ac .sub{font-size:12px;color:#7d6fa0;min-height:16px}
.pm{display:flex;gap:8px;margin-top:6px;justify-content:center}
.pm button{width:56px;height:46px;border-radius:16px;font-size:30px;line-height:1;color:#fff;display:grid;place-items:center;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.pm .m{background:#b9aed6;box-shadow:0 4px 0 #9487b8}.pm .p{background:var(--green);box-shadow:0 4px 0 var(--green-d)}
.pm button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.ac.add{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;border:3px dashed #cdbdf0;box-shadow:none;color:var(--purple);min-height:200px;font-size:18px}
.ac.add .plus{font-size:50px;line-height:1}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.smallnote{text-align:center;color:var(--sub);font-size:14px;margin:14px 0 4px}
.linkbtn{display:block;margin:6px auto 0;color:var(--sub);font-size:14px;text-decoration:underline;padding:8px}

/* 시트 */
.dim{position:fixed;inset:0;background:rgba(74,59,107,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:linear-gradient(#fffaf3,#fff);border-radius:30px 30px 0 0;
  padding:8px 18px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,1.2,.4,1);z-index:11;max-height:94vh;overflow-y:auto}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:#e2d8f3;margin:4px auto 10px}
.sheet h2{font-size:24px;text-align:center;margin:0 0 6px;font-weight:400}
.who{display:flex;align-items:center;justify-content:center;gap:10px}
.who .av{width:44px;height:44px}
.disp{text-align:center;font-size:48px;color:var(--pink-d);line-height:1.2;margin:4px 0 8px;min-height:58px}
.disp small{font-size:22px}
.chips{display:flex;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.chips button{background:#fff3c4;border-radius:18px;padding:7px 12px;font-size:16px;box-shadow:0 3px 0 #ecd270}
.chips button:active{transform:translateY(2px);box-shadow:0 1px 0 #ecd270}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.pad button{background:#fff;border-radius:18px;height:54px;font-size:28px;color:var(--ink);box-shadow:0 4px 0 #d9ceee}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #d9ceee}
.pad .del{background:#ffe3ee;color:var(--pink-d);box-shadow:0 4px 0 #f3b9d0}
.datebtn{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;margin:0 auto 12px;color:var(--sub);font-size:16px;width:max-content;padding:4px 10px}
.datebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 6px}
.pk{background:var(--bg,#fff);border-radius:22px;padding:10px 4px 8px;text-align:center;box-shadow:0 5px 0 rgba(120,90,170,.16);font-size:16px;position:relative}
.pk:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(120,90,170,.16)}
.pk .face{width:58px;margin:0 auto}.pk .face svg{width:100%;display:block}
.pk.on{outline:4px solid var(--purple)}
.inp{width:100%;border:3px solid #e2d8f3;border-radius:18px;padding:12px 14px;font:inherit;font-size:20px;color:var(--ink);background:#fff;outline:none;user-select:text;-webkit-user-select:text}
.inp:focus{border-color:var(--purple)}
.note{font-size:15px;color:var(--sub);line-height:1.6;text-align:center;margin:4px 6px 12px}
.stack-btns .gb{margin-bottom:12px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 16px);transform:translate(-50%,-30px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:22px;
  font-size:17px;opacity:0;transition:all .25s;pointer-events:none;z-index:30;max-width:90%;text-align:center}
.toast.on{opacity:.96;transform:translate(-50%,0)}

/* 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;display:flex;align-items:flex-end;background:#fff;border-radius:26px 26px 0 0;
  box-shadow:0 -4px 18px rgba(120,90,170,.14);padding:6px 10px calc(env(safe-area-inset-bottom) + 6px);z-index:5}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:14px;color:var(--sub);padding:4px 0}
.tabs button .ti{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;transition:all .15s}
.tabs button .ti svg{width:30px;height:30px}
.tabs button.on{color:var(--pink-d)}
.tabs button.on .ti{background:#ffe3ee;transform:translateY(-6px) scale(1.18)}
.tabs button.mid .ti{background:var(--purple);width:50px;height:50px;transform:translateY(-14px);box-shadow:0 5px 0 var(--purple-d)}
.tabs button.mid .ti svg{width:36px;height:36px}
.tabs button.mid{margin-top:-10px}
.tabs button.mid.on{color:var(--purple-d)}
.tabs button.mid.on .ti{transform:translateY(-16px) scale(1.1)}

/* 꽃가루 */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.confetti i{position:absolute;top:-24px;width:14px;height:14px;border-radius:3px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.9}}
</style>
</head>
<body>
<div id="app">
  <!-- 홈 -->
  <section class="view on" id="vHome">
    <div class="top"><span class="logo">용돈 친구들</span>
      <button class="iconbtn" id="gear" aria-label="백업"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 01-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 01-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 01-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 010-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 012.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 014 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 012.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 010 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button></div>
    <div class="hero card">
      <div class="bubble" id="bubble"></div>
      <div class="pigwrap" id="pig"></div>
      <div class="money" id="bal"></div>
      <div class="moneylbl">지금 내가 가진 돈</div>
    </div>
    <div class="two">
      <button class="gb green" id="bIn">받았어요!</button>
      <button class="gb orange" id="bOut">돈 썼어요!</button>
    </div>
    <button class="cta" id="bAlloc"><span class="f" id="ctaFace"></span><span><div class="t">돈 나누기 놀이</div><div class="s" id="ctaSub"></div></span></button>
    <div class="sec">최근에 적은 것</div>
    <div id="recent"></div>
  </section>

  <!-- 나누기 -->
  <section class="view" id="vAlloc">
    <div class="allochead card">
      <div class="free"><span class="f" id="allocPig"></span><span><div class="l">아직 안 나눈 돈</div><div class="v" id="freeV"></div></span></div>
      <div class="stack" id="stack"></div>
    </div>
    <div class="steps"><span>한 번에</span><button data-s="500">500</button><button data-s="1000" class="on">1,000</button><button data-s="5000">5,000</button><button data-s="10000">10,000</button></div>
    <div class="grid" id="agrid"></div>
    <button class="linkbtn" id="allocReset">나눈 것 모두 지우고 다시 하기</button>
  </section>

  <!-- 기록 -->
  <section class="view" id="vLog">
    <div class="mon"><button id="mPrev" aria-label="이전 달"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><span id="mLabel"></span><button id="mNext" aria-label="다음 달"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></div>
    <div class="msum" id="mSum"></div>
    <div id="list"></div>
  </section>

  <nav class="tabs">
    <button data-v="vHome" class="on"><span class="ti" id="tiHome"></span>홈</button>
    <button data-v="vAlloc" class="mid"><span class="ti" id="tiAlloc"></span>나누기</button>
    <button data-v="vLog"><span class="ti" id="tiLog"></span>기록</button>
  </nav>
</div>
<div class="dim" id="dim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const APP_VERSION = "v. 26-1007-1";
const KEY = 'allowance.v1';      // v1 저장 모양을 그대로 쓰고, 모자란 칸은 불러올 때 채운다
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = n => Number(n).toLocaleString('ko-KR');
const won = n => nf(n) + '원';
const buzz = ms => { try{ navigator.vibrate && navigator.vibrate(ms||12); }catch(e){} };

/* ───────── 캐릭터 (전부 코드로 그린 그림) ───────── */
const eyes = (y,dx) => `<circle cx="${50-dx}" cy="${y}" r="5.2" fill="#3b2a2a"/><circle cx="${50+dx}" cy="${y}" r="5.2" fill="#3b2a2a"/><circle cx="${50-dx+1.9}" cy="${y-1.9}" r="1.8" fill="#fff"/><circle cx="${50+dx+1.9}" cy="${y-1.9}" r="1.8" fill="#fff"/>`;
const blush = (y,dx) => `<ellipse cx="${50-dx}" cy="${y}" rx="6.5" ry="4.2" fill="#ff7f9d" opacity=".55"/><ellipse cx="${50+dx}" cy="${y}" rx="6.5" ry="4.2" fill="#ff7f9d" opacity=".55"/>`;
const smile = y => `<path d="M43.5 ${y}q6.5 7 13 0" stroke="#3b2a2a" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
const CH = {
  bear:{n:'곰돌이', bg:'#ffe6cf', s:`<circle cx="24" cy="27" r="14" fill="#b87a4b"/><circle cx="24" cy="27" r="7" fill="#e9b98c"/><circle cx="76" cy="27" r="14" fill="#b87a4b"/><circle cx="76" cy="27" r="7" fill="#e9b98c"/><circle cx="50" cy="56" r="38" fill="#c98f5c"/><ellipse cx="50" cy="68" rx="17" ry="13" fill="#f3d6b3"/>${eyes(52,19)}<ellipse cx="50" cy="61" rx="5.5" ry="4" fill="#4a3024"/><path d="M50 65v4M44 71q6 5 12 0" stroke="#4a3024" stroke-width="2.4" fill="none" stroke-linecap="round"/>${blush(66,31)}`},
  bunny:{n:'토끼', bg:'#ffe4f1', s:`<ellipse cx="34" cy="26" rx="10" ry="24" fill="#fff" stroke="#eadfd4" stroke-width="2"/><ellipse cx="34" cy="28" rx="5" ry="16" fill="#ffc2d6"/><ellipse cx="66" cy="26" rx="10" ry="24" fill="#fff" stroke="#eadfd4" stroke-width="2"/><ellipse cx="66" cy="28" rx="5" ry="16" fill="#ffc2d6"/><ellipse cx="50" cy="64" rx="36" ry="31" fill="#fff" stroke="#eadfd4" stroke-width="2"/>${eyes(62,17)}<ellipse cx="50" cy="69" rx="3.6" ry="2.7" fill="#ff8fa8"/>${smile(73)}${blush(70,27)}`},
  pig:{n:'꿀꿀이', bg:'#ffdce8', s:`<path d="M15 32L33 14L41 38Z" fill="#ff86a8"/><path d="M85 32L67 14L59 38Z" fill="#ff86a8"/><circle cx="50" cy="56" r="38" fill="#ffb3c8"/><ellipse cx="50" cy="66" rx="18" ry="13" fill="#ff8fb0"/><ellipse cx="43.500" cy="66" rx="2.800" ry="4.200" fill="#b0486a"/><ellipse cx="56.500" cy="66" rx="2.800" ry="4.200" fill="#b0486a"/>${eyes(48,22)}${blush(58,33)}`},

/* ───────── 이름표 ───────── */
const CATS = [
  {k:'snack', n:'간식', ch:'bear'}, {k:'stat', n:'문구', ch:'bunny'}, {k:'save', n:'저금', ch:'pig'}, {k:'gift', n:'선물', ch:'cat'},
  {k:'play', n:'놀이', ch:'dog'}, {k:'style', n:'꾸미기', ch:'penguin'}, {k:'give', n:'헌금', ch:'chick'}, {k:'etc', n:'기타', ch:'hamster'}
];
const GIVERS = [
  {n:'엄마', ch:'cat'}, {n:'아빠', ch:'bear'}, {n:'할머니', ch:'bunny'}, {n:'할아버지', ch:'dog'}, {n:'친척', ch:'penguin'}, {n:'명절 용돈', ch:'chick'}, {n:'기타', ch:'hamster'}
];
const CUSTOM_CH = ['star','bear','bunny','pig','cat','dog','penguin','chick','hamster'];
function allCats(){ return CATS.concat(S.custom.map(c => ({k:c.k, n:c.n, ch:c.ch, custom:true}))); }
function catOf(k){ return allCats().find(c => c.k===k) || {k, n:'기타', ch:'hamster'}; }

/* ───────── 저장 ───────── */
let S = load();
function blank(){ return {v:1, tx:[], plans:[], alloc:{}, custom:[], lastBackup:0}; }
function migrate(o){
  // v1(계획 목록) → 나누기 모양. 예전 계획은 '내 맘대로' 칸으로 옮긴다
  o = Object.assign(blank(), o||{});
  o.alloc = (o.alloc && typeof o.alloc==='object') ? o.alloc : {};
  o.custom = Array.isArray(o.custom) ? o.custom : [];
  if(Array.isArray(o.plans) && o.plans.length){
    o.plans.forEach(p => { const k = 'c_' + p.id;
      if(!o.custom.find(c=>c.k===k)) o.custom.push({k, n:String(p.name).slice(0,8), ch:'star'});
      if(!p.done) o.alloc[k] = p.amt;
      o.tx.forEach(t => { if(t.plan===p.id && !t.cat) t.cat = k; });
    });
    o.plans = [];
  }
  return o;
}
function load(){
  try{ const r = localStorage.getItem(KEY); if(r){ const o = JSON.parse(r); if(o && Array.isArray(o.tx)) return migrate(o); } }catch(e){}
  return blank();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('저장하지 못했어요'); } }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,5);
const pad2 = n => String(n).padStart(2,'0');
const dstr = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayStr = () => dstr(new Date());

/* ───────── 계산 ───────── */
const balance = () => S.tx.reduce((a,t) => a + (t.t==='in' ? t.amt : -t.amt), 0);
const spent = k => S.tx.reduce((a,t) => a + (t.t==='out' && t.cat===k ? t.amt : 0), 0);
const alloc = k => S.alloc[k] || 0;
const left = k => alloc(k) - spent(k);
const reserved = () => allCats().reduce((a,c) => a + Math.max(0, left(c.k)), 0);
const freeMoney = () => balance() - reserved();

/* ───────── 화면 ───────── */
let month = todayStr().slice(0,7), step = 1000;
function monthShift(m, d){ let [y,mm] = m.split('-').map(Number); mm += d; while(mm<1){mm+=12;y--} while(mm>12){mm-=12;y++} return y+'-'+pad2(mm); }
const wd = ['일','월','화','수','목','금','토'];

function txRow(t){
  const isIn = t.t==='in', c = isIn ? null : catOf(t.cat);
  const ch = isIn ? ((GIVERS.find(g=>g.n===t.memo)||{}).ch || 'hamster') : c.ch;
  return `<button class="row card" data-tx="${t.id}">${avatar(ch)}<span class="mid"><div class="t">${esc(isIn ? (t.memo||'용돈') : c.n)}</div><div class="s">${isIn?'받았어요':'썼어요'} · ${Number(t.date.slice(5,7))}월 ${Number(t.date.slice(8,10))}일</div></span><span class="a ${isIn?'in':'out'}">${isIn?'+':'−'}${nf(t.amt)}</span></button>`;
}
function sortedTx(list){ return list.slice().sort((a,b) => a.date<b.date?1:a.date>b.date?-1:(b.at||0)-(a.at||0)); }

function renderHome(){
  const bal = balance(), fr = freeMoney();
  $('bal').innerHTML = (bal<0?'<span style="color:#d9462f">':'<span>')+nf(bal)+'</span><small>원</small>';
  let msg;
  if(!S.tx.length) msg = '안녕! 나는 꿀꿀이야. 용돈을 받으면 초록 버튼을 눌러 줘!';
  else if(bal<=0) msg = '지갑이 텅 비었어… 다음 용돈이 기다려져!';
  else if(fr>0) msg = '아직 안 나눈 돈이 '+won(fr)+' 있어! 나눠 볼까?';
  else msg = '돈 나누기 완벽해! 정말 똑똑하다!';
  $('bubble').textContent = msg;
  $('ctaSub').textContent = bal<=0 ? '용돈을 받으면 놀 수 있어요' : (fr>0 ? '얼마는 뭐 하는 데 쓸까? ('+won(fr)+' 남음)' : '다 나눴어요! 고쳐 볼까?');
  const rec = sortedTx(S.tx).slice(0,3);
  $('recent').innerHTML = rec.length ? rec.map(txRow).join('') : '<div class="empty">아직 아무것도 없어요.<br>위의 버튼을 눌러 보세요!</div>';
}

function renderAlloc(){
  const bal = balance(), fr = freeMoney(), cats = allCats();
  $('freeV').className = 'v' + (bal>0&&fr<=0 ? ' zero':'');
  $('freeV').textContent = bal<=0 ? '0원' : (fr<=0 ? '다 나눴어요!' : won(fr));
  $('stack').innerHTML = bal>0 ? cats.filter(c => left(c.k)>0).map(c => `<i style="width:${Math.min(100,left(c.k)/bal*100)}%;background:${COLORS[c.ch]}"></i>`).join('') : '';
  if(bal<=0){
    $('agrid').innerHTML = `<div class="empty" style="grid-column:1/3">${face('pig')}나눌 돈이 아직 없어요.<br>먼저 용돈을 받았다고 알려 주세요!<br><br><button class="gb green sm" id="goIn" style="width:auto;display:inline-flex;padding:11px 22px">용돈 받았어요!</button></div>`;
    return;
  }
  $('agrid').innerHTML = cats.map(c => {
    const l = left(c.k), sp = spent(c.k);
    return `<div class="ac" data-k="${c.k}" style="--bg:${CH[c.ch].bg}"><button class="face" data-act="face" style="display:block;width:68px;margin:0 auto">${face(c.ch)}</button>
      <div class="nm">${esc(c.n)}</div>
      <button class="amt ${l<0?'neg':''}" data-act="amt">${l<0 ? nf(-l)+' 넘게 썼어' : nf(l)+'원'}</button>
      <div class="sub">${sp>0 ? '쓴 돈 '+nf(sp)+'원' : (alloc(c.k)>0 ? '' : '눌러서 나눠요')}</div>
      <div class="pm"><button class="m" data-act="m" aria-label="줄이기">−</button><button class="p" data-act="p" aria-label="늘리기">+</button></div></div>`;
  }).join('') + `<button class="ac add" id="addCat"><span class="plus">+</span>내 맘대로<br>만들기</button>`;
}

function renderLog(){
  const [y,m] = month.split('-');
  $('mLabel').textContent = y+'년 '+Number(m)+'월';
  $('mNext').style.visibility = month >= todayStr().slice(0,7) ? 'hidden' : 'visible';
  const rows = sortedTx(S.tx.filter(t => t.date.slice(0,7)===month));
  const inS = rows.filter(t=>t.t==='in').reduce((a,t)=>a+t.amt,0), outS = rows.filter(t=>t.t==='out').reduce((a,t)=>a+t.amt,0);
  $('mSum').innerHTML = rows.length ? `받은 돈 <b class="in">${won(inS)}</b> · 쓴 돈 <b class="out">${won(outS)}</b>` : '';
  if(!rows.length){ $('list').innerHTML = `<div class="empty">${face('hamster')}${S.tx.length?'이 달에는 기록이 없어요.':'아직 기록이 없어요.'}</div>`; return; }
  let h = '', last = '';
  rows.forEach(t => { if(t.date!==last){ last = t.date; const d = new Date(t.date+'T00:00:00'); h += `<div class="day">${d.getMonth()+1}월 ${d.getDate()}일 (${wd[d.getDay()]})</div>`; } h += txRow(t); });
  $('list').innerHTML = h;
}
function render(){ renderHome(); renderAlloc(); renderLog(); }

/* ───────── 시트 · 알림 · 꽃가루 ───────── */
function openSheet(html){ $('sheet').innerHTML = '<div class="grab"></div>'+html; $('sheet').classList.add('on'); $('dim').classList.add('on'); $('sheet').scrollTop = 0; }
function closeSheet(){ $('sheet').classList.remove('on'); $('dim').classList.remove('on'); if(document.activeElement) document.activeElement.blur(); }
$('dim').onclick = closeSheet;
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('on'), 2200); }
function confetti(){
  const box = document.createElement('div'); box.className = 'confetti';
  const cols = ['#ff6fa5','#ffd84d','#3cc98a','#5aa9ff','#9b7bff','#ffa63d'];
  for(let i=0;i<34;i++){ const e = document.createElement('i');
    e.style.left = (Math.random()*100)+'%'; e.style.background = cols[i%cols.length];
    e.style.setProperty('--dx', (Math.random()*160-80)+'px'); e.style.setProperty('--r', (Math.random()*720-360)+'deg');
    e.style.animationDelay = (Math.random()*.35)+'s'; e.style.borderRadius = i%3===0?'50%':'3px'; box.appendChild(e); }
  document.body.appendChild(box); setTimeout(()=>box.remove(), 2400);
}
function goTab(v){
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x.dataset.v===v));
  document.querySelectorAll('.view').forEach(x => x.classList.toggle('on', x.id===v));
  $(v).scrollTop = 0;
}

/* ───────── 숫자판 (키보드 없이 금액 입력) ───────── */
function padSheet({title, who, init, nextLabel, allowZero, extra, onDone}){
  let val = String(init||0);
  openSheet(`<h2>${title}</h2>${who?`<div class="who">${avatar(who.ch)}<span style="font-size:19px">${esc(who.n)}</span></div>`:''}
    <div class="disp"><span id="pv"></span><small>원</small></div>
    <div class="chips" id="pc">${[500,1000,5000,10000].map(c=>`<button data-c="${c}">+${nf(c)}</button>`).join('')}</div>
    <div class="pad" id="pp">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join('')}<button data-n="00">00</button><button data-n="0">0</button><button class="del" data-n="del" aria-label="지우기">⌫</button></div>
    ${extra||''}
    <button class="gb ${allowZero?'purple':'green'}" id="pn">${nextLabel||'다음'}</button>`);
  const show = () => { $('pv').textContent = nf(+val); $('pn').disabled = !allowZero && +val<=0; };
  const put = s => { val = (val+s).replace(/^0+(?=\d)/,''); if(val.length>7) val = val.slice(0,7); };
  $('pp').onclick = e => { const b = e.target.closest('button'); if(!b) return; buzz(8); const n = b.dataset.n;
    if(n==='del') val = val.length>1 ? val.slice(0,-1) : '0'; else put(n); show(); };
  $('pc').onclick = e => { const b = e.target.closest('button'); if(!b) return; buzz(8); val = String(Math.min(9999999, +val + +b.dataset.c)); show(); };
  $('pn').onclick = () => { if(!allowZero && +val<=0) return; onDone(+val); };
  show();
}

/* ───────── 받았어요 / 썼어요 ───────── */
function txFlow(kind, ex){
  let date = ex ? ex.date : todayStr();
  const dateRow = `<label class="datebtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span id="dtxt"></span><input type="date" id="fDate" max="${todayStr()}" value="${date}"></label>`;
  const dlabel = () => { const d = new Date(date+'T00:00:00'); $('dtxt').textContent = date===todayStr() ? '오늘' : (d.getMonth()+1)+'월 '+d.getDate()+'일'; };
  padSheet({
    title: kind==='in' ? '얼마 받았어요?' : '얼마 썼어요?', init: ex?ex.amt:0, nextLabel:'다음으로 ▶', extra: dateRow,
    onDone: amt => pickStep(kind, amt, date, ex)
  });
  dlabel();
  $('fDate').onchange = e => { date = e.target.value || todayStr(); dlabel(); };
}
function pickStep(kind, amt, date, ex){
  const items = kind==='in' ? GIVERS.map(g => ({key:g.n, n:g.n, ch:g.ch})) : allCats().map(c => ({key:c.k, n:c.n, ch:c.ch}));
  const cur = ex ? (kind==='in' ? ex.memo : ex.cat) : null;
  openSheet(`<h2>${kind==='in' ? '누구한테 받았어요?' : '어디에 썼어요?'}</h2><div class="note">${won(amt)} — 하나를 눌러 주세요</div>
    <div class="pick" id="pk">${items.map(i => `<button class="pk${i.key===cur?' on':''}" data-k="${esc(i.key)}" style="--bg:${CH[i.ch].bg}"><div class="face">${face(i.ch)}</div>${esc(i.n)}</button>`).join('')}</div>
    <button class="linkbtn" id="pBack">◀ 금액 다시 쓰기</button>`);
  $('pBack').onclick = () => txFlow(kind, Object.assign({}, ex||{}, {amt, date, t:kind}));
  $('pk').onclick = e => { const b = e.target.closest('button'); if(!b) return;
    const k = b.dataset.k, rec = {id: ex&&ex.id ? ex.id : uid(), t:kind, amt, date, at: ex&&ex.at ? ex.at : Date.now(),
      memo: kind==='in' ? k : '', cat: kind==='out' ? k : null, plan:null};
    if(ex&&ex.id) S.tx[S.tx.findIndex(t=>t.id===ex.id)] = rec; else S.tx.push(rec);
    save(); month = date.slice(0,7); closeSheet(); buzz(25); render();
    if(kind==='in'){ confetti(); toast('용돈 받았다! 이제 나눠 볼까요?'); goTab('vAlloc'); }
    else { toast(catOf(k).n+'에 '+won(amt)+' 썼어요'); const l = left(k); if(alloc(k)>0 && l<0) setTimeout(()=>toast(catOf(k).n+' 계획보다 '+won(-l)+' 더 썼어요'), 1600); }
  };
}
function txSheet(id){
  const t = S.tx.find(x=>x.id===id); if(!t) return;
  const isIn = t.t==='in', c = isIn ? null : catOf(t.cat);
  openSheet(`<h2>${isIn ? '받은 돈' : '쓴 돈'}</h2><div class="who">${avatar(isIn ? ((GIVERS.find(g=>g.n===t.memo)||{}).ch||'hamster') : c.ch)}<span style="font-size:20px">${esc(isIn ? (t.memo||'용돈') : c.n)}</span></div>
    <div class="disp ${isIn?'in':'out'}">${isIn?'+':'−'}${nf(t.amt)}<small>원</small></div>
    <div class="note">${Number(t.date.slice(5,7))}월 ${Number(t.date.slice(8,10))}일</div>
    <div class="stack-btns"><button class="gb blue" id="tEdit">고치기</button><button class="gb gray" id="tDel">지우기</button></div>`);
  $('tEdit').onclick = () => txFlow(t.t, t);
  $('tDel').onclick = () => { if(!confirm('이 기록을 지울까요?')) return; S.tx = S.tx.filter(x=>x.id!==id); save(); closeSheet(); render(); toast('지웠어요'); };
}

/* ───────── 돈 나누기 놀이 ───────── */
function setAlloc(k, v){ if(v>0) S.alloc[k] = v; else delete S.alloc[k]; }
function bumpCard(k, cls){ const el = document.querySelector('.ac[data-k="'+k+'"]'); if(!el) return; const t = cls==='amt' ? el.querySelector('.amt') : el; t.classList.remove('pop','bounce'); void t.offsetWidth; t.classList.add(cls==='amt'?'pop':'bounce'); }
function allocStep(k, dir){
  const fr = freeMoney();
  if(dir>0){
    if(fr<=0){ shake(k); toast('나눌 돈이 없어요!'); return; }
    const add = Math.min(step, fr);
    setAlloc(k, alloc(k) + add);
  }else{
    const floor = Math.max(spent(k), 0), now = alloc(k);
    if(now<=floor){ shake(k); toast(spent(k)>0 ? '이미 쓴 만큼은 줄일 수 없어요' : '더 줄일 게 없어요'); return; }
    setAlloc(k, Math.max(floor, now - step));
  }
  buzz(14); save(); renderAlloc(); renderHome(); bumpCard(k,'amt');
  if(dir>0 && freeMoney()<=0 && balance()>0){ confetti(); toast('와! 돈을 전부 나눴어요!'); }
}
function shake(k){ const el = document.querySelector('.ac[data-k="'+k+'"]'); if(!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); buzz([20,40,20]); }
$('agrid').onclick = e => {
  if(e.target.closest('#goIn')){ txFlow('in'); return; }
  if(e.target.closest('#addCat')){ customSheet(); return; }
  const card = e.target.closest('.ac'); const b = e.target.closest('button'); if(!card || !b) return;
  const k = card.dataset.k, act = b.dataset.act;
  if(act==='p') allocStep(k, 1);
  else if(act==='m') allocStep(k, -1);
  else if(act==='face'){ bumpCard(k,'face'); buzz(10); const c = catOf(k); if(c.custom){ customSheet(c); } else { const l = left(k); toast(c.n+' · 남은 돈 '+won(Math.max(l,0))); } }
  else if(act==='amt'){
    const c = catOf(k), base = alloc(k);
    padSheet({title:c.n+'에 얼마 쓸까요?', who:{n:c.n, ch:c.ch}, init:base, nextLabel:'정했어요!', allowZero:true, onDone: v => {
      const room = base + Math.max(freeMoney(),0); let nv = v;
      if(nv>room){ nv = room; toast('나눌 수 있는 돈은 '+won(room)+'까지예요'); }
      setAlloc(k, nv); save(); closeSheet(); render();
      if(freeMoney()<=0 && balance()>0 && nv>base){ confetti(); }
    }});
  }
};
document.querySelector('.steps').onclick = e => { const b = e.target.closest('button'); if(!b) return; step = +b.dataset.s; buzz(8);
  document.querySelectorAll('.steps button').forEach(x => x.classList.toggle('on', x===b)); };
$('allocReset').onclick = () => { if(!Object.keys(S.alloc).length){ toast('나눈 게 아직 없어요'); return; }
  if(!confirm('나눈 것을 모두 지우고 다시 할까요?\n(쓴 기록은 그대로예요)')) return; S.alloc = {}; save(); render(); toast('처음부터 다시 나눠 봐요!'); };

function customSheet(ex){
  let ch = ex ? ex.ch : 'star';
  openSheet(`<h2>${ex?'이름 고치기':'내 맘대로 만들기'}</h2><div class="note">어떤 일에 쓸 건가요?</div>
    <input class="inp" id="cName" maxlength="8" placeholder="예) 떡볶이 / 스티커" value="${ex?esc(ex.n):''}">
    <div class="note" style="margin-top:12px">같이 할 친구를 골라요</div>
    <div class="pick" id="cPick" style="grid-template-columns:repeat(5,1fr);gap:8px">${CUSTOM_CH.map(k=>`<button class="pk${k===ch?' on':''}" data-k="${k}" style="--bg:${CH[k].bg};padding:6px 2px"><div class="face" style="width:100%">${face(k)}</div></button>`).join('')}</div>
    <div style="height:10px"></div><button class="gb purple" id="cSave">${ex?'고쳤어요!':'만들었어요!'}</button>
    ${ex?'<button class="linkbtn" id="cDel">이 칸 지우기</button>':''}`);
  $('cPick').onclick = e => { const b = e.target.closest('button'); if(!b) return; ch = b.dataset.k; buzz(8); $('cPick').querySelectorAll('.pk').forEach(x => x.classList.toggle('on', x===b)); };
  $('cSave').onclick = () => { const n = $('cName').value.trim(); if(!n){ toast('이름을 써 주세요'); $('cName').focus(); return; }
    if(ex){ const c = S.custom.find(x=>x.k===ex.k); c.n = n; c.ch = ch; } else S.custom.push({k:'c_'+uid(), n, ch});
    save(); closeSheet(); render(); toast(ex?'고쳤어요':'새 칸이 생겼어요!'); };
  if(ex) $('cDel').onclick = () => { const k = ex.k;
    if(!confirm('"'+ex.n+'" 칸을 지울까요?\n쓴 기록은 "기타"로 옮겨져요.')) return;
    S.tx.forEach(t => { if(t.cat===k) t.cat = 'etc'; }); delete S.alloc[k]; S.custom = S.custom.filter(c=>c.k!==k); save(); closeSheet(); render(); toast('지웠어요'); };
}

/* ───────── 백업 ───────── */
function backupText(){ return JSON.stringify({app:'allowance', v:2, at:Date.now(), data:{tx:S.tx, alloc:S.alloc, custom:S.custom}}); }
function markBackup(){ S.lastBackup = Date.now(); save(); }
function backupSheet(){
  const last = S.lastBackup ? '마지막 백업: '+new Date(S.lastBackup).toLocaleDateString('ko-KR') : '아직 백업한 적이 없어요';
  openSheet(`<h2>돈 기록 지키기</h2><div class="note">기록은 <b>이 휴대폰 안에만</b> 있어요.<br>가끔 아빠한테 백업을 부탁해요!<br>(${last})</div>
    <div class="stack-btns"><button class="gb blue" id="bkCopy">기록 복사하기</button><button class="gb purple" id="bkFile">파일로 저장하기</button><button class="gb gray" id="bkOpen">백업에서 불러오기</button></div>
    <div class="note" style="margin-top:8px">용돈 친구들 ${APP_VERSION}</div>`);
  $('bkCopy').onclick = () => {
    const txt = backupText(), ok = () => { markBackup(); toast('복사했어요! 카톡 "나에게"에 붙여 두세요'); };
    const fb = () => { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); let r = false; try{ r = document.execCommand('copy'); }catch(e){} ta.remove(); r ? ok() : toast('복사 못 했어요. 파일로 저장해 주세요'); };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, fb); else fb();
  };
  $('bkFile').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([backupText()], {type:'application/json'}));
    a.download = '용돈친구들-백업-'+todayStr()+'.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000); markBackup(); toast('파일로 저장했어요'); };
  $('bkOpen').onclick = restoreSheet;
}
function restoreSheet(){
  openSheet(`<h2>백업에서 불러오기</h2><div class="note">복사해 둔 글을 붙여 넣거나, 저장한 파일을 골라요.<br><b>지금 기록은 모두 바뀌어요!</b></div>
    <textarea class="inp" id="rText" placeholder="여기에 붙여 넣기" style="min-height:90px;font-size:14px"></textarea>
    <input type="file" id="rFile" accept=".json,application/json" style="margin:10px 0;width:100%;font-size:14px">
    <button class="gb purple" id="rGo">불러오기</button>`);
  $('rFile').onchange = e => { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = () => { $('rText').value = r.result; }; r.readAsText(f); };
  $('rGo').onclick = () => {
    let o; try{ o = JSON.parse($('rText').value.trim()); }catch(e){ toast('백업 내용이 이상해요'); return; }
    const d = o && o.app==='allowance' && o.data; if(!d || !Array.isArray(d.tx)){ toast('용돈 친구들 백업이 아니에요'); return; }
    const tx = d.tx.filter(t => t && (t.t==='in'||t.t==='out') && Number.isFinite(+t.amt) && +t.amt>0 && /^\d{4}-\d{2}-\d{2}$/.test(t.date||''))
      .map(t => ({id:String(t.id||uid()), t:t.t, amt:Math.round(+t.amt), memo:String(t.memo||'').slice(0,40), date:t.date, cat:t.cat?String(t.cat):null, plan:t.plan?String(t.plan):null, at:+t.at||0}));
    const n = migrate({tx, plans: Array.isArray(d.plans)?d.plans.filter(p=>p&&p.name&&Number.isFinite(+p.amt)).map(p=>({id:String(p.id||uid()), name:String(p.name), amt:Math.round(+p.amt), done:!!p.done})):[],
      alloc: d.alloc && typeof d.alloc==='object' ? d.alloc : {}, custom: Array.isArray(d.custom) ? d.custom.filter(c=>c&&c.k&&c.n).map(c=>({k:String(c.k), n:String(c.n).slice(0,8), ch:CH[c.ch]?c.ch:'star'})) : []});
    Object.keys(n.alloc).forEach(k => { const v = Math.round(+n.alloc[k]); if(v>0) n.alloc[k] = v; else delete n.alloc[k]; });
    if(!confirm('기록 '+n.tx.length+'개를 불러와요.\n지금 기록은 모두 바뀌어요. 계속할까요?')) return;
    S = Object.assign(n, {lastBackup:S.lastBackup}); save(); closeSheet(); render(); toast('불러왔어요!');
  };
}

/* ───────── 연결 ───────── */
$('pig').innerHTML = PIG_BANK + '<span class="coindrop">'+COIN+'</span>';
$('allocPig').innerHTML = face('pig');
$('ctaFace').innerHTML = face('pig');
$('tiHome').innerHTML = TAB_ICONS.home; $('tiAlloc').innerHTML = TAB_ICONS.alloc; $('tiLog').innerHTML = TAB_ICONS.log;
$('bIn').onclick = () => { buzz(10); txFlow('in'); };
$('bOut').onclick = () => { buzz(10); txFlow('out'); };
$('bAlloc').onclick = () => { buzz(10); goTab('vAlloc'); };
$('gear').onclick = backupSheet;
$('recent').onclick = $('list').onclick = e => { const b = e.target.closest('[data-tx]'); if(b) txSheet(b.dataset.tx); };
$('mPrev').onclick = () => { month = monthShift(month,-1); renderLog(); };
$('mNext').onclick = () => { if(month < todayStr().slice(0,7)){ month = monthShift(month,1); renderLog(); } };
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { buzz(8); goTab(b.dataset.v); });
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
