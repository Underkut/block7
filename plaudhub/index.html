<script id="plaudhub-core">
const APP_VERSION = "v. 26-1123-1";

const PROJECT = 'block7-8f24e';
const SITE = 'https://block7.my/plaudhub/';
const PAIR_PORT = 47211;
const ID_RE = /^[A-Za-z0-9_]{8,64}$/;   // 녹음 번호(지금은 f_ + 16진수 32자). 보안 규칙도 같은 꼴만 받는다
const LEASE_MS = 30 * 60 * 1000;          // 맡은 Mac 이 이만큼 소식이 없으면 다른 Mac 이 이어받는다
const RENEW_MS = 5 * 60 * 1000;           // 일하는 동안 맡은 시각을 새로 찍는 간격(긴 녹음 — HB 결정 ④)
const ALIVE_MS = 6 * 60 * 1000;           // 도우미는 2분마다 소식을 남긴다 — 6분 넘게 없으면 '꺼짐'
const DEFAULT_KW = ['심방'];
const KW_MAX = 20, KW_LEN = 20;
const DAY_CHOICES = [7, 14, 30], DEFAULT_DAYS = 14;
const MAC_MAX = 12;
// 전사 모델 후보(8GB Mac). speed = 녹음 1분을 몇 배 빠르게 하나 — P3 시험 전이라 어림이다
const MODELS = [
  { id: 'medium-q5_0', file: 'ggml-medium-q5_0.bin', mb: 514, label: '중간 · 양자화', note: '기본 — 여기서 시작', speed: 4 },
  { id: 'large-v3-turbo-q5_0', file: 'ggml-large-v3-turbo-q5_0.bin', mb: 547, label: '터보 · 양자화', note: '크기는 비슷, 한국어 · 속도가 더 나을 수 있음', speed: 6 },
  { id: 'large-v3-q5_0', file: 'ggml-large-v3-q5_0.bin', mb: 1080, label: '큰 것 · 양자화', note: '비교용 — 느림', speed: 1.5 },
];
const DEFAULT_MODEL = 'medium-q5_0';
function modelOf(id) { return MODELS.find(m => m.id === id) || MODELS.find(m => m.id === DEFAULT_MODEL); }
function modelUrl(m) { return 'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/' + m.file; }

// 준비 상태 — 도우미가 Mac 마다 ✓ ✗ 를 적는다. how = 고치는 길(INSTALLS 의 열쇠 · term = 터미널 · note = 안내만)
const READY = [
  { k: 'brew', label: 'Homebrew', why: '설치 도구 (처음 한 번, 터미널)', how: 'term' },
  { k: 'node', label: 'Node', why: '도우미와 PLAUD CLI 가 도는 바탕 (설치 한 줄이 깜)', how: 'term' },
  { k: 'ffmpeg', label: 'ffmpeg', why: '녹음을 전사용 소리 파일로 바꿈', how: 'ffmpeg' },
  { k: 'whisper', label: 'whisper.cpp', why: 'Mac 안에서 글로 받아 적음', how: 'whisper' },
  { k: 'model', label: '전사 모델', why: 'whisper.cpp 가 쓰는 말 모델', how: 'model' },
  { k: 'plaud', label: 'PLAUD CLI', why: 'PLAUD 공식 명령 도구', how: 'plaud' },
  { k: 'login', label: 'PLAUD 로그인', why: '내 녹음 목록을 읽는 허락', how: 'login' },
  { k: 'drive', label: '드라이브 폴더', why: "구글 드라이브 앱의 'HB-심방-전사' 폴더 (전사 파일 자리)", how: 'note' },
];
// 도우미가 돌리는 명령은 이 표가 전부다(계정의 cmd 칸은 열쇠 이름만 싣는다). 보안 규칙의 what 목록과 같아야 한다(test_plaudhub ⑪).
// argv 의 '~' 는 도우미가 내 폴더로 바꾼다. sudo 는 쓰지 않는다.
const INSTALLS = {
  ffmpeg: { title: 'ffmpeg', argv: ['brew', 'install', 'ffmpeg'], where: 'Homebrew 폴더 (/opt/homebrew)', size: '수백 MB (딸린 것 포함)', mins: 10 },
  whisper: { title: 'whisper.cpp', argv: ['brew', 'install', 'whisper-cpp'], where: 'Homebrew 폴더 (/opt/homebrew)', size: '약 20MB', mins: 5 },
  plaud: { title: 'PLAUD CLI', argv: ['npm', 'install', '-g', '@plaud-ai/cli', '--prefix', '~/.npm-global'], where: '내 폴더의 .npm-global (sudo 없이)', size: '약 30MB', mins: 3 },
  model: { title: '전사 모델', argv: ['curl', '-fL', '--retry', '2', '-o', '~/Library/Application Support/plaudhub/models/(파일)', '(모델 주소)'], where: '~/Library/Application Support/plaudhub/models', size: '(고른 모델)', mins: 15 },
  login: { title: 'PLAUD 로그인', argv: ['plaud', 'login'], where: '그 Mac 의 기본 브라우저(크롬)에 PLAUD 로그인 창이 열립니다', size: '-', mins: 5 },
  update: { title: '도우미 새로 받기', argv: ['curl', SITE + 'helper.mjs'], where: '~/Library/Application Support/plaudhub', size: '약 40KB', mins: 1 },
  refresh: { title: '녹음 목록 다시 읽기', argv: ['plaud', 'recent'], where: '-', size: '-', mins: 2 },
  check: { title: '준비 상태 다시 보기', argv: [], where: '-', size: '-', mins: 1 },
};
const CMD_WHAT = Object.keys(INSTALLS);

/* ---------- PLAUD CLI 글 읽기 ----------
   공식 CLI(@plaud-ai/cli 0.3.x)는 JSON 을 주지 않는다 — 글 표를 읽는다. 원본(dist/index.js)에서 본 꼴:
   recent : 빈 줄 · 'Recordings in the last N days: K' · 빈 줄 · '  번호  제목  YYYY-MM-DD  길이' × K · 빈 줄   (없으면 'No recordings in the last N days.')
   file   : 'File Details:' · '  키:   값' 줄들 (id · name · created_at · start_at · duration …)
   ⚠️ 모르는 줄이 하나라도 있거나 건수가 안 맞으면 **멈춘다**(ok:false). 짐작해 계속하지 않는다 — CLI 판이 바뀐 것이다.
   ⚠️ 까닭(err)에 줄 내용(제목)을 넣지 않는다. */
function stripAnsi(s) { return String(s == null ? '' : s).replace(/\x1b\[[0-9;?]*[A-Za-z]/g, '').replace(/\r/g, ''); }
function durSec(t) {
  t = String(t == null ? '' : t).trim(); let m;
  if ((m = /^(\d+)h(\d{2})m$/.exec(t))) return +m[1] * 3600 + +m[2] * 60;
  if ((m = /^(\d+)m(\d{2})s$/.exec(t))) return +m[1] * 60 + +m[2];
  if ((m = /^(\d+)s$/.exec(t))) return +m[1];
  if (t === '-') return 0;
  return null;
}
function parseRecent(text) {
  const rows = [], seen = new Set(); let declared = null, none = false, odd = 0;
  for (const raw of stripAnsi(text).split('\n')) {
    const ln = raw.replace(/\s+$/, ''); if (!ln.trim()) continue;
    let m;
    if ((m = /^Recordings in the last (\d+) days: (\d+)$/.exec(ln.trim()))) { declared = +m[2]; continue; }
    if (/^No recordings in the last \d+ days\.$/.test(ln.trim())) { none = true; continue; }
    if ((m = /^ {2}(\S+) {2}(.*) {2}(\S+) {2}(\S+)$/.exec(ln)) && ID_RE.test(m[1]) && durSec(m[4]) != null && !seen.has(m[1])) {
      seen.add(m[1]); rows.push({ id: m[1], name: m[2].trim(), date: m[3], d: durSec(m[4]) }); continue;
    }
    odd++;
  }
  if (odd) return { ok: false, err: '목록 글 모양이 바뀌었습니다 (모르는 줄 ' + odd + '개)' };
  if (none) return rows.length ? { ok: false, err: '목록 글 모양이 바뀌었습니다 (없다면서 줄이 있음)' } : { ok: true, rows };
  if (declared == null) return { ok: false, err: '목록 글 모양이 바뀌었습니다 (첫 줄이 없음)' };
  if (declared !== rows.length) return { ok: false, err: '목록 글 모양이 바뀌었습니다 (건수 ' + declared + ' ≠ 읽은 줄 ' + rows.length + ')' };
  return { ok: true, rows };
}
function parseFileDetail(text) {
  const kv = {}; let odd = 0;
  for (const raw of stripAnsi(text).split('\n')) {
    const ln = raw.replace(/\s+$/, ''); if (!ln.trim() || ln.trim() === 'File Details:') continue;
    const m = /^ {2}([a-z_]+):(?:\s+(.*))?$/.exec(ln);   // 빈 제목이면 'name:' 뒤가 비어 있다(제목 없는 녹음이 많다)
    if (m) kv[m[1]] = m[2] || ''; else odd++;
  }
  if (odd || !kv.id || !ID_RE.test(kv.id) || !('name' in kv) || !kv.created_at || durSec(kv.duration) == null)
    return { ok: false, err: '녹음 정보 글 모양이 바뀌었습니다' };
  const c = apiMs(kv.created_at), s = kv.start_at && kv.start_at !== '-' ? apiMs(kv.start_at) : null;
  if (c == null) return { ok: false, err: '녹음 시각을 읽지 못했습니다' };
  return { ok: true, id: kv.id, name: kv.name.trim(), c, t: s == null ? c : s, d: durSec(kv.duration) };
}
// CLI 와 같은 규칙: 시각이 있는데 시간대가 없으면 세계 표준시(Z)로 읽는다
function apiMs(v) {
  if (v == null) return null; const s = String(v).trim(); if (!s) return null;
  if (/^\d{10}$/.test(s)) return +s * 1000; if (/^\d{13}$/.test(s)) return +s;   // 숫자 꼴(초 · 천분의 1초)로 올 때도
  const n = /\d{2}:\d{2}/.test(s) && !/(?:[Zz]|[+-]\d{2}(?::?\d{2})?)$/.test(s) ? s + 'Z' : s;
  const ms = new Date(n).getTime(); return Number.isNaN(ms) ? null : ms;
}

/* ---------- 한국 시각 (기기 시간대와 상관없이 +9시간) ---------- */
const WD = '일월화수목금토';
function kst(ms) { const d = new Date(ms + 9 * 3600e3); return { y: d.getUTCFullYear(), mo: d.getUTCMonth() + 1, d: d.getUTCDate(), wd: d.getUTCDay(), h: d.getUTCHours(), mi: d.getUTCMinutes() }; }
function kstLabel(ms, nowMs) {
  if (!Number.isFinite(ms)) return '시각 모름';
  const a = kst(ms), n = kst(Number.isFinite(nowMs) ? nowMs : ms);
  const h12 = a.h % 12 === 0 ? 12 : a.h % 12;
  return (a.y !== n.y ? a.y + '. ' : '') + a.mo + '. ' + a.d + '. (' + WD[a.wd] + ') ' + (a.h < 12 ? '오전 ' : '오후 ') + h12 + ':' + String(a.mi).padStart(2, '0');
}
function durLabel(sec) {
  sec = Math.max(0, Math.round(+sec || 0)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
  if (h) return h + '시간' + (m ? ' ' + m + '분' : ''); if (m) return m + '분'; return sec + '초';
}
function agoLabel(ms, nowMs) {
  if (!Number.isFinite(ms)) return '소식 없음'; const s = Math.max(0, (nowMs - ms) / 1000);
  if (s < 90) return '방금'; if (s < 3600) return Math.round(s / 60) + '분 전'; if (s < 86400) return Math.round(s / 3600) + '시간 전';
  return kstLabel(ms, nowMs);
}

/* ---------- 키워드 · 고르기 (HB 결정 ④ — 길이로는 빼지 않는다) ---------- */
function cleanKw(w) { return String(w == null ? '' : w).replace(/\s+/g, ' ').trim().slice(0, KW_LEN); }
function normKw(list) {

function pickState(rec, job, kw) {

    .map(r => { const j = J[r.id] || null, st = pickState(r, j, s.kw);
      return { id: r.id, name: r.n || '', when: kstLabel(r.t, nowMs), t: r.t, dur: durLabel(r.d), d: r.d || 0, st, picked: isPicked(st), hit: kwHit(r.n, s.kw),

function macView(doc, nowMs) {

  return { name: doc && doc.id || '', alive, ago: agoLabel(at, nowMs), doing: alive ? (doc.doing || '쉼') : '꺼짐', err: doc && doc.err || '', v: doc && doc.v || '',
    old: !!(doc && doc.v && doc.v !== HELPER_LATEST), cli: doc && doc.cli || '',
    ready: READY.map(x => ({ k: x.k, label: x.label, why: x.why, how: x.how, ok: r[x.k] === true ? true : r[x.k] === false ? false : null })) };

/* ---------- 도우미가 계정에 둘 녹음 줄 (rec/{번호}) ----------
   바뀐 줄만 쓴다. 목록 기간 안에 있던 줄이 PLAUD 에서 사라지면 지운다(사본은 원본을 따른다) — 단 한 번에 많이 사라지면 지우지 않고 알린다(규모 상한). */

    if (!o || o.n !== v.n || o.t !== v.t || o.c !== v.c || o.d !== v.d) put.push({ id: r.id, v }); }
  const gone = Object.values(O).filter(o => o && Number.isFinite(o.c) && o.c >= fromMs && !want.has(o.id)).map(o => o.id);

/* ---------- 두 Mac 일감 맡기 (job/{번호}) ----------
   한 번에 한 Mac 만: 읽은 판(ver)이 그대로일 때만 쓰는 '조건부 쓰기'(파이어베이스 트랜잭션과 같은 뜻). 맡은 시각(at)은 파이어베이스 시계.
   맡은 Mac 이 LEASE_MS 동안 시각을 새로 찍지 않으면 풀린다. 일하는 동안 RENEW_MS 마다 renew 한다(3 ~ 5시간 녹음). */
function claimCheck(job, mac, now) {

  if (job.st === 'done') return { ok: false, why: 'done' };
  if (job.st === 'work') {

    if (Number.isFinite(job.at) && now - job.at < LEASE_MS) return { ok: false, why: 'busy', mac: job.mac };

// io.read(id) → { job, ver, now } · io.write(id, patch, ver) → true(씀) | false(그 사이 남이 바꿈). patch 의 at 은 io 가 파이어베이스 시계로 찍는다

}
async function finish(io, id, mac, ok, err) {

  return { ok: await io.write(id, ok ? { st: 'done', step: 'drive', mac } : { st: 'fail', step: job.step || 'get', mac, err: String(err || '').slice(0, 120) }, ver) };
}
// 맡을 차례: 골랐고 · 끝나지 않았고 · 지금 맡을 수 있는 것, 오래된 녹음부터

    .sort((a, b) => (a.t || 0) - (b.t || 0)).map(r => r.id);

/* ---------- 계정 쪽 요청 (cmd/{id}) ---------- */

// 화면 · 기록에 남기기 전에: 주소(내려받기 열쇠가 들 수 있음)를 지운다

/* ---------- 이 Mac 의 도우미 (127.0.0.1 — 같은 Mac 크롬에서만) ----------
   처음 한 번은 HB 가 눌러야 묻는다(크롬이 '이 기기의 다른 앱' 허락을 묻기 때문 — 아무 설명 없이 뜨지 않게). 한 번 되면 다음부터 저절로. */
async function helperCall(path, body) {

  el.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse' || e.button !== 0 || !e.target.closest || !e.target.closest('.phead')) return;

    const mv = ev => move(ev.clientX, ev.clientY), up = ev => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); removeEventListener('pointercancel', up); end(ev.type === 'pointercancel'); };
    addEventListener('pointermove', mv); addEventListener('pointerup', up); addEventListener('pointercancel', up); });
}

/* ---------- 누르기 ---------- */
document.addEventListener('click', e => {
  if (Date.now() - PG.eat < 350) return;
  const a = e.target.closest('[data-act]'); if (!a) return; const d = a.dataset;
  switch (d.act) {
    case 'login': return fbLogin();
    case 'logout': return fbLogout();
    case 'menu': return openPane({ kind: 'menu' });
    case 'reload': {
      const on = Object.values(S.macs).map(x => macView(x, now())).filter(x => x.alive);
      if (!on.length) return toast('켜진 Mac 이 없습니다\n켜지면 저절로 목록을 읽습니다');
      on.forEach(x => sendCmd(x.name, 'refresh')); return;
    }
    case 'closepane': return closePane();
    case 'pick': return setPick(d.id, d.st);
    case 'kwadd': { const inp = $('#kw-in'), r = addKw(settings().kw, inp && inp.value); if (r.err) return toast(r.err); saveSettings({ kw: r.list }); toast('\'' + cleanKw(inp.value) + '\' 을 더했습니다\n제목에 있으면 저절로 고릅니다'); return; }
    case 'kwdel': saveSettings({ kw: removeKw(settings().kw, d.w) }); return toast('\'' + d.w + '\' 을 뺐습니다');
    case 'days': return saveSettings({ days: +d.d });
    case 'model': return saveSettings({ model: d.m });
    case 'pairpane': openPane({ kind: 'pair' }); return probeHere(true);
    case 'pairname': return pairHere(d.n);
    case 'pairtyped': return pairHere(($('#mac-in') || {}).value);
    case 'fix': return openPane({ kind: 'fix', mac: d.mac, k: d.k });
    case 'cmd': return sendCmd(d.mac, d.w);
    case 'runfix': { const P = S.pane, r = READY.find(x => x.k === P.k); closePane(); return sendCmd(P.mac, r.how, r.how === 'model' ? settings().model : undefined); }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.pane) { e.preventDefault(); closePane(); }
  if (e.key === 'Enter' && e.target && e.target.id === 'fb-pw') fbLogin();
  if (e.key === 'Enter' && e.target && e.target.id === 'kw-in') { e.preventDefault(); $('[data-act="kwadd"]').click(); }
});
setInterval(() => { if (!S.pane) render(); sweepCmds(); }, 30000);   // 켜짐 · 'n분 전' 을 새로
if (DEMO) { demoData(); render(); }
else { render(); fbInit(); let p = ''; try { p = localStorage.getItem(PROBE_KEY); } catch (_) { } if (p) probeHere(false); }
if ('serviceWorker' in navigator && !DEMO) navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
