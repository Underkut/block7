<style>

  --bg:#121212; --card:#1c1c1e; --ink:#ececee; --sub:#9a9aa0; --dim:#636366; --line:#2c2c2e;
  --ok:#57c38a; --bad:#ef6a5e; --teal:#2BCFCF; --teal-ink:#5fe3e3; --warn:#e0a84a; --ac:#7aa2ff; --chip:#222838; --chip-ink:#a9c0ff;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f);font-weight:400}
html.plock body{position:fixed;left:0;right:0;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-t) + 10px) 16px 10px;background:var(--bg)}
header.top{gap:8px;justify-content:flex-start;padding-left:10px;padding-right:6px}
header.top h1{font-size:16px;font-weight:700;letter-spacing:.03em;margin:0;white-space:nowrap}
header.top .logo{width:28px;height:28px;border-radius:7px;flex:none;display:block}

header.top .tr{display:flex;align-items:center;justify-content:flex-end;gap:0}
.verb{font-size:11.5px;color:var(--dim);padding:3px 7px;border-radius:8px;white-space:nowrap}

.ico{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--sub)}

h2{font-size:13px;font-weight:600;color:var(--sub);margin:22px 4px 8px;display:flex;justify-content:space-between;align-items:baseline}

.macs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.mac .row1{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}

.ready .ok{color:var(--ok)} .ready .no{color:var(--bad)} .ready .un{color:var(--dim)}

.rec .nw{width:6px;height:6px;border-radius:50%;background:var(--ac);flex:none} .rec .nw.off{background:transparent}
.rec .tm{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;width:42px;flex:none}
.rec .right{display:flex;align-items:center;gap:6px;flex:none}

.rec .len.long{color:var(--warn);font-weight:600}
.rec .meta.bad{color:var(--bad)}
.ibs{display:inline-flex;gap:0}
.ib{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;color:var(--sub);border-radius:8px}

.pill{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 5px;border-radius:9px;font-size:11px;font-weight:700;letter-spacing:.02em;margin-right:2px}
.pill.p{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.pill.w{color:var(--teal-ink);background:color-mix(in srgb,var(--teal) 22%,transparent)}
.pill.w.odd{color:var(--bad);background:transparent;box-shadow:inset 0 0 0 1.5px var(--bad)}
/* 폰 폭: 끝난 줄의 알약 · 단추를 제목 아래 줄로(제목이 눌려 잘리지 않게) */
@media (max-width:480px){ .rec.wr{flex-wrap:wrap;row-gap:0} .rec.wr .body{flex:1 1 calc(100% - 100px)} .rec.wr .right{width:100%;justify-content:flex-end;margin-top:-2px} .rec.wr .right .len{margin-right:auto;padding-left:62px} }
.ib[data-act="more"] svg{fill:currentColor}
.s{font-size:11.5px;padding:1px 8px;border-radius:9px;white-space:nowrap}
.s.work{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.s.fail{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}

.lnk{color:var(--sub);font-size:13px;white-space:nowrap}
.lnk.dim{color:var(--dim)}.lnk.bad{color:var(--bad)}.lnk.dr{font-weight:600;margin-right:2px}
.ta{height:auto;min-height:84px;padding:10px 12px;line-height:1.6;resize:vertical;font:inherit}
.ta.big{min-height:300px;font-size:13.5px}
details.pk{margin:12px 0 4px}details.pk summary{font-size:13px;color:var(--sub);cursor:pointer}details.pk .code{max-height:320px;overflow:auto;white-space:pre-wrap;margin-top:6px}
.msg.ok{color:var(--ok, #2e8b57)}
select.field{appearance:auto}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.day{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--sub);padding:10px 14px 4px;background:var(--bg)}
.day small{font-weight:400;color:var(--dim)}
.seg{display:flex;gap:4px;background:var(--card);border-radius:11px;padding:3px;margin:0 0 8px}
.seg button{flex:1;font-size:13px;padding:6px 0;border-radius:9px;color:var(--sub)}
.seg button.on{background:var(--chip);color:var(--chip-ink);font-weight:600}
.seg button i{font-style:normal;font-size:11px;opacity:.75;margin-left:4px}
.bar{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:8px 10px 8px 14px;margin:0 0 8px;font-size:13.5px}
.bar .grow{flex:1;min-width:0}
.card.mac.off{padding:10px 16px}
.fold{display:flex;flex-wrap:wrap;align-items:center;gap:0 4px;width:100%;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:12.5px;color:var(--sub);text-align:left}
.fold .okc{color:var(--ok)} .fold.bad{color:var(--bad)}
.fold .chev{margin-left:auto;color:var(--dim)}
.vmeta{font-size:12.5px;color:var(--sub);text-align:center;margin:-2px 0 10px}
.vtext{white-space:pre-wrap;font-size:15px;line-height:1.75;user-select:text;-webkit-user-select:text}
.rec:last-child{border-bottom:0}
.rec .chk{width:22px;height:22px;border-radius:50%;border:1.6px solid var(--dim);flex:none;display:flex;align-items:center;justify-content:center}
.rec.pick .chk{background:var(--ac);border-color:var(--ac)}
.rec.pick .chk::after{content:'';width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.rec .body{flex:1;min-width:0}
.rec .ttl{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.rec .ttl.none{color:var(--dim)}
.rec.done .chk{opacity:.35}
.rec .meta{font-size:12px;color:var(--sub);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:1px}
.rec .why{font-size:11px;padding:1px 7px;border-radius:9px;background:var(--chip);color:var(--chip-ink)}
.rec .why.out{background:transparent;color:var(--dim);padding:0}
.steps{display:flex;gap:4px;font-size:11px;color:var(--dim);flex:none}
.steps span.on{color:var(--ok)} .steps span.cur{color:var(--warn)}
.empty{color:var(--sub);text-align:center;padding:26px 10px;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 18px;border-radius:10px;background:var(--ac);color:#fff;font-weight:600;white-space:nowrap;flex:none}
.btn.ghost{background:var(--chip);color:var(--chip-ink)}
.btn[disabled]{opacity:.45}
.field{display:block;width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg);margin:6px 0}
.msg{font-size:13px;color:var(--sub);white-space:pre-line}
.msg.bad{color:var(--bad)}
.code{font:12.5px/1.5 ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  word-break:break-all;user-select:all;-webkit-user-select:all;margin:8px 0}
.pairbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;background:var(--chip);color:var(--chip-ink);font-size:14px}
.chip.sel{background:var(--ac);color:#fff}
.chip .x{opacity:.7;font-size:16px;line-height:1}
/* 아래에서 올라오는 판 */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:20}
.pane{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88dvh;display:flex;flex-direction:column;background:var(--card);
  border-radius:16px 16px 0 0;padding-bottom:var(--safe-b);max-width:720px;margin:0 auto}
.phead{position:relative;padding:14px 48px 10px;text-align:center;font-weight:600;touch-action:none;cursor:grab;flex:none}
.phead::before{content:'';position:absolute;top:6px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line)}
.modal-x{position:absolute;right:8px;top:6px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.modal-x svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}
.pbody{overflow:auto;padding:4px 16px 18px;-webkit-overflow-scrolling:touch}
.pbody h3{font-size:13px;color:var(--sub);font-weight:600;margin:16px 0 4px}
.pfoot{padding:10px 16px 14px;display:flex;justify-content:flex-end;flex:none}
.opt{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.opt:last-child{border-bottom:0}
.opt .r{width:18px;height:18px;border-radius:50%;border:1.6px solid var(--dim);flex:none}
.opt.sel .r{border:5px solid var(--ac)}
.opt small{display:block;color:var(--dim);font-size:12px}
.kv{display:grid;grid-template-columns:76px 1fr;gap:4px 10px;font-size:14px;margin:6px 0}
.kv b{font-weight:500;color:var(--sub)}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;max-width:min(86vw,420px);background:rgba(28,28,30,.92);
  color:#fff;padding:14px 20px;border-radius:14px;text-align:center;white-space:pre-line;font-size:15px}
.ver{font-size:12px;color:var(--dim);text-align:center;margin-top:18px}
</style>
</head>

<!-- 판단은 모두 이 덩어리 한 곳 — 화면 없이 돈다. 계기판과 Mac 도우미(helper.mjs)가 함께 쓴다(도우미는 이 파일을 받아 이 덩어리만 떼어 씀).
     tests/test_plaudhub.js 가 이것만 떼어 시험한다 — 고치면 시험부터 고친다. -->
<script id="plaudhub-core">
const APP_VERSION = "v. 26-1125-1";
// 도우미의 지금 판 — plaudhub/helper.mjs 의 HELPER_VERSION 과 같아야 한다(test_plaudhub ⑫). 다르면 계기판이 '새로 받기' 를 권한다
const HELPER_LATEST = 'h. 26-1124-4';
const PROJECT = 'block7-8f24e';
const SITE = 'https://block7.my/plaudhub/';
const PAIR_PORT = 47211;
const ID_RE = /^[A-Za-z0-9_]{8,64}$/;   // 녹음 번호(지금은 f_ + 16진수 32자). 보안 규칙도 같은 꼴만 받는다
const LEASE_MS = 30 * 60 * 1000;          // 맡은 Mac 이 이만큼 소식이 없으면 다른 Mac 이 이어받는다
const RENEW_MS = 5 * 60 * 1000;           // 일하는 동안 맡은 시각을 새로 찍는 간격(긴 녹음 — HB 결정 ④)
const ALIVE_MS = 6 * 60 * 1000;           // 도우미는 2분마다 소식을 남긴다 — 6분 넘게 없으면 '꺼짐'
const DEFAULT_KW = ['심방'];
const KW_MAX = 20, KW_LEN = 20;
const DAY_CHOICES = [7, 14, 30], DEFAULT_DAYS = 14;
const MAC_MAX = 12;
// 전사 모델 후보(8GB Mac). speed = 녹음 1분을 몇 배 빠르게 하나 — 어림값. 그 Mac 에서 '모델 시험' 으로 잰 값(mac.test)이 있으면 그것을 쓴다(speedsOf)
const MODELS = [
  { id: 'medium-q5_0', file: 'ggml-medium-q5_0.bin', mb: 514, label: '중간 · 양자화', note: '비교용 — 처음 생각한 기본', speed: 4 },
  { id: 'large-v3-turbo-q5_0', file: 'ggml-large-v3-turbo-q5_0.bin', mb: 547, label: '터보 · 양자화', note: '기본 — 여기서 시작 (HB 11/23)', speed: 6 },
  { id: 'large-v3-q5_0', file: 'ggml-large-v3-q5_0.bin', mb: 1080, label: '큰 것 · 양자화', note: '비교용 — 느림', speed: 1.5 },
];
const DEFAULT_MODEL = 'large-v3-turbo-q5_0';
function modelOf(id) { return MODELS.find(m => m.id === id) || MODELS.find(m => m.id === DEFAULT_MODEL); }
function modelUrl(m) { return 'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/' + m.file; }

// 준비 상태 — 도우미가 Mac 마다 ✓ ✗ 를 적는다. how = 고치는 길(INSTALLS 의 열쇠 · term = 터미널 · note = 안내만)
const READY = [
  { k: 'brew', label: 'Homebrew', why: '설치 도구 (처음 한 번, 터미널)', how: 'term' },
  { k: 'node', label: 'Node', why: '도우미와 PLAUD CLI 가 도는 바탕 (설치 한 줄이 깜)', how: 'term' },
  { k: 'ffmpeg', label: 'ffmpeg', why: '녹음을 전사용 소리 파일로 바꿈', how: 'ffmpeg' },
  { k: 'whisper', label: 'whisper.cpp', why: 'Mac 안에서 글로 받아 적음', how: 'whisper' },
  { k: 'model', label: '전사 모델', why: 'whisper.cpp 가 쓰는 말 모델', how: 'model' },
  { k: 'plaud', label: 'PLAUD CLI', why: 'PLAUD 공식 명령 도구', how: 'plaud' },
  { k: 'login', label: 'PLAUD 로그인', why: '내 녹음 목록을 읽는 허락', how: 'login' },
  { k: 'drive', label: '드라이브 폴더', why: "구글 드라이브 앱의 'HB-심방-전사' 폴더 (전사 파일 자리)", how: 'note' },
];
// 도우미가 돌리는 명령은 이 표가 전부다(계정의 cmd 칸은 열쇠 이름만 싣는다). 보안 규칙의 what 목록과 같아야 한다(test_plaudhub ⑪).
// argv 의 '~' 는 도우미가 내 폴더로 바꾼다. sudo 는 쓰지 않는다.
const INSTALLS = {
  ffmpeg: { title: 'ffmpeg', argv: ['brew', 'install', 'ffmpeg'], where: 'Homebrew 폴더 (/opt/homebrew)', size: '수백 MB (딸린 것 포함)', mins: 10 },
  whisper: { title: 'whisper.cpp', argv: ['brew', 'install', 'whisper-cpp'], where: 'Homebrew 폴더 (/opt/homebrew)', size: '약 20MB', mins: 5 },
  plaud: { title: 'PLAUD CLI', argv: ['npm', 'install', '-g', '@plaud-ai/cli', '--prefix', '~/.npm-global'], where: '내 폴더의 .npm-global (sudo 없이)', size: '약 30MB', mins: 3 },
  model: { title: '전사 모델', argv: ['curl', '-fL', '--retry', '2', '-o', '~/Library/Application Support/plaudhub/models/(파일)', '(모델 주소)'], where: '~/Library/Application Support/plaudhub/models', size: '(고른 모델)', mins: 15 },
  login: { title: 'PLAUD 로그인', argv: ['plaud', 'login'], where: '그 Mac 의 기본 브라우저(크롬)에 PLAUD 로그인 창이 열립니다', size: '-', mins: 5 },
  update: { title: '도우미 새로 받기', argv: ['curl', SITE + 'helper.mjs'], where: '~/Library/Application Support/plaudhub', size: '약 40KB', mins: 1 },
  refresh: { title: '녹음 목록 다시 읽기', argv: ['plaud', 'recent'], where: '-', size: '-', mins: 2 },

async function gFetch(tok, url, body) {
  const r = await fetch(url, { method: body ? 'POST' : 'GET', headers: Object.assign({ Authorization: 'Bearer ' + tok }, body ? { 'Content-Type': 'application/json' } : {}), body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.ok) return j;
  if (r.status === 400 && /parse range/i.test(JSON.stringify(j))) throw new Error("시트에 '" + INBOX_TAB_NAME + "' 탭이 없습니다\n심방 노트 › 설정 › 새 칸 (vNext) 더하기를 먼저 해 주세요");
  if (r.status === 403 || r.status === 404) throw new Error('이 시트를 열 권한이 없습니다\n심방 노트에서 시트를 다시 골라 주세요');
  throw new Error('구글 시트 ' + r.status);
}

/* ---------- 이 Mac 의 도우미 (127.0.0.1 — 같은 Mac 크롬에서만) ----------
   처음 한 번은 HB 가 눌러야 묻는다(크롬이 '이 기기의 다른 앱' 허락을 묻기 때문 — 아무 설명 없이 뜨지 않게). 한 번 되면 다음부터 저절로. */
async function helperCall(path, body, ms) {
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), ms || 2500);
  try {
    const r = await fetch('http://127.0.0.1:' + PAIR_PORT + path, { method: body ? 'POST' : 'GET', signal: ctl.signal, targetAddressSpace: 'loopback',
      headers: body ? { 'content-type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.err || ('응답 ' + r.status)); return j;
  } finally { clearTimeout(tm); }
}

  };
  el.addEventListener('touchstart', e => { if (e.touches.length !== 1) { g = null; return; } const t = e.touches[0]; start(t.clientX, t.clientY, e.target, false); }, { passive: true });
  el.addEventListener('touchmove', e => { if (e.touches.length !== 1) return end(true); const t = e.touches[0]; if (move(t.clientX, t.clientY) && e.cancelable) e.preventDefault(); }, { passive: false });
  el.addEventListener('touchend', () => end(false)); el.addEventListener('touchcancel', () => end(true));
  el.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse' || e.button !== 0 || !e.target.closest || !e.target.closest('.phead')) return;
    start(e.clientX, e.clientY, e.target, true); if (!g) return; e.preventDefault();
    const mv = ev => move(ev.clientX, ev.clientY), up = ev => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); removeEventListener('pointercancel', up); end(ev.type === 'pointercancel'); };
    addEventListener('pointermove', mv); addEventListener('pointerup', up); addEventListener('pointercancel', up); });
}

/* ---------- 누르기 ---------- */
document.addEventListener('click', e => {
  if (Date.now() - PG.eat < 350) return;
  const a = e.target.closest('[data-act]'); if (!a) return; const d = a.dataset;
  switch (d.act) {
    case 'login': return fbLogin();
    case 'logout': return fbLogout();
    case 'menu': return openPane({ kind: 'menu' });
    case 'reload': {
      const on = Object.values(S.macs).map(x => macView(x, now())).filter(x => x.alive);
      if (!on.length) return toast('켜진 Mac 이 없습니다\n켜지면 저절로 목록을 읽습니다');
      Promise.all(on.map(x => sendCmd(x.name, 'refresh', undefined, true))).then(r => { if (r.some(Boolean)) toast('녹음 목록을 다시 읽어 오라고 보냈습니다\n1분 안에 새 녹음이 나타납니다'); });
      return;
    }
    case 'mtestpane': return openPane({ kind: 'mtest', mac: d.mac, rec: '' });
    case 'tab': S.tab = d.k; uiSave(); return render();
    case 'fold': { if (S.open.has(d.mac)) S.open.delete(d.mac); else S.open.add(d.mac); uiSave(); return render(); }
    case 'ver': return S.newVer ? verGet() : verCheck(true);
    case 'kick': return kick(d.id);
    case 'kickall': return kick('');
    case 'view': return viewTxt(d.id);
    case 'more': return openPane({ kind: 'more', id: d.id });
    case 'redo': case 'rmtxt': return dropAsk(d.act, d.id);
    case 'auto': return setAuto(d.mac, d.on !== '1');
    case 'copy': return copyTxt(d.id);
    case 'save': return saveTxt(d.id);
    case 'lockpane': return openPane({ kind: 'lock' });
    case 'locksubmit': return lockSubmit();
    case 'givekey': return giveKeyHere(false);
    case 'forgetkey': try { localStorage.removeItem(KEY_LS); } catch (_) { } for (const k of Object.keys(PLAIN)) delete PLAIN[k]; renderPane(); render(); return toast('이 기기에서 암호를 잊었습니다');
    case 'diskpane': return openPane({ kind: 'disk', mac: d.mac });
    case 'rmmodel': if (S.pane) sendCmd(S.pane.mac, 'rmmodel', d.m).then(() => renderPane()); return;
    case 'cleanask': return openPane({ kind: 'clean' });
    case 'cleanmac': closePane(); return sendCmd(d.mac, 'clean', undefined, true).then(ok => ok && toast(d.mac + ' Mac 에 비우라고 보냈습니다\n30초 안에 비웁니다'));
    case 'cleanall': { const ws = S.ws || workSizes([]); closePane();
      return Promise.all(ws.macs.map(m => sendCmd(m, 'clean', undefined, true))).then(r => r.some(Boolean) && toast('임시 파일을 비우라고 보냈습니다\n30초 안에 비웁니다')); }
    case 'mtrec': if (S.pane) { S.pane.rec = d.id; renderPane(); } return;
    case 'mtinstall': if (S.pane) { sendCmd(S.pane.mac, 'model', d.m).then(() => renderPane()); } return;
    case 'mtrun': { const P = S.pane; if (!P || !P.rec) return; closePane();
      return sendCmd(P.mac, 'mtest', P.rec, true).then(ok => { if (ok) toast(P.mac + ' Mac 에 모델 시험을 보냈습니다\n모델마다 몇 분씩 걸립니다 — 결과는 Mac 카드에'); }); }
    case 'closepane': return closePane();
    case 'draft': return openDraft(d.id);
    case 'drnew': closePane(); return drMake(d.id, false);
    case 'drre': return drMake(d.id, true);
    case 'drok': return drApprove(d.id);
    case 'guidepane': return guideOpen();
    case 'gdsave': return guideSave(false);
    case 'gdreset': return guideSave(true);
    case 'aikeypane': openPane({ kind: 'aikey' }); return probeHere(true);
    case 'aikeygive': return aiKeyGive(false);
    case 'aikeyclear': return aiKeyGive(true);
    case 'aion': return saveSettings({ ai: Object.assign(aiOf(S.settings), { on: d.on !== '1' }) }).then(() => toast('AI 초안 저절로 ' + (d.on !== '1' ? '켬\n키워드로 고른 녹음은 전사 뒤 저절로' : '끔\n줄의 ⋯ › 초안 만들기로만')));
    case 'pick': return setPick(d.id, d.st);
    case 'kwadd': { const inp = $('#kw-in'), r = addKw(settings().kw, inp && inp.value); if (r.err) return toast(r.err); saveSettings({ kw: r.list }); toast('\'' + cleanKw(inp.value) + '\' 을 더했습니다\n제목에 있으면 저절로 고릅니다'); return; }
    case 'kwdel': saveSettings({ kw: removeKw(settings().kw, d.w) }); return toast('\'' + d.w + '\' 을 뺐습니다');
    case 'days': return saveSettings({ days: +d.d });
    case 'model': return saveSettings({ model: d.m });
    case 'pairpane': openPane({ kind: 'pair' }); return probeHere(true);
    case 'pairname': return pairHere(d.n);
    case 'pairtyped': return pairHere(($('#mac-in') || {}).value);
    case 'fix': return openPane({ kind: 'fix', mac: d.mac, k: d.k });
    case 'cmd': return sendCmd(d.mac, d.w);
    case 'runfix': { const P = S.pane, r = READY.find(x => x.k === P.k); closePane(); return sendCmd(P.mac, r.how, r.how === 'model' ? settings().model : undefined); }
  }
});
document.addEventListener('input', e => { const t = e.target; if (!t || !S.pane) return; if (t.id === 'dr-fb') S.pane.fb = t.value; if (t.id === 'gd-tx') S.pane.text = t.value; });
document.addEventListener('change', e => { const t = e.target; if (t && t.id === 'ai-model') { saveSettings({ ai: Object.assign(aiOf(S.settings), { model: t.value }) }); toast('AI 초안 모델: ' + (t.value || '기본') + '\n다음 초안부터 씁니다'); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.pane) { e.preventDefault(); closePane(); }
  if (e.key === 'Enter' && e.target && e.target.id === 'fb-pw') fbLogin();
  if (e.key === 'Enter' && e.target && /^pw[12]$/.test(e.target.id)) lockSubmit();
  if (e.key === 'Enter' && e.target && e.target.id === 'kw-in') { e.preventDefault(); $('[data-act="kwadd"]').click(); }
});
setInterval(() => { if (!S.pane) render(); sweepCmds(); }, 30000);   // 켜짐 · 'n분 전' 을 새로
if (DEMO) { demoData(); render(); verPaint(); }
else { render(); verPaint(); verCheck(false); setInterval(() => verCheck(false), 10 * 60e3); fbInit(); let p = ''; try { p = localStorage.getItem(PROBE_KEY); } catch (_) { } if (p) probeHere(false); }
if ('serviceWorker' in navigator && !DEMO) navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
