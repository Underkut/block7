<!DOCTYPE html>
<!-- 헌금 계좌 안내 · v. 26-1030-9 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="format-detection" content="telephone=no">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>사랑의 연탄나눔 2026 재정 후원</title>
<link rel="canonical" href="https://sweeter.my/bank/mission/">
<meta property="og:title" content="사랑의 연탄나눔 2026 재정 후원 · 주님의교회">
<meta property="og:description" content="우리은행 1005-101-854890 · 주님의교회">
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#16181d;--sub:#7b808a;--line:#e6e8ec;--accent:#2f5bea}
@media (prefers-color-scheme:dark){:root{--bg:#0f1012;--card:#1b1c1f;--ink:#f2f3f5;--sub:#9a9ea6;--line:#2a2b2f}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;padding:28px 16px calc(36px + env(safe-area-inset-bottom));display:flex;justify-content:center}
main{width:100%;max-width:440px}
.title{font-size:22px;font-weight:700;margin-bottom:16px}.title b{color:var(--accent)}
.acc{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.top{background:var(--accent);color:#fff;padding:18px 22px 20px}
.mission{display:inline-block;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:999px;margin-bottom:12px}
.top small{display:block;font-size:13px;opacity:.85}
.top h1{font-size:25px;font-weight:700;margin-top:4px}.top h1 span{font-size:16px;font-weight:400;opacity:.9;margin-left:4px}
.row>div{min-width:0}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:20px 22px 22px}
.bank{font-size:15px;color:var(--sub);display:flex;align-items:center;gap:7px}
.dot{width:16px;height:16px;border-radius:50%;background:linear-gradient(90deg,#3fb6e8 50%,#1b3fae 50%)}
.num{font-size:clamp(20px,6.6vw,28px);font-weight:700;letter-spacing:.01em;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.copy{flex:none;display:flex;align-items:center;gap:5px;border:1.6px solid var(--accent);color:var(--accent);background:none;border-radius:999px;padding:9px 16px;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.copy svg{width:17px;height:17px}
h2{font-size:20px;font-weight:700;margin:30px 4px 4px}
.hint{font-size:14px;color:var(--sub);margin:0 4px 14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.grid a{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 2px 10px;background:var(--card);border:1px solid var(--line);border-radius:18px;color:var(--ink);text-decoration:none;font-size:12.5px;transition:transform .15s}
.grid a:active{transform:scale(.96)}
.grid i{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:15px;letter-spacing:-.02em;line-height:1.05;text-align:center}
.grid i img{display:none}.grid i.logo{background:none!important;box-shadow:none!important;font-size:0}.grid i.logo img{display:block;width:100%;height:100%;border-radius:14px;object-fit:cover}
.badge{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:#111;color:#fff;font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:999px;white-space:nowrap}
.safe{font-size:13px;color:var(--sub);text-align:center;margin-top:20px;display:flex;align-items:center;justify-content:center;gap:5px}
.safe svg{width:14px;height:14px}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(20,20,22,.88);color:#fff;padding:15px 24px;border-radius:16px;font-size:15px;text-align:center;line-height:1.55;white-space:pre-line;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<main>
  <div class="title"><b>송금하기</b> · 계좌 정보 확인</div>
  <section class="acc">
    <div class="top"><span class="mission">🔥 사랑의 연탄나눔 2026 재정 후원</span><small>수취인</small><h1>주님의교회<span>님께</span></h1></div>
    <div class="row">
      <div><div class="bank"><span class="dot"></span>우리은행</div><div class="num">1005-101-854890</div></div>
      <button class="copy" onclick="copyAcc()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg>복사</button>
    </div>
  </section>

  <h2>내 은행을 누르면 바로 송금 페이지로</h2>
  <p class="hint">계좌번호는 자동으로 복사되고, 은행 앱이 열려요</p>
  <nav class="grid" id="apps"></nav>
  <p class="safe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>비밀번호는 여기서 받지 않아요 · 송금은 내 은행 앱에서</p>
</main>
<div id="toast"></div>
<script>
const ACC='1005101854890', ACC_TXT='우리은행 1005-101-854890 주님의교회';
// [이름, 바탕색, 글자색, 표시, 앱 주소(scheme), 앱 이름, 자동입력, 로고 키, 앱스토어 ID, 안드로이드 패키지, 안드로이드 주소(다를 때만)]
// 앱 주소가 null 이면 '복사 + 직접 열기 안내' 만 한다 (공개된 주소를 못 찾은 은행 — 2026-10-30 조사)
// ✔ = 아이폰에서 열리는 것을 HB 가 확인함 · 신한·SC·씨티·우체국·새마을금고·부산은 HB 가 찾아 준 주소(2026-10-30)
const APPS=[
  ['토스','#0064ff','#fff','toss','supertoss://send?bank='+encodeURIComponent('우리')+'&accountNo='+ACC+'&origin=qr','토스',1,'toss','839333328','viva.republica.toss'], // ✔
  ['카카오뱅크','#ffe300','#1a1a1a','B','kakaobank://','카카오뱅크',0,'kakao','1258016944','com.kakaobank.channel'], // ✔
  ['국민은행','#ffbc00','#3d342b','KB','kbbank://','KB스타뱅킹',0,'kb','373742138','com.kbstar.kbbank','kbbank://call'], // ✔
  ['신한은행','#0046ff','#fff','SOL','shinhansol://','신한 SOL뱅크',0,'shinhan','357484932','com.shinhan.sbanking'], // ✔
  ['우리은행','#fff','#1b3fae','WON','wooribank://','우리WON뱅킹',0,'woori','1470181651','com.wooribank.smart.npib','wooribank://'], // ✔
  ['하나은행','#008c73','#fff','1Q','hanabank-oqf://','하나원큐',0,'hana','6743190232','com.hanabank.oqf'],
  ['NH스마트','#0f4fc4','#fff','NH','newnhsmartbanking://','NH스마트뱅킹',0,'nh','1444712671','nh.smart.banking'],
  ['케이뱅크','#0b1d8c','#fff','K','ukbanksmartbank://','케이뱅크',0,'kbank','1178872627','com.kbankwith.smartbank','ukbanksmartbankshortcut://'],
  ['IBK기업','#fff','#0b4ea2','i-ONE','ionebank://','i-ONE Bank',0,'ibk','1460543865','com.ibk.android.ionebank'],
  ['NH올원','#fff','#00a651','올원','nhallone://','NH올원뱅크',0,'nhallone','1641628055','com.nonghyup.nhallonebank'],
  ['iM뱅크','#00a29a','#fff','iM','mbanking://','iM뱅크',0,'im','1067748687','kr.co.dgb.dgbm'],
  ['새마을금고','#fff','#0062b1','MG','kfccsb://','MG더뱅킹',0,'mg','425089902','com.smg.spbs'],
  ['우체국','#e5322d','#fff','우체국','com.epost.psf.sd://','우체국뱅킹',0,'epost','554920991','com.epost.psf.sdsi'],
  ['SC제일','#fff','#0473ea','SC','scbmobile://','SC제일은행',0,'sc','1457418899','com.scbank.ma30'],
  ['부산은행','#fff','#d6001c','BNK','bslink://call','BNK부산은행',0,'busan','1445137607','kr.co.busanbank.mbp'],
  ['씨티은행','#0c5bb5','#fff','citi','citimobileapp://','씨티모바일',0,'citi','1179759666','kr.co.citibank.citimobile','citimobileapp://smartpay'],
  ['NH콕뱅크','#fff','#1d9b5e','콕','nhcok://','NH콕뱅크',0,'nhcok','1131147442','nh.smart.nhcok'],
  ['수협은행','#fff','#0a5aa8','Sh','kakao4251fde6ccd98c9326127797ddd3aad0://kakaolink','수협 파트너뱅크',0,'suhyup','1229985989','com.suhyup.psmb','suhyuppsmb://suhyuplink'],
  ['경남은행','#fff','#d6001c','BNK','kakaoed1616004f7cc49ecf503b70e9221365://kakaolink','BNK경남은행',0,'kyongnam','678852685','com.knb.psb','alopex://psb'],
  ['광주은행','#fff','#2a50d8','Wa','kakao6ec8812a5d4d44c18cadd24f2dd65eca://kakaolink','광주은행',0,'kjbank','1576149106','com.kjbank.asb.pbanking','kjbank://asb'],
  ['전북은행','#0b3fd8','#fff','JB','jbprivatebank://','전북은행',0,'jbbank','1547903285','kr.co.jbbank.privatebank'],
  ['제주은행','#fff','#0a4fe0','J','newjbanksmart://action','제주은행',0,'jeju','6443788309','com.jejubank.smartnew'],
  ['산업은행','#00468c','#fff','KDB','smartkdb://','KDB산업은행',0,'kdb','','co.kr.kdb.android.smartkdb','smartkdbnvs://'],
  ['SBI저축은행','#fff','#0a7fd8','SBI','saidabank://deep_link_url','사이다뱅크',0,'sbi','','com.sbi.saidabank','sbi://sbi_url'],
];
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent), isAnd=/Android/.test(navigator.userAgent);
const store=a=>isIOS?(a[8]?'https://apps.apple.com/kr/app/id'+a[8]:null):'https://play.google.com/store/apps/details?id='+a[9];
// 안드로이드는 intent 주소로 연다 — 앱이 없으면 크롬이 스토어(fallback)로 넘긴다
const href=a=>{ if(!a[4]) return '#'; if(!isAnd) return a[4];
  const [sch,rest]=(a[10]||a[4]).split('://');
  return 'intent://'+rest+'#Intent;scheme='+sch+';package='+a[9]+';S.browser_fallback_url='+encodeURIComponent(store(a))+';end'; };
document.getElementById('apps').innerHTML=APPS.map((a,i)=>
  `<a href="${href(a)}" data-i="${i}">${a[6]?'<span class="badge">계좌 자동입력</span>':''}<i style="background:${a[1]};color:${a[2]};${a[1]=='#fff'?'box-shadow:inset 0 0 0 1px #e3e5e9':''}"><img src="logos/${a[7]}.png" alt="" onload="this.parentNode.classList.add('logo')" onerror="this.remove()">${a[3]}</i>${a[0]}</a>`).join('');
document.querySelectorAll('.grid a').forEach(el=>el.addEventListener('click',e=>{
  const a=APPS[el.dataset.i];
  copyText(ACC_TXT); // iOS: 탭 직후 동기로 복사
  if(!a[4]){ e.preventDefault(); toast('계좌번호를 복사했습니다\n'+a[5]+' 앱을 열어\n붙여넣어 주세요'); return; }
  if(isAnd) return;
  // 아이폰: 저절로 스토어로 넘기지 않는다 — 신한처럼 '앱에서 열기' 확인창이 뜨는 앱은
  // 확인을 누르기 전에 넘어가 버린다(2026-10-30 HB). 안내만 띄우고, 누르면 스토어로.
  const t=setTimeout(()=>{ if(!document.hidden) toast(store(a)?'계좌번호를 복사했습니다\n'+a[5]+' 앱이 없다면\n여기를 눌러 받아 주세요':'계좌번호를 복사했습니다\n'+a[5]+' 앱을 열어\n붙여넣어 주세요',store(a)?()=>location.href=store(a):null); },1800);
  document.addEventListener('visibilitychange',()=>clearTimeout(t),{once:true});
}));
function copyText(s){
  try{ const ta=document.createElement('textarea'); ta.value=s; ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
    ta.setSelectionRange(0,s.length); document.execCommand('copy'); ta.remove(); }catch(e){}
  try{ navigator.clipboard&&navigator.clipboard.writeText(s); }catch(e){}
}
function copyAcc(){ copyText(ACC_TXT); toast('계좌번호를 복사했습니다\n은행 앱에서 붙여넣어 주세요'); }
let tt,tfn; function toast(m,fn){ tfn=fn; const el=document.getElementById('toast'); el.textContent=m; el.classList.add('on');
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('on'),Math.min(9000,Math.max(3000,m.length*200))); }
document.getElementById('toast').onclick=e=>{ e.currentTarget.classList.remove('on'); if(tfn){ const f=tfn; tfn=null; f(); } };
</script>
</body>
</html>
