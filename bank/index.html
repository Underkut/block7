<style>

.tx{position:absolute;top:12px;right:12px;width:30px;height:30px;border:0;background:none;color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer}

<body>
<main>
  <section class="acc">

    <div class="row">
      <div><div class="bank"><span class="dot"></span>우리은행</div><div class="num">1005-101-854890</div></div>
      <button class="copy" onclick="copyAcc()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg>복사</button>

  <p class="safe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>비밀번호는 여기서 받지 않아요 · 송금은 내 은행 앱에서</p>

</main>
<div id="toast"><div class="tbox"><button class="tx" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="tic" id="tic"></div><div class="tt" id="tt"></div><div class="td" id="td"></div><button class="tbtn" id="tbtn"></button></div></div>
<script>
const ACC='1005101854890', ACC_TXT='우리은행 1005-101-854890 주님의교회';
// [이름, 바탕색, 글자색, 표시, 앱 주소(scheme), 앱 이름, 자동입력, 로고 키, 앱스토어 ID, 안드로이드 패키지, 안드로이드 주소(다를 때만)]
// 앱 주소가 null 이면 '복사 + 직접 열기 안내' 만 한다 (공개된 주소를 못 찾은 은행 — 2026-10-30 조사)
// ✔ = 아이폰에서 열리는 것을 HB 가 확인함 · 신한·SC·씨티·우체국·새마을금고·부산은 HB 가 찾아 준 주소(2026-10-30)
const APPS=[
  ['토스','#0064ff','#fff','toss','supertoss://send?bank='+encodeURIComponent('우리')+'&accountNo='+ACC+'&origin=qr','토스',1,'toss','839333328','viva.republica.toss'], // ✔
  ['카카오뱅크','#ffe300','#1a1a1a','B','kakaobank://','카카오뱅크',0,'kakao','1258016944','com.kakaobank.channel'], // ✔
  ['국민은행','#ffbc00','#3d342b','KB','kbbank://','KB스타뱅킹',0,'kb','373742138','com.kbstar.kbbank','kbbank://call'], // ✔
  ['신한은행','#0046ff','#fff','SOL','shinhansol://','신한 SOL뱅크',0,'shinhan','357484932','com.shinhan.sbanking'], // ✔
  ['우리은행','#fff','#1b3fae','WON','wooribank://','우리WON뱅킹',0,'woori','1470181651','com.wooribank.smart.npib','wooribank://'], // ✔
  ['하나은행','#008c73','#fff','1Q','hanabank-oqf://','하나원큐',0,'hana','6743190232','com.hanabank.oqf'],
  ['NH스마트','#0f4fc4','#fff','NH','newnhsmartbanking://','NH스마트뱅킹',0,'nh','1444712671','nh.smart.banking'],
  ['NH콕뱅크','#fff','#1d9b5e','콕','nhcok://','NH콕뱅크',0,'nhcok','1131147442','nh.smart.nhcok'],
  ['IBK기업','#fff','#0b4ea2','i-ONE','ionebank://','i-ONE Bank',0,'ibk','1460543865','com.ibk.android.ionebank'],
  ['SC제일','#fff','#0473ea','SC','scbmobile://','SC제일은행',0,'sc','1457418899','com.scbank.ma30'],
  ['케이뱅크','#0b1d8c','#fff','K','ukbanksmartbank://','케이뱅크',0,'kbank','1178872627','com.kbankwith.smartbank','ukbanksmartbankshortcut://'],
  ['새마을금고','#fff','#0062b1','MG','kfccsb://','MG더뱅킹',0,'mg','425089902','com.smg.spbs'],
  ['우체국','#e5322d','#fff','우체국','com.epost.psf.sd://','우체국뱅킹',0,'epost','554920991','com.epost.psf.sdsi'],
  ['신협','#fff','#0058a3','ON',null,'신협 ON뱅크',0,'cu','1484456647','kr.co.cu.onbank'],
  ['부산은행','#fff','#d6001c','BNK','bslink://call','BNK부산은행',0,'busan','1445137607','kr.co.busanbank.mbp'],
  ['iM뱅크','#00a29a','#fff','iM','mbanking://','iM뱅크',0,'im','1067748687','kr.co.dgb.dgbm'],
  ['경남은행','#fff','#d6001c','BNK','kakaoed1616004f7cc49ecf503b70e9221365://kakaolink','BNK경남은행',0,'kyongnam','678852685','com.knb.psb','alopex://psb'],
  ['수협은행','#fff','#0a5aa8','Sh','kakao4251fde6ccd98c9326127797ddd3aad0://kakaolink','수협 파트너뱅크',0,'suhyup','1229985989','com.suhyup.psmb','suhyuppsmb://suhyuplink'],
  ['광주은행','#fff','#2a50d8','Wa','kakao6ec8812a5d4d44c18cadd24f2dd65eca://kakaolink','광주은행',0,'kjbank','1576149106','com.kjbank.asb.pbanking','kjbank://asb'],
  ['전북은행','#0b3fd8','#fff','JB','jbprivatebank://','전북은행',0,'jbbank','1547903285','kr.co.jbbank.privatebank'],
  ['SBI저축은행','#fff','#0a7fd8','SBI','saidabank://deep_link_url','사이다뱅크',0,'sbi','','com.sbi.saidabank','sbi://sbi_url'],
  ['산업은행','#00468c','#fff','KDB','smartkdb://','KDB산업은행',0,'kdb','','co.kr.kdb.android.smartkdb','smartkdbnvs://'],
  ['제주은행','#fff','#0a4fe0','J','newjbanksmart://action','제주은행',0,'jeju','6443788309','com.jejubank.smartnew'],
  ['씨티은행','#0c5bb5','#fff','citi','citimobileapp://','씨티모바일',0,'citi','1179759666','kr.co.citibank.citimobile','citimobileapp://smartpay'],
];
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent), isAnd=/Android/.test(navigator.userAgent);
const store=a=>isIOS?(a[8]?'https://apps.apple.com/kr/app/id'+a[8]:null):'https://play.google.com/store/apps/details?id='+a[9];
// 안드로이드는 intent 주소로 연다 — 앱이 없으면 크롬이 스토어(fallback)로 넘긴다
const href=a=>{ if(!a[4]) return '#'; if(!isAnd) return a[4];
  const [sch,rest]=(a[10]||a[4]).split('://');
  return 'intent://'+rest+'#Intent;scheme='+sch+';package='+a[9]+';S.browser_fallback_url='+encodeURIComponent(store(a))+';end'; };
const TILES=APPS.map((a,i)=>
  `<a href="${href(a)}" data-i="${i}">${a[6]?'<span class="badge">계좌 자동입력</span>':''}<i style="background:${a[1]};color:${a[2]};${a[1]=='#fff'?'box-shadow:inset 0 0 0 1px #e3e5e9':''}"><img src="logos/${a[7]}.png" alt="" onload="this.parentNode.classList.add('logo')" onerror="this.remove()">${a[3]}</i>${a[0]}</a>`);
// 처음 두 줄(8개)만 보이고 나머지는 '더 보기' 로 편다 — 높이가 스르륵 펴진다
document.getElementById('apps').innerHTML=TILES.slice(0,8).join('');
document.getElementById('appsMore').innerHTML=TILES.slice(8).join('');
function toggleMore(){ const w=document.getElementById('moreWrap'), b=document.getElementById('moreBtn'); const on=w.classList.toggle('open'); b.classList.toggle('open',on); b.querySelector('span').textContent=on?'접기':'은행 '+(TILES.length-8)+'곳 더 보기'; }
toggleMore(); toggleMore();
document.querySelectorAll('.grid a').forEach(el=>el.addEventListener('click',e=>{
  const a=APPS[el.dataset.i];
  copyText(ACC_TXT); // iOS: 탭 직후 동기로 복사
  if(!a[4]){ e.preventDefault(); toast(a,a[5]+' 앱을 직접 열어\n받는 분 계좌에 붙여넣어 주세요'); return; }
  if(isAnd) return;
  // 아이폰: 저절로 스토어로 넘기지 않는다 — 신한처럼 '앱에서 열기' 확인창이 뜨는 앱은
  // 확인을 누르기 전에 넘어가 버린다(2026-10-30 HB). 안내만 띄우고, 누르면 스토어로.
  const t=setTimeout(()=>{ if(!document.hidden) toast(a, store(a)?a[5]+' 앱이 열리지 않았나요?\n앱이 없다면 아래에서 받아 주세요':a[5]+' 앱을 직접 열어\n받는 분 계좌에 붙여넣어 주세요', store(a)?['앱스토어에서 받기',()=>location.href=store(a)]:null); },1800);
  document.addEventListener('visibilitychange',()=>clearTimeout(t),{once:true});
}));
function copyText(s){
  try{ const ta=document.createElement('textarea'); ta.value=s; ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
    ta.setSelectionRange(0,s.length); document.execCommand('copy'); ta.remove(); }catch(e){}
  try{ navigator.clipboard&&navigator.clipboard.writeText(s); }catch(e){}
}
function copyAcc(){ copyText(ACC_TXT); toast(null,'은행 앱에서 받는 분 계좌에\n붙여넣어 주세요'); }
// 안내 상자: 무엇을 했나(제목) / 어떻게 하면 되나(본문) / 할 일(버튼). 바깥 · × 를 누르면 닫힌다.
const T=document.getElementById('toast'); let tt,tact;
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function toast(a,body,act){
  document.getElementById('tic').innerHTML=a?`<img src="logos/${a[7]}.png" alt="" onerror="this.outerHTML=CHECK">`:CHECK;
  document.getElementById('tt').textContent='계좌번호를 복사했어요';
  document.getElementById('td').textContent=body;
  tact=act; const b=document.getElementById('tbtn'); b.textContent=act?act[0]:'확인';
  T.classList.add('on'); clearTimeout(tt);
  if(!act) tt=setTimeout(closeT,Math.min(9000,Math.max(3000,body.length*200)));
}
function closeT(){ T.classList.remove('on'); }
T.onclick=e=>{ if(e.target===T||e.target.closest('.tx')) closeT(); };
document.getElementById('tbtn').onclick=()=>{ closeT(); if(tact) tact[1](); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeT(); });
</script>
</body>
</html>
